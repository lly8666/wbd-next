# RustCrypto aes=0.8.4 defaults to a software AES-HP on AArch64 unless
# aes_armv8 is enabled. It runtime-detects AES and falls back to fixsliced
# software on ARM Linux/Android; this does not force target-feature=+aes.
# AWS-LC AEAD uses its own independent feature dispatch.
[target.aarch64-unknown-linux-gnu]
rustflags = ["--cfg", "aes_armv8"]

[target.aarch64-unknown-linux-musl]
rustflags = ["--cfg", "aes_armv8"]

[target.aarch64-linux-android]
rustflags = ["--cfg", "aes_armv8"]
