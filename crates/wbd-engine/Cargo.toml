[package]
name = "wbd-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# NEVER enable on production builds: exposed raw C methods are only native
# test probes, not independent Go TLS credential or production FecOrigin proofs.
m0_v4_probe = []
# Explicit test-only original-owner FEC2 AEAD/PN adapter. Product Go bit2 OFF.
m0_fec2_owner_probe = ["wbd-codec/m0-fec2-record-probe"]
# Explicit developer-only opt-in non-test Go embedded Rust control adapter.
# Default production cdylib and public ABI remain disabled.
m0_v4_embedded_go = []
# Worker-frozen M1-012 direction SPSC; compile-time opt-in; default remains off.
# Main-managed rtrb=0.3.2 workspace pin; no production TLS ABI change.
m1_rtrb = []

[dependencies]
# M0-owned composition-only edges. Lower-layer workers must not depend on engine.
wbd-types = { path = "../wbd-types" }
wbd-codec = { path = "../wbd-codec" }
wbd-platform = { path = "../wbd-platform" }
wbd-recovery = { path = "../wbd-recovery" }
rtrb = { workspace = true }
