[package]
name = "wbd-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# NEVER enable on production builds: exposed raw C methods are only native
# test probes, not independent Go TLS credential or production FecOrigin proofs.
m0_v4_probe = []
# Explicit developer-only opt-in non-test Go embedded Rust control adapter.
# Default production cdylib and public ABI remain disabled.
m0_v4_embedded_go = []

[dependencies]
# M0-owned composition-only edges. Lower-layer workers must not depend on engine.
wbd-types = { path = "../wbd-types" }
wbd-codec = { path = "../wbd-codec" }
wbd-platform = { path = "../wbd-platform" }
wbd-recovery = { path = "../wbd-recovery" }
