[package]
name = "wbd-codec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Opt-in code-only FEC2 record probe; never part of default public ABI.
m0-fec2-record-probe = []
# Release-code FEC2 record primitives, opt-in ONLY after M0 original-Go TLS
# grant; not a feature grant, policy ACK, or default product enablement.
fec2-product-record = []
native-isal = ["dep:wbd-isal-safe", "wbd-isal-safe/native"]

[dependencies]
wbd-types = { path = "../wbd-types" }
aws-lc-rs = { workspace = true }
chacha20 = { workspace = true }
aes = { workspace = true }
wbd-isal-safe = { path = "../../native/isal-safe", optional = true, default-features = false }
