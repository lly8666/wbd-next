[workspace]
resolver = "2"
exclude = ["native/isal-safe"]
members = ["crates/wbd-types", "crates/wbd-platform", "crates/wbd-engine", "crates/wbd-codec", "crates/wbd-recovery"]

[workspace.package]
edition = "2021"
rust-version = "1.85.1"
license = "MIT"

[workspace.dependencies]
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["non-fips", "alloc"] }
chacha20 = { version = "=0.9.1" }
aes = { version = "=0.8.4" }
# M1-012 SPSC: bounded producer/consumer only; chunk API NOT approved.
rtrb = { version = "=0.3.2" }
