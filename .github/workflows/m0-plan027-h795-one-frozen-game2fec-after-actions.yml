name: M0 PLAN027 H795 one original Game2FEC6 real NPF after Actions qualified
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h795-one-frozen-game2fec-after-actions.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-one-frozen-game2fec-native:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h795-game2fec]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: "48ed7ffe82aafa17a125948068a2ca6ee6a1593e"
      SOURCE_BUILD_RUN: "41296364265"
      SCENE: "scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Reuse frozen signed original product and dispatch ONE actual Game2FEC6
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/41314897277" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg win "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '
              [.artifacts[]|select(.expired==false)|.name] as $n |
              ($n|index($win))!=null and ($n|index("m0-plan024-linux-product"))!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          # Current M0 WAL helpers and scoped tests are not the ORIGINAL
          # prebuilt binary's runtime sources. Reject any changed executable
          # Rust or original Go source instead of silently treating HEAD as
          # the frozen product hash.
          git diff --quiet "$PRODUCT_SOURCE" "$GITHUB_SHA" -- \
            crates r0/go_overlay/cmd r0/go_overlay/internal/faketcp \
            r0/go_overlay/internal/realityfront scenarios tools/prepare_windows_wiring.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.m0_wl_native_step_runner import native_batch_deadline
          p=Path("scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json")
          s=json.loads(p.read_text())
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10
          assert s["warmup_s"]==3 and s["drain_s"]==5 and s["tun_mtu"]==1400
          for direction in ("windows_to_linux","linux_to_windows"):
              d=s[direction]
              assert (d["offered_mbps"],d["delay_ms"],d["loss_pct"])==(1,25,0)
          assert native_batch_deadline({"WBD_WL_PUBLIC_MODES":"game2-fec","WBD_WL_V2_SCENARIO":str(p)})==250
          print("H795_BINARY_SOURCE_LOCKED_REUSE_48ED_AND_250S_BOUNDED_NATIVE_NOT_PRODUCT_PASS")
          PY
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$SCENE"
          existing="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id'|head -n 1)"
          if [ -n "$existing" ]; then
            echo "H795_SAME_CONTROLLER_ALREADY_DISPATCHED=$existing"
            exit 0
          fi
          # This dispatch uses the original GITHUB_TOKEN-backed Actions
          # independent 480s cancel path and the existing first-error,
          # real business and owned WAL evidence. Never call green dispatch
          # itself a GameFEC first-delivery or restored-network PASS.
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$SCENE" \
            -f perf_reuse_run_id="$SOURCE_BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo "H795_ONE_REAL_GAME2FEC_NPF_WINTUN_LINUX_DISPATCHED_NOT_PRODUCT_PASS source=$PRODUCT_SOURCE"
