name: M0 PLAN028 ARM64 native Normal Auto original Go Rust real network change
run-name: PLAN028 native ARM64 Normal Auto real source switch ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-arm64-fec-auto-path.yml"
      - "tools/m0-plan028-normal-fec-path-fixture.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-arm64-normal-fec-auto-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Pin original Go+Rust and assemble one complete ARM64 SOURCE
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test ! -e r0/go_overlay/internal/realityfront/v4_route_prelude.go
          mkdir -p fixed-build fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path.cwd(); donor=root/"legacy"
          rec=json.loads((root/"fixed-kernel-result/assembly.json").read_text(encoding="utf-8"))
          assert rec["overlay_source"]==os.environ["GITHUB_SHA"]
          assert rec["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in (
                      "admission_v4_test.go","v4_tls_handshake_contract_test.go"):
                      continue
                  dst=donor/part/src.name
                  if dst.exists():
                      assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              p=root/"r0/go_overlay/internal/faketcp"/name
              dst=donor/"internal/faketcp"/name
              assert not dst.exists(),str(dst)
              dst.write_bytes(p.read_bytes())
          for role in ("client","server"):
              dest=donor/("cmd/wbd-v4-"+role)
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"main.go").write_bytes((root/("r0/go_overlay/cmd/wbd-v4-"+role+"/main.go")).read_bytes())
          assert not (donor/"internal/realityfront/v4_route_prelude.go").exists()
          print("M0_PLAN028_ARM64_NATIVE_TLS_EXACT_SOURCE_ASSEMBLED source="+os.environ["GITHUB_SHA"],flush=True)
          PY
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-build.log 2>&1 || {
            tail -110 fixed-kernel-result/rust-build.log >&2
            exit 1
          }
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,struct
          root=pathlib.Path("fixed-build")
          assert platform.machine()=="aarch64"
          sha={}
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==183,name
              sha[name]=hashlib.sha256(b).hexdigest()
          m={"source_sha":os.environ["GITHUB_SHA"],"original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
             "architecture":"native_aarch64","go":"1.23.12","rust":"1.85.1",
             "sha256":sha,"qualification":"BUILD_ONLY_UNTIL_NORMAL_AUTO_NATIVE_REAL_IO"}
          (root/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print("M0_PLAN028_NATIVE_ARM64_ORIGINAL_GO_RUST_TLS_BUILD_UNIT_PASS",flush=True)
          PY
      - name: Native ARM64 Normal Auto real IPv4 source/MTU change 64+5 UDP
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          python3 tools/m0-plan028-normal-fec-path-fixture.py "$RUNNER_TEMP/plan028-arm-fec-native.sh"
          bash -n "$RUNNER_TEMP/plan028-arm-fec-native.sh"
          WBD_V4_PUBLIC_MODE=fec-auto WBD_V4_PUBLIC_AUTO_IP=1 WBD_V4_PUBLIC_PATH_SWITCH=1 WBD_V4_PUBLIC_WIRE_AUDIT=0 \
            bash "$RUNNER_TEMP/plan028-arm-fec-native.sh" fixed-build \
            >fixed-kernel-result/plan028-arm64-normal-fec-auto-path.log 2>&1 || {
              tail -n 160 fixed-kernel-result/plan028-arm64-normal-fec-auto-path.log >&2
              exit 1
            }
          for marker in \
            "M0_PLAN028_REAL_LINUX_RTN_NETLINK_A_TO_AB_TO_B_PASS" \
            "M0_PLAN028_REAL_NEW_PATH_MTU_READBACK_PASS physical=1280" \
            "M0_PLAN028_REAL_AUTO_LEASE_NATIVE_IP_BOUND_PASS" \
            "M0_PLAN028_REAL_CLIENT_PROTECTED_DEFAULT_SINGLE_TUN_READER_PASS" \
            "M0_PLAN027_AUTO_SHORT_BURST_DELIVERY_STOP_CONFIG_READBACK_QUALITY_UNQUALIFIED";do
            grep -Fq "$marker" fixed-kernel-result/plan028-arm64-normal-fec-auto-path.log
          done
          test "$(grep -c 'M0_PLAN028_REAL_PATH_SWITCH_UDP_ECHO_OK' fixed-kernel-result/plan028-arm64-normal-fec-auto-path.log)" -eq 5
          grep -Fq 'M0_PLAN027_FEC_NATIVE_CONFIG_READBACK role=client mode=auto applied=1' fixed-kernel-result/plan028-arm64-normal-fec-auto-path.log
          python3 - <<'PY'
          import json, pathlib, os, hashlib, struct
          m=json.loads(pathlib.Path("fixed-build/manifest.json").read_text(encoding="utf-8"))
          assert m["source_sha"]==os.environ["GITHUB_SHA"] and m["architecture"]=="native_aarch64"
          for binary in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              raw=(pathlib.Path("fixed-build")/binary).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==m["sha256"][binary]
              assert raw[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",raw,18)[0]==183
          r=json.loads(pathlib.Path("fixed-kernel-result/plan028-effective-new-physical-route.json").read_text())
          mtu=json.loads(pathlib.Path("fixed-kernel-result/plan028-new-tun-mtu.json").read_text())
          assert len(r)==len(mtu)==1
          assert r[0]["prefsrc"]=="10.25.0.3" and r[0]["dev"]=="wbdvc0"
          assert mtu[0]["ifname"]=="wbdvc4" and 900<=mtu[0]["mtu"]<1280
          print("M0_PLAN028_NATIVE_ARM64_AUTO_FULL_OS_MTU_AND_SOURCE4_READBACK_PASS")
          PY
          echo "M0_PLAN028_NATIVE_ARM64_NORMAL_AUTO_SOURCE_LOCKED_ORIGINAL_TLS_RUST_64_PLUS_5_UDP_PASS source=$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-native-arm64-normal-auto-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-build/wbd-v4-client
            fixed-build/wbd-v4-server
            fixed-build/libwbd_engine.so
            fixed-kernel-result/assembly.json
            fixed-kernel-result/plan028-arm64-normal-fec-auto-path.log
            fixed-kernel-result/plan028-auto-client-diagnostic.log
            fixed-kernel-result/plan028-auto-server-diagnostic.log
            fixed-kernel-result/plan028-real-path-switched-business.log
            fixed-kernel-result/plan028-new-tun-mtu.json
            fixed-kernel-result/plan028-effective-new-physical-route.json
          if-no-files-found: warn
          retention-days: 14
