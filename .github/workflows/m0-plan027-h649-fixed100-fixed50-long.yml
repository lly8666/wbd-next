name: M0 PLAN027 H649 Fixed100 current capacity and Fixed50 300s true native
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h649-fixed100-fixed50-long.yml]
permissions: {contents: read, actions: write}
jobs:
  exact-two:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h649-fixed-cap-long]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 11f1881ff68afa22c5b0ca957d6808420a878a06
      BUILD_RUN: "41210457594"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate original same binary and dispatch one fixed scene per Action
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          names=(("plan027-c-fixed-100m-25ms-loss0-60s.json",100,60),
                 ("plan027-c-fixed-50m-25ms-loss0-300s.json",50,300))
          for name,rate,duration in names:
              s=read_scenario("scenarios/"+name)
              assert s["public_mode"]=="fixed" and s["duration_s"]==duration and s["seed"]==20261030
              for d in ("windows_to_linux","linux_to_windows"):
                  r=s[d];assert r["delay_ms"]==25 and r["loss_pct"]==0 and r["offered_mbps"]==rate
              print("H649_ORIGINAL_FIXED_SOURCE_SCENE",name,s["scenario_sha256"])
          PY
          while read -r file;do
            scene="scenarios/$file"
            title="M0-WIN-LINUX|$GITHUB_SHA|fixed|$scene"
            prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" | jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -1)"
            if [ -n "$prior" ];then echo "H649_ALREADY_DISPATCHED scene=$scene run=$prior";continue;fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode=fixed -f run_n0=false -f perf_scenario_file="$scene" \
              -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
            echo "H649_NATIVE_FIXED_INDEPENDENT_DISPATCHED scene=$scene original_source=$PRODUCT_SOURCE proof=NOT_VERIFIED"
          done <<'CASES'
          plan027-c-fixed-100m-25ms-loss0-60s.json
          plan027-c-fixed-50m-25ms-loss0-300s.json
          CASES
          echo H649_FIXED100_AND_FIXED50_300S_SEPARATE_ACTIONS_ONLY
