name: LAN PN-repeat XOR arm64 mutual TLS13 real TCP pcap
on:
  push:
    branches: [experiment/lan-xor-pn-mask]
    paths: [".github/workflows/lan-xor-pn-capture-arm64.yml"]
permissions: {contents: read}
concurrency:
  group: lan-xor-pn-pcap-arm64
  cancel-in-progress: false
jobs:
  native-pcap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Native compile of mutually authenticated TLS13 then PN/XOR switch
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          mkdir -p lan-pn-pcap-report
          go build -trimpath -o /tmp/pn_tls13 tools/lan_xor_tls13_pn_handoff.go
          sha256sum /tmp/pn_tls13 > lan-pn-pcap-report/binary.sha256
          {
            echo "SOURCE=$GITHUB_SHA"
            echo "RUN=$GITHUB_RUN_ID"
            echo "ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "GO=$(go version)"
            echo "ARCH=$(uname -m)"
            echo "SCOPE=mutual_TLS13_fixture_then_INSECURE_raw_XOR_not_real_WBD_TUN"
          } > lan-pn-pcap-report/manifest.env
      - name: Bounded independent actual Linux TCP capture and equality audit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tcpdump
          tmp="$(mktemp -d)"
          cap_pid=""
          cleanup() {
            if test -n "$cap_pid"; then
              sudo kill -INT "$cap_pid" 2>/dev/null || true
              wait "$cap_pid" 2>/dev/null || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          port=38612
          sudo timeout --signal=INT --kill-after=2s 25s tcpdump \
            -i lo -s 2000 -c 128 -w "$tmp/wire.pcap" \
            "tcp and dst port $port" >/dev/null 2>&1 &
          cap_pid=$!
          sleep 2
          /tmp/pn_tls13 "$port" | tee lan-pn-pcap-report/roundtrip.json
          sleep 1
          sudo kill -INT "$cap_pid" 2>/dev/null || true
          wait "$cap_pid" || true
          cap_pid=""
          test -s "$tmp/wire.pcap"
          test "$(stat -c %s "$tmp/wire.pcap")" -le 4194304
          python3 tools/lan_xor_tls13_pn_pcap.py --pcap "$tmp/wire.pcap" \
            --port "$port" --output lan-pn-pcap-report/capture_summary.json
          echo "Raw pcap owned/temp and deleted on exit" >> lan-pn-pcap-report/manifest.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lan-pn-arm64-tls13-pcap
          path: lan-pn-pcap-report/
          retention-days: 30
          if-no-files-found: warn
