name: M0 PLAN027 H591 one new original sameVM A5 after Windows batch credit
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h591-go-batch-a5.yml]
permissions: {contents: read, actions: write}
jobs:
  one:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h591-go-batch-a5]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One new SOURCE real signed Windows Linux same-VM RustB then GoA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-c-normal-10m-25ms-loss0-60s.json')
          assert s['public_mode']=='normal' and s['duration_s']==60
          for d in ('windows_to_linux','linux_to_windows'):
              assert s[d]['offered_mbps']==10 and s[d]['delay_ms']==25 and s[d]['loss_pct']==0
          print('H591_NEW_SOURCE_SAME_VM_A5_SCENE',s['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main -f public_mode=normal -f run_n0=false -f perf_ab=true -f perf_scenario_file=scenarios/plan027-c-normal-10m-25ms-loss0-60s.json -f perf_reuse_run_id="" -f perf_binary_source_sha=""
          echo "H591_ONE_ORIGINAL_ACTION_NEW_SOURCE=$GITHUB_SHA"
