name: M0 PLAN027 H654 Windows Game bounded owned Stop Rust source-native tests
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h654-native-game-stop-bounded-compile.yml]
permissions: {contents: read}
jobs:
  windows-native-rust-owner:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: New source actual Windows Rust owner compile and bounded Stop regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'pinned Rust toolchain unavailable'}
          & cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,fec2_product_record --lib game_native_stop_wait_preserves_unfinished_workers_and_allows_later_true_join -- --nocapture --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'current source genuine Windows Rust Game Stop test/compile FAIL'}
          Write-Output 'H654_SOURCE_CURRENT_WINDOWS_GAME_STOP_BOUNDED_RUST_TEST_PASS_ONLY_NOT_KERNEL'
      - name: Native Game owner release link and unchanged feature ABI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_embedded_go,fec2_product_record
          if($LASTEXITCODE -ne 0){throw 'Windows native Rust Game product release compilation failed'}
          Write-Output 'H654_WINDOWS_RUST_GAME_RELEASE_COMPILE_ONLY_NOT_SIGNED_DRIVER_PASS'
