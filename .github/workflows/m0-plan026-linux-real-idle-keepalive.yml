name: M0 PLAN026 Linux real protected idle 100s Keepalive reuse
run-name: "M0|PLAN026-LINUX-HEALTH-IDLE100|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan026-linux-real-idle-keepalive.yml"
      - "tools/m0_plan026_linux_real_idle_keepalive.py"
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  actual-original-tls-native-keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      # The real original Go/Rust binary SOURCE7e984 is the same frozen binary
      # that already PASSED genuine Linux Auto. Harness source is separate.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 40851521157
          name: m0-plan012-combined-40851521157-1
          github-token: ${{ github.token }}
          path: frozen/
      - name: Verify original TLS Rust product binary SHA and original netns fixture source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-idle-health-result fixed-kernel-result
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('frozen')
          m=json.loads((root/'fixed-kernel-result/manifest.json').read_text())
          assert m['source_sha']=='7e9842f6e99769d9919e75a4b15da8d6d88e7257'
          assert m['original_go_sha']=='a7a82db31fe736ffedee330795a3234d358f1984'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for name,h in m['binaries_sha256'].items():
              p=root/'fixed-build'/name
              assert p.is_file() and sha(p)==h,(name,p)
          old='tools/m0-v4-public-real-linux-netns.sh'
          assert sha(pathlib.Path(old))==m['source_inputs_sha256'][old]
          print('M0_PLAN026_LINUX_IDLE_HEALTH_ORIGINAL_PRODUCT_BINARY_AND_FIXTURE_SOURCE_LOCKED_PASS')
          PY
          python3 tools/m0_plan026_linux_real_idle_keepalive.py \
            tools/m0-v4-public-real-linux-netns.sh linux-idle-health-result/health100-netns.sh
          chmod +x frozen/fixed-build/wbd-v4-client frozen/fixed-build/wbd-v4-server
      - name: True original TLS Rust Auto 100-second zero-business idle then real kernel UDP echo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          WBD_V4_PUBLIC_MODE=fec-auto \
            bash linux-idle-health-result/health100-netns.sh frozen/fixed-build \
            >linux-idle-health-result/real-100s.log 2>&1 || {
              tail -90 linux-idle-health-result/real-100s.log >&2
              echo 'M0_PLAN026_LINUX_REAL_HEALTH_IDLE100_ORIGINAL_KERNEL_FAIL' >&2
              exit 1
            }
          grep -Fq 'M0_PLAN026_LINUX_REAL_TLS_RUST_HEALTH_IDLE_100S_KERNEL_APP_RESUME_PASS' \
             fixed-kernel-result/public-v4-normal-business.log
          grep -Fq 'M0_PUBLIC_ORIGINAL_GO_V4_FEC2_APPLIED_REAL_AUTH_M2_GROUP_M4_TUN_STOP_PASS mode=fec-auto' \
             linux-idle-health-result/real-100s.log
          grep -Fq 'M0_PUBLIC_ORIGINAL_GO_V4_FEC2_REAL_GROUP_APP_FIRST_DELIVERY_PASS mode=fec-auto delivered=64' \
             fixed-kernel-result/public-v4-normal-business.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('linux-idle-health-result')
          logfile=root/'real-100s.log'
          original=pathlib.Path('fixed-kernel-result/public-v4-normal-business.log')
          record={
            'schema_version':1,
            'product_source_sha':'7e9842f6e99769d9919e75a4b15da8d6d88e7257',
            'harness_source_sha':os.environ['GITHUB_SHA'],
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'real_original_go_tls':True,
            'real_native_rust_m3_m4_udp':True,
            'client_and_server_single_generation':True,
            'no_business_seconds':100,
            'native_default_keepalive_seconds':15,
            'native_default_authenticated_dead_seconds':90,
            'first_app':64,
            'extra_real_app_after_idle':1,
            'real_m2_applied':True,
            'real_owned_stop':True,
            'idle_auth_health_control_independently_counted':'NOT_INSTRUMENTED',
            'no_business_over_dead_then_real_app':'PASS_SCOPED',
            'physical':'NOT_RUN','windows':'NOT_RUN',
            'original_app_sha256':hashlib.sha256(original.read_bytes()).hexdigest(),
            'real_trial_log_sha256':hashlib.sha256(logfile.read_bytes()).hexdigest(),
          }
          (root/'result.json').write_text(json.dumps(record,indent=2)+'\n')
          print('M0_PLAN026_LINUX_ORIGINAL_TLS_RUST_100S_KEEPALIVE_REAL_KERNEL_APP_PASS source=7e9842f6')
          PY
          cp fixed-kernel-result/public-v4-normal-business.log linux-idle-health-result/real-100s-app.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan026-linux-real-health-idle100-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            linux-idle-health-result/result.json
            linux-idle-health-result/real-100s-app.log
            linux-idle-health-result/real-100s.log
          if-no-files-found: warn
          retention-days: 30
