name: M0 RouterOS real BBR feasibility
run-name: "M0 RouterOS BBR | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-routeros-server']
    paths:
      - 'tools/routeros-bbr/**'
      - '.github/workflows/qa-m0-routeros-bbr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Build pinned full TCP BBRv3 reference endpoint
        run: |
          set -euo pipefail
          mkdir -p bbr-reference
          git init "$RUNNER_TEMP/gvisor"
          git -C "$RUNNER_TEMP/gvisor" fetch --depth=1 https://github.com/adios-404/gvisor.git 9b14a44348f259003600d98cdb4dbd57a8302ca7
          git -C "$RUNNER_TEMP/gvisor" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/gvisor" rev-parse HEAD)" = 9b14a44348f259003600d98cdb4dbd57a8302ca7
          mkdir -p "$RUNNER_TEMP/gvisor/wbd-bbr-lab"
          cp tools/routeros-bbr/main.go "$RUNNER_TEMP/gvisor/wbd-bbr-lab/"
          cp tools/routeros-bbr/BUILD.reference "$RUNNER_TEMP/gvisor/wbd-bbr-lab/BUILD"
          dest="$PWD/bbr-reference"
          cd "$RUNNER_TEMP/gvisor"
          make copy TARGETS=//wbd-bbr-lab:wbd-bbr-lab DESTINATION="$dest"
          test -x "$dest/wbd-bbr-lab"
          sha256sum "$dest/wbd-bbr-lab"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bbr-reference-${{ github.sha }}
          path: bbr-reference/
          if-no-files-found: error
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: {BBR_SCENE: kernel}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.4.4'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils iproute2 gcc
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
          bun install -g @tikoci/quickchr@0.7.0
          echo "$HOME/.bun/bin" >>"$GITHUB_PATH"
      - run: bash tools/routeros-bbr/chr.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: bbr-kernel, path: bbr-evidence/}
  chr:
    needs: reference
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scene: [bbr-clean, bbr-loss, cubic-loss]
    env: {BBR_SCENE: '${{ matrix.scene }}'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bbr-reference-${{ github.sha }}
          path: bbr-reference
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.4.4'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils iproute2 gcc
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
          bun install -g @tikoci/quickchr@0.7.0
          echo "$HOME/.bun/bin" >>"$GITHUB_PATH"
          chmod +x bbr-reference/wbd-bbr-lab
      - run: bash tools/routeros-bbr/chr.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bbr-${{ matrix.scene }}
          path: bbr-evidence/
