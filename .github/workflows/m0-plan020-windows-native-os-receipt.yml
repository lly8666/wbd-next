name: M0 PLAN020 Windows live OS WAL receipts and WinForms authority
run-name: "M0|PLAN020-WIN-WAL|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan020-windows-native-os-receipt.yml"
      - "r0/go_overlay/internal/windowsclient/native_unified_live_os_receipt_windows.go"
      - "r0/go_overlay/internal/windowsclient/native_unified_live_os_receipt_windows_test.go"
      - "r0/go_overlay/internal/windowsclient/native_product_activation_windows.go"
      - ".github/workflows/m0-plan012-combined-functional.yml" # PLAN022 one identical SOURCE cross-OS functional batch
      - "r0/go_overlay/cmd/wbd-client/m0_native_v4_windows.go"
      - "r0/go_overlay/cmd/wbd-client/m0_windows_v4_mode_selection.go"
      - "r0/go_overlay/cmd/wbd-client/m0_windows_v4_mode_selection_test.go"
      - "r0/go_overlay/cmd/wbd-client/m0_native_v4_peer_windows.go"
      - "r0/go_overlay/cmd/wbd-client/m0_native_v4_rx_window_windows.go"
      - "r0/go_overlay/cmd/wbd-client/m0_native_v4_rx_window_windows_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_wintun_lease.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_scoped_client.go"
      - "crates/wbd-engine/src/v4_windows_owner.rs"
      - "r0/go_overlay/cmd/wbd-client/m0_windows_v4_native_capabilities_windows.go"
      - "r0/go_overlay/cmd/wbd-client/m0_windows_v4_native_capabilities_windows_test.go"
      - "crates/wbd-engine/src/v4_windows_owner.rs"
      - "crates/wbd-engine/src/v4_windows_game_owner.rs"
      - "crates/wbd-engine/src/v4_windows_fec2_owner.rs"
      - "crates/wbd-engine/src/v4_owner_crypto.rs"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_game_group.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_fec2_owner.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_game_server_group.go"
      - "r0/go_overlay/internal/windowsownerlease/original_go_tls_game_windows_test.go"
      - "r0/go_overlay/internal/windowsownerlease/original_go_tls_fec2_windows_test.go"
      - "tools/m0_plan020_native_live_windows_ci.ps1"
      - "r0/go_overlay/internal/windowsclient/native_qualified_guard_intent_recovery_windows.go"
      - "r0/go_overlay/internal/windowsclient/native_wfp_m0_qualified_arm_windows_test.go"
      - "r0/go_overlay/internal/windowsclient/native_product_activation_windows_test.go"
      - "r0/go_overlay/windows/gui/M0Plan020GUIAuthorityHarness.cs"
      - "r0/go_overlay/assembly/manifest-plan020-m0.json"
      - "r0/go_overlay/internal/windowsclient/native_real_product_service_windows.go"
      - "r0/go_overlay/internal/windowsownerlease/original_tls_native_product_windows.go"
      - "docs/devlog/M0/PLAN020-S598-exact-parallel-Windows-action-trigger-20261021.md"
      - "docs/devlog/M0/PLAN020-S615-true-TLS-Rust-M3-native-kernel-parallel-Actions-trigger-20261021.md"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-go-native-wal:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      # Same verified aws-lc-sys 0.45 Windows MSVC strategy as original Rust native ABI CI.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Assemble exact original Go plus source-locked M0 Windows WAL and WinForms
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path result | Out-Null
          @'
          import pathlib,json,subprocess,os,hashlib
          root=pathlib.Path.cwd()
          main=os.environ["GITHUB_SHA"]
          original="a7a82db31fe736ffedee330795a3234d358f1984"
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==main
          assert subprocess.check_output(["git","-C","legacy","rev-parse","HEAD"],text=True).strip()==original
          spec=json.loads((root/"r0/go_overlay/assembly/manifest-plan020-m0.json").read_text(encoding="utf8"))
          assert spec["legacy_source"]==original
          def gitblob(data):return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          for op in spec["operations"]:
              if op["kind"]=="replace":
                  content=subprocess.check_output(["git","-C","legacy","show",original+":"+op["path"]])
                  assert gitblob(content)==op["original_blob"],op["path"]
                  destination=root/"legacy"/op["path"]
                  assert destination.is_file()
                  destination.write_bytes(content)
              if op.get("overlay_path"):
                  content=subprocess.check_output(["git","show",main+":"+op["overlay_path"]])
                  assert gitblob(content)==op["result_blob"],op["overlay_path"]
                  destination=root/op["overlay_path"]
                  assert destination.is_file()
                  destination.write_bytes(content)
          print("M0_PLAN020_WIN_WAL_ORIGINAL_GO_PINNED")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'exact original / M0 Git bytes mismatch'}
          & python r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt result/assembly.json
          if ($LASTEXITCODE -ne 0) {throw 'exact original Windows assembly FAIL'}
      - name: Compile linked ORIGINAL credential Go Rust + signed Wintun five-stage OS WAL production packages
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,pathlib,subprocess,hashlib
          root=pathlib.Path.cwd()
          sha=os.environ["GITHUB_SHA"]
          # The frozen M4/Go assembly is already exact SOURCE verified.
          # Copy ONLY the extra original Go credential-TLS Rust bridge
          # necessary for the new M0 host-WFP WAL production package;
          # no mock adapters, no original bytes overwritten.
          for part,names in (
            ("realityfront",(
              "admission_v4.go",
              "bridge_v4_windows_private_owner.go",
              "bridge_v4_windows_game_group.go",
              "bridge_v4_windows_game_server_group.go",
              "bridge_v4_windows_fec2_owner.go",
              "bridge_v4_windows_wintun_lease.go",
              "bridge_v4_windows_scoped_client.go",
            )),
            ("windowsownerlease",(
              "created_wintun_windows.go",
              "scoped_original_tls_native_wintun_windows.go",
            )),
          ):
              dest=root/"legacy"/"internal"/part
              dest.mkdir(parents=True,exist_ok=True)
              for name in names:
                  relative="r0/go_overlay/internal/"+part+"/"+name
                  target=dest/name
                  assert not target.exists(), "frozen Go/M4 has an existing competing owner: "+relative
                  raw=subprocess.check_output(["git","show",sha+":"+relative])
                  assert len(raw)>60
                  if name=="admission_v4.go":
                      assert b"package realityfront" in raw
                  else:
                      assert raw.startswith(b"//go:build windows"),relative
                  target.write_bytes(raw)
          # The actual M0 product service and native kernel ring are
          # supplied by the SAME manifest-plan020-m0.json assembly, not
          # copied from another source/branch.
          assert (root/"legacy/internal/windowsownerlease/original_tls_native_product_windows.go").is_file()
          assert (root/"legacy/internal/windowsclient/native_real_product_service_windows.go").is_file()
          assert (root/"legacy/internal/windowsclient/native_udp_kernel_driver_windows.go").is_file()
          print("M0_PLAN020_ORIGINAL_TLS_RUST_TO_NATIVE_HOST_WAL_BUNDLE_EXACT_SAME_SOURCE")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'full native Go/V4 Rust source-locked assembly FAIL'}
          Push-Location legacy
          try {
            & go build -tags wbd_v4_embedded_go ./internal/windowsownerlease
            if ($LASTEXITCODE -ne 0) {throw 'actual Go TLS Rust Wintun to 5-stage WAL owner integration package build FAIL'}
            & go test -count=1 -v -tags wbd_v4_embedded_go -run 'TestM0PLAN023Windows|TestM0PLAN025Windows|TestM0PLAN026Windows' ./cmd/wbd-client
            if ($LASTEXITCODE -ne 0) {throw 'PLAN023 native five-mode selector test failed'}
            & go build -trimpath -tags wbd_v4_embedded_go -o ../result/wbd-client-embedded.exe ./cmd/wbd-client
            if ($LASTEXITCODE -ne 0) {throw 'actual original-Go native CLI fails to link Rust and Windows WAL packages'}
          } finally {Pop-Location}
          Write-Output 'M0_PLAN020_ORIGINAL_TLS_RUST_SIGNED_WINTUN_NATIVE_OS_PRODUCT_SERVICE_LINKED_GO_BUILD_PASS'
      - name: Assert source-locked public Windows V4 trial admission preserves real owner and OS receipt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib,sys
          src=pathlib.Path("legacy/cmd/wbd-client/m0_native_v4_windows.go").read_text()
          for anchor in (
            "runM0NativeV4Windows(o m0NativeV4Options)",
            "realityfront.V4WindowsEstablishOriginalClientOwner(",
            "windowsownerlease.PrepareOriginalTLSNativeProduct(",
            "receipt,e:=product.Apply(ctx)",
            "if !receipt.AllNativeOSApplied",
            "observed,e:=product.LiveReceipt(ctx)",
            "if e!=nil||!observed.AllNativeOSApplied",
            "stopErr:=cleanup()",
            "WBD_WINDOWS_NATIVE_DISCONNECTED_V1",
          ):
              if anchor not in src: raise AssertionError("native owner/readback/Stop removed: "+anchor)
          if "windowsclient.N4NativeNetworkReady(ctx)" in src:
              # A frozen, universally-denying old product preflight cannot
              # be on the opt-in V4 trial execution path.
              if "if e=windowsclient.N4NativeNetworkReady(ctx)" in src:
                  raise AssertionError("unconditional old Windows product gate still active")
          # PLAN022: assert that Windows public V4 is actually restricted to
          # one authenticated Normal/off lane until a native Windows
          # FEC2/Game owner has been wired and positively tested.
          # Do not turn CLI parser acceptance into a fake runtime success.
          assert 'realityfront.FixedPolicyForClient(1,0)' in src
          assert 'DesiredLanes:1' in src
          assert 'product.Apply(ctx)' in src
          print("M0_PLAN022_WINDOWS_V4_OFF_WIRED_FEC2_GAME_NOT_YET_WIRED_HONEST")
          controller=pathlib.Path("legacy/internal/windowsclient/native_product_activation_windows.go").read_text()
          for anchor in ("c.txn.Apply(ctx)","c.txn.VerifyLiveOSApplied(ctx)",
                         "c.proof.VerifyBidirectionalAuthenticatedFirstDelivery(ctx,id)",
                         "c.proof.DrainCryptoAndKernelLoans(ctx,id)",
                         "c.txn.n4RecoverQualifiedGuardOnlyIntent(ctx)",
                         "c.txn.VerifyLiveOSDisconnected(ctx)"):
              if anchor not in controller: raise AssertionError("native product authority missing: "+anchor)
          print("M0_PLAN021_WINDOWS_V4_TRIAL_ADMISSION_OWNER_WAL_CAS_LIVE_RECEIPT_SAME_SOURCE_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'public native V4 trial owner-readback source contract FAIL'}
      - name: Native Windows five-stage WAL readback and false Applied negatives
        shell: pwsh
        env:
          WBD_N4_WFP_ISOLATED_LAB: '1' # native TEST-NET:203.0.113.254:65530 only; never host-global WFP
        run: |
          $ErrorActionPreference='Stop'
          Push-Location legacy
          try {
            & go test -count=1 -v -run '^(TestM0PLAN020LiveFiveStageOSAppliedAndDisconnectedReadbacks|TestM0PLAN020NativeProductOSOwnerPacketConnectAndStop|TestM0PLAN020DisconnectedRequiresRealAbsentStageReadback|TestM0PLAN020RealScopedWFPArmAndForeignCAS|TestM0PLAN020GuardOnlyInterruptedArmPartialWALRecovery)$' ./internal/windowsclient 2>&1 | Tee-Object -FilePath ../result/native-wal.log
            if ($LASTEXITCODE -ne 0) {throw 'native Go five-stage WAL test FAIL'}
          } finally {Pop-Location}
          foreach ($named in @('TestM0PLAN020LiveFiveStageOSAppliedAndDisconnectedReadbacks','TestM0PLAN020NativeProductOSOwnerPacketConnectAndStop','TestM0PLAN020DisconnectedRequiresRealAbsentStageReadback','TestM0PLAN020RealScopedWFPArmAndForeignCAS','TestM0PLAN020GuardOnlyInterruptedArmPartialWALRecovery')) {
            if (!(Select-String -Path result/native-wal.log -SimpleMatch ('--- PASS: '+$named) -Quiet)) {
              throw ('native owner/kernel/native WAL contract test NOT_RUN: '+$named)
            }
          }
      - name: Build source-locked native Windows Rust DLL for V4 portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) {throw 'pinned native Rust 1.85.1 unavailable'}
          rustup target add x86_64-pc-windows-msvc --toolchain 1.85.1
          if ($LASTEXITCODE -ne 0) {throw 'pinned Rust MSVC target unavailable'}
          # PLAN024: real Windows M1 Game2/4 authenticated native group AEAD
          # and independent later-lane delivery; NOT an OS Applied proof.
          & cargo +1.85.1 test --locked -p wbd-engine --lib --features m0_v4_embedded_go,fec2_product_record m0_windows_native_game_two_four_original_owner_aead_no_hol_and_stop -- --nocapture
          if ($LASTEXITCODE -ne 0) {throw 'PLAN024 Windows native Game2/Game4 AEAD/PN/Stop positive test FAIL'}
          Write-Output 'M0_PLAN024_WINDOWS_NATIVE_RUST_GAME2_GAME4_GROUP_AEAD_REPLAY_STALLED_LANE_STOP_PASS_SCOPED_NO_KERNEL'
          & cargo +1.85.1 test --locked -p wbd-engine --lib --features m0_v4_embedded_go,fec2_product_record m0_windows_native_fec2_original_owner_aead_first_delivery_rs16_and_stop -- --nocapture
          if ($LASTEXITCODE -ne 0) {throw 'PLAN024 Windows native FEC2 M3 AES/PN/RS16/Stop real crypto test FAIL'}
          Write-Output 'M0_PLAN024_WINDOWS_NATIVE_RUST_FEC2_SOURCE_REPAIR_AEAD_RS16_RECOVERY_STOP_PASS_SCOPED_NO_KERNEL'
          & cargo +1.85.1 test --locked -p wbd-engine --lib --features m0_v4_embedded_go,fec2_product_record m0_windows_shared_rs16_original_owner_encode_repair_recovers_missing_source -- --nocapture
          if ($LASTEXITCODE -ne 0) {throw 'Windows source-scoped shared Rust RS16 parity writer/recovery test FAIL'}
          Write-Output 'M0_PLAN026_WINDOWS_ORIGINAL_TLS_RUST_SHARED_RS16_ENCODE_M3_RECOVER_REPLAY_STOP_PASS_SCOPED'
          # SAME original M1/M3 AEAD+PN V5 kind1 ingress; no M2 budget PASS.
          & cargo +1.85.1 test --locked -p wbd-engine --lib --features m0_v4_embedded_go,fec2_product_record m0_windows_original_m3_kind1_aead_unique_pn_stages_only_once_then_stop -- --nocapture
          if ($LASTEXITCODE -ne 0) {throw 'M0 original Windows M3 kind1 auth / replay / Stop test FAIL'}
          Write-Output 'M0_PLAN024_WINDOWS_M3_AUTHENTIC_KIND1_TYPED_STAGE_PASS_SCOPED_NO_M2_SHADOW'
          & cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_embedded_go,fec2_product_record
          if ($LASTEXITCODE -ne 0) {throw 'native original Rust M1/M3 V4 release DLL build FAIL'}
          @'
          import ctypes,hashlib,pathlib
          p=pathlib.Path("target/release/wbd_engine.dll")
          assert p.is_file() and p.stat().st_size>100000,"actual Rust DLL missing"
          dll=ctypes.WinDLL(str(p.resolve()))
          for name in ("wbd_m0_win_owner_v1_query","wbd_m0_win_owner_v1_prepare",
                      "wbd_m0_win_owner_v1_commit","wbd_m0_win_owner_v1_stop",
                      "wbd_m0_win_owner_v3_seal_normal_off","wbd_m0_win_owner_v3_open_normal_off",
                      "wbd_m0_win_owner_v5_open_data_or_kind1",
                      "wbd_m0_win_owner_v6_arm_original_m2",
                      "wbd_m0_win_owner_v6_report_npcap_firstsend",
                      "wbd_m0_win_owner_v4_game_join","wbd_m0_win_owner_v4_game_stage",
                      "wbd_m0_win_owner_v4_game_receive","wbd_m0_win_owner_v4_game_stop",
                      "wbd_m0_win_owner_v4_fec2_seal","wbd_m0_win_owner_v4_fec2_open",
                       "wbd_m0_win_owner_v4_fec2_encode_repair"):
              assert getattr(dll,name,None) is not None,"native Rust ABI missing "+name
          class V4Modes(ctypes.Structure):
              _fields_=[("version",ctypes.c_uint32),("size",ctypes.c_uint32),
                        ("supported_modes",ctypes.c_uint32),
                        ("authenticated_lanes",ctypes.c_uint32),
                        ("reserved",ctypes.c_uint32)]
          caps=V4Modes()
          read=dll.wbd_m0_win_owner_v4_mode_capabilities
          read.argtypes=[ctypes.POINTER(V4Modes),ctypes.c_uint32]
          read.restype=ctypes.c_int32
          assert read(ctypes.byref(caps),ctypes.sizeof(caps))==0
          assert (caps.version,caps.size,caps.supported_modes,
                  caps.authenticated_lanes,caps.reserved)==(
                  4,ctypes.sizeof(caps),1,1,0)
          print("M0_PLAN023_REAL_WINDOWS_NATIVE_RUST_MODE_ABI_PASS Normal=1 Fixed=NOT_WIRED Auto=NOT_WIRED Game2=NOT_WIRED Game4=NOT_WIRED")
          print("M0_PLAN020_REAL_NATIVE_V4_RUST_M3_DLL_EXPORTS_PASS sha256="+hashlib.sha256(p.read_bytes()).hexdigest())
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'native Rust original TLS M3 C-ABI export check FAIL'}
      - name: Verify OFFICIAL signed Wintun 0.14.1 for portable V4 native kernel
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path result/wintun-release | Out-Null
          $archive='result/wintun-release/wintun-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          $expected='07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $actual=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {throw "official Wintun native ZIP SHA256 mismatch: $actual"}
          Expand-Archive -LiteralPath $archive -DestinationPath result/wintun-release/extracted -Force
          $dll='result/wintun-release/extracted/wintun/bin/amd64/wintun.dll'
          if (!(Test-Path -LiteralPath $dll -PathType Leaf)) {throw 'signed amd64 Wintun DLL absent'}
          $signature=Get-AuthenticodeSignature -FilePath $dll
          if ($signature.Status -ne 'Valid') {throw "official Wintun signature not valid: $($signature.Status)"}
          Copy-Item -LiteralPath $dll -Destination result/wintun-release/wintun.dll
          Write-Output 'M0_PLAN020_OFFICIAL_SIGNED_NATIVE_WINTUN_0141_DLL_PASS'
      - name: Real SOURCE Windows original credential TLS Rust M3 Wintun and native WAL admin recovery
        shell: pwsh
        timeout-minutes: 15
        run: |
          & ./tools/m0_plan020_native_live_windows_ci.ps1
          if ($LASTEXITCODE -ne 0) {throw 'REAL native TLS Rust signed Wintun or OS WAL Apply Recover crash acceptance FAILED'}
      - name: Compile original WinForms executable and real original Go Windows CLI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location legacy
          try {
            & go build -o ../result/wbd-client.exe ./cmd/wbd-client
            if ($LASTEXITCODE -ne 0) { throw 'original native Go CLI compile FAILED' }
          } finally {Pop-Location}
          & ./legacy/scripts/build_windows_gui.ps1 -OutputDirectory result/portable -SourceSHA $env:GITHUB_SHA -Version 'plan020-native'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath result/portable/WBD.exe)) {
            throw 'original native WinForms executable not compiled'
          }
          # Use the SAME pinned original-Go V4 Rust client that CI linked.
          # Untagged V3 may still compile for legacy proof, never ship it.
          Copy-Item -LiteralPath result/wbd-client-embedded.exe -Destination result/portable/wbd-client.exe
          Copy-Item -LiteralPath target/release/wbd_engine.dll -Destination result/portable/wbd_engine.dll
          Copy-Item -LiteralPath result/wintun-release/wintun.dll -Destination result/portable/wintun.dll
          if (!(Test-Path result/portable/wbd_engine.dll)) {throw 'portable Rust V4 native DLL absent'}
          $clientHash=(Get-FileHash -Algorithm SHA256 result/portable/wbd-client.exe).Hash.ToLowerInvariant()
          $rustHash=(Get-FileHash -Algorithm SHA256 result/portable/wbd_engine.dll).Hash.ToLowerInvariant()
          Write-Output ('M0_PLAN020_ACTUAL_V4_CLIENT_AND_RUST_M3_PORTABLE_PASS client_sha256='+$clientHash+' dll_sha256='+$rustHash)
          $file='result/portable/WBD.exe'
          $sig=(Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          if ($sig.Length -ne 64) {throw 'compiled WinForms file SHA missing'}
          Write-Output ('M0_PLAN020_ORIGINAL_WINFORMS_NATIVE_EXECUTABLE_COMPILE_PASS sha256='+$sig)
      - name: Run compiled real WinForms state transitions under a test-only fake child
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc='C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\Roslyn\csc.exe'
          $framework=Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          $references=@('mscorlib','System','System.Core','System.Drawing','System.Windows.Forms','System.Web.Extensions','System.ServiceProcess') | ForEach-Object { '/reference:'+(Join-Path $framework ($_.ToString()+'.dll')) }
          $references+=('/reference:'+(Resolve-Path result/portable/WBD.exe).Path)
          & $csc /nologo /noconfig /nostdlib+ /langversion:latest /target:exe /platform:x64 /optimize+ /utf8output /codepage:65001 '/out:result/portable/m0-plan020-gui-harness.exe' $references r0/go_overlay/windows/gui/M0Plan020GUIAuthorityHarness.cs
          if ($LASTEXITCODE -ne 0) {throw 'native WinForms harness compile FAIL'}
          $p=Start-Process -FilePath (Resolve-Path result/portable/m0-plan020-gui-harness.exe).Path -WorkingDirectory (Resolve-Path result/portable).Path -PassThru -Wait -ErrorAction Stop
          try {
            if ($p.ExitCode -ne 0) {throw ('actual compiled WinForms state regression FAIL '+$p.ExitCode)}
          } finally { $p.Dispose() }
          Write-Output 'M0_PLAN020_REAL_WINFORMS_EXE_STATE_MACHINE_PASS_TEST_CHILD_ONLY'
      - name: Verify assembled WinForms source never maps READY to OS Applied
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,pathlib,json,re,hashlib
          gui=pathlib.Path("legacy/windows/gui/MainForm.cs").read_text(encoding="utf8")
          assert "WBD_WINDOWS_OS_APPLIED" in gui
          portable=pathlib.Path("legacy/windows/gui/Portable.cs").read_text(encoding="utf8")
          assert 'Info("--native-v4-product --control-stdin --config "' in portable
          assert 'if (nativeApplied && !nativeStopped)' in portable
          assert 'e.Data == "WBD_WINDOWS_OS_APPLIED"' in portable
          assert 'e.Data == "WBD_WINDOWS_NATIVE_DISCONNECTED_V1 wal_restored=1 rust_stopped=1"' in portable
          tagged=pathlib.Path("legacy/cmd/wbd-client/m0_native_v4_windows.go").read_text()
          assert 'fmt.Println("WBD_WINDOWS_OS_APPLIED")' in tagged
          assert 'if e=windowsclient.N4NativeNetworkReady(ctx)' not in tagged
          assert 'receipt,e:=product.Apply(ctx)' in tagged
          assert 'if !receipt.AllNativeOSApplied' in tagged
