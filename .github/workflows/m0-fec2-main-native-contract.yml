name: M0 main-integrated FEC2 ISA-L native contract
run-name: "M0|FEC2-main-native|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-fec2-main-native-contract.yml"
      - "crates/wbd-codec/src/fec_v2.rs"
      - "crates/wbd-codec/src/fec_v2_tests.rs"
      - "crates/wbd-codec/src/record_frame.rs"
      - "crates/wbd-codec/src/lib.rs"
      - "crates/wbd-codec/Cargo.toml"
      - "native/isal-safe/build.rs"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: m0-fec2-main-native-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Compile native main codec against PINNED official ISA-L, 13 F2 native oracles
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          rustup toolchain install 1.85.1 --profile minimal
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm autoconf automake libtool gcc make
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          test "$(git -C isa-l rev-parse HEAD)" = c387163fcbca62701d646149564c550c78a4f985
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/m0-main-fec2-isal"
          export WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985
          (cd isa-l && ./autogen.sh && ./configure --prefix="$WBD_ISAL_PREFIX" --disable-shared --enable-static && make -j2 && make install)
          test -s "$WBD_ISAL_PREFIX/lib/libisal.a"
          nm -g "$WBD_ISAL_PREFIX/lib/libisal.a" | grep -Eq ' [TW] ec_encode_data$'
          mkdir -p fec2-main-native-result
          cargo +1.85.1 test --release --locked -p wbd-codec --features native-isal --lib r1_f2_ -- --test-threads=4 --nocapture 2>&1 | tee fec2-main-native-result/native-tests.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          log=pathlib.Path("fec2-main-native-result/native-tests.log").read_text()
          names=set(re.findall(r"test (?:\S*::)?(r1_f2_\w+) \.\.\. ok",log))
          required={"r1_f2_real_isal_exact_rows_and_missing_only_native_equivalence",
                    "r1_f2_prepared_native_cached_tables_real_ec_encode_data",
                    "r1_f2_full_profiles_all_k_and_every_erasure_count",
                     "r1_f2_native_decode_tables_and_workspace_reused_dirty_tail_exact",
                     "r1_f2_decode_workspace_cache_65_distinct_keys_and_eviction"}
          assert len(names)==15 and required.issubset(names),(len(names),names)
          assert re.search(r"test result: ok\. 15 passed; 0 failed;",log)
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          inputs=["crates/wbd-codec/src/fec_v2.rs",
                  "crates/wbd-codec/src/fec_v2_tests.rs",
                  "crates/wbd-codec/src/lib.rs","crates/wbd-codec/src/record_frame.rs",
                  "native/isal-safe/build.rs","Cargo.lock"]
          receipt={"schema_version":1,"result":"PASS_SCOPED_MAIN_INTEGRATED_REAL_ISAL_CODEC",
             "source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],
             "attempt":os.environ["GITHUB_RUN_ATTEMPT"],"native_tests":len(names),
             "actual_backend":"NativeIsaL","test_source":"MAIN_CHECKOUT_NOT_WORKER_CLONE",
             "original_m3_code_sha":"b4d638abf80bb6f12e6c944565c2aa8bb4e90792",
             "official_isal":"c387163fcbca62701d646149564c550c78a4f985",
             "platform":"linux_x86_64","rust":"1.85.1",
             "input_sha256":{p:h(p) for p in inputs},
             "native_log_sha256":h("fec2-main-native-result/native-tests.log"),
             "isal_archive_sha256":h(os.environ["WBD_ISAL_PREFIX"]+"/lib/libisal.a"),
             "full_product":"NOT_RUN","other_targets":"NOT_RUN",
             "capability_and_kind_2_3":"NOT_ENABLED","packet_p99":"NOT_RUN"}
          pathlib.Path("fec2-main-native-result/receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: main-fec2-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: fec2-main-native-result/
          if-no-files-found: warn
          retention-days: 30
