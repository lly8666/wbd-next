name: M0 R1 native M4 IPv4 TCP outer byte oracle
run-name: "M0|${{ github.sha }}|r1-ipv4-tcp-native"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r1-ipv4-tcp-native.yml"
      - ".github/workflows/r1-linux-kernel-batch-native.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/wbd-platform/**"
      - "crates/wbd-types/**"
permissions:
  contents: read
concurrency:
  group: r1-ipv4-tcp-native-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Compile once real Rust native M4 packet byte suite
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          cargo test --release --locked -p wbd-platform --no-run
          binary="$(find target/release/deps -maxdepth 1 -type f -name 'wbd_platform-*' -perm -u+x | head -n 1)"
          test -n "$binary"
          mkdir r1-outer-build
          cp "$binary" r1-outer-build/packet.test
          python3 - <<'PY'
          import os,pathlib,hashlib,json
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          paths=['crates/wbd-platform/src/ipv4_tcp.rs','crates/wbd-platform/src/rx_ipv4_tcp.rs','crates/wbd-platform/src/r1.rs','crates/wbd-platform/src/linux_batch.rs','crates/wbd-platform/src/lib.rs','Cargo.lock']
          data={'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'runner':'linux-x64-rust1.85.1',
              'binary_sha256':sha('r1-outer-build/packet.test'),'input_sha256':{p:sha(p) for p in paths}}
          pathlib.Path('r1-outer-build/manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-outer-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-outer-build/
          if-no-files-found: error
          retention-days: 30
  consume:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r1-outer-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-outer-build
      - name: Hash verify binary and 31 exact platform R1 tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,hashlib,json
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m=json.load(open('r1-outer-build/manifest.json'))
          assert m['source_sha']==os.environ['GITHUB_SHA']
          assert m['run_id']==os.environ['GITHUB_RUN_ID'] and m['attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          assert m['runner']=='linux-x64-rust1.85.1'
          assert sha('r1-outer-build/packet.test')==m['binary_sha256']
          for p,h in m['input_sha256'].items():assert sha(p)==h,p
          PY
          chmod +x r1-outer-build/packet.test
          mkdir r1-outer-result
          set +e
          r1-outer-build/packet.test r1_ --nocapture >r1-outer-result/tests.log 2>&1
          ec=$?
          set -e
          cat r1-outer-result/tests.log
          TEST_EXIT="$ec" python3 - <<'PY'
          import os,re,json,pathlib,hashlib,sys
          m=json.load(open('r1-outer-build/manifest.json'))
          log=pathlib.Path('r1-outer-result/tests.log').read_text()
          match=re.search(r'test result: ok\. (\d+) passed; 0 failed',log)
          count=int(match.group(1)) if match else 0
          ok=int(os.environ['TEST_EXIT'])==0 and count==31
          result={'source_sha':m['source_sha'],'run_id':m['run_id'],'attempt':m['attempt'],'binary_sha256':m['binary_sha256'],
                  'log_sha256':hashlib.sha256(log.encode()).hexdigest(),'native_tests':count,
                  'result':'PASS' if ok else 'FAIL','scope':'M4_ACTUAL_IPV4_TCP_AND_LINUX_GNU_SENDMMSG_NATIVE_NOT_AF_PACKET',
                  'not_qualified':'REAL_AF_PACKET;GO_V4_LIVE;NATIVE_WINDOWS_ARM;PERFORMANCE;PHYSICAL'}
          pathlib.Path('r1-outer-result/result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not ok:sys.exit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: r1-outer-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-outer-result/
          if-no-files-found: warn
          retention-days: 30
