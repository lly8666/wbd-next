name: V3-C native ARM64 direct TCP control
run-name: "V3-C-DIRECT-TCP200|${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: [experiment/network-matrix-tuning]
    paths:
      - tools/network_harness/direct_tcp_baseline.py
      - .github/workflows/network-v3-direct-tcp-control.yml
permissions: {contents: read}
concurrency:
  group: v3-c-direct-tcp-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  direct-tcp-control:
    name: One native VM direct TCP 200Mbps / 400ms RTT
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Install network namespace and qdisc tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2
      - name: Direct inner-TCP counterpart only, no WBD application
        run: sudo -n --preserve-env=GITHUB_RUN_ID python3 tools/network_harness/direct_tcp_baseline.py
      - name: Show actual scope and result
        if: always()
        run: |
          if test -f direct-tcp-result/result.json; then
            python3 - <<'PY'
          import json
          d=json.load(open('direct-tcp-result/result.json'))
          print('DIRECT_TCP_CONTROL',d['scope'],d['sender']['measured_mbps'],d['receiver']['measured_mbps'])
          PY
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v3-c-direct200-${{ github.run_id }}-${{ github.run_attempt }}
          path: direct-tcp-result/**
          retention-days: 14
          if-no-files-found: warn
