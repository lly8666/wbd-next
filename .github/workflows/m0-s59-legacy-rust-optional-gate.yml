name: M0 S59 optional Rust Linux original-Go module build
run-name: "M0 S59 exact Rust cfg ${{ github.sha }}"
on:
  push:
    branches: [experiment/m0-s59-legacy-rust-optional-gate-20261028]
    paths:
      - "crates/wbd-engine/src/v4_embedded_go.rs"
      - ".github/workflows/m0-s59-legacy-rust-optional-gate.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  dual-optional-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify exact source and Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.85.1 --profile minimal
      - name: Build ordinary original Linux Go Rust no FEC2
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 check --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go
          echo S59_DEFAULT_NORMAL_FEC2_OFF_COMPILE_PASS
      - name: Preserve FEC2 and Game compiled option
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 check --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record
          echo S59_OPTIONAL_FEC2_GAME_COMPILE_PASS
      - name: Build Rust ordinary base no features
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 check --locked -p wbd-engine
          echo S59_RUST_ORDINARY_BASE_COMPILE_PASS
