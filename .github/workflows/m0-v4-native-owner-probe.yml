name: M0 protected Go V4 native Rust owner test probe
run-name: "M0|${{ github.sha }}|m0-v4-native-probe"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-v4-native-owner-probe.yml"
      - "tools/run-v4-kernel-loopback.sh"
      - "tools/run-v4-tun-netns.sh"
      - "crates/wbd-platform/src/linux_tun_sink.rs"
      - "crates/wbd-platform/src/linux_raw_carrier.rs"
      - "crates/wbd-platform/src/ipv4_tcp.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/wbd-engine/Cargo.toml"
      - "crates/wbd-engine/src/lib.rs"
      - "crates/wbd-engine/src/cold_v4.rs"
      - "crates/wbd-engine/src/v4_owner_crypto.rs"
      - "crates/wbd-engine/src/v4_protected_handoff.rs"
      - "crates/wbd-engine/src/v4_embedded_go.rs"
      - "crates/wbd-engine/src/runtime/**"
      - "crates/wbd-engine/src/memory/**"
      - "r0/go_overlay/internal/realityfront/bridge_v4_embedded_linux.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_embedded_linux_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_embedded_perf_linux_test.go"
      - "crates/wbd-platform/src/linux_packet_preflight.rs"
      - "crates/wbd-platform/src/lib.rs"
      - "crates/wbd-platform/src/linux_route_events.rs"
      - "crates/wbd-platform/src/linux_mtu_scope.rs"
      - "crates/wbd-platform/src/linux_driver_outcome_lease.rs"
      - "crates/wbd-platform/src/linux_rx_batch.rs"
      - "crates/wbd-platform/src/linux_batch.rs"
      - "crates/wbd-codec/src/record_crypto.rs"
      - "crates/wbd-codec/src/record_replay.rs"
      - "crates/wbd-codec/src/link_fec_wire.rs"
      - "crates/wbd-codec/src/link_reassembly.rs"
      - "crates/wbd-engine/src/v4_probe_bridge.rs"
      - "crates/wbd-engine/src/runtime/early_rx.rs"
      - "crates/wbd-engine/src/runtime/generation.rs"
      - "crates/wbd-engine/src/memory/mod.rs"
      - "r0/go_overlay/internal/realityfront/admission_v4.go"
      - "r0/go_overlay/internal/realityfront/admission_v4_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_probe_linux.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_probe_linux_test.go"
permissions: {contents: read}
concurrency:
  group: m0-v4-owner-probe-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Compile pinned Go real TLS and feature-restricted Rust CDylib once
        shell: bash
        env: {GOTOOLCHAIN: local, CGO_ENABLED: "1"}
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          test "$(go version | awk '{print $3}')" = go1.23.12
          # The ordinary production build must NOT export the probe C ABI.
          cargo build --release --locked -p wbd-engine
          test -s target/release/libwbd_engine.so
          if nm -D target/release/libwbd_engine.so | grep -Eq ' wbd_m0_test_probe_'; then
            echo 'CRITICAL: test-only Go/Rust owner C symbols leaked into normal ABI' >&2
            exit 1
          fi
          cargo build --release --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go
          cargo test --release --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go --lib --no-run
          test -s target/release/libwbd_engine.so
          mkdir native-probe-build
          cp target/release/libwbd_engine.so native-probe-build/libwbd_engine.so
          rust_test="$(find target/release/deps -maxdepth 1 -type f -name 'wbd_engine-*' -perm -u+x | head -n 1)"
          test -n "$rust_test"
          cp "$rust_test" native-probe-build/owner-rust.test
          for file in admission_v4.go admission_v4_test.go bridge_v4_probe_linux.go bridge_v4_probe_linux_test.go bridge_v4_embedded_linux.go bridge_v4_fec2_owner_off_linux.go bridge_v4_embedded_linux_test.go bridge_v4_embedded_perf_linux_test.go; do
            cp "r0/go_overlay/internal/realityfront/$file" "legacy/internal/realityfront/$file"
          done
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          (cd legacy && go test -tags wbd_v4_native_probe,wbd_v4_embedded_go -c -o "$GITHUB_WORKSPACE/native-probe-build/owner-go.test" ./internal/realityfront)
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          paths=["Cargo.toml","Cargo.lock","crates/wbd-engine/Cargo.toml",
            "crates/wbd-engine/src/lib.rs","crates/wbd-engine/src/cold_v4.rs",
            "crates/wbd-engine/src/v4_owner_crypto.rs",
            "crates/wbd-engine/src/v4_protected_handoff.rs",
            "crates/wbd-engine/src/v4_embedded_go.rs",
            "crates/wbd-platform/src/linux_packet_preflight.rs",
            "crates/wbd-platform/src/lib.rs",
            "crates/wbd-platform/src/linux_route_events.rs",
            "crates/wbd-platform/src/linux_tun_sink.rs",
            "crates/wbd-platform/src/linux_raw_carrier.rs",
            "crates/wbd-platform/src/linux_driver_outcome_lease.rs",
            "crates/wbd-platform/src/linux_rx_batch.rs",
            "crates/wbd-platform/src/linux_batch.rs",
            "crates/wbd-codec/src/record_crypto.rs",
            "crates/wbd-codec/src/record_replay.rs",
            "crates/wbd-codec/src/link_fec_wire.rs",
            "crates/wbd-codec/src/link_reassembly.rs",
            "crates/wbd-engine/src/v4_probe_bridge.rs",
            "crates/wbd-engine/src/runtime/early_rx.rs",
            "crates/wbd-engine/src/runtime/generation.rs",
            "crates/wbd-engine/src/memory/mod.rs",
            "r0/go_overlay/internal/realityfront/admission_v4.go",
            "r0/go_overlay/internal/realityfront/admission_v4_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_probe_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_probe_linux_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_embedded_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_fec2_owner_off_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_embedded_linux_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_embedded_perf_linux_test.go",
            ".github/workflows/m0-v4-native-owner-probe.yml",
            "tools/run-v4-kernel-loopback.sh",
            "tools/run-v4-tun-netns.sh"]
          binary=["libwbd_engine.so","owner-rust.test","owner-go.test"]
          m={"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],
             "attempt":os.environ["GITHUB_RUN_ATTEMPT"],
             "old_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
             "rust":"1.85.1","go":"1.23.12","feature":"m0_v4_probe,m0_v4_embedded_go",
             "inputs_sha256":{p:sha(p) for p in paths},
             "binary_sha256":{p:sha("native-probe-build/"+p) for p in binary},
             "production_abi":"FEATURES_ZERO"}
          pathlib.Path("native-probe-build/manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-v4-native-probe-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-probe-build/
          retention-days: 30
          if-no-files-found: error
  consume:
    name: batch-${{ matrix.lane }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        lane: [critical, impairment, metric]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m0-v4-native-probe-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-probe-build
      - name: Verify all reused binaries and exact SOURCE manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m=json.load(open("native-probe-build/manifest.json"))
          assert m["source_sha"]==os.environ["GITHUB_SHA"]
          assert m["run_id"]==os.environ["GITHUB_RUN_ID"] and m["attempt"]==os.environ["GITHUB_RUN_ATTEMPT"]
          assert m["old_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert m["feature"]=="m0_v4_probe,m0_v4_embedded_go" and m["production_abi"]=="FEATURES_ZERO"
          for p,h in m["inputs_sha256"].items():assert sha(p)==h,p
          for p,h in m["binary_sha256"].items():assert sha("native-probe-build/"+p)==h,p
          PY
          chmod +x native-probe-build/*.test
          echo "LD_LIBRARY_PATH=$PWD/native-probe-build" >> "$GITHUB_ENV"
          mkdir native-probe-result
      - name: Actual original Go TLS and Rust owner native controls
        if: ${{ matrix.lane == 'critical' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bash tools/run-v4-kernel-loopback.sh --prebuilt native-probe-build --all >native-probe-result/go.log 2>&1
          G=$?
          ./native-probe-build/owner-go.test -test.v -test.count=1 -test.run '^TestR0V4Embedded(NativeProtectedControlAllCiphers|NativeProtectedFec2Bit2Scope|TwoGenerationStopIsolation)$' >>native-probe-result/go.log 2>&1
          GE=$?
          if [[ "$GE" != 0 ]]; then G=$GE; fi
          ./native-probe-build/owner-rust.test r0_m0_native_probe_ --nocapture >native-probe-result/rust.log 2>&1
          R=$?
          ./native-probe-build/owner-rust.test m0_normal_build_v4_go_private_handoff_version_and_scope --nocapture >>native-probe-result/rust.log 2>&1
          R2=$?
          if [[ "$R2" != 0 ]]; then R=$R2; fi
          ./native-probe-build/owner-rust.test m0_embedded_go_private_control_rejects_unknown_and_null --nocapture >>native-probe-result/rust.log 2>&1
          R3=$?
          if [[ "$R3" != 0 ]]; then R=$R3; fi
          ./native-probe-build/owner-rust.test ready_only_batch_0_1_32_33_and_failure_do_not_wait --nocapture >>native-probe-result/rust.log 2>&1
          R4=$?
          if [[ "$R4" != 0 ]]; then R=$R4; fi
          # Exact M0 TX completion translation: no false route invalidation
          # for backpressure/unknown suffix, exact prefix/tail/uncertain.
          ./native-probe-build/owner-rust.test m0_tx_turn_completion_preserves_prefix_tail_and_typed_path --nocapture >>native-probe-result/rust.log 2>&1
          RT=$?
          if [[ "$RT" != 0 ]]; then R=$RT; fi
          ./native-probe-build/owner-rust.test m0_raw_original_owner_kernel_prefix_and_uncertain_never_conflate --nocapture >>native-probe-result/rust.log 2>&1
          R5=$?
          if [[ "$R5" != 0 ]]; then R=$R5; fi
          ./native-probe-build/owner-rust.test r1_m0_original_data_return_budget_yields_at_64_128_33 --nocapture >>native-probe-result/rust.log 2>&1
          R6=$?
          if [[ "$R6" != 0 ]]; then R=$R6; fi
          # Same feature-gated original owner binary, not a platform/model
          # surrogate; test moving AEAD-gated seq64 anchor and wrap.
          ./native-probe-build/owner-rust.test r1_m0_live_authenticated_seq32_anchor_wrap_and_untrusted_no_advance --nocapture >>native-probe-result/rust.log 2>&1
          R7=$?
          if [[ "$R7" != 0 ]]; then R=$R7; fi
          ./native-probe-build/owner-rust.test m0_original_tx_seq64_never_restarts_pn_at_wire32_wrap --nocapture >>native-probe-result/rust.log 2>&1
          R8=$?
          if [[ "$R8" != 0 ]]; then R=$R8; fi
          # Explicit ORIGINAL M1 loan all-or-none LINK staging regression;
          # ensure failure returns every slab BEFORE real owner seals PN.
          ./native-probe-build/owner-rust.test m0_link_materialization_never_admits_half_packet_on_arena_failure --nocapture >>native-probe-result/rust.log 2>&1
          R9=$?
          if [[ "$R9" != 0 ]]; then R=$R9; fi
          ./native-probe-build/owner-rust.test m0_private_v4_real_go_fec2_bit2_handoff_is_metadata_not_permission --nocapture >>native-probe-result/rust.log 2>&1
          R10=$?
          if [[ "$R10" != 0 ]]; then R=$R10; fi
          ./native-probe-build/owner-rust.test m0_pending_jumbo_midflight_scope_stop_prefix_matrix --nocapture >>native-probe-result/rust.log 2>&1
          R11=$?
          if [[ "$R11" != 0 ]]; then R=$R11; fi
          set -e
          cat native-probe-result/go.log native-probe-result/rust.log
          GO_EXIT="$G" RUST_EXIT="$R" python3 - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          go=pathlib.Path("native-probe-result/go.log").read_text()
          rust=pathlib.Path("native-probe-result/rust.log").read_text()
          good_go=os.environ["GO_EXIT"]=="0" and bool(re.search(r"^--- PASS: TestR0V4EmbeddedTwoGenerationStopIsolation",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4EmbeddedNativeProtectedFec2Bit2Scope",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4EmbeddedNativeProtectedControlAllCiphers",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustProbeActualProtectedFreshOwner",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustProtectedAEADReplayAllCiphers",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustProtectedNormalOffLinkFirstPacket",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustProtectedNormalOffBidirectionalScopedFirst",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustLinuxKernelBudget",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustLinuxKernelRoutePmtu",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustM4KernelUdpScopedTxFirstPacket",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustM4KernelUdpC2SIntoOriginalOwner",go,re.M)) and bool(re.search(r"^--- PASS: TestR0V4NativeRustGoAdmissionRetainedHeapIndicative",go,re.M))
          m=re.search(r"test result: ok\. (\d+) passed; 0 failed",rust)
          good_rust=os.environ["RUST_EXIT"]=="0" and bool(m) and int(m.group(1))==1 and "r0_m0_native_probe_local_fresh_generation_and_bounded_phases ... ok" in rust and "m0_normal_build_v4_go_private_handoff_version_and_scope ... ok" in rust and "m0_embedded_go_private_control_rejects_unknown_and_null ... ok" in rust and "ready_only_batch_0_1_32_33_and_failure_do_not_wait ... ok" in rust and "m0_tx_turn_completion_preserves_prefix_tail_and_typed_path ... ok" in rust and "m0_raw_original_owner_kernel_prefix_and_uncertain_never_conflate ... ok" in rust and "r1_m0_original_data_return_budget_yields_at_64_128_33 ... ok" in rust and "r1_m0_live_authenticated_seq32_anchor_wrap_and_untrusted_no_advance ... ok" in rust and "m0_original_tx_seq64_never_restarts_pn_at_wire32_wrap ... ok" in rust and "m0_link_materialization_never_admits_half_packet_on_arena_failure ... ok" in rust and "m0_private_v4_real_go_fec2_bit2_handoff_is_metadata_not_permission ... ok" in rust and "m0_pending_jumbo_midflight_scope_stop_prefix_matrix ... ok" in rust
          data=json.load(open("native-probe-build/manifest.json"))
          sha=lambda s:hashlib.sha256(s.encode()).hexdigest()
          result={"source_sha":data["source_sha"],"run_id":data["run_id"],
            "attempt":data["attempt"],"result":"PASS" if good_go and good_rust else "FAIL",
            "actual_go_TLS_to_test_only_Rust_candidate":good_go,"Rust_generation_and_phase":good_rust,
            "original_M1_link_full_preseal_staging":good_rust,
            "go_log_sha256":sha(go),"rust_log_sha256":sha(rust),
            "binary_sha256":data["binary_sha256"],
            "actual_early_payload_transfer":"TEST_ONLY_GO_FAKETCP_DETACH_BYTES_COPIED_AND_HASH_VERIFIED_IN_RUST" if good_go else "NOT_VERIFIED",
            "positive_Rust_auth_authority":"NOT_RUN",
            "real_Go_TLS_to_normal_build_Rust_AEAD_PN":good_go,
            "normal_build_scoped_RX_M3_LINK_reassembly_callback":good_go,
            "real_go_tls_normal_build_scoped_tx_bidirectional_observation":good_go,
            "kernel_observed_local_mtu_to_normal_build_scoped_v4_tx":good_go,
            "kernel_bound_ipv4_route_pmtu_queried_before_scoped_v4_tx":good_go,
            "actual_M4_kernel_sendmmsg_scoped_frozen_v4_tx_to_Go_socket":good_go,
            "actual_M4_kernel_recvmmsg_into_original_M1_scoped_Rust_AEAD_LINK":good_go,
            "go_heap_admission_pair_diagnostic_only":good_go,
            "driver_loan_stop":"NOT_RUN","production_ABI_features":0,
            "product":"NOT_RUN","physical":"NOT_RUN"}
          pathlib.Path("native-probe-result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          if not(good_go and good_rust):sys.exit(1)
          PY
      - name: Real Linux TUN L3 app ingress in owned netns (capability-gated)
        if: ${{ matrix.lane == 'critical' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-probe-result
          set +e
          bash tools/run-v4-tun-netns.sh native-probe-build >native-probe-result/tun-netns.log 2>&1
          RC=$?
          set -e
          cat native-probe-result/tun-netns.log
          if [[ "$RC" == 77 ]]; then
            STATE=UNSUPPORTED
            echo 'True kernel TUN/namespace not supported on this Actions runner; no PASS claim.'
          elif [[ "$RC" == 0 ]]; then
            grep -q 'TUN_APP_FIRST_PACKET_PASS: isolated netns' native-probe-result/tun-netns.log
            grep -q 'TUN_APP_BIDIRECTIONAL_PASS: real Go application' native-probe-result/tun-netns.log
            grep -q 'TUN_TO_REAL_RAW_FAKETCP_PASS: real kernel' native-probe-result/tun-netns.log
            grep -q 'REAL_RAW_BIDIRECTIONAL_TUN_PASS: Go raw IPv4/TCP' native-probe-result/tun-netns.log
            grep -q 'EMBEDDED_REAL_RAW_TO_TUN_APP_PASS: private Go authenticated' native-probe-result/tun-netns.log
            grep -q 'EMBEDDED_REAL_TUN_TO_RAW_GO_PEER_PASS: same non-test Go embedded Rust owner' native-probe-result/tun-netns.log
            for suite in 1 2 3; do
              grep -q "TUN_APP_FIRST_PACKET_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "TUN_APP_REVERSE_PACKET_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "TUN_TO_REAL_RAW_FAKETCP_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "RAW_C2S_TO_REAL_TUN_APP_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "EMBEDDED_REAL_RAW_TO_TUN_APP_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "EMBEDDED_REAL_TUN_TO_RAW_GO_PEER_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "EMBEDDED_REAL_C2S_SECOND_PACKET_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "EMBEDDED_REAL_MTU_EXACT_BOUNDARY_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "EMBEDDED_REAL_MTU_OVER_LIMIT_FAIL_CLOSED_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "EMBEDDED_REAL_S2C_SECOND_PACKET_PASS suite=$suite" native-probe-result/tun-netns.log
              grep -q "EMBEDDED_REAL_RX_REPLAY_CORRUPT_NO_DELIVERY_PASS suite=$suite" native-probe-result/tun-netns.log
            done
            grep -q '^--- PASS: TestR0V4NativeRustTunKernelAppFirst' native-probe-result/tun-netns.log
            grep -q '^--- PASS: TestR0V4EmbeddedRealM4RawToTun' native-probe-result/tun-netns.log
            STATE=PASS
          else
            STATE=FAIL
          fi
          TUN_STATE="$STATE" python3 - <<'PY'
          import hashlib,json,os,pathlib
          log=pathlib.Path("native-probe-result/tun-netns.log").read_bytes()
          source=json.load(open("native-probe-build/manifest.json"))
          result={"source_sha":source["source_sha"],"run_id":source["run_id"],
              "attempt":source["attempt"],"result":os.environ["TUN_STATE"],
              "scope":"TRUE_LINUX_NETNS_RAW_IPV4_TCP_C2S_AND_S2C_TUN_APP_BIDIRECTIONAL_ORIGINAL_RUST_OWNER",
              "tun_log_sha256":hashlib.sha256(log).hexdigest(),
              "production_abi_features":0,"product_e2e":"NOT_RUN",
              "netem_matrix":"NOT_RUN","raw_carrier":"NOT_RUN"}
          pathlib.Path("native-probe-result/tun-result.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY
          test "$STATE" != FAIL
      - name: Preliminary controlled 10ms netem same native owner smoke (NOT product)
        if: ${{ matrix.lane == 'impairment' }}
        shell: bash
        run: |
          set -euo pipefail
          # Existing prebuilt artifacts/source manifest from the SAME run.
          # Netem is applied only inside a new owned netns. Exactly one
          # 10ms/zero-loss functional scenario; no performance projections.
          mkdir -p native-probe-result
          set +e
