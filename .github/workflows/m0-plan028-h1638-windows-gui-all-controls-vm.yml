name: PLAN028 H1638 Windows VM real WinForms GUI settings and buttons
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  gui-compiled-vm:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PRODUCT_SOURCE: 52767d183b61eaf2621d967b16e85e644b1de428
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 43161652596
          github-token: ${{ github.token }}
          name: m0-wl-windows-product-binaries-52767d183b61eaf2621d967b16e85e644b1de428
          path: prebuilt
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Assemble exact current WinForms and verify frozen original Go Rust
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git -C legacy rev-parse HEAD).Trim() -ne 'a7a82db31fe736ffedee330795a3234d358f1984'){throw 'old Go donor mismatch'}
          git fetch --quiet --depth=1 origin $env:PRODUCT_SOURCE
          if($LASTEXITCODE -ne 0 -or (git rev-parse FETCH_HEAD).Trim() -ne $env:PRODUCT_SOURCE){throw 'immutable Go Rust product source not fetched'}
          $delta=@(git diff --name-only $env:PRODUCT_SOURCE $env:GITHUB_SHA -- crates Cargo.lock Cargo.toml r0/go_overlay/cmd r0/go_overlay/internal tools/prepare_windows_wiring.py r0/go_overlay/assembly/manifest-plan020-m0.json r0/go_overlay/windows/gui)
          if($LASTEXITCODE -ne 0){throw 'Go Rust git diff source guard failed'}
          if($delta.Count -gt 0){throw ('compiled source changed '+($delta -join ','))}
          $m=Get-Content prebuilt/windows-binary-manifest.json -Raw|ConvertFrom-Json
          if($m.source_sha -ne $env:PRODUCT_SOURCE -or -not $m.native_fec_acceleration){throw 'wrong native ISA-L product'}
          foreach($spec in @(@('wbd-client-embedded.exe','exe','edbb9715f19547dadc2117b2d2fe39169762480de3244c639ecbb0c1a777f582'),@('wbd_engine.dll','dll','3973cdadf9ced7063b1a5b8f47f24fe480c04a989a4baae383e33df1c76f9357'))){
            $hash=(Get-FileHash ('prebuilt/'+$spec[0]) -Algorithm SHA256).Hash.ToLower()
            if($hash -ne $spec[2] -or $hash -ne $m.sha256.($spec[1])){throw "Go/Rust binary hash mismatch $($spec[0])"}
          }
          python tools/prepare_windows_wiring.py
          if($LASTEXITCODE -ne 0){throw 'formal assembly failed'}
          @'
          import json,pathlib
          root=pathlib.Path('legacy')
          p=json.loads((root/'docs/PARAMETERS.json').read_text(encoding='utf-8'))
          w=p['targets']['client-windows']
          fields=json.loads((root/'windows/gui/fields.json').read_text(encoding='utf-8'))
          assert w['mtu']['default_expression']=='1460'
          assert w['outer-repair']['default_expression']=='"on"'
          assert w['fec.mode']['default_expression']=='"off"'
          assert w['lease4']['default_expression']=='""'
          assert set(fields)==set(k for k,v in w.items() if v['json'] or k in fields)
          assert fields['outer-repair'][0]=='传输'
          import re
          gui_src=(root/'windows/gui/GuiTests.cs').read_text(encoding='utf-8')
          routes=re.findall(r'"route-key-hex"\s*,\s*"([a-f0-9]+)"',gui_src)
          assert len(routes)>=2 and all(len(x)==64 for x in routes[:2]),"test-only V4 key fixture must be 32 bytes"
          assert 'pending_native_auth' in (root/'cmd/wbd-client/main_windows.go').read_text(encoding='utf-8')
          print('H1644_ASSEMBLED_GUI_DEFAULTS_32B_V4_ROUTE_KEYS_AND_COLD_PENDING_PASS',len(fields))
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'GUI catalog defaults check failed'}
      - name: Build CURRENT assembled native V4 original-Go cold entry once and compile WinForms
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force result | Out-Null
          Push-Location legacy
          try {
            & go build -trimpath -tags wbd_v4_embedded_go -o ../result/current-wbd-client.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'assembled current original-Go native V4 build failed'}
          } finally {Pop-Location}
          & ./tools/m0_plan028_h1640_win_gui_compile.ps1 -LegacyRoot legacy -OutputDirectory result/gui-portable -SourceSHA $env:PRODUCT_SOURCE -Version plan028-h1653
          if($LASTEXITCODE -ne 0){throw 'actual WinForms release compiler failed'}
          # The GUI launches the exact formally signed native Go client.
          # Independently compiled same-tree Go bytes must match it first.
          $compiledGo=(Get-FileHash result/current-wbd-client.exe -Algorithm SHA256).Hash.ToLower()
          $formalGo=(Get-FileHash prebuilt/wbd-client-embedded.exe -Algorithm SHA256).Hash.ToLower()
          if($compiledGo -ne $formalGo){throw 'WinForms compiled Go differs from signed current formal product'}
          Copy-Item prebuilt/wbd-client-embedded.exe result/gui-portable/wbd-client.exe
          Copy-Item prebuilt/wbd_engine.dll result/gui-portable/wbd_engine.dll
          $goSHA=(Get-FileHash result/gui-portable/wbd-client.exe -Algorithm SHA256).Hash.ToLower()
          $rustSHA=(Get-FileHash result/gui-portable/wbd_engine.dll -Algorithm SHA256).Hash.ToLower()
          if($goSHA -ne 'edbb9715f19547dadc2117b2d2fe39169762480de3244c639ecbb0c1a777f582' -or $rustSHA -ne '3973cdadf9ced7063b1a5b8f47f24fe480c04a989a4baae383e33df1c76f9357'){throw 'Current formal signed binaries differ in GUI release'}
          [ordered]@{go_assembly_source_sha=$env:PRODUCT_SOURCE;gui_manifest_source_sha=$env:GITHUB_SHA;go_sha256=$goSHA; rust_binary_source_sha=$env:PRODUCT_SOURCE;rust_sha256=$rustSHA; original_go_donor='a7a82db31fe736ffedee330795a3234d358f1984'} |
            ConvertTo-Json | Set-Content -Encoding UTF8 result/gui-portable/h1653-compiled-gui-source.json
          Write-Output "H1643_REAL_NATIVE_GO_GUI_PRODUCT_SOURCE=$env:GITHUB_SHA SHA256=$goSHA"
          foreach($name in @('gui-self','gui-authority','gui-buttons')){
            New-Item -ItemType Directory -Force ('result/'+$name) | Out-Null
            Copy-Item result/gui-portable/* ('result/'+$name) -Recurse -Force
          }
          Write-Output H1643_ONE_NATIVE_GO_CURRENT_GUI_COMPILATION_RUST_PINNED
      - name: Run compiled GUI actual all-field CLI --check-config selftest
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path result/gui-self/WBD.exe).Path
          $p=Start-Process -FilePath $path -ArgumentList @('--self-test') -WorkingDirectory (Resolve-Path result/gui-self).Path -PassThru
          try {
            if(-not $p.WaitForExit(420000)){$p.Kill();throw 'GUI full selftest hung'}
            $p.Refresh()
            if($p.ExitCode -ne 0){throw ("GUI selftest FAILED exit="+$p.ExitCode)}
          } finally {$p.Dispose()}
          $rec=Get-Content result/gui-self/gui-test-result.json -Raw|ConvertFrom-Json
          if($rec.result -ne 'PASS' -or -not(Test-Path result/gui-self/gui-screenshot.png)){throw 'GUI status/field/screenshots incomplete'}
          Write-Output H1638_VM_COMPILED_WINFORMS_ALL_GUI_FIELDS_REAL_CLI_CHECK_CONFIG_PASS
      - name: Verify real GUI Applied receipt and orphan WAL Stop denial
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          $csc=(Get-Content result/gui-portable/roslyn-path.txt -Raw).Trim()
          if(-not(Test-Path $csc)){throw 'Windows GUI Roslyn missing'}
          $fw='C:/Program Files (x86)/Reference Assemblies/Microsoft/Framework/.NETFramework/v4.8'
          $refs=@('mscorlib','System','System.Core','System.Drawing','System.Windows.Forms','System.Web.Extensions','System.ServiceProcess')|ForEach-Object {'/reference:'+(Join-Path $fw ($_.ToString()+'.dll'))}
          & $csc /nologo /noconfig /nostdlib+ /langversion:latest /target:exe /platform:x64 /utf8output /codepage:65001 ('/out:'+(Resolve-Path result/gui-authority).Path+'/Authority.exe') @refs ('/reference:'+(Resolve-Path result/gui-authority/WBD.exe).Path) r0/go_overlay/windows/gui/M0Plan020GUIAuthorityHarness.cs
          if($LASTEXITCODE -ne 0){throw 'GUI receipt harness compile failed'}
          & result/gui-authority/Authority.exe
          if($LASTEXITCODE -ne 0){throw 'GUI OS Applied/Stop guard FAIL'}
      - name: PerformClick real WinForms UI buttons in Windows VM
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $csc=(Get-Content result/gui-portable/roslyn-path.txt -Raw).Trim()
          $fw='C:/Program Files (x86)/Reference Assemblies/Microsoft/Framework/.NETFramework/v4.8'
          $refs=@('mscorlib','System','System.Core','System.Drawing','System.Windows.Forms','System.Web.Extensions','System.ServiceProcess')|ForEach-Object {'/reference:'+(Join-Path $fw ($_.ToString()+'.dll'))}
          & $csc /nologo /noconfig /nostdlib+ /langversion:latest /target:exe /platform:x64 /utf8output /codepage:65001 ('/out:'+(Resolve-Path result/gui-buttons).Path+'/Buttons.exe') @refs ('/reference:'+(Resolve-Path result/gui-buttons/WBD.exe).Path) r0/go_overlay/windows/gui/M0Plan028GUIButtonsVMHarness.cs
          if($LASTEXITCODE -ne 0){throw 'GUI buttons VM harness compile failed'}
          $dir=(Resolve-Path result/gui-buttons).Path
          $p=Start-Process -FilePath (Join-Path $dir 'Buttons.exe') -ArgumentList @($dir) -WorkingDirectory $dir -PassThru -Wait -NoNewWindow
          if($p.ExitCode -ne 0 -or -not(Test-Path result/gui-buttons/gui-buttons-vm.png)){throw 'actual WinForms button event VM test FAILED'}
          Write-Output H1638_ACTUAL_WINFORMS_GUI_BUTTON_EVENTS_PASSED_NOT_NATIVE_APPLIED
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1638-win-gui-vm-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            result/assembly.json
            result/gui-self/gui-test-result.json
            result/gui-self/gui-screenshot.png
            result/gui-buttons/gui-buttons-vm.png
            result/gui-buttons/gui-fec-fixed-vm.png
            result/gui-buttons/gui-fec-auto-vm.png
            result/gui-portable/h1653-compiled-gui-source.json
