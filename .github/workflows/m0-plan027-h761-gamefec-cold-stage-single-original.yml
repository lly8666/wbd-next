name: M0 PLAN027 H761 one source-locked Game2FEC after independent cold stage proof
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h761-gamefec-cold-stage-single-original.yml]
permissions: {contents: read, actions: write}
jobs:
  one-original-frozen-game2fec:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h761-game]')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: "0264c2cfc91e05c7c4b8d518fa0efc6707a2ff6b"
      BUILD: "41280564979"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Exact immutable product and one true cold Game2FEC native dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          for prior in 41294043519 41294043512 41294043535; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$prior" --jq .conclusion)" = success
          done
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100" |
            jq -e --arg win "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '
              [.artifacts[]|select(.expired==false)|.name] |
              index($win)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py tools/m0_wl_netem.py scenarios)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          from tools.m0_wl_native_step_runner import native_batch_deadline
          from pathlib import Path
          scene="scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json"
          s=read_scenario(scene)
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10 and s["tun_mtu"]==1400
          for direction in ("windows_to_linux","linux_to_windows"):
              x=s[direction]
              assert (x["offered_mbps"],x["delay_ms"],x["loss_pct"])==(1,25,0)
          assert native_batch_deadline({"WBD_WL_PUBLIC_MODES":"game2-fec","WBD_WL_V2_SCENARIO":scene})==250
          relay=Path("tools/m0_wl_gamefec_relay.py").read_text()
          e2e=Path("tools/m0_wl_public_normal_e2e.py").read_text()
          action=Path(".github/workflows/m0-wl-public-normal-full.yml").read_text()
          for marker in ("COLD_E2E_STARTED","COLD_WSL_IP_READY","COLD_TLS_CERT_READY",
                         "COLD_CLIENT_SPAWNED","COLD_READY_WAIT","COLD_READY_COMPLETE"):
              assert marker in relay and marker in e2e
          assert "BoundedSemaphore(3)" in relay
          assert "(inputs.public_mode == 'game2-fec' || inputs.public_mode == 'game4-fec') && '480'" in action
          print("H761_AUTHENTIC_GAME2FEC_SAME_FROZEN_PRODUCTS_COLD_STAGE_READY_NOT_PRODUCT_PASS",s["scenario_sha256"])
          PY
          scene="scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json"
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id' | head -1)"
          if [ -n "$old" ]; then echo "H761_ALREADY_DISPATCHED=$old"; exit 0; fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo "H761_ONE_ORIGINAL_GAME2FEC_NATIVE_DISPATCHED_NOT_PRODUCT_PASS SOURCE=$PRODUCT_SOURCE"
