name: 'H2244 original GE1pct real small UDP/TCP with bulk native two ISA A/B/A'
run-name: 'H2244 GE1% real UDP TCP p99 bulk A-B48-A source ${{ github.sha }}'
on:
  push:
    branches: ['feat/m0-h2244-native-tail-abca']
    paths:
      - '.github/workflows/qa-h2244-concurrent-smallflow-bulk-abca.yml'
      - 'tools/m0_h2244_native_tail_abca.py'
      - 'tools/m0_h2244_smallflow_echo.py'
      - 'tests/test_m0_h2244_smallflow_abca.py'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: h2244-real-small-tail-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: 'Scoped UDP+TCP sequence/nonce, exact-source native A/B/A and no gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/m0_h2244_native_tail_abca.py tools/m0_h2244_smallflow_echo.py
          python3 -m unittest tests.test_m0_h2244_smallflow_abca tests.test_m0_h2243_burst_fair_abca tests.test_m0_h2240_low_loss_timeline -v
          python3 - <<'PY'
          from pathlib import Path
          source=Path("crates/wbd-engine/src/v4_embedded_go.rs").read_text()
          assert 'V4_PUBLIC_H2240_TUN_WINDOW' in source
          assert 'WBD_H2241_ONE_ROUTE_PRESSURE_GATE' in source
          script=Path("tools/m0_h2244_native_tail_abca.py").read_text()
          assert 'os.environ["WBD_H2241_NATIVE_GATE"]="0"' in script
          assert 'node.start_client(1)' in script
          assert 'node.stop_client(1)' in script
          assert 'node.stop_server()' in script
          assert 'source_only_test_450mbit' in script
          print("H2244_BENCH_ONLY_DO_NOT_MERGE_REJECTED_GATE_ANCESTRY")
          PY
  native:
    needs: static
    name: 'Native ${{ matrix.arch }} actual Go TLS Rust TUN GE1% A/B/A UDP+TCP p99'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            arch: x86_64
          - host: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.host }}
    timeout-minutes: 42
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: One native pinned original product build per ISA, same real source
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$WBD_PLAN029_LINUX_EXPECTED_ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            iproute2 iptables iperf3 iputils-ping ethtool tcpdump \
            autoconf automake libtool make gcc g++ nasm openssl
          bash tools/m0_plan029_linux_dual_native_build.sh >h2244-build.log 2>&1 ||
            { tail -n 140 h2244-build.log;exit 2; }
          cargo +1.85.1 test --locked -p wbd-engine --lib --features \
            m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record \
            m0_h2241_exclusive_reader_gate_refuses_cross_route_or_generation_hol -- --nocapture
      - name: Real source-locked kernel 4 TCP flows + concurrent inner UDP/TCP each client generation
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/m0_h2244_native_tail_abca.py
          python3 - <<'PY'
          import json,os
          d=json.load(open('h2244-small-bulk-abca/summary.json'))
          assert d['source_sha']==os.environ['GITHUB_SHA']
          assert d['run_id']==os.environ['GITHUB_RUN_ID']
          assert d['arch']==os.uname().machine
          assert d['status']=='PASS_H2244_REAL_CONCURRENT_SMALL_UDP_TCP_ORIGINAL_TBF48_ORIGINAL_DIAGNOSTIC_ONLY'
          assert d['native_server_owned_stop'] and d['echo_server_owned_stop']
          assert [p['name'] for p in d['phases']]==[
              'original_before','tbf48kb_fq_codel','original_after']
          assert [p['burst_kib'] for p in d['phases']]==[0,48,0]
          assert len(d['direct_real_before_after'])==3
          assert all(
              p['bulk_tcp']['status']=='PASS_REAL_KERNEL_IPERF3_TCP'
              and p['smallflow']['status']=='PASS_SCOPED_REAL_INNER_UDP_TCP_ECHO'
              and p['original_client_owned_stop']['status']=='REAL_RUST_OWNED_STOP'
              and p['original_tun_to_m4_timeline']['status']==
                  'REAL_ORIGINAL_TUN200MS_AND_TX500MS_MONO_TICKS'
              and p['smallflow']['udp']['unique_replies']>=50
              and p['smallflow']['tcp']['unique_replies']>=50
              and p['smallflow']['udp']['latency_ms']['p99'] is not None
              and p['smallflow']['tcp']['latency_ms']['p99'] is not None
              and p['no_reader_gate']['status']=='ORIGINAL_PRODUCT_NO_GATE_RECEIPT'
              for p in d['phases'])
          print('H2244_TRUE_ORIGINAL_BULK_WITH_SMALL_UDP_TCP_P99_TWO_ISA_SCOPED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2244-${{ matrix.arch }}-ge1-real-udp-tcp-bulk-abca
          path: |
            h2244-small-bulk-abca/
            h2244-build.log
          retention-days: 10
          if-no-files-found: warn
