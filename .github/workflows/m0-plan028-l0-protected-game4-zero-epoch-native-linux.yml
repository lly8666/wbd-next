name: M0 PLAN028 L0 protected Game4 original TLS request-intent boundary
run-name: PLAN028 L0 native Linux tagged original TLS Game4 zero-epoch vs hot ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-l0-protected-game4-zero-epoch-native-linux.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: m0-plan028-l0-protected-game4-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-linux-original-tls-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Assemble frozen donor and verify Linux+cgo+both-tags test is staged on exact SOURCE
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(go env GOOS)" = linux
          test "$(go env CGO_ENABLED)" = 1
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          mkdir -p fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path
          r=json.loads(p("fixed-kernel-result/assembly.json").read_text())
          assert r["overlay_source"]==os.environ["GITHUB_SHA"],r
          assert r["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          # The base manifest intentionally installs only the original pinned
          # overlay operations, not every source-only Game Linux product file.
          # Reuse the already-qualified full-package staging from the native
          # Game4 workflow; no product branch, alternate protocol or fake owner.
          for part in ("internal/realityfront","internal/v4productcli"):
              for source in (p("r0/go_overlay")/part).glob("*.go"):
                  if source.name.endswith("_test.go"):
                      continue
                  target=p("legacy")/part/source.name
                  if target.is_file():
                      assert target.read_bytes()==source.read_bytes(),str(source)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(source.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              source=p("r0/go_overlay/internal/faketcp")/name
              target=p("legacy/internal/faketcp")/name
              assert not target.exists(),str(target)
              target.write_bytes(source.read_bytes())
          src=p("r0/go_overlay/internal/realityfront/admission_v4_game_linux_test.go").read_bytes()
          staged=p("legacy/internal/realityfront/admission_v4_game_linux_test.go").read_bytes()
          assert staged==src,"NOT exact assembled tagged original Go test"
          assert src.startswith(b"//go:build linux && cgo && wbd_v4_embedded_go && wbd_v4_fec2_product\n")
          assert b"func TestPLAN028Game4ProtectedEpochZeroWholeGroupVsSingleLane(" in src
          print("M0_PLAN028_L0_EXACT_SOURCE_NATIVE_LINUX_GAME4_TWO_TAG_TEST_ASSEMBLED")
          PY
      - name: Exactly ONE deterministic real original TLS Game4 cold zero-epoch vs single-hot test
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-product-build.log 2>&1 || {
            tail -70 fixed-kernel-result/rust-product-build.log >&2
            exit 1
          }
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestPLAN028Game4ProtectedEpochZeroWholeGroupVsSingleLane$' ./internal/realityfront) >fixed-kernel-result/game4-zero-epoch-exact-test.log 2>&1 || {
            tail -90 fixed-kernel-result/game4-zero-epoch-exact-test.log >&2
            exit 1
          }
          grep -Fq -- '=== RUN   TestPLAN028Game4ProtectedEpochZeroWholeGroupVsSingleLane' fixed-kernel-result/game4-zero-epoch-exact-test.log
          grep -Fq -- '--- PASS: TestPLAN028Game4ProtectedEpochZeroWholeGroupVsSingleLane' fixed-kernel-result/game4-zero-epoch-exact-test.log
          grep -Eq '^ok[[:space:]]+github.com/lly8666/wobuzhidao/internal/realityfront' fixed-kernel-result/game4-zero-epoch-exact-test.log
          cat fixed-kernel-result/game4-zero-epoch-exact-test.log
          echo M0_PLAN028_L0_ORIGINAL_TLS_PROTECTED_GAME4_ZERO_EPOCH_VS_SAME_EPOCH_SINGLE_HOT_BOUNDARY_EXECUTED_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-l0-protected-game4-zero-epoch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fixed-kernel-result/assembly.json
            fixed-kernel-result/game4-zero-epoch-exact-test.log
          if-no-files-found: warn
          retention-days: 14
