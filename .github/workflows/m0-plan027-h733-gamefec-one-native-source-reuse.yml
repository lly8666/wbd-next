name: M0 PLAN027 H733 one original Game2FEC 1M cold native after proven Windows rescue
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h733-gamefec-one-native-source-reuse.yml]
permissions: {contents: read, actions: write}
jobs:
  one-game2-fec-true-driver:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h733-game-rescue-native]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 0264c2cfc91e05c7c4b8d518fa0efc6707a2ff6b
      PRODUCT_BUILD_RUN: "41280564979"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate rescued Windows pwsh stage, exact frozen products, then dispatch one real two-OS GameFEC
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/41282410138" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/41282419599" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$PRODUCT_BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$PRODUCT_BUILD_RUN/jobs?per_page=100" |
            jq -e '[.jobs[] | select(.name=="Windows Go production and test compilation only" or .name=="Build true original Go and new Linux Rust peer persona from same SOURCE") | .conclusion] | length == 2 and all(.=="success")' >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$PRODUCT_BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg win "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '
              [.artifacts[] | select(.expired==false) | .name]
              | index($win)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py tools/m0_wl_native_step_runner.py tools/m0_wl_gamefec_progress.py scenarios)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario("scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json")
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10 and s["tun_mtu"]==1400
          assert s["warmup_s"]==3 and s["drain_s"]==5 and s["seed"]==20261029
          for k in ("windows_to_linux","linux_to_windows"):
              d=s[k]
              assert (d["offered_mbps"],d["delay_ms"],d["loss_pct"])==(1,25,0)
          print("M0_H733_GENUINE_GAMEFEC_FROZEN_SCENE",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg name "$title" '.workflow_runs[]|select(.display_title==$name)|.id' | head -1)"
          if [ -n "$prior" ];then echo "M0_H733_ALREADY_DISPATCHED=$prior";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main             -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene"             -f perf_reuse_run_id="$PRODUCT_BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo "M0_H733_ORIGINAL_GAME2FEC_REAL_NATIVE_DISPATCHED_NOT_PASS source=$PRODUCT_SOURCE"
