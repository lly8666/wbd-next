name: M0 PLAN027 H771 ONE original Game2FEC with verified management underlay pin
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h771-gamefec-one-with-management-guard.yml]
permissions: {contents: read, actions: write}
jobs:
  one-source-locked-game2fec:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h771-one-game]')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: "48ed7ffe82aafa17a125948068a2ca6ee6a1593e"
      BUILD: "41296364265"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Check actual Windows management crash fixture and dispatch one original Game2FEC
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          for prior in 41298983008 41299264368 41299264355 41298466562; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$prior" --jq .conclusion)" = success
          done
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100" |
            jq -e --arg win "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '
              [.artifacts[]|select(.expired==false)|.name] |
              index($win)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py scenarios)"
          python3 - <<'PY'
          from pathlib import Path
          from tools.m0_wl_native_step_runner import native_batch_deadline
          from tools.m0_wl_perf_v2_config import read_scenario
          scene="scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json"
          cfg=read_scenario(scene)
          assert cfg["public_mode"]=="game2-fec" and cfg["duration_s"]==10
          assert cfg["tun_mtu"]==1400
          for dr in ("windows_to_linux","linux_to_windows"):
              v=cfg[dr]
              assert (v["offered_mbps"],v["delay_ms"],v["loss_pct"])==(1,25,0)
          assert native_batch_deadline({"WBD_WL_PUBLIC_MODES":"game2-fec","WBD_WL_V2_SCENARIO":scene})==250
          flow=Path(".github/workflows/m0-wl-public-normal-full.yml").read_text()
          for marker in ("gamefec-mode-outcome.txt","gamefec-cold-stage.txt",
                         "gamefec-supervisor-timeout.txt",
                         "gamefec_management_route.ps1 -Action Arm",
                         "gamefec_management_route.ps1 -Action Restore"):
              assert marker in flow
          assert "(inputs.public_mode == 'game2-fec' || inputs.public_mode == 'game4-fec') && '480'" in flow
          print("H771_ONE_ACTUAL_GAME2FEC_SOURCE48ED_MANAGEMENT_ONLY_NOT_FULL_WAL_CRASH_PASS")
          PY
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json"
          existing="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -n1)"
          if [ -n "$existing" ]; then echo "H771_DUPLICATE_REFUSED=$existing";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json" \
            -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo "H771_ONE_REAL_NATIVE_DISPATCHED_NOT_PRODUCT_PASS source=$PRODUCT_SOURCE"
