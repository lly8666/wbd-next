name: M0 PLAN028 H1270 Fixed30 original RAW RX poll readiness 120s diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-h1270-fixed30-raw-rx-poll-readiness.yml"
      - "tools/m0-plan028-h1270-fixed30-raw-rx-readiness-report.py"
      - "crates/wbd-engine/src/v4_embedded_go.rs"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: m0-plan028-h1270-original-fixed30-raw-rx-poll-readiness
  cancel-in-progress: false
jobs:
  same-vm-native-x86-two-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {GOTOOLCHAIN: local, CGO_ENABLED: "1"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Compile exact-SOURCE original Go TLS + Rust real raw/TUN product
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 && test -c /dev/net/tun
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          mkdir -p fixed-build fixed-kernel-result
          python3 -m py_compile tools/m0-plan028-h1268-client-only-sndbuf-ab-netns.py tools/m0-plan028-h1268-client-only-sndbuf-report.py tools/m0-plan028-h1270-fixed30-raw-rx-readiness-report.py
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . \
            --manifest r0/go_overlay/assembly/manifest-plan020-m0.json \
            --receipt fixed-kernel-result/h1250-assembly.json
          python3 - <<'PY_ASSEMBLE'
          import json,os,pathlib
          root=pathlib.Path.cwd();donor=root/"legacy"
          r=json.loads((root/"fixed-kernel-result/h1250-assembly.json").read_text())
          assert r["overlay_source"]==os.environ["GITHUB_SHA"]
          assert r["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert not (donor/"internal/realityfront/v4_route_prelude.go").exists()
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in (
                      "admission_v4_test.go","v4_tls_handshake_contract_test.go"):
                      continue
                  dst=donor/part/src.name
                  if dst.exists():assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              src=root/"r0/go_overlay/internal/faketcp"/name
              dst=donor/"internal/faketcp"/name
              assert not dst.exists(),dst
              dst.write_bytes(src.read_bytes())
          for role in ("client","server"):
              dest=donor/("cmd/wbd-v4-"+role);dest.mkdir(parents=True,exist_ok=True)
              (dest/"main.go").write_bytes(
                  (root/("r0/go_overlay/cmd/wbd-v4-"+role+"/main.go")).read_bytes())
          print("H1250_SOURCE_LOCKED_ORIGINAL_GO_ASSEMBLY_PASS",flush=True)
          PY_ASSEMBLE
          rustup toolchain install 1.85.1 --profile minimal
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm autoconf automake libtool make gcc
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          test "$(git -C isa-l rev-parse HEAD)" = c387163fcbca62701d646149564c550c78a4f985
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/h1259-pinned-isal"
          export WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985
          (cd isa-l && ./autogen.sh && ./configure --prefix="$WBD_ISAL_PREFIX" --disable-shared --enable-static && make -j2 && make install) >fixed-kernel-result/h1259-isal-build.log 2>&1 || {
            tail -120 fixed-kernel-result/h1259-isal-build.log >&2;exit 1;
          }
          test -s "$WBD_ISAL_PREFIX/lib/libisal.a"
          nm -g "$WBD_ISAL_PREFIX/lib/libisal.a" | grep -Eq ' [TW] ec_encode_data$'

          cargo +1.85.1 test --locked -p wbd-platform \
            --lib m0_plan028_raw_tx_sndbuf_cold_readback_invalid_request_is_noop \
            -- --test-threads=1 --nocapture >fixed-kernel-result/h1267-sndbuf-unit.log 2>&1 || {
              tail -120 fixed-kernel-result/h1267-sndbuf-unit.log >&2
              exit 1
            }
          grep -q 'test result: ok. 1 passed; 0 failed' fixed-kernel-result/h1267-sndbuf-unit.log
          cargo +1.85.1 build --locked --release -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            >fixed-kernel-result/h1250-rust-build.log 2>&1 || {
              tail -120 fixed-kernel-result/h1250-rust-build.log >&2;exit 1;
            }
          nm target/release/libwbd_engine.so | grep -Eq ' [tT] ec_encode_data$'
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release"
          (cd legacy && go build -trimpath -buildvcs=false \
            -tags wbd_v4_embedded_go,wbd_v4_fec2_product \
            -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false \
            -tags wbd_v4_embedded_go,wbd_v4_fec2_product \
            -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          python3 - <<'PY_MANIFEST'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          checks={}
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              raw=(root/name).read_bytes()
              assert raw[:4]==b"\x7fELF" and struct.unpack_from("<H",raw,18)[0]==62
              checks[name]=hashlib.sha256(raw).hexdigest()
          (root/"manifest.json").write_text(json.dumps({
              "source_sha":os.environ["GITHUB_SHA"],
              "original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
              "go":"1.23.12","rust":"1.85.1","architecture":"native_x86_64",
              "sha256":checks,"qualification":"BUILD_ONLY_UNTIL_LOAD_REPORT"},indent=2)+"\n")
          print("H1250_NATIVE_CURRENT_SOURCE_BINARIES_BUILT_PASS",flush=True)
          PY_MANIFEST
      - name: One original native 120s Fixed6 30pct and Normal0 pair; read kernel poll vs worker readiness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          export WBD_M0_AB_LEG=default
          python3 -u tools/m0-plan028-h1268-client-only-sndbuf-ab-netns.py fixed-build \
            >fixed-kernel-result/h1270-native-run.log 2>&1 || {
              tail -170 fixed-kernel-result/h1270-native-run.log >&2
              exit 1
            }
          grep -Fq M0_H1268_NATIVE_ORIGINAL_TLS_RUST_FIXED30_CLIENT_ONLY_SNDBUF_120S_COMPLETE \
            fixed-kernel-result/h1270-native-run.log
          python3 tools/m0-plan028-h1270-fixed30-raw-rx-readiness-report.py \
            fixed-kernel-result/h1267-default
          python3 - <<'PY_H1270'
          import hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path("fixed-build/manifest.json").read_text())
          assert manifest["source_sha"]==os.environ["GITHUB_SHA"]
          for f,expected in manifest["sha256"].items():
              assert hashlib.sha256((pathlib.Path("fixed-build")/f).read_bytes()).hexdigest()==expected
          out=pathlib.Path("fixed-kernel-result/h1267-default")
          plan=json.loads((out/"h1250-matrix-plan.json").read_text())
          assert plan["cold_socket_ab_mode"]=="default"
          assert len(plan["clients"])==2
          r=json.loads((out/"h1270-rx-readiness-report.json").read_text())
          assert r["source_sha"]==os.environ["GITHUB_SHA"]
          assert r["actual_application_seconds"]==120
          observed=r["original_client_native_FIXED6_RAW_RX"]
          assert observed["number_500ms_samples"]>=50
          assert observed["native_rx_poll_ready_total"]>1000,observed
          assert observed["native_rx_poll_idle_total"]>0,observed
          assert observed["original_kernel_raw_receive_batches"]>1000,observed
          # Finish is a real diagnostic even when intermittent 1s blackout
          # does NOT reproduce: don't claim perf PASS or inject fake loss.
          print("M0_H1270_ORIGINAL_FIXED30_NATIVE_RAW_RX_POLL_WORKER_READBACK_DIAGNOSTIC_COMPLETE",
                json.dumps({"source_sha":r["source_sha"],
                            "original_rx_poll":observed,
                            "client_m4_typed_eagain":r["original_client_M4_TX_EAGAIN"]}),flush=True)
          PY_H1270
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1270-original-fixed30-raw-rx-worker-poll-120s
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/h1250-*
            fixed-kernel-result/h1267-*
            fixed-kernel-result/h1270-*
          retention-days: 14
          if-no-files-found: warn
