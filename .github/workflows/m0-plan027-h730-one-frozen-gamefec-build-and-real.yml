name: M0 PLAN027 H730 one fresh-source genuine GameFEC native no stale ABI reuse
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h730-one-frozen-gamefec-build-and-real.yml]
permissions: {contents: read, actions: write}
jobs:
  one-canonical-source-game2fec:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h730-game-fresh]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Exactly one 1Mbps 10s source-fresh Game2/FEC6 original TLS Rust cross-build and native scenario
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/41280390548" --jq .conclusion)" = failure
          test "$(gh api "repos/$GH_REPO/actions/runs/41280390548/jobs?per_page=100" |
            jq -r '.jobs[]|select(.name=="native-public-two-os")|.conclusion')" = failure
          grep -Fq 'GameFecProgress' tools/m0_wl_public_modes_e2e.py
          grep -Fq 'WBD_WL_GAME_FEC_RESCUE' .github/workflows/m0-wl-public-normal-full.yml
          grep -Fq 'M0_PLAN026_GAME_NATIVE_FIRST_ERROR' tools/m0_wl_public_normal_e2e.py
          python3 tools/prepare_windows_wiring.py --check-only
          python3 -m unittest -v tests.test_m0_wl_gamefec_progress
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario("scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json")
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10
          assert s["warmup_s"]==3 and s["drain_s"]==5 and s["tun_mtu"]==1400
          assert s["seed"]==20261029
          for direction in ("windows_to_linux","linux_to_windows"):
            d=s[direction]
            assert d["offered_mbps"]==1 and d["delay_ms"]==25 and d["loss_pct"]==0
          print("H730_ONE_FRESH_SOURCE_FROZEN_ORIGINAL_GAME2FEC_NATIVE",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          prev="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id' | head -n1)"
          if [ -n "$prev" ]; then echo "H730_ALREADY_DISPATCHED=$prev";exit 0;fi
          # NO old binary reuse. Same immutable new SOURCE for both Windows
          # Go/Rust DLL and Linux Go TLS Rust, then one true native E2E job.
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene"
          echo H730_ONE_ORIGINAL_SOURCE_GAMEFEC_NATIVE_BUILD_AND_MEASURE_DISPATCHED_NOT_PASS
