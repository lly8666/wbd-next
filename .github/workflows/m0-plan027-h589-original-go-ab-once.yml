# H590 repeat only after repaired H588 native-step regression contract
name: M0 PLAN027 H589 same-VM original GoA vs RustB precise peer exit stage
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h589-original-go-ab-once.yml]
permissions: {contents: read, actions: write}
jobs:
  once:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h589-original-ab]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: cb475c89a29bc79c1608b747e76e136fd9341500
      BUILD: "41177831521"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Source-verified old Go steady A vs Rust native B, one independent original Action
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" HEAD -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py)"
          python3 -m py_compile tools/m0_wl_public_normal_e2e.py tools/m0_wl_perf_v2_ab.py
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          scene=read_scenario('scenarios/plan027-c-normal-10m-25ms-loss0-60s.json')
          assert scene['public_mode']=='normal' and scene['duration_s']==60
          for d in ('windows_to_linux','linux_to_windows'):
              assert scene[d]['offered_mbps']==10
              assert scene[d]['delay_ms']==25 and scene[d]['loss_pct']==0
          print('H589_EXACT_BASELINE_SCENE',scene['scenario_sha256'])
          PY
          run="$(gh api "repos/$GH_REPO/actions/runs/$BUILD")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SOURCE"
          artifacts="$(gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100")"
          jq -e --arg n "m0-wl-windows-product-binaries-$SOURCE" '.artifacts[]|select(.name==$n and .expired==false)' <<<"$artifacts" >/dev/null
          jq -e '.artifacts[]|select(.name=="m0-plan024-linux-product" and .expired==false)' <<<"$artifacts" >/dev/null
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode=normal -f run_n0=false -f perf_ab=true \
              -f perf_scenario_file=scenarios/plan027-c-normal-10m-25ms-loss0-60s.json \
              -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$SOURCE"
          echo H589_ONE_ORIGINAL_AB_DISPATCHED_SAME_VM_SAME_BINARIES_B_THEN_A_NO_CPU_CLAIM
