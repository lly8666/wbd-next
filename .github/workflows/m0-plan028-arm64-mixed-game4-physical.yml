name: M0 PLAN028 ARM64 mixed443 Game4 real source4 and Normal Auto live mixed
run-name: PLAN028 H1162 ARM64 mixed443 Game4 source4/MTU with healthy Normal Auto
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-arm64-mixed-game4-physical.yml"
      - "tools/m0-plan028-arm64-mixed-game4-physical-fixture.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-arm64-mixed-game4-real-physical:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Pin original Go+Rust and assemble one complete ARM64 SOURCE
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test ! -e r0/go_overlay/internal/realityfront/v4_route_prelude.go
          mkdir -p fixed-build fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path.cwd(); donor=root/"legacy"
          rec=json.loads((root/"fixed-kernel-result/assembly.json").read_text(encoding="utf-8"))
          assert rec["overlay_source"]==os.environ["GITHUB_SHA"]
          assert rec["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in (
                      "admission_v4_test.go","v4_tls_handshake_contract_test.go"):
                      continue
                  dst=donor/part/src.name
                  if dst.exists():
                      assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              p=root/"r0/go_overlay/internal/faketcp"/name
              dst=donor/"internal/faketcp"/name
              assert not dst.exists(),str(dst)
              dst.write_bytes(p.read_bytes())
          # Test-only current-source V4 CLI config, not a second Go product.
          src=root/"r0/go_overlay/internal/v4productcli/secret_linux_test.go"
          dst=donor/"internal/v4productcli/secret_linux_test.go"
          if dst.exists():
              assert dst.read_bytes()==src.read_bytes()
          else:
              dst.write_bytes(src.read_bytes())
          for role in ("client","server"):
              dest=donor/("cmd/wbd-v4-"+role)
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"main.go").write_bytes((root/("r0/go_overlay/cmd/wbd-v4-"+role+"/main.go")).read_bytes())
          assert not (donor/"internal/realityfront/v4_route_prelude.go").exists()
          print("M0_PLAN028_ARM64_NATIVE_TLS_EXACT_SOURCE_ASSEMBLED source="+os.environ["GITHUB_SHA"],flush=True)
          PY
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-build.log 2>&1 || {
            tail -110 fixed-kernel-result/rust-build.log >&2
            exit 1
          }
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^(TestPLAN028SharedNormalPerClientFECProtectedCapability|TestPLAN028MixedOne443OriginalProtectedNormalGame2Game4ColdPolicy|TestR0V4ActualProtectedPeerHandshakeAllCiphers)$' ./internal/realityfront) >fixed-kernel-result/plan028-h1151-protected-policy-unit.log 2>&1 || {
            tail -120 fixed-kernel-result/plan028-h1151-protected-policy-unit.log >&2
            exit 1
          }
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestPLAN028OriginalPublicRecordCipherClientScope$' ./internal/v4productcli) >>fixed-kernel-result/plan028-h1151-protected-policy-unit.log 2>&1 || {
            tail -120 fixed-kernel-result/plan028-h1151-protected-policy-unit.log >&2
            exit 1
          }
          for marker in \
            "--- PASS: TestPLAN028SharedNormalPerClientFECProtectedCapability" \
            "--- PASS: TestPLAN028MixedOne443OriginalProtectedNormalGame2Game4ColdPolicy" \
            "--- PASS: TestR0V4ActualProtectedPeerHandshakeAllCiphers" \
            "--- PASS: TestPLAN028OriginalPublicRecordCipherClientScope";do
            grep -Fq -- "$marker" fixed-kernel-result/plan028-h1151-protected-policy-unit.log
          done
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,struct
          root=pathlib.Path("fixed-build")
          assert platform.machine()=="aarch64"
          sha={}
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==183,name
              sha[name]=hashlib.sha256(b).hexdigest()
          m={"source_sha":os.environ["GITHUB_SHA"],"original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
             "architecture":"native_aarch64","go":"1.23.12","rust":"1.85.1",
             "sha256":sha,"qualification":"BUILD_ONLY_UNTIL_MIXED_NORMAL_ORIGINAL_TLS_NATIVE_REAL_IO"}
          (root/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print("M0_PLAN028_H1157_NATIVE_ARM64_ORIGINAL_GO_RUST_TLS_BUILD_PASS",flush=True)
          PY
      - name: ARM64 actual mixed original TLS Game4 physical source4 and Normal Auto independent native UDP
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64 && test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          python3 tools/m0-plan028-arm64-mixed-game4-physical-fixture.py "$RUNNER_TEMP/h1162-original-mixed-physical.sh"
          bash -n "$RUNNER_TEMP/h1162-original-mixed-physical.sh"
          bash "$RUNNER_TEMP/h1162-original-mixed-physical.sh" fixed-build \
            >fixed-kernel-result/plan028-h1162-arm64-mixed-game4-source4.log 2>&1 || {
              tail -200 fixed-kernel-result/plan028-h1162-arm64-mixed-game4-source4.log >&2
              exit 1
            }
          grep -Fq "M0_PLAN028_H1162_ARM64_MIXED_NORMAL_LIVE48_GAME4_PHYSICAL_NEW32_STOP_PASS" \
            fixed-kernel-result/plan028-h1162-arm64-mixed-game4-source4.log
          grep -Fq "M0_PLAN028_H1151_X86_ORIGINAL_TLS_ONE443_NORMAL_GAME2_GAME4_FEC6_48_REAL_UDP_EXACT_STOP_PASS" \
            fixed-kernel-result/plan028-h1162-arm64-mixed-game4-source4.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"] and m["architecture"]=="native_aarch64"
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==183,name
              assert hashlib.sha256(b).hexdigest()==m["sha256"][name],name
          base=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1151-mixed-one443.json").read_text())
          proof=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1162-mixed-game4-physical.json").read_text())
          assert base["server_port"]==443 and base["native_peers"]==["game2-off-ChaCha","game4-fixed6-AES256","normal-auto-AES128"]
          assert base["real_udp_echoes"]=={"game2":12,"game4":18,"normal":18}
          assert base["game2_stop_did_not_stop_game4_or_normal"] and base["shared_rust_tun_reader_final_stop"]
          assert proof["shared_port"]==443 and proof["game4_lanes"]==4
          assert proof["source4_before"]=="10.25.0.3" and proof["source4_after"]=="10.25.0.9"
          assert proof["outer_user_ipv4_mtu"]==1460 and proof["physical_new_mtu"]==1280
          assert proof["game4_old_inner_os_mtu"]==1358 and proof["game4_new_inner_os_mtu"]==1178
          assert proof["normal_old_inner_os_mtu"]==1375 and proof["normal_new_inner_os_mtu"]==1375
          assert proof["normal_live_udp_echoes"]==48 and proof["game4_new_udp_echoes"]==32
          assert proof["new_tls_auth_ready"] and proof["old_exact_stop"] and proof["normal_not_reauthenticated"]
          assert proof["notifier_to_tls_start_ms"]=="NOT_MEASURED"
          assert proof["auth_to_first_packet_ms"]=="NOT_MEASURED"
          print("M0_PLAN028_H1162_NATIVE_ARM64_MIXED_REAL_GAME4_ROUTE_CHANGE_NORMAL_UNINTERRUPTED_SOURCE_SHA_PASS")
          PY
          cat fixed-kernel-result/plan028-h1162-mixed-game4-physical.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-h1162-native-arm64-mixed-game4-physical-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/assembly.json
            fixed-kernel-result/plan028-h1151-protected-policy-unit.log
            fixed-kernel-result/plan028-h1162-arm64-mixed-game4-source4.log
            fixed-kernel-result/plan028-h1162-mixed-game4-physical.json
            fixed-kernel-result/plan028-h1162-game4-os-route.json
            fixed-kernel-result/plan028-h1162-game4-os-link.json
            fixed-kernel-result/plan028-h1151-mixed-one443.json
            fixed-kernel-result/plan028-h1151-alice-tun.json
            fixed-kernel-result/plan028-h1151-bob-tun.json
            fixed-kernel-result/plan028-h1151-carol-tun.json
            fixed-kernel-result/plan028-h1151-server-tun.json
          if-no-files-found: warn
          retention-days: 14
