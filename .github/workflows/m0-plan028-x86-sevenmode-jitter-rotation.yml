name: PLAN028 native x86/x86 seven-mode jittered rotation
run-name: PLAN028 H1226 seven modes 18s +/-3s 4 swaps real multi-device native UDP
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-x86-sevenmode-jitter-rotation.yml"
      - "tools/m0-plan028-x86-jittered-seven-modes-fixture.py"
      - "r0/go_overlay/internal/v4productcli/linux.go"
      - "r0/go_overlay/internal/v4productcli/path_supervisor_linux.go"
      - "r0/go_overlay/internal/v4productcli/path_linux_test.go"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate all complete scenario generators before expensive native SOURCE build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m0-plan028-x86-jittered-seven-modes-fixture.py
          for scene in normal-off normal-fixed6 normal-auto game2-off game2-fixed6 game4-off game4-fixed6;do
            python3 tools/m0-plan028-x86-jittered-seven-modes-fixture.py "$RUNNER_TEMP/preflight-$scene.sh" "$scene"
            bash -n "$RUNNER_TEMP/preflight-$scene.sh"
          done
          echo "PLAN028_H1226_SEVEN_SCENE_SYNTAX_PREFLIGHT_PASS"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Pin original Go+Rust and assemble one complete X86_64 SOURCE
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test ! -e r0/go_overlay/internal/realityfront/v4_route_prelude.go
          mkdir -p fixed-build fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path.cwd(); donor=root/"legacy"
          rec=json.loads((root/"fixed-kernel-result/assembly.json").read_text(encoding="utf-8"))
          assert rec["overlay_source"]==os.environ["GITHUB_SHA"]
          assert rec["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in (
                      "admission_v4_test.go","v4_tls_handshake_contract_test.go"):
                      continue
                  dst=donor/part/src.name
                  if dst.exists():
                      assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              p=root/"r0/go_overlay/internal/faketcp"/name
              dst=donor/"internal/faketcp"/name
              assert not dst.exists(),str(dst)
              dst.write_bytes(p.read_bytes())
          # Test-only current-source V4 CLI and real native route/timer
          # unit tests: copy into the pinned temporary original Go clone.
          for name in ("secret_linux_test.go","path_linux_test.go"):
              src=root/"r0/go_overlay/internal/v4productcli"/name
              dst=donor/"internal/v4productcli"/name
              if dst.exists():
                  assert dst.read_bytes()==src.read_bytes()
              else:
                  dst.write_bytes(src.read_bytes())
          for role in ("client","server"):
              dest=donor/("cmd/wbd-v4-"+role)
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"main.go").write_bytes((root/("r0/go_overlay/cmd/wbd-v4-"+role+"/main.go")).read_bytes())
          assert not (donor/"internal/realityfront/v4_route_prelude.go").exists()
          print("M0_PLAN028_X86_64_NATIVE_TLS_EXACT_SOURCE_ASSEMBLED source="+os.environ["GITHUB_SHA"],flush=True)
          PY
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-build.log 2>&1 || {
            tail -110 fixed-kernel-result/rust-build.log >&2
            exit 1
          }
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^(TestPLAN028SharedNormalPerClientFECProtectedCapability|TestPLAN028MixedOne443OriginalProtectedNormalGame2Game4ColdPolicy|TestR0V4ActualProtectedPeerHandshakeAllCiphers)$' ./internal/realityfront) >fixed-kernel-result/plan028-h1151-protected-policy-unit.log 2>&1 || {
            tail -120 fixed-kernel-result/plan028-h1151-protected-policy-unit.log >&2
            exit 1
          }
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestPLAN028OriginalPublicRecordCipherClientScope$' ./internal/v4productcli) >>fixed-kernel-result/plan028-h1151-protected-policy-unit.log 2>&1 || {
            tail -120 fixed-kernel-result/plan028-h1151-protected-policy-unit.log >&2
            exit 1
          }
          for marker in \
            "--- PASS: TestPLAN028SharedNormalPerClientFECProtectedCapability" \
            "--- PASS: TestPLAN028MixedOne443OriginalProtectedNormalGame2Game4ColdPolicy" \
            "--- PASS: TestR0V4ActualProtectedPeerHandshakeAllCiphers" \
            "--- PASS: TestPLAN028OriginalPublicRecordCipherClientScope";do
            grep -Fq -- "$marker" fixed-kernel-result/plan028-h1151-protected-policy-unit.log
          done
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,struct
          root=pathlib.Path("fixed-build")
          assert platform.machine()=="x86_64"
          sha={}
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62,name
              sha[name]=hashlib.sha256(b).hexdigest()
          m={"source_sha":os.environ["GITHUB_SHA"],"original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
             "architecture":"native_x86_64","go":"1.23.12","rust":"1.85.1",
             "sha256":sha,"qualification":"BUILD_ONLY_UNTIL_MIXED_NORMAL_ORIGINAL_TLS_NATIVE_REAL_IO"}
          (root/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print("M0_PLAN028_H1151_NATIVE_X86_64_ORIGINAL_GO_RUST_TLS_BUILD_PASS",flush=True)
          PY
          (cd legacy && go test -count=1 -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^(TestPLAN028TimedRotation(ReusesNativeSamePathGeneration|DisabledAndBoundedConfig)|TestPLAN028JitteredAutomaticColdRotationBounds)$' ./internal/v4productcli)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan028-h1226-native-x86-build-${{ github.sha }}
          path: fixed-build/
          retention-days: 7
  scene:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scene: [normal-off, normal-fixed6, normal-auto, game2-off, game2-fixed6, game4-off, game4-fixed6]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plan028-h1226-native-x86-build-${{ github.sha }}
          path: fixed-build/
      - name: Verify exact single-built original TLS/Rust native x86 binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          chmod +x fixed-build/wbd-v4-client fixed-build/wbd-v4-server
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"] and m["architecture"]=="native_x86_64"
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62
              assert hashlib.sha256(b).hexdigest()==m["sha256"][name]
          print("PLAN028_H1222_SHARED_BINARY_SHA_NATIVE_X86_VERIFIED",flush=True)
          PY
      - name: One real physical-unchanged interval-rotated native client with two continuously active siblings
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          python3 -m py_compile tools/m0-plan028-x86-jittered-seven-modes-fixture.py
          python3 tools/m0-plan028-x86-jittered-seven-modes-fixture.py \
            "$RUNNER_TEMP/timed-${{ matrix.scene }}.sh" "${{ matrix.scene }}"
          bash -n "$RUNNER_TEMP/timed-${{ matrix.scene }}.sh"
          mkdir -p fixed-kernel-result
          bash "$RUNNER_TEMP/timed-${{ matrix.scene }}.sh" fixed-build \
            >"timed-${{ matrix.scene }}.log" 2>&1 || {
              tail -220 "timed-${{ matrix.scene }}.log" >&2
              exit 1
            }
          grep -Fq "M0_PLAN028_H1226_JITTERED_ALL_MODES_REAL_UDP_PASS ${{ matrix.scene }}" \
            "timed-${{ matrix.scene }}.log"
          test -s fixed-kernel-result/timed-evidence.json
          python3 - <<'PY'
          import json,os,pathlib
          j=json.loads(pathlib.Path("fixed-kernel-result/timed-evidence.json").read_text())
          assert j["status"]=="PASS" and j["physical_interface_ipv4_unchanged"]
          assert j["target_authenticated_generations"]==[1,2,3,4,5]
          assert j["exact_old_stops"]==[1,2,3,4] and j["sibling_real_udp_live"]
          assert j["rotation_delays_ms"] and all(15000<=x<=21000 for x in j["rotation_delays_ms"])
          assert all(s["sent"]==s["received"] for s in j["streams"].values())
          if j["mode_scene"].startswith("game"):
              assert j["all_game_lanes_original_TLS_M4_group_handoff"]["each_lane_new_tuple_every_group_generation"]
              assert j["all_game_lanes_original_TLS_M4_group_handoff"]["individual_lane_without_sibling_restart"]=="NOT_IMPLEMENTED_OR_TESTED"
          print("M0_PLAN028_H1226_NATIVE_X86_SEVEN_MODE_JITTER_SOURCE_LOCKED_SCENE_PASS",j["mode_scene"],flush=True)
          PY
          cat fixed-kernel-result/timed-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1226-x86-jitter-${{ matrix.scene }}-${{ github.run_id }}
          path: |
            timed-${{ matrix.scene }}.log
            fixed-kernel-result/timed-*.json
            fixed-kernel-result/timed-*.log
          if-no-files-found: warn
          retention-days: 14
