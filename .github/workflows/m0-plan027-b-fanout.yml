# PLAN027: fan out only after real Windows Npcap/Wintun to Linux
# original Go/Rust Normal business and owned Stop success.
name: M0 PLAN027 B source-locked single-mode fanout
on:
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions: {contents: read, actions: write}
concurrency:
  group: m0-plan027-b-fanout-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  dispatch-only:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[plan027-b-normal]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Source-identical per-mode real original Windows Linux functional Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ORIGINAL_SHA: ${{ github.event.workflow_run.head_sha }}
          ORIGINAL_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$ORIGINAL_SHA" ||
            { echo 'main changed; refuse non-frozen fanout'; exit 1; }
          test "$(gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$ORIGINAL_SHA" "$RUNNER_TEMP/artifacts"
          grep -Fx "m0-plan024-linux-product" "$RUNNER_TEMP/artifacts"
          # Normal is already done: distinct Actions, one mode/VM each.
          # Each validates exact original source SHA and binary checksums.
          for mode in fixed auto game2 game4 game2-fec game4-fec; do
            gh workflow run m0-wl-public-normal-full.yml --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_ab=false \
              -f perf_reuse_run_id="$ORIGINAL_RUN" \
              -f perf_binary_source_sha="$ORIGINAL_SHA"
            echo "PLAN027_B_MODE_DISPATCHED mode=$mode source=$ORIGINAL_SHA binary_run=$ORIGINAL_RUN"
          done
