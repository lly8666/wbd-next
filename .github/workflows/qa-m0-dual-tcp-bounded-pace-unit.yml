name: M0 dual Rust bounded pacing native core tests
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths: ['.github/workflows/qa-m0-dual-tcp-bounded-pace-unit.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7aafa40a0acd1ae18709c5c41d72befd9f1707c2
          persist-credentials: false
      - name: Native complete TCP core including bounded native pacing regression
        run: |
          test "$(git rev-parse HEAD)" = "7aafa40a0acd1ae18709c5c41d72befd9f1707c2"
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --lib v4_rust_tcp
