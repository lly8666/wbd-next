name: M0 PLAN027 H684 next rung authentic source6ece 100Mbps original Windows WSL2
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h684-original-normal-100mbps-next-rung.yml]
permissions: {contents: read, actions: write}
jobs:
  one-real-100m-next-rung:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h684-100m]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 6ece9eab653f46a716e8d3a0927fb74bec4819e8
      HARNESS_SOURCE: 92354d5a70f34640918f61b25859ba0bb05989dd
      BUILD_RUN: "41226521824"
      PRIOR_50: "41238777543"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Same source original 50M PASS required, one 100M unique real OS capacity action
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$PRIOR_50" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$PRIOR_50/jobs?per_page=100" |
            jq -e '[.jobs[]|select(.name=="native-public-two-os")|.conclusion]|.==["success"]' > /dev/null
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$HARNESS_SOURCE"
          test -z "$(git diff --name-only "$HARNESS_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-c-normal-100m-25ms-loss0-60s.json')
          assert s['public_mode']=='normal' and s['tun_mtu']==1400 and s['duration_s']==60
          for d in ('windows_to_linux','linux_to_windows'):
              x=s[d];assert x['offered_mbps']==100 and x['delay_ms']==25 and x['loss_pct']==0
              assert [y['udp_payload_bytes'] for y in x['packet_mix']]==[64,128,512,1200]
          print('H684_SIGNED_ORIGINAL_100MBPS_ON_REAL_TWO_OS_AFTER_TRUE_50M',s['scenario_sha256'])
          PY
          scene=scenarios/plan027-c-normal-100m-25ms-loss0-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|normal|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id'|head -1)"
          if [ -n "$old" ];then echo "H684_ALREADY_DISPATCHED action=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H684_ONE_REAL_ORIGINAL_SIGNED_WINDOWS_LINUX_100MBPS_C_APPLIED_DISPATCHED_NOT_PASS
