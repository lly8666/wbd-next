# Isolated v2: accepted PN counts by SACK vs duplicate ACK.
# Isolated experimental diagnostic. Production PR #71 and main unchanged.
name: M0 Game4 FEC 5pct ACK gap nomination source probe
run-name: "M0-GAME-FEC-ACK-HINT|${{ github.sha }}"
on:
  push:
    branches: [experiment/m0-game-fec-hint-probe-20261124]
    paths: [.github/workflows/m0-game-fec-hint-reason-probe.yml]
permissions: {contents: read, actions: read}
jobs:
  native-bundle-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Build exact original Go TLS client AND server plus Rust native shared M4 once
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          python3 - <<'PY'
          from pathlib import Path
          game=Path("crates/wbd-engine/src/v4_game_cosmetic_outer.rs").read_text()
          assert "ReceiptState" in game and "RepairBudget" in game
          assert "const INITIAL_ACK_STALL_NS" not in game
          win=Path("crates/wbd-engine/src/v4_windows_game_outer.rs").read_text()
          assert "win_v3_admit_shadow" in win
          ledger=Path("crates/wbd-engine/src/v4_presentation_ack.rs").read_text()
          assert "fn abandon_stalled" in ledger
          assert "fn sacks4" in ledger
          assert "l.ready.extend(l.shadow.on_timer(now).candidates)" in game
          for loss in (1,10,20):
              scene=Path(f"scenarios/m0-cosmetic-game2-loss{loss}-60s.json")
              assert scene.is_file(),scene
          raw=Path("crates/wbd-platform/src/linux_raw_carrier.rs").read_text()
          assert "ack.sacks().len().min(slots.len())" in raw
          product=Path("r0/go_overlay/internal/v4productcli/game_linux.go").read_text()
          assert "first_record_wire_bytes=%d copy_record_wire_bytes=%d" in product
          print("M0_GAME_NORMAL_V3_REWRITE_SOURCE_PRECHECK_PASS")
          PY
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc nasm
          sed -e 's/aarch64/x86_64/g' -e 's/arm64/amd64/g' tools/arm64_public_go_rust_bundle.sh > "$RUNNER_TEMP/m0-linux-native-amd64.sh"
          bash "$RUNNER_TEMP/m0-linux-native-amd64.sh"
          test -s amd64-public-bundle/manifest.json
          (cd amd64-public-bundle && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json,os
          m=json.load(open("amd64-public-bundle/manifest.json"))
          assert m["source_sha"]==os.environ["GITHUB_SHA"]
          assert m["architecture"]=="x86_64"
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-game-fec-hint-probe-product-${{ github.sha }}
          path: amd64-public-bundle/
          retention-days: 30
          if-no-files-found: error
  native-hint-probe:
    needs: native-bundle-once
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m0-game-fec-hint-probe-product-${{ github.sha }}
          path: native
      - name: Byte-lock the original GoTLS/Rust product built for this single experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('native');m=json.loads((p/'manifest.json').read_text())
          assert m['source_sha']==os.environ['SOURCE'] and m['architecture']=='x86_64'
          for line in (p/'SHA256SUMS').read_text().splitlines():
              digest,name=line.split(maxsplit=1)
              assert hashlib.sha256((p/name.removeprefix('*')).read_bytes()).hexdigest()==digest
          print('M0_FEC_HINT_EXPERIMENT_SOURCE',m['source_sha'])
          PY
          chmod +x native/wbd-v4-client native/wbd-v4-server
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl ethtool
          test -c /dev/net/tun
      - name: Same-runner original Game4 OFF5 then fixed-FEC5; single opt-in numeric hint probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sudo -n env GITHUB_SHA="$SOURCE" SOURCE="$SOURCE" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_JOB="$GITHUB_JOB" \
            python3 - <<'PY'
          import json,os,pathlib
          from tools.network_harness.m0_029_cosmetic_linux_dual_game import prepare,genuine_case,sha
          from tools.network_harness.runner import LinuxExperiment
          base=pathlib.Path(os.environ['GITHUB_WORKSPACE']);root=base/'out';bundle=base/'native'
          source=os.environ['SOURCE'];hashes={n:sha(bundle/n) for n in ('wbd-v4-client','wbd-v4-server','libwbd_engine.so')}
          plain=json.loads((base/'scenarios/m0-cosmetic-game4-loss5-60s.json').read_text())
          fec=json.loads((base/'scenarios/m0-cosmetic-game4-fec-loss30-60s.json').read_text())
          for side in ('windows_to_linux','linux_to_windows'):
              fec[side]['loss_pct']=5
              assert fec[side]==plain[side]
          fec['scenario_id']='m0-cosmetic-game4-fec-loss5-60s'
          links=root/'bundle-A'/'fixed-build';links.mkdir(parents=True,exist_ok=True)
          for n in hashes:(links/n).symlink_to(bundle/n)
          rows=[]
          for index,mode in enumerate(('game4','game4-fec'),1):
              scene=plain if mode=='game4' else fec
              cfg=prepare(scene,source,int(os.environ['GITHUB_RUN_ID']),mode)
              cfg['bundles']['A']['enable_game_fec_hint_probe']=True
              path=root/f'{index}-{mode}'
              leg=LinuxExperiment(cfg,root/'bundle-A',path,'A').run()
              result=genuine_case(scene,leg,path,hashes,source,mode)
              if result['status']!='PASS_BOTH_REAL_LINUX_NATIVE_OUTER_REPAIR':
                  raise RuntimeError(f'Native failure {mode}: {result["blockers"]}')
              probe=leg['telemetry']['game_outer_hint_probe']
              assert isinstance(probe,dict) and set(probe)=={'client','server'},probe
              for role in ('client','server'):
                  hint=probe[role]
                  assert hint['feedback']>0 and hint['feedback']==hint['with_sack']+hint['without_sack']
                  assert hint['probes_only']==1
                  assert hint['nominated_sack']+hint['nominated_dupack']>0
              row={'mode':mode,'source':source,'probe':probe,
                  'repair':result['repair'],'fec':leg['telemetry']['game_fec_native_proof'],
                  'netem_drops':result['netem_drops'],
                  'app':result['measured_app'],
                  'stop':result['cleanup']['owned_namespaces_absent']}
              assert row['stop'] and all(row['netem_drops'][side]>0 for side in ('client','server'))
              (path/'hint-reason.json').write_text(json.dumps(row,indent=2)+'\n')
              rows.append(row)
              print('M0_FEC5_ORIGINAL_HINT_REASON_NATIVE',json.dumps(row,sort_keys=True),flush=True)
          (root/'summary.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-game-fec5-hint-source-${{ github.sha }}
          path: |
            out/summary.json
            out/*/hint-reason.json
          retention-days: 30
          if-no-files-found: warn
