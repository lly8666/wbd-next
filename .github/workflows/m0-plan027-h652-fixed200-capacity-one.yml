name: M0 PLAN027 H652 one original Fixed200 host-capacity boundary
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h652-fixed200-capacity-one.yml]
permissions: {contents: read, actions: write}
jobs:
  fixed200:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h652-fixed200]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 11f1881ff68afa22c5b0ca957d6808420a878a06
      BUILD_RUN: "41210457594"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate current scenario and original source binaries, dispatch one real Windows plus Linux test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          # Frozen executable provenance is the real product source and SHA,
          # NOT a false requirement to revert H647's later B106 TEST oracle.
          # This guard is exactly the earlier H649 product-only guard which
          # passed and produced Fixed100 and Fixed50/300 real positive reports.
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py)"
          # Explicitly audit the sole expected test-side diff rather than
          # implicitly white-list any future changes to the harness.
          harness_delta="$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- tools/m0_wl_public_normal_e2e.py)"
          if [ -n "$harness_delta" ];then
            test "$harness_delta" = tools/m0_wl_public_normal_e2e.py
            # The existing real 106s bilateral-TLS proof is the only reason
            # the harness differs; forbid accidental loss of both checks.
            grep -q 'WBD_WINDOWS_ORIGINAL_GO_TLS_REAUTHORIZE generation=' tools/m0_wl_public_normal_e2e.py
            grep -q 'V4_PUBLIC_ORIGINAL_GO_TLS_REAUTHORIZE role=server' tools/m0_wl_public_normal_e2e.py
            echo H653_TEST_ORACLE_DELTA_REVIEWED_BINARY_PRODUCT_SOURCE_UNCHANGED
          fi
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario("scenarios/plan027-c-fixed-200m-25ms-loss0-60s.json")
          assert s["public_mode"]=="fixed" and s["duration_s"]==60 and s["tun_mtu"]==1400
          for name in ("windows_to_linux","linux_to_windows"):
              d=s[name]
              assert d["offered_mbps"]==200 and d["delay_ms"]==25 and d["loss_pct"]==0
              assert {x["udp_payload_bytes"] for x in d["packet_mix"]}=={64,128,512,1200}
          print("H652_FIXED200_BOUNDED_SOURCE_SCENE",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-c-fixed-200m-25ms-loss0-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|fixed|$scene"
          prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" | jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -1)"
          if [ -n "$prior" ];then echo "H652_ALREADY_REGISTERED run=$prior";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=fixed -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H652_ORIGINAL_TWO_OS_FIXED200_ONE_INDEPENDENT_ACTION_SENT_NOT_PASS
