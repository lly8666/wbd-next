name: M0 PLAN027 H489 original Linux TUN FQ kernel drop differential
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h489-tun-fq-differential.yml]
permissions: {contents: read, actions: write}
jobs:
  source-locked-rate-isolation:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-h489]') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Source locks, real C10 control, native TUN FQ kernel sampling
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          product='f83874c30e0d918cfe070b67b39e208eea0da457'
          build_run=41013628666
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)" = "$product"
          gh api "repos/$GH_REPO/actions/runs/$build_run/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/binaries"
          grep -Fx "m0-wl-windows-product-binaries-$product" "$RUNNER_TEMP/binaries"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/binaries"
          python -m unittest -q tests.test_m0_wl_plan027_windows_boundary tests.test_m0_wl_plan027_linux_tun_fq
          python -m py_compile tools/m0_wl_public_normal_e2e.py
          mkdir -p "$RUNNER_TEMP/c10"
          gh run download 41015331347 -R "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/c10"
          python - <<'PY'
          import os,json,pathlib
          from tools.m0_wl_perf_v2_config import read_scenario
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'c10/report.json').read_text())
          assert r['linux_binary_source']=='f83874c30e0d918cfe070b67b39e208eea0da457'
          assert r['stop']=='PASS_BOTH_OWNED' and r['WL_V2']['owned_stop']=='PASS_BOTH_OWNED'
          assert r['WL_V2']['status']=='MEASURED_BOTH_OS_KERNEL'
          assert r['WL_V2']['first_delivery_fraction']['windows']==1
          for name,rate,full in [('plan027-c-normal-100m-1200b-loss0-60s',100,True),
                                 ('plan027-c-normal-75m-mixed-loss0-60s',75,False)]:
              c=read_scenario('scenarios/'+name+'.json')
              assert c['public_mode']=='normal' and c['duration_s']==60 and c['tun_mtu']==1400
              for side in ('windows_to_linux','linux_to_windows'):
                  assert (c[side]['offered_mbps'],c[side]['delay_ms'],c[side]['loss_pct'])==(rate,25,0)
                  if full: assert c[side]['packet_mix']==[{'udp_payload_bytes':1200,'packets_weight':100}]
              print('H489_ACTUAL_NATIVE_PPS_DIFFERENTIAL_SOURCE',c['scenario_sha256'],name)
          PY
          for scene in plan027-c-normal-100m-1200b-loss0-60s plan027-c-normal-75m-mixed-loss0-60s; do
            gh workflow run m0-wl-public-normal-full.yml --ref main \
              -f public_mode=normal -f run_n0=false -f perf_ab=false \
              -f perf_scenario_file="scenarios/$scene.json" \
              -f perf_reuse_run_id="$build_run" -f perf_binary_source_sha="$product"
            echo "H489_STARTED_TRUE_NATIVE scene=$scene source=$product"
          done
