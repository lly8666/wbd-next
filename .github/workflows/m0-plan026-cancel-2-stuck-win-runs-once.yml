name: M0 cancel two source-locked stuck Windows WSL2 jobs ONCE
run-name: M0|CANCEL-WIN-STUCK-40859233957-40860233126
on:
  push:
    branches: [main]
    paths: [".github/workflows/m0-plan026-cancel-2-stuck-win-runs-once.yml"]
permissions:
  contents: read
  actions: write
jobs:
  cancel-two-verified-original-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only two exact stale stuck Windows native WSL2 runs
        shell: bash
        run: |
          set -euo pipefail
          while read -r run expected; do
            endpoint="repos/lly8666/wbd-next/actions/runs/$run"
            sha="$(gh api "$endpoint" --jq .head_sha)"
            test "$sha" = "$expected" || { echo "REFUSE source mismatch run=$run actual=$sha";exit 1; }
            state="$(gh api "$endpoint" --jq .status)"
            if [[ "$state" == completed ]];then
              echo "ALREADY_COMPLETED $run"
              continue
            fi
            echo "CANCEL_REQUESTED exact_run=$run source=$sha status=$state"
            gh api --method POST "$endpoint/cancel" >/dev/null || true
            sleep 5
            state="$(gh api "$endpoint" --jq .status)"
            if [[ "$state" != completed ]];then
              gh api --method POST "$endpoint/force-cancel" >/dev/null
              echo "FORCE_CANCEL_ACCEPTED $run"
            fi
          done <<'TARGETS'
          40859233957 a8df98e5c952953b2884af051ee0802d89dd759b
          40860233126 134914f4263f905047b1096c771609558bcdde82
          TARGETS
          echo "M0_STUCK_SOURCE_LOCKED_CANCEL_REQUESTS_DONE"
