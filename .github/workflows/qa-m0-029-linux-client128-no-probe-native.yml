# Plan029 G1 bounded internal client128 product candidate: actual non-probe
# native Linux Rust + ORIGINAL Go TLS, real TUN/AF_PACKET/Stop.
# x86 and ARM jobs independent; neither unit nor five-mode FUNC pass proves
# highline performance of this SOURCE, nor any Windows/physical WAN outcome.
# PLAN029 Linux-only current-source native qualification.
# Each job runs its OWN original Go client + original Go server + Rust engine.
# ubuntu-24.04-arm is a native aarch64 runner, NOT QEMU or a cross build.
# One ISA-L / Rust / Go build PER ISA, then five short netns sessions on that
# runner, same binary hashes. Not the Windows CN/FakeIP/GUI/WFP feature matrix.
name: M0 PLAN029 actual non-probe Linux Normal client128 dual ISA
run-name: "M0-029 true nonprobe Normal client128 x86/ARM | ${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: ['experiment/m0-029-throughput-arm-fair']
    paths:
      - '.github/workflows/qa-m0-029-linux-client128-no-probe-native.yml'
      - 'crates/wbd-engine/src/v4_embedded_go.rs'
      - 'crates/wbd-platform/src/linux_raw_carrier.rs'
      - 'crates/wbd-platform/src/rx_ipv4_tcp.rs'
      - 'r0/go_overlay/internal/v4productcli/linux.go'
      - 'tools/m0_029_product_shared_tun_noprobe.py'
      - 'tools/m0_plan029_linux_dual_native_build.sh'
      - 'r0/go_overlay/internal/realityfront/bridge_v4_embedded_linux.go'
      - 'tools/m0_plan029_linux_dual_isa_suite.py'
      - 'tools/m0_plan029_linux_native_app.py'
      - 'tools/arm64_linux_netns_smoke.sh'
      - 'tests/test_m0_plan029_linux_dual_native_scope.py'
permissions:
  contents: read
jobs:
  native-linux-two-endpoints:
    # An unrelated test-only push must not launch real namespace/driver tests.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m0-client128-product]')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 48
    concurrency:
      group: plan029-linux-native-${{ github.sha }}-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      WBD_PLAN029_LINUX_DUAL_ISA: "1"
      WBD_M0_029_NO_PROBE: "1"
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Exact SOURCE native ISA and compiler/prerequisite check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "$WBD_PLAN029_LINUX_EXPECTED_ARCH"
          test "$(go version | awk '{print $3}')" = go1.23.12
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            autoconf automake libtool make gcc nasm python3 iproute2 \
            iputils-ping iptables ethtool iperf3 openssl
          test -c /dev/net/tun
          sudo -n true
          python3 -m py_compile tools/m0_plan029_linux_dual_isa_suite.py \
            tools/m0_plan029_linux_native_app.py
          python3 -m unittest tests.test_m0_plan029_linux_dual_native_scope -v
          bash -n tools/m0_plan029_linux_dual_native_build.sh \
            tools/arm64_linux_netns_smoke.sh
          echo "PLAN029_LINUX_NATIVE_PRECONDITIONS_PASS isa=$(uname -m) source=$GITHUB_SHA"
      - name: Single exact-SOURCE original Go TLS / Rust / ISA-L native build and targeted core tests
        shell: bash
        run: |
          set -euo pipefail
          bash tools/m0_plan029_linux_dual_native_build.sh \
            > plan029-linux-build.log 2>&1 || {
              tail -n 125 plan029-linux-build.log >&2
              exit 1
            }
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform
          b=pathlib.Path("linux-plan029-public-bundle")
          m=json.loads((b/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"]
          assert m["architecture"]==platform.machine()==os.environ["WBD_PLAN029_LINUX_EXPECTED_ARCH"]
          for n,digest in m["sha256"].items():
              assert hashlib.sha256((b/n).read_bytes()).hexdigest()==digest
          assert m["rust_native_fec_acceleration"] is True
          assert m.get("m0_probe_compiled") is False, "developer probe must NOT be in product build"
          # Check product Rust library truly excludes the debug-only C ABI.
          import subprocess
          exported=subprocess.check_output(["nm","-D","linux-plan029-public-bundle/libwbd_engine.so"],text=True)
          assert "wbd_m0_embedded_go_loop_debug_pause_jumbo" not in exported
          print("M0_029_NO_PROBE_NATIVE_SYMBOL_ABSENT_PASS",flush=True)
          assert (m["normal_linux_client_shared_tun_inbox_default"],
                  m["normal_linux_server_shared_tun_inbox_default"],
                  m["game_group_shared_tun_inbox_default"])==(128,64,64)
          print("M0_029_ACTUAL_NO_PROBE_NORMAL_CLIENT128_BUILD_VERIFIED arch="+platform.machine(),flush=True)
          PY
      - name: Five original dual-endpoint Linux real kernel modes on this one ISA
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 test --locked -p wbd-engine --lib \
            --features m0_v4_embedded_go \
            m0_plan029_linux_normal_client_default_128_server_64 -- --nocapture
          # The original nonblocking TUN ingress must re-poll at most after
          # 32 actually consumed kernel packets and immediately after EAGAIN.
          cargo +1.85.1 test --locked -p wbd-engine --lib \
            --features m0_v4_embedded_go \
            m0_plan029_shared_tun_ingress_one_poll_per_ready_burst -- --nocapture
          cargo +1.85.1 test --locked -p wbd-engine --lib \
            --features m0_v4_embedded_go \
            m0_plan029_shared_tun_protocol_ingress_diagnostic_is_source_scoped -- --nocapture
          python3 -u tools/m0_plan029_linux_dual_isa_suite.py
          python3 - <<'PY'
          import json,os,pathlib,platform
          d=json.loads(pathlib.Path("linux-plan029-result/summary.json").read_text())
          assert d["source_sha"]==os.environ["GITHUB_SHA"]
          assert d["native_isa"]==platform.machine()
          assert d["status"]=="PASS_SCOPED_FIVE_REAL_LINUX_CLIENT_SERVER_MODES"
          assert len(d["cases"])==5
          assert all(c["status"]=="PASS_SCOPED_NATIVE_LINUX_TWO_ENDPOINTS" for c in d["cases"])
          # Check actual Go+kernel FQ default unchanged for every affected
          # dedicated mode/role after removing unsafe public fq1500. CLI
          # opt-in 900 must not silently alter normal/fixed/auto/Game.
          import re
          for case in d["cases"]:
              for role in ("client","server"):
                  raw=(pathlib.Path("linux-plan029-result")/case["label"]/
                       (role+".log")).read_text(errors="replace")
                  receipt=re.findall(
                      r"V4_PUBLIC_TUN_FQ role="+role+
                      r" interface=\S+ maxrate_mbps=(\d+) flow_limit_packets=(\d+) "
                      r"readback=kernel_fq_(\d+)Mbit",raw)
                  assert receipt==[("600","256","600")],(case["label"],role,receipt)
          # Dedicated native modes are not the shared M1 /32 case; that is
          # proved independently below with true authenticated Go/Rust.
          print("M029_TRUE_DEDICATED_NATIVE_FIVE_MODES_AND_FQ600_STOP_PASS arch="+platform.machine(),flush=True)
          PY
      - name: Original authenticated shared TUN Normal no-probe true four-flow plus small app
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/m0_029_product_shared_tun_noprobe.py
          python3 -u tools/m0_029_product_shared_tun_noprobe.py
          python3 - <<'PY'
          import json,os,pathlib,platform
          d=json.loads(pathlib.Path("m029-product-shared-noprobe/summary.json").read_text())
          assert d["source_sha"]==os.environ["GITHUB_SHA"]
          assert d["arch"]==platform.machine()
          assert d["probe_compiled"] is False
          assert d["outer_repair_cli"]=="off_both_endpoints"
          assert all(v and set(v)=={0} for v in d["outer_repair_native_stop_readback"].values())
          assert d["status"]=="PASS_SCOPED_REAL_NO_PROBE_SHARED_TUN_NORMAL_128_64"
          assert d["cold_readbacks"]["client"]["slots"]==128
          assert d["cold_readbacks"]["server"]["slots"]==64
          assert all(x["generation"]>0 and x["probe_only"]==0
                     for x in d["cold_readbacks"].values())
          assert all(x["generation"]>0 for x in d["owned_stop"].values())
          assert d["measurement"]["original_product_tcp"]["tcp_streams"]==4
          assert d["measurement"]["smallflow"]["status"]=="PASS_SCOPED_REAL_INNER_UDP_TCP_ECHO"
          assert all(d["shared_tun_protocol_ingress"][role]
                     for role in ("client","server"))
          print("M029_REAL_NATIVE_NONPROBE_AUTHENTICATED_SHARED_TUN_CLIENT128_SERVER64_STOP_PASS",flush=True)
          PY
      - name: Same-runner A -> B -> A-prime one-factor UDP pending slot trial, raw result only
        if: contains(github.event.head_commit.message, '[m0-udp-fair-abca]')
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for leg in A B Aprime; do
            WBD_M0_029_UDP_RESERVE_LEG="$leg" \
              python3 -u tools/m0_029_product_shared_tun_noprobe.py
          done
          python3 - <<'PY'
          import json,os,pathlib
          d=[]
          for leg in ("A","B","Aprime"):
              p=pathlib.Path("m029-product-shared-noprobe-"+leg)/"summary.json"
              row=json.loads(p.read_text())
              assert row["source_sha"]==os.environ["GITHUB_SHA"]
              assert row["status"]=="PASS_SCOPED_REAL_NO_PROBE_SHARED_TUN_NORMAL_128_64"
              assert row["trial_leg"]==leg and row["test_only_udp_reservation"]==(leg=="B")
              assert row["probe_compiled"] is False
              assert row["outer_repair_cli"]=="off_both_endpoints"
              assert all(v and set(v)=={0}
                         for v in row["outer_repair_native_stop_readback"].values())
              assert all(x["generation"]>0 for x in row["owned_stop"].values())
              assert all(x["slots"]==(128 if role=="client" else 64)
                         for role,x in row["cold_readbacks"].items())
              assert row["measurement"]["smallflow"]["udp"]["requests_sent"]==160
              d.append(row)
          assert d[0]["same_release_binary_sha256"]==d[1]["same_release_binary_sha256"]==d[2]["same_release_binary_sha256"]
          def read(x):
              client=x["shared_tun_protocol_ingress"]["client"]
              udp=x["measurement"]["smallflow"]["udp"]
              tcp=x["measurement"]["smallflow"]["tcp"]
              return {"receiver_mbps":x["measurement"]["original_product_tcp"]["receiver_bps"]/1e6,
                      "client_cpu_s_per_gib":x["measurement"]["cpu_and_rss"]["client"]["cpu_seconds"]/(
                          x["measurement"]["original_product_tcp"]["receiver_bytes"]/1073741824),
                      "udp_missing_of160":udp["missing"],"udp_survivor_p99_ms":udp["latency_ms"]["p99"],
                      "tcp_missing_of160":tcp["missing"],"tcp_survivor_p99_ms":tcp["latency_ms"]["p99"],
                      "client_new_udp_dropped":sum(y["udp_new_dropped"] for y in client),
                      "client_tcp_pending_displaced":sum(y["tcp_pending_displaced"] for y in client)}
          out={"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],
               "attempt":os.environ["GITHUB_RUN_ATTEMPT"],"arch":os.environ["WBD_PLAN029_LINUX_EXPECTED_ARCH"],
               "same_native_binary_sha256":d[0]["same_release_binary_sha256"],
               "legs":[dict(leg=tag,**read(x)) for tag,x in zip(("A","B","Aprime"),d)],
               "conclusion":"MEASURED_ONLY_NOT_PRODUCT_QOS_PASS",
               "limitation":"A/B/A-prime same-runner genuine Go TLS Rust product; diagnostic ON all legs; no source performance causal claim until original drift, dropped denominator and CPU assessed."}
          pathlib.Path("m029-udp-slot-abca").mkdir(exist_ok=False)
          pathlib.Path("m029-udp-slot-abca/summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print("M0_029_UDP_SINGLE_FACTOR_ABAPRIME_MEASURED_ONLY "+json.dumps(out["legs"]),flush=True)
          PY
      - name: Upload same-SOURCE scoped native diagnostics (no secret files or raw captures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-029-normal-client128-product-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            plan029-linux-build.log
            linux-plan029-public-bundle/manifest.json
            linux-plan029-public-bundle/SHA256SUMS
            linux-plan029-result/
            m029-product-shared-noprobe/
            m029-product-shared-noprobe-A/
            m029-product-shared-noprobe-B/
            m029-product-shared-noprobe-Aprime/
            m029-udp-slot-abca/
          retention-days: 21
          if-no-files-found: warn
