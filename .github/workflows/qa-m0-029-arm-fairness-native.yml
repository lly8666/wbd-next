# M0 PLAN029 first isolated service-order primitive. Native Rust tests only:
# does NOT certify real Go TLS/TUN/AF_PACKET application goodput or Stop.
name: M0 PLAN029 shared TUN lease fairness native unit
run-name: "M0 PLAN029 unit ARM+x86 source ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-029-throughput-arm-fair']
    paths:
      - '.github/workflows/qa-m0-029-arm-fairness-native.yml'
      - 'crates/wbd-engine/src/v4_embedded_go.rs'
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: m0-029-fair-native-${{ github.sha }}
  cancel-in-progress: false
jobs:
  unit-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Exact source and ISA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "${{ matrix.arch }}"
          test -f crates/wbd-engine/src/v4_embedded_go.rs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('crates/wbd-engine/src/v4_embedded_go.rs').read_text()
          assert 'fn m0_plan029_shared_tun_fair_turn_rotates_twelve_pending_leases()' in s
          assert 'SHARED_TUN_PENDING_PER_ROUTE:usize=8' in s
          assert 'SHARED_TUN_DRAIN_PER_TURN:usize=64' in s
          assert 'let mut fair=SharedTunFairTurn::default();' in s
          assert 'WBD_H2241_ONE_ROUTE_PRESSURE_GATE' not in s
          print('M0_029_CLEAN_MAIN_TEST_ONLY_FROZEN_SOURCE',flush=True)
          PY
      - name: Actual native Rust Linux bounded lease/FIFO/Stop unit tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --lib \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record \
            shared_tun -- --nocapture
          # Separate filter: its exact name does not contain 'shared_tun'.
          cargo +1.85.1 test --locked -p wbd-engine --lib \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record \
            m0_plan029_fair_turn_still_expires_routes_after_global_budget -- --nocapture
          echo "M0_PLAN029_SHARED_TUN_AND_EXPIRED_BUDGET_NATIVE_PASS source=$GITHUB_SHA isa=$(uname -m) attempt=$GITHUB_RUN_ATTEMPT"
