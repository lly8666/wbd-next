name: 'H2225 reproduce Health dead90 cause with signed full Windows native GUI and Linux ARM64 control'
on:
  push:
    branches: ['release/h2225-win64-health-dead-diag-20261120']
    paths:
      - '.github/workflows/qa-h2225-windows-health-diag-delivery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  windows-real-original-tls:
    runs-on: windows-2025
    timeout-minutes: 55
    env: {GOTOOLCHAIN: local}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', cache: false}
      - name: Source-locked overlay, Go native client, idle READY and TLS retries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD) -ne $env:GITHUB_SHA){throw 'source mismatch'}
          python tools/prepare_windows_wiring.py > h2224-assembly.log
          if($LASTEXITCODE -ne 0){Get-Content h2224-assembly.log -Tail 40;throw 'assembly mismatch'}
          Push-Location legacy
          try{
            go test -count=1 -tags wbd_v4_embedded_go -run '^TestH222[34]' ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'H2224 idle and original TLS tests failed'}
            go test -count=1 -tags wbd_v4_embedded_go -run '^TestM0PLAN027WindowsColdRetryRequiresAuthenticatedDeadAndNoAppliedOS$' ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'legacy cold retry regression'}
            go build -trimpath -tags wbd_v4_embedded_go -o ../wbd-client.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'real original-Go Windows binary failed'}
          }finally{Pop-Location}
      - name: Build pinned ISA-L MSVC x64 static dependency
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          choco install nasm -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'NASM install failed'}
          $nasm=@('C:\Program Files\NASM','C:\ProgramData\chocolatey\bin')|Where-Object {Test-Path (Join-Path $_ 'nasm.exe')}|Select-Object -First 1
          if(-not $nasm){throw 'NASM missing'}
          Add-Content -Path $env:GITHUB_PATH -Value $nasm
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          if($LASTEXITCODE -ne 0){throw 'ISA-L clone failed'}
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          if($LASTEXITCODE -ne 0){throw 'ISA-L SHA missing'}
          $vswhere='C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsroot=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath|Select-Object -First 1
          if(-not $vsroot){throw 'MSVC tools missing'}
          $vcvars=Join-Path $vsroot 'VC\Auxiliary\Build\vcvars64.bat'
          cmd.exe /d /s /c ('call "'+$vcvars+'" && cd isa-l && nmake /f Makefile.nmake')
          if($LASTEXITCODE -ne 0){throw 'ISA-L MSVC compilation failed'}
      - name: Build real original M3 Rust DLL and Go credential TLS integration
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'Rust toolchain failed'}
          rustup target add x86_64-pc-windows-msvc --toolchain 1.85.1
          if($LASTEXITCODE -ne 0){throw 'Windows target absent'}
          $lib=Get-ChildItem isa-l -Recurse -Filter isa-l_static.lib -File|Select-Object -First 1
          if(-not $lib){throw 'ISA-L static missing'}
          $env:WBD_ISAL_PREFIX=$lib.Directory.FullName
          $env:WBD_ISAL_SOURCE_SHA='c387163fcbca62701d646149564c550c78a4f985'
          $features='m0_v4_embedded_go,m0_v4_probe,fec2_product_record,native_fec_acceleration'
          cargo +1.85.1 build --locked --release -p wbd-engine --features $features
          if($LASTEXITCODE -ne 0){throw 'Rust Windows DLL build failed'}
          python -c 'import ctypes,os;d=ctypes.WinDLL(os.path.abspath("target/release/wbd_engine.dll"));getattr(d,"wbd_m0_win_native_v2_start");getattr(d,"wbd_m0_win_native_v1_stats");print("H2224_NATIVE_ABI_PASS")'
          if($LASTEXITCODE -ne 0){throw 'native ABI failed'}
          $env:WBD_M0_WIN_OWNER_DLL=(Resolve-Path target/release/wbd_engine.dll).Path
          Push-Location legacy
          try{
            go test -count=1 -tags wbd_v4_embedded_go -run '^TestM0WindowsTwoOriginalGoFakeTCPProtectedTLSRustOwnersAllCiphers$' ./internal/realityfront
            if($LASTEXITCODE -ne 0){throw 'real Go TLS 3 ciphers Rust M3 integration failed'}
          }finally{Pop-Location}
      - name: Real compiled WinForms with same-source original Go and Rust + actual self-tests
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force delivery/h2224-windows | Out-Null
          Copy-Item wbd-client.exe delivery/h2224-windows/wbd-client.exe
          Copy-Item target/release/wbd_engine.dll delivery/h2224-windows/wbd_engine.dll
          & ./tools/m0_plan028_h1640_win_gui_compile.ps1 -LegacyRoot legacy -OutputDirectory delivery/h2224-windows -SourceSHA $env:GITHUB_SHA -Version H2224-FIX
          if($LASTEXITCODE -ne 0){throw 'H2224 real WinForms source compile FAIL'}
          $dir=(Resolve-Path delivery/h2224-windows).Path
          $p=Start-Process -FilePath (Join-Path $dir 'WBD.exe') -ArgumentList '--self-test' -WorkingDirectory $dir -Wait -PassThru
          $file=Join-Path $dir 'gui-test-result.json'
          if(-not (Test-Path $file)){throw 'H2224 native GUI receipt NOT_RUN'}
          $v=Get-Content $file -Raw|ConvertFrom-Json
          Write-Output ('H2224_GUI_TEST_STATUS='+$v.result+' checks='+@($v.checks).Count)
          if($p.ExitCode -ne 0 -or $v.source_sha -ne $env:GITHUB_SHA -or $v.result -ne 'PASS'){
            Write-Output ('H2224_GUI_FAIL '+($v|ConvertTo-Json -Compress -Depth 4))
            throw 'H2224 native GUI self-test FAIL'
          }
          Write-Output 'H2224_WIN_GUI_ACTUAL_PASS'
      - name: Checksummed trial Windows original Go and Rust DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery/h2224-windows | Out-Null
          Copy-Item wbd-client.exe delivery/h2224-windows/wbd-client.exe
          Copy-Item target/release/wbd_engine.dll delivery/h2224-windows/wbd_engine.dll
          @("SOURCE=$env:GITHUB_SHA","SCOPE=ORIGINAL_GO_TLS_PLUS_NATIVE_OS_READY",
            "PHYSICAL_WINDOWS_TO_LINUX=NOT_RUN","PRODUCT_PASS=NO") |
            Set-Content delivery/h2224-windows/BUILD_INFO.txt
          Get-ChildItem delivery/h2224-windows -File |
            ForEach-Object {('{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.Name)} |
            Set-Content delivery/h2224-windows/SHA256SUMS
      - name: Signed official Wintun and clean allowlisted Windows GUI delivery ZIP
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $p='delivery/h2224-windows'
          $official=Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $official -TimeoutSec 120
          if((Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'){throw 'Wintun signed official ZIP SHA mismatch'}
          Expand-Archive -Path $official -DestinationPath wintun-extracted -Force
          $dll='wintun-extracted/wintun/bin/amd64/wintun.dll'
          if(-not(Test-Path $dll) -or (Get-AuthenticodeSignature $dll).Status -ne 'Valid'){throw 'signed Wintun DLL missing'}
          if((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce'){throw 'official Wintun DLL SHA mismatch'}
          Copy-Item $dll (Join-Path $p 'wintun.dll')
          if(Test-Path 'wintun-extracted/wintun/LICENSE'){Copy-Item 'wintun-extracted/wintun/LICENSE' (Join-Path $p 'WINTUN-LICENSE.txt')}
          @'
          WBD H2225 diagnostic Windows x64 GUI original Go TLS1.3 Rust DLL.\n          No stability fix: on timeout capture WBD_WINDOWS_RUST_NATIVE_HEALTH_TIMEOUT cause=... age=... and same-time server logs.
          Run WBD.exe as Administrator. Use the 便携与驱动 tab.
          Wintun 0.14.1 signed DLL is included and pin-hash checked.
          Npcap Free is NOT bundled due to redistribution licensing:
          download the official installer from https://npcap.com/#download
          then use the GUI official Npcap interactive installer button.
          No silent driver install, firewall bypass or unrelated route mutation.
          H2224 scoped CI passes; real physical long-run and every FEC mode NOT_RUN.
          '@ | Set-Content -Encoding UTF8 (Join-Path $p 'README_FIRST.txt')
          $core=@('WBD.exe','WBD.exe.config','gui-fields.json','PARAMETERS.json','wbd-client.exe','wbd_engine.dll','wintun.dll','README_FIRST.txt')
          foreach($f in $core){if(-not(Test-Path (Join-Path $p $f))){throw "missing release file: $f"}}
          $self=Get-Content (Join-Path $p 'gui-test-result.json') -Raw | ConvertFrom-Json
          if($self.result -ne 'PASS' -or $self.source_sha -ne $env:GITHUB_SHA -or @($self.checks).Count -lt 420){throw 'same SHA compiled GUI self-tests did not pass'}
          $hashes=[ordered]@{}
          foreach($f in $core){$hashes[$f]=(Get-FileHash (Join-Path $p $f) -Algorithm SHA256).Hash.ToLowerInvariant()}
          [ordered]@{
            version='H2225';source_sha=$env:GITHUB_SHA;
            main_product_equivalent_source='1e5e16852b2aa367b1ba32a7c167a2871050e3ac';
            platform='windows/amd64';scenario='source_locked_original_go_tls_rust_gui';
            gui_self_tests=@($self.checks).Count;gui_selftest_result=$self.result;
            wintun_dll='SIGNED_OFFICIAL_0.14.1';npcap_bundled=$false;
            new_physical_windows_to_arm64='NOT_RUN'; hashes=$hashes
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 (Join-Path $p 'release-manifest.json')
          $stage='delivery/wbd-h2225-win64-diagnostic'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $allow=@($core)+@('release-manifest.json')
          if(Test-Path (Join-Path $p 'WINTUN-LICENSE.txt')){$allow+='WINTUN-LICENSE.txt'}
          foreach($f in $allow){Copy-Item -LiteralPath (Join-Path $p $f) -Destination (Join-Path $stage $f)}
          Get-ChildItem -Path $stage -File | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()+'  '+$_.Name
          } | Set-Content -Encoding UTF8 (Join-Path $stage 'SHA256SUMS')
          Compress-Archive -Path $stage -DestinationPath 'delivery/wbd-h2225-win64-diagnostic.zip' -CompressionLevel Optimal
          python -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]);n=[x.filename.lower() for x in z.infolist()]; assert len(n)==len(set(n)); assert any(x.endswith("/wintun.dll") for x in n); assert any(x.endswith("/wbd.exe") for x in n); assert not any("/data/" in x or "/logs/" in x or "gui-test-result" in x or "profiles.json" in x or "mainform-" in x for x in n); print("H2224_CLEAN_WIN64_GUI_RELEASE_PASS")' delivery/wbd-h2225-win64-diagnostic.zip
          if($LASTEXITCODE -ne 0){throw 'archive clean release gate failed'}
          (Get-FileHash 'delivery/wbd-h2225-win64-diagnostic.zip' -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'delivery/WIN64-DIAGNOSTIC-ZIP-SHA256.txt'
          Write-Host ('H2224_SIGNED_FULL_WIN64_ZIP_PASS sha256='+(Get-Content 'delivery/WIN64-DIAGNOSTIC-ZIP-SHA256.txt' -Raw).Trim())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2225-validated-windows-amd64-diagnostic
          path: |
            delivery/wbd-h2225-win64-diagnostic.zip
            delivery/WIN64-DIAGNOSTIC-ZIP-SHA256.txt
            h2224-assembly.log
          if-no-files-found: warn
          retention-days: 30
  linux-arm64-native-original-tls-nat:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      WBD_PLAN029_LINUX_EXPECTED_ARCH: aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', cache: false}
      - name: Build H2221 original Go and Rust server
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc g++ nasm python3 iproute2 iputils-ping iptables conntrack openssl
          bash tools/m0_plan029_linux_dual_native_build.sh > h2224-arm64.log 2>&1 || { tail -n 150 h2224-arm64.log; exit 1; }
      - name: Exact-source Linux NAT tests and randomized cold Health Rust tests
        shell: bash
        run: |
          set -euo pipefail
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go test -count=1 -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestH2224' ./internal/v4productcli)
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-plan029-$(uname -m)"
          export WBD_ISAL_SOURCE_SHA='c387163fcbca62701d646149564c550c78a4f985'
          cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration --lib v4_native_health::tests::cold_
          echo H2224_LINUX_NAT_RUST_COLD_HEALTH_SOURCE_LOCKED_PASS
      - name: Authentic original TLS M4 three-client double NAT TUN and Stop
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          bash tools/h2216-routed-double-nat-native.sh linux-plan029-public-bundle > h2224-nat.log 2>&1 || { tail -n 170 h2224-nat.log; exit 1; }
          python3 - <<'PY'
          import json,os
          d=json.load(open('fixed-kernel-result/h2216-double-nat-proof.json'))
          assert d['source_sha']==os.environ['GITHUB_SHA'] and d['qualification']=='REAL_LINUX_NATIVE_NETNS_DOUBLE_NAT',d
          print('H2224_LINUX_REAL_GO_RUST_DOUBLE_NAT_PASS_NOT_PHYSICAL_WINDOWS')
          PY
      - name: Assemble tested same-source Linux ARM64 server-only delivery
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s linux-plan029-public-bundle/wbd-v4-server
          test -s linux-plan029-public-bundle/libwbd_engine.so
          mkdir -p delivery/wbd-h2224-linux-arm64-server
          cp linux-plan029-public-bundle/{wbd-v4-server,libwbd_engine.so,manifest.json} delivery/wbd-h2224-linux-arm64-server/
          cat > delivery/wbd-h2224-linux-arm64-server/README_FIRST.txt <<'TXT'
          H2224 Linux ARM64 original-Go TLS / native Rust server.
          Keep libwbd_engine.so beside wbd-v4-server; run with
          LD_LIBRARY_PATH="$(pwd)" ./wbd-v4-server --help
          Start with appropriate CAP_NET_ADMIN/CAP_NET_RAW, /dev/net/tun,
          iptables and your server configuration. An owned VPN subnet
          IPv4 MASQUERADE rule is added, verified and deleted on clean Stop.
          Global net.ipv4.ip_forward is host policy: configure it yourself;
          the server warns rather than changing host sysctls.
          No physical public-WAN stability or operator-host NAT was claimed.
          TXT
          (cd delivery/wbd-h2224-linux-arm64-server && sha256sum wbd-v4-server libwbd_engine.so manifest.json README_FIRST.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
          file delivery/wbd-h2224-linux-arm64-server/wbd-v4-server | tee delivery/ARM64-ELF-CHECK.txt
          file delivery/wbd-h2224-linux-arm64-server/libwbd_engine.so | tee -a delivery/ARM64-ELF-CHECK.txt
          grep -q 'aarch64\|ARM aarch64' delivery/ARM64-ELF-CHECK.txt || { echo 'not native ARM64' >&2; exit 1; }
          tar -czf delivery/wbd-h2224-linux-arm64-server.tar.gz -C delivery wbd-h2224-linux-arm64-server
          sha256sum delivery/wbd-h2224-linux-arm64-server.tar.gz > delivery/LINUX-ARM64-TAR-SHA256.txt
          echo H2224_LINUX_ARM64_CLEAN_SERVER_RELEASE_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2224-validated-linux-arm64-server
          path: |
            delivery/wbd-h2224-linux-arm64-server.tar.gz
            delivery/LINUX-ARM64-TAR-SHA256.txt
            delivery/ARM64-ELF-CHECK.txt
            h2224-arm64.log
            h2224-nat.log
            fixed-kernel-result/h2216-double-nat-proof.json
          if-no-files-found: warn
          retention-days: 14
