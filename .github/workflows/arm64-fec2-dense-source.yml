# One bounded fresh FEC2 k>1 candidate on the SAME new ARM64 native
# Go/Rust binaries that already passed their exact source build and Normal OS.
# Only this scene is run; do not repeat completed ABBA or Fixed/Auto 120ping.
name: ARM64 original-FEC2 dense source native selection
run-name: ARM64 real native FEC decode ${{ github.sha }}
on:
  push:
    branches: [feature/arm64-linux-android-openwrt-autoaccel]
    paths:
      - '.github/workflows/arm64-fec2-dense-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one-dense-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    env:
      WBD_ARM64_FROZEN_SOURCE: b776527c99b481b93775d4b27f93bc8c564bea70
      WBD_V4_MODE: fec-fixed
      WBD_ARM64_DAMAGE_TRIAL: policy-2pct
      WBD_ARM64_FEC_BURST: ping-burst
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 39761322930
          github-token: ${{ github.token }}
          name: arm64-public-go-rust-39761322930-1
          path: arm64-public-bundle/
      - name: Fixed mature, 2pct kernel loss, one dense original TUN source trial and Stop
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables
          bash tools/arm64_linux_netns_smoke.sh
      - name: Distinguish actually selected ISA-L from automatic scalar fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,json,re,hashlib
          p=pathlib.Path('arm64-netns-result')
          expected=('source_authenticated','repair_authenticated','source_tun_delivered',
                    'recovered_tun_delivered','native_decode_calls','scalar_decode_calls')
          roles={}
          for role in ('client','server'):
            raw=(p/f'{role}.log').read_text()
            lines=[s for s in raw.splitlines() if 'V4_PUBLIC_FEC2_RX role='+role+' ' in s]
            assert len(lines)==1,(role,len(lines))
            metrics={}
            for name in expected:
              m=re.search(r'\b'+name+r'=(\d+)\b',lines[0])
              assert m,(role,name,lines[0])
              metrics[name]=int(m.group(1))
            assert metrics['source_authenticated']>700,(role,metrics)
            assert metrics['repair_authenticated']>0,(role,metrics)
            roles[role]=metrics
          native=sum(x['native_decode_calls'] for x in roles.values())
          recovered=sum(x['recovered_tun_delivered'] for x in roles.values())
          scalar=sum(x['scalar_decode_calls'] for x in roles.values())
          for role in ('client','server'):
            s=(p/f'burst-qdisc-{role}.txt').read_text()
            assert re.search(r'\bdropped\s+\d+',s),(role,'missing measured kernel impairment')
          result={'product_source':os.environ['WBD_ARM64_FROZEN_SOURCE'],
            'harness_source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],
            'scenario':'700 real 800-byte ICMP each direction, 500pps, 2pct scoped Linux kernel loss',
            'real_owner_counters':roles,'native_decode_calls':native,
            'scalar_decode_calls':scalar,'recovered_ipv4_delivered_to_tun':recovered,
            'cpu_ABBA_not_repeated':True,
            'interpretation':'no guaranteed correspondence between a particular netem drop and particular encrypted source',
            'physical':'NOT_RUN',
            'logs_sha256':{role:hashlib.sha256((p/f'{role}.log').read_bytes()).hexdigest() for role in roles}}
          (p/'dense-rx-backend.json').write_text(json.dumps(result,indent=2)+'\n')
          print('ARM64_ORIGINAL_PRODUCT_NATIVE_SELECTION_WITNESS',native,scalar,recovered)
          # A discriminating assertion: under multi-source-capable traffic,
          # the pinned backend should be invoked at least once, otherwise
          # retain this as FAIL and diagnose actual k/length vs policy.
          assert native>0,'NATIVE_NEVER_SELECTED_FOR_DENSE_FEC2_REAL_PRODUCT'
          assert recovered>0,'NO_ACTUAL_M4_TUN_DELIVERED_FEC_RECOVERY'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-dense-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-netns-result/
          if-no-files-found: warn
          retention-days: 30
