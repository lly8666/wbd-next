name: Network experiment exact-source ARM64 product build
run-name: "ARM64 frozen public V4 source ${{ github.sha }}"
on:
  push:
    branches: [experiment/network-matrix-tuning, experiment/fec-network-tuning]
    paths:
      - ".github/workflows/network-arm64-product-build.yml"
      - "crates/wbd-engine/src/v4_embedded_go.rs"
      - "crates/wbd-engine/src/v4_game_lane.rs"
      - "crates/wbd-engine/src/runtime/game_shared.rs"
      - "crates/wbd-engine/src/v4_game_public_kernel.rs"
      - "crates/wbd-platform/src/linux_raw_carrier.rs"
      - "crates/wbd-engine/src/v4_fixed_stream.rs"
      - "crates/wbd-engine/src/v4_fec2_live_rx.rs"
      - "crates/wbd-engine/src/runtime/fec2_owner*"
      - "crates/wbd-codec/src/fec*"
      - "r0/go_overlay/internal/v4productcli/**"
      - "r0/go_overlay/internal/v4productcli/linux.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_*"
      - "r0/go_overlay/internal/realityfront/fec_v2_*"
      - "tools/arm64_public_go_rust_bundle.sh"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  frozen-product-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Build exact-source original Go public CLI and pinned native Rust owner once
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc
          test "$(go version | awk '{print $3}')" = go1.23.12
          bash tools/arm64_public_go_rust_bundle.sh
      - name: Game OFF AEAD authentication versus replay and invalid-record native regression
        shell: bash
        run: |
          set -euo pipefail
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib game_rx_aeAD_tag_failure_not_replay_or_malformed -- --nocapture
      - name: Game TX reused final AEAD scratch and RX in-place duplicate precheck
        shell: bash
        run: |
          set -euo pipefail
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib game_reused_tx_scratch_mixed_lengths_across_lanes_and_rx_duplicate_precheck -- --nocapture
      - name: W98 shared fixed Game FEC TX/RX owners native-only (not public qualified)
        shell: bash
        run: |
          set -euo pipefail
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib w98_game_fixed_split_tx_rx_shared_recovery_native_only -- --nocapture
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib w98_fec_pending_source_keeps_first_delivery_before_parity -- --nocapture
      - name: Game source must commit logical delivery only after TUN write succeeds
        shell: bash
        run: |
          set -euo pipefail
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib game_tun_write_failure_does_not_commit_logical_delivery -- --nocapture
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib game_pending_tun_write_suppresses_concurrent_duplicate_without_early_commit -- --nocapture
      - name: Game RX owner continues while TX adapter lock held (no new thread per packet)
        shell: bash
        run: |
          set -euo pipefail
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib game_receive_owner_progress_while_tx_adapter_lock_held -- --nocapture
      - name: Linux Game raw kernel exact-tuple BPF contract (no cross-lane copies)
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 test --locked -p wbd-platform --lib \
            game_exact_tuple_kernel_bpf_matches_authenticated_four_tuple -- --nocapture
      - name: ARM64 original-owner parity two-quanta single M4 staging regression
        shell: bash
        run: |
          set -euo pipefail
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib v4_fixed_stream::tests -- --nocapture
      - name: Real ARM64 ISA-L FEC cross-block parity table regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -s "$RUNNER_TEMP/wbd-isal-arm64-public/lib/libisal.a"
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
            cargo +1.85.1 test --locked -p wbd-codec --features native-isal \
              r1_f2_prepared_native_ -- --nocapture
      - name: FEC direct original source arena wire equals owned source wire
        shell: bash
        run: |
          set -euo pipefail
          WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public" \
          WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985 \
            cargo +1.85.1 test --locked -p wbd-codec --features native-isal \
              r1_f2_source_into_sealed_arena_window_exact_owned_equivalence -- --nocapture
      - name: FEC native authenticated-latency and Auto counter provenance contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 test --locked -p wbd-recovery r2_plan008_repaired_positive_is_ambiguous_notsent_never_taints -- --nocapture
          export CGO_ENABLED=1 GOOS=linux GOARCH=arm64 GOTOOLCHAIN=local
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release"
          (cd legacy && go test -tags wbd_v4_embedded_go,wbd_v4_native_probe,wbd_v4_fec2_owner_probe,wbd_v4_fec2_product -run 'TestV4FecAutoMatureDeltaNeverConvertsUnknownToNoLoss|TestV4FecAutoAppliedDownRetainsOnlyAuthenticHistory|TestF2ControlW52|TestF2ControlW56' ./internal/realityfront -v)
      - name: Real authenticated missing-source parity-to-TUN deterministic regression
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2
          export CGO_ENABLED=1 GOOS=linux GOARCH=arm64 GOTOOLCHAIN=local
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          (cd legacy && go test -c -tags wbd_v4_embedded_go,wbd_v4_native_probe,wbd_v4_fec2_owner_probe,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fec-deterministic.test" ./internal/realityfront)
          sudo ip netns add wbd-fec-deterministic
          trap 'sudo ip netns del wbd-fec-deterministic || true' EXIT
          sudo ip -n wbd-fec-deterministic link set lo up
          sudo ip netns exec wbd-fec-deterministic env \
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release" \
            WBD_REAL_TUN=1 WBD_M0_FEC2_CONTINUOUS=1 \
            "$GITHUB_WORKSPACE/fec-deterministic.test" -test.v \
            -test.run TestR0V4Fec2ContinuousOriginalGoKernelSourceAndParity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: "network-arm64-public-${{ github.run_id }}-${{ github.run_attempt }}"
          path: arm64-public-bundle/
          if-no-files-found: error
          retention-days: 30
