name: M0 PLAN027 H688 current-source Windows 106s real blackhole auth dead and second TLS
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h688-windows-b106-true-auth.yml]
permissions: {contents: read, actions: write}
jobs:
  one-exact-immutable-original-test:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h688-windows106]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 6ece9eab653f46a716e8d3a0927fb74bec4819e8
      PREPARED_HARNESS_SOURCE: 92354d5a70f34640918f61b25859ba0bb05989dd
      BUILD_RUN: "41226521824"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: H688 106s real bilateral dead90 and fresh TLS generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PREPARED_HARNESS_SOURCE"
          # Only the bounded game failure-tail from H688 is allowed to
          # differ from validated prepared H677 harness. No product edit.
          delta="$(git diff --name-only "$PREPARED_HARNESS_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools)"
          test "$delta" = tools/m0_wl_public_normal_e2e.py
          grep -q 'WL_GAME_ORIGINAL_STOP_FAILURE_' tools/m0_wl_public_normal_e2e.py
          test -z "$(git diff --name-only "$PREPARED_HARNESS_SOURCE" "$GITHUB_SHA" -- scenarios/plan027-b-normal-blackhole106-recover-10m-25ms-0loss-60s.json)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-b-normal-blackhole106-recover-10m-25ms-0loss-60s.json')
          assert s['public_mode']=='normal'
          assert s['duration_s']==60 and s['lifecycle_blackhole_s']==106
          for k in ('windows_to_linux','linux_to_windows'):
              d=s[k];assert d['offered_mbps']==10 and d['delay_ms']==25 and d['loss_pct']==0
          print('[plan027-h688-windows106] EXACT_ORIGINAL_SIGNED_REAL_SCENE',s['scenario_sha256'])
          PY
          scene=scenarios/plan027-b-normal-blackhole106-recover-10m-25ms-0loss-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|normal|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id' | head -1)"
          if [ -n "$old" ];then echo "EXISTING_SCENE_ACTION=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo '[plan027-h688-windows106] DISPATCHED_REAL_TWO_OS_NOT_YET_PASS'
