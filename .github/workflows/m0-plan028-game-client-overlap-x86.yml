name: M0 PLAN028 Game client shared-TUN true overlap x86 original Go Rust
run-name: PLAN028 x86 Game4 A-to-A+B-to-B source ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-game-client-overlap-x86.yml"
      - "crates/wbd-engine/src/v4_embedded_go.rs"
      - "r0/go_overlay/internal/v4productcli/linux.go"
      - "r0/go_overlay/internal/v4productcli/game_linux.go"
      - "r0/go_overlay/internal/v4productcli/path_supervisor_linux.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_game_product.go"
      - "tools/m0-v4-public-real-linux-netns.sh"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: m0-plan028-game-overlap-x86-${{ github.sha }}
  cancel-in-progress: false
jobs:
  one-original-go-rust-game4-x86-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: One exact-SOURCE original-Go and Rust build, no alternate Game dataplane
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test "$(go version | awk '{print $3}')" = go1.23.12
          mkdir -p fixed-build fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          test ! -e legacy/internal/realityfront/v4_route_prelude.go
          python3 tools/m0_install_public_faketcp.py legacy
          python3 - <<'PY'
          import os,pathlib,json,hashlib,subprocess
          root=pathlib.Path.cwd()
          donor=root/"legacy"
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in ("path_linux_test.go",):
                      continue
                  target=donor/part/src.name
                  if target.is_file():
                      assert target.read_bytes()==src.read_bytes(),str(src)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(src.read_bytes())
          for filename in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              src=root/"r0/go_overlay/internal/faketcp"/filename
              target=donor/"internal/faketcp"/filename
              assert not target.exists(),str(target)
              target.write_bytes(src.read_bytes())
          for role in ("client","server"):
              target=donor/("cmd/wbd-v4-"+role)
              target.mkdir(parents=True,exist_ok=True)
              (target/"main.go").write_bytes((root/("r0/go_overlay/cmd/wbd-v4-"+role+"/main.go")).read_bytes())
          receipt=json.loads((root/"fixed-kernel-result/assembly.json").read_text())
          assert receipt["overlay_source"]==os.environ["GITHUB_SHA"]
          assert receipt["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          print("M0_PLAN028_GAME_OVERLAP_ORIGINAL_GO_EXACT_MANIFEST_PASS",flush=True)
          PY
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,fec2_product_record --lib m0_plan028_client_shared_tun_default_generation_fence -- --test-threads=1 >fixed-kernel-result/game-overlap-route-unit.log 2>&1 || {
            tail -95 fixed-kernel-result/game-overlap-route-unit.log >&2;exit 1;
          }
          grep -q 'test result: ok. 1 passed; 0 failed' fixed-kernel-result/game-overlap-route-unit.log
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-build.log 2>&1 || { tail -110 fixed-kernel-result/rust-build.log >&2;exit 1; }
          cp target/release/libwbd_engine.so fixed-build/libwbd_engine.so
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go test -count=1 -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestPLAN028Game4RtnetlinkColdGenerationPortAndSingleServer443$' ./internal/v4productcli) >fixed-kernel-result/game-overlap-go-unit.log 2>&1 || {
            tail -90 fixed-kernel-result/game-overlap-go-unit.log >&2;exit 1;
          }
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          python3 - <<'PY'
          import os,json,pathlib,hashlib,struct
          paths=["wbd-v4-client","wbd-v4-server","libwbd_engine.so"]
          root=pathlib.Path("fixed-build")
          shas={}
          for name in paths:
              raw=(root/name).read_bytes()
              assert raw[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",raw,18)[0]==62,name
              shas[name]=hashlib.sha256(raw).hexdigest()
          out={"source_sha":os.environ["GITHUB_SHA"],
               "original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
               "toolchains":{"go":"1.23.12","rust":"1.85.1"},
               "binary_sha256":shas,"qualification":"BUILD_ONLY","scenario":"native_x86_both_game4_a_to_ab_to_b"}
          pathlib.Path("fixed-kernel-result/manifest.json").write_text(json.dumps(out,indent=2)+"\n")
          print("M0_PLAN028_GAME_OVERLAP_EXACT_BINARY_SOURCE_PASS")
          PY
      - name: One true x86_64 Game4FEC6 real underlay source switch with overlap
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables tcpdump openssl
          bash -n tools/m0-v4-public-real-linux-netns.sh
          WBD_V4_PUBLIC_MODE=game4 WBD_V4_PUBLIC_AUTO_IP=1 WBD_V4_PUBLIC_PATH_SWITCH=1 WBD_V4_PUBLIC_GAME_FEC=fixed6 WBD_V4_PUBLIC_WIRE_AUDIT=1 \
            bash tools/m0-v4-public-real-linux-netns.sh fixed-build >fixed-kernel-result/game4-a-to-ab-to-b-native.log 2>&1 || {
              tail -160 fixed-kernel-result/game4-a-to-ab-to-b-native.log >&2
              exit 1
            }
          for marker in \
            M0_PLAN028_GAME4_REAL_A_TO_AB_TO_B_AUTHENTICATED_OVERLAP_ORDER_PASS \
            M0_PLAN028_REAL_LINUX_GAME4_NATIVE_RTN_NETLINK_A_TO_AB_TO_B_PASS \
            M0_PLAN028_GAME4_FEC6_A_TO_AB_TO_B_SHARED_TUN_AND_PARITY_PASS \
            M0_PLAN028_GAME4_SAME_INSTALLATION_LEASE_RETAINED_NATIVE_PASS \
            M0_PLAN028_REAL_NEW_PATH_MTU_READBACK_PASS \
            M0_PLAN028_TLS_GAME4_EIGHT_REAL_TCP_CLIENTHELLOS_NO_PRELUDE_PASS;do
            grep -Fq "$marker" fixed-kernel-result/game4-a-to-ab-to-b-native.log
          done
          echo M0_PLAN028_GAME4_X86_NATIVE_A_TO_AB_TO_B_SOURCE_QUALIFIED_ONE_TUN_READER=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-game-overlap-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fixed-kernel-result/assembly.json
            fixed-kernel-result/manifest.json
            fixed-kernel-result/game-overlap-go-unit.log
            fixed-kernel-result/game-overlap-route-unit.log
            fixed-kernel-result/game4-a-to-ab-to-b-native.log
            fixed-kernel-result/plan028-game4-tls-wire-audit.json
            fixed-kernel-result/plan028-new-tun-mtu.json
            fixed-kernel-result/plan028-effective-new-physical-route.json
            fixed-kernel-result/plan028-real-path-switched-business.log
          if-no-files-found: warn
          retention-days: 14
