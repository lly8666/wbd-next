name: M0 PLAN027A H982 actual Linux client server first SYN MTU and AF_PACKET
run-name: "M0|PLAN027A-H982-TWO-LINUX|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027a-h982-linux-cold-mtu.yml]
permissions: {contents: read}
jobs:
  linux-native-client-server:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 78
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Verify original cold SYN retry and source-bound raw AF_PACKET listener gate first
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest tests.test_m0_linux_initial_syn_ready tests.test_m0_linux_two_end_mtu_receipt -v
          python3 -m py_compile tools/m0_linux_two_end_mtu_receipt.py
          python3 tools/m0_install_public_faketcp.py --check-only
          echo H982_NATIVE_LINUX_SYN_READY_SOURCE_GUARDS_PASS
      - name: Compile original Go and Rust Linux ARM64 native product once (changed Linux source only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc iproute2 iputils-ping openssl iptables
          bash tools/arm64_public_go_rust_bundle.sh
          (cd arm64-public-bundle && sha256sum -c SHA256SUMS)
          echo H982_REAL_LINUX_GO_TLS_RUST_SOURCE_CURRENT_BUILT_ONCE
      - name: Reuse exact one Linux client and server program for five real netns MTU sessions
        shell: bash
        run: |
          set -euo pipefail
          for spec in "normal:1460:1460" "fec-fixed:1460:1460" "fec-auto:1460:1460" "fec-fixed:1500:1500" "fec-fixed:1500:1280";do
            IFS=: read -r mode client server <<<"$spec"
            echo "H982_REAL_LINUX_CASE_BEGIN $spec source=$GITHUB_SHA"
            WBD_V4_MODE="$mode" WBD_ARM64_OUTER_MTU="$client" WBD_ARM64_SERVER_OUTER_MTU="$server" \
              WBD_ARM64_MTU_BOUNDARY=1 bash tools/arm64_linux_netns_smoke.sh
            dir="h982-linux-$mode-$client-$server"
            mv arm64-netns-result "$dir"
            python3 tools/m0_linux_two_end_mtu_receipt.py "$dir" "$mode" "$client" "$server" | tee "$dir/mtu-mss-validated.jsonl"
            echo "H982_REAL_LINUX_CASE_PASS $spec source=$GITHUB_SHA"
          done
          echo H982_LINUX_BOTH_NATIVE_ENDPOINTS_FIVE_CASES_CORRECT_MSS_RECORD_MTU_STOP_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan027a-h982-linux-bidirectional-${{ github.run_id }}
          path: |
            arm64-public-bundle/manifest.json
            arm64-public-bundle/SHA256SUMS
            h982-linux-*/
            arm64-netns-result/
          retention-days: 30
          if-no-files-found: warn
