name: M0 PLAN027 H683 original signed Windows Normal 1pct damage truthful outer F/R/C
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h683-authentic-normal-loss1-outer-wire-repair.yml]
permissions: {contents: read, actions: write}
jobs:
  one-normal-onepct-authenticated-repair-ledger:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h683-loss1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 6ece9eab653f46a716e8d3a0927fb74bec4819e8
      HARNESS_SOURCE: 92354d5a70f34640918f61b25859ba0bb05989dd
      BUILD_RUN: "41226521824"
      BASELINE_RUN: "41237900545"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Authentic original same SOURCE damaged 1pct 250ms one Action and true F/R/C evidence gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BASELINE_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$HARNESS_SOURCE"
          test -z "$(git diff --name-only "$HARNESS_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/wl-outer-repair-10m-250ms-loss1-60s.json')
          old=read_scenario('scenarios/plan027-h539-normal-10m-250ms-loss1-60s.json')
          assert s['public_mode']=='normal' and s['duration_s']==60 and s['tun_mtu']==1400 and s['seed']==20261030
          for name in ('windows_to_linux','linux_to_windows'):
              d=s[name];assert d==old[name]
              assert d['offered_mbps']==10 and d['delay_ms']==250 and d['loss_pct']==1
          assert s['scenario_id'].startswith('wl-outer-repair-')
          print('H683_GENUINE_REAL_TUN_NPF_KERNEL_1PCT_AND_RAW_R_F_C',s['scenario_sha256'])
          PY
          scene=scenarios/wl-outer-repair-10m-250ms-loss1-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|normal|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id' | head -1)"
          if [ -n "$old" ];then echo "H683_ALREADY_DISPATCHED action=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H683_TRUE_ORIGINAL_SOURCE6ECE_10M_250MS_1PCT_KERNEL_BOTH_AND_WIRE_LEDGER_DISPATCHED_NOT_PASS
