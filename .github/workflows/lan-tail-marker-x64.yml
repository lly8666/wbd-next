name: Tail marker rolling XOR AES-fallback A/B x64
on:
  push:
    branches: [experiment/lan-tail-marker-rolling8-cost]
    paths: [".github/workflows/lan-tail-marker-x64.yml"]
permissions: {contents: read}
concurrency:
  group: lan-tail-marker-x64
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@v6
        with: {go-version: "1.25.x", cache: false}
      - name: Roundtrip, AES non23 and retrans23, tail 8 bits vs bytes, marker-fingerprint tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          mkdir -p tail-marker-evidence
          go version > tail-marker-evidence/go.txt
          lscpu > tail-marker-evidence/cpu.txt
          go test -v tools/lan_tail_marker_rolling8_test.go -run '^Test' -count=1 \
             | tee tail-marker-evidence/unit.txt
      - name: Native Go seven modes x five repetitions (1345B, 100 packets, full seal+open)
        shell: bash
        run: |
          set -euo pipefail
          export GOMAXPROCS=1
          go test tools/lan_tail_marker_rolling8_test.go \
            -run '^$' -bench '^Benchmark' -benchtime=1s -count=5 \
            -benchmem -cpu=1 | tee tail-marker-evidence/bench.txt
          python3 tools/lan_tail_marker_analyze.py \
            --input tail-marker-evidence/bench.txt \
            --output tail-marker-evidence/summary.json \
            | tee tail-marker-evidence/summary_stdout.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lan-tail-marker-x64-native
          path: tail-marker-evidence/
          retention-days: 30
          if-no-files-found: warn
