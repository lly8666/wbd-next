name: M0 PLAN027A H987 H986 source build reuse DF and staged native
run-name: "M0|PLAN027A-H987-DF-STAGED|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027a-h986-df-staged.yml]
permissions: {contents: read, actions: write}
concurrency:
  group: m0-plan027a-h987-h986-binary-reuse
  cancel-in-progress: false
jobs:
  build-once-then-independent-scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: "1e8325f16e2975a9da3497ab97ac570771a97238"
      BUILD_RUN: "41546652567"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One immutable current source, validate genuine native fixtures first
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          git fetch --depth=1 origin "$SOURCE_SHA"
          product_diff="$(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py tools/m0_install_public_faketcp.py)"
          test -z "$product_diff" || { echo "H987_REFUSE_PRODUCT_SOURCE_DRIFT $product_diff";exit 1; }
          python3 -m unittest tests.test_m0_wl_native_df_kernel tests.test_m0_wl_perf_v2_config tests.test_m0_wl_native_mtu_contract -v
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          rows=(
            ("normal","scenarios/plan027a-h958-normal-1460-5m-df-60s.json",5),
            ("auto","scenarios/plan027a-h986-auto-1460-5m-staged5-30-5-210s.json",5),
            ("game4-fec","scenarios/plan027a-h957-game4fec-1460-3m-staged5-30-5-210s.json",3),
          )
          for mode,path,mbps in rows:
              s=read_scenario(path)
              assert s["public_mode"]==mode and s["tun_mtu"]==1460
              assert all(s[d]["offered_mbps"]==mbps for d in ("windows_to_linux","linux_to_windows"))
              if mode!="normal":
                  assert [v["start_s"] for v in s["impairment_stages"]]==[0,40,80]
                  assert s["duration_s"]==210
                  assert all([p[d]["loss_pct"] for p in s["impairment_stages"]]==[5,30,5] for d in ("windows_to_linux","linux_to_windows"))
              print("H986_ONE_SCENARIO_VALID",mode,path,s["scenario_sha256"])
          PY
          echo H986_CURRENT_SOURCE_FIXED_AND_GAME_HISTORICAL_OLD_FAIL_PRESERVED
      - name: Reuse H986 already-dispatched original one Windows Linux source build (no second dispatch)
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          echo "H987_H986_ORIGINAL_BINARY_BUILD_REUSE run=$BUILD_RUN source=$SOURCE_SHA; no duplicate build"
      - name: Collect exact H986 real build and both product artifacts before reusing
        shell: bash
        run: |
          set -euo pipefail
          result=
          for trial in $(seq 1 285);do
            test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA" ||
              { echo H987_REFUSE_HEAD_DRIFT;exit 1; }
            data="$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN")"
            test "$(echo "$data"|jq -r .head_sha)" = "$SOURCE_SHA"
            status="$(echo "$data"|jq -r .status)"
            result="$(echo "$data"|jq -r .conclusion)"
            if [ "$status" = completed ];then break;fi
            sleep 12
          done
          test "$result" = success ||
            { echo "H987_H986_BUILD_NOT_SUCCESS run=$BUILD_RUN result=$result NO_DUPLICATE_DISPATCH";exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts" --jq '.artifacts[] | select(.expired==false) | .name' >/tmp/h987-artifacts
          grep -Fx "m0-wl-windows-product-binaries-$SOURCE_SHA" /tmp/h987-artifacts
          grep -Fx m0-plan024-linux-product /tmp/h987-artifacts
          echo "H987_H986_REAL_BINARY_ARTIFACTS_PASS run=$BUILD_RUN source=$SOURCE_SHA"
          echo "BUILD_RUN_ID=$BUILD_RUN" >>"$GITHUB_ENV"
      - name: Three separate native measurement Actions, same exact signed binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA" ||
            { echo H986_REFUSE_STALE_MAIN;exit 1; }
          while IFS='|' read -r mode scene;do
            [ -n "$mode" ] || continue
            title="M0-WIN-LINUX|$GITHUB_SHA|$mode|$scene|outer=default1460"
            existing="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
              jq -r --arg x "$title" '.workflow_runs[] | select(.display_title==$x) | .id' | head -1)"
            if [ -n "$existing" ];then
              echo "H987_ALREADY_DISPATCHED $existing mode=$mode scene=$scene"
              continue
            fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f "public_mode=$mode" -f native_outer_mtu=default1460 \
              -f run_n0=false -f outer_repair=on -f "perf_scenario_file=$scene" \
              -f "perf_reuse_run_id=$BUILD_RUN_ID" -f "perf_binary_source_sha=$SOURCE_SHA"
            echo "H987_NATIVE_QUEUED_NOT_PASS mode=$mode scene=$scene binary=$BUILD_RUN_ID binary_source=$SOURCE_SHA harness_source=$GITHUB_SHA"
          done <<'SCENES'
          normal|scenarios/plan027a-h958-normal-1460-5m-df-60s.json
          auto|scenarios/plan027a-h986-auto-1460-5m-staged5-30-5-210s.json
          game4-fec|scenarios/plan027a-h957-game4fec-1460-3m-staged5-30-5-210s.json
          SCENES
          echo H987_THREE_INDEPENDENT_ACTIONS_DISPATCHED_NOT_QUALIFIED
