name: H2372 original native per-flow admission fairness dual ISA
run-name: "H2372 flow admission fairness A-B-A | ${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: ['experiment/m0-029-throughput-arm-fair']
    paths:
      - 'docs/requests/M0/qa-h2372-flow-fair-abaprime.md'
permissions:
  contents: read
jobs:
  native-flow-fairness:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m0-029-h2372-flow-fair]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 48
    concurrency:
      group: m0-029-h2372-flow-fair-${{ github.sha }}-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      WBD_PLAN029_LINUX_DUAL_ISA: "1"
      WBD_M0_029_NO_PROBE: "1"
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Exact native ARM64 and existing source-locked build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go version | awk '{print $3}')" = go1.23.12
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            autoconf automake libtool make gcc nasm python3 iproute2 \
            iputils-ping iptables ethtool iperf3 openssl
          test -c /dev/net/tun
          sudo -n true
          python3 -m py_compile tools/m0_029_product_shared_tun_noprobe.py
          # Exercise actual import-time fixture switches before expensive build.
          WBD_M0_029_H2372_FLOW_FAIR_LEG=A WBD_M0_029_H2272_FORCE_REPAIR=off WBD_M0_029_ECHO_SERVER_NODELAY=1 WBD_M0_029_ECHO_TIMELINE=1 WBD_M0_029_TCP_INFO=1 WBD_M0_029_SPARSE_TCP_DIAG=1 python3 -c 'import runpy; runpy.run_path("tools/m0_029_product_shared_tun_noprobe.py",run_name="h2374_preflight")'
          bash -n tools/m0_plan029_linux_dual_native_build.sh
      - name: Single original Go TLS Rust no-probe build for all three legs
        shell: bash
        run: |
          set -euo pipefail
          bash tools/m0_plan029_linux_dual_native_build.sh >plan029-linux-build.log 2>&1 || {
            tail -n 125 plan029-linux-build.log >&2
            exit 1
          }
          python3 - <<'PY'
          import json,hashlib,pathlib,os,platform,subprocess
          b=pathlib.Path("linux-plan029-public-bundle")
          m=json.loads((b/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"]
          assert m["architecture"]==platform.machine()==os.environ["WBD_PLAN029_LINUX_EXPECTED_ARCH"]
          assert m["m0_probe_compiled"] is False
          assert (m["normal_linux_client_shared_tun_inbox_default"],
                  m["normal_linux_server_shared_tun_inbox_default"]) == (128,64)
          for k,v in m["sha256"].items():
              assert hashlib.sha256((b/k).read_bytes()).hexdigest()==v
          exported=subprocess.check_output(["nm","-D",str(b/"libwbd_engine.so")],text=True)
          assert "wbd_m0_embedded_go_loop_debug_pause_jumbo" not in exported
          print("M029_H2263_ONE_RELEASE_ORIGINAL_GO_RUST_ARM64_BUILD_PASS",flush=True)
          PY
      - name: Real same binary fair admission OFF ON OFF
        shell: bash
        timeout-minutes: 28
        run: |
          set -euo pipefail
          for leg in A B A_prime; do
            WBD_M0_029_H2372_FLOW_FAIR_LEG="$leg" \
            WBD_M0_029_ECHO_TIMELINE=1 \
            WBD_M0_029_TCP_INFO=1 \
            WBD_M0_029_H2272_FORCE_REPAIR=off \
            WBD_M0_029_ECHO_SERVER_NODELAY=1 \
            WBD_M0_029_SPARSE_TCP_DIAG=1 \
              python3 -u tools/m0_029_product_shared_tun_noprobe.py
          done
          python3 - <<'PY'
          import json,os,pathlib
          rows=[json.loads(pathlib.Path(f"m029-product-shared-flow-fair-{leg.lower()}/summary.json").read_text()) for leg in ("A","B","A_prime")]
          out=[]
          for row,leg in zip(rows,("A","B","A_prime")):
              assert row["source_sha"]==os.environ["GITHUB_SHA"]
              assert row["arch"]==os.environ["WBD_PLAN029_LINUX_EXPECTED_ARCH"]
              assert row["same_release_binary_sha256"]==rows[0]["same_release_binary_sha256"]
              assert row["status"]=="PASS_SCOPED_REAL_NO_PROBE_SHARED_TUN_NORMAL_128_64"
              assert row["h2372_flow_fair"]["leg"]==leg
              assert row["h2372_flow_fair"]["enabled"]==(leg=="B")
              assert all(row["owned_stop"][role]["generation"]>0 for role in ("client","server"))
              assert row["server_native_outer_ready_readback"]["repair_enabled"]==0
              m=row["measurement"]; c=row["h2262_sparse_tcp_ingress"]["client"]
              out.append(dict(leg=leg,evicted=row["h2372_flow_fair"]["evicted"],receiver_mbps=m["original_product_tcp"]["receiver_bps"]/1e6,
                  client_cpu_s_per_gib=m["cpu_and_rss"]["client"]["cpu_seconds_per_rx_gib"],
                  server_cpu_s_per_gib=m["cpu_and_rss"]["server"]["cpu_seconds_per_rx_gib"],
                  udp_missing=m["smallflow"]["udp"]["missing"],tcp_missing=m["smallflow"]["tcp"]["missing"],
                  tcp_p99_ms=m["smallflow"]["tcp"]["latency_ms"]["p99"],sparse_tcp_offered=c["forward_offered"],sparse_tcp_refused=c["forward_dropped"],
                  client_full_drops=row["owned_stop"]["client"]["queue_full_drops"]))
          assert out[0]["evicted"]==out[2]["evicted"]==0
          pathlib.Path("h2372-flow-fair-comparison.json").write_text(json.dumps(out,indent=2)+"\n")
          for r in out:print("H2372_REAL_FLOW_FAIR_LEG "+json.dumps(r),flush=True)
          PY
      - name: Preserve raw real native receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2372-flow-fair-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            plan029-linux-build.log
            linux-plan029-public-bundle/manifest.json
            m029-product-shared-flow-fair-*/
            h2372-flow-fair-comparison.json
          if-no-files-found: warn
          retention-days: 21
