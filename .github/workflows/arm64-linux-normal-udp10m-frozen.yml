# One 60s native ARM64 Normal/off capacity discovery, not A/B or p99.
name: ARM64 Normal off bidirectional UDP10M 60s
run-name: ARM64 Normal 10M trial ${{ github.sha }}
on:
  push:
    branches: [feature/arm64-linux-android-openwrt-autoaccel]
    paths:
      - '.github/workflows/arm64-linux-normal-udp10m-frozen.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-udp10m:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      WBD_ARM64_FROZEN_SOURCE: 9194e20f2f53cd4ac0b85d3e7f5aa136f164d2c3
      WBD_V4_MODE: normal
      WBD_ARM64_CAPACITY_TRIAL: udp10m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 39752535971
          github-token: ${{ github.token }}
          name: arm64-public-go-rust-39752535971-1
          path: arm64-public-bundle/
      - name: Native original Go/Rust real TUN bidirectional UDP10M 60sec trial
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables iperf3
          bash tools/arm64_linux_netns_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-udp10m-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-netns-result/
          if-no-files-found: warn
          retention-days: 30
