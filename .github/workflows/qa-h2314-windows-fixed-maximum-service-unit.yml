# H2314 owner/Windows native scoped unit only. Not a remote maximum-FEC
# acceptance, and no production default, Go ABI or existing four-row FFI change.
name: H2374 Windows Fixed maximum real ISA-L and original owner unit
on:
  push:
    branches: ['experiment/m0-029-throughput-arm-fair']
    paths:
      - '.github/workflows/qa-h2314-windows-fixed-maximum-service-unit.yml'
      - 'tests/test_m0_h2314_maximum_service.py'
      - 'crates/wbd-engine/Cargo.toml'
      - 'crates/wbd-engine/src/v4_windows_fec2_owner.rs'
      - 'crates/wbd-engine/src/v4_windows_native_runtime.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest tests.test_m0_h2314_maximum_service -v
  windows_unit:
    needs: static
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Native MSVC installed compiler and pinned ISA-L archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'Rust 1.85.1 install failed'}
          choco install nasm -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'NASM prerequisite failed'}
          $bin=@('C:\Program Files\NASM','C:\ProgramData\chocolatey\bin') | Where-Object {Test-Path (Join-Path $_ 'nasm.exe')} | Select-Object -First 1
          if(-not $bin){throw 'Installed NASM tool missing'}
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          # GITHUB_PATH applies to FOLLOWING steps only. The current nmake
          # child cmd.exe needs the actual NASM directory immediately.
          $env:PATH="$bin;$env:PATH"
          & where.exe nasm
          if($LASTEXITCODE -ne 0){throw 'Current MSVC ISA-L builder cannot see NASM'}
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          if($LASTEXITCODE -ne 0){throw 'Official ISA-L clone failed'}
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          if((git -C isa-l rev-parse HEAD).Trim() -ne 'c387163fcbca62701d646149564c550c78a4f985'){throw 'Official SHA mismatch'}
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if(-not (Test-Path -LiteralPath $vswhere)){throw 'vswhere missing'}
          $vsroot=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if(-not $vsroot){throw 'MSVC x64 tools missing'}
          $vcvars=Join-Path $vsroot 'VC\Auxiliary\Build\vcvars64.bat'
          if(-not (Test-Path -LiteralPath $vcvars)){throw 'MSVC vcvars64 missing'}
          $cmd='call "'+$vcvars+'" && where nmake && where nasm && cd isa-l && nmake /f Makefile.nmake'
          & cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'ISA-L MSVC native static build failed'}
          $archive=Get-ChildItem isa-l -Recurse -Filter isa-l_static.lib -File | Select-Object -First 1
          if(-not $archive){throw 'MSVC static archive missing'}
          "WBD_ISAL_PREFIX=$($archive.Directory.FullName)" | Add-Content -Path $env:GITHUB_ENV
          'WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985' | Add-Content -Path $env:GITHUB_ENV
          New-Item -ItemType Directory -Force h1409-result | Out-Null
          $archiveHash=(Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveHash | Set-Content h1409-result/isa-l-static-sha256.txt
      - name: Real Windows Rust original maximum 20-parity M1/M3/AEAD and prefix unit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $features='m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,h2311_windows_npf64_only,h2314_windows_fixed_max_burst,native_fec_acceleration'
          & cargo +1.85.1 test --locked -p wbd-codec --features native-isal --lib r1_f2_default_native_all_seven_profiles_real_encode_prepared -- --nocapture --test-threads=1 *>&1 | Tee-Object h1409-result/codec.log
          if($LASTEXITCODE -ne 0){throw 'H2374_NATIVE_CODEC_FAILED'}
          $count=@(Select-String -Path h1409-result/codec.log -Pattern 'M0_PLAN028_H1409_ISAL_NATIVE_PROFILE').Count
          if($count -ne 7){throw 'H2374_NATIVE_CODEC_NOT_ALL_SEVEN'}
          & cargo +1.85.1 test --locked -p wbd-engine --features $features --lib m0_windows_original_fixed_auto_fec2_default_linked_native_isal -- --nocapture --test-threads=1 *>&1 | Tee-Object h1409-result/owner.log
          if($LASTEXITCODE -ne 0){throw 'H2374_NATIVE_OWNER_FAILED'}
          $count=@(Select-String -Path h1409-result/owner.log -Pattern 'M0_PLAN028_H1409_WIN_REAL_OWNER_NATIVE_PROFILE').Count
          if($count -ne 7){throw 'H2374_NATIVE_OWNER_NOT_ALL_SEVEN'}
          & cargo +1.85.1 test --locked -p wbd-engine --features $features --lib m0_windows_fixed_maximum_twenty_frozen_rows_one_original_prefix -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'H2314_ORIGINAL_WINDOWS_MAXIMUM_OWNER_FAIL'}
          & cargo +1.85.1 test --locked -p wbd-engine --features $features --lib m0_fixed_stream_full_maximum_five_quanta_one_genuine_m4_prefix -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'H2314_EXISTING_M1_FIVE_QUANTA_REGRESSION'}
          & cargo +1.85.1 test --locked -p wbd-engine --features $features --lib native_driver_prefix_never_claims_peer_receipt -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'H2314_NPF_PREFIX_NOT_PEER_GATE'}
          & cargo +1.85.1 test --locked -p wbd-engine --features $features --lib m0_h2314_fixed_maximum_two_ready_twenty_rows_cover_full_source_turn -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'H2314_MAXIMUM_SOURCE_TO_PARITY_SERVICE_COVERAGE'}
          Write-Output 'H2374_REAL_ISAL_OWNER_MAXIMUM_UNIT_PASS_NOT_REMOTE_PRODUCT'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2374-native-isal-maximum-${{ github.run_id }}
          path: h1409-result/
          if-no-files-found: warn
          retention-days: 14
