name: PLAN029 current WinForms plus original Go CLI DNS domain MTU config (no Rust DLL or real network)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan029-h1663-gui-domain-mtu-vm.yml"
      - "tools/m0_plan029_gui_address_mtu_harness.cs"
      - "r0/go_overlay/cmd/wbd-client/m0_plan029_*.go"
      - "tools/m0_plan028_h1640_win_gui_compile.ps1"
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  current-windows-gui-profile:
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      ORIGINAL_GO: a7a82db31fe736ffedee330795a3234d358f1984
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Reassemble exact original Go current CLI and compile real WinForms (no Rust DLL linked)
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          if((git -C legacy rev-parse HEAD).Trim() -ne $env:ORIGINAL_GO){throw "old original Go source changed"}
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw "test source changed"}
          python tools/prepare_windows_wiring.py
          if($LASTEXITCODE -ne 0){throw "native original Go assembly failed"}
          Push-Location legacy
          try{
            & go build -trimpath -tags wbd_v4_embedded_go -o ../result/current-plan029-native.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw "native Go current product build failed"}
          } finally {Pop-Location}
          & ./tools/m0_plan028_h1640_win_gui_compile.ps1 -LegacyRoot legacy -OutputDirectory result/gui -SourceSHA $env:GITHUB_SHA -Version plan029-h1663
          if($LASTEXITCODE -ne 0){throw "WinForms compile failed"}
          Copy-Item result/current-plan029-native.exe result/gui/wbd-client.exe
          if(Test-Path result/gui/wbd_engine.dll){throw "Config-only GUI test must not import a stale Rust product DLL"}
          Write-Output "PLAN029_H1663_CURRENT_GO_WINDOWS_GUI_CONFIG_ONLY_NO_RUST_PRODUCT_LINK"
      - name: Compile and execute real WinForms profile + real current Go CLI --check-config (not signed network)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference="Stop"
          $csc=(Get-Content result/gui/roslyn-path.txt -Raw).Trim()
          $fw='C:/Program Files (x86)/Reference Assemblies/Microsoft/Framework/.NETFramework/v4.8'
          $refs=@('mscorlib','System','System.Core','System.Drawing','System.Windows.Forms','System.Web.Extensions','System.ServiceProcess')|ForEach-Object {'/reference:'+(Join-Path $fw ($_.ToString()+'.dll'))}
          & $csc /nologo /noconfig /nostdlib+ /langversion:latest /target:exe /platform:x64 /utf8output /codepage:65001 ('/out:'+(Resolve-Path result/gui).Path+'/DomainMTU.exe') @refs ('/reference:'+(Resolve-Path result/gui/WBD.exe).Path) tools/m0_plan029_gui_address_mtu_harness.cs
          if($LASTEXITCODE -ne 0){throw "real GUI domain MTU C# harness compiler failed"}
          $where=(Resolve-Path result/gui).Path
          $p=Start-Process -FilePath (Join-Path $where 'DomainMTU.exe') -ArgumentList @($where) -WorkingDirectory $where -PassThru -Wait -NoNewWindow
          if($p.ExitCode -ne 0 -or -not(Test-Path result/gui/h1663-domain-mtu-winforms.png)){throw "GUI profile/real CLI validation failed"}
          Write-Output "PLAN029_H1663_TRUE_WINFORMS_DOMAIN_SEPARATE_TLS_NAME_OUTER1460_EFFECTIVE_REOPEN_PASS_NO_SIGNED_NPF_TUN"
      - name: Record source and explicit exclusions
        shell: pwsh
        if: always()
        run: |
          New-Item -ItemType Directory -Force result | Out-Null
          $go=""
          if(Test-Path result/current-plan029-native.exe){$go=(Get-FileHash result/current-plan029-native.exe -Algorithm SHA256).Hash.ToLower()}
          [ordered]@{schema_version=1;source_sha=$env:GITHUB_SHA;original_go=$env:ORIGINAL_GO;go_sha256=$go;rust_product_dll="NOT_BUILT_OR_LINKED";scope="CURRENT_COMPILED_WINDOWS_GUI_AND_REAL_GO_CLI_CONFIG_ONLY";real_dns_wfp="NOT_RUN";signed_wintun_gui_business="NOT_RUN";native_cn_direct="NOT_RUN";flow_padding="NOT_RUN";run_id=$env:GITHUB_RUN_ID}|ConvertTo-Json -Depth 5|Set-Content -Encoding UTF8 result/h1663-source.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan029-h1663-gui-domain-mtu-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            result/h1663-source.json
            result/assembly.json
            result/gui/h1663-domain-mtu-winforms.png
            result/gui/data/h1663-*.json
