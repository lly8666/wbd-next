# PLAN027: incremental C50 only after exact current-source C10 real delivered and owned Stop.
name: M0 PLAN027 H465 capacity 50 after validated C10
on:
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions: {contents: read, actions: write}
jobs:
  launch-c50:
    if: >-
      github.event.workflow_run.id == 41000374541 &&
      github.event.workflow_run.head_sha == '829712922793bce3045f7d5ee2f0bf835472fc5d' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Examine actual C10 first arrivals, offered load and owned Stop before increment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/41000374541" --jq .head_sha)" = 829712922793bce3045f7d5ee2f0bf835472fc5d
          mkdir -p c10-measured
          gh run download 41000374541 -R "$GH_REPO" --name m0-wl-full-public-normal-direct --dir c10-measured
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('c10-measured/report.json')
          d=json.loads(p.read_text())
          v=d.get('WL_V2',{})
          assert d.get('mode_public')=='PASS_ACTUAL_WINDOWS_LINUX_NATIVE_normal',d.get('mode_public')
          assert d.get('stop')=='PASS_BOTH_OWNED',d.get('stop')
          assert v.get('status')=='MEASURED_BOTH_OS_KERNEL',v.get('status')
          assert v.get('owned_stop')=='PASS_BOTH_OWNED',v.get('owned_stop')
          assert v.get('scenario_id')=='plan027-c-normal-10m-25ms-loss0-60s'
          for side in ('windows','linux'):
              offered=v['offered_mbps'][side]
              first=v['first_delivery_fraction'][side]
              assert offered>=9.5 and first>=.999,(side,offered,first)
              native=d['wl_n0_measured'][side]
              assert native['invalid_packets']==0 and native['duplicate_packets']==0,(side,native)
              print('PLAN027_C10_TRUE_DELIVERY_STOP',side,offered,first,native['sender_cpu_pct_one_core'])
          PY
          python - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          c=read_scenario('scenarios/plan027-c-normal-50m-25ms-loss0-60s.json')
          assert c['scenario_id']=='plan027-c-normal-50m-25ms-loss0-60s' and c['public_mode']=='normal' and c['duration_s']==60
          for side in ('windows_to_linux','linux_to_windows'):
              d=c[side];assert (d['offered_mbps'],d['delay_ms'],d['loss_pct'])==(50,25,0)
          print('PLAN027_C50_GROUNDED_NEXT',c['scenario_sha256'])
          PY
          product='0daddf65ef1ae0abf2e42dc841b96ed4458a8fb9'
          build_run=40999605005
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)" = "$product"
          gh api "repos/$GH_REPO/actions/runs/$build_run/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/build-artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$product" "$RUNNER_TEMP/build-artifacts"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/build-artifacts"
          gh workflow run m0-wl-public-normal-full.yml --ref main \
            -f public_mode=normal -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-c-normal-50m-25ms-loss0-60s.json \
            -f perf_reuse_run_id="$build_run" -f perf_binary_source_sha="$product"
          echo "PLAN027_H465_C50_AFTER_C10_DISPATCHED=$product run=$build_run"
