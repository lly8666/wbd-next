name: Governance maintenance regression
run-name: "governance-maintenance|${{ github.sha }}"
on:
  push:
    branches: [main, "work/**", "experiment/**"]
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".governance/policy.json"
      - ".governance/native-suites.json"
      - ".governance/scope-checkpoints.json"
      - "AGENTS.md"
      - "START_HERE.md"
      - "PROJECT_CHARTER.md"
      - "docs/GOVERNANCE.md"
      - "docs/ACTIONS_CONTRACT.md"
      - "docs/prompts/**"
      - "docs/decisions/**"
      - "docs/devlog/M0/PLAN-*.md"
      - "docs/architecture/model-inputs.json"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python -m pip install PyYAML==6.0.2
      - name: Validate all workflow YAML and embedded Python before expensive builds
        run: python tools/check_workflows.py
      - name: Exercise old compatibility and new scope/selection/provenance negative cases
        run: |
          mkdir -p out
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee out/governance-tests.log
          python tools/governance.py validate > out/structure.json
          python tools/r0_qualification_audit.py > out/r0-ledger.log
          python tools/cost_model.py > out/cost-model.json
          python tools/design_models.py > out/design-model.json
          python tools/fec_v2_model.py > out/fec-v2-model.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: governance-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
