name: M0 original protected owner scoped FEC2 record integration
run-name: "M0|OWNER-FEC2-PN|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-fec2-original-owner-probe.yml"
      - "crates/wbd-engine/src/v4_owner_crypto.rs"
      - "crates/wbd-engine/src/v4_probe_bridge.rs"
      - "crates/wbd-engine/Cargo.toml"
      - "crates/wbd-codec/src/record_crypto.rs"
      - "crates/wbd-codec/src/record_replay.rs"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: m0-owner-fec2-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Original owner M1 FrozenRecord AEAD PN Seq + FEC2, test-only three-suite
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          mkdir -p owner-fec2-result
          cargo +1.85.1 test --release --locked -p wbd-engine --features m0_v4_probe,m0_fec2_owner_probe --lib r1_m0_original_owner_fec2_source_repair_same_pn_staged -- --test-threads=1 --nocapture 2>&1 | tee owner-fec2-result/owner.log
          cargo +1.85.1 build --release --locked -p wbd-engine --lib 2>&1 | tee owner-fec2-result/default.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path("owner-fec2-result")
          s=(root/"owner.log").read_text()
          n="r1_m0_original_owner_fec2_source_repair_same_pn_staged"
          assert re.search(r"test \S*"+n+r" \.\.\. ok",s)
          assert re.search(r"test result: ok\. 1 passed; 0 failed;",s)
          assert "Finished" in (root/"default.log").read_text()
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          files=["crates/wbd-engine/src/v4_owner_crypto.rs",
                 "crates/wbd-engine/src/v4_probe_bridge.rs",
                 "crates/wbd-engine/Cargo.toml",
                 "crates/wbd-codec/src/record_crypto.rs",
                 "crates/wbd-codec/src/record_replay.rs","Cargo.lock"]
          receipt={"schema_version":1,"source_sha":os.environ["GITHUB_SHA"],
                   "run_id":os.environ["GITHUB_RUN_ID"],
                   "attempt":os.environ["GITHUB_RUN_ATTEMPT"],
                   "result":"PASS_SCOPED_ORIGINAL_OWNER_FEC2_AEAD_PN_FROZEN_TX",
                   "test":"r1_m0_original_owner_fec2_source_repair_same_pn_staged",
                   "count":1,"cipher_suites":3,
                   "real_original_owner_Seq_PN_Frozen_record":True,
                   "actual_Go_TLS_bit2_KDF":"NOT_RUN",
                   "actual_Go_raw_TUN_FEC2":"NOT_RUN",
                   "live_credential_test":"SYNTHETIC_ONLY",
                   "default_build_FEC2":"OFF",
                   "product":"NOT_RUN",
                   "input_sha256":{p:sha(p) for p in files},
                   "log_sha256":{"owner":sha(root/"owner.log"),
                                 "default":sha(root/"default.log")}}
          (root/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-owner-fec2-${{ github.run_id }}-${{ github.run_attempt }}
          path: owner-fec2-result/
          if-no-files-found: warn
          retention-days: 30
