# PLAN-012 M0 true original-Go TLS Fixed request -> actual Rust M1/M3/M4
# source + parity copied -> original Go applied -> AEAD/RS16 real TUN app.
# One combined actual build+native packet grammar+Go TLS real kernel functional job.
# Still NEVER a continuous FEC or real Go Game product claim without proof.
name: M0 PLAN012 combined FEC record Game lanes original Go kernel functional
run-name: "M0|PLAN012-COMBINED-REAL-GO|${{ github.sha }}"
on:
  # M4 can run this SAME exact-source Linux real Connect/Stop gate once
  # without creating an I011 Windows request or changing shared workflow.
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan012-combined-functional.yml"
      - "crates/wbd-engine/src/v4_game_kernel_linux_tests.rs"
      - "crates/wbd-engine/src/lib.rs"
      - "crates/wbd-engine/src/v4_game_lane.rs"
      - "crates/wbd-engine/src/v4_fec2_live_rx.rs"
      - "crates/wbd-engine/src/v4_owner_crypto.rs"
      - "crates/wbd-engine/src/v4_embedded_go.rs"
      - "crates/wbd-engine/src/v4_fixed_stream.rs"
      - "r0/go_overlay/internal/realityfront/bridge_v4_live_fec2_kernel_linux_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_game_cold_set.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_game_cold_set_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_public_product.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_public_product_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_game_native_linux.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_game_native_linux_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_game_product.go"
      - "r0/go_overlay/internal/v4productcli/game_linux.go"
      - "crates/wbd-engine/src/v4_game_public_kernel.rs"
      - "r0/go_overlay/internal/realityfront/admission_v4.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_server_product.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_client_product.go"
      - "r0/go_overlay/internal/v4productcli/linux.go"
      - "r0/go_overlay/cmd/wbd-v4-client/main.go"
      - "r0/go_overlay/cmd/wbd-v4-server/main.go"
      - "tools/m0-v4-public-real-linux-netns.sh"
      - "r0/go_overlay/internal/realityfront/bridge_v4_m4_linux_connect_stop_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_fec2_owner_probe_linux.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_fec2_release_client_linux.go"
      - "tools/run-v4-tun-netns.sh"
permissions: {contents: read}
concurrency:
  group: m0-plan012-combined-functional-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env: {GOTOOLCHAIN: local, CGO_ENABLED: "1"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Build original pinned protected Go and frozen native Rust FEC owner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixed-kernel-result fixed-build
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          test "$(go version | awk '{print $3}')" = go1.23.12
          cargo +1.85.1 test --locked -p wbd-codec --features fec2-product-record --test fec2_release_record -- --nocapture >fixed-kernel-result/release-record.log 2>&1 || { cat fixed-kernel-result/release-record.log; exit 1; }
          cargo +1.85.1 test --locked -p wbd-engine --lib m0_game_ -- --test-threads=1 --nocapture >fixed-kernel-result/game-lanes.log 2>&1 || { cat fixed-kernel-result/game-lanes.log; exit 1; }
          cargo +1.85.1 test --locked -p wbd-engine --features fec2_product_record --lib m0_fec2_live_rx -- --test-threads=1 --nocapture >fixed-kernel-result/continuous-rx.log 2>&1 || { cat fixed-kernel-result/continuous-rx.log; exit 1; }
          cargo +1.85.1 test --locked -p wbd-engine --features fec2_product_record --lib m0_fixed_stream_ -- --test-threads=1 --nocapture >fixed-kernel-result/fixed-tx-stream.log 2>&1 || { cat fixed-kernel-result/fixed-tx-stream.log; exit 1; }
          grep -q 'test result: ok. 1 passed; 0 failed' fixed-kernel-result/release-record.log
          grep -q 'test result: ok. 2 passed; 0 failed' fixed-kernel-result/game-lanes.log
          grep -q 'test result: ok. 4 passed; 0 failed' fixed-kernel-result/continuous-rx.log
          grep -q 'test result: ok. 5 passed; 0 failed' fixed-kernel-result/fixed-tx-stream.log
          cargo +1.85.1 build --release --locked -p wbd-engine >fixed-kernel-result/default-build.log 2>&1
          if nm -D target/release/libwbd_engine.so | grep -Eq ' wbd_m0_(embedded_go_|test_probe_)'; then
            echo 'M0_FIXED_PRODUCT_DEFAULT_ABI_LEAK' >&2; exit 1
          fi
          cargo +1.85.1 build --release --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/opt-in-build.log 2>&1
          nm -D target/release/libwbd_engine.so | grep -q ' wbd_m0_embedded_go_fixed_pending_readback$'
          nm -D target/release/libwbd_engine.so | grep -q ' wbd_m0_embedded_go_attach_raw_rx_on_interface$'
          nm -D target/release/libwbd_engine.so | grep -q ' wbd_m0_embedded_go_prepare_client$'
          nm -D target/release/libwbd_engine.so | grep -q ' wbd_m0_embedded_go_game_group_join$'
          nm -D target/release/libwbd_engine.so | grep -q ' wbd_m0_embedded_go_game_group_state$'
          nm -D target/release/libwbd_engine.so | grep -q ' wbd_m0_embedded_go_fec2_probe_real_raw_tx$'
          for file in bridge_v4_linux_server_product.go bridge_v4_linux_client_product.go bridge_v4_game_cold_set.go bridge_v4_game_cold_set_test.go fec_v2_policy.go fec_v2_policy_test.go fec_v2_runtime_controller.go fec_v2_runtime_controller_test.go admission_v4.go admission_v4_test.go bridge_v4_probe_linux.go bridge_v4_probe_linux_test.go bridge_v4_embedded_linux.go bridge_v4_fec2_owner_off_linux.go bridge_v4_fec2_owner_probe_linux.go bridge_v4_fec2_release_client_linux.go bridge_v4_fec2_public_product_linux.go bridge_v4_fec2_public_mature_linux.go bridge_v4_fec2_public_mature_disabled_linux.go bridge_v4_game_native_linux.go bridge_v4_game_native_linux_test.go bridge_v4_linux_game_product.go bridge_v4_fec2_owner_probe_linux_test.go bridge_v4_embedded_linux_test.go bridge_v4_embedded_perf_linux_test.go bridge_v4_normal_off_policy_linux.go bridge_v4_normal_off_policy_linux_test.go bridge_v4_fixed_pending_linux.go bridge_v4_fixed_pending_linux_test.go bridge_v4_live_fec2_kernel_linux_test.go bridge_v4_m4_linux_connect_stop_test.go; do
            cp "r0/go_overlay/internal/realityfront/$file" "legacy/internal/realityfront/$file"
          done
          # Optional product conformance: missing files are NOT_RUN at
          # the separate parallel pre-enable gate, not silently skipped PASS.
          for file in bridge_v4_linux_public_product.go bridge_v4_game_product_linux.go bridge_v4_linux_public_product_test.go bridge_v4_game_kernel_linux_test.go; do
            if [[ -f "r0/go_overlay/internal/realityfront/$file" ]]; then
              cp "r0/go_overlay/internal/realityfront/$file" "legacy/internal/realityfront/$file"
            fi
          done
          # Assemble ACTUAL public original-Go V4 client and server entry
          # sources, not a clone of V3 or a package-private Go test binary.
          mkdir -p legacy/internal/v4productcli legacy/cmd/wbd-v4-client legacy/cmd/wbd-v4-server
          cp r0/go_overlay/internal/v4productcli/linux.go legacy/internal/v4productcli/linux.go
          cp r0/go_overlay/internal/v4productcli/game_linux.go legacy/internal/v4productcli/game_linux.go
          cp r0/go_overlay/cmd/wbd-v4-client/main.go legacy/cmd/wbd-v4-client/main.go
          cp r0/go_overlay/cmd/wbd-v4-server/main.go legacy/cmd/wbd-v4-server/main.go
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          # One original credential-checked Go TLS 2/4 fixture, consumed in
          # the SAME Actions VM by the actual native Rust GameAdapter.
          # Contains raw exporter keys: keep only in ephemeral RUNNER_TEMP,
          # never upload and do not print. Wipe after bridge test.
          export WBD_GAME_TLS_FIXTURE_DIR="$RUNNER_TEMP/m0-go-game-private-${GITHUB_RUN_ID}"
          mkdir -m 0700 "$WBD_GAME_TLS_FIXTURE_DIR"
          (cd legacy && go test -tags wbd_v4_native_probe,wbd_v4_embedded_go,wbd_v4_fec2_owner_probe,wbd_v4_fec2_product -run "^(TestM0V4OriginalTLSGame2And4AuthenticatedColdSet|TestM0Plan019RealTLSGroup2And4ImmutableOwnerBoundary|TestM0Plan019NativeGameGroupRejectsMissingCommittedOriginalTLS)$" -count=1 -v ./internal/realityfront >"$GITHUB_WORKSPACE/fixed-kernel-result/original-go-game-tls.log" 2>&1) || { cat fixed-kernel-result/original-go-game-tls.log; exit 1; }
          grep -q "M0_ORIGINAL_GO_TLS_GAME_AUTHENTICATED_COLD_SET_PASS lanes=2" fixed-kernel-result/original-go-game-tls.log
          grep -q "M0_ORIGINAL_GO_TLS_GAME_AUTHENTICATED_COLD_SET_PASS lanes=4" fixed-kernel-result/original-go-game-tls.log
          grep -q "M0_PLAN019_REAL_ORIGINAL_GO_TLS_PUBLIC_GAME_GROUP_BOUNDARY_PASS lanes=2" fixed-kernel-result/original-go-game-tls.log
          grep -q "M0_PLAN019_REAL_ORIGINAL_GO_TLS_PUBLIC_GAME_GROUP_BOUNDARY_PASS lanes=4" fixed-kernel-result/original-go-game-tls.log
          grep -q "M0_PLAN019_NATIVE_GAME_SHARED_ORIGINAL_TLS_MISSING_AUTH_DENIED" fixed-kernel-result/original-go-game-tls.log
          cargo +1.85.1 test --locked -p wbd-engine --lib m0_private_go_game_ -- --test-threads=1 --nocapture >fixed-kernel-result/real-go-native-game-lanes.log 2>&1 || { cat fixed-kernel-result/real-go-native-game-lanes.log; exit 1; }
          grep -q 'M0_ORIGINAL_GO_TLS_GAME_NATIVE_AEAD_PN_FIRST_DELIVERY_PASS lanes=2' fixed-kernel-result/real-go-native-game-lanes.log
          grep -q 'M0_ORIGINAL_GO_TLS_GAME_NATIVE_AEAD_PN_FIRST_DELIVERY_PASS lanes=4' fixed-kernel-result/real-go-native-game-lanes.log
          # Real kernel Game2 + Game4 paths use the SAME actual original-Go
          # TLS private per-lane KDF material and M1 frozen/M3 AEAD+replay,
          # M4 ScopedRawIpv4Tx/Rx and ScopedTunSink, a real UDP socket.
          # The test binary must be identified from Cargo's actual build
          # metadata, never choose an unrelated prior feature test binary.
          cargo +1.85.1 test --locked -p wbd-engine --lib --no-run --message-format=json >fixed-kernel-result/game-kernel-build.jsonl 2>fixed-kernel-result/game-kernel-build.stderr || {
            cat fixed-kernel-result/game-kernel-build.stderr; exit 1;
          }
          GAME_TEST_BIN="$(python3 - <<'PY'
          import json
          found=[]
          for line in open("fixed-kernel-result/game-kernel-build.jsonl"):
            try: obj=json.loads(line)
            except ValueError: continue
            if obj.get("reason")=="compiler-artifact" and obj.get("target",{}).get("name")=="wbd_engine" and obj.get("executable"):
              found.append(obj["executable"])
          assert len(found)==1,("ambiguous native Linux Game test binary",len(found))
          print(found[0])
          PY
          )"
          test -x "$GAME_TEST_BIN"
          test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2
          NS="wbdgame_${GITHUB_RUN_ID}"
          sudo -n ip netns add "$NS"
          cleanup_game_ns(){ sudo -n ip netns del "$NS" || true; }
          trap cleanup_game_ns EXIT
          sudo -n ip -n "$NS" link set lo up
          sudo -n ip -n "$NS" addr add 10.0.0.2/32 dev lo
          sudo -n ip -n "$NS" addr add 10.0.1.1/32 dev lo
          sudo -n ip netns exec "$NS" env WBD_M0_GAME_KERNEL_TUN=1 WBD_GAME_TLS_FIXTURE_DIR="$WBD_GAME_TLS_FIXTURE_DIR" "$GAME_TEST_BIN" --nocapture --test-threads=1 m0_original_tls_game_kernel_2_4_first_app_real_m4_raw_tun >fixed-kernel-result/game-real-kernel.log 2>&1 || {
            cat fixed-kernel-result/game-real-kernel.log; exit 1;
          }
          cat fixed-kernel-result/game-real-kernel.log
          grep -q 'M0_ORIGINAL_GO_TLS_GAME_M4_RAW_TUN_UDP_FIRST_APP_PASS lanes=2' fixed-kernel-result/game-real-kernel.log
          grep -q 'M0_ORIGINAL_GO_TLS_GAME_M4_RAW_TUN_UDP_FIRST_APP_PASS lanes=4' fixed-kernel-result/game-real-kernel.log
          cleanup_game_ns
          trap - EXIT
          rm -f "$WBD_GAME_TLS_FIXTURE_DIR"/*.cold
          rmdir "$WBD_GAME_TLS_FIXTURE_DIR"
          unset WBD_GAME_TLS_FIXTURE_DIR
          (cd legacy && go test -tags wbd_v4_native_probe,wbd_v4_embedded_go,wbd_v4_fec2_owner_probe,wbd_v4_fec2_product -c -o "$GITHUB_WORKSPACE/fixed-build/owner-go.test" ./internal/realityfront)
          cp target/release/libwbd_engine.so fixed-build/
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          file fixed-build/wbd-v4-client fixed-build/wbd-v4-server
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          source=["crates/wbd-engine/src/v4_embedded_go.rs","crates/wbd-engine/src/v4_owner_crypto.rs",
            "crates/wbd-engine/src/runtime/fec2_owner.rs",
            "crates/wbd-engine/src/v4_fixed_stream.rs",
            "crates/wbd-engine/src/v4_game_lane.rs",
            "crates/wbd-engine/src/v4_game_kernel_linux_tests.rs",
            "crates/wbd-engine/src/v4_fec2_live_rx.rs",
            "crates/wbd-engine/src/v4_owner_crypto.rs",
            "crates/wbd-engine/src/v4_protected_handoff.rs",
            "crates/wbd-codec/tests/fec2_release_record.rs",
            "crates/wbd-codec/Cargo.toml",
            "crates/wbd-engine/Cargo.toml",
            "crates/wbd-engine/src/fec2_staged.rs",
            "crates/wbd-codec/src/fec_v2.rs","crates/wbd-codec/src/record_crypto.rs",
            "r0/go_overlay/internal/realityfront/admission_v4.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_linux_server_product.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_linux_client_product.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_fec2_public_product_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_fec2_public_mature_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_fec2_public_mature_disabled_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_game_native_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_game_native_linux_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_linux_game_product.go",
            "r0/go_overlay/internal/v4productcli/game_linux.go",
            "crates/wbd-engine/src/v4_game_public_kernel.rs",
            "r0/go_overlay/internal/v4productcli/linux.go",
            "r0/go_overlay/cmd/wbd-v4-client/main.go",
            "r0/go_overlay/cmd/wbd-v4-server/main.go",
            "tools/m0-v4-public-real-linux-netns.sh",
            "r0/go_overlay/internal/realityfront/bridge_v4_game_cold_set.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_game_cold_set_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_fec2_owner_probe_linux_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_fec2_release_client_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_fixed_pending_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_fixed_pending_linux_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_live_fec2_kernel_linux_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_m4_linux_connect_stop_test.go",
            "tools/run-v4-tun-netns.sh",".github/workflows/m0-plan012-combined-functional.yml"]
          for optional in [
            "r0/go_overlay/internal/realityfront/bridge_v4_linux_public_product.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_game_product_linux.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_linux_public_product_test.go",
            "r0/go_overlay/internal/realityfront/bridge_v4_game_kernel_linux_test.go",
            ".github/workflows/m0-plan012-preenable-parallel.yml",
          ]:
            if pathlib.Path(optional).is_file(): source.append(optional)
          m={"schema_version":1,"source_sha":os.environ["GITHUB_SHA"],"run_id":int(os.environ["GITHUB_RUN_ID"]),
            "attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "task_id":"R0-M0-PLAN008-PRODUCT-VERTICAL-INTEGRATION-025",
            "original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
            "toolchains":{"go":"1.23.12","rust":"1.85.1"},
            "feature":"m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record",
            "default_ABI_has_test_symbol":False,
            "tested_scope":"COMBINED_RELEASE_FEC_RECORD_GAME2_4_NATIVE_AND_ONE_SHOT_GO_TLS_REAL_KERNEL",
            "continuous_Fixed_Auto_Game_product":"NOT_RUN",
            "released_fec_record_crypto_native_test":"PASS_SCOPED",
            "m1_game_2_4_independent_lanes_native_test":"PASS_SCOPED_NOT_ORIGINAL_GO_KERNEL",
            "original_go_game_2_4_tls_cold_set":"TESTED_REAL_TLS_ONLY_NO_M4_KERNEL",
            "continuous_FEC_RX_4_interleaved_blocks_native":"PASS_SCOPED_NOT_ORIGINAL_GO_KERNEL",
            "continuous_FEC_RX_noHOL_old_incomplete_evict":"PASS_SCOPED_NOT_ORIGINAL_GO_KERNEL",
            "original_TLS_FixedStream_deferred_parity_kernel_receipt":"PASS_NATIVE_ONLY",
            "production_Fixed_Auto_live_kernel":"NOT_RUN",
            "original_background_FEC_RX_uses_one_moved_replay_opener":"COMPILED_OPTIONAL_DORMANT_PENDING_NOT_PRODUCT",
            "production_FEC2_default":"OFF",
            "release_client_original_M2_actual_kernel_C2S_authenticated":"PASS_SCOPE_ONLY_WITHOUT_POLICY_APPLIED",
            "source_inputs_sha256":{p:sha(p) for p in source},
            "binaries_sha256":{p:sha("fixed-build/"+p) for p in ["owner-go.test","libwbd_engine.so","wbd-v4-client","wbd-v4-server"]}}
          pathlib.Path("fixed-kernel-result/manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          PY
      - name: One real Linux raw/TUN/UDP functional batch, 3 ciphers and original Fixed applied
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2
          WBD_M0_FEC2_KERNEL_TX=1 bash tools/run-v4-tun-netns.sh fixed-build >fixed-kernel-result/real-kernel.log 2>&1
          cat fixed-kernel-result/real-kernel.log
          for suite in 1 2 3; do
            grep -q "M0_ORIGINAL_GO_FIXED_REQUEST_PENDING_KERNEL_APPLIED_PASS suite=$suite requested=4 copied=2 applied=4 no_premature_ack=1" fixed-kernel-result/real-kernel.log
            grep -q "M0_ORIGINAL_GO_FIXED_KERNEL_QUIESCENT_OFF_AFTER_M2_SETTLED_PASS suite=$suite before_ack=deny after_auth_receipt=off5 fixed_rev4=retired" fixed-kernel-result/real-kernel.log
            grep -q "M0_REAL_GO_RAW_RUST_AUTHENTICATED_FEC2_RS16_MISSING_SOURCE_PASS suite=$suite e=1 restored=127 source_pn=0 parity_pn=1" fixed-kernel-result/real-kernel.log
            grep -q "M0_REAL_GO_RAW_RUST_FEC2_RS16_M4_TUN_UDP_DELIVERY_PASS suite=$suite recovered_ip=127 udp_payload=99" fixed-kernel-result/real-kernel.log
            grep -q "M0_REAL_GO_TLS_M4_RAW_REVERSE_M3_AEAD_PN_M2_FROZEN_RECEIPT_PASS suite=$suite" fixed-kernel-result/real-kernel.log
          done
          # One additional original Go TLS S2C background TX with four
          # actual TUN UDP packets + >=2 real source/parity blocks received
          # through an independent original-key M3 client replay decoder.
          # No FAKE peer APPLIED or product release from a private verifier.
          WBD_M0_FEC2_CONTINUOUS=1 bash tools/run-v4-tun-netns.sh fixed-build >fixed-kernel-result/continuous-kernel.log 2>&1 || {
            cat fixed-kernel-result/continuous-kernel.log;exit 1;
          }
          cat fixed-kernel-result/continuous-kernel.log
          grep -q 'M0_REAL_ORIGINAL_GO_RELEASE_CLIENT_FEC2_TUN_UDP_RECOVERY_PASS' fixed-kernel-result/continuous-kernel.log
