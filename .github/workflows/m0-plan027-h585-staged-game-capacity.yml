name: M0 PLAN027 H585 Game4 highestFEC staged capacity plus Fixed50
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h585-staged-game-capacity.yml]
permissions: {contents: read, actions: write}
jobs:
  one:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h585-staged-capacity]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: cb475c89a29bc79c1608b747e76e136fd9341500
      BUILD: "41177831521"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Wait exactly source-frozen real zero; then one Action each; Game4 10 then 20 capacity-gated
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" HEAD -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          for f,mode,rate,loss,delay in (
            ('plan027-c-game4-fec-10m-250ms-loss0-60s.json','game4-fec',10,0,250),
            ('plan027-c-game4-fec-20m-250ms-loss0-60s.json','game4-fec',20,0,250),
            ('plan027-c-game4-fec-20m-250ms-loss30-60s.json','game4-fec',20,30,250),
            ('plan027-c-fixed-50m-25ms-loss0-60s.json','fixed',50,0,25)):
            s=read_scenario('scenarios/'+f)
            assert s['public_mode']==mode and s['duration_s']==60
            for direction in ('windows_to_linux','linux_to_windows'):
              assert s[direction]['offered_mbps']==rate
              assert s[direction]['loss_pct']==loss
              assert s[direction]['delay_ms']==delay
            print('H585_GRADED_SCENE',f,s['scenario_sha256'])
          PY
          for i in $(seq 1 52); do
            x="$(gh api "repos/$GH_REPO/actions/runs/$BUILD")"
            test "$(jq -r .head_sha <<<"$x")" = "$SOURCE"
            test "$(jq -r .event <<<"$x")" = workflow_dispatch
            if [ "$(jq -r .status <<<"$x")" = completed ];then
              test "$(jq -r .conclusion <<<"$x")" = success || exit 1
              break
            fi
            test "$i" -lt 52 || { echo H585_SOURCE_ZERO_NOT_COMPLETE >&2;exit 2; }
            sleep 30
          done
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$BUILD/jobs?per_page=100")"
          test "$(jq -r '[.jobs[]|select(.name=="native-public-two-os")|.conclusion]|first' <<<"$jobs")" = success
          a="$(gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100")"
          jq -e --arg n "m0-wl-windows-product-binaries-$SOURCE" '.artifacts[]|select(.name==$n and .expired==false)' <<<"$a" >/dev/null
          jq -e '.artifacts[]|select(.name=="m0-plan024-linux-product" and .expired==false)' <<<"$a" >/dev/null
          mkdir -p h585-zero
          gh run download "$BUILD" --repo "$GH_REPO" --name m0-wl-full-public-normal-direct --dir h585-zero
          SOURCE="$SOURCE" python3 - <<'PY'
          import json,os
          from tools.m0_wl_perf_v2_config import read_scenario
          r=json.load(open('h585-zero/report.json'))
          assert r['linux_binary_source']==os.environ['SOURCE']
          assert r['mode_public']=='PASS_ACTUAL_WINDOWS_LINUX_NATIVE_normal'
          assert r['stop']=='PASS_BOTH_OWNED'
          assert r['WL_V2']['status']=='MEASURED_BOTH_OS_KERNEL'
          assert r['WL_V2']['scenario_sha256']==read_scenario('scenarios/plan027-h539-normal-10m-250ms-loss0-60s.json')['scenario_sha256']
          assert min(r['WL_V2']['first_delivery_fraction'].values())>=.999
          print('H585_SAME_SOURCE_REAL_ZERO_AND_STOP_VERIFIED')
          PY
          dispatch(){
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main -f public_mode="$1" -f run_n0=false  -f perf_scenario_file="scenarios/$2" -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$SOURCE"
            echo "H585_ONE_SCENE_DISPATCHED mode=$1 scene=$2 SOURCE=$SOURCE"
          }
          after_dispatch_id(){
            local old="$1" new
            for i in $(seq 1 24);do
              for id in $(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=50" --jq '.workflow_runs[].id');do
                grep -qx "$id" <<<"$old" && continue
                test "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .head_sha)" = "$GITHUB_SHA" && { echo "$id";return 0; }
              done
              sleep 6
            done
            return 1
          }
          verify_native(){
            local id="$1" scene="$2" dir="h585-$1"
            for i in $(seq 1 52);do
              run="$(gh api "repos/$GH_REPO/actions/runs/$id")"
              if [ "$(jq -r .status <<<"$run")" = completed ];then
                test "$(jq -r .conclusion <<<"$run")" = success || { echo "H585_CAPACITY_STOP run=$id" >&2;exit 1; }
                break
              fi
              test "$i" -lt 52 || { echo "H585_SCENE_STILL_PENDING run=$id" >&2;exit 2; }
              sleep 30
            done
            mkdir -p "$dir"
            gh run download "$id" --repo "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$dir"
            SCENE="$scene" ROOT="$dir" SRC="$SOURCE" python3 - <<'PY'
          import os,json,pathlib
          from tools.m0_wl_perf_v2_config import read_scenario
          r=json.load(open(pathlib.Path(os.environ['ROOT'])/'report.json'))
          assert r['linux_binary_source']==os.environ['SRC']
          assert r['stop']=='PASS_BOTH_OWNED'
          assert r['WL_V2']['status']=='MEASURED_BOTH_OS_KERNEL'
          assert r['WL_V2']['scenario_sha256']==read_scenario('scenarios/'+os.environ['SCENE'])['scenario_sha256']
          assert min(r['WL_V2']['first_delivery_fraction'].values())>=.999
          print('H585_GRADED_TRUE_BUSINESS_AND_STOP_PASS',os.environ['SCENE'])
          PY
          }
          # Fixed is an unrelated capacity family: do not wait on Game.
          dispatch fixed plan027-c-fixed-50m-25ms-loss0-60s.json
          prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=50" --jq '.workflow_runs[].id')"
          dispatch game4-fec plan027-c-game4-fec-10m-250ms-loss0-60s.json
          game10="$(after_dispatch_id "$prior")"
          test -n "$game10"
          echo "H585_REAL_GAME10_ID=$game10"
          verify_native "$game10" plan027-c-game4-fec-10m-250ms-loss0-60s.json
          prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=50" --jq '.workflow_runs[].id')"
          dispatch game4-fec plan027-c-game4-fec-20m-250ms-loss0-60s.json
          game20="$(after_dispatch_id "$prior")"
          test -n "$game20"
          echo "H585_REAL_GAME20_ID=$game20"
          verify_native "$game20" plan027-c-game4-fec-20m-250ms-loss0-60s.json
          dispatch game4-fec plan027-c-game4-fec-20m-250ms-loss30-60s.json
          echo H585_GAME4_20M30_DISPATCHED_AFTER_EXACT_GRADED_CAPACITY_PASS
