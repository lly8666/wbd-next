name: H2430 native source-paced 400ms staircase
run-name: "H2430 source-paced capacity matrix | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-linux-tcp-splice']
    paths: ['.github/workflows/qa-h2430-source-paced-matrix.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Build actual original product once per ISA
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables iperf3 ethtool iputils-ping autoconf automake libtool make gcc g++ nasm openssl
          python3 -m py_compile tools/m0_h2430_source_paced.py
          bash tools/m0_plan029_linux_dual_native_build.sh >h2430-build.log 2>&1 || { tail -n 150 h2430-build.log; exit 2; }
          cd linux-plan029-public-bundle
          sha256sum -c SHA256SUMS
          tar -czf ../h2430-product.tgz wbd-v4-client wbd-v4-server libwbd_engine.so SHA256SUMS manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2430-product-${{ matrix.arch }}-${{ github.sha }}
          path: h2430-product.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2430-build-log-${{ matrix.arch }}
          path: h2430-build.log
          retention-days: 14
  measure:
    needs: build
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "x86_64-nat-download-loss0-fec-1", runner: ubuntu-24.04, arch: x86_64, loss: "0", profile: "-1", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss0-fec6", runner: ubuntu-24.04, arch: x86_64, loss: "0", profile: "6", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss1-fec-1", runner: ubuntu-24.04, arch: x86_64, loss: "1", profile: "-1", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss1-fec0", runner: ubuntu-24.04, arch: x86_64, loss: "1", profile: "0", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss2-fec1", runner: ubuntu-24.04, arch: x86_64, loss: "2", profile: "1", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss5-fec-1", runner: ubuntu-24.04, arch: x86_64, loss: "5", profile: "-1", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss5-fec1", runner: ubuntu-24.04, arch: x86_64, loss: "5", profile: "1", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss10-fec3", runner: ubuntu-24.04, arch: x86_64, loss: "10", profile: "3", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss15-fec3", runner: ubuntu-24.04, arch: x86_64, loss: "15", profile: "3", exit: nat, direction: download}
          - {label: "x86_64-nat-download-loss30-fec6", runner: ubuntu-24.04, arch: x86_64, loss: "30", profile: "6", exit: nat, direction: download}
          - {label: "aarch64-nat-download-loss0-fec-1", runner: ubuntu-24.04-arm, arch: aarch64, loss: "0", profile: "-1", exit: nat, direction: download}
          - {label: "aarch64-nat-download-loss0-fec6", runner: ubuntu-24.04-arm, arch: aarch64, loss: "0", profile: "6", exit: nat, direction: download}
          - {label: "aarch64-nat-download-loss5-fec1", runner: ubuntu-24.04-arm, arch: aarch64, loss: "5", profile: "1", exit: nat, direction: download}
          - {label: "aarch64-nat-download-loss30-fec6", runner: ubuntu-24.04-arm, arch: aarch64, loss: "30", profile: "6", exit: nat, direction: download}
          - {label: "x86_64-nat-upload-loss0-fec-1", runner: ubuntu-24.04, arch: x86_64, loss: "0", profile: "-1", exit: nat, direction: upload}
          - {label: "x86_64-nat-upload-loss5-fec1", runner: ubuntu-24.04, arch: x86_64, loss: "5", profile: "1", exit: nat, direction: upload}
          - {label: "x86_64-nat-upload-loss30-fec6", runner: ubuntu-24.04, arch: x86_64, loss: "30", profile: "6", exit: nat, direction: upload}
          - {label: "x86_64-splice-download-loss0-fec-1", runner: ubuntu-24.04, arch: x86_64, loss: "0", profile: "-1", exit: splice, direction: download}
          - {label: "x86_64-splice-download-loss5-fec1", runner: ubuntu-24.04, arch: x86_64, loss: "5", profile: "1", exit: splice, direction: download}
          - {label: "x86_64-splice-download-loss30-fec6", runner: ubuntu-24.04, arch: x86_64, loss: "30", profile: "6", exit: splice, direction: download}
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
      H2430_LOSS: ${{ matrix.loss }}
      H2430_PROFILE: ${{ matrix.profile }}
      H2430_EXIT: ${{ matrix.exit }}
      H2430_DIRECTION: ${{ matrix.direction }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Retrieve same run exact SOURCE native bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables iperf3 ethtool iputils-ping openssl
          mkdir -p h2430-download linux-plan029-public-bundle h2430-out
          name="h2430-product-$WBD_PLAN029_LINUX_EXPECTED_ARCH-$GITHUB_SHA"
          export ARTIFACT_NAME="$name"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false) | .id')
          test -n "$id"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir h2430-download
          tar -xzf h2430-download/h2430-product.tgz -C linux-plan029-public-bundle
          (cd linux-plan029-public-bundle && sha256sum -c SHA256SUMS)
          python3 - "$id" <<'PY'
          import json,os,pathlib,sys
          m=json.loads(pathlib.Path("linux-plan029-public-bundle/manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"] and m["architecture"]==os.environ["WBD_PLAN029_LINUX_EXPECTED_ARCH"]
          pathlib.Path("h2430-out/build-identity.json").write_text(json.dumps({"run":int(os.environ["GITHUB_RUN_ID"]),"artifact_id":int(sys.argv[1]),"manifest":m},indent=2)+"\n")
          PY
      - name: Application paced native capacity staircase
        shell: bash
        run: |
          lscpu >h2430-out/lscpu.txt
          uname -a >h2430-out/uname.txt
          iperf3 --version >h2430-out/iperf-version.txt
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" H2430_LOSS="$H2430_LOSS" H2430_PROFILE="$H2430_PROFILE" H2430_EXIT="$H2430_EXIT" H2430_DIRECTION="$H2430_DIRECTION" H2421_OUT=h2430-out python3 -u tools/m0_h2430_source_paced.py
      - name: Preserve readable evidence
        if: always()
        shell: bash
        run: |
          if test -d h2430-out;then
            sudo find h2430-out -type f -name install -delete
            sudo chown -R "$(id -u):$(id -g)" h2430-out
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2430-${{ matrix.label }}
          path: h2430-out/
          retention-days: 14
