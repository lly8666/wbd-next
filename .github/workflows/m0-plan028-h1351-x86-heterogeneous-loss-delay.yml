name: M0 PLAN028 H1351 native x86 true 0 1 5 15 30pct loss and 0 50 150 250ms delay
run-name: PLAN028 H1351 true Linux native TLS Rust ISA-L heterogeneous physical loss and delay
on:
  push:
    branches: [main]
    paths: [".github/workflows/m0-plan028-h1351-x86-heterogeneous-loss-delay.yml", "tools/m0-plan028-h1351-x86-heterogeneous-loss-delay-fixture.py", "tools/m0-plan028-h1351-x86-heterogeneous-loss-delay-audit.py"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WBD_PLAN028_FAST_SCENE: pressure
      WBD_PLAN028_FAST_CAPACITY_STEPS: "2"
      WBD_PLAN028_QDISC_CLOCK_DIAG: "1"
      WBD_PLAN028_STATIC_OWNED_NEIGH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate exact five-client true physical loss+delay, static real veth ARP control and Python syntax before network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m0-plan028-h1351-x86-heterogeneous-loss-delay-fixture.py \
            tools/m0-plan028-h1351-x86-heterogeneous-loss-delay-audit.py \
            tools/m0-plan028-h1259-five-client-recovery-netns.py \
            tools/m0-plan028-h1286-rapid-report.py
          python3 tools/m0-plan028-h1351-x86-heterogeneous-loss-delay-fixture.py --preflight
          echo M0_PLAN028_H1351_TRUE_WEAKNET_PHASE_PREFLIGHT_PASS

  native-x86-five-client-heterogeneous-loss-delay:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ORIGINAL_PRODUCT_SOURCE: 6c5fd909b9f42d1af89c698cdaabc79bbb72e589
      WBD_PLAN028_FAST_SCENE: pressure
      WBD_PLAN028_FAST_CAPACITY_STEPS: "2"
      WBD_PLAN028_QDISC_CLOCK_DIAG: "1"
      WBD_PLAN028_STATIC_OWNED_NEIGH: "1"
      WBD_GAME_FEC_BACKEND: native
      WBD_H1351_WRAPPER_SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 42369031512
          github-token: ${{ github.token }}
          name: h1286-x86-one-isal-build-6c5fd909b9f42d1af89c698cdaabc79bbb72e589
          path: fixed-build/
      - name: Verify frozen native x86 ELF62 original-Go and Rust ISA-L exact SHA binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -c /dev/net/tun
          python3 - <<'PY_BIN'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["ORIGINAL_PRODUCT_SOURCE"]
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert m["architecture"]=="native_x86_64" and m["go"]=="1.23.12" and m["rust"]=="1.85.1"
          assert set(m["sha256"])=={"wbd-v4-client","wbd-v4-server","libwbd_engine.so"}
          for n,digest in m["sha256"].items():
              raw=(root/n).read_bytes()
              assert raw[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",raw,18)[0]==62
              assert hashlib.sha256(raw).hexdigest()==digest,n
          print("M0_PLAN028_H1351_FROZEN_X86_ORIGINAL_TLS_NATIVE_RUST_ISAL_SHA3_PASS",flush=True)
          PY_BIN
          chmod +x fixed-build/wbd-v4-client fixed-build/wbd-v4-server
      - name: Real native 180s five-client 0 1 5 15 30pct physical netem 0 50 150 250ms delay
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          mkdir -p fixed-kernel-result
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          GITHUB_SHA="$ORIGINAL_PRODUCT_SOURCE" python3 -u \
            tools/m0-plan028-h1351-x86-heterogeneous-loss-delay-fixture.py fixed-build \
            >fixed-kernel-result/h1351-native-heterogeneous-traffic.log 2>&1 || {
              tail -170 fixed-kernel-result/h1351-native-heterogeneous-traffic.log >&2
              exit 1
            }
          grep -Fq "M0_PLAN028_H1351_ONE_NATIVE_X86_TRUE_HETEROGENEOUS_SCENE_CAPTURED" \
            fixed-kernel-result/h1351-native-heterogeneous-traffic.log
          python3 -u tools/m0-plan028-h1351-x86-heterogeneous-loss-delay-audit.py \
            --art fixed-kernel-result --out fixed-kernel-result/h1351-l2-native-weaknet.json \
            | tee fixed-kernel-result/h1351-native-weaknet-audit.log
          python3 - <<'PY_GATE'
          import json,pathlib
          a=json.loads(pathlib.Path("fixed-kernel-result/h1351-l2-native-weaknet.json").read_text())
          assert a["measurement_complete"] and a["auth_user_count"]==5
          assert a["original_product_source_sha"]=="6c5fd909b9f42d1af89c698cdaabc79bbb72e589"
          assert a["server_shared_TUN_exact_Stop"] and a["all_five_exact_final_Stop"]
          assert a["physical_loss_pct_configured"]==[0,1,5,15,30]
          assert a["oneway_delay_ms_configured"]==[0,50,150,250,250]
          assert a["test_only_real_veth_ARP_10of10"]
          assert all(1<=n<=256 for n in a["observed_VM_logical_cores_each_phase"])
          for d in ("uplink","downlink"):
            assert 28<=a["real_Erin_30pct_qdisc"][d]["real_kernel_loss_pct"]<=32
          assert len(a["real_TCP_framed_alice_bob"])==2
          print("M0_PLAN028_H1351_NATIVE_REAL_30PCT_250MS_QDISC_AND_VM_VCPU_RECEIPT_PASS",flush=True)
          assert a["real_business_stability_pass"],a["classification"]
          assert a["classification"] in (
            "PASS_SCOPED_NATIVE_X86_REAL_LOSS_0_1_5_15_30_AND_DELAY_0_50_150_250",
            "CAPACITY_LIMITED_OR_GENERATOR_LIMITED",
            "HOST_NEAR_LIMIT_WEAKNET_VM")
          print("M0_PLAN028_H1351_NATIVE_TRUE_HETEROGENEOUS_L2_RESULT",a["classification"],flush=True)
          PY_GATE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1351-native-x86-real-weaknet-gradient-${{ github.run_id }}
          path: |
            fixed-kernel-result/h1351-*.json
            fixed-kernel-result/h1351-*.log
            fixed-kernel-result/h1250-*.json
            fixed-kernel-result/h1250-product-*.log
            fixed-kernel-result/h1286-rapid-report.json
            fixed-kernel-result/h1301-netem-clock.json
            fixed-kernel-result/h1312-static-neighbour-*.json
            fixed-kernel-result/h1250-qdisc-after.txt
            fixed-kernel-result/h1250-qdisc-before.txt
          if-no-files-found: warn
          retention-days: 14
