name: M0 PLAN028 native x86 genuine per-session Rust M2 path switch
run-name: PLAN028 H1137 native x86/x86 shared Rust M2 two-generation source4
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-plan028-x86-shared-rust-m2-frozen.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  native-x86-shared-m2-source-locked:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 41822046885
          github-token: ${{ github.token }}
          name: m0-plan024-linux-product
          path: linux-product
      - name: Verify exact frozen original x86_64 Go TLS and Rust M4 SOURCE
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 && test -c /dev/net/tun
          mkdir -p fixed-kernel-result
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          d=pathlib.Path("linux-product")
          m=json.loads((d/"manifest.json").read_text())
          assert m["source_sha"]=="ab472db3bb8481ed3f7b0c38d303eb19c91f3fee",m
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(d/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62
              assert hashlib.sha256(b).hexdigest()==m["sha256"][name],name
          print("M0_PLAN028_H1137_FROZEN_X86_BOTH_REAL_ELF62_SOURCE_SHA_PASS")
          PY
          chmod +x linux-product/wbd-v4-client linux-product/wbd-v4-server
          python3 tools/m0-plan028-x86-shared-rust-m2-fixture.py "$RUNNER_TEMP/h1137-original-x86.sh"
          bash -n "$RUNNER_TEMP/h1137-original-x86.sh"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
      - name: Real Linux x86/x86 original TLS source4 switch and two authenticated Rust M2 readbacks
        shell: bash
        run: |
          set -euo pipefail
          WBD_V4_PUBLIC_MODE=normal WBD_V4_PUBLIC_AUTO_IP=1 WBD_V4_PUBLIC_PATH_SWITCH=1 WBD_V4_PUBLIC_WIRE_AUDIT=0 \
             bash "$RUNNER_TEMP/h1137-original-x86.sh" linux-product >fixed-kernel-result/plan028-h1137-native-x86-shared-m2.log 2>&1 || {
             tail -140 fixed-kernel-result/plan028-h1137-native-x86-shared-m2.log >&2
             exit 1
          }
          grep -Fq "M0_PLAN028_H1137_X86_TWO_GENUINE_RUST_M2_READBACK_REBIND_AND_STOP_PASS" fixed-kernel-result/plan028-h1137-native-x86-shared-m2.log
          grep -Fq "M0_PLAN028_REAL_LINUX_RTN_NETLINK_A_TO_AB_TO_B_PASS" fixed-kernel-result/plan028-h1137-native-x86-shared-m2.log
          test "$(grep -c M0_PLAN028_REAL_PATH_SWITCH_UDP_ECHO_OK fixed-kernel-result/plan028-real-path-switched-business.log)" -eq 5
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1137-native-rust-m2.json").read_text())
          assert r["outer_repair_enabled"]==[1,1] and r["session_ready_flows"]==[1,2]
          assert len(r["first_wire_bytes"])==2 and min(r["first_wire_bytes"])>0
          assert r["CLI_intent_not_used_for_effective"] is True
          print("M0_PLAN028_H1137_NATIVE_TWO_ORIGINAL_RUST_EFFECTIVE_STATUS_AND_STOP_PASS")
          PY
          cat fixed-kernel-result/plan028-h1137-native-rust-m2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1137-native-x86-rust-m2-${{ github.run_id }}
          path: |
            linux-product/manifest.json
            fixed-kernel-result/plan028-h1137-native-x86-shared-m2.log
            fixed-kernel-result/plan028-h1137-native-rust-m2.json
            fixed-kernel-result/plan028-real-path-switched-business.log
            fixed-kernel-result/plan028-new-tun-mtu.json
            fixed-kernel-result/plan028-effective-new-physical-route.json
            fixed-kernel-result/plan028-auto-client-diagnostic.log
            fixed-kernel-result/plan028-auto-server-diagnostic.log
          retention-days: 14
          if-no-files-found: warn
