                  return {"source_measured_mbps":round(source*8/dur/1e6,3),
                          "unique_delivery_mbps":round(received*8/dur/1e6,3),
                          "delivery_fraction":round(received/source,5) if source else None}
              result.append({"phase":phase["name"],"seconds":dur,
