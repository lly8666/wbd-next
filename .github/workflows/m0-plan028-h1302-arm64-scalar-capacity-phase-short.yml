                  "netem_uplink_max_qlen":max(x["qlen"] for x in source),
                  "netem_uplink_sent_delta":source[-1]["packets"]-source[0]["packets"],
                  "netem_uplink_drop_delta":source[-1]["drops"]-source[0]["drops"],
                  "app_uplink":actual("udp","uplink"),"app_downlink":actual("udp","downlink")})
              elapsed+=dur
          assert elapsed==170
