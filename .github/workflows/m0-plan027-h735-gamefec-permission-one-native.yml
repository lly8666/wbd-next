name: M0 PLAN027 H735 one actual Game2FEC native after native-job permission fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h735-gamefec-permission-one-native.yml]
permissions: {contents: read, actions: write}
jobs:
  one-original-windows-game2-fec:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h735-game-native]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 0264c2cfc91e05c7c4b8d518fa0efc6707a2ff6b
      BUILD: "41280564979"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Assert real native Windows write permission and one original source before dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/41282490955" --jq .conclusion)" = failure
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD" --jq .head_sha)" = "$SOURCE"
          test "$(gh api "repos/$GH_REPO/actions/runs/41282419599" --jq .conclusion)" = success
          python3 - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/m0-wl-public-normal-full.yml").read_text()
          section=p.split("  native-public-two-os:\n",1)[1].split("    needs:",1)[0]
          assert "permissions: {contents: read, actions: write}" in section
          print("H735_PROVEN_H733_403_NATIVE_JOB_PERMISSION_FIXED_SOURCE_SCOPED")
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario("scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json")
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10 and s["tun_mtu"]==1400
          assert s["warmup_s"]==3 and s["drain_s"]==5 and s["seed"]==20261029
          for direction in ("windows_to_linux","linux_to_windows"):
              d=s[direction]
              assert (d["offered_mbps"],d["delay_ms"],d["loss_pct"])==(1,25,0)
          print("H735_GAMEFEC_IMMUTABLE_SCENE",s["scenario_sha256"])
          PY
          gh api "repos/$GH_REPO/actions/runs/$BUILD/jobs?per_page=100" |
            jq -e '[.jobs[]|select(.name=="Windows Go production and test compilation only" or .name=="Build true original Go and new Linux Rust peer persona from same SOURCE")|.conclusion]|length==2 and all(.=="success")' >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$SOURCE" '
              [.artifacts[]|select(.expired==false)|.name]
              | index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py tools/m0_wl_native_step_runner.py tools/m0_wl_gamefec_progress.py scenarios)"
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          prev="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -1)"
          if [ -n "$prev" ];then echo "H735_ALREADY_DISPATCHED=$prev";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$SOURCE"
          echo "H735_TRUE_GAMEFEC_NATIVE_PERMISSION_FIXED_DISPATCHED_NOT_PASS product_source=$SOURCE"
