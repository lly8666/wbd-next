name: M0 PLAN027 original 105s dead Go reauth two Mbps source TUN diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-plan027-cold-dead2m-diagnostic.yml
permissions:
  contents: read
  actions: read
jobs:
  original-one-source-2m-true-bilateral-dead-diagnostic:
    if: contains(github.event.head_commit.message, '[plan027-dead2m-diag]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SOURCE: e928b50cf872b6746a62c56662e5fc0768c5ca45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 50}
      - name: Same exact original source as failed 10Mbps and one valid 2Mbps diagnostic
        run: |
          set -euo pipefail
          git cat-file -e "$PRODUCT_SOURCE^{commit}"
          git diff --quiet "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/arm64_public_go_rust_bundle.sh
          python3 -m unittest tests.test_m0_plan027_cold_dead_2m_diagnostic -v
          python3 -m py_compile tools/network_harness/m0_plan027_cold_dead_2m_diagnostic.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 41368426841
          name: plan027-original-reauth-once-source-bundle
          github-token: ${{ github.token }}
          path: native-bundle
      - name: Verify SOURCE manifest and three original client server Rust binaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          m=json.load(open("native-bundle/manifest.json"))
          assert m["source"]==os.environ["PRODUCT_SOURCE"] and m["architecture"]=="x86_64"
          PY
          (cd native-bundle && sha256sum -c SHA256SUMS)
          chmod +x native-bundle/wbd-v4-client native-bundle/wbd-v4-server
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl ethtool
          test -c /dev/net/tun
      - name: One real same 105s both-direction 100pct blackhole and diagnostic 2Mbps restore
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_SHA,GITHUB_RUN_ID,GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_TEMP,GITHUB_JOB,PRODUCT_SOURCE \
            python3 -m tools.network_harness.m0_plan027_cold_dead_2m_diagnostic \
              --bundle "$GITHUB_WORKSPACE/native-bundle" \
              --product-source "$PRODUCT_SOURCE" \
              --scenario scenarios/plan027-n-cold-dead105-2m-diagnostic.json \
              --out "$GITHUB_WORKSPACE/plan027-cold-dead2m"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan027-original-reauth-105-2m-diagnostic
          path: |
            plan027-cold-dead2m/result.json
            plan027-cold-dead2m/cold-2m/result.json
            plan027-cold-dead2m/cold-2m/network-snapshots.json
            plan027-cold-dead2m/cold-2m/client-product-markers.log
            plan027-cold-dead2m/cold-2m/server-product-markers.log
          if-no-files-found: warn
          retention-days: 30
