name: M0 PLAN028 H1278 original FakeTCP final protected TLS ACK preflight
run-name: H1278 original FakeTCP final ACK sender barrier on ARM64
on:
  push:
    branches: ["work/m0-h1278-last-tls-ack-game2"]
    paths:
      - ".github/workflows/m0-plan028-h1278-faketcp-final-ack-preflight.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-faketcp:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Exact original Go FakeTCP ACK barrier and fenced detached state
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          for p in raw_detached_data_linux.go raw_detached_data_linux_test.go; do
            test ! -f "legacy/internal/faketcp/$p"
            cp "r0/go_overlay/internal/faketcp/$p" "legacy/internal/faketcp/$p"
          done
          for p in r0/go_overlay/internal/faketcp/raw_detached_data_linux.go r0/go_overlay/internal/faketcp/raw_detached_data_linux_test.go r0/go_overlay/internal/v4productcli/game_linux.go r0/go_overlay/internal/v4productcli/linux.go r0/go_overlay/internal/realityfront/admission_v4.go; do
            gofmt -e "$p" >/dev/null
          done
          (cd legacy && GOTOOLCHAIN=local go test -count=1 -v -run '^TestPLAN028DetachedLastProtectedTLSAckUnblocksOriginalSender$' ./internal/faketcp)
          (cd legacy && GOTOOLCHAIN=local go test -count=1 -run '^(TestDetachedDataKernelFilterPreservesHandshakeAndControl|TestDetachedDataKernelFilterSet)' ./internal/faketcp)
          echo H1278_ORIGINAL_FAKE_TCP_DETACHED_FINAL_ACK_UNIT_PASS
