name: M0 PLAN027 H788 GameFEC exact frozen owner route replay Windows Go
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h785-gamefec-route-preflight.yml]
permissions: {contents: read}
jobs:
  original-go-route-receipt-only:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h785-route-preflight]')
    runs-on: windows-2025
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Compile real pinned Windows donor plus M0 route receipt and run only scoped WAL tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/prepare_windows_wiring.py --check-only
          if($LASTEXITCODE -ne 0){throw 'original Go route source blob/manifest mismatch'}
          python tools/prepare_windows_wiring.py
          if($LASTEXITCODE -ne 0){throw 'Windows original Go assembly failed'}
          Push-Location legacy
          try {
            go test -tags wbd_v4_embedded_go -count=1 -run '^TestN4(WindowsPersistedFullRouteReceiptsRejectMismatchWithoutOSWrites|OriginalConfirmedFullRouteCrashReplayFakeBackend)$' -v ./internal/windowsclient
            if($LASTEXITCODE -ne 0){throw 'full route read-only parent/sidecar source test FAILED'}
          } finally {Pop-Location}
          Write-Output 'H788_WINDOWS_ORIGINAL_GO_ROUTESTAGE_FAKE_REPLAY_PASS_NOT_REAL_OS'
