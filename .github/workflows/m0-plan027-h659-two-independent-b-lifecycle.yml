name: M0 PLAN027 H659 original Normal blackout20 and Fixed idle105 separate
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h659-two-independent-b-lifecycle.yml]
permissions: {contents: read, actions: write}
jobs:
  exact-two:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h659-b-two]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: dc191cf5686ddff2e433312b8ec2258954bd018f
      BUILD_RUN: "41220597229"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Reuse exact unchanged original Go and Rust source products, dispatch two independent lifecycle cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' > /dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          cases=[("plan027-b-normal-blackhole20-recover-10m-25ms-0loss-60s.json","normal","lifecycle_blackhole_s",20),
                 ("plan027-b-fixed-idle-wake-10m-25ms-0loss-60s.json","fixed","lifecycle_idle_s",105)]
          for name,mode,k,v in cases:
              s=read_scenario("scenarios/"+name)
              assert s["public_mode"]==mode and s["duration_s"]==60 and s[k]==v
              for direction in ("windows_to_linux","linux_to_windows"):
                  d=s[direction]
                  assert d["offered_mbps"]==10 and d["delay_ms"]==25 and d["loss_pct"]==0
              print("H659_B_LIFECYCLE_SOURCE_FROZEN",name,s["scenario_sha256"])
          PY
          while read -r mode name;do
            scene="scenarios/$name"
            title="M0-WIN-LINUX|$GITHUB_SHA|$mode|$scene"
            prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
              jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id' | head -1)"
            if [ -n "$prior" ];then echo "H659_ALREADY_DISPATCHED scene=$scene run=$prior";continue;fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f "public_mode=$mode" -f "run_n0=false" -f "perf_scenario_file=$scene" \
              -f "perf_reuse_run_id=$BUILD_RUN" -f "perf_binary_source_sha=$PRODUCT_SOURCE"
            echo "H659_NEW_INDEPENDENT_NATIVE_LIFECYCLE scene=$scene original=$PRODUCT_SOURCE verdict=PENDING"
          done <<'SCENES'
          normal plan027-b-normal-blackhole20-recover-10m-25ms-0loss-60s.json
          fixed plan027-b-fixed-idle-wake-10m-25ms-0loss-60s.json
          SCENES
