# PLAN027 A2/A3 original native Windows/Linux, one source artifact,
# one physically impaired scene per distinct Actions workflow_dispatch.
name: M0 PLAN027 A2 A3 original two-OS per-scene dispatcher
on:
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions: {contents: read, actions: write}
concurrency:
  group: m0-plan027-a2a3-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  dispatch-only:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_sha == '88ba090086f0e42b4909d504bde3523848e414a3'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: main, persist-credentials: false}
      - name: Verify original full two-OS Normal and unchanged product before three A Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCT_SHA: 88ba090086f0e42b4909d504bde3523848e414a3
          PRODUCT_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$PRODUCT_RUN" --jq .head_sha)" = "$PRODUCT_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$PRODUCT_RUN" --jq .conclusion)" = success
          LATEST="$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)"
          test "$(git rev-parse HEAD)" = "$LATEST"
          git fetch --depth=1 origin "$PRODUCT_SHA"
          git diff --quiet "$PRODUCT_SHA" "$LATEST" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py ||
            { echo 'product changed; no synthetic source reuse'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$PRODUCT_RUN/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/wl-artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$PRODUCT_SHA" "$RUNNER_TEMP/wl-artifacts"
          grep -Fx "m0-plan024-linux-product" "$RUNNER_TEMP/wl-artifacts"
          # These are real committed netem configurations with 60s raw TUN
          # bidirectional UDP and separate original-Go TCP+Stop witnesses.
          for entry in \
            "normal:scenarios/plan027-a2-normal-10m-250ms-0loss-60s.json" \
            "normal:scenarios/wl-outer-repair-10m-250ms-loss30-60s.json" \
            "fixed:scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json"; do
            mode="${entry%%:*}"; scene="${entry#*:}"
            SCENE="$scene" MODE="$mode" python3 - <<'PY'
import os
from tools.m0_wl_perf_v2_config import read_scenario
s=read_scenario(os.environ['SCENE'])
assert s['public_mode']==os.environ['MODE'] and s['duration_s']==60
assert s['windows_to_linux']['offered_mbps']==10 and s['linux_to_windows']['offered_mbps']==10
assert s['windows_to_linux']['delay_ms']==250 and s['linux_to_windows']['delay_ms']==250
print('PLAN027_SCENE_SOURCE_LOCKED',s['scenario_id'],s['scenario_sha256'])
PY
            gh workflow run m0-wl-public-normal-full.yml --ref main \
              -f public_mode="$mode" -f perf_scenario_file="$scene" \
              -f run_n0=false -f perf_ab=false \
              -f perf_reuse_run_id="$PRODUCT_RUN" -f perf_binary_source_sha="$PRODUCT_SHA"
            echo "PLAN027_A_ACTION_DISPATCHED mode=$mode scene=$scene binary_source=$PRODUCT_SHA"
          done
