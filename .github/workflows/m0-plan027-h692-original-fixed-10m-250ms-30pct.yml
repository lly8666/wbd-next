name: M0 PLAN027 H692 original highest Fixed 10M 250ms 30pct kernel FEC
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h692-original-fixed-10m-250ms-30pct.yml]
permissions: {contents: read, actions: write}
jobs:
  one-frozen-fixed-30pct:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h692-fixed30]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 6ece9eab653f46a716e8d3a0927fb74bec4819e8
      BUILD_RUN: "41226521824"
      HARNESS_SOURCE: 92354d5a70f34640918f61b25859ba0bb05989dd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One original frozen Go TLS/Rust Windows Wintun/Linux kernel fixed genuine damaged test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$HARNESS_SOURCE"
          test -z "$(git diff --name-only "$HARNESS_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock)"
          test "$(git diff --name-only "$HARNESS_SOURCE" "$GITHUB_SHA" -- tools)" = tools/m0_wl_public_normal_e2e.py
          test -z "$(git diff --name-only "$HARNESS_SOURCE" "$GITHUB_SHA" -- scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          x=read_scenario('scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json')
          assert x['public_mode']=='fixed' and x['duration_s']==60 and x['tun_mtu']==1400 and x['seed']==20261030
          for side in ('windows_to_linux','linux_to_windows'):
              d=x[side];assert d['offered_mbps']==10 and d['delay_ms']==250 and d['loss_pct']==30
          print('H692_ORIGINAL_REAL_KERN_APP_fixed_30PCT',x['scenario_sha256'])
          PY
          scene=scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|fixed|$scene"
          existing="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id' | head -1)"
          if [ -n "$existing" ];then echo "H692_ALREADY_DISPATCHED run=$existing";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=fixed -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H692_FROZEN_REAL_fixed_NATIVE_DAMAGED_TWO_OS_DISPATCHED_NOT_PASS
