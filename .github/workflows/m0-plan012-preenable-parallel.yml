# PLAN012 release pre-enable, all three missing positive product gates
# genuinely execute on Actions; never call missing/skip PASS or auto-edit main.
# Fixed/Auto genuine M2 + lost source M4 Stop reuse the full existing gate
# in ONE same-SOURCE run. Product preflights execute concurrently with it.
name: M0 PLAN012 Linux parallel pre-enable hard gates
run-name: "M0|PLAN012-PREENABLE|${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan012-preenable-parallel.yml"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_public_product.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_public_product_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_game_product_linux.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_game_kernel_linux_test.go"
permissions: {contents: read}
concurrency:
  group: m0-plan012-preenable-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-fec-fixed-auto-m2-m4:
    # Compiles real original-Go TLS + Rust once, runs existing SOURCE-locked
    # lost-source Fixed/Auto authentic APPLIED, UDP and M4 S46 Stop assertions.
    uses: ./.github/workflows/m0-plan012-combined-functional.yml
    permissions: {contents: read}

  positive-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - gate: public-cli
            file: r0/go_overlay/internal/realityfront/bridge_v4_linux_public_product_test.go
            test: TestM0Plan012OriginalGoPublicLinuxCLIConnectDisconnectApplied
            owner: r0/go_overlay/internal/realityfront/bridge_v4_linux_public_product.go
          - gate: game2
            file: r0/go_overlay/internal/realityfront/bridge_v4_game_kernel_linux_test.go
            test: TestM0Plan012OriginalGoGame2RealKernelFirstApp
            owner: r0/go_overlay/internal/realityfront/bridge_v4_game_product_linux.go
          - gate: game4
            file: r0/go_overlay/internal/realityfront/bridge_v4_game_kernel_linux_test.go
            test: TestM0Plan012OriginalGoGame4RealKernelFirstApp
            owner: r0/go_overlay/internal/realityfront/bridge_v4_game_product_linux.go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Ensure real test and owner implementation exist; no native-only stand-in
        env:
          GATE: ${{ matrix.gate }}
          TEST_FILE: ${{ matrix.file }}
          TEST_NAME: ${{ matrix.test }}
          OWNER_FILE: ${{ matrix.owner }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,sys
          gate=os.environ["GATE"]
          expected=[os.environ["TEST_FILE"],os.environ["OWNER_FILE"]]
          missing=[p for p in expected if not pathlib.Path(p).is_file()]
          test=os.environ["TEST_NAME"]
          if not missing:
            source=pathlib.Path(expected[0]).read_text()
            if not re.search(r"(?m)^func\s+"+re.escape(test)+r"\s*\(\s*t\s+\*testing\.T\s*\)",source):
              missing.append("non-skipped real "+test)
          if gate in ("game2","game4"):
            native=pathlib.Path("crates/wbd-engine/src/v4_embedded_go.rs").read_text()
            if "wbd_m0_embedded_go_game_" not in native:
              missing.append("auth-bound Rust Game2/4 owner C ABI")
          if missing:
            print(f"::error::M0_PLAN012_{gate}_NOT_RUN missing="+", ".join(missing))
            sys.exit(2)
          print(f"M0_PLAN012_{gate}_POSITIVE_TEST_PRESENT_NOT_YET_RUN")
          PY

  execute-public-and-game-kernel:
    needs: [original-fec-fixed-auto-m2-m4, positive-source-probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - gate: public-cli
            test: TestM0Plan012OriginalGoPublicLinuxCLIConnectDisconnectApplied
            marker: M0_PLAN012_PUBLIC_LINUX_FEATURE7_CLI_CONNECT_DISCONNECT_APPLIED_PASS
          - gate: game2
            test: TestM0Plan012OriginalGoGame2RealKernelFirstApp
            marker: M0_PLAN012_ORIGINAL_GO_GAME2_M4_RAW_TUN_FIRST_APP_PASS
          - gate: game4
            test: TestM0Plan012OriginalGoGame4RealKernelFirstApp
            marker: M0_PLAN012_ORIGINAL_GO_GAME4_M4_RAW_TUN_FIRST_APP_PASS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m0-plan012-combined-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-artifact
      - name: Actual isolated Linux kernel owner, not compilation or canned output
        env:
          GATE: ${{ matrix.gate }}
          TEST_NAME: ${{ matrix.test }}
          REQUIRED_MARKER: ${{ matrix.marker }}
        shell: bash
        run: |
          set -euo pipefail
          test -s product-artifact/fixed-build/owner-go.test
          test -s product-artifact/fixed-build/libwbd_engine.so
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("product-artifact/fixed-kernel-result/manifest.json")
          j=json.loads(p.read_text())
          assert j["source_sha"]==os.environ["GITHUB_SHA"],"wrong prebuilt SOURCE"
          assert j["run_id"]==int(os.environ["GITHUB_RUN_ID"]),"wrong reusable run"
          assert j["attempt"]==int(os.environ["GITHUB_RUN_ATTEMPT"]),"wrong attempt"
          PY
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2
          test -c /dev/net/tun
          NS="wbdp_${GITHUB_RUN_ID}_${GATE}"
          sudo -n ip netns add "$NS"
          trap 'sudo -n ip netns del "$NS" || true' EXIT
          sudo -n ip -n "$NS" link set lo up
          sudo -n ip -n "$NS" addr add 10.0.0.2/32 dev lo
          sudo -n ip -n "$NS" addr add 10.0.1.1/32 dev lo
          sudo -n ip netns exec "$NS" env WBD_REAL_TUN=1 WBD_M0_PLAN012_PRODUCT_GATE="$GATE" LD_LIBRARY_PATH="$GITHUB_WORKSPACE/product-artifact/fixed-build" "$GITHUB_WORKSPACE/product-artifact/fixed-build/owner-go.test" -test.v -test.count=1 -test.run "^$TEST_NAME$" | tee "preenable-$GATE.log"
          grep -Fq -- "--- PASS: $TEST_NAME " "preenable-$GATE.log"
          grep -Fq "$REQUIRED_MARKER" "preenable-$GATE.log"
          echo "M0_PLAN012_TRUE_PRODUCT_GATE_PASS gate=$GATE SOURCE=$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan012-product-${{ matrix.gate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: preenable-*.log
          if-no-files-found: warn
          retention-days: 30

  linux-release-qualified:
    needs: [original-fec-fixed-auto-m2-m4, positive-source-probe, execute-public-and-game-kernel]
    runs-on: ubuntu-24.04
    steps:
      - name: All positive Linux prerequisites actually passed on one SOURCE
        run: |
          echo "M0_PLAN012_LINUX_PREENABLE_ALL_TRUE_GATES_PASS SOURCE=$GITHUB_SHA"
          echo "This is a qualification receipt; code/config remains OFF until M0 separately activates and verifies shipping artifacts."
