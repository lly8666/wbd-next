name: M0 PLAN027 H749 one original Game2FEC after real blocked pipe and Python stacks
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h749-gamefec-one-native-after-real-pipe.yml]
permissions: {contents: read, actions: write}
jobs:
  one-source-locked-game2-fec:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h749-single-game]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 0264c2cfc91e05c7c4b8d518fa0efc6707a2ff6b
      BINARY_BUILD: "41280564979"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Authenticate one genuine signed Windows NPF Wintun original Go TLS Rust Game2FEC binary and stage diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/41289214593" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/41289214607" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD/jobs?per_page=100" |
            jq -e '[.jobs[] | select(.name=="Windows Go production and test compilation only" or .name=="Build true original Go and new Linux Rust peer persona from same SOURCE") | .conclusion] | length==2 and all(.=="success")' >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '
              [.artifacts[]|select(.expired==false)|.name] |
              index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py tools/m0_wl_netem.py scenarios)"
          python3 - <<'PY'
          from pathlib import Path
          from tools.m0_wl_perf_v2_config import read_scenario
          from tools.m0_wl_native_step_runner import native_batch_deadline
          scene="scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json"
          s=read_scenario(scene)
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10
          assert s["tun_mtu"]==1400 and s["warmup_s"]==3 and s["drain_s"]==5
          assert s["seed"]==20261029
          for direction in ("windows_to_linux","linux_to_windows"):
              d=s[direction]
              assert (d["offered_mbps"],d["delay_ms"],d["loss_pct"])==(1,25,0)
          assert native_batch_deadline({"WBD_WL_PUBLIC_MODES":"game2-fec","WBD_WL_V2_SCENARIO":scene})==250
          r=Path("tools/m0_wl_native_step_runner.py").read_text()
          w=Path(".github/workflows/m0-wl-public-normal-full.yml").read_text()
          assert 'faulthandler.dump_traceback_later' in r
          assert 'target= _' not in r
          assert 'events.put("SUPERVISOR_POLL_OK")' in r
          assert 'gamefec-supervisor-stack.txt' in w
          assert "(inputs.public_mode == 'game2-fec' || inputs.public_mode == 'game4-fec') && '480'" in w
          for f in ("tools/m0_wl_public_modes_e2e.py","tools/m0_wl_public_normal_e2e.py"):
              assert 'faulthandler.dump_traceback_later' in Path(f).read_text()
          print("H749_REAL_PIPE_CI_PASSED_ORIGINAL_PRODUCTS_FROZEN",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          previous="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id' | head -1)"
          if [ -n "$previous" ]; then echo "H749_ALREADY_DISPATCHED=$previous"; exit 0; fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BINARY_BUILD" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo "H749_SINGLE_REAL_GAMEFEC_NATIVE_DISPATCHED_NOT_PASS SOURCE=$PRODUCT_SOURCE"
