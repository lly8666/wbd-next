# PLAN026 user-requested parallel Linux Auto + authenticated Keepalive/Health.
# Exact GitHub HEAD, independent jobs; only the Auto job exercises real Linux
# original Go TLS/raw/TUN; core Health job is NOT a two-OS idle-life PASS.
name: M0 PLAN026 Linux original Auto and authenticated Keepalive parallel
run-name: "M0|PLAN026-LINUX-AUTO-HEALTH|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan026-linux-auto-keepalive-parallel.yml"
      - "crates/wbd-engine/src/v4_native_health.rs"
      - "crates/wbd-engine/src/v4_embedded_go.rs"
      - "r0/go_overlay/internal/realityfront/bridge_v4_embedded_linux.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_client_product.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_linux_server_product.go"
      - "tools/m0-v4-public-real-linux-netns.sh"
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  # Reuse the exact current-source original-Go protected real Linux kernel
  # owner test (includes 64 non-synthetic Auto app packets, authentic M2,
  # bidirectional native Stop). Do NOT reuse historical binary/source621.
  auto-real-go-rust-two-netns:
    uses: ./.github/workflows/m0-plan012-combined-functional.yml
  keepalive-linux-authenticated-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Real Rust Health clock, authenticated Health TLV, dead versus FIN/Dormant negative checks
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc +1.85.1 --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          mkdir -p linux-health-result
          cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record --lib v4_native_health:: -- --nocapture --test-threads=1 >linux-health-result/health-tests.log 2>&1 || {
            tail -100 linux-health-result/health-tests.log;exit 1;
          }
          python3 - <<'PY'
          import pathlib,re,json,os
          p=pathlib.Path("linux-health-result/health-tests.log")
          s=p.read_text()
          passed=re.findall(r"^test (v4_native_health::[^\n]+) \.\.\. ok$",s,re.M)
          required=(
            "authenticated_health_keeps_idle_tunnel_alive_without_business",
            "missing_authenticated_records_becomes_dead_not_dormant",
            "stale_health_and_replaced_incarnation_are_not_alive_or_fin",
            "failure_retries_at_one_second_without_claiming_keepalive_success",
            "health_only_and_merged_receipt_quality_share_canonical_wbc4")
          assert len(passed)>=9 and all(any(n in x for x in passed) for n in required),passed
          assert "test result: ok." in s and "0 failed" in s and not re.search(r"^test .* \.\.\. FAILED$",s,re.M)
          # This is a real current-source Linux Rust *component* proof, not
          # invented original-Go TLS/kernel idle-hour certification.
          receipt={"source_sha":os.environ["GITHUB_SHA"],
             "scope":"linux/amd64 actual compiled Rust authenticated Health/Keepalive component",
             "authentic_record_codec":"PASS_SCOPED_CORE",
             "health_idle_dead_fin_incarnation":"PASS_SCOPED_CORE",
             "test_count":len(passed),"tests":passed,
             "linux_real_two_netns_idle_keepalive":"NOT_RUN",
             "windows_signed_driver":"NOT_RUN","physical":"NOT_RUN",
             "auto_real_kernel":"SEPARATE_PARALLEL_JOB"}
          pathlib.Path("linux-health-result/result.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("M0_PLAN026_LINUX_AUTHENTICATED_KEEPALIVE_HEALTH_CORE_PASS count="+str(len(passed)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan026-linux-health-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux-health-result/
          if-no-files-found: warn
          retention-days: 30
