name: M0 PLAN028 H1357 native ARM64 original TLS Game4 Off two actual hot lane rotations
run-name: PLAN028 H1357 native ARM64 original TLS Rust Game4 Off 5client true L1 rotation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-h1357-arm64-game4-off-rotation.yml"
      - "tools/m0-plan028-h1357-arm64-game4-off-rotation-fixture.py"
      - "tools/m0-plan028-h1357-arm64-game4-off-rotation-audit.py"
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      WBD_PLAN028_FAST_SCENE: pressure
      WBD_PLAN028_FAST_CAPACITY_STEPS: "2"
      WBD_PLAN028_QDISC_CLOCK_DIAG: "1"
      WBD_PLAN028_STATIC_OWNED_NEIGH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Original SOURCE exact five variant and Python syntax before any network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m0-plan028-h1357-arm64-game4-off-rotation-fixture.py \
            tools/m0-plan028-h1357-arm64-game4-off-rotation-audit.py
          python3 tools/m0-plan028-h1357-arm64-game4-off-rotation-fixture.py --preflight
          echo M0_PLAN028_H1357_PREFLIGHT_EXACT_GAME2_FEC6_AND_2_OWNER_ROTATIONS_PASS
  native-arm64-five-client-two-plus-timed-handover:
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    env:
      ORIGINAL_PRODUCT_SOURCE: 24e1fe6c4eab2a1abb7fb8a6d2093abaf57c0f73
      WBD_PLAN028_FAST_SCENE: pressure
      WBD_PLAN028_FAST_CAPACITY_STEPS: "2"
      WBD_PLAN028_QDISC_CLOCK_DIAG: "1"
      WBD_PLAN028_STATIC_OWNED_NEIGH: "1"
      WBD_GAME_FEC_BACKEND: scalar
      WBD_H1357_WRAPPER_SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 42379666500
          github-token: ${{ github.token }}
          name: plan028-h1327-native-arm64-build-24e1fe6c4eab2a1abb7fb8a6d2093abaf57c0f73
          path: fixed-build/
      - name: Recheck one frozen original Go TLS/Rust native ARM64 source and ELF manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -c /dev/net/tun
          python3 - <<'PY_BIN'
          import hashlib,json,pathlib,os,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["ORIGINAL_PRODUCT_SOURCE"]
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert m["architecture"]=="native_aarch64"
          assert set(m["sha256"])=={"wbd-v4-client","wbd-v4-server","libwbd_engine.so"}
          for name,sha in m["sha256"].items():
              raw=(root/name).read_bytes()
              assert raw[:4]==b"\x7fELF" and struct.unpack_from("<H",raw,18)[0]==183
              assert hashlib.sha256(raw).hexdigest()==sha,name
          print("M0_PLAN028_H1357_ORIGINAL_NATIVE_ARM64_BINARY_SHA_PASS",flush=True)
          PY_BIN
          chmod +x fixed-build/wbd-v4-client fixed-build/wbd-v4-server
      - name: One genuine 180s low-headroom five-client source-locked L1 timed rotation scenario
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          mkdir -p fixed-kernel-result
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          GITHUB_SHA="$ORIGINAL_PRODUCT_SOURCE" python3 -u \
            tools/m0-plan028-h1357-arm64-game4-off-rotation-fixture.py fixed-build \
            >fixed-kernel-result/h1357-native-rotating-traffic.log 2>&1 || {
              tail -150 fixed-kernel-result/h1357-native-rotating-traffic.log >&2
              exit 1
            }
          grep -Fq M0_PLAN028_H1357_NATIVE_ARM64_GAME4_OFF_REAL_ROTATION_CAPTURED \
            fixed-kernel-result/h1357-native-rotating-traffic.log
          python3 -u tools/m0-plan028-h1357-arm64-game4-off-rotation-audit.py \
            --art fixed-kernel-result --out fixed-kernel-result/h1357-native-l1-owner-rotation.json \
            | tee fixed-kernel-result/h1357-rotation-audit.log
          python3 - <<'PY_GATE'
          import json,pathlib
          r=json.loads(pathlib.Path("fixed-kernel-result/h1357-native-l1-owner-rotation.json").read_text())
          assert r["source_sha"]=="24e1fe6c4eab2a1abb7fb8a6d2093abaf57c0f73"
          assert r["wrapper_source"]==__import__("os").environ["GITHUB_SHA"]
          assert r["original_single_tls_port"]==443 and r["all_exact_final_stop"]
          assert r["classification"]=="PASS_SCOPED_NATIVE_ARM64_GAME2_FIXED6_TWO_REAL_ROTATIONS_FIVE_CLIENT",r["native_app_or_owner_errors"]
          print("M0_PLAN028_H1357_ORIGINAL_ARM64_GAME4_OFF_FIVE_CLIENT_ROTATIONS_PASS",flush=True)
          PY_GATE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1357-native-arm64-game4-off-rotation-${{ github.run_id }}
          path: |
            fixed-kernel-result/h1357-*.json
            fixed-kernel-result/h1357-*.log
            fixed-kernel-result/h1250-*.json
            fixed-kernel-result/h1250-product-*.log
            fixed-kernel-result/h1286-rapid-report.json
            fixed-kernel-result/h1301-netem-clock.json
            fixed-kernel-result/h1312-static-neighbour-*.json
          if-no-files-found: warn
          retention-days: 14
