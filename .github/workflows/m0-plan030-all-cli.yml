name: PLAN030 every CLI command dual ISA final qualification
on:
  push:
    branches: [experiment/m0-030-server-cli]
    paths: [.github/workflows/m0-plan030-all-cli.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  all-cli:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      WBD_PLAN030_ALL_CLI: '1'
      WBD_PLAN030_BINARY_SOURCE: 1d6081c7b54e2804236072007fde1d73986ff3cb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Exact frozen native delivery
        run: |
          set -euo pipefail
          git diff --exit-code "$WBD_PLAN030_BINARY_SOURCE" HEAD -- crates Cargo.toml Cargo.lock r0 deploy/plan030 tools/m0_plan029_linux_dual_native_build.sh tools/plan030_package.py
          gh run download 45344159343 --repo "$GITHUB_REPOSITORY" --name plan030-native-${{ matrix.arch }} --dir frozen
          tar -xzf frozen/plan030-native-bundle.tar.gz
          tar -xzf frozen/wbd-next-plan030-server.tar.gz
          python3 - <<'PY'
          import json,os,platform
          for p in ("linux-plan029-public-bundle/manifest.json","wbd-next/manifest.json"):
              m=json.load(open(p))
              assert m["source_sha"]==os.environ["WBD_PLAN030_BINARY_SOURCE"]
              assert m["architecture"]==platform.machine()
          PY
          (cd linux-plan029-public-bundle && sha256sum -c SHA256SUMS)
          (cd wbd-next && sha256sum -c SHA256SUMS)
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping iptables openssl python3
      - name: Every ordinary management entry point on native installed service
        run: |
          set -o pipefail
          bash tools/plan030_systemd_smoke.sh "$PWD/wbd-next" 2>&1 | tee plan030-all-cli.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan030-all-cli-${{ matrix.arch }}
          path: plan030-all-cli.log
  dispatch-windows-domain:
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: write}
    steps:
      - name: Reuse previous Windows domain scene and improve failure visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run m0-wl-public-normal-full.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f public_mode=normal -f native_outer_mtu=default1460 -f outer_repair=on -f run_n0=false -f plan029_case=domain_reconnect
