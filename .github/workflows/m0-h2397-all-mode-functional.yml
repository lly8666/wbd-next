name: M0 H2397 all-mode native parity functional dispatch
run-name: "H2397 all-mode functional | ${{ github.sha }}"
on:
  push:
    branches: [experiment/m0-029-all-mode-native-parity]
    paths: ['.github/workflows/m0-h2397-all-mode-functional.yml']
permissions: {contents: read, actions: write}
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF: ${{ github.ref_name }}
    steps:
      - name: Dispatch only two original ordinary functional suites
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$REF" --jq .object.sha)" = "$GITHUB_SHA"
          gh workflow run m0-plan029-linux-dual-isa-native.yml --repo "$GH_REPO" --ref "$REF" -f all_modes=true
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref "$REF" -f public_mode=all -f native_outer_mtu=default1460 -f outer_repair=on -f run_n0=false
          echo "H2397_REAL_FUNCTIONAL_DISPATCHED_FINAL_SOURCE source=$GITHUB_SHA"

# H2397: Linux trait import compile correction; functional only.
