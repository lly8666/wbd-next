name: M0 PLAN027 H662 original Windows Normal native Stop bounded source test
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h662-windows-normal-stop-bounded.yml]
permissions: {contents: read}
jobs:
  windows-original-native-rust:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Windows original Normal native bounded Stop negative and positive worker test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'pinned Rust 1.85.1 missing'}
          & cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,fec2_product_record --lib normal_native_stop_timeout_retains_worker_until_real_join -- --nocapture --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'Normal native bounded Stop negative and positive fail'}
          Write-Output 'H662_SOURCE_WINDOWS_NORMAL_STOP_NEGATIVE_POSITIVE_WORKER_PASS_ONLY_NO_DRIVER'
      - name: Rust native Windows product release ABI link
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_embedded_go,fec2_product_record
          if($LASTEXITCODE -ne 0){throw 'Windows Rust native original Normal product release compile fail'}
          Write-Output 'H662_WINDOWS_RUST_NORMAL_BOUNDED_STOP_RELEASE_COMPILE_ONLY'
