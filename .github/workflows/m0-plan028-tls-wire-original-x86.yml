name: M0 PLAN028 original TLS first-flight x86 native wire
run-name: PLAN028 H1067 standard TLS pre-shared wire x86 ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-tls-wire-original-x86.yml"
      - "r0/go_overlay/internal/realityfront/admission_v4.go"
      - "r0/go_overlay/internal/realityfront/tls.go"
      - "r0/go_overlay/internal/realityfront/v4_tls_handshake_contract_test.go"
      - "r0/go_overlay/internal/v4productcli/linux.go"
      - "r0/go_overlay/assembly/manifest-plan020-m0.json"
      - "tools/m0_plan028_tls_wire_audit.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-x86-go-tls-real-native-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Exact original Go SOURCE+manifest, no WB-R1 source, native Go/Rust one build
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          mkdir -p fixed-kernel-result fixed-build
          test ! -e r0/go_overlay/internal/realityfront/v4_route_prelude.go
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          test ! -e legacy/internal/realityfront/v4_route_prelude.go
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path.cwd()
          original=root/"legacy"
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  dst=original/part/src.name
                  if dst.exists():
                      assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for file in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              src=root/"r0/go_overlay/internal/faketcp"/file
              dst=original/"internal/faketcp"/file
              assert not dst.exists()
              dst.write_bytes(src.read_bytes())
          for app in ("client","server"):
              dest=original/("cmd/wbd-v4-"+app)
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"main.go").write_bytes((root/("r0/go_overlay/cmd/wbd-v4-"+app+"/main.go")).read_bytes())
          receipt=json.loads((root/"fixed-kernel-result/assembly.json").read_text())
          assert receipt["overlay_source"]==os.environ["GITHUB_SHA"]
          assert receipt["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          print("M0_PLAN028_TLS_EXACT_ORIGINAL_GO_MANIFEST_VERIFIED no_prelude=1")
          PY
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --release --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-build.log 2>&1 || { tail -100 fixed-kernel-result/rust-build.log; exit 1; }
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^(TestPLAN028V4|TestFirefox120PersonaKeepsPresetAndRouteMarker)' ./internal/realityfront) >fixed-kernel-result/standard-tls-go-unit.log 2>&1 || {
            tail -130 fixed-kernel-result/standard-tls-go-unit.log >&2;exit 1;
          }
          grep -q -- '--- PASS: TestPLAN028V4NoPreludeOriginalClientHelloFullCertificateAndSessionIDEpoch' fixed-kernel-result/standard-tls-go-unit.log
          grep -q -- '--- PASS: TestPLAN028V4WrongRouteKeyWrongCertAndWrongPasswordNoAdmission' fixed-kernel-result/standard-tls-go-unit.log
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          sha256sum fixed-build/{wbd-v4-client,wbd-v4-server,libwbd_engine.so} >fixed-kernel-result/product-sha256.txt
          echo M0_PLAN028_TLS_SOURCE_LOCKED_GO_RUST_X86_BUILD_PASS
      - name: One genuine native Linux x86/x86 Normal TLS first-flight & UDP/Stop
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl tcpdump
          test -c /dev/net/tun
          bash -n tools/m0-v4-public-real-linux-netns.sh
          WBD_V4_PUBLIC_AUTO_IP=1 WBD_V4_PUBLIC_WIRE_AUDIT=1 \
            bash tools/m0-v4-public-real-linux-netns.sh fixed-build >fixed-kernel-result/tls-wire-real-native.log 2>&1 || {
              tail -145 fixed-kernel-result/tls-wire-real-native.log >&2;exit 1;
            }
          grep -Fq 'M0_PLAN028_TLS_REAL_TCP_REASSEMBLED_CLIENTHELLO_NO_PRELUDE_PASS' fixed-kernel-result/tls-wire-real-native.log
          grep -Fq 'M0_PLAN028_REAL_AUTO_LEASE_NATIVE_IP_BOUND_PASS' fixed-kernel-result/tls-wire-real-native.log
          python3 - <<'PY'
          import json
          d=json.load(open("fixed-kernel-result/plan028-tls-wire-audit.json"))
          assert d["result"]=="REAL_TCP_STREAM_TLS_FIRST_FLIGHT_PASS"
          assert d["client_first_payload"]=="TLS_Handshake_ClientHello"
          assert d["server_first_payload"]=="TLS_Handshake_ServerHello"
          assert d["session_id_length"]==32
          print("M0_PLAN028_REAL_TCP_TLS_CLASSIFIER_NO_WB_R1_AND_CERTIFIED_ADMISSION_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-h1067-native-x86-wire-${{ github.run_id }}
          path: |
            fixed-kernel-result/assembly.json
            fixed-kernel-result/standard-tls-go-unit.log
            fixed-kernel-result/plan028-tls-wire-audit.json
            fixed-kernel-result/tls-wire-real-native.log
            fixed-kernel-result/product-sha256.txt
          if-no-files-found: warn
          retention-days: 14
