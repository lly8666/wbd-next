name: M0 ARM ACCA feedback comparison
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths:
      - '.github/workflows/qa-m0-dual-tcp-arm-linux-parity.yml'
      - 'tools/m0_dual_tcp_arm_linux_parity.py'
      - 'tools/m0_dual_tcp_path_sample.py'
      - 'crates/wbd-engine/src/v4_rust_tcp/pktkit/vtcp/conn.rs'
      - 'crates/wbd-engine/src/v4_rust_tcp/pktkit/vtcp/autotune.rs'
      - 'crates/wbd-engine/src/v4_rust_tcp/pktkit/vtcp/rate.rs'
      - 'crates/wbd-engine/src/v4_rust_tcp/pktkit/vtcp/scoreboard.rs'
      - 'crates/wbd-engine/src/v4_rust_tcp/flow.rs'
      - 'crates/wbd-engine/src/v4_rust_tcp/mod.rs'
      - 'crates/wbd-engine/src/v4_embedded_go.rs'
      - '.github/workflows/qa-m0-dual-tcp-arm-acca.yml'
      - 'tools/m0_dual_rust_tcp_local.py'
      - '.github/workflows/qa-m0-dual-rust-tcp-core.yml'
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  compare:
    uses: ./.github/workflows/qa-m0-dual-tcp-arm-linux-parity.yml
    with:
      arm: 'C'
    secrets: inherit
