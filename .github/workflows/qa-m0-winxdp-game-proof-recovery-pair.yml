name: M0 physical Game2 proof-timeout repair paired Windows ARM64 delivery
run-name: "M0 Game2/4 proof-timeout repair WinXDP and compatible Linux server | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-winxdp']
    paths: ['.github/workflows/qa-m0-winxdp-game-proof-recovery-pair.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      WBD_XDP_PRESSURE_LAB: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 'f0a44731fa4fb89d8cf05ab27dfe5179ecc938e2', persist-credentials: false, fetch-depth: 0}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', cache: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winxdp-current-ab-build
          path: xdp-build
          run-id: 46097895116
          github-token: ${{ github.token }}
      - name: Compile corrected Go cold client; reuse exact unchanged native DLL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='f0a44731fa4fb89d8cf05ab27dfe5179ecc938e2'
          $b=Get-Content xdp-build/current-dll-manifest.json -Raw | ConvertFrom-Json
          if((git rev-parse HEAD).Trim() -ne $source -or $b.source_sha -ne '569b51abe62c499e1ea7e2f4e232f205756a891f' -or $b.lab -ne $false -or $b.features -notmatch 'native_fec_acceleration'){throw 'native release identity mismatch'}
          git diff --exit-code '569b51abe62c499e1ea7e2f4e232f205756a891f' $source -- crates Cargo.toml Cargo.lock
          if($LASTEXITCODE -ne 0){throw 'native product changed; rebuild required'}
          if($b.dll -ne '2282d5a41538a519a7c6af4c7693359fa7ce0ab0cc2141991dd31b9f054a419d' -or (Get-FileHash xdp-build/wbd_engine.dll).Hash.ToLowerInvariant() -ne $b.dll){throw 'measured native DLL hash mismatch'}
          # Only the child assembly process uses the explicit product SOURCE.
          # Event SHA identifies the packaging workflow, not the checked-out product.
          $eventSource=$env:GITHUB_SHA
          try{
            $env:GITHUB_SHA=$source
            python tools/prepare_windows_wiring.py
            if($LASTEXITCODE -ne 0){throw 'original Windows assembly failed'}
          }finally{$env:GITHUB_SHA=$eventSource}
          Push-Location legacy
          try{
            go test -tags wbd_v4_embedded_go -run '^TestM0WindowsNative(GameScheduledProofTimeoutRenewsOnlyAfterExactStop|RotationBounds|CanceledTickNeverMasqueradesAsMTUDrift)
          & ./tools/m0_winxdp_release_package.ps1 -SourceSHA $source
          if($LASTEXITCODE -ne 0){throw 'portable assembly failed'}
      - name: Verify complete ZIP contents and exact hashes (assembly only)
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          if(Get-Service npcap -ErrorAction SilentlyContinue){throw 'runner has Npcap, no clean dependency proof'}
          $dir=Join-Path $PWD 'package-test'
          Expand-Archive xdp-build/WBD-Windows-amd64-WinXDP.zip $dir -Force
          $m=Get-Content "$dir/package-manifest.json" -Raw | ConvertFrom-Json -AsHashtable
          if($m.source_sha -ne 'f0a44731fa4fb89d8cf05ab27dfe5179ecc938e2'){throw 'package source mismatch'}
          foreach($key in $m.files.Keys){
            if((Get-FileHash (Join-Path $dir $key)).Hash.ToLowerInvariant() -ne $m.files[$key]){throw "package bytes mismatch: $key"}
          }
          foreach($key in @('WBD.exe','wbd-client.exe','wbd_engine.dll','wintun.dll','drivers/winxdp/xdp.inf','drivers/winxdp/xdp.cat','drivers/winxdp/xdp.sys','drivers/winxdp/xdpapi.dll','licenses/WinXDP-MIT.txt','licenses/Wintun.txt')){
            if(-not (Test-Path (Join-Path $dir $key))){throw "package missing $key"}
          }
          $compiled=Get-Content xdp-build/manifest.json -Raw | ConvertFrom-Json
          if($m.files['wbd-client.exe'] -ne $compiled.exe -or $m.files['wbd_engine.dll'] -ne '2282d5a41538a519a7c6af4c7693359fa7ce0ab0cc2141991dd31b9f054a419d'){throw 'packaged core identity mismatch'}
          if(Get-ChildItem $dir -Recurse -File | Where-Object {$_.Name -match '^(npcap|wpcap|packet)\.(dll|sys|exe)$'}){throw 'unexpected Npcap dependency'}
          New-Item -ItemType Directory -Force package-receipts | Out-Null
          Copy-Item "$dir/package-manifest.json" package-receipts/
          Copy-Item xdp-build/manifest.json package-receipts/core-manifest.json
          [ordered]@{source_sha=$m.source_sha;native_binary_run=46097895116;previous_performance_run=46107717010;package_run=[long]$env:GITHUB_RUN_ID;zip_sha256=(Get-FileHash xdp-build/WBD-Windows-amd64-WinXDP.zip).Hash.ToLowerInvariant();scope='targeted cold proof unit regression and complete portable build only; native DLL unchanged; new Go not performance-qualified'} | ConvertTo-Json | Set-Content package-receipts/delivery.json
          Get-Content package-receipts/delivery.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WBD-Windows-amd64-WinXDP-Game-proof-recovery
          path: xdp-build/WBD-Windows-amd64-WinXDP.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: winxdp-complete-package-receipts
          path: package-receipts/
          if-no-files-found: warn
          retention-days: 30
 -count=1 ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'targeted cold proof regression failed'}
            go build -trimpath -tags wbd_v4_embedded_go -o ../xdp-build/wbd-client-embedded.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'corrected original Go build failed'}
          }finally{Pop-Location}
          $exe=(Get-FileHash xdp-build/wbd-client-embedded.exe).Hash.ToLowerInvariant()
          [ordered]@{source_sha=$source;go_source_sha=$source;dll_source_sha=$b.source_sha;features=$b.features;native_fec_acceleration=$true;lab=$false;dll=$b.dll;exe=$exe;native_binary_run=46097895116} | ConvertTo-Json | Set-Content xdp-build/manifest.json
          & ./tools/m0_winxdp_release_package.ps1 -SourceSHA $source
          if($LASTEXITCODE -ne 0){throw 'portable assembly failed'}
      - name: Verify complete ZIP contents and exact hashes (assembly only)
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          if(Get-Service npcap -ErrorAction SilentlyContinue){throw 'runner has Npcap, no clean dependency proof'}
          $dir=Join-Path $PWD 'package-test'
          Expand-Archive xdp-build/WBD-Windows-amd64-WinXDP.zip $dir -Force
          $m=Get-Content "$dir/package-manifest.json" -Raw | ConvertFrom-Json -AsHashtable
          if($m.source_sha -ne '569b51abe62c499e1ea7e2f4e232f205756a891f'){throw 'package source mismatch'}
          foreach($key in $m.files.Keys){
            if((Get-FileHash (Join-Path $dir $key)).Hash.ToLowerInvariant() -ne $m.files[$key]){throw "package bytes mismatch: $key"}
          }
          foreach($key in @('WBD.exe','wbd-client.exe','wbd_engine.dll','wintun.dll','drivers/winxdp/xdp.inf','drivers/winxdp/xdp.cat','drivers/winxdp/xdp.sys','drivers/winxdp/xdpapi.dll','licenses/WinXDP-MIT.txt','licenses/Wintun.txt')){
            if(-not (Test-Path (Join-Path $dir $key))){throw "package missing $key"}
          }
          if($m.files['wbd-client.exe'] -ne 'ad3580ba0297f54e9ae9cf8ad404ee3cfcbf60811e14623f9bf69de451a7655f' -or $m.files['wbd_engine.dll'] -ne '2282d5a41538a519a7c6af4c7693359fa7ce0ab0cc2141991dd31b9f054a419d'){throw 'packaged executable is not the measured release'}
          if(Get-ChildItem $dir -Recurse -File | Where-Object {$_.Name -match '^(npcap|wpcap|packet)\.(dll|sys|exe)$'}){throw 'unexpected Npcap dependency'}
          New-Item -ItemType Directory -Force package-receipts | Out-Null
          Copy-Item "$dir/package-manifest.json" package-receipts/
          [ordered]@{source_sha=$m.source_sha;binary_run=46097895116;accepted_qa_run=46107717010;package_run=[long]$env:GITHUB_RUN_ID;zip_sha256=(Get-FileHash xdp-build/WBD-Windows-amd64-WinXDP.zip).Hash.ToLowerInvariant();scope='assembly and exact hash verification only; no new runtime or performance testing; experimental Windows amd64 portable'} | ConvertTo-Json | Set-Content package-receipts/delivery.json
          Get-Content package-receipts/delivery.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WBD-Windows-amd64-WinXDP-complete
          path: xdp-build/WBD-Windows-amd64-WinXDP.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: winxdp-complete-package-receipts
          path: package-receipts/
          if-no-files-found: warn
          retention-days: 30

  server_arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: aarch64
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 'f0a44731fa4fb89d8cf05ab27dfe5179ecc938e2', persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', cache: false}
      - name: Build matched ARM64 glibc 2.31 native Go Rust ISA-L pair
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA='f0a44731fa4fb89d8cf05ab27dfe5179ecc938e2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          bash tools/m0_plan029_linux_dual_native_build.sh > compatible-build.log 2>&1 || { tail -100 compatible-build.log; exit 1; }
          python3 tools/m0_linux_glibc_abi.py linux-plan029-public-bundle 2.31
          mkdir -p delivery
          tar -czf delivery/wbd-linux-aarch64-glibc231.tar.gz -C linux-plan029-public-bundle .
          (cd delivery && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: WBD-Linux-aarch64-glibc231-Game2-Game4-pair
          path: |
            delivery/
            linux-plan029-public-bundle/manifest.json
            linux-plan029-public-bundle/glibc-abi.json
            compatible-build.log
          if-no-files-found: error
          retention-days: 30
