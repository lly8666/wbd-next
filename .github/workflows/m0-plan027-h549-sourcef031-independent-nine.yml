name: M0 PLAN027 H549 real f031 all damage Game FEC Auto Fixed C50
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h549-sourcef031-independent-nine.yml]
permissions: {contents: read, actions: write}
jobs:
  source-locked-nine:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h550-nine-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Gate verified new source true zero loss once then six separate two-OS scenarios no rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          src=f0313d565e4e271aeb3cce3df11762b046d76f2e
          build=41155198489
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build" --jq .head_sha)" = "$src"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$build/artifacts" --jq '.artifacts[].name' > "$RUNNER_TEMP/h549-artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$src" "$RUNNER_TEMP/h549-artifacts"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/h549-artifacts"
          grep -Fx m0-wl-full-public-normal-direct "$RUNNER_TEMP/h549-artifacts"
          mkdir -p "$RUNNER_TEMP/zero"
          gh run download "$build" --repo "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/zero"
          export H549_REAL_ZERO="$RUNNER_TEMP/zero"
          python3 - <<'PY'
          import os,json,pathlib,re
          from tools.m0_wl_perf_v2_config import read_scenario
          root=pathlib.Path(os.environ['H549_REAL_ZERO'])
          r=json.loads((root/'report.json').read_text())
          src='f0313d565e4e271aeb3cce3df11762b046d76f2e'
          assert r['source']==src and r['linux_binary_source']==src
          assert r['stop']=='PASS_BOTH_OWNED' and r['mode_public'].endswith('_normal')
          v=r['WL_V2']
          z=read_scenario('scenarios/plan027-h539-normal-10m-250ms-loss0-60s.json')
          assert v['status']=='MEASURED_BOTH_OS_KERNEL' and v['scenario_sha256']==z['scenario_sha256']
          assert all(v['first_delivery_fraction'][s]>=.999 for s in ('windows','linux'))
          t=(root/'mode-results/normal/client.log').read_text(errors='replace')
          rows=re.findall(r'WBD_WINDOWS_NATIVE_OUTER_REPAIR source_wire_bytes=(\d+) repair_accepted_wire_bytes=(\d+) repair_uncertain_wire_bytes=(\d+) control_wire_bytes=(\d+) repair_packets=(\d+)',t)
          assert len(rows)==1
          f,rep,unc,c,packets=map(int,rows[0])
          assert f>0 and (rep+unc)*1000<=f, 'unjustified no-loss retransmit'
          l=(root/'mode-results/normal/server.log').read_text(errors='replace')
          linux_rows=re.findall(r'V4_PUBLIC_M2_OUTER[^\n]*first_wire_bytes=(\d+) repair_accepted_wire_bytes=(\d+) repair_uncertain_wire_bytes=(\d+)',l)
          assert linux_rows
          lf,lr,lu=map(int,linux_rows[-1])
          assert lf>0 and (lr+lu)*1000<=lf
          print('H549_EXACT_ORIGINAL_ZERO_PASS',f,rep,unc,c,lf,lr)
          for p in (1,5,15,30):
              path=f'scenarios/plan027-h539-normal-10m-250ms-loss{p}-60s.json' if p!=30 else 'scenarios/wl-outer-repair-10m-250ms-loss30-60s.json'
              q=read_scenario(path)
              assert q['public_mode']=='normal' and q['seed']==20261030 and q['duration_s']==60
              assert all(q[d]['loss_pct']==p and q[d]['offered_mbps']==10 and q[d]['delay_ms']==250 for d in ('windows_to_linux','linux_to_windows'))
              print('H549_ONE_LOSS_TIER',p,q['scenario_sha256'])
          for mode,path,loss in (
            ('game2-fec','scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json',15),
            ('game4-fec','scenarios/wl-game4-fixed6-10m-75ms-loss30-20s.json',30)
          ):
              q=read_scenario(path)
              assert q['public_mode']==mode and q['duration_s']==20
              assert all(q[d]['loss_pct']==loss and q[d]['offered_mbps']==10 for d in ('windows_to_linux','linux_to_windows'))
              print('H549_GAME_COLD_ONE_SCENE',mode,q['scenario_sha256'])
          for mode,path,seconds in (
            ('fixed','scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json',60),
            ('auto','scenarios/plan027-a4-auto-10m-staged-240s.json',240),
            ('normal','scenarios/plan027-c-normal-50m-25ms-loss0-60s.json',60)
          ):
              q=read_scenario(path)
              assert q.get('public_mode','normal')==mode and q['duration_s']==seconds
              print('H549_NEW_SOURCE_SCENE',mode,q['scenario_sha256'])
          PY
          while read -r mode scenario; do
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_ab=false \
              -f perf_scenario_file="$scenario" \
              -f perf_reuse_run_id="$build" -f perf_binary_source_sha="$src"
            echo "H549_ONE_TWO_OS_ACTION $mode $scenario source=$src"
          done <<'EOF'
          normal scenarios/plan027-h539-normal-10m-250ms-loss1-60s.json
          normal scenarios/plan027-h539-normal-10m-250ms-loss5-60s.json
          normal scenarios/plan027-h539-normal-10m-250ms-loss15-60s.json
          normal scenarios/wl-outer-repair-10m-250ms-loss30-60s.json
          game2-fec scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json
          game4-fec scenarios/wl-game4-fixed6-10m-75ms-loss30-20s.json
          fixed scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json
          auto scenarios/plan027-a4-auto-10m-staged-240s.json
          normal scenarios/plan027-c-normal-50m-25ms-loss0-60s.json
          EOF
