name: M0 PLAN027 H703 Game2 FEC one source653 binary-reused due INVALID and Stop verdict
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h703-source653-prebuilt-first-fault1m.yml]
permissions: {contents: read, actions: write}
jobs:
  one-immutable-game-fec-first-error:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h703-fast-fault1m]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 653744efca9e6878c456595b508a2968d7ad83ff
      BINARY_BUILD_RUN: "41266830417"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Reuse H702 compiled exact original diagnostics; one REAL two-OS Game2 FEC 1M, no new build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD_RUN/jobs?per_page=100" |
            jq -e '[.jobs[]|select(.name=="Windows Go production and test compilation only" or .name=="Build true original Go and new Linux Rust peer persona from same SOURCE")|.conclusion]|length==2 and all(.=="success")' >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml scenarios tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_public_modes_e2e.py)"
          test "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- tools/m0_wl_public_normal_e2e.py)" = tools/m0_wl_public_normal_e2e.py
          grep -q 'WL_GAME_DUE_DIAGNOSTIC_FINAL' tools/m0_wl_public_normal_e2e.py
          grep -q 'game_due_first_fault()' tools/m0_wl_public_normal_e2e.py
          python3 -m py_compile tools/m0_wl_public_normal_e2e.py
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json')
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10 and s["warmup_s"]==3 and s["drain_s"]==5
          for k in ("windows_to_linux","linux_to_windows"):
              d=s[k];assert d["offered_mbps"]==1 and d["delay_ms"]==25 and d["loss_pct"]==0
          print("H703_SOURCE653_ORIGINAL_PREBUILT_FIRST_BRANCH_AND_OWNED_WAL_DIAGNOSTIC",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id' | head -1)"
          if [ -n "$old" ];then echo "H703_ALREADY_DISPATCHED=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BINARY_BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H703_GENUINE_SAME_PRODUCT_ONE_GAME2_FEC_1M_0PCT_DIAGNOSTIC_DISPATCHED_NOT_PASS
