name: M0 PLAN027 H867 authenticated-retire bilateral 105s true product
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-plan027-h867-bilateral-auth-retire.yml
permissions:
  contents: read
  actions: read
jobs:
  one-original-cold-stage-both:
    if: contains(github.event.head_commit.message, '[plan027-h867-bilateral]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SOURCE: b74728ba0b1ee45c632c31117fc8c08c042e11a0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 50}
      - name: Verify only fixture changed since one product SOURCE and safe scenario
        run: |
          set -euo pipefail
          git cat-file -e "$PRODUCT_SOURCE^{commit}"
          git diff --quiet "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/arm64_public_go_rust_bundle.sh
          python3 -m unittest tests.test_m0_plan027_native_reauth_diag tests.test_m0_plan027_linux_blackhole_recover -v
          python3 -m py_compile tools/network_harness/m0_plan027_linux_blackhole_recover.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: "41383107457"
          name: plan027-h865-once-original-auth-retire
          github-token: ${{ github.token }}
          path: native-bundle
      - name: Exact SOURCE manifest and frozen three original product SHA256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          m=json.load(open("native-bundle/manifest.json"))
          assert m["source"]==os.environ["PRODUCT_SOURCE"] and m["architecture"]=="x86_64"
          PY
          (cd native-bundle && sha256sum -c SHA256SUMS)
          chmod +x native-bundle/wbd-v4-client native-bundle/wbd-v4-server
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl ethtool
          test -c /dev/net/tun
      - name: Exactly one real bilateral105 at10Mbps with 120s restored business
        run: |
          set -uo pipefail
          sudo -n --preserve-env=GITHUB_SHA,GITHUB_RUN_ID,GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_TEMP,GITHUB_JOB,PRODUCT_SOURCE \
            python3 -m tools.network_harness.m0_plan027_linux_blackhole_recover \
              --bundle "$GITHUB_WORKSPACE/native-bundle" \
              --product-source "$PRODUCT_SOURCE" \
              --scenario scenarios/plan027-n-normal-both-blackhole105-recover120.json \
              --out "$GITHUB_WORKSPACE/plan027-h867-both"
          status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=Path("plan027-h867-both/result.json")
          if result.exists():
              r=json.loads(result.read_text())
              fields=["source_sha","fixture_source_sha","verdict","native_result","failures","limits","native_failures","native_limits","business","recovery","source_tun_drops","owned_stop","native_owned_stop","actual_netem_drop_by_phase","actual_blackhole_tc_drops","original_go_cold_stages"]
              print("H868_BILATERAL_NATIVE_RECEIPT",json.dumps({k:r.get(k) for k in fields if k in r},sort_keys=True),flush=True)
          else: print("H868_BILATERAL_RESULT_FILE_NOT_FOUND",flush=True)
          PY
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan027-h867-retire-bilateral105-10m
          path: |
            plan027-h867-both/result.json
            plan027-h867-both/double-blackhole-recovery/result.json
            plan027-h867-both/double-blackhole-recovery/client-product-markers.log
            plan027-h867-both/double-blackhole-recovery/server-product-markers.log
            plan027-h867-both/double-blackhole-recovery/network-snapshots.json
            plan027-h867-both/double-blackhole-recovery/summary.md
          if-no-files-found: error
          retention-days: 30
