name: M0 PLAN028 H1409 original native ISA-L all seven FEC strength grades
run-name: PLAN028 H1409 native Linux x86/ARM64 and Windows MSVC real ISA-L default all grades
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-h1409-native-isal-all-fec-grades.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  linux-grade-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pin official real ISA-L static archive on native CPU
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          rustup toolchain install 1.85.1 --profile minimal
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool nasm make gcc
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          test "$(git -C isa-l rev-parse HEAD)" = c387163fcbca62701d646149564c550c78a4f985
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/h1409-native-${{ matrix.machine }}"
          export WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985
          (cd isa-l && ./autogen.sh && ./configure --prefix="$WBD_ISAL_PREFIX" --disable-shared --enable-static && make -j2 && make install) >h1409-isa-build.log 2>&1 || { tail -60 h1409-isa-build.log; exit 1; }
          test -s "$WBD_ISAL_PREFIX/lib/libisal.a"
          nm -g "$WBD_ISAL_PREFIX/lib/libisal.a" | grep -Eq ' [TW] ec_encode_data$'
          echo "WBD_ISAL_PREFIX=$WBD_ISAL_PREFIX" >> "$GITHUB_ENV"
          echo "WBD_ISAL_SOURCE_SHA=$WBD_ISAL_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Exercise ACTUAL default ISA-L C encode for every fixed and Auto strength
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h1409-result
          cargo +1.85.1 test --locked -p wbd-codec --features native-isal --lib r1_f2_default_native_all_seven_profiles_real_encode_prepared -- --nocapture --test-threads=1 >h1409-result/real-seven-grade.log 2>&1 || { tail -100 h1409-result/real-seven-grade.log; exit 1; }
          test "$(grep -c M0_PLAN028_H1409_ISAL_NATIVE_PROFILE h1409-result/real-seven-grade.log)" = 7
          test "$(grep -c 'owned=native prepared=native scalar_match=1' h1409-result/real-seven-grade.log)" = 7
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration >h1409-result/release.log 2>&1 || { tail -100 h1409-result/release.log; exit 1; }
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,struct
          assert platform.machine()== "${{ matrix.machine }}"
          elf=pathlib.Path("target/release/libwbd_engine.so")
          raw=elf.read_bytes()
          assert raw[:4]==b"\x7fELF"
          assert struct.unpack_from("<H",raw,18)[0]==(62 if platform.machine()=="x86_64" else 183)
          archive=pathlib.Path(os.environ["WBD_ISAL_PREFIX"])/"lib/libisal.a"
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          log=pathlib.Path("h1409-result/real-seven-grade.log").read_text(errors="replace")
          assert log.count("M0_PLAN028_H1409_ISAL_NATIVE_PROFILE")==7
          report={"source_sha":os.environ["GITHUB_SHA"],"platform":"linux-"+platform.machine(),
            "official_isa_l_sha":"c387163fcbca62701d646149564c550c78a4f985",
            "archive_sha256":sha(archive),"rust_release_engine_sha256":sha(elf),
            "native_fec_acceleration_release_feature":True,
            "seven_default_real_isa_l_codec_profiles":"PASS_NATIVE_0_TO_6",
            "owned_and_prepared_actual_C_encoding":"PASS_ALL_7",
            "product_tls_real_network":"NOT_RUN_THIS_CODEC_REGRESSION",
            "fec_off":"NO_FEC_ENCODING_BY_DESIGN"}
          pathlib.Path("h1409-result/manifest.json").write_text(json.dumps(report,indent=2)+"\n")
          print("M0_PLAN028_H1409_LINUX_NATIVE_FEC_GRADES_PASS",platform.machine())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1409-linux-${{ matrix.machine }}-seven-native-${{ github.run_id }}
          path: h1409-result/
          retention-days: 14
  windows-grade-native:
    runs-on: windows-2022
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Native MSVC installed compiler and pinned ISA-L archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'Rust 1.85.1 install failed'}
          choco install nasm -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'NASM prerequisite failed'}
          $bin=@('C:\Program Files\NASM','C:\ProgramData\chocolatey\bin') | Where-Object {Test-Path (Join-Path $_ 'nasm.exe')} | Select-Object -First 1
          if(-not $bin){throw 'Installed NASM tool missing'}
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          if($LASTEXITCODE -ne 0){throw 'Official ISA-L clone failed'}
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          if((git -C isa-l rev-parse HEAD).Trim() -ne 'c387163fcbca62701d646149564c550c78a4f985'){throw 'Official SHA mismatch'}
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if(-not (Test-Path -LiteralPath $vswhere)){throw 'vswhere missing'}
          $vsroot=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if(-not $vsroot){throw 'MSVC x64 tools missing'}
          $vcvars=Join-Path $vsroot 'VC\Auxiliary\Build\vcvars64.bat'
          if(-not (Test-Path -LiteralPath $vcvars)){throw 'MSVC vcvars64 missing'}
          $cmd='call "'+$vcvars+'" && where nmake && cd isa-l && nmake /f Makefile.nmake'
          & cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'ISA-L MSVC native static build failed'}
          $archive=Get-ChildItem isa-l -Recurse -Filter isa-l_static.lib -File | Select-Object -First 1
          if(-not $archive){throw 'MSVC static archive missing'}
          "WBD_ISAL_PREFIX=$($archive.Directory.FullName)" | Add-Content -Path $env:GITHUB_ENV
          'WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985' | Add-Content -Path $env:GITHUB_ENV
          New-Item -ItemType Directory -Force h1409-result | Out-Null
          $archiveHash=(Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveHash | Set-Content h1409-result/isa-l-static-sha256.txt
      - name: Exercise original Windows owner C ABI and native/ scalar equality at all grades
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cargo +1.85.1 test --locked -p wbd-codec --features native-isal --lib r1_f2_default_native_all_seven_profiles_real_encode_prepared -- --nocapture --test-threads=1 *>&1 | Tee-Object h1409-result/codec.log
          if($LASTEXITCODE -ne 0){throw 'Windows real ISA-L codec seven-grade failure'}
          $gradeCount=@(Select-String -Path h1409-result/codec.log -Pattern 'M0_PLAN028_H1409_ISAL_NATIVE_PROFILE').Count
          if($gradeCount -ne 7){throw "actual Windows native codec grade count $gradeCount"}
          $features='m0_v4_embedded_go,fec2_product_record,native_fec_acceleration'
          & cargo +1.85.1 test --locked -p wbd-engine --features $features --lib m0_windows_original_fixed_auto_fec2_default_linked_native_isal -- --nocapture --test-threads=1 *>&1 | Tee-Object h1409-result/windows-owner.log
          if($LASTEXITCODE -ne 0){throw 'Original Windows owner fixed/auto C ABI seven-grade regression'}
          $ownerCount=@(Select-String -Path h1409-result/windows-owner.log -Pattern 'M0_PLAN028_H1409_WIN_REAL_OWNER_NATIVE_PROFILE').Count
          if($ownerCount -ne 7){throw "Windows authenticated owner did not actually invoke ISA-L for all grades: $ownerCount"}
          & cargo +1.85.1 build --locked --release -p wbd-engine --features $features *>&1 | Tee-Object h1409-result/release.log
          if($LASTEXITCODE -ne 0){throw 'Native FEC Windows release engine build failed'}
          $archive=Get-ChildItem isa-l -Recurse -Filter isa-l_static.lib -File | Select-Object -First 1
          $dll='target/release/wbd_engine.dll'
          if(-not (Test-Path $dll)){throw 'Windows native engine DLL missing'}
          $report=[ordered]@{
            source_sha=$env:GITHUB_SHA;platform='windows-x86_64-msvc';
            official_isa_l_sha='c387163fcbca62701d646149564c550c78a4f985';
            archive_sha256=(Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant();
            rust_release_engine_sha256=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant();
            native_fec_acceleration_release_feature=$true;
            seven_default_real_isa_l_codec_profiles='PASS_NATIVE_0_TO_6';
            authenticated_windows_fixed_auto_original_owner_7_grades='PASS_REAL_NATIVE_C_ABI';
            product_tls_signed_wintun_network='NOT_RUN_THIS_ABI_REGRESSION';
            fec_off='NO_FEC_ENCODING_BY_DESIGN'
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content h1409-result/manifest.json
          Write-Output 'M0_PLAN028_H1409_WINDOWS_NATIVE_FEC_GRADES_PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1409-windows-msvc-seven-native-${{ github.run_id }}
          path: h1409-result/
          retention-days: 14
