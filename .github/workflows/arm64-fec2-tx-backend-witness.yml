# Exactly one new-source ARM64 original-Go/TUN FEC2 TX encoder witness.
# Reuse verified native bundle; observe *actual* prepared codec quantum backend.
name: ARM64 public FEC2 TX native encode witness
run-name: ARM64 original product native encode ${{ github.sha }}
on:
  push:
    branches: [feature/arm64-linux-android-openwrt-autoaccel]
    paths:
      - '.github/workflows/arm64-fec2-tx-backend-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one-original-fixed-encode:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    env:
      WBD_ARM64_FROZEN_SOURCE: 6c8a64ae247de61485ee004df4ed2cdfa31256b5
      WBD_V4_MODE: fec-fixed
      WBD_ARM64_DAMAGE_TRIAL: policy-2pct
      WBD_ARM64_FEC_BURST: ping-burst
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 39762732689
          github-token: ${{ github.token }}
          name: arm64-public-go-rust-39762732689-1
          path: arm64-public-bundle/
      - name: Real FEC2 authentic source density kernel loss Native TX/RX and Stop
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables
          bash tools/arm64_linux_netns_smoke.sh
      - name: Read actually selected original-M1 TX ISA-L encode quanta, fail if absent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,re,pathlib,hashlib
          p=pathlib.Path('arm64-netns-result')
          stats={}
          for role in ('client','server'):
            log=(p/f'{role}.log').read_text()
            keys=('native_encode_quanta','scalar_encode_quanta')
            lines=[line for line in log.splitlines() if 'V4_PUBLIC_FEC2_TX_BACKEND role='+role+' ' in line]
            assert len(lines)==1,(role,'missing exact original TX backend log',len(lines))
            d={}
            for key in keys:
              m=re.search(r'\b'+key+r'=(\d+)\b',lines[0])
              assert m,(role,key,lines[0])
              d[key]=int(m.group(1))
            assert 'sampling=pre_stop' in lines[0]
            stats[role]=d
          native=sum(x['native_encode_quanta'] for x in stats.values())
          scalar=sum(x['scalar_encode_quanta'] for x in stats.values())
          verdict={'frozen_product_source':os.environ['WBD_ARM64_FROZEN_SOURCE'],
            'harness_source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],
            'scenario':'one fixed source-dense real original Go/ARM64 Rust M1/M3 encoding with scoped 2pct outer netem',
            'tx_encoding_backend_actual_quanta':stats,
            'total_native_encode_quanta':native,'total_scalar_encode_quanta':scalar,
            'receipt_type':'ORIGINAL_SOURCE_OWNER_PRE_STOP',
            'not_proven':['hardware NEON auto-dispatch per quantum','physical ARM64 throughput','per-specific encrypted source netem identity'],
            'logs_sha256':{x:hashlib.sha256((p/f'{x}.log').read_bytes()).hexdigest() for x in stats}}
          (p/'original-tx-backend.json').write_text(json.dumps(verdict,indent=2)+'\n')
          print('ORIGINAL_ARM64_TX_NATIVE_ENCODE_COUNTERS',native,scalar,stats)
          assert native>0,'NO_ACTUAL_ARM64_NATIVE_ENCODE_IN_DENSE_FEC2_OWNER'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-tx-encoder-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-netns-result/
          if-no-files-found: warn
          retention-days: 30
