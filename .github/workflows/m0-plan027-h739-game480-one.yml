name: M0 PLAN027 H739 one original Game2FEC 480s native
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h739-game480-one.yml]
permissions: {contents: read, actions: write}
jobs:
  one-real-game2-fec:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h739-game480]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 0264c2cfc91e05c7c4b8d518fa0efc6707a2ff6b
      BUILD: "41280564979"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One authentic signed original Game2FEC 1Mbps 0loss with 480s native test cap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD" --jq .head_sha)" = "$SOURCE"
          test "$(gh api "repos/$GH_REPO/actions/runs/41285516023" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$BUILD/jobs?per_page=100" |
            jq -e '[.jobs[]|select(.name=="Windows Go production and test compilation only" or .name=="Build true original Go and new Linux Rust peer persona from same SOURCE")|.conclusion]|length==2 and all(.=="success")' >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_netem.py scenarios)"
          python3 - <<'PY'
          from pathlib import Path
          from tools.m0_wl_perf_v2_config import read_scenario
          from tools.m0_wl_native_step_runner import native_batch_deadline
          scene="scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json"
          v=read_scenario(scene)
          assert v["public_mode"]=="game2-fec" and v["duration_s"]==10 and v["tun_mtu"]==1400
          assert (v["seed"],v["warmup_s"],v["drain_s"])==(20261029,3,5)
          for d in ("windows_to_linux","linux_to_windows"):
            q=v[d];assert (q["offered_mbps"],q["delay_ms"],q["loss_pct"])==(1,25,0)
          assert native_batch_deadline({"WBD_WL_PUBLIC_MODES":"game2-fec","WBD_WL_V2_SCENARIO":scene})==250
          w=Path(".github/workflows/m0-wl-public-normal-full.yml").read_text()
          assert "(inputs.public_mode == 'game2-fec' || inputs.public_mode == 'game4-fec') && '480'" in w
          watcher=Path(".github/workflows/m0-plan027-independent-native-deadline.yml").read_text()
          assert "M0_EXTERNAL_NATIVE_CANCEL_FIRST" in watcher and "after_immediate_timeout_cancel" in watcher
          assert 'name="game-native-log-sample",daemon=True' in Path("tools/m0_wl_native_step_runner.py").read_text()
          print("H739_ONE_SOURCE0264_480S_GAME2FEC_REAL_NOT_PASS",v["scenario_sha256"])
          PY
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -1)"
          if [ -n "$old" ];then echo "H739_ALREADY_DISPATCHED=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$SOURCE"
          echo H739_GAME2FEC_TRUE_NATIVE_DISPATCHED_NOT_PASS
