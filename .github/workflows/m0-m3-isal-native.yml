name: M0 M3 real pinned ISA-L codec oracle
run-name: "M0|M3-016|ISA-L-${{ inputs.measure_order || 'BA' }}|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-m3-isal-native.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/wbd-codec/Cargo.toml"
      - "native/isal-safe/**"
  workflow_dispatch:
    inputs:
      worker_source:
        description: "Exact 40-character M3 code SOURCE SHA; role scope is separately audited"
        required: false
        type: string
      measure_order:
        description: "One Release codec 20:20/1200B paired scenario per Action"
        required: false
        default: BA
        type: choice
        options: [AB, BA]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wbd-next
          ref: ${{ inputs.worker_source || '422a26127496560c0a52e6745ecc8f354e3f4f18' }}
          path: worker-m3
          persist-credentials: false
      - name: Compile actual pinned native ISA-L and frozen M3 Go-matrix codec
        shell: bash
        run: |
          set -euo pipefail
          export WORKER_SOURCE="${{ inputs.worker_source || '422a26127496560c0a52e6745ecc8f354e3f4f18' }}"
          [[ "$WORKER_SOURCE" =~ ^[a-f0-9]{40}$ ]] || { echo INVALID_SOURCE >&2; exit 2; }
          test "$(git -C worker-m3 rev-parse HEAD)" = "$WORKER_SOURCE"
          # Frozen worker nested under main is otherwise misdetected by Cargo
          # as the parent workspace; isolate its own unchanged five-crate root.
          mv worker-m3 "$RUNNER_TEMP/frozen-m3"
          export WORKER_DIR="$RUNNER_TEMP/frozen-m3"
          rustup toolchain install 1.85.1 --profile minimal
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm autoconf automake libtool
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          test "$(git -C isa-l rev-parse HEAD)" = c387163fcbca62701d646149564c550c78a4f985
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-v2.31.1"
          (cd isa-l && ./autogen.sh && ./configure --prefix="$WBD_ISAL_PREFIX" --disable-shared --enable-static && make -j2 && make install)
          test -s "$WBD_ISAL_PREFIX/lib/libisal.a"
          nm -g "$WBD_ISAL_PREFIX/lib/libisal.a" | grep -Eq ' [TW] ec_encode_data$'
          cp Cargo.toml Cargo.lock "$WORKER_DIR/"
          cp crates/wbd-engine/Cargo.toml "$WORKER_DIR/crates/wbd-engine/Cargo.toml"
          cp crates/wbd-codec/Cargo.toml "$WORKER_DIR/crates/wbd-codec/Cargo.toml"
          mkdir -p "$WORKER_DIR/native"
          cp -a native/isal-safe "$WORKER_DIR/native/isal-safe"
          cargo +1.85.1 test --manifest-path "$WORKER_DIR/native/isal-safe/Cargo.toml" --features native -- --nocapture | tee isal-native.log
          grep -Fq REAL_ISAL_V2311_EC_ENCODE_DATA_PASS isal-native.log
          (cd "$WORKER_DIR" && cargo +1.85.1 test --release --locked -p wbd-codec --lib --features native-isal r1_fec_selected_backend_ --no-run)
          mkdir -p m3-native-build
          binary="$(find "$WORKER_DIR/target/release/deps" -maxdepth 1 -type f -name 'wbd_codec-*' -perm -u+x | head -n 1)"
          test -n "$binary"
          cp "$binary" m3-native-build/isal-codec.test
          cp isal-native.log m3-native-build/native-call.log
          python3 - <<'PY'
          import os,json,hashlib,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m={"main_source":os.environ["GITHUB_SHA"],"worker_source":os.environ["WORKER_SOURCE"],"upstream_isal":"c387163fcbca62701d646149564c550c78a4f985",
            "run_id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "binary_sha256":sha("m3-native-build/isal-codec.test"),"native_call_sha256":sha("m3-native-build/native-call.log"),
            "cargo_lock_sha256":sha("Cargo.lock"),"native_target":"x86_64-unknown-linux-gnu","rust":"1.85.1",
            "features":"native-isal opt-in, default production off","qualification":"M3 codec Go GF matrices only, not product"}
          pathlib.Path("m3-native-build/manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-isal-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: m3-native-build/
          if-no-files-found: error
          retention-days: 30
  consume:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m3-isal-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: m3-native-build
      - name: Verify frozen M3 binary, real C backend and native Go-matrix parity/recovery tests
        shell: bash
        run: |
          set -euo pipefail
          export WORKER_SOURCE="${{ inputs.worker_source || '422a26127496560c0a52e6745ecc8f354e3f4f18' }}"
          [[ "$WORKER_SOURCE" =~ ^[a-f0-9]{40}$ ]] || exit 2
          python3 - <<'PY'
          import os,json,hashlib,pathlib
          m=json.load(open("m3-native-build/manifest.json"))
          assert m["main_source"]==os.environ["GITHUB_SHA"] and m["worker_source"]==os.environ["WORKER_SOURCE"]
          assert m["run_id"]==os.environ["GITHUB_RUN_ID"] and m["attempt"]==os.environ["GITHUB_RUN_ATTEMPT"]
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert sha("Cargo.lock")==m["cargo_lock_sha256"]
          assert sha("m3-native-build/isal-codec.test")==m["binary_sha256"]
          assert sha("m3-native-build/native-call.log")==m["native_call_sha256"]
          assert "REAL_ISAL_V2311_EC_ENCODE_DATA_PASS" in pathlib.Path("m3-native-build/native-call.log").read_text()
          PY
          chmod +x m3-native-build/isal-codec.test
          mkdir -p m3-native-result
          m3-native-build/isal-codec.test r1_fec_selected_backend_ --test-threads=1 --nocapture | tee m3-native-result/tests.log
          grep -Eq 'test result: ok\..*0 failed' m3-native-result/tests.log
          for name in \
            r1_fec_selected_backend_go_matrix_all_profiles_short_unaligned_mtu \
            r1_fec_selected_backend_missing_only_direct_inverse_recovery \
            r1_fec_selected_backend_actual_owner_20_20_and_no_fake_native; do
            # Rust --nocapture may interleave a native-backend witness between
            # the test identifier and the terminal 'ok' on the same line.
            # Require each real named test and the zero-failure global footer.
            grep -Fq "$name" m3-native-result/tests.log
          done
          cp m3-native-build/manifest.json m3-native-result/manifest.json
          echo "M0_M3_REAL_ISAL_SAFE_CODEC_GO_MATRIX_NATIVE_PASS code=$WORKER_SOURCE"
      - name: Release pinned scalar vs ISA-L same-VM 20:20/1200B one ordered scenario
        shell: bash
        env:
          WBD_FEC_ORDER: ${{ inputs.measure_order || 'BA' }}
        run: |
          set -euo pipefail
          # Same already-compiled and SHA-verified CODE422a binary as above.
          # CPU window failures are recorded as INCONCLUSIVE, never a gain.
          lscpu | sed -n '1,25p' > m3-native-result/host-isa.log
          if test -r /sys/fs/cgroup/cpu.max; then
            cat /sys/fs/cgroup/cpu.max > m3-native-result/host-cpu-quota.log
          else
            echo unknown > m3-native-result/host-cpu-quota.log
          fi
          m3-native-build/isal-codec.test r1_fec_native_release_same_vm_scalar_isal_paired_cpu \
            --ignored --test-threads=1 --nocapture | tee m3-native-result/paired-${WBD_FEC_ORDER}.log
          python3 - <<'PY'
          import hashlib,json,pathlib,re,os
          order=os.environ["WBD_FEC_ORDER"]
          assert order in ("AB","BA")
          p=pathlib.Path("m3-native-result/paired-"+order+".log")
          lines=p.read_text().splitlines()
          raw=[s for s in lines if "M3_FEC_CPU_RAW order="+order+" " in s]
          rows=[s for s in lines if "M3_FEC_CPU_RESULT order="+order+" " in s]
          assert len(rows)==2 and len(raw)>=10, (len(rows),len(raw))
          assert "test result: ok." in p.read_text()
          results=[]
          for index,mode in enumerate(("scalar","native-isal") if order=="AB" else ("native-isal","scalar")):
              s=rows[index]
              def field(k):
                  m=re.search(r"(?:^|\s)"+re.escape(k)+r"=([^ ]+)",s)
                  assert m,(k,s)
                  return m.group(1)
              assert field("leg")==str(index) and field("mode")==mode
              blocks=int(field("blocks"))
              assert blocks>0 and int(field("systematic"))==20*blocks
              assert int(field("parity"))==20*blocks and int(field("recovered"))==4*blocks
              assert int(field("wall_ns"))>=1_125_000_000
              status=field("cpu_qualified")
              assert status in ("SAME_WINDOW_CPU","CPU_INCONCLUSIVE")
              assert int(field("windows_ok"))+int(field("windows_bad"))>=5
              assert field("NIC_DELIVERY")=="NOT_RUN" and field("PACKET_P99")=="NOT_RUN"
              results.append({"leg":index,"mode":mode,"blocks":blocks,
                  "cpu_status":status,"cpu_ns":int(field("cpu_ns")),
                  "wall_ns":int(field("wall_ns")),"p99_codec_operation_wall_ns":int(field("p99_CODEC_OPERATION_WALL_ns")),
                  "windows_ok":int(field("windows_ok")),"windows_bad":int(field("windows_bad"))})
          m=json.load(open("m3-native-build/manifest.json"))
          q={"scenario":"M3_CODE422a_20_20_1200B_"+order+"_one_same_VM_consume_job",
             "main_source":m["main_source"],"worker_source":m["worker_source"],
             "build_run_id":m["run_id"],"attempt":m["attempt"],
             "binary_sha256":m["binary_sha256"],"order":order,
             "result":"CPU_PAIRED_VALID" if all(x["cpu_status"]=="SAME_WINDOW_CPU" for x in results) else "CPU_INCONCLUSIVE",
             "legs":results,"raw_log_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
             "host_isa_sha256":hashlib.sha256(pathlib.Path("m3-native-result/host-isa.log").read_bytes()).hexdigest(),
             "boundary":"codec-only; no packet delivery/RTT, no SIMD exact instruction proof, no product"}
          pathlib.Path("m3-native-result/paired-"+order+".json").write_text(json.dumps(q,indent=2)+"\n")
          print("M3_FEC_RELEASE_ORDERED_EXECUTED",order,q["result"],q["worker_source"],q["binary_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3-isal-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: m3-native-result/
          if-no-files-found: warn
          retention-days: 30
