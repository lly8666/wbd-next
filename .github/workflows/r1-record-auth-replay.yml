name: M0 R1 real Rust three-suite codec and PN replay regression
run-name: "M0|${{ github.sha }}|r1-record-auth-replay"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r1-record-auth-replay.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/wbd-codec/**"
      - "crates/wbd-types/**"
permissions:
  contents: read
concurrency:
  group: r1-record-auth-replay-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile one actual Rust 1.85.1 native codec suite test binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          cargo test --release --locked -p wbd-codec --no-run
          test_bin="$(find target/release/deps -maxdepth 1 -type f -name 'wbd_codec-*' -perm -u+x | head -n 1)"
          test -n "$test_bin"
          mkdir r1-auth-codec-build
          cp "$test_bin" r1-auth-codec-build/codec.test
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          paths=['crates/wbd-codec/src/record_crypto.rs','crates/wbd-codec/src/record_crypto_tests.rs',
                 'crates/wbd-codec/src/record_replay.rs','crates/wbd-codec/src/record_replay_tests.rs',
                 'crates/wbd-codec/src/record_frame.rs','crates/wbd-codec/src/link_reassembly.rs',
                 'crates/wbd-codec/src/fec_math.rs','crates/wbd-codec/src/fec_tx.rs',
                 'crates/wbd-codec/src/fec_rx.rs','crates/wbd-codec/src/fec_block_id.rs',
                 'crates/wbd-codec/src/fec_block_id_tests.rs',
                 'crates/wbd-codec/src/fec_retire_pressure_tests.rs',
                 'crates/wbd-codec/src/fec_auth_gate.rs',
                 'crates/wbd-codec/src/fec_auth_gate_tests.rs',
                 'crates/wbd-codec/src/fec_multiscope_tests.rs',
                 'crates/wbd-codec/src/link_fec_wire.rs',
                 'crates/wbd-codec/oracles/aes_wire_go_v3.txt']
          data={'schema_version':1,'source_sha':os.environ['GITHUB_SHA'],
                'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                'target':'x86_64-unknown-linux-gnu','rust':'1.85.1',
                'test_binary_sha256':sha('r1-auth-codec-build/codec.test'),
                'cargo_lock_sha256':sha('Cargo.lock'),
                'source_parts_sha256':{p:sha(p) for p in paths},
                'scope':'R1_ACTUAL_CHACHA_AES128_AES256_GO_RECORD_VECTORS_AND_AEAD_FIRST_REPLAY_UNIT'}
          pathlib.Path('r1-auth-codec-build/manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-auth-codec-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-auth-codec-build/
          if-no-files-found: error
          retention-days: 30
  consume:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r1-auth-codec-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-auth-codec-build
      - name: Verify source and precompiled binary then execute 97 true R1 tests and ignore only the dedicated M3 Release cost
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          m=json.load(open('r1-auth-codec-build/manifest.json'))
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert m['source_sha']==os.environ['GITHUB_SHA']
          assert m['run_id']==os.environ['GITHUB_RUN_ID'] and m['attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          assert m['target']=='x86_64-unknown-linux-gnu' and m['rust']=='1.85.1'
          assert sha('Cargo.lock')==m['cargo_lock_sha256']
          assert sha('r1-auth-codec-build/codec.test')==m['test_binary_sha256']
          for p,d in m['source_parts_sha256'].items():assert sha(p)==d,p
          PY
          chmod +x r1-auth-codec-build/codec.test
          mkdir -p r1-auth-codec-result
          set +e
          r1-auth-codec-build/codec.test r1_ --nocapture >r1-auth-codec-result/tests.log 2>&1
          ret=$?
          set -e
          cat r1-auth-codec-result/tests.log
          TEST_EXIT="$ret" python3 - <<'PY'
          import os,hashlib,pathlib,json,sys,re
          m=json.load(open('r1-auth-codec-build/manifest.json'))
          s=pathlib.Path('r1-auth-codec-result/tests.log').read_text()
          match=re.search(r'test result: ok\. (\d+) passed; 0 failed',s)
          passed=int(match.group(1)) if match else 0
          ignored_match=re.search(r'test result: ok\. \d+ passed; 0 failed; (\d+) ignored;',s)
          ignored=int(ignored_match.group(1)) if ignored_match else -1
          required='r1_steady_four_scope_auth_replay_pressure_and_independent_expiry'
          dedicated='r1_steady_release_same_source_fresh_vs_reused_owner_cost'
          ok=(int(os.environ['TEST_EXIT'])==0 and passed==97 and ignored==1
              and required+' ... ok' in s and dedicated+' ... ignored' in s)
          report={'source_sha':m['source_sha'],'run_id':m['run_id'],'attempt':m['attempt'],
                  'binary_sha256':m['test_binary_sha256'],'cargo_lock_sha256':m['cargo_lock_sha256'],
                  'log_sha256':hashlib.sha256(s.encode()).hexdigest(),
                  'r1_actual_native_passed':passed,'test_exit':int(os.environ['TEST_EXIT']),
                  'result':'PASS' if ok else 'FAIL',
                  'scope':'R1_AEAD_REPLAY_LINK_RS20_FEC_TX_RX_BLOCKID_RETIRE_AUTH_MULTISCOPE_TEST_ORIGIN_ONLY',
                  'not_qualified':'LIVE_GO_V4_ADMISSION;PRODUCT;PERFORMANCE;PHYSICAL'}
          pathlib.Path('r1-auth-codec-result/result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if not ok:sys.exit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: r1-auth-codec-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-auth-codec-result/
          if-no-files-found: warn
          retention-days: 30
