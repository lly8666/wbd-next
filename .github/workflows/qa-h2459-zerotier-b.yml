name: H2459 native ZeroTier three runner B (identity phase fix)
run-name: "H2459 400ms zero-loss native ZeroTier B | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-linux-tcp-splice']
    paths: ['.github/workflows/qa-h2459-zerotier-b.yml']
permissions: {contents: read, actions: read}
env:
  GH_TOKEN: ${{ github.token }}
  WBD_H2417_SPLICE: '1'
  WBD_H2418_DIAG: '1'
  WBD_H2442_ARM_SERVER: '1'
  WBD_H2450_RX_DIAG: '0'
  WBD_H2452_RATE: '400'
  WBD_H2453_PACING: '1'
  WBD_H2455_SEGMENTS: 'windows'
  WBD_H2458_TARGETED: '1'
jobs:
  relay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Install native ZeroTier on isolated ARM runner
        timeout-minutes: 5
        run: |
          curl -fsSL --max-time 40 https://install.zerotier.com -o "$RUNNER_TEMP/zt-install.sh"
          sudo bash "$RUNNER_TEMP/zt-install.sh"
          sudo systemctl start zerotier-one
          sudo apt-get install -y -qq tcpdump
      - name: Publish native relay identity
        run: |
          mkdir -p h2228-meta h2228-peer h2228-out
          python3 -m py_compile tools/m0_h2459_zt.py tools/m0_h2459_server.py tools/m0_h2459_windows_client.py
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA,PATH python3 tools/m0_h2459_zt.py identity relay
          sudo chown -R "$(id -u):$(id -g)" h2228-meta h2228-out h2228-peer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: h2459-relay-identity, path: h2228-meta/relay.json, retention-days: 14, if-no-files-found: error}
      - name: Wait both native endpoint identities, create TWO ZeroTier L2 segments
        run: |
          set -euo pipefail
          for role in client server; do
            for i in $(seq 1 180); do
              gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "h2459-$role-identity" -D h2228-meta >/dev/null 2>&1 && break
              sleep 5
            done
            test -s "h2228-meta/$role.json"
          done
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA,PATH python3 tools/m0_h2459_zt.py relay-start
          sudo chown -R "$(id -u):$(id -g)" h2228-peer h2228-out
      - name: Start exact H2228 zero-loss netem control
        run: |
          set -euo pipefail
          nohup python3 -u tools/m0_h2459_zt.py relay-control >h2228-out/controller.log 2>&1 </dev/null &
          for i in $(seq 1 100); do
            test ! -s h2228-out/relay-ready.json || break
            sleep .2
          done
          test -s h2228-out/relay-ready.json
      - name: Record continuous native ZeroTier peer paths
        run: |
          nohup sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA,PATH python3 -u tools/m0_h2459_zt.py monitor relay h2228-out/zt-paths.jsonl h2228-out/monitor-stop >h2228-out/monitor.log 2>&1 </dev/null &
          echo $! >h2228-out/monitor.pid
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: h2459-topology, path: h2228-peer/, retention-days: 14, if-no-files-found: error}
      - name: Hold until exact-run Windows result artifact
        timeout-minutes: 45
        run: |
          set -euo pipefail
          for i in $(seq 1 480); do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n h2228-client-result -D h2228-client-result >/dev/null 2>&1 && break
            sleep 5
          done
          test -s h2228-client-result/summary.json
      - name: Finish path sampling
        if: always()
        run: |
          mkdir -p h2228-out
          sudo touch h2228-out/monitor-stop
          sleep 2
          sudo chown -R "$(id -u):$(id -g)" h2228-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: h2459-relay-evidence, path: h2228-out/, retention-days: 14, if-no-files-found: error}
  server:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Install native ZeroTier on isolated ARM runner
        timeout-minutes: 5
        run: |
          curl -fsSL --max-time 40 https://install.zerotier.com -o "$RUNNER_TEMP/zt-install.sh"
          sudo bash "$RUNNER_TEMP/zt-install.sh"
          sudo systemctl start zerotier-one
          sudo apt-get install -y -qq tcpdump
      - name: Publish native server identity
        run: |
          mkdir -p h2228-meta h2228-peer h2228-out
          python3 -m py_compile tools/m0_h2459_zt.py tools/m0_h2459_server.py tools/m0_h2459_windows_client.py
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA,PATH python3 tools/m0_h2459_zt.py identity server
          sudo chown -R "$(id -u):$(id -g)" h2228-meta h2228-out h2228-peer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: h2459-server-identity, path: h2228-meta/server.json, retention-days: 14, if-no-files-found: error}
      - name: Reuse exact frozen ARM product
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iptables openssl iputils-ping
          bash tools/m0_h2439_fetch_frozen.sh
          cp h2439-out/build-identity.json h2228-out/
      - name: Wait exact-run topology
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n h2459-topology -D h2228-peer >/dev/null 2>&1 && break
            sleep 5
          done
          test -s h2228-peer/relay.json
      - name: Join server Ethernet and verify real return route
        run: |
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA,PATH python3 tools/m0_h2459_zt.py join server
          sudo chown -R "$(id -u):$(id -g)" h2228-meta h2228-out
      - name: Record continuous native ZeroTier peer paths
        run: |
          nohup sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA,PATH python3 -u tools/m0_h2459_zt.py monitor server h2228-out/zt-paths.jsonl h2228-out/monitor-stop >h2228-out/monitor.log 2>&1 </dev/null &
          echo $! >h2228-out/monitor.pid
      - name: Start frozen native ARM product preset controller
        run: |
          set -euo pipefail
          nohup python3 -u tools/m0_h2459_server.py >h2228-out/controller.log 2>&1 </dev/null &
          echo $! >h2228-out/controller.pid
          for i in $(seq 1 100); do
            test ! -s h2228-out/server-ready.json || break
            sleep .2
          done
          test -s h2228-out/server-ready.json || { cat h2228-out/controller.log; exit 2; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2228-server-ready
          path: |
            h2228-out/server-ready.json
            h2228-out/cert.pem
          retention-days: 3
      - name: Hold until exact-run Windows result artifact
        timeout-minutes: 45
        run: |
          set -euo pipefail
          for i in $(seq 1 480); do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n h2228-client-result -D h2228-client-result >/dev/null 2>&1 && break
            sleep 5
          done
          test -s h2228-client-result/summary.json
      - name: Finish path sampling
        if: always()
        run: |
          mkdir -p h2228-out
          sudo touch h2228-out/monitor-stop
          sleep 2
          sudo chown -R "$(id -u):$(id -g)" h2228-out
      - name: Cleanup only owned origin namespace
        if: always()
        run: |
          test ! -s h2228-out/controller.pid || kill "$(cat h2228-out/controller.pid)" || true
          sudo ip netns del h2442origin || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: h2459-server-evidence, path: h2228-out/, retention-days: 14, if-no-files-found: error}
  client:
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Install native ZeroTier on Windows (no WSL)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $msi=Join-Path $env:RUNNER_TEMP 'zt.msi'
          Invoke-WebRequest -Uri 'https://download.zerotier.com/dist/ZeroTier%20One.msi' -OutFile $msi -TimeoutSec 75
          $s=Get-AuthenticodeSignature $msi
          if($s.Status -ne 'Valid'){throw 'ZeroTier official MSI signature not valid'}
          $p=Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){throw "MSI exit $($p.ExitCode)"}
      - name: Publish native Windows identity
        shell: pwsh
        run: |
          python -m py_compile tools/m0_h2459_zt.py tools/m0_h2459_windows_client.py
          if($LASTEXITCODE -ne 0){throw 'fixture syntax'}
          python tools/m0_h2459_zt.py identity client
          if($LASTEXITCODE -ne 0){throw 'identity'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: h2459-client-identity, path: h2228-meta/client.json, retention-days: 14, if-no-files-found: error}
      - name: Retrieve exact-source Windows full product (H2441 built and archived before cold failure)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git diff --exit-code db8f56e0d8094c6393dbbc2c8ab92d8db7a2c141 HEAD -- crates r0 Cargo.toml Cargo.lock tools/prepare_windows_wiring.py
          if($LASTEXITCODE -ne 0){throw 'product changed'}
          New-Item -ItemType Directory -Force result/wl-public,result,h2442-out | Out-Null
          gh run download 45603546655 -R $env:GITHUB_REPOSITORY -n m0-wl-windows-product-binaries-db8f56e0d8094c6393dbbc2c8ab92d8db7a2c141 -D result/wl-public
          if($LASTEXITCODE -ne 0){throw 'Windows binary archive unavailable'}
          $m=Get-Content result/wl-public/windows-binary-manifest.json -Raw | ConvertFrom-Json
          if($m.source_sha -ne 'db8f56e0d8094c6393dbbc2c8ab92d8db7a2c141' -or !$m.native_fec_acceleration){throw 'source/FEC mismatch'}
          if((Get-FileHash result/wl-public/wbd-client-embedded.exe).Hash.ToLowerInvariant() -ne $m.sha256.exe -or (Get-FileHash result/wl-public/wbd_engine.dll).Hash.ToLowerInvariant() -ne $m.sha256.dll){throw 'Windows binary hash mismatch'}
          Copy-Item result/wl-public/windows-binary-manifest.json h2442-out/
      - name: Full public-run signed original Npcap and Wintun driver install
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'wl-public-real'
          $drv=Join-Path $root 'npcap'
          $usr=Join-Path $root 'user'
          New-Item -ItemType Directory -Force $root,$drv,$usr,result/wl-public | Out-Null
          $zip=Join-Path $root 'npcap-test.zip'
          # External vendor/CDN 504s must not be interpreted as native
          # Npcap/Wintun product failures. Retry only byte downloads; exact
          # pinned SHA256 plus original Authenticode checks remain unchanged.
          function Get-PinnedPublicNativeDriverPackage([string]$Uri,[string]$Destination){
            for($attempt=1;$attempt -le 5;$attempt++){
              try {
                Invoke-WebRequest -UseBasicParsing -Uri $Uri -OutFile $Destination -TimeoutSec 65 -ErrorAction Stop
                if(-not (Test-Path -LiteralPath $Destination)){throw 'signed package download absent'}
                return
              }catch{
                Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
                Write-Output ('PLAN028_EXTERNAL_SIGNED_DRIVER_DOWNLOAD_RETRY attempt='+$attempt+' status='+$_.Exception.GetType().Name)
                if($attempt -eq 5){throw}
                Start-Sleep -Seconds ([Math]::Min(24,4*$attempt))
              }
            }
          }
          Get-PinnedPublicNativeDriverPackage 'https://github.com/user-attachments/files/32200327/npcap.zip' $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6380ebe6d5b06bbb0dc03a43151ee05a4a25be97efebd742c463e0e466621a32'){throw 'approved old driver package hash changed'}
          Expand-Archive $zip $drv -Force
          $installer=Join-Path $root 'npcap-1.88.exe'
          Get-PinnedPublicNativeDriverPackage 'https://npcap.com/dist/npcap-1.88.exe' $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2f4ec1e5ea353ff67efd24b2ebf081ba44532410fae8d5e146af0310aa4f56b'){throw 'official Npcap hash changed'}
          $sg=Get-AuthenticodeSignature $installer
          if($sg.Status -ne 'Valid' -or $sg.SignerCertificate.Subject -notmatch 'Nmap Software LLC'){throw 'official Npcap invalid signature'}
          & 7z x -y "-o$usr" $installer | Out-File result/wl-public/npcap-extract.log
          if($LASTEXITCODE -ne 0){throw 'Npcap DLL extraction failed'}
          & ./tools/m0_wl_npcap_driver_ci.ps1 -Action Install -DriverPackageDir $drv -UserlandExtractDir $usr 2>&1 |
            Tee-Object result/wl-public/npcap-install.log
          if((Get-Service npcap -ErrorAction Stop).Status -ne 'Running'){throw 'Npcap real kernel service not running'}
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/wpcap.dll" -Destination result/wl-public/wpcap.dll
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/Packet.dll" -Destination result/wl-public/Packet.dll
          $wzip=Join-Path $root 'wintun.zip'
          $wdir=Join-Path $root 'wintun'
          Get-PinnedPublicNativeDriverPackage 'https://www.wintun.net/builds/wintun-0.14.1.zip' $wzip
          if((Get-FileHash $wzip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'){throw 'official Wintun archive hash changed'}
          Expand-Archive $wzip $wdir -Force
          $dll=Join-Path $wdir 'wintun/bin/amd64/wintun.dll'
          if((Get-AuthenticodeSignature $dll).Status -ne 'Valid'){throw 'official Wintun DLL unsigned'}
          Copy-Item $dll result/wl-public/wintun.dll
      - name: Join native Windows Ethernet and wait for ARM server control
        shell: pwsh
        run: |
          foreach($pair in @(@('h2459-topology','h2228-peer','relay.json'),@('h2228-server-ready','h2228-server-ready','server-ready.json'))){
            New-Item -ItemType Directory -Force $pair[1] | Out-Null
            for($i=0;$i -lt 180;$i++){
              gh run download $env:GITHUB_RUN_ID -R $env:GITHUB_REPOSITORY -n $pair[0] -D $pair[1] 2>$null
              if($LASTEXITCODE -eq 0){break};Start-Sleep -Seconds 5
            }
            if(!(Test-Path (Join-Path $pair[1] $pair[2]))){throw "missing $($pair[0])"}
          }
          python tools/m0_h2459_zt.py join client
          if($LASTEXITCODE -ne 0){throw 'native client join failed'}
          Copy-Item h2228-out/zt-local.json h2442-out/zt-local.json
          $p=Start-Process python -ArgumentList @('-u','tools/m0_h2459_zt.py','monitor','client','h2442-out/zt-paths.jsonl','h2442-out/monitor-stop') -PassThru -RedirectStandardOutput h2442-out/monitor.log -RedirectStandardError h2442-out/monitor-error.log
          $p.Id | Set-Content h2442-out/monitor.pid
      - name: Same H2458 direct baseline, 250 600 250 one-connection ladder
        shell: pwsh
        run: |
          foreach($phase in @('baseline','smoke','matrix')){
            python -u tools/m0_h2459_windows_client.py $phase
            if($LASTEXITCODE -ne 0){throw "phase $phase incomplete"}
          }
      - name: Preserve actual receipt including failed prerequisites
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force h2442-out | Out-Null
          if(!(Test-Path h2442-out/summary.json)){
            $rows=@(Get-ChildItem h2442-out -Directory -Filter 'case-*' | ForEach-Object {
              $r=Join-Path $_.FullName 'result.json'
              if(Test-Path $r){Get-Content $r -Raw | ConvertFrom-Json}
            } | Sort-Object case)
            @{source_sha=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;status='INCOMPLETE_OR_PRECONDITION_FAILED';rows=$rows} | ConvertTo-Json -Depth 30 | Set-Content -Encoding ascii h2442-out/summary.json
          }
          New-Item -ItemType File -Force h2442-out/monitor-stop | Out-Null
          Start-Sleep -Seconds 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: h2228-client-result, path: h2442-out/summary.json, retention-days: 14, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: h2459-client-evidence, path: h2442-out/, retention-days: 14, if-no-files-found: error}
  qualify:
    if: always()
    needs: [relay,server,client]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Download three independent path logs and qualify every leg
        run: |
          set -euo pipefail
          for role in client relay server; do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "h2459-$role-evidence" -D "qualification/$role"
          done
          python3 tools/m0_h2459_zt.py qualify qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: h2459-qualification, path: h2459-qualification.json, retention-days: 14, if-no-files-found: error}
