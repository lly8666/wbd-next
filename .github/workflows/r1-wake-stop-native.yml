name: M0 R1 real M1 wake/stop owner native
run-name: "M0|${{ github.sha }}|r1-wake-stop-native"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r1-wake-stop-native.yml"
      - ".github/workflows/r0-native-abi.yml"
      - "tools/r0_abi_bundle.py"
      - "tests/test_r0_abi_exact_filter.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/wbd-engine/**"
      - "crates/wbd-types/**"
permissions:
  contents: read
concurrency:
  group: r1-wake-stop-native-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Compile once actual Linux Rust native M1 wake/stop and arena tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          cargo test --release --locked -p wbd-engine --lib --no-run
          binary="$(find target/release/deps -maxdepth 1 -type f -name 'wbd_engine-*' -perm -u+x | head -n 1)"
          test -n "$binary"
          mkdir r1-wake-build
          cp "$binary" r1-wake-build/owner.test
          python3 - <<'PY'
          import os,hashlib,pathlib,json
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          parts=['crates/wbd-engine/src/runtime/wake.rs',
                 'crates/wbd-engine/src/runtime/mod.rs',
                 'crates/wbd-engine/src/runtime/parity.rs',
                 'crates/wbd-engine/src/runtime/batch.rs',
                 'crates/wbd-engine/src/runtime/rx_batch.rs',
                 'crates/wbd-engine/src/runtime/generation.rs',
                 'crates/wbd-engine/src/memory/mod.rs',
                 'crates/wbd-engine/src/lib.rs','Cargo.lock']
          m={'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
             'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'toolchain':'1.85.1',
             'target':'x86_64-unknown-linux-gnu',
             'binary_sha256':sha('r1-wake-build/owner.test'),
             'inputs':{p:sha(p) for p in parts},
             'scope':'M1_BOUNDED_PARITY_ABSOLUTE_WAKE_FRESH_REPAIR_STOP_NATIVE_R01_R02_M01'}
          pathlib.Path('r1-wake-build/manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-wake-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-wake-build/
          if-no-files-found: error
          retention-days: 30
  consume:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r1-wake-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-wake-build
      - name: Verify binary+source and run all 79 bounded R1 owner tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,hashlib,json
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m=json.load(open('r1-wake-build/manifest.json'))
          assert m['source_sha']==os.environ['GITHUB_SHA']
          assert m['run_id']==os.environ['GITHUB_RUN_ID'] and m['attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          assert m['toolchain']=='1.85.1' and m['target']=='x86_64-unknown-linux-gnu'
          assert sha('r1-wake-build/owner.test')==m['binary_sha256']
          for p,v in m['inputs'].items():assert sha(p)==v,p
          PY
          chmod +x r1-wake-build/owner.test
          mkdir r1-wake-result
          set +e
          r1-wake-build/owner.test r1_ --nocapture >r1-wake-result/tests.log 2>&1
          ec=$?
          set -e
          cat r1-wake-result/tests.log
          TEST_EXIT="$ec" python3 - <<'PY'
          import os,json,pathlib,hashlib,re,sys
          m=json.load(open('r1-wake-build/manifest.json'))
          l=pathlib.Path('r1-wake-result/tests.log').read_text()
          count_match=re.search(r'test result: ok\. (\d+) passed; 0 failed',l)
          count=int(count_match.group(1)) if count_match else 0
          names=re.findall(r'^test [\w:]+::(r1_\w+) \.\.\. ok$',l,re.M)
          expected=['r1_wake_idle_single_packet_push_before_arm_r01',
                    'r1_wake_publish_during_armed_recheck_r01',
                    'r1_wake_token_publish_at_park_boundary_r01',
                    'r1_wake_full_repair_does_not_block_fresh_r02',
                    'r1_wake_stop_before_delivery_and_reject_late_offer_r02',
                    'r1_wake_stop_with_full_return_backlog_and_last_frozen_loan_m01',
                    'r1_wake_stop_during_inflight_publish_never_returns_false_quiesce_r02',
                    'r1_wake_return_after_park_wakes_stopped_owner_m01',
                    'r1_wake_fake_monotonic_deadline_recheck_r02',
                    'r1_parity_first_fresh_before_32ms_fec_due_and_no_early_wake',
                    'r1_parity_only_absolute_fake_deadline_wakes_parked_owner',
                    'r1_parity_bounded_repair_parity_fairness_under_continuous_fresh',
                    'r1_parity_stop_full_three_classes_and_frozen_return_race',
                    'r1_ready_owner_zero_and_one_honor_current_scope_no_copies',
                    'r1_ready_owner_thirty_two_old_and_new_never_mix_on_dispatch',
                    'r1_ready_owner_thirty_three_split_retire_old_reject_all_tails',
                    'r1_ready_owner_old_stale_offer_after_new_fresh_preserves_first_order',
                    'r1_ready_owner_concurrent_old_drop_and_stop_keeps_fences_exact',
                    'r1_ready_owner_restarted_aba_token_and_old_batch_rejected',
                    'r1_ready_owner_stop_and_fake_age_expiry_have_no_ready_resurrection',
                    'r1_ready_owner_p0_component_warmup_repeat_provenance',
                    'r1_owner_loan_stop_idempotent_cancels_only_undispatched_33_tail',
                    'r1_owner_loan_stop_held_frozen_arc_last_clone_after_batch_fence',
                    'r1_owner_loan_stop_old_generation_33_plus_new_first_fresh',
                    'r1_owner_loan_stop_bounded_full_return_backlog_two_generations',
                    'r1_owner_loan_stop_restart_aba_stale_token_cannot_reenter',
                    'r1_owner_release_fresh_first_stale_stop_aba_no_resubmission',
                    'r1_owner_release_ready_0_1_32_33_tx_rx_two_lanes',
                    'r1_owner_release_old_batch_held_stop_new_scope_stale_after_32']
          new_early=[
              'r1_early_rx_prepare_caller_only_before_exact_after_overlap_overflow',
              'r1_early_rx_zero_then_one_after_detach_immediate_no_hol',
              'r1_early_rx_32_cap_33rd_full_still_owned_not_free_until_drop',
              'r1_early_rx_byte_cap_and_owner_prealloc_mismatch_fail_closed',
              'r1_early_rx_stop_pre_detach_twice_held_frozen_late_return',
              'r1_early_rx_old_32_held_rotate_fresh_new_scope_not_hol',
              'r1_early_rx_stop_after_detach_does_not_free_loan_and_aba_stale',
              'r1_early_rx_rotation_discards_undelivered_tail_no_old_new_mix',
          ]
          ok=(int(os.environ['TEST_EXIT'])==0 and count==87 and len(names)==87
              and len(set(names))==87
              and all(x in names for x in expected+new_early)
              and '1 ignored' in l)
          record={'source_sha':m['source_sha'],'run_id':m['run_id'],'attempt':m['attempt'],
                  'binary_sha256':m['binary_sha256'],'log_sha256':hashlib.sha256(l.encode()).hexdigest(),
                  'native_tests':count,'named_wake_tests':9,'result':'PASS' if ok else 'FAIL',
                  'scope':'M1_R1_READY_GENERATION_PARITY_WAKE_STOP_TWO_LANE_NATIVE_NOT_ABI',
                  'not_qualified':'RTRB_SPSC;LOOM;EVENTFD;REAL_RAW_DRIVER;GO_V4;PRODUCT;PERFORMANCE;PHYSICAL'}
          pathlib.Path('r1-wake-result/result.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          if not ok:sys.exit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: r1-wake-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-wake-result/
          if-no-files-found: warn
          retention-days: 30
