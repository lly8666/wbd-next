# Frozen original Go/Rust+ISA-L ARM64 build; this is a separate FEC2
# functional candidate, not a throughput or parity-hardware benchmark.
name: Linux ARM64 pinned FEC2 Fixed two-way netns
run-name: ARM64 FEC2 Fixed netns ${{ github.sha }}
on:
  push:
    branches: [feature/arm64-linux-android-openwrt-autoaccel]
    paths:
      - '.github/workflows/arm64-linux-fec-fixed-frozen.yml'
      - 'tools/arm64_linux_netns_smoke.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 17
    env:
      WBD_ARM64_FROZEN_SOURCE: 9194e20f2f53cd4ac0b85d3e7f5aa136f164d2c3
      WBD_V4_MODE: fec-fixed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 39752535971
          github-token: ${{ github.token }}
          name: arm64-public-go-rust-39752535971-1
          path: arm64-public-bundle/
      - name: Native original Go TLS/Rust FEC2 Fixed actual two-sided kernel trial
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables
          bash tools/arm64_linux_netns_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-fixed-netns-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-netns-result/
          if-no-files-found: warn
          retention-days: 30
