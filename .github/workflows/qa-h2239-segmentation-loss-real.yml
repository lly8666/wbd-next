name: 'H2239 true 5pct GE segmentation-granularity kernel A/B/A'
run-name: 'H2239 Direct/WBD GSO/TSO original-off-original SOURCE ${{ github.sha }}'
on:
  push:
    branches: ['feat/h2239-real-loss-granularity']
    paths:
      - '.github/workflows/qa-h2239-segmentation-loss-real.yml'
      - 'tools/m0_h2239_loss_granularity.py'
      - 'tests/test_m0_h2239_loss_granularity.py'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: h2239-segmentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: 'Exact source, real kernel offloads/seed and original no-HOL guards'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Kernel skb/segmentation and original lease/Stop identity (test only)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/m0_h2239_loss_granularity.py tools/m0_h2234_local_netns.py
          python3 -m unittest tests.test_m0_h2239_loss_granularity tests.test_m0_h2234_local_netns tests.test_m0_h2229_native_ack_unified -v
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/m0_h2239_loss_granularity.py').read_text()
          assert 'seed_controls_prng_not_identical_packet_stream' in s
          assert 'original_offloads_before' in s and 'original_offloads_after' in s
          assert 'H2239_NETEM_FIXED_SEED_READBACK_UNKNOWN' in s
          assert '"production_config_unchanged":True' in s
          print('H2239_NATIVE_PACKET_GRANULARITY_STATIC_NO_PRODUCT_CHANGE')
          PY
  native-true-linux:
    name: 'True original Go TLS/Rust GE5pct GSO/TSO default-off-default A/B/A'
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            arch: x86_64
          - host: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.host }}
    timeout-minutes: 43
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Genuine kernel TUN/netem, BBR and original Go TLS Rust native build
        shell: bash
        timeout-minutes: 23
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$WBD_PLAN029_LINUX_EXPECTED_ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            iproute2 iptables iperf3 iputils-ping ethtool tcpdump \
            autoconf automake libtool make gcc g++ nasm openssl
          bash tools/m0_plan029_linux_dual_native_build.sh >h2239-build.log 2>&1 ||
            { tail -n 120 h2239-build.log; exit 2; }
      - name: Real same-VM GE5pct Direct/WBD real offload A/B/A seeded netem
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/m0_h2239_loss_granularity.py
          python3 - <<'PY'
          import os,json
          d=json.load(open('h2239-loss-granularity/summary.json'))
          assert d['source_sha']==os.environ['GITHUB_SHA']
          assert d['run_id']==os.environ['GITHUB_RUN_ID']
          assert d['status']=='PASS_NATIVE_GSO_CAUSAL_CASES_NOT_PRODUCT_GAIN',d['status']
          assert d['native_arch']==os.uname().machine
          assert d['server_owned_stop_verified']
          assert len(d['phases'])==3
          assert [p['name'] for p in d['phases']]==[
              'original_offloads_before','no_segmentation_offloads','original_offloads_after']
          assert all(p.get('direct',{}).get('status')=='PASS_REAL_KERNEL_IPERF3_TCP' and
                     p.get('wbd',{}).get('status')=='PASS_REAL_KERNEL_IPERF3_TCP' and
                     p.get('client_owned_stop',{}).get('status')=='REAL_RUST_OWNED_STOP'
                     for p in d['phases'])
          assert d['seed_per_router_direction_per_case']==22390517
          assert not d['physical_wan'] and d['production_config_unchanged']
          print('H2239_TRUE_NATIVE_SKB_SEGMENTATION_DIAG_PASS_NOT_PRODUCT_GAIN')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2239-gso-5pct-${{ matrix.arch }}-original-source-locked
          path: |
            h2239-loss-granularity/
            h2239-build.log
          retention-days: 10
          if-no-files-found: warn
