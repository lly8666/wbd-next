name: M0 PLAN028 H1381 real Windows CI original native two separate account-device event slots
run-name: "PLAN028 H1381 Windows2025 two original account-bound native OS owner slots source ${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - "r0/go_overlay/cmd/wbd-client/m0_native_v4_windows.go"
      - "r0/go_overlay/cmd/wbd-client/m0_plan028_dual_native_slot_windows_test.go"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: m0-plan028-h1381-real-win-native-slot-${{ github.sha }}
  cancel-in-progress: false
jobs:
  exact-original-go-windows-os-event-two-slot:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Assemble exact original Go with source-locked native Windows owner and test-only Windows source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path result/h1381 | Out-Null
          & python tools/prepare_windows_wiring.py 2>&1 | Tee-Object result/h1381/assembly.log
          if($LASTEXITCODE -ne 0){throw 'original Go/native exact source assembly failed'}
          @'
          import pathlib,os,subprocess,json
          sha=os.environ["GITHUB_SHA"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==sha
          assert subprocess.check_output(["git","-C","legacy","rev-parse","HEAD"],text=True).strip()=="a7a82db31fe736ffedee330795a3234d358f1984"
          source="r0/go_overlay/cmd/wbd-client/m0_plan028_dual_native_slot_windows_test.go"
          exact=subprocess.check_output(["git","show",sha+":"+source])
          dest=pathlib.Path("legacy/cmd/wbd-client/m0_plan028_dual_native_slot_windows_test.go")
          # Current prepare_windows_wiring already installs this immutable
          # test in the original Go clone. Existing identical bytes are
          # source-locked proof, not a duplicate injection failure.
          if dest.exists():
            assert dest.read_bytes()==exact,"original Windows account-slot test source mismatched pinned SOURCE"
            installation="ALREADY_ASSEMBLED_IDENTICAL"
          else:
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(exact)
            installation="PINNED_TEST_ONLY_ADDED"
          pathlib.Path("result/h1381/source.json").write_text(json.dumps({
            "source_sha":sha,"original_go_donor":"a7a82db31fe736ffedee330795a3234d358f1984",
            "exact_test_source_locked":source,"installation":installation,
            "original_windows_tls443_two_product_clients":"NOT_RUN",
            "signed_two_Wintun_product_application":"NOT_RUN",
            "test_scope":"REAL_WINDOWS_NAMED_EVENT_OWNER_AND_ACCOUNT_STATE_FENCE_ONLY"
          },indent=2)+"\n")
          print("M0_PLAN028_H1381_EXACT_SOURCE_ORIGINAL_WINDOWS_GO_TEST_ASSEMBLED")
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'source-locked Windows two-slot test injection failed'}
      - name: Real Windows kernel named-event two independent original native account/lease/WAL guarded slots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location legacy
          try {
            & go test -count=1 -v -tags wbd_v4_embedded_go -run '^(TestPLAN028H1381RealWindowsTwoOriginalNativeDeviceSlots|TestPLAN010OwnerSlotIsActuallyExclusive)$' ./cmd/wbd-client 2>&1 |
              Tee-Object ../result/h1381/real-windows-native-event-slots.log
            if($LASTEXITCODE -ne 0){throw 'actual Windows kernel two owner event or old global singleton test FAIL'}
          }finally{Pop-Location}
          $log=Get-Content result/h1381/real-windows-native-event-slots.log -Raw
          if($log -notmatch 'H1381_TWO_REAL_WINDOWS_NAMED_KERNEL_EVENTS_ALIAS_BOUND_AND_OLD_SINGLETON_PRESERVED' -or
             $log -notmatch '--- PASS: TestPLAN028H1381RealWindowsTwoOriginalNativeDeviceSlots' -or
             $log -notmatch '--- PASS: TestPLAN010OwnerSlotIsActuallyExclusive'){
            throw 'real Windows kernel named-event ownership / legacy singleton marker missing'
          }
          Write-Output 'M0_PLAN028_H1381_REAL_WINDOWS_TWO_NAMED_EVENTS_DISTINCT_AUTH_PRINCIPAL_AND_WAL_OWNER_SLOTS_PASS'
          Write-Output 'M0_PLAN028_H1381_TWO_ORIGINAL_WINDOWS_GO_TLS_RUST_PRODUCT_CLIENTS_NOT_RUN'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1381-windows2025-real-two-native-account-device-slots-${{ github.run_id }}
          path: result/h1381/
          retention-days: 30
