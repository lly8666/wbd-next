name: FEC W167 native ARM64 x86 outer repair ON 20s IID matrix
run-name: "FEC-W167|native-dual-arch|${{ github.sha }}"
on:
  push:
    branches: [experiment/fec-network-tuning]
    paths:
      - ".github/workflows/fec-w167-arm64-x86-outer-on-matrix.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fec-w167-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-20s-scenarios:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Install native build and netns dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc nasm iproute2 iptables openssl ethtool
      - name: Build original Go TLS + Rust M1/M3/M4 native exact-source bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            test "$(uname -m)" = aarch64
            bash tools/arm64_public_go_rust_bundle.sh
            echo "BUNDLE=arm64-public-bundle" >> "$GITHUB_ENV"
          else
            test "$(uname -m)" = x86_64
            sed -e 's/aarch64/x86_64/g' -e 's/arm64/amd64/g' tools/arm64_public_go_rust_bundle.sh > "$RUNNER_TEMP/w167-native-amd64.sh"
            bash "$RUNNER_TEMP/w167-native-amd64.sh"
            echo "BUNDLE=amd64-public-bundle" >> "$GITHUB_ENV"
          fi
      - name: Assert real Go public outer DATA repair default and Game4 fallback
        shell: bash
        run: |
          set -euo pipefail
          cp r0/go_overlay/internal/v4productcli/outer_repair_default_linux_test.go legacy/internal/v4productcli/
          cp r0/go_overlay/internal/v4productcli/game4_copy_default_linux_test.go legacy/internal/v4productcli/
          export CGO_ENABLED=1 GOOS=linux GOTOOLCHAIN=local
          export GOARCH="${{ matrix.arch }}"
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release"
          (cd legacy && go test -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run 'TestPublicOuterDataRepairDefaultsOnAcrossAllModes|TestGame4PublicDefaultWideStaggerAndExplicitFallbacks' ./internal/v4productcli -count=1 -v)
      - name: Execute seven original product modes times four IID levels 20s
        shell: bash
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_SHA,GITHUB_RUN_ID,GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_TEMP,GITHUB_JOB \
            python3 -m tools.network_harness.fec_w167_dual_arch_matrix \
            --bundle "$GITHUB_WORKSPACE/$BUNDLE" \
            --output "$GITHUB_WORKSPACE/w167-matrix-${{ matrix.arch }}" \
            --arch "${{ matrix.arch }}"
      - name: Preserve cases and capacity-stop receipts
        if: always()
        run: |
          echo "W167 native ${{ matrix.arch }} complete/incomplete; inspect attached progress and STOP_CAPACITY." >> "$GITHUB_STEP_SUMMARY"
          if [[ -s w167-matrix-${{ matrix.arch }}/progress.json ]]; then
            python3 -c 'import json; p="w167-matrix-${{ matrix.arch }}/progress.json"; d=json.load(open(p)); print("W167_PROGRESS",p,d["completed"],"/",d["total_10mbps_cases"])'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fec-w167-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            w167-matrix-${{ matrix.arch }}/**
            !w167-matrix-${{ matrix.arch }}/bundle-A/**
          retention-days: 14
          if-no-files-found: warn
