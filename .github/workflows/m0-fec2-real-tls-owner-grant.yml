  m0-windows-native:
    runs-on: windows-2022
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Actual Windows x64 MSVC scalar FEC2 codec and M2 recovery
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory blocker-windows -Force | Out-Null
          # aws-lc-sys uses ASM even for scalar F2: real Windows native
          # test cannot start until NASM is on PATH. Record this as a
          # runner prerequisite, never a Rust algorithm regression.
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Windows NASM install failed' }
          $nasmDir=$null
          foreach ($candidate in @('C:\Program Files\NASM','C:\ProgramData\chocolatey\bin')) {
            if (Test-Path (Join-Path $candidate 'nasm.exe')) { $nasmDir=$candidate; break }
          }
          if (-not $nasmDir) { throw 'Windows NASM executable unavailable' }
          $env:PATH="$nasmDir;$env:PATH"
          nasm -v
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --release --locked -p wbd-codec --lib r1_f2_ -- --test-threads=2 *> blocker-windows/fec2-codec.log
          if ($LASTEXITCODE -ne 0) { Get-Content blocker-windows/fec2-codec.log -Tail 45; throw 'Windows native F2 fail' }
          cargo +1.85.1 test --release --locked -p wbd-recovery --lib -- --test-threads=2 *> blocker-windows/m2-recovery.log
          if ($LASTEXITCODE -ne 0) { Get-Content blocker-windows/m2-recovery.log -Tail 45; throw 'Windows native M2 fail' }
          $digest=(Get-FileHash blocker-windows/fec2-codec.log -Algorithm SHA256).Hash.ToLowerInvariant()
          $out=@{result="PASS_WINDOWS_NATIVE_SCALAR_FEC2_M2_ONLY";source_sha=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;test_log_sha256=$digest;native_target="x86_64-pc-windows-msvc";production_FEC2="OFF";windows_real_go_TLS_raw_driver="NOT_RUN";windows_native_isa_l="NOT_RUN"}
          ($out|ConvertTo-Json) | Set-Content blocker-windows/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: blocker-windows/
