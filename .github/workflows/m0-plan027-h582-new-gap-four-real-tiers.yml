name: M0 PLAN027 H582 one-build authenticated-gap real four tiers
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h582-new-gap-four-real-tiers.yml]
permissions: {contents: read, actions: write}
jobs:
  once:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h582-one-source-tiers]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 502c2480b15569d28fe923862e9eb1ba2e5ef8a4
      ZERO_RUN: "41175027533"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Only after genuine source-matched zero/native Stop and exact binary manifests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" HEAD -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          for filename,loss in (('plan027-h539-normal-10m-250ms-loss1-60s.json',1),
              ('plan027-h539-normal-10m-250ms-loss5-60s.json',5),
              ('plan027-h539-normal-10m-250ms-loss15-60s.json',15),
              ('wl-outer-repair-10m-250ms-loss30-60s.json',30)):
              s=read_scenario('scenarios/'+filename)
              assert s['public_mode']=='normal' and s['duration_s']==60
              for direction in ('windows_to_linux','linux_to_windows'):
                  assert s[direction]['loss_pct']==loss and s[direction]['offered_mbps']==10 and s[direction]['delay_ms']==250
              print("H582_EXACT_DAMAGE_SCENE",filename,s['scenario_sha256'])
          PY
          initial="$(gh api "repos/$GH_REPO/actions/runs/$ZERO_RUN")"
          test "$(jq -r .head_sha <<<"$initial")" = "$SOURCE"
          test "$(jq -r .event <<<"$initial")" = workflow_dispatch
          test "$(jq -r '.repository.full_name' <<<"$initial")" = "$GH_REPO"
          for i in $(seq 1 52); do
            run="$(gh api "repos/$GH_REPO/actions/runs/$ZERO_RUN")"
            if [ "$(jq -r .status <<<"$run")" = completed ]; then
              conclusion="$(jq -r .conclusion <<<"$run")"
              echo "H582_EXACT_ZERO_COMPLETE run=$ZERO_RUN conclusion=$conclusion"
              test "$conclusion" = success || { echo H582_ZERO_FAIL_NO_RATE_DISPATCH >&2; exit 1; }
              break
            fi
            test "$i" -lt 52 || { echo H582_ZERO_INFLIGHT_NO_RATE_DISPATCH >&2; exit 2; }
            sleep 30
          done
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$ZERO_RUN/jobs?per_page=100")"
          test "$(jq -r '[.jobs[] | select(.name=="native-public-two-os") | .conclusion] | first' <<<"$jobs")" = success
          artifacts="$(gh api "repos/$GH_REPO/actions/runs/$ZERO_RUN/artifacts?per_page=100")"
          jq -e --arg n "m0-wl-windows-product-binaries-$SOURCE" '.artifacts[] | select(.name==$n and .expired==false)' <<<"$artifacts" >/dev/null
          jq -e '.artifacts[] | select(.name=="m0-plan024-linux-product" and .expired==false)' <<<"$artifacts" >/dev/null
          echo "H582_SOURCE_LOCKED_BINARY_PROVENANCE_OK run=$ZERO_RUN source=$SOURCE"
          for scen in \
            plan027-h539-normal-10m-250ms-loss1-60s.json \
            plan027-h539-normal-10m-250ms-loss5-60s.json \
            plan027-h539-normal-10m-250ms-loss15-60s.json \
            wl-outer-repair-10m-250ms-loss30-60s.json; do
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode=normal -f run_n0=false -f perf_ab=false \
              -f perf_scenario_file="scenarios/$scen" \
              -f perf_reuse_run_id="$ZERO_RUN" -f perf_binary_source_sha="$SOURCE"
            echo "H582_ONE_TEST_PER_ACTION_DISPATCHED scene=$scen source=$SOURCE"
          done
          echo H582_FOUR_NEW_AUTH_GAP_REAL_SCENES_DISPATCHED
