name: M0 PLAN027 H737 one Game2FEC true native single outer PID supervisor
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h737-gamefec-outer-supervisor-native.yml]
permissions: {contents: read, actions: write}
jobs:
  one-real-game2-fec-outer-supervisor:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h737-game-single-pid]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 0264c2cfc91e05c7c4b8d518fa0efc6707a2ff6b
      BINARY_BUILD: "41280564979"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One authentic signed original Go TLS Rust NPF Wintun and Linux Game2FEC after external supervisor fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/41282739002" --jq .conclusion)" = cancelled
          test "$(gh api "repos/$GH_REPO/actions/runs/41282744989" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/41283787485" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD/jobs?per_page=100" |
            jq -e '[.jobs[]|select(.name=="Windows Go production and test compilation only" or .name=="Build true original Go and new Linux Rust peer persona from same SOURCE")|.conclusion]|length==2 and all(.=="success")' >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '
              [.artifacts[]|select(.expired==false)|.name]
              | index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          # Product sources, assembler, scenarios and original authenticated
          # E2E are identical. Only existing PID-owner logging/short budget
          # and synthetic test fixtures differ from frozen product binaries.
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_netem.py scenarios)"
          python3 - <<'PY'
          from pathlib import Path
          from tools.m0_wl_native_step_runner import native_batch_deadline
          scene="scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json"
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario(scene)
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10 and s["tun_mtu"]==1400
          assert s["seed"]==20261029 and s["warmup_s"]==3 and s["drain_s"]==5
          for d in ("windows_to_linux","linux_to_windows"):
              assert (s[d]["offered_mbps"],s[d]["delay_ms"],s[d]["loss_pct"])==(1,25,0)
          assert native_batch_deadline({"WBD_WL_PUBLIC_MODES":"game2-fec","WBD_WL_V2_SCENARIO":scene})==250
          m=Path("tools/m0_wl_public_modes_e2e.py").read_text()
          r=Path("tools/m0_wl_native_step_runner.py").read_text()
          assert "185 if minimal_game_fec else" in m
          assert "GameFecProgress(output.parent,env=os.environ)" in r
          assert "GameFecProgress" not in m
          assert "trace.snapshot(\"MODE_TIMEOUT\")" in r
          assert 'permissions: {contents: read, actions: write}' in Path(".github/workflows/m0-wl-public-normal-full.yml").read_text().split("  native-public-two-os:\n",1)[1].split("    needs:",1)[0]
          print("H737_SOURCE_MATCH_NATIVE_SUPERVISOR_SINGLE_PID_MINIMAL_SCENE",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          previous="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -1)"
          if [ -n "$previous" ];then echo "H737_ALREADY_DISPATCHED=$previous";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BINARY_BUILD" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo "H737_ORIGINAL_GAMEFEC_TRUE_NATIVE_DISPATCHED_NOT_PASS source=$PRODUCT_SOURCE outer_pid=single"
