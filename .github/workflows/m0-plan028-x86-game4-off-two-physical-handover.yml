name: M0 PLAN028 native x86 Game4 FEC off original TLS two physical handovers with Normal live
run-name: PLAN028 H1202 x86 Game4 FEC off real A-B-A authenticated TLS/Rust M4
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-x86-game4-off-two-physical-handover.yml"
      - "tools/m0-plan028-x86-game4-off-two-physical-handover-fixture.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-x86-mixed-game4-two-real-switches:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_SOURCE: 8a31375e36bb6a93860c5579e64b4a39d0b6e346
      PRODUCT_BUILD_ACTION: "43027983611"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 43027983611
          github-token: ${{ github.token }}
          name: m0-plan024-linux-product
          path: fixed-build/
      - name: H1628 frozen official original-Go Rust ISA-L product / exact SHA and zero build
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main && test "$(uname -m)" = x86_64
          test -c /dev/net/tun
          git fetch --quiet --depth=1 origin "$PRODUCT_SOURCE"
          test "$(git rev-parse FETCH_HEAD)" = "$PRODUCT_SOURCE"
          changed="$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0-plan028-mixed-normal-game-native.sh)"
          test -z "$changed" || { echo "H1628 PRODUCT_CHANGED_REFUSE_OLD_BINARIES: $changed" >&2; exit 1; }
          python3 - <<'PY'
          import os,hashlib,json,pathlib,struct
          p=pathlib.Path("fixed-build")
          m=json.loads((p/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["PRODUCT_SOURCE"]
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert m["rust_native_fec_acceleration"] is True
          assert m["isa_l_source"]=="c387163fcbca62701d646149564c550c78a4f985"
          assert m["binary_qualification"]=="BUILD_ONLY_NOT_PRODUCT"
          expected={
           "wbd-v4-client":"7f347ae9dc878edf508aa5fdeb8668ccae653682d01898435b69d42c94a555d1",
           "wbd-v4-server":"9188f3941eba3dfd48831f779e0d8b73d3b31deda4c1978a1f270e11d75dcc71",
           "libwbd_engine.so":"2947d148d325e198acd920c56803ad168175ba11590396478682693fcf5922dc"
          }
          for name,sha in expected.items():
              b=(p/name).read_bytes()
              assert len(b)>100000 and b[:4]==b"\x7fELF" and struct.unpack_from("<H",b,18)[0]==62,name
              assert hashlib.sha256(b).hexdigest()==m["sha256"][name]==sha,name
          print("H1628_SOURCE8A_ORIGINAL_GO_RUST_THREE_ACCELERATED_BINARY_SHA256_PASS",flush=True)
          PY
          chmod +x fixed-build/wbd-v4-client fixed-build/wbd-v4-server
          mkdir -p fixed-kernel-result
          bash -n tools/m0-plan028-mixed-normal-game-native.sh
      - name: Native x86/x86 two physical Game4 source/MTU handovers while Normal Auto independently sends genuine UDP
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 && test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          python3 tools/m0-plan028-x86-game4-off-two-physical-handover-fixture.py "$RUNNER_TEMP/h1202-x86-game4-off.sh"
          bash -n "$RUNNER_TEMP/h1202-x86-game4-off.sh"
          bash "$RUNNER_TEMP/h1202-x86-game4-off.sh" fixed-build \
            >fixed-kernel-result/plan028-h1202-first-x86-game4-off-source4.log 2>&1 || {
              tail -200 fixed-kernel-result/plan028-h1202-first-x86-game4-off-source4.log >&2
              exit 1
            }
          grep -Fq "M0_PLAN028_H1202_X86_GAME4_OFF_FIRST_PHYSICAL_NORMAL_LIVE_PASS" \
            fixed-kernel-result/plan028-h1202-first-x86-game4-off-source4.log
          grep -Fq "M0_PLAN028_H1202_X86_GAME4_OFF_TWO_PHYSICAL_NORMAL_LIVE_PASS" fixed-kernel-result/plan028-h1202-first-x86-game4-off-source4.log
          grep -Fq "M0_PLAN028_H1202_X86_ONE443_GAME4_OFF_REAL_UDP_STOP_PASS" \
            fixed-kernel-result/plan028-h1202-first-x86-game4-off-source4.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["PRODUCT_SOURCE"] and m["rust_native_fec_acceleration"] is True
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62,name
              assert hashlib.sha256(b).hexdigest()==m["sha256"][name],name
          base=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1151-mixed-one443.json").read_text())
          proof=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1202-first-mixed-game4-physical.json").read_text())
          assert base["server_port"]==443 and base["native_peers"]==["game2-off-ChaCha","game4-off-AES256","normal-auto-AES128"]
          assert base["real_udp_echoes"]=={"game2":12,"game4":18,"normal":18}
          assert base["game2_stop_did_not_stop_game4_or_normal"] and base["shared_rust_tun_reader_final_stop"]
          assert proof["shared_port"]==443 and proof["game4_lanes"]==4
          assert proof["source4_before"]=="10.25.0.3" and proof["source4_after"]=="10.25.0.9"
          assert proof["outer_user_ipv4_mtu"]==1460 and proof["physical_new_mtu"]==1280
          assert proof["game4_old_inner_os_mtu"]>=1100 and 1100<=proof["game4_new_inner_os_mtu"]<proof["game4_old_inner_os_mtu"]
          assert proof["normal_old_inner_os_mtu"]==1375 and proof["normal_new_inner_os_mtu"]==1375
          assert proof["normal_live_udp_echoes"]==48 and proof["game4_new_udp_echoes"]==32
          assert proof["new_tls_auth_ready"] and proof["old_exact_stop"] and proof["normal_not_reauthenticated"]
          restored=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1202-second-two-physical-switch.json").read_text())
          assert restored["source4_route_sequence"]==["10.25.0.3","10.25.0.9","10.25.0.3"]
          assert restored["physical_ipv4_mtu_sequence"]==[1500,1280,1500]
          assert restored["generation_replacement_sequence"]==[[1,2],[2,3]]
          assert restored["one_server_port"]==443 and restored["game4_new_gen3_echoes"]==16 and restored["game4_fec_off"]
          assert restored["normal_live_restoration_echoes"]==16
          assert restored["old_generation1_exact_stop"] and restored["old_generation2_exact_stop"]
          assert 1100<=restored["os_mtu_third_generation_overlap_conservative"]<=proof["game4_new_inner_os_mtu"]
          assert restored["sibling_normal_os_mtu"]==1375 and restored["configured_outer_intent"]==1460
          assert proof["notifier_to_tls_start_ms"]=="NOT_MEASURED"
          assert proof["auth_to_first_packet_ms"]=="NOT_MEASURED"
          print("M0_PLAN028_H1202_NATIVE_X86_GAME4_OFF_TWO_PHYSICAL_ORIGINAL_TLS_RUST_STOP_PASS")
          PY
          cat fixed-kernel-result/plan028-h1202-first-mixed-game4-physical.json
          cat fixed-kernel-result/plan028-h1202-second-two-physical-switch.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-h1202-native-x86-game4-off-dual-physical-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/assembly.json
            fixed-kernel-result/plan028-h1151-protected-policy-unit.log
            fixed-kernel-result/plan028-h1202-first-x86-game4-off-source4.log
            fixed-kernel-result/plan028-h1202-first-mixed-game4-physical.json
            fixed-kernel-result/plan028-h1202-first-game4-os-route.json
            fixed-kernel-result/plan028-h1202-first-game4-os-link.json
            fixed-kernel-result/plan028-h1202-second-two-physical-switch.json
            fixed-kernel-result/plan028-h1202-second-restored-os-route.json
            fixed-kernel-result/plan028-h1202-second-restored-os-link.json
            fixed-kernel-result/plan028-h1151-mixed-one443.json
            fixed-kernel-result/plan028-h1151-alice-tun.json
            fixed-kernel-result/plan028-h1151-bob-tun.json
            fixed-kernel-result/plan028-h1151-carol-tun.json
            fixed-kernel-result/plan028-h1151-server-tun.json
          if-no-files-found: warn
          retention-days: 14
