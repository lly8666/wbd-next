          if($env:WBD_WL_V2_SCENARIO -and $env:WBD_WL_ABBA_NATIVE -ne '1'){
            $v2Config=Get-Content $env:WBD_WL_V2_SCENARIO -Raw | ConvertFrom-Json
            $modeForScenario=if($v2Config.public_mode){$v2Config.public_mode}else{'normal'}
            if($modeForScenario -ne $env:WBD_WL_PUBLIC_MODES){
              throw 'V2 real mode must equal committed scenario public_mode'
            }
            if($env:WBD_WL_V2_SCENARIO -like 'scenarios/wl-outer-repair-*.json' -and $modeForScenario -eq 'normal'){
              # Intentional netem damage: 99.9% app delivery is not a valid
              # hard gate. Verify actual tc drops, offered rate, Rust Stop
              # and accepted/uncertain outer R/F, R/total, R/C instead.
              & python tools/m0_wl_outer_repair_verify.py --scenario $env:WBD_WL_V2_SCENARIO --mode-root result/wl-public/mode-results/normal --out result/wl-public/outer-repair-verdict.json
              if($LASTEXITCODE -ne 0){throw 'Windows Rust native outer repair: scoped budget, coverage or capacity FAIL'}
            }else{
              $real=$result.WL_V2
              if($real.status -ne 'MEASURED_BOTH_OS_KERNEL' -or
                 $real.owned_stop -ne 'PASS_BOTH_OWNED'){
                throw 'Rust V2 real kernel measurement or owned Stop not proven'
              }
              # A deliberately damaged FEC/Game netem profile is not a 0-loss
              # Normal trial. Require genuine positive first-arrival each way;
              # the existing per-mode report checks true TLS/UDP/TCP/Stop.
              # Keep the historical >=99.9% gate for loss=0 unchanged.
              $damaged=($v2Config.windows_to_linux.loss_pct -gt 0 -or
                        $v2Config.linux_to_windows.loss_pct -gt 0)
              # A staged Auto profile begins clean but deliberately damages
              # one or both directions later. Overall 240s first arrival is
              # NOT the clean 99.9% oracle. Keep genuine tc-stage readbacks.
              foreach($stage in @($v2Config.impairment_stages)){
                if($stage.windows_to_linux.loss_pct -gt 0 -or
                   $stage.linux_to_windows.loss_pct -gt 0){
                  $damaged=$true
                  break
                }
              }
              # Explicit 100/300ms complete kernel outages are NOT a
              # 60-second lossless scene merely because random loss_pct=0.
              # Require same measured pulses plus a source-first floor from
              # their actual time fraction with PLAN027's 2pp allowance.
              $bursts=if($null -ne $v2Config.kernel_loss_bursts){
                @($v2Config.kernel_loss_bursts)
              }else{@()}
              if($bursts.Count -gt 0){
                $observed=@($real.kernel_bursts_applied)
                if($observed.Count -ne $bursts.Count){
                  throw 'real kernel 100/300ms bursts absent from native readback'
                }
                $totalBurstMs=0
                for($b=0;$b -lt $bursts.Count;$b++){
                  $target=$bursts[$b];$actual=$observed[$b]
                  if($null -eq $actual -or
                     [int]$actual.index -ne $b -or
                     [double]$actual.min_bilateral_100pct_active_ms -lt [double]$target.duration_ms){
                    throw 'original two-direction kernel pulse duration unproven'
                  }
                  $totalBurstMs += [double]$target.duration_ms
                }
                # One source-of-truth floor: the same Python verifier
                # already used by V2 scenario tests, not a second PowerShell
                # numeric comparison. Keep actual OS burst readbacks above.
                & python -c 'import json,sys; from tools.m0_wl_perf_v2_config import read_scenario,first_delivery_ok_for_scenario; c=read_scenario(sys.argv[1]); v=json.load(open(sys.argv[2],encoding="utf-8"))["WL_V2"]; ok=v["scenario_sha256"]==c["scenario_sha256"] and first_delivery_ok_for_scenario(c,v["first_delivery_fraction"]); print("WL_V2_REAL_KERNEL_PULSES_DELIVERY_SCOPED canonical="+str(ok)+" windows="+str(v["first_delivery_fraction"]["windows"])+" linux="+str(v["first_delivery_fraction"]["linux"])); sys.exit(0 if ok else 1)' $env:WBD_WL_V2_SCENARIO 'result/wl-public/report.json'
                if($LASTEXITCODE -ne 0){
                  throw 'actual kernel burst first delivery below canonical time-weighted tolerance or SOURCE mismatch'
                }
              }elseif($damaged){
                if($real.first_delivery_fraction.windows -le 0 -or
                   $real.first_delivery_fraction.linux -le 0){
                  throw 'damaged V2 mode had no authentic first-delivery in one direction'
                }
              } elseif($real.first_delivery_fraction.windows -lt 0.999 -or
                       $real.first_delivery_fraction.linux -lt 0.999){
                throw 'clean V2 native first delivery below existing 99.9 percent gate'
              }
            }
          }
          if($env:WBD_PLAN028_WSL_OWNED_MTU_ONLY -eq '1'){
            $native=Get-Content result/wl-public/report.json -Raw | ConvertFrom-Json
            $readback=$native.plan028_original_native_mtu_only_reauth
            $os=@($native.plan028_actual_windows_two_generation_os_inner_mtu)
            $syn=$native.plan028_actual_two_generation_syn_synack_mss
            if($native.mode -ne 'normal' -or
               $readback.new_generation_tls_native_ready -ne $true -or
               $readback.old_generation_exact_wal_stop -ne $true -or
               $readback.source4_before -ne '198.19.254.1' -or
               $readback.source4_after -ne '198.19.254.1' -or
               [int]$readback.physical_mtu_before -ne 1500 -or
               [int]$readback.physical_mtu_after -ne 1280 -or
               $os.Count -ne 2 -or [int]$os[0] -ne 1389 -or [int]$os[1] -ne 1209 -or
               @($syn.windows_actual_SYN_MSS).Count -ne 2 -or
               [int]$syn.windows_actual_SYN_MSS[0] -ne 1420 -or
               [int]$syn.windows_actual_SYN_MSS[1] -ne 1240 -or
               $native.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $native.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $native.stop -ne 'PASS_BOTH_OWNED'){
              throw 'PLAN028 genuine native Windows same source IPv4/ifindex 1500→1280 physical MTU-only, authenticated fresh original TLS/Rust, real inner readback and owned Stop not qualified'
            }
            Write-Output 'M0_PLAN028_WINDOWS_TRUE_PHYSICAL_MTU_ONLY_SAME_SOURCE_TLS_RUST_OS_UDP_TCP_STOP_PASS'
          }
          if($env:WBD_PLAN028_WSL_OWNED_SWITCH -eq '1' -and $env:WBD_WL_PUBLIC_MODES -eq 'fixed'){
            $native=Get-Content result/wl-public/report.json -Raw | ConvertFrom-Json
            if($native.plan028_original_native_source4_reauth.new_generation_tls_native_ready -ne $true -or
               @($native.plan028_actual_windows_two_generation_os_inner_mtu).Count -ne 2 -or
               $native.fixed_linux_native_installed -ne $true -or
               $native.fixed_windows_native_installed -ne $true -or
               $native.plan028_fixed_shared_two_generation_authentic_mss.verified -ne $true -or
               $native.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $native.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $native.stop -ne 'PASS_BOTH_OWNED'){
              throw 'PLAN028 signed Fixed6 two real source4 TLS/Rust, OS MTU, Rust FEC6 and UDP/TCP Stop not qualified'
            }
            Write-Output 'M0_PLAN028_SIGNED_WINDOWS_FIXED6_TWO_ACTUAL_TLS_RUST_SOURCE4_GENERATIONS_AND_STOP_PASS'
          }
          if($env:WBD_PLAN028_WSL_OWNED_SWITCH -eq '1' -and $env:WBD_WL_PUBLIC_MODES -eq 'auto'){
            $native=Get-Content result/wl-public/report.json -Raw | ConvertFrom-Json
            $server=Get-Content result/wl-public/mode-results/auto/server.log -Raw
            if($native.plan028_original_native_source4_reauth.new_generation_tls_native_ready -ne $true -or
               @($native.plan028_actual_windows_two_generation_os_inner_mtu).Count -ne 2 -or
               ([regex]::Matches($server,'V4_PUBLIC_PER_CLIENT_NORMAL_FEC_READY mode=auto')).Count -ne 2 -or
               $native.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $native.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $native.stop -ne 'PASS_BOTH_OWNED'){
              throw 'PLAN028 signed Auto two real source4 TLS/Rust M4 cohorts, OS MTU and UDP/TCP/Stop not qualified'
            }
            Write-Output 'M0_PLAN028_SIGNED_WINDOWS_NORMAL_AUTO_TWO_ACTUAL_TLS_RUST_SOURCE4_GENERATIONS_AND_STOP_PASS'
          }
          if($env:WBD_PLAN028_WSL_OWNED_SWITCH -eq '1' -and $env:WBD_WL_PUBLIC_MODES -eq 'game4'){
            $native=Get-Content result/wl-public/report.json -Raw | ConvertFrom-Json
            if($native.plan028_original_native_source4_reauth.new_generation_tls_native_ready -ne $true -or
               @($native.plan028_actual_windows_two_generation_os_inner_mtu).Count -ne 2 -or
               [int]$native.plan028_game4_off_authenticated_rust_m4_receipts -ne 2 -or
               $native.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $native.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $native.stop -ne 'PASS_BOTH_OWNED'){
              throw 'PLAN028 Game4 OFF two authentic Rust M4 groups, OS MTU, UDP/TCP and Stop not qualified'
            }
            Write-Output 'M0_PLAN028_SIGNED_WINDOWS_GAME4_OFF_TWO_ACTUAL_TLS_RUST_SOURCE4_GENERATIONS_AND_STOP_PASS'
          }
          if($env:WBD_WL_PUBLIC_MODES -eq 'auto-adaptive'){
            if($result.mode -ne 'auto-adaptive' -or
               $result.mode_public -ne 'PASS_ACTUAL_WINDOWS_LINUX_NATIVE_auto-adaptive' -or
               $result.auto_adaptive_applied -ne $true -or
               $result.auto_adaptive_native_revision -lt 2 -or
               $result.auto_adaptive_native_profile -ge 5 -or
               $result.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $result.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $result.stop -ne 'PASS_BOTH_OWNED'){
              throw 'native original M2 2s/8s shared Linux Auto naturally applied grade, both-OS UDP/TCP or owned Stop missing'
            }
            Write-Output 'WL_ACTUAL_AUTO_NATURAL_SHARED_POLICY_GRADE_NATIVE_TWO_OS_AND_STOP_PASS'
          } elseif($env:WBD_WL_PUBLIC_MODES -eq 'auto-revision'){
            if($result.mode -ne 'auto-revision' -or
               $result.mode_public -ne 'PASS_ACTUAL_WINDOWS_LINUX_NATIVE_auto-revision' -or
               $result.auto_revision_applied -ne $true -or
               $result.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $result.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $result.stop -ne 'PASS_BOTH_OWNED'){
              throw 'actual Windows original M2 Auto revision2 native both-OS delivery/Stop proof missing'
            }
            Write-Output 'WL_ACTUAL_AUTO_REVISION2_NATIVE_TWO_OS_AND_STOP_PASS'
          } elseif($env:WBD_WL_PUBLIC_MODES -ne 'all' -and $env:WBD_WL_ABBA_NATIVE -ne '1' -and $env:WBD_PLAN028_TWO_REAL_CLIENTS -ne '1') {
            if($result.mode -ne $env:WBD_WL_PUBLIC_MODES -or
               $result.mode_public -ne ('PASS_ACTUAL_WINDOWS_LINUX_NATIVE_'+$env:WBD_WL_PUBLIC_MODES) -or
               $result.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $result.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $result.stop -ne 'PASS_BOTH_OWNED'){
              throw 'selected same-SOURCE native public mode lacks actual two-OS UDP/TCP/Stop proof'
            }
          } elseif($env:WBD_WL_ABBA_NATIVE -ne '1' -and $env:WBD_PLAN028_TWO_REAL_CLIENTS -ne '1' -and $result.normal_public -ne 'PASS_ACTUAL_WINDOWS_LINUX_NATIVE'){
            throw 'real public original Normal product proof not emitted'
          }
          if($env:WBD_WL_RUN_N0 -eq '1' -and
             $result.WL_N0 -notlike 'PASS_SCOPED_*'){
            throw 'one-mode native N0 throughput/TC/delivery measured FAIL; functional startup cannot qualify performance'
          }
          if($env:WBD_WL_RUN_P200 -eq '1' -and
             $result.WL_P200 -notlike 'PASS_SCOPED_*'){
            throw 'P200 true kernel impairment reached capacity limit, missing delivery, or failed owned Stop'
          }
          } finally {
            Set-Content -Path $watchdogDone -Value 'owner-finished'
            if($null -ne $guard -and -not $guard.HasExited){Stop-Process -Id $guard.Id -Force -ErrorAction SilentlyContinue}
            Write-Output 'WL_WSL2_OUTER_WATCHDOG_DISARMED'
          }
      # Native GameFEC producer may fail after changing OS default route.
      # Upload a SMALL original local summary BEFORE separate WSL/NPF cleanup.
      # The existing final full artifact still runs; a canceled parent step
      # cannot reach this step and is backed only by independent Ubuntu stages.
      - name: Prepare bounded original GameFEC first-fault evidence for early upload
        if: always() && (env.WBD_WL_PUBLIC_MODES == 'game2-fec' || env.WBD_WL_PUBLIC_MODES == 'game4-fec')
        shell: pwsh
        timeout-minutes: 1
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force result/wl-public | Out-Null
          $dest='result/wl-public/gamefec-local-first-fault-summary.txt'
          @(
            'schema=m0-gamefec-original-local-allowlisted/v1'
            'run='+$env:GITHUB_RUN_ID
            'product_source='+$env:WBD_WL_BINARY_SOURCE
            'scope=GAMEFEC_ORIGINAL_WINDOWS_LOCAL_FILES_NOT_INDEPENDENT_PRODUCT_PASS'
          ) | Set-Content -LiteralPath $dest
          foreach($role in @('client','server')){
            $path='result/wl-public/'+$role+'.log'
            if(-not (Test-Path -LiteralPath $path)){
              Add-Content $dest ($role+'_LOG_NOT_FOUND')
              continue
            }
            # Read only the tail and preserve fixed stage names / first
            # original native faults; never forward an arbitrary TLS log.
            $lines=@(Get-Content -LiteralPath $path -Tail 4096 -ErrorAction Stop)
            foreach($line in $lines){
              $line=[string]$line
              if($line -match '(?i)password|secret|credential|token|private[_-]?key'){continue}
              if($line -match 'M0_GAME_COLD_STAGE [A-Z0-9_]+|M0_PLAN026_GAME_NATIVE_FIRST_ERROR|M0_PLAN027_GAME_(DUE_FAULT|NATIVE_STOP_)|M0_PLAN027_NATIVE_STOP_RESULT|WBD_WINDOWS_GAME_COLD_TLS_JOINED|WBD_WINDOWS_OS_APPLIED|WBD_WINDOWS_CLIENT_READY|V4_ORIGINAL_GO_GAME_NATIVE_READY|V4_PUBLIC_GAME_NATIVE_STOP_DRAINED'){
                Add-Content -LiteralPath $dest -Value ($role+':'+$line.Substring(0,[Math]::Min(350,$line.Length)))
              }
            }
          }
          Write-Output 'GAMEFEC_LOCAL_BOUNDED_SUMMARY_PREPARED_NO_PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (env.WBD_WL_PUBLIC_MODES == 'game2-fec' || env.WBD_WL_PUBLIC_MODES == 'game4-fec')
