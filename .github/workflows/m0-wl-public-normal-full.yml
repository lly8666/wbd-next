jobs:
  # PLAN027: independent workflow_run watcher owns cancellation; do not
  # cancel from inside the target Action (that cancels its own watcher).
  wiring-contract:
    name: Cheap workflow and current assembly checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, actions: write}
    outputs:
      native_smoke: ${{ steps.native_scope.outputs.native_smoke }}
    steps:
      # Explicit separate run: workflow_run events from GITHUB_TOKEN dispatch
      # may not arm a watcher. workflow_dispatch is the supported exception.
      - name: Arm independent Linux native deadline for this exact source Action
        if: github.event_name == 'workflow_dispatch' && inputs.public_mode != 'all'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          limit="${{ (inputs.public_mode == 'game2-fec' || inputs.public_mode == 'game4-fec') && '480' || startsWith(inputs.public_mode, 'game') && '720' || '1200' }}"
          gh workflow run m0-plan027-independent-native-deadline.yml --repo "$GH_REPO" --ref main \
            -f target_run_id="$GITHUB_RUN_ID" -f target_sha="$GITHUB_SHA" \
            -f target_job_limit="$limit"
          echo "M0_SEPARATE_NATIVE_DEADLINE_ARMED exact_run=$GITHUB_RUN_ID"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      # Native OS/WSL2 smoke runs only for affected low-level network code.
      # DNS/config/pure policy pushes still run the cheap cross-platform gates.
      # A missing or unresolvable base is conservative: run the smoke.
      - name: Decide whether this SOURCE needs real native OS smoke
        id: native_scope
        shell: bash
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BEFORE: ${{ github.event.before }}
          CHANGE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$CHANGE_EVENT" == 'workflow_dispatch' ]]; then
            echo native_smoke=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CHANGE_BEFORE:-}" || "$CHANGE_BEFORE" =~ ^0+$ ]]; then
            echo native_smoke=true >> "$GITHUB_OUTPUT"
