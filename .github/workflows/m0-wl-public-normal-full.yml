          if($env:WBD_WL_ABBA_NATIVE -eq '1'){
            $abba=Get-Content result/wl-public/wl-native-abba/summary.json -Raw | ConvertFrom-Json
            if($abba.type -ne 'SAME_RUNNER_RUST_NATIVE_ABBA' -or
               $abba.order -ne 'ABBA' -or @($abba.legs).Count -ne 4){
              throw 'Missing real same Windows runner Rust NativeOwner ABBA'
            }
            Write-Output ('WL_REAL_SAME_WINDOWS_RUNNER_ABBA_DECISION '+$abba.decision.decision)
          }
          if($env:WBD_WL_V2_SCENARIO -and $env:WBD_WL_PERF_AB -ne '1' -and $env:WBD_WL_ABBA_NATIVE -ne '1'){
            $v2Config=Get-Content $env:WBD_WL_V2_SCENARIO -Raw | ConvertFrom-Json
            $modeForScenario=if($v2Config.public_mode){$v2Config.public_mode}else{'normal'}
            if($modeForScenario -ne $env:WBD_WL_PUBLIC_MODES){
              throw 'V2 real mode must equal committed scenario public_mode'
            }
            if($env:WBD_WL_V2_SCENARIO -like 'scenarios/wl-outer-repair-*.json' -and $modeForScenario -eq 'normal'){
              # Intentional netem damage: 99.9% app delivery is not a valid
              # hard gate. Verify actual tc drops, offered rate, Rust Stop
              # and accepted/uncertain outer R/F, R/total, R/C instead.
              & python tools/m0_wl_outer_repair_verify.py --scenario $env:WBD_WL_V2_SCENARIO --mode-root result/wl-public/mode-results/normal --out result/wl-public/outer-repair-verdict.json
              if($LASTEXITCODE -ne 0){throw 'Windows Rust native outer repair: scoped budget, coverage or capacity FAIL'}
            }else{
              $real=$result.WL_V2
              if($real.status -ne 'MEASURED_BOTH_OS_KERNEL' -or
                 $real.owned_stop -ne 'PASS_BOTH_OWNED'){
                throw 'Rust V2 real kernel measurement or owned Stop not proven'
              }
              # A deliberately damaged FEC/Game netem profile is not a 0-loss
              # Normal trial. Require genuine positive first-arrival each way;
              # the existing per-mode report checks true TLS/UDP/TCP/Stop.
              # Keep the historical >=99.9% gate for loss=0 unchanged.
              $damaged=($v2Config.windows_to_linux.loss_pct -gt 0 -or
                        $v2Config.linux_to_windows.loss_pct -gt 0)
              if($damaged){
                if($real.first_delivery_fraction.windows -le 0 -or
                   $real.first_delivery_fraction.linux -le 0){
                  throw 'damaged V2 mode had no authentic first-delivery in one direction'
                }
              } elseif($real.first_delivery_fraction.windows -lt 0.999 -or
                       $real.first_delivery_fraction.linux -lt 0.999){
                throw 'clean V2 native first delivery below existing 99.9 percent gate'
              }
            }
          }
          if($env:WBD_WL_PERF_AB -eq '1'){
            if($result.WL_V2_AB -ne 'COMPARABLE_OBSERVATION_NOT_PRODUCT_QUALIFICATION'){
              throw 'real same VM V2 old Go/Rust A/B not comparable or no owned Stop'
            }
          }
          if($env:WBD_WL_PUBLIC_MODES -eq 'auto-adaptive'){
            if($result.mode -ne 'auto-adaptive' -or
               $result.mode_public -ne 'PASS_ACTUAL_WINDOWS_LINUX_NATIVE_auto-adaptive' -or
               $result.auto_adaptive_applied -ne $true -or
               $result.auto_adaptive_native_revision -lt 2 -or
               $result.auto_adaptive_native_profile -ge 5 -or
               $result.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $result.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $result.stop -ne 'PASS_BOTH_OWNED'){
              throw 'native original M2 2s/8s shared Linux Auto naturally applied grade, both-OS UDP/TCP or owned Stop missing'
            }
            Write-Output 'WL_ACTUAL_AUTO_NATURAL_SHARED_POLICY_GRADE_NATIVE_TWO_OS_AND_STOP_PASS'
          } elseif($env:WBD_WL_PUBLIC_MODES -eq 'auto-revision'){
            if($result.mode -ne 'auto-revision' -or
               $result.mode_public -ne 'PASS_ACTUAL_WINDOWS_LINUX_NATIVE_auto-revision' -or
               $result.auto_revision_applied -ne $true -or
               $result.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $result.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $result.stop -ne 'PASS_BOTH_OWNED'){
              throw 'actual Windows original M2 Auto revision2 native both-OS delivery/Stop proof missing'
            }
            Write-Output 'WL_ACTUAL_AUTO_REVISION2_NATIVE_TWO_OS_AND_STOP_PASS'
          } elseif($env:WBD_WL_PUBLIC_MODES -ne 'all' -and $env:WBD_WL_ABBA_NATIVE -ne '1') {
            if($result.mode -ne $env:WBD_WL_PUBLIC_MODES -or
               $result.mode_public -ne ('PASS_ACTUAL_WINDOWS_LINUX_NATIVE_'+$env:WBD_WL_PUBLIC_MODES) -or
               $result.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $result.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $result.stop -ne 'PASS_BOTH_OWNED'){
              throw 'selected same-SOURCE native public mode lacks actual two-OS UDP/TCP/Stop proof'
            }
          } elseif($env:WBD_WL_ABBA_NATIVE -ne '1' -and $result.normal_public -ne 'PASS_ACTUAL_WINDOWS_LINUX_NATIVE'){
            throw 'real public original Normal product proof not emitted'
          }
          if($env:WBD_WL_RUN_N0 -eq '1' -and
             $result.WL_N0 -notlike 'PASS_SCOPED_*'){
            throw 'one-mode native N0 throughput/TC/delivery measured FAIL; functional startup cannot qualify performance'
          }
          if($env:WBD_WL_RUN_P200 -eq '1' -and
             $result.WL_P200 -notlike 'PASS_SCOPED_*'){
            throw 'P200 true kernel impairment reached capacity limit, missing delivery, or failed owned Stop'
          }
          } finally {
            Set-Content -Path $watchdogDone -Value 'owner-finished'
            if($null -ne $guard -and -not $guard.HasExited){Stop-Process -Id $guard.Id -Force -ErrorAction SilentlyContinue}
            Write-Output 'WL_WSL2_OUTER_WATCHDOG_DISARMED'
          }
      - name: Restore Linux raw FakeTCP fixture RST rule after product Stop
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          if(Test-Path result/wl-public/linux-rst-rule-owned.flag){
            & wsl.exe -d Ubuntu -u root -- iptables -D OUTPUT -p tcp --tcp-flags RST RST --sport 443:446 -j DROP
            if($LASTEXITCODE -ne 0){throw 'owned real WSL2 Linux RST rule removal failed'}
            Write-Output 'WL_REAL_LINUX_RST_OWNED_RULE_REMOVED'
          }else{Write-Output 'WL_REAL_LINUX_RST_RULE_NOT_INSTALLED_SKIP_CLEANUP'}
      - name: Remove exact owned WSL HyperV per-flow rule after full public product Stop
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='WBD-M0-WL-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT
          $installed=Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue
          if($null -ne $installed){
            $cid=[string]$installed.VMCreatorId
            $known=@(Get-NetFirewallHyperVVMCreator -ErrorAction Stop | Where-Object {$_.FriendlyName -eq 'WSL'})
            if($known.Count -ne 1 -or [string]$known[0].VMCreatorId -ne $cid){throw 'foreign HyperV VM creator refused cleanup'}
            Remove-NetFirewallHyperVRule -Name $name -ErrorAction Stop
            if(Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue){throw 'owned WSL HyperV per-flow rule remains installed'}
            Write-Output 'WL_REAL_WSL_HYPERV_TCP443_EXACT_OWNER_REMOVED'
          }else{Write-Output 'WL_REAL_WSL_HYPERV_RULE_NOT_CREATED_SKIP_CLEANUP'}
      - name: Delete only exact owned WSL2 guest MAC neighbor after public Stop
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='result/wl-public/native-wsl-neighbor-owner.json'
          if(Test-Path $path){
            $owned=Get-Content $path -Raw | ConvertFrom-Json
            if($owned.owner -ne ('WBD-M0-WL-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)){throw 'foreign guest neighbor refused cleanup'}
            & netsh.exe interface ipv4 delete neighbors "name=$($owned.interface_index)" "address=$($owned.guest_ip)"
            if($LASTEXITCODE -ne 0){throw 'real WSL guest neighbor cleanup failed'}
            Write-Output 'WL_REAL_GUEST_MAC_NEIGHBOR_OWNER_CLEARED'
          }else{Write-Output 'WL_GUEST_MAC_NEIGHBOR_NOT_CREATED'}
      - name: Restore Npcap owned Windows kernel service after product Stop
        if: always()
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          & ./tools/m0_wl_npcap_driver_ci.ps1 -Action Cleanup 2>&1 |
            Tee-Object result/wl-public/npcap-cleanup.log
          $result=Get-Content result/wl-public/npcap-cleanup.log -Raw
          if(-not ($result.Contains('WBD_NPCAP_DRIVER_CI_CLEANUP_PASS') -or $result.Contains('WBD_NPCAP_DRIVER_CI_CLEANUP_SKIP reason=no_state'))){throw 'Npcap owned cleanup unverified'}
          if(Get-Service npcap -ErrorAction SilentlyContinue){throw 'Npcap native driver still installed'}
      - name: Report only public business source result, not native scoped success
        if: always()
        shell: pwsh
        run: |
          if(Test-Path result/wl-public/report.json){Get-Content result/wl-public/report.json}
          else {Write-Output 'WL_PUBLIC_WINDOWS_LINUX_NORMAL_OFF=NOT_RUN_OR_FAILED_BEFORE_START'}
          if(Test-Path result/wl-public/report.json){Write-Output ('WL_N0='+$result.WL_N0)}
          Write-Output 'WL_N1_N5=NOT_RUN'
