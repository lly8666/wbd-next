            if($LASTEXITCODE -ne 0){throw 'PLAN028 two Windows native owner slot regression FAIL'}
            & ../result/client.test.exe '-test.run=^TestM0PLAN028(NativeWindowsIPv4CallbackCoalescer|NativeWindowsOnlyPhysicalNICSourceIPv4|WindowsIPv4NlMtuMIBRowABI|GameNativeCanceledTickNeverMasqueradesAsMTUDrift|WindowsOwnedWSLMTUShrinkNeverAllowsForeignOrSourceRebind)$' '-test.count=1' '-test.v'
            if($LASTEXITCODE -ne 0){throw 'PLAN028 actual selected Windows physical NIC MTU-only notification/fail-closed owner contract failed'}
