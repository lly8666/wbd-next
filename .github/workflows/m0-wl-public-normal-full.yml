plan028-600-clean-runner-control:
    name: H1453 clean Windows Runner 750s no VPN control
    needs: [wiring-contract, linux-source-locked-public]
    if: github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan028-win-linux-600]') && needs.wiring-contract.result == 'success' && needs.linux-source-locked-public.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 17
    permissions: {contents: read}
    steps:
      - name: Clean Windows 750s Runner heartbeat without VPN or WSL
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force plan028-600-clean-runner | Out-Null
          $watch=[Diagnostics.Stopwatch]::StartNew()
          $count=0
          Write-Output 'H1453_CLEAN_WINDOWS_RUNNER_750S_BEGIN no_wintun=1 no_wsl=1'
          while($watch.Elapsed.TotalSeconds -lt 750){
            $elapsed=[Math]::Round($watch.Elapsed.TotalSeconds,1)
            $workers=@(Get-Process -Name 'Runner.Worker' -ErrorAction SilentlyContinue).Count
            $item=[ordered]@{elapsed_s=$elapsed;worker_processes=$workers;source=$env:GITHUB_SHA}
            $count++
            Write-Output ('H1453_CLEAN_RUNNER_ALIVE '+($item|ConvertTo-Json -Compress))
            Start-Sleep -Seconds 15
          }
          @{"status"="PASS_SCOPED_CONTROL_ONLY";"observations"=$count;"elapsed_s"=[Math]::Round($watch.Elapsed.TotalSeconds,1);"source"=$env:GITHUB_SHA}|ConvertTo-Json|Set-Content plan028-600-clean-runner/report.json
          if($watch.Elapsed.TotalSeconds -lt 750){throw 'CLEAN_RUNNER_SHORT_DURATION'}
          Write-Output 'H1453_CLEAN_RUNNER_750S_PASS_NOT_VPN_PRODUCT'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1453-clean-windows-control-${{ github.run_id }}
          path: plan028-600-clean-runner/
          retention-days: 30
          if-no-files-found: warn

  plan028-600-external-linux-witness:
    name: H1453 independent Ubuntu control-plane metadata witness
    needs: [wiring-contract, linux-source-locked-public]
    if: github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan028-win-linux-600]') && needs.wiring-contract.result == 'success' && needs.linux-source-locked-public.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Off-host SOURCE-locked native and clean control job metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plan028-600-ubuntu-witness
          initial="$(timeout 15s gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID")"
          if [[ "$(jq -r .head_sha <<<"$initial")" != "$GITHUB_SHA" ]]; then
            echo SOURCE_MISMATCH_REFUSE >&2
            exit 2
          fi
          jq -cn --arg run "$GITHUB_RUN_ID" --arg source "$GITHUB_SHA" \
            '{schema:"plan028-h1453-external-gh-status/v1",target_run_id:$run,source_sha:$source,product:"NOT_MEASURED",native_qualification:"NOT_QUALIFIED"}' \
            >plan028-600-ubuntu-witness/identity.json
          for i in $(seq 1 95); do
            stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if ! statuses="$(timeout 15s gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" 2>/dev/null)"; then
              printf '{"time":"%s","jobs":"API_UNAVAILABLE"}\n' "$stamp" >>plan028-600-ubuntu-witness/samples.jsonl
              sleep 15
              continue
            fi
            jq -cn --arg timestamp "$stamp" --argjson jobs "$statuses" \
              '{time:$timestamp,watched:[$jobs.jobs[]|select(.name=="native-public-two-os" or .name=="H1453 clean Windows Runner 750s no VPN control")|{name,id,status,conclusion,started_at,completed_at,latest_step:([.steps[]?|{name,status,conclusion}]|last)}],product:"UNKNOWN_NOT_OBSERVED"}' \
              >>plan028-600-ubuntu-witness/samples.jsonl
            native="$(jq -r '[.jobs[]|select(.name=="native-public-two-os")|.status]|first // "missing"' <<<"$statuses")"
            clean="$(jq -r '[.jobs[]|select(.name=="H1453 clean Windows Runner 750s no VPN control")|.status]|first // "missing"' <<<"$statuses")"
            echo "H1453_OFFHOST_GH_STATE tick=$i native=$native clean=$clean"
            if [[ "$native" == completed && "$clean" == completed ]]; then
              break
            fi
            sleep 15
          done
          echo H1453_OFFHOST_METADATA_ONLY_NOT_NATIVE_APP_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1453-linux-control-witness-${{ github.run_id }}
          path: plan028-600-ubuntu-witness/
          retention-days: 30
          if-no-files-found: warn

