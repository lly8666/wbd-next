          import hashlib,json,os,pathlib
          p=pathlib.Path('result/wl-public')
          m=json.loads((p/'windows-binary-manifest.json').read_text())
          assert m['source_sha']==os.environ['WBD_WL_BINARY_SOURCE']
          assert m['features']=='m0_v4_embedded_go,fec2_product_record'
          for name,key in [('wbd-client-embedded.exe','exe'),('wbd_engine.dll','dll')]:
              b=(p/name).read_bytes()
              assert len(b)>100000 and hashlib.sha256(b).hexdigest()==m['sha256'][key]
