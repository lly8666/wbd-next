jobs:
  wiring-contract:
    name: Cheap workflow and current assembly checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python -m pip install PyYAML==6.0.2
      - run: python tools/check_workflows.py
      - run: python -m unittest tests.test_delivery_ci -v
      - run: python -m unittest tests.test_m0_wl_mode_evidence -v
