      - name: Restore exact prebuilt Windows EXE/DLL (no rebuild)
        if: env.WBD_WL_REUSE_RUN_ID != '' && env.WBD_WL_ABBA_NATIVE != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $id=$env:WBD_WL_REUSE_RUN_ID
          $sha=$env:WBD_WL_BINARY_SOURCE
          if($id -notmatch '^[1-9][0-9]{5,16}$' -or $sha -notmatch '^[0-9a-f]{40}$'){throw 'invalid run or SHA selector'}
