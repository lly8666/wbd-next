name: M0 Windows Linux original native whole-wiring capability and functional entry
run-name: M0-WIN-LINUX-WIRING-REAL-NATIVE-SOURCE
on:
  push:
    branches: [main, fix/m0-windows-functional-wiring-20261026, integration/w168-freeze-windows-adapter-20261026]
    paths:
      - .github/workflows/m0-wl-public-normal-full.yml
      - tools/m0_wl_public_normal_e2e.py
      - tools/m0_wl_netem.py
      - tools/m0_wl_public_rate_app.py
      - tools/m0_wl_real_wsl2_guest_probe.py
      - tools/m0_wl_public_native_wire_trace.py
      - r0/go_overlay/cmd/wbd-client/m0_native_v4_windows.go
      - r0/go_overlay/cmd/wbd-client/m0_native_v4_peer_windows.go
      - r0/go_overlay/cmd/wbd-client/m0_windows_v4_mode_selection.go
      - r0/go_overlay/cmd/wbd-client/m0_windows_v4_mode_selection_test.go
      - r0/go_overlay/cmd/wbd-client/m0_windows_v4_native_capabilities_windows_test.go
      - r0/go_overlay/internal/realityfront/bridge_v4_windows_private_owner.go
      - r0/go_overlay/internal/realityfront/bridge_v4_windows_scoped_client.go
      - r0/go_overlay/internal/realityfront/bridge_v4_windows_fixed_stream.go
      - r0/go_overlay/internal/realityfront/bridge_v4_windows_fec2_owner.go
      - crates/wbd-engine/src/v4_windows_fec2_owner.rs
      - crates/wbd-engine/src/v4_fixed_stream.rs
      - crates/wbd-engine/src/v4_windows_owner.rs
      - crates/wbd-engine/src/v4_owner_crypto.rs
      - crates/wbd-engine/src/v4_embedded_go.rs
      - r0/go_overlay/internal/realityfront/bridge_v4_embedded_linux.go
      - r0/go_overlay/internal/realityfront/bridge_v4_linux_server_product.go
      - r0/go_overlay/internal/realityfront/bridge_v4_linux_client_product.go
      - r0/go_overlay/internal/v4productcli/linux.go
      - r0/go_overlay/assembly/manifest-plan020-m0.json
      - tools/m0_wl_public_native_npf_trace.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  linux-source-locked-public:
    name: Build true original Go and new Linux Rust peer persona from same SOURCE
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      GO_SRC: a7a82db31fe736ffedee330795a3234d358f1984
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Compile source-pinned actual original-Go TLS and Rust M4 Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C legacy rev-parse HEAD)" = "$GO_SRC"
          mkdir -p linux-product legacy/internal/v4productcli legacy/cmd/wbd-v4-server legacy/cmd/wbd-v4-client
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record
          # W168 Go/Linux public TUN + outer policy requires two precise
          # original-Go FakeTCP adapters, already source-locked and exercised
          # by freeze's tools/arm64_public_go_rust_bundle.sh. The legacy Go
          # repository remains pinned/immutable; patch only this Actions copy.
          mkdir -p legacy/internal/faketcp
          cp r0/go_overlay/internal/faketcp/public_v4_mss.go legacy/internal/faketcp/public_v4_mss.go
          cp r0/go_overlay/internal/faketcp/raw_detached_data_linux.go legacy/internal/faketcp/raw_detached_data_linux.go
          cp r0/go_overlay/internal/faketcp/raw_detached_data_linux_test.go legacy/internal/faketcp/raw_detached_data_linux_test.go
          python3 - <<'PY'
          from pathlib import Path
          patches={
              'association.go':[('MSS: DefaultMSS, MSSSet: true,','MSS: PublicV4AdvertisedMSS(), MSSSet: true,',1)],
              'client_association.go':[('MSS: DefaultMSS, MSSSet: true,','MSS: PublicV4AdvertisedMSS(), MSSSet: true,',1)],
              'packet.go':[
                  ('s.MSSSet && s.MSS == DefaultMSS &&','s.MSSSet && s.MSS == PublicV4AdvertisedMSS() &&',1),
                  ('binary.BigEndian.PutUint16(o[2:4], DefaultMSS)','binary.BigEndian.PutUint16(o[2:4], PublicV4AdvertisedMSS())',2),
              ],
          }
          for name,changes in patches.items():
              p=Path('legacy/internal/faketcp')/name
              raw=p.read_text()
              for find,replace,expected in changes:
                  actual=raw.count(find)
                  if actual!=expected:raise RuntimeError(f'frozen W168 source mismatch {name}: {find!r} expected={expected} actual={actual}')
                  raw=raw.replace(find,replace)
              p.write_text(raw)
          PY
          # The private original-Go credential logic remains pinned; only
          # new V4 named overlay files from the identical checkout are added.
          for f in r0/go_overlay/internal/realityfront/*.go; do
            dst="legacy/internal/realityfront/$(basename "$f")"
            test ! -e "$dst" || { echo "refused overwrite of original Go: $dst" >&2; exit 1; }
            cp "$f" "$dst"
          done
          cp r0/go_overlay/internal/v4productcli/*.go legacy/internal/v4productcli/
          cp r0/go_overlay/cmd/wbd-v4-client/main.go legacy/cmd/wbd-v4-client/
          cp r0/go_overlay/cmd/wbd-v4-server/main.go legacy/cmd/wbd-v4-server/
          (cd legacy && go test ./internal/faketcp -run TestDetachedDataKernelFilterPreservesHandshakeAndControl -count=1)
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/linux-product/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/linux-product/wbd-v4-server" ./cmd/wbd-v4-server)
          cp target/release/libwbd_engine.so linux-product/libwbd_engine.so
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('linux-product')
          names=('wbd-v4-client','wbd-v4-server','libwbd_engine.so')
          checks={n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in names}
          assert all((p/n).stat().st_size>100000 for n in names)
          (p/'manifest.json').write_text(json.dumps({
              'schema_version':1,'source_sha':os.environ['GITHUB_SHA'],
              'original_go_sha':os.environ['GO_SRC'],'sha256':checks,
              'go':'1.23.12','rust':'1.85.1',
              'peer_persona':'selected_only_after_original_credential_TLS',
              'binary_qualification':'BUILD_ONLY_NOT_PRODUCT'
          },indent=2)+'\n')
          print('M0_PLAN024_NEW_LINUX_ORIGINAL_GO_RUST_PEER_PERSONA_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-plan024-linux-product
          path: linux-product/
          retention-days: 30

  native-public-two-os:
    needs: [linux-source-locked-public]
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
      GH_TOKEN: ${{ github.token }}
      GO_SRC: a7a82db31fe736ffedee330795a3234d358f1984
      LINUX_BINARY_SRC: ${{ github.sha }}
      WBD_WL_RUN_N0: ${{ github.ref == 'refs/heads/main' && '1' || '0' }} # main full gate preserved; isolated wiring branch functional only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Assemble exact original Go plus source-locked M0 Windows WAL and WinForms
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path result | Out-Null
          @'
          import pathlib,json,subprocess,os,hashlib
          root=pathlib.Path.cwd()
          main=os.environ["GITHUB_SHA"]
          original="a7a82db31fe736ffedee330795a3234d358f1984"
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==main
          assert subprocess.check_output(["git","-C","legacy","rev-parse","HEAD"],text=True).strip()==original
          spec=json.loads((root/"r0/go_overlay/assembly/manifest-plan020-m0.json").read_text(encoding="utf8"))
          assert spec["legacy_source"]==original
          def gitblob(data):return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          for op in spec["operations"]:
              if op["kind"]=="replace":
                  content=subprocess.check_output(["git","-C","legacy","show",original+":"+op["path"]])
                  assert gitblob(content)==op["original_blob"],op["path"]
                  destination=root/"legacy"/op["path"]
                  assert destination.is_file()
                  destination.write_bytes(content)
              if op.get("overlay_path"):
                  content=subprocess.check_output(["git","show",main+":"+op["overlay_path"]])
                  assert gitblob(content)==op["result_blob"],op["overlay_path"]
                  destination=root/op["overlay_path"]
                  assert destination.is_file()
                  destination.write_bytes(content)
          print("M0_PLAN020_WIN_WAL_ORIGINAL_GO_PINNED")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'exact original / M0 Git bytes mismatch'}
          & python r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt result/assembly.json
          if ($LASTEXITCODE -ne 0) {throw 'exact original Windows assembly FAIL'}
      - name: Compile linked ORIGINAL credential Go Rust + signed Wintun five-stage OS WAL production packages
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,pathlib,subprocess,hashlib
          root=pathlib.Path.cwd()
          sha=os.environ["GITHUB_SHA"]
          # The frozen M4/Go assembly is already exact SOURCE verified.
          # Copy ONLY the extra original Go credential-TLS Rust bridge
          # necessary for the new M0 host-WFP WAL production package;
          # no mock adapters, no original bytes overwritten.
          for part,names in (
            ("realityfront",(
              "admission_v4.go",
              "bridge_v4_windows_private_owner.go",
              "bridge_v4_windows_game_group.go",
              "bridge_v4_windows_game_server_group.go",
              "bridge_v4_windows_fec2_owner.go",
              "bridge_v4_windows_fixed_stream.go",
              "bridge_v4_windows_wintun_lease.go",
              "bridge_v4_windows_scoped_client.go",
            )),
            ("windowsownerlease",(
              "created_wintun_windows.go",
              "scoped_original_tls_native_wintun_windows.go",
            )),
          ):
              dest=root/"legacy"/"internal"/part
              dest.mkdir(parents=True,exist_ok=True)
              for name in names:
                  relative="r0/go_overlay/internal/"+part+"/"+name
                  target=dest/name
                  assert not target.exists(), "frozen Go/M4 has an existing competing owner: "+relative
                  raw=subprocess.check_output(["git","show",sha+":"+relative])
                  assert len(raw)>60
                  if name=="admission_v4.go":
                      assert b"package realityfront" in raw
                  else:
                      assert raw.startswith(b"//go:build windows"),relative
                  target.write_bytes(raw)
          # The actual M0 product service and native kernel ring are
          # supplied by the SAME manifest-plan020-m0.json assembly, not
          # copied from another source/branch.
          assert (root/"legacy/internal/windowsownerlease/original_tls_native_product_windows.go").is_file()
          assert (root/"legacy/internal/windowsclient/native_real_product_service_windows.go").is_file()
          assert (root/"legacy/internal/windowsclient/native_udp_kernel_driver_windows.go").is_file()
          print("M0_PLAN020_ORIGINAL_TLS_RUST_TO_NATIVE_HOST_WAL_BUNDLE_EXACT_SAME_SOURCE")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'full native Go/V4 Rust source-locked assembly FAIL'}
          Push-Location legacy
          try {
            & go build -tags wbd_v4_embedded_go ./internal/windowsownerlease
            if ($LASTEXITCODE -ne 0) {throw 'actual Go TLS Rust Wintun to 5-stage WAL owner integration package build FAIL'}
            & go build -trimpath -tags wbd_v4_embedded_go -o ../result/wbd-client-embedded.exe ./cmd/wbd-client
            if ($LASTEXITCODE -ne 0) {throw 'actual original-Go native CLI fails to link Rust and Windows WAL packages'}
          } finally {Pop-Location}
          Write-Output 'M0_PLAN020_ORIGINAL_TLS_RUST_SIGNED_WINTUN_NATIVE_OS_PRODUCT_SERVICE_LINKED_GO_BUILD_PASS'
      - name: Build actual original Windows Rust M1 M2 M3 release DLL
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'Rust 1.85.1 toolchain missing'}
          rustup target add x86_64-pc-windows-msvc --toolchain 1.85.1
          if($LASTEXITCODE -ne 0){throw 'actual Windows MSVC target missing'}
          & cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_embedded_go,fec2_product_record
          if($LASTEXITCODE -ne 0){throw 'actual Windows Rust M2 production library build failed'}
          New-Item -ItemType Directory -Force result/wl-public | Out-Null
          # Native Rust-only regression: a too-short reverse-M2 draft buffer
          # cannot burn one PN/TCP span and silently misalign original Go.
          # Whole native M1/M2/M3/FEC2/Game-owner module regressions as
          # one bounded suite. Do not promote isolated Fixed6 samples or
          # run a dedicated profile6 public Windows/Linux sequence.
          & cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,fec2_product_record --lib v4_windows_owner -- --test-threads=1 --nocapture
          if($LASTEXITCODE -ne 0){throw 'Windows native original owner full-module functional regression FAIL'}
          Copy-Item target/release/wbd_engine.dll result/wl-public/wbd_engine.dll
          Copy-Item result/wbd-client-embedded.exe result/wl-public/wbd-client-embedded.exe
      - name: Verify Windows bound authenticated RX high-water without false TCP ACK
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $env:WBD_M0_TEST_NATIVE_V4_DLL=(Resolve-Path result/wl-public/wbd_engine.dll).Path
          try {
            Push-Location legacy
            try {
              & go test -count=1 -tags wbd_v4_embedded_go -run '^TestM0PLAN(023WindowsNativeV4FiveModes|024WindowsNativeWholeProductCapabilityGate|024AuthenticatedHighWater)' ./cmd/wbd-client
              if($LASTEXITCODE -ne 0){throw 'native original-Go selected modes / actual Rust DLL public-capability and M3 RX regression FAIL'}
            } finally {Pop-Location}
          } finally {Remove-Item Env:WBD_M0_TEST_NATIVE_V4_DLL -ErrorAction SilentlyContinue}
          Write-Output 'WL_PUBLIC_NATIVE_ORIGINAL_OWNER_EFFECTIVE_MODE_GATE_PASS_SCOPED'
      - name: Full public-run signed original Npcap and Wintun driver install
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'wl-public-real'
          $drv=Join-Path $root 'npcap'
          $usr=Join-Path $root 'user'
          New-Item -ItemType Directory -Force $root,$drv,$usr,result/wl-public | Out-Null
          $zip=Join-Path $root 'npcap-test.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/user-attachments/files/32200327/npcap.zip' -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6380ebe6d5b06bbb0dc03a43151ee05a4a25be97efebd742c463e0e466621a32'){throw 'approved old driver package hash changed'}
          Expand-Archive $zip $drv -Force
          $installer=Join-Path $root 'npcap-1.88.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://npcap.com/dist/npcap-1.88.exe' -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2f4ec1e5ea353ff67efd24b2ebf081ba44532410fae8d5e146af0310aa4f56b'){throw 'official Npcap hash changed'}
          $sg=Get-AuthenticodeSignature $installer
          if($sg.Status -ne 'Valid' -or $sg.SignerCertificate.Subject -notmatch 'Nmap Software LLC'){throw 'official Npcap invalid signature'}
          & 7z x -y "-o$usr" $installer | Out-File result/wl-public/npcap-extract.log
          if($LASTEXITCODE -ne 0){throw 'Npcap DLL extraction failed'}
          & ./tools/m0_wl_npcap_driver_ci.ps1 -Action Install -DriverPackageDir $drv -UserlandExtractDir $usr 2>&1 |
            Tee-Object result/wl-public/npcap-install.log
          if((Get-Service npcap -ErrorAction Stop).Status -ne 'Running'){throw 'Npcap real kernel service not running'}
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/wpcap.dll" -Destination result/wl-public/wpcap.dll
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/Packet.dll" -Destination result/wl-public/Packet.dll
          $wzip=Join-Path $root 'wintun.zip'
          $wdir=Join-Path $root 'wintun'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $wzip
          if((Get-FileHash $wzip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'){throw 'official Wintun archive hash changed'}
          Expand-Archive $wzip $wdir -Force
          $dll=Join-Path $wdir 'wintun/bin/amd64/wintun.dll'
          if((Get-AuthenticodeSignature $dll).Status -ne 'Valid'){throw 'official Wintun DLL unsigned'}
          Copy-Item $dll result/wl-public/wintun.dll
      - name: Restore SAME-RUN new original Go Linux Rust binary with exact SHA checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force linux-product | Out-Null
          & gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name m0-plan024-linux-product --dir linux-product
          if($LASTEXITCODE -ne 0){throw 'actual same-SOURCE original Linux build artifact missing'}
          @'
          import hashlib,json,pathlib,os
          p=pathlib.Path("linux-product")
          m=json.loads((p/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"]==os.environ["LINUX_BINARY_SRC"]
          assert m["original_go_sha"]==os.environ["GO_SRC"]
          assert m["binary_qualification"]=="BUILD_ONLY_NOT_PRODUCT"
          for name in ("wbd-v4-server","wbd-v4-client","libwbd_engine.so"):
              f=p/name
              assert f.is_file() and f.stat().st_size>100000
              assert hashlib.sha256(f.read_bytes()).hexdigest()==m["sha256"][name]
          print("WL_NEW_LINUX_ORIGINAL_GO_RUST_SOURCE_MATCH_VERIFIED")
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'new exact Linux Go/Rust binary integrity failed'}
      - name: Launch actual WSL2 Linux and direct full public two-OS product
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference='Stop'
          $known=((& wsl.exe --list --quiet 2>&1 | Out-String) -replace '[\x00]','')
          if($known -notmatch 'Ubuntu'){
            # Old WSL Store/network launcher hung until the full product
            # step timed out. Import real Ubuntu 24.04.5 WSL rootfs directly
            # from Ubuntu's official release, pinning its published digest.
            # This remains a genuine Ubuntu WSL2 guest/kernel, never a mock.
            $img=Join-Path $env:RUNNER_TEMP 'ubuntu-24.04.5-wsl-amd64.tar'
            $vm=Join-Path $env:RUNNER_TEMP 'wbd-real-ubuntu-wsl2'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://releases.ubuntu.com/noble/ubuntu-24.04.5-wsl-amd64.wsl' -OutFile $img
            if((Get-FileHash $img -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bb415d824822c4b878125729af451a5d18fb13d1cf5cbed9a7393ad64ac6039e'){throw 'official Ubuntu WSL image integrity mismatch'}
            New-Item -ItemType Directory -Force $vm | Out-Null
            & wsl.exe --import Ubuntu $vm $img --version 2 2>&1 |
              Tee-Object result/wl-public/wsl-import.log
            if($LASTEXITCODE -ne 0){throw 'actual Ubuntu WSL2 distribution import failed'}
            $installed=((& wsl.exe --list --quiet 2>&1 | Out-String) -replace '[\x00]','')
            if($installed -notmatch 'Ubuntu'){throw 'real Ubuntu WSL2 distribution not registered after import'}
            Write-Output 'WL_REAL_PINNED_UBUNTU_24045_WSL2_IMPORTED'
          }
          # One real Linux-kernel preflight, now bounded: past SOURCE bdf574
          # imported Ubuntu but its first guest command hung until 22m timeout.
          # A failed precondition is ENVIRONMENT_BLOCKED, not product FAIL.
          & python tools/m0_wl_real_wsl2_guest_probe.py
          if($LASTEXITCODE -ne 0){throw 'real WSL2 native guest boot ENVIRONMENT_BLOCKED; see bounded probe JSON'}
          & wsl.exe -d Ubuntu -u root -- sh -c 'command -v iptables >/dev/null || (apt-get update -qq && apt-get install -y -qq iptables)'
          if($LASTEXITCODE -ne 0){throw 'Linux kernel underlay RST control unavailable'}
          & wsl.exe -d Ubuntu -u root -- iptables -I OUTPUT 1 -p tcp --tcp-flags RST RST --sport 443 -j DROP
          if($LASTEXITCODE -ne 0){throw 'real Linux original FakeTCP RST suppression unavailable'}
          'owned' | Set-Content result/wl-public/linux-rst-rule-owned.flag
          # Observed genuine source 1445e2c: Windows WSL NPF sees TCP SYN,
          # Linux eth0 does not. Admit only this host->WSL raw product flow
          # across WSL's actual Hyper-V firewall; never change default policy.
          $creator=@(Get-NetFirewallHyperVVMCreator -ErrorAction Stop |
            Where-Object {$_.FriendlyName -eq 'WSL'})
          if($creator.Count -ne 1){throw 'exact WSL HyperV firewall VM creator unavailable'}
          $guestText=(& wsl.exe -d Ubuntu -u root -- ip -4 -o addr show dev eth0 | Out-String)
          $match=[regex]::Match($guestText,'\binet\s+(\d{1,3}(?:\.\d{1,3}){3})/')
          if(-not $match.Success){throw 'actual WSL2 guest eth0 address missing'}
          $guestIP=$match.Groups[1].Value
          $nic=@(Get-NetAdapter -IncludeHidden -ErrorAction Stop |
            Where-Object {$_.Name -match '^vEthernet \(WSL' -and $_.Status -eq 'Up'})
          if($nic.Count -ne 1){throw 'WSL2 vEthernet owner ambiguous'}
          $source=@(Get-NetIPAddress -AddressFamily IPv4 -InterfaceIndex $nic[0].InterfaceIndex -ErrorAction Stop |
            Where-Object {$_.IPAddress -notmatch '^169\.254\.'})
          if($source.Count -ne 1){throw 'host WSL2 source address ambiguous'}
          $ruleName='WBD-M0-WL-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT
          if(Get-NetFirewallHyperVRule -Name $ruleName -ErrorAction SilentlyContinue){throw 'foreign same-name WSL hyperv rule'}
          New-NetFirewallHyperVRule -Name $ruleName -DisplayName $ruleName -Direction Inbound -Action Allow -Enabled True -Profiles Any -VMCreatorId $creator[0].VMCreatorId -Protocol TCP -LocalAddresses $guestIP -RemoteAddresses $source[0].IPAddress -LocalPorts 443 -RemotePorts 41031 -ErrorAction Stop | Out-Null
          $live=Get-NetFirewallHyperVRule -Name $ruleName -ErrorAction Stop
          if($null -eq $live -or $live.Direction -ne 'Inbound' -or $live.Action -ne 'Allow'){throw 'original WSL HyperV per-flow rule not actually installed'}
          [ordered]@{name=$ruleName;creator_id=[string]$creator[0].VMCreatorId;linux_guest=$guestIP;windows_host=$source[0].IPAddress;server_tcp_port=443;client_tcp_port=41031;scope='OWNED_SINGLE_WSL2_ORIGINAL_NPCAP_PRODUCT_FLOW'} |
            ConvertTo-Json | Set-Content result/wl-public/hyperv-rule.json
          Write-Output 'WL_REAL_WSL_HYPERV_TCP443_EXACT_OWNER_ALLOW_INSTALLED'
          # Real NPF header showed original product SYN destination MAC equals
          # Windows vEthernet own source MAC. Resolve ONLY this actual WSL2
          # Linux eth0 MAC, never fabricate an IP/TLS/ACK or replace Npcap.
          $guestLink=(& wsl.exe -d Ubuntu -u root -- ip -j link show dev eth0 | ConvertFrom-Json)
          $guestMAC=[string]$guestLink.address
          $hostMAC=([string]$nic[0].MacAddress).Replace('-',':')
          if(@($guestMAC.Split(':')).Count -ne 6 -or $guestMAC -eq $hostMAC){throw 'actual WSL2 guest Ethernet MAC invalid or same as Windows host'}
          $existing=@(Get-NetNeighbor -AddressFamily IPv4 -InterfaceIndex $nic[0].InterfaceIndex -IPAddress $guestIP -ErrorAction SilentlyContinue)
          if(@($existing|Where-Object {$_.State -eq 'Permanent'}).Count -gt 0){throw 'foreign WSL neighbor present, refusing overwrite'}
          [ordered]@{owner=$ruleName;interface_index=$nic[0].InterfaceIndex;guest_ip=$guestIP;guest_mac=$guestMAC;source_host_mac=$hostMAC} |
            ConvertTo-Json | Set-Content result/wl-public/native-wsl-neighbor-owner.json
          & netsh.exe interface ipv4 set neighbors "interface=$($nic[0].InterfaceIndex)" "address=$guestIP" "neighbor=$($guestMAC.Replace(':','-'))" "store=active"
          if($LASTEXITCODE -ne 0){throw 'native WSL2 exact Linux eth0 neighbor install failed'}
          $entry=@(Get-NetNeighbor -AddressFamily IPv4 -InterfaceIndex $nic[0].InterfaceIndex -IPAddress $guestIP -ErrorAction Stop)
          if($entry.Count -ne 1 -or $entry[0].LinkLayerAddress.Replace('-',':') -ne $guestMAC){throw 'real WSL2 guest neighbor MAC readback mismatch'}
          Write-Output ('WL_REAL_GUEST_MAC_NEIGHBOR_BOUND mac='+$guestMAC)
          # Pass only the exact MAC already read from ACTUAL Linux eth0 and
          # verified by Windows NetNeighbor into this public Go/Npcap child.
          # SendARP alone returned the host self MAC (proven wrong SYN L2).
          $env:WBD_PLAN024_NATIVE_VERIFIED_GUEST_MAC=$guestMAC
          $env:WBD_PLAN024_NATIVE_VERIFIED_GUEST_IP4=$guestIP
          $env:WBD_PLAN024_NATIVE_VERIFIED_HOST_IP4=[string]$source[0].IPAddress
          $env:WBD_PLAN024_NATIVE_VERIFIED_IFINDEX=[string]$nic[0].InterfaceIndex
          Write-Output 'WL_REAL_ORIGINAL_GO_SCOPED_LINUX_GUEST_MAC_FFI_HANDOFF_ARMED'
          # Functional TCP test uses a genuine Windows TCP listener on the
          # created Wintun's 10.66.0.2:45902. Windows host firewall may
          # independently deny new inbound SYNs even when authenticated Rust
          # M3 delivered the packet. Admit ONLY Linux TUN 10.66.0.1 to this
          # single testing listener; NEVER disable global firewall/WFP.
          # The rule is owned by this exact run and deleted in finally.
          $tcpRuleName='WBD-M0-WL-TCP-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT
          if(Get-NetFirewallRule -Name $tcpRuleName -ErrorAction SilentlyContinue){throw 'foreign scoped TCP listener firewall rule'}
          New-NetFirewallRule -Name $tcpRuleName -DisplayName $tcpRuleName -Direction Inbound -Action Allow -Enabled True -Profile Any -Protocol TCP -LocalAddress '10.66.0.2' -RemoteAddress '10.66.0.1' -LocalPort 45902 -ErrorAction Stop | Out-Null
          $tcpRule=Get-NetFirewallRule -Name $tcpRuleName -ErrorAction Stop
          $tcpPort=Get-NetFirewallPortFilter -AssociatedNetFirewallRule $tcpRule -ErrorAction Stop
          $tcpIP=Get-NetFirewallAddressFilter -AssociatedNetFirewallRule $tcpRule -ErrorAction Stop
          if($tcpRule.Action -ne 'Allow' -or $tcpRule.Direction -ne 'Inbound' -or
             [string]$tcpPort.LocalPort -ne '45902' -or [string]$tcpPort.Protocol -notin @('TCP','6') -or
             [string]$tcpIP.LocalAddress -ne '10.66.0.2' -or [string]$tcpIP.RemoteAddress -ne '10.66.0.1'){
            throw 'scoped WinTun TCP test listener firewall rule readback mismatch'
          }
          [ordered]@{name=$tcpRuleName;local='10.66.0.2';remote='10.66.0.1';port=45902;type='OWNED_FUNCTIONAL_TCP_LISTENER_NOT_PRODUCT_FIREWALL_POLICY'} |
            ConvertTo-Json | Set-Content result/wl-public/functional-tcp-firewall-owned.json
          Write-Output 'WL_REAL_WINDOWS_WINTUN_TCP_FUNCTIONAL_LISTENER_RULE_SCOPED_READBACK'
          # Passive wire witness observes THIS SAME real public handshake, never injects traffic.
          $drive=$PWD.Path.Substring(0,1).ToLowerInvariant()
          $traceScript='/mnt/'+$drive+'/'+$PWD.Path.Substring(3).Replace('\','/')+'/tools/m0_wl_public_native_wire_trace.py'
          $witness=Start-Process -FilePath wsl.exe -ArgumentList @('-d','Ubuntu','-u','root','--','python3','-u',$traceScript,'eth0') -PassThru -RedirectStandardOutput result/wl-public/native-link-tcp443.log -RedirectStandardError result/wl-public/native-link-stderr.log
          # These OS route witnesses are captured during the SAME public
          # TLS/Npcap/WSL2 product run; no synthetic sender or mock route.
          Get-NetRoute -AddressFamily IPv4 -ErrorAction Continue |
            Select-Object DestinationPrefix,InterfaceIndex,NextHop,RouteMetric |
            ConvertTo-Json -Depth 4 | Out-File result/wl-public/windows-route.json
          Get-NetAdapter -IncludeHidden -ErrorAction Continue |
            Select-Object Name,InterfaceIndex,InterfaceGuid,MacAddress,Status |
            ConvertTo-Json -Depth 4 | Out-File result/wl-public/windows-adapters.json
          & wsl.exe -d Ubuntu -u root -- ip -j -4 addr show dev eth0 |
            Out-File result/wl-public/linux-eth0.json
          $npf=Start-Process -FilePath python -ArgumentList @('-u','tools/m0_wl_public_native_npf_trace.py') -PassThru -RedirectStandardOutput result/wl-public/native-windows-npf.log -RedirectStandardError result/wl-public/native-windows-npf-stderr.log
          Start-Sleep -Milliseconds 800
          try {
            & python tools/m0_wl_public_normal_e2e.py 2>&1 |
              Tee-Object result/wl-public/direct-full.log
            $e2eExit=$LASTEXITCODE
            if($e2eExit -ne 0){throw 'real Windows-to-Linux public original Go TLS/Rust M1-M3/native I/O path failed'}
            Copy-Item result/wl-public/report.json result/wl-public/normal-report.json -Force
            # Other effective public modes remain UNWIRED/NOT_RUN until
            # they use the genuine shared Linux owner/lane/lifecycle ABI.
            # No separate Fixed6-only public Action or repeated WSL2 startup.
          } finally {
            Remove-NetFirewallRule -Name $tcpRuleName -ErrorAction Stop
            if(Get-NetFirewallRule -Name $tcpRuleName -ErrorAction SilentlyContinue){
              throw 'owned TCP test firewall rule survived scoped cleanup'
            }
            Write-Output 'WL_REAL_WINDOWS_WINTUN_TCP_FUNCTIONAL_LISTENER_RULE_REMOVED'
            foreach($p in @($witness,$npf)){
              if($null -ne $p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            }
            Get-Content result/wl-public/native-link-tcp443.log -Tail 75 -ErrorAction SilentlyContinue
            Get-Content result/wl-public/native-windows-npf.log -Tail 75 -ErrorAction SilentlyContinue
            Get-Content result/wl-public/native-windows-npf-stderr.log -Tail 15 -ErrorAction SilentlyContinue
          }
          if($e2eExit -ne 0){throw 'true public Windows Go TLS Rust Npcap Wintun to Linux raw/TUN direct chain FAILED'}
          $result=Get-Content result/wl-public/report.json -Raw | ConvertFrom-Json
          if($result.normal_public -ne 'PASS_ACTUAL_WINDOWS_LINUX_NATIVE'){throw 'real public product proof not emitted'}
      - name: Restore Linux raw FakeTCP fixture RST rule after product Stop
        if: always()
        shell: pwsh
        run: |
          if(Test-Path result/wl-public/linux-rst-rule-owned.flag){
            & wsl.exe -d Ubuntu -u root -- iptables -D OUTPUT -p tcp --tcp-flags RST RST --sport 443 -j DROP
            if($LASTEXITCODE -ne 0){throw 'owned real WSL2 Linux RST rule removal failed'}
            Write-Output 'WL_REAL_LINUX_RST_OWNED_RULE_REMOVED'
          }else{Write-Output 'WL_REAL_LINUX_RST_RULE_NOT_INSTALLED_SKIP_CLEANUP'}
      - name: Remove exact owned WSL HyperV per-flow rule after full public product Stop
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='WBD-M0-WL-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT
          $installed=Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue
          if($null -ne $installed){
            $cid=[string]$installed.VMCreatorId
            $known=@(Get-NetFirewallHyperVVMCreator -ErrorAction Stop | Where-Object {$_.FriendlyName -eq 'WSL'})
            if($known.Count -ne 1 -or [string]$known[0].VMCreatorId -ne $cid){throw 'foreign HyperV VM creator refused cleanup'}
            Remove-NetFirewallHyperVRule -Name $name -ErrorAction Stop
            if(Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue){throw 'owned WSL HyperV per-flow rule remains installed'}
            Write-Output 'WL_REAL_WSL_HYPERV_TCP443_EXACT_OWNER_REMOVED'
          }else{Write-Output 'WL_REAL_WSL_HYPERV_RULE_NOT_CREATED_SKIP_CLEANUP'}
      - name: Delete only exact owned WSL2 guest MAC neighbor after public Stop
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='result/wl-public/native-wsl-neighbor-owner.json'
          if(Test-Path $path){
            $owned=Get-Content $path -Raw | ConvertFrom-Json
            if($owned.owner -ne ('WBD-M0-WL-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)){throw 'foreign guest neighbor refused cleanup'}
            & netsh.exe interface ipv4 delete neighbors "name=$($owned.interface_index)" "address=$($owned.guest_ip)"
            if($LASTEXITCODE -ne 0){throw 'real WSL guest neighbor cleanup failed'}
            Write-Output 'WL_REAL_GUEST_MAC_NEIGHBOR_OWNER_CLEARED'
          }else{Write-Output 'WL_GUEST_MAC_NEIGHBOR_NOT_CREATED'}
      - name: Restore Npcap owned Windows kernel service after product Stop
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          & ./tools/m0_wl_npcap_driver_ci.ps1 -Action Cleanup 2>&1 |
            Tee-Object result/wl-public/npcap-cleanup.log
          $result=Get-Content result/wl-public/npcap-cleanup.log -Raw
          if(-not ($result.Contains('WBD_NPCAP_DRIVER_CI_CLEANUP_PASS') -or $result.Contains('WBD_NPCAP_DRIVER_CI_CLEANUP_SKIP reason=no_state'))){throw 'Npcap owned cleanup unverified'}
          if(Get-Service npcap -ErrorAction SilentlyContinue){throw 'Npcap native driver still installed'}
      - name: Report only public business source result, not native scoped success
        if: always()
        shell: pwsh
        run: |
          if(Test-Path result/wl-public/report.json){Get-Content result/wl-public/report.json}
          else {Write-Output 'WL_PUBLIC_WINDOWS_LINUX_NORMAL_OFF=NOT_RUN_OR_FAILED_BEFORE_START'}
          if(Test-Path result/wl-public/report.json){Write-Output ('WL_N0='+$result.WL_N0)}
          Write-Output 'WL_N1_N5=NOT_RUN'
