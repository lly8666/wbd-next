              -f "public_mode=$mode" -f "perf_scenario_file=$scene" \
              -f "outer_repair=$policy" -f perf_reuse_run_id=41415722303 \
              -f perf_binary_source_sha=6693910f879f9e55e77dd823c1b05d8942321929
            echo "PLAN027_BATCH2_QUEUED fixture_source=$GITHUB_SHA product_source=6693910f879f9e55e77dd823c1b05d8942321929 mode=$mode outer=$policy scene=$scene status=DISPATCHED_NOT_PASS"
          done
      - name: Dispatch Game4 protected 20M highloss OFF scoped capacity
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-game4-20m30-off]')
        shell: bash
