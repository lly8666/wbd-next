    needs: [wiring-contract]
    if: (!contains(github.event.head_commit.message, '[plan028-win-tls-reuse]')) && inputs.perf_reuse_run_id == '' && !contains(github.event.head_commit.message, '[plan026-coding]') && !(contains(github.event.head_commit.message, '[plan026-rust-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-reuse-100]') || contains(github.event.head_commit.message, '[plan026-rust-rxbuf-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-cpu-reuse-150]') || contains(github.event.head_commit.message, '[plan026-win-npf-abba-150]')) && !(github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan029-v3-real-p2-mixed]')) && !(github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan029-v3-real-p1-reuse]'))
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Parse original runner-management lease before native Windows drivers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null
          $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tools/m0_wl_gamefec_management_route.ps1).Path,
            [ref]$tokens,[ref]$parseErrors) | Out-Null
          if(@($parseErrors).Count -gt 0){
            $parseErrors | ForEach-Object { Write-Output ('RUNNER_MGMT_SYNTAX '+$_.Message) }
            throw 'Original runner management lease PS1 syntax invalid before signed native driver setup'
          }
          Write-Output 'PLAN027_H893_RUNNER_MANAGEMENT_POWERSHELL_PARSE_PASS'
      - name: Prepare the same source used by full native qualification
        run: python tools/prepare_windows_wiring.py
      - name: Compile production and test callers before Rust DLL and drivers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location legacy
          try {
            & go test -tags wbd_v4_embedded_go ./internal/faketcp -run 'TestV4PublicSYNAndSYNACKRealEncodedOptionsAndFrozenRetries|TestV4LocalMSSRejectsInvalid' -count=1 -v
            if($LASTEXITCODE -ne 0){throw 'original Go actual encoded SYN/SYNACK MSS byte test FAIL'}
            & go build -tags wbd_v4_embedded_go ./internal/windowsownerlease
            if($LASTEXITCODE -ne 0){throw 'Windows production compile preflight FAIL'}
            & go build -trimpath -tags wbd_v4_embedded_go -o ../result/wbd-client-embedded.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'Windows public client compile preflight FAIL'}
            & go test -c -tags wbd_v4_embedded_go -o ../result/client.test.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'Windows client TEST compile preflight FAIL'}
            & go test -c -tags wbd_v4_embedded_go -o ../result/realityfront.test.exe ./internal/realityfront
            if($LASTEXITCODE -ne 0){throw 'Windows bridge TEST compile preflight FAIL'}
            # H1545: compile signed Windows owner/M4 and two-Wintun tests,
            # do not auto-run device-requiring tests on a shared runner.
            & go test -c -tags wbd_v4_embedded_go -o ../result/windowsownerlease.test.exe ./internal/windowsownerlease
            if($LASTEXITCODE -ne 0){throw 'Windows original owner TLS/Game/Wintun test compile FAIL'}
            & go test -c -tags wbd_v4_embedded_go -o ../result/windowsclient.test.exe ./internal/windowsclient
            if($LASTEXITCODE -ne 0){throw 'Windows two signed Wintun native test compile FAIL'}
            # Execute the already-compiled original Go shared controller,
            # no second build, signed driver, WSL or Normal full-path run.
            & ../result/realityfront.test.exe '-test.run=TestF2ControlAutoPendingM2CannotEvaluateOrStackNativeRevisions' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'Linux shared Auto pending-original-M2 functional regression FAIL'}
            & go test -count=1 -tags wbd_v4_embedded_go -run '^TestNpcapNativeGameColdRead' ./internal/faketcp
            if($LASTEXITCODE -ne 0){throw 'native Game NPF cold idle/EOF regression FAIL'}
            & ../result/client.test.exe '-test.run=^TestM0PLAN027WindowsNativeAuthDeadOnlyAfterOriginalRustHealth$' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'Windows authenticated-dead vs driver status classification FAIL'}
            & ../result/client.test.exe '-test.run=^TestM0PLAN028WindowsPhysicalPath' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'PLAN028 native Windows route/IP coalescing and physical path fingerprint FAIL'}
            # H1518: native Windows five CI-only owner slots, real named kernel events.
            & ../result/client.test.exe '-test.run=^TestPLAN028H1515FiveOriginalWindowsNativeDeviceSlots' '-test.count=1' '-test.v'
            if($LASTEXITCODE -ne 0){throw 'PLAN028 five distinct native Windows owned event slots failed'}
