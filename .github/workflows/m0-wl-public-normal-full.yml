                throw 'PLAN028 prior original Windows source4 restore not verified'
              }
              Write-Output 'H1530_FIVE_NATIVE_SOURCE4_ALREADY_RESTORED_BY_EXACT_CHILD'
            }else{
              & ./tools/m0-plan028-win-wsl-product-owned-alias.ps1 -Action Restore -Receipt $owned
              if(-not $?){throw 'PLAN028 exact owned WSL2 source4 restore failed'}
            }
          } else {
            Write-Output 'PLAN028_NO_OWNED_ALIAS_PREPARED_BEFORE_FAILURE'
          }
      - name: Restore Npcap owned Windows kernel service after product Stop
        if: always()
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          & ./tools/m0_wl_npcap_driver_ci.ps1 -Action Cleanup 2>&1 |
            Tee-Object result/wl-public/npcap-cleanup.log
          $result=Get-Content result/wl-public/npcap-cleanup.log -Raw
          if(-not ($result.Contains('WBD_NPCAP_DRIVER_CI_CLEANUP_PASS') -or $result.Contains('WBD_NPCAP_DRIVER_CI_CLEANUP_SKIP reason=no_state'))){throw 'Npcap owned cleanup unverified'}
          if(Get-Service npcap -ErrorAction SilentlyContinue){throw 'Npcap native driver still installed'}
      - name: Report only public business source result, not native scoped success
        if: always()
        shell: pwsh
        run: |
          if(Test-Path result/wl-public/report.json){Get-Content result/wl-public/report.json}
          else {Write-Output 'WL_PUBLIC_WINDOWS_LINUX_NORMAL_OFF=NOT_RUN_OR_FAILED_BEFORE_START'}
          if(Test-Path result/wl-public/report.json){Write-Output ('WL_N0='+$result.WL_N0)}
          Write-Output 'WL_N1_N5=NOT_RUN'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-wl-full-public-normal-direct${{ matrix.win5_scene == 'legacy' && '' || format('-h1506-{0}-{1}',matrix.win5_scene,github.run_id) }}
          path: |
