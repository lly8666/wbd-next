          $hostInfo=Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          $v=[ordered]@{
            scope='HOSTED_NATIVE_WINDOWS_2025_VM_ONLY_NO_CROSS_VM_PERFORMANCE_NORMALIZATION'
