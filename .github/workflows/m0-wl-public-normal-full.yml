      - name: Restore only PLAN028 owned WSL2 host/guest aliases after original Stop
        if: always() && (contains(github.event.head_commit.message, '[plan028-win-physical-game4off]') || contains(github.event.head_commit.message, '[plan028-win-physical-auto]') || contains(github.event.head_commit.message, '[plan028-win-physical-fixed6]') || (contains(github.event.head_commit.message, '[plan028-win-physical-owned]') || contains(github.event.head_commit.message, '[plan028-win-physical-mtu-only]')) || contains(github.event.head_commit.message, '[plan028-win-physical-game4fec]') || contains(github.event.head_commit.message, '[plan028-h1510-win5-loss0]') || contains(github.event.head_commit.message, '[plan028-h1506-win5-600]'))
        shell: pwsh
        run: |
          $owned='result/wl-public/plan028-owned-alias.json'
          if(Test-Path -LiteralPath $owned){
            $state=Get-Content -LiteralPath $owned -Raw | ConvertFrom-Json
            if($state.stage -eq 'RESTORED'){
