              Write-Output 'PLAN029_H1783_REAL_TWO_WINDOWS_DNS_CLIENTS_ONE_PHYSICAL_CN_DNS_AND_OWNED_STOP_PASS_SCOPED'
            }
            if($env:WBD_PLAN029_REAL_DEFAULT_OUTER1460 -eq '1'){
              $m=$result.plan029_d5_real_default_outer1460
              if($m.source_sha -ne $env:GITHUB_SHA -or
                 $m.outer_arg_present -ne $false -or
                 $m.outer_selector -ne 'default1460' -or
                 $m.configured_default_outer -ne 1460 -or
                 $m.real_windows_auto_inner -ne 1389 -or
                 $m.real_linux_auto_inner -ne 1389 -or
                 $m.stop -ne 'PASS_BOTH_OWNED'){
                throw 'H1791 default outer1460 real OS and exact owner Stop unqualified'
              }
              Write-Output 'PLAN029_H1791_REAL_DEFAULT1460_TWO_OS_AUTO_INNER1389_OWNED_STOP_PASS_SCOPED'
            }
            if($env:WBD_PLAN029_APP_TCP53_SCENE -eq '1'){
              $dns=$result.plan029_d1_original_app_tcp53
              if($dns.source_sha -ne $env:GITHUB_SHA -or
                 $dns.stop -ne 'PASS_BOTH_OWNED' -or
                 $dns.windows.two_original_kernel_tcp_app_connections -ne $true -or
                 $dns.windows.direct.was_fake -ne $true -or
                 $dns.windows.tunnel.was_fake -ne $false -or
                 $dns.windows.tunnel.dns_answer_a -ne '203.0.113.77' -or
                 $dns.linux.tunnel.real_socket_local -ne '1.1.1.1' -or
                 $dns.linux.tunnel.original_client_source -ne '10.66.0.2'){
                throw 'H1794 true Windows application TCP53 direct/tunnel physical egress and owned Stop not proven'
              }
              Write-Output 'PLAN029_H1794_REAL_APP_TCP53_DIRECT_AND_TUNNEL_TWO_OS_OWNED_STOP_PASS_SCOPED'
            }
            Write-Output 'PLAN029_H1766_OUTER_SOURCE_LOCKED_DIRECT_TUNNEL_DNS_TCP_UDP_AND_STOP_PASS_SCOPED'
          } elseif($env:WBD_WL_PUBLIC_MODES -ne 'all' -and $env:WBD_WL_ABBA_NATIVE -ne '1' -and $env:WBD_PLAN028_TWO_REAL_CLIENTS -ne '1') {
            if($result.mode -ne $env:WBD_WL_PUBLIC_MODES -or
               $result.mode_public -ne ('PASS_ACTUAL_WINDOWS_LINUX_NATIVE_'+$env:WBD_WL_PUBLIC_MODES) -or
               $result.app_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_UDP' -or
               $result.tcp_duplex -ne 'PASS_ACTUAL_TWO_OS_KERNEL_TCP' -or
               $result.stop -ne 'PASS_BOTH_OWNED'){
              throw 'selected same-SOURCE native public mode lacks actual two-OS UDP/TCP/Stop proof'
            }
          } elseif($env:WBD_WL_ABBA_NATIVE -ne '1' -and $env:WBD_PLAN028_TWO_REAL_CLIENTS -ne '1' -and $result.normal_public -ne 'PASS_ACTUAL_WINDOWS_LINUX_NATIVE'){
            throw 'real public original Normal product proof not emitted'
          }
          if($env:WBD_WL_RUN_N0 -eq '1' -and
             $result.WL_N0 -notlike 'PASS_SCOPED_*'){
            throw 'one-mode native N0 throughput/TC/delivery measured FAIL; functional startup cannot qualify performance'
          }
          if($env:WBD_WL_RUN_P200 -eq '1' -and
             $result.WL_P200 -notlike 'PASS_SCOPED_*'){
            throw 'P200 true kernel impairment reached capacity limit, missing delivery, or failed owned Stop'
          }
          } finally {
            Set-Content -Path $watchdogDone -Value 'owner-finished'
            if($null -ne $guard -and -not $guard.HasExited){Stop-Process -Id $guard.Id -Force -ErrorAction SilentlyContinue}
            Write-Output 'WL_WSL2_OUTER_WATCHDOG_DISARMED'
          }
      # Native GameFEC producer may fail after changing OS default route.
      # Upload a SMALL original local summary BEFORE separate WSL/NPF cleanup.
      # The existing final full artifact still runs; a canceled parent step
      # cannot reach this step and is backed only by independent Ubuntu stages.
      - name: Prepare bounded original GameFEC first-fault evidence for early upload
        if: always() && (env.WBD_WL_PUBLIC_MODES == 'game2-fec' || env.WBD_WL_PUBLIC_MODES == 'game4-fec')
        shell: pwsh
        timeout-minutes: 1
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force result/wl-public | Out-Null
          $dest='result/wl-public/gamefec-local-first-fault-summary.txt'
          @(
            'schema=m0-gamefec-original-local-allowlisted/v1'
            'run='+$env:GITHUB_RUN_ID
            'product_source='+$env:WBD_WL_BINARY_SOURCE
            'scope=GAMEFEC_ORIGINAL_WINDOWS_LOCAL_FILES_NOT_INDEPENDENT_PRODUCT_PASS'
          ) | Set-Content -LiteralPath $dest
          foreach($role in @('client','server')){
            $path='result/wl-public/'+$role+'.log'
            if(-not (Test-Path -LiteralPath $path)){
              Add-Content $dest ($role+'_LOG_NOT_FOUND')
              continue
            }
            # Read only the tail and preserve fixed stage names / first
            # original native faults; never forward an arbitrary TLS log.
            $lines=@(Get-Content -LiteralPath $path -Tail 4096 -ErrorAction Stop)
            foreach($line in $lines){
              $line=[string]$line
              if($line -match '(?i)password|secret|credential|token|private[_-]?key'){continue}
              if($line -match 'M0_GAME_COLD_STAGE [A-Z0-9_]+|M0_PLAN026_GAME_NATIVE_FIRST_ERROR|M0_PLAN027_GAME_(DUE_FAULT|NATIVE_STOP_)|M0_PLAN027_NATIVE_STOP_RESULT|WBD_WINDOWS_GAME_COLD_TLS_JOINED|WBD_WINDOWS_OS_APPLIED|WBD_WINDOWS_CLIENT_READY|V4_ORIGINAL_GO_GAME_NATIVE_READY|V4_PUBLIC_GAME_NATIVE_STOP_DRAINED'){
                Add-Content -LiteralPath $dest -Value ($role+':'+$line.Substring(0,[Math]::Min(350,$line.Length)))
              }
            }
          }
          Write-Output 'GAMEFEC_LOCAL_BOUNDED_SUMMARY_PREPARED_NO_PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (env.WBD_WL_PUBLIC_MODES == 'game2-fec' || env.WBD_WL_PUBLIC_MODES == 'game4-fec')
        with:
          name: gamefec-native-local-early-evidence
          path: |
            result/wl-public/gamefec-local-first-fault-summary.txt
            result/wl-public/gamefec-network-final.txt
            result/wl-public/gamefec-supervisor-stack.txt
            result/wl-public/gamefec-mode-stack.txt
            result/wl-public/gamefec-e2e-stack.txt
            result/wl-public/gamefec-supervisor-timeout.txt
            result/wl-public/gamefec-mode-outcome.txt
            result/wl-public/gamefec-cold-stage.txt
            result/wl-public/windows-route-after.json
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
      - name: Restore Linux raw FakeTCP fixture RST rule after product Stop
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          if(Test-Path result/wl-public/linux-rst-rule-owned.flag){
            & wsl.exe -d Ubuntu -u root -- iptables -D OUTPUT -p tcp --tcp-flags RST RST --sport 443:446 -j DROP
            if($LASTEXITCODE -ne 0){throw 'owned real WSL2 Linux RST rule removal failed'}
            Write-Output 'WL_REAL_LINUX_RST_OWNED_RULE_REMOVED'
          }else{Write-Output 'WL_REAL_LINUX_RST_RULE_NOT_INSTALLED_SKIP_CLEANUP'}
      - name: Remove exact owned WSL HyperV per-flow rule after full public product Stop
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='WBD-M0-WL-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT
          $installed=Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue
          if($null -ne $installed){
            $cid=[string]$installed.VMCreatorId
            $known=@(Get-NetFirewallHyperVVMCreator -ErrorAction Stop | Where-Object {$_.FriendlyName -eq 'WSL'})
            if($known.Count -ne 1 -or [string]$known[0].VMCreatorId -ne $cid){throw 'foreign HyperV VM creator refused cleanup'}
            Remove-NetFirewallHyperVRule -Name $name -ErrorAction Stop
            if(Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue){throw 'owned WSL HyperV per-flow rule remains installed'}
            Write-Output 'WL_REAL_WSL_HYPERV_TCP443_EXACT_OWNER_REMOVED'
          }else{Write-Output 'WL_REAL_WSL_HYPERV_RULE_NOT_CREATED_SKIP_CLEANUP'}
      - name: Remove only exact owned PLAN029 guest TCP46112 HyperV rule after product Stop
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='WBD-M0-WL-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'-P029-TCP46112'
          $rule=Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue
          if($null -ne $rule){
            $receipt='result/wl-public/hyperv-direct-tcp-owned.json'
            if(-not (Test-Path $receipt)){throw 'unreceipted PLAN029 guest TCP rule; refuse removal'}
            $owned=Get-Content $receipt -Raw | ConvertFrom-Json
            $known=@(Get-NetFirewallHyperVVMCreator -ErrorAction Stop | Where-Object {$_.FriendlyName -eq 'WSL'})
            if($owned.name -ne $name -or $owned.port -ne 46112 -or
               $known.Count -ne 1 -or [string]$known[0].VMCreatorId -ne $owned.creator_id -or
               [string]$rule.VMCreatorId -ne $owned.creator_id -or
               [string]$rule.LocalPorts -ne '46112' -or
               [string]$rule.LocalAddresses -ne $owned.local_ip -or
               [string]$rule.RemoteAddresses -ne $owned.remote_ip){
              throw 'foreign PLAN029 WSL TCP46112 rule; no broad cleanup'
            }
            Remove-NetFirewallHyperVRule -Name $name -ErrorAction Stop
            if(Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue){
              throw 'PLAN029 owned TCP46112 rule still installed'
            }
            Write-Output 'PLAN029_H1762_GUEST_TCP46112_HYPERV_EXACT_OWNER_REMOVED'
