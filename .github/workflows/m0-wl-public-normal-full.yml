        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          # One native measurement Action per scene, independent VM and Stop.
