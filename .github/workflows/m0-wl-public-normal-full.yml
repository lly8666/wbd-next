            if($LASTEXITCODE -ne 0){throw 'PLAN028 actual selected Windows physical NIC MTU-only notification/fail-closed owner contract failed'}
            & ../result/client.test.exe '-test.run=^TestM0PLAN026GameColdHandoffQueueNeverBlocksRustJoin$' '-test.count=1'
