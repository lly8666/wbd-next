            -f perf_reuse_run_id=41415722303 \
            -f perf_binary_source_sha=6693910f879f9e55e77dd823c1b05d8942321929
          echo "PLAN027_GAME4_20M30_OFF_QUEUED product_source=6693910f879f9e55e77dd823c1b05d8942321929 fixture_source=$GITHUB_SHA status=DISPATCHED_NOT_PASS"
      - name: Dispatch PLAN027 four independent next-gap original Windows native scenes
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-batch3]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
