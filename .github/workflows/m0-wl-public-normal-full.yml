          if($null -ne $rule){
            if(-not (Test-Path $receipt)){throw 'unreceipted H1794 rule; refuse foreign cleanup'}
            $owned=Get-Content $receipt -Raw | ConvertFrom-Json
            $known=@(Get-NetFirewallHyperVVMCreator -ErrorAction Stop | Where-Object {$_.FriendlyName -eq 'WSL'})
            if($owned.name -ne $name -or $owned.port -ne 53 -or
               $owned.state -notin @('INTENT','OWNED') -or
               $known.Count -ne 1 -or [string]$known[0].VMCreatorId -ne $owned.creator_id -or
               [string]$rule.VMCreatorId -ne $owned.creator_id -or
               [string]$rule.LocalPorts -ne '53' -or
               [string]$rule.LocalAddresses -ne $owned.local_ip -or
               [string]$rule.RemoteAddresses -ne $owned.remote_ip -or
               $rule.Action -ne 'Allow' -or $rule.Direction -ne 'Inbound'){
              throw 'foreign H1794 rule identity, refuse unrelated removal'
            }
            Remove-NetFirewallHyperVRule -Name $name -ErrorAction Stop
            if(Get-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue){
              throw 'H1794 owned DNS TCP53 HyperV rule still present'
            }
            Write-Output 'PLAN029_H1794_EXACT_TCP53_PHYSICAL_RULE_RECOVERED'
          }else{Write-Output 'PLAN029_H1794_NO_OWNED_GUEST_TCP53_RULE'}
      - name: Delete only exact owned WSL2 guest MAC neighbor after public Stop
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='result/wl-public/native-wsl-neighbor-owner.json'
          if(Test-Path $path){
            $owned=Get-Content $path -Raw | ConvertFrom-Json
            if($owned.owner -ne ('WBD-M0-WL-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)){throw 'foreign guest neighbor refused cleanup'}
            & netsh.exe interface ipv4 delete neighbors "name=$($owned.interface_index)" "address=$($owned.guest_ip)"
            if($LASTEXITCODE -ne 0){throw 'real WSL guest neighbor cleanup failed'}
