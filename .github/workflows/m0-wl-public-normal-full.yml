jobs:
  # PLAN027: independent workflow_run watcher owns cancellation; do not
  # cancel from inside the target Action (that cancels its own watcher).
  wiring-contract:
    name: Cheap workflow and current assembly checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, actions: write}
    steps:
      # Explicit separate run: workflow_run events from GITHUB_TOKEN dispatch
      # may not arm a watcher. workflow_dispatch is the supported exception.
      - name: Arm independent Linux native deadline for this exact source Action
        if: github.event_name == 'workflow_dispatch' && inputs.public_mode != 'all'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          limit="${{ (inputs.public_mode == 'game2-fec' || inputs.public_mode == 'game4-fec') && '480' || startsWith(inputs.public_mode, 'game') && '720' || '1200' }}"
          gh workflow run m0-plan027-independent-native-deadline.yml --repo "$GH_REPO" --ref main \
            -f target_run_id="$GITHUB_RUN_ID" -f target_sha="$GITHUB_SHA" \
            -f target_job_limit="$limit"
          echo "M0_SEPARATE_NATIVE_DEADLINE_ARMED exact_run=$GITHUB_RUN_ID"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      # Opt-in, once per source-tagged commit; no unattended native matrix.
      # Manual workflow_dispatch produces its own independent native deadline
      # watcher. This job owns only dispatch, never manufactures test PASS.
      - name: Dispatch original source-locked Game FEC and Game outer weaknet
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[m0-real-game-fec]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA" || { echo "Ref moved, skip unsafe cross-source dispatch"; exit 1; }
          for row in \
            "game2-fec:scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json" \
            "game4-fec:scenarios/wl-game4-fixed6-10m-75ms-loss15-20s.json" \
            "game2:scenarios/plan027-c-game2-off-10m-250ms-loss30-60s.json"; do
            mode="${row%%:*}"; scenario="${row#*:}"
            test -f "$scenario"
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f "public_mode=$mode" -f "perf_scenario_file=$scenario"
            echo "M0_PLAN027_ORIGINAL_NATIVE_DISPATCH source=$GITHUB_SHA mode=$mode scene=$scenario status=DISPATCHED_NOT_PASS"
          done
      - name: Dispatch PLAN027 frozen binary ON integration (one Action per scenario)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-on-batch1]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA" || { echo "New main source, refuse nonfrozen test dispatch"; exit 1; }
          # H908 genuinely completed 105s IFB native+TLS+WAL on both OS.
          # The three scoped Actions reuse the SAME signed product binaries,
          # while fixture Git SHA and scenario SHA are separately frozen.
          source=6693910f879f9e55e77dd823c1b05d8942321929
          reused_run=41415722303
          for row in \
            "game4-fec:scenarios/plan027-h911-game4fec6-on-10m-250ms30-60s.json" \
            "normal:scenarios/plan027-h911-normal-on-100m-25ms0-60s.json" \
            "fixed:scenarios/plan027-h911-fixed-on-10m-250ms30-60s.json"; do
            mode="${row%%:*}"; scene="${row#*:}"
            test -f "$scene"
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f "public_mode=$mode" -f "perf_scenario_file=$scene" \
              -f "outer_repair=on" -f "perf_reuse_run_id=$reused_run" \
              -f "perf_binary_source_sha=$source"
            echo "PLAN027_ON_BATCH1_QUEUED product_source=$source fixture_source=$GITHUB_SHA mode=$mode scenario=$scene status=DISPATCHED_NOT_PASS"
          done
      - name: Dispatch Normal100 same-VM sequential OFF ON with H908 signed products
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-pair100]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA" || { echo 'ref moved before pair dispatch'; exit 1; }
          scenario=scenarios/plan027-h913-normal-pair-100m-25ms0-60s.json
          test -f "$scenario"
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f "perf_scenario_file=$scenario" \
            -f outer_repair=on -f outer_pair=true -f perf_reuse_run_id=41415722303 \
            -f perf_binary_source_sha=6693910f879f9e55e77dd823c1b05d8942321929
          echo "PLAN027_PAIR100_QUEUED fixture_source=$GITHUB_SHA product_source=6693910f879f9e55e77dd823c1b05d8942321929 same_vm_sequential=1 status=DISPATCHED_NOT_PASS"
      - name: Dispatch PLAN027 phase2 Auto Game2 ON and Game4 20M OFF
