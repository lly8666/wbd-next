          # External vendor/CDN 504s must not be interpreted as native
          # Npcap/Wintun product failures. Retry only byte downloads; exact
          # pinned SHA256 plus original Authenticode checks remain unchanged.
          function Get-PinnedPublicNativeDriverPackage([string]$Uri,[string]$Destination){
            for($attempt=1;$attempt -le 5;$attempt++){
              try {
                Invoke-WebRequest -UseBasicParsing -Uri $Uri -OutFile $Destination -TimeoutSec 65 -ErrorAction Stop
                if(-not (Test-Path -LiteralPath $Destination)){throw 'signed package download absent'}
                return
              }catch{
                Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
                Write-Output ('PLAN028_EXTERNAL_SIGNED_DRIVER_DOWNLOAD_RETRY attempt='+$attempt+' status='+$_.Exception.GetType().Name)
                if($attempt -eq 5){throw}
                Start-Sleep -Seconds ([Math]::Min(24,4*$attempt))
              }
            }
          }
          Get-PinnedPublicNativeDriverPackage 'https://github.com/user-attachments/files/32200327/npcap.zip' $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6380ebe6d5b06bbb0dc03a43151ee05a4a25be97efebd742c463e0e466621a32'){throw 'approved old driver package hash changed'}
          Expand-Archive $zip $drv -Force
          $installer=Join-Path $root 'npcap-1.88.exe'
          Get-PinnedPublicNativeDriverPackage 'https://npcap.com/dist/npcap-1.88.exe' $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2f4ec1e5ea353ff67efd24b2ebf081ba44532410fae8d5e146af0310aa4f56b'){throw 'official Npcap hash changed'}
          $sg=Get-AuthenticodeSignature $installer
          if($sg.Status -ne 'Valid' -or $sg.SignerCertificate.Subject -notmatch 'Nmap Software LLC'){throw 'official Npcap invalid signature'}
          & 7z x -y "-o$usr" $installer | Out-File result/wl-public/npcap-extract.log
          if($LASTEXITCODE -ne 0){throw 'Npcap DLL extraction failed'}
          & ./tools/m0_wl_npcap_driver_ci.ps1 -Action Install -DriverPackageDir $drv -UserlandExtractDir $usr 2>&1 |
            Tee-Object result/wl-public/npcap-install.log
          if((Get-Service npcap -ErrorAction Stop).Status -ne 'Running'){throw 'Npcap real kernel service not running'}
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/wpcap.dll" -Destination result/wl-public/wpcap.dll
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/Packet.dll" -Destination result/wl-public/Packet.dll
          $wzip=Join-Path $root 'wintun.zip'
          $wdir=Join-Path $root 'wintun'
          Get-PinnedPublicNativeDriverPackage 'https://www.wintun.net/builds/wintun-0.14.1.zip' $wzip
          if((Get-FileHash $wzip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'){throw 'official Wintun archive hash changed'}
