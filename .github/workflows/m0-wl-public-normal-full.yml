      - run: python -m unittest tests.test_m0_wl_native_os_deadline -v
      - run: python -m unittest tests.test_m0_wl_native_step_runner -v
      - run: python -m unittest tests.test_m0_wl_scoped_game2_trigger -v
      - run: python -m unittest tests.test_m0_wl_outer_repair_verify -v
      - run: python -m unittest tests.test_m0_wl_lock_profile -v
      - run: python tools/prepare_windows_wiring.py --check-only
      # [plan026-game2-historical-order] restores the historically working
      # Normal/Fixed/Auto/Game2 test conditions without full seven-mode fanout.
      # [plan026-game2-only] is an EXPLICIT main commit scoped qualification:
      # only Game2, never seven-mode fanout, still true original Go TLS and owned Stop.
      - name: Enforce functional seven modes or exactly one scoped N0 before any native build
        env:
          PUBLIC_MODE: ${{ github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan026-game2-historical-order]') && 'through-game2' || github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan026-game2-only]') && 'game2' || github.ref_name == 'main' && (contains(github.event.head_commit.message, '[plan025-n0-240s]') || contains(github.event.head_commit.message, '[plan026-stress-p200-250m-30p]') || contains(github.event.head_commit.message, '[plan026-normal-only]') || contains(github.event.head_commit.message, '[plan026-ab-150]') || (contains(github.event.head_commit.message, '[plan026-rust-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-reuse-100]') || contains(github.event.head_commit.message, '[plan026-rust-rxbuf-100]') || contains(github.event.head_commit.message, '[plan026-rust-rxbuf-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-cpu-reuse-150]') || (contains(github.event.head_commit.message, '[plan026-win-wake-150]') || contains(github.event.head_commit.message, '[plan026-win-outer-repair-matrix]')) || contains(github.event.head_commit.message, '[plan026-win-npf-borrow-150]') || contains(github.event.head_commit.message, '[plan026-win-npf-abba-150]'))) && 'normal' || inputs.public_mode || 'all' }}
          RUN_N0: ${{ github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan025-n0-240s]') && '1' || inputs.run_n0 == true && '1' || '0' }}
          RUN_P200: ${{ github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan026-stress-p200-250m-30p]') && '1' || '0' }}
          WL_V2_SCENARIO: ${{ github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan026-win-outer-repair-matrix]') && 'scenarios/wl-outer-repair-50m-300ms-loss30-60s.json' || github.ref_name == 'main' && (contains(github.event.head_commit.message, '[plan026-ab-150]') || (contains(github.event.head_commit.message, '[plan026-rust-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-reuse-100]') || contains(github.event.head_commit.message, '[plan026-rust-rxbuf-100]') || contains(github.event.head_commit.message, '[plan026-rust-rxbuf-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-cpu-reuse-150]') || (contains(github.event.head_commit.message, '[plan026-win-wake-150]') || contains(github.event.head_commit.message, '[plan026-win-outer-repair-matrix]')) || contains(github.event.head_commit.message, '[plan026-win-npf-borrow-150]') || contains(github.event.head_commit.message, '[plan026-win-npf-abba-150]'))) && ((contains(github.event.head_commit.message, '[plan026-rust-reuse-100]') || contains(github.event.head_commit.message, '[plan026-rust-rxbuf-100]')) && 'scenarios/wl-normal-100m-300ms-0loss-60s.json' || 'scenarios/wl-normal-150m-300ms-0loss-60s.json') || inputs.perf_scenario_file || '' }}
          WL_V2_REUSE_RUN: ${{ github.ref_name == 'main' && (contains(github.event.head_commit.message, '[plan026-rust-rxbuf-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-cpu-reuse-150]')) && '40681039919' || github.ref_name == 'main' && (contains(github.event.head_commit.message, '[plan026-rust-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-reuse-100]')) && '40668581343' || inputs.perf_reuse_run_id || '' }}
          WL_V2_BINARY_SHA: ${{ github.ref_name == 'main' && (contains(github.event.head_commit.message, '[plan026-rust-rxbuf-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-cpu-reuse-150]')) && '0abd1b04ee7a39d8aa426963564a079523c1036a' || github.ref_name == 'main' && (contains(github.event.head_commit.message, '[plan026-rust-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-reuse-100]')) && '0543b805ca25d804ccd131be6686b0b99f61f80f' || inputs.perf_binary_source_sha || '' }}
          WL_V2_AB: ${{ github.ref_name == 'main' && contains(github.event.head_commit.message, '[plan026-ab-150]') && '1' || inputs.perf_ab == true && '1' || '0' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from tools.m0_wl_mode_evidence import select_source_locked_modes
          v2=os.environ.get('WL_V2_SCENARIO','').strip()
          ab=os.environ.get('WL_V2_AB','0')=='1'
          modes=select_source_locked_modes(os.environ['PUBLIC_MODE'],os.environ['RUN_N0']=='1' or os.environ['RUN_P200']=='1' or bool(v2) or ab)
          if v2:
              from pathlib import Path
              from tools.m0_wl_perf_v2_config import read_scenario
              resolved=(Path.cwd()/v2).resolve()
              if resolved.parent!=(Path.cwd()/'scenarios').resolve():
                  raise ValueError('WL_V2_REFUSE_UNCOMMITTED_OR_TRAVERSAL_PATH')
              cfg=read_scenario(resolved)
              if cfg.get('public_mode','normal')!=modes[0] or os.environ['RUN_N0']=='1' or os.environ['RUN_P200']=='1':
                  raise ValueError('WL_V2_REQUIRES_EXACT_ONE_MATCHING_MODE_AND_NO_N0_P200')
              if ab and modes!=['normal']:
                  raise ValueError('WL_V2_OLD_GO_AB_NORMAL_ONLY')
              print('WL_V2_SOURCE_LOCKED_SCENARIO',cfg['scenario_id'],cfg['scenario_sha256'])
          if ab and not v2:
              raise ValueError('WL_V2_AB_REQUIRES_SOURCE_SCENARIO')
          import re
          reuse=os.environ.get('WL_V2_REUSE_RUN','')
          binary=os.environ.get('WL_V2_BINARY_SHA','')
          if reuse:
              if not re.fullmatch(r'[1-9][0-9]{5,16}',reuse) or not re.fullmatch(r'[0-9a-f]{40}',binary):
                  raise ValueError('WL_V2_REUSE_REQUIRES_NUMERIC_RUN_AND_EXACT_BINARY_SOURCE')
              if len(modes)!=1 or os.environ['RUN_N0']=='1' or os.environ['RUN_P200']=='1':
                  raise ValueError('WL_SOURCE_REUSE_REQUIRES_ONE_MODE_NO_N0')
              if v2 and modes[0] in ('auto-revision','auto-adaptive'):
                  raise ValueError('WL_V2_REUSE_REQUIRES_SUPPORTED_PUBLIC_MODE')
              print('WL_SINGLE_MODE_PREBUILT_SOURCE',modes[0],reuse,binary)
          elif binary:
              raise ValueError('WL_V2_BINARY_SOURCE_WITHOUT_REUSE_RUN')
          print('SOURCE_LOCKED_MODE_ENTRY',','.join(modes),'N0='+os.environ['RUN_N0'],'V2_AB='+str(ab))
          PY
      - run: python -m py_compile tools/m0_wl_lock_profile.py tools/m0_wl_impairment_profile.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py tools/m0_wl_native_step_runner.py tools/m0_wl_windows_bounded_cmd.py tools/m0_wl_windows_step_watchdog.py tools/m0_wl_mode_evidence.py tools/m0_wl_business_latency.py tools/m0_wl_public_rate_app.py tools/m0_wl_n0_drop_delta.py tools/m0_wl_mode_runtime_report.py tools/m0_wl_native_mtu_contract.py tools/m0_wl_native_resource_sampler.py

  windows-compile-preflight:
    name: Windows Go production and test compilation only
    needs: [wiring-contract]
    if: inputs.perf_reuse_run_id == '' && !contains(github.event.head_commit.message, '[plan026-coding]') && !(contains(github.event.head_commit.message, '[plan026-rust-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-reuse-100]') || contains(github.event.head_commit.message, '[plan026-rust-rxbuf-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-cpu-reuse-150]') || contains(github.event.head_commit.message, '[plan026-win-npf-abba-150]'))
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Prepare the same source used by full native qualification
        run: python tools/prepare_windows_wiring.py
      - name: Compile production and test callers before Rust DLL and drivers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location legacy
          try {
            & go build -tags wbd_v4_embedded_go ./internal/windowsownerlease
            if($LASTEXITCODE -ne 0){throw 'Windows production compile preflight FAIL'}
            & go build -trimpath -tags wbd_v4_embedded_go -o ../result/wbd-client-embedded.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'Windows public client compile preflight FAIL'}
            & go test -c -tags wbd_v4_embedded_go -o ../result/client.test.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'Windows client TEST compile preflight FAIL'}
            & go test -c -tags wbd_v4_embedded_go -o ../result/realityfront.test.exe ./internal/realityfront
            if($LASTEXITCODE -ne 0){throw 'Windows bridge TEST compile preflight FAIL'}
            # Execute the already-compiled original Go shared controller,
            # no second build, signed driver, WSL or Normal full-path run.
            & ../result/realityfront.test.exe '-test.run=TestF2ControlAutoPendingM2CannotEvaluateOrStackNativeRevisions' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'Linux shared Auto pending-original-M2 functional regression FAIL'}
            & go test -count=1 -tags wbd_v4_embedded_go -run '^TestNpcapNativeGameColdRead' ./internal/faketcp
            if($LASTEXITCODE -ne 0){throw 'native Game NPF cold idle/EOF regression FAIL'}
            & ../result/client.test.exe '-test.run=^TestM0PLAN026GameColdHandoffQueueNeverBlocksRustJoin$' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'native Game cold queue overload regression FAIL'}
            & ../result/client.test.exe '-test.run=^TestM0PLAN025WindowsNativeSourceInvalidIPv4DoesNotPoisonBatch$' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'Windows pre-seal native IPv4 Wintun filtering boundary FAIL'}
            & ../result/realityfront.test.exe '-test.run=^TestM0PLAN025WindowsNativeNormalOpenFirstFaultIsBoundedAndSafe$' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'Windows original M3 authenticated IPv4 drop vs ABI fatal regression FAIL'}
            & ../result/realityfront.test.exe '-test.run=^TestM0PLAN025WindowsOriginalM2BatchPreflightClassifiesFirstRefusal$' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'Original Windows M2 NPF firstsend batch first-error provenance FAIL'}
            & ../result/realityfront.test.exe '-test.run=TestM0WindowsFEC2OpenABICodeClassificationSurvivesWrapper' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'Windows FEC2 original ABI error provenance / fail-closed regression FAIL'}
            & ../result/realityfront.test.exe '-test.run=TestM0WindowsAutoAlignedMatureCohortPreservesTrueKWindow' '-test.count=1'
            if($LASTEXITCODE -ne 0){throw 'Windows original Auto real 2s/8s actual-k cohort alignment regression FAIL'}
          } finally {Pop-Location}
          @{source=$env:GITHUB_SHA;scope='GO_COMPILE_ONLY';result='PASS';native_product='NOT_RUN'} |
            ConvertTo-Json | Set-Content result/preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-compile-preflight-${{ github.run_id }}
          path: result/*.json
          retention-days: 14
          if-no-files-found: warn
  windows-rust-contract-preflight:
    name: Windows Rust eligible library unit tests (special M1 separate)
    needs: [wiring-contract]
    if: inputs.perf_reuse_run_id == '' && !contains(github.event.head_commit.message, '[plan026-coding]') && !(contains(github.event.head_commit.message, '[plan026-rust-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-reuse-100]') || contains(github.event.head_commit.message, '[plan026-rust-rxbuf-reuse-150]') || contains(github.event.head_commit.message, '[plan026-rust-cpu-reuse-150]') || contains(github.event.head_commit.message, '[plan026-win-npf-abba-150]'))
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Windows native Rust M1/M3/FEC2 entire library unit regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
