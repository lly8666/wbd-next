name: M0 WinXDP RX dependency qualification
run-name: "M0 WinXDP v1.4 exact-flow dependency inventory | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-winxdp']
    paths: ['.github/workflows/qa-m0-winxdp-rx-dependency.yml']
permissions: {contents: read}
jobs:
  inventory:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Inspect actual Windows eBPF provider and official compatible package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force xdp-rx-evidence | Out-Null
          Get-CimInstance Win32_SystemDriver | Where-Object {$_.Name -match 'ebpf|xdp'} | Select-Object Name,State,PathName,StartMode | ConvertTo-Json -Depth 4 | Set-Content xdp-rx-evidence/inbox-drivers.json
          Get-ChildItem "$env:WINDIR/System32/drivers" -Filter '*ebpf*' | Select-Object Name,Length | ConvertTo-Json | Set-Content xdp-rx-evidence/inbox-files.json
          nuget install Microsoft.XDP-for-Windows.Sdk -Version 1.4.0 -OutputDirectory xdp-rx-packages -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'official XDP 1.4 SDK unavailable'}
          nuget install Microsoft.XDP-for-Windows.Runtime.x64 -Version 1.4.0 -OutputDirectory xdp-rx-packages -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'official XDP 1.4 runtime unavailable'}
          $msi=Join-Path $PWD 'ebpf-1.3.0.msi'
          curl.exe -fL --max-time 100 -o $msi 'https://github.com/microsoft/ebpf-for-windows/releases/download/v1.3.0/ebpf-for-windows.x64.1.3.0.msi'
          if($LASTEXITCODE -ne 0){throw 'official eBPF MSI unavailable'}
          if((Get-FileHash $msi).Hash.ToLowerInvariant() -ne '757bad9e5375a8a19204d8ae406d372bdf225790064a650942a74716ba0caf08'){throw 'official release asset identity mismatch'}
          $dest=Join-Path $PWD 'ebpf-msi-extract'
          $log=Join-Path $PWD 'xdp-rx-evidence/msi-extract.log'
          # Administrative extraction only; do not install unsigned drivers or change boot policy.
          $p=Start-Process msiexec.exe -ArgumentList @('/a',('"' + $msi + '"'),('/qn'),('TARGETDIR="' + $dest + '"'),'/l*v',('"' + $log + '"')) -Wait -PassThru
          if($p.ExitCode -ne 0){throw "MSI extraction exit $($p.ExitCode)"}
          $drivers=@(Get-ChildItem $dest,xdp-rx-packages -Recurse -File | Where-Object {$_.Extension -in '.sys','.cat'})
          $rows=@(foreach($d in $drivers){
            $sig=Get-AuthenticodeSignature $d.FullName
            [ordered]@{file=$d.Name;path=$d.FullName;status=[string]$sig.Status;signer=$sig.SignerCertificate.Subject;issuer=$sig.SignerCertificate.Issuer;sha256=(Get-FileHash $d.FullName).Hash}
          })
          ConvertTo-Json -InputObject $rows -Depth 4 | Tee-Object xdp-rx-evidence/driver-signatures.json
          if(-not $drivers.Count){throw 'no actual driver files extracted'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: winxdp-rx-dependency-inventory, path: xdp-rx-evidence/, if-no-files-found: warn, retention-days: 14}
