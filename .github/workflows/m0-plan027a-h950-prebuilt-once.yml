# H950 one-shot prebuilt qualification. This workflow only dispatches independent
# signed Windows/WSL native scenarios. It does not compile products or mark PASS.
name: M0 PLAN027A H950 prebuilt six source-scoped native scenes
run-name: "M0|PLAN027A-H950-PREBUILT-DISPATCH|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027a-h950-prebuilt-once.yml]
permissions: {contents: read, actions: write}
jobs:
  dispatch-six:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027a-h950-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FROZEN_RUN: "41452689481"
      FROZEN_SHA: "adc63a8b8af209dbe589d072403b7bceae8e038b"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify prebuilt provenance, unchanged product source, artifact names and all scenarios
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$FROZEN_RUN" --jq .head_sha)" = "$FROZEN_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$FROZEN_RUN" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$FROZEN_RUN/artifacts" \
            --jq '.artifacts[].name' > /tmp/h950-artifacts.txt
          grep -Fx "m0-wl-windows-product-binaries-$FROZEN_SHA" /tmp/h950-artifacts.txt
          grep -Fx "m0-plan024-linux-product" /tmp/h950-artifacts.txt
          git fetch --depth=1 origin "$FROZEN_SHA"
          changed="$(git diff --name-only "$FROZEN_SHA" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py)"
          test -z "$changed" || { echo "H950_PRODUCT_SHA_CHANGED $changed"; exit 1; }
          python3 -m unittest tests.test_m0_wl_native_mtu_contract -v
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          scenes = (
            ("normal","scenarios/plan027a-h950-normal-1460-3m-25ms-loss0-60s.json",3,0),
            ("game4-fec","scenarios/plan027a-h950-game4fec-1460-3m-25ms-loss0-60s.json",3,0),
            ("game4-fec","scenarios/plan027a-h950-game4fec-1460-3m-250ms-loss30-60s.json",3,30),
            ("auto","scenarios/plan027a-h950-auto-1460-10m-staged5-30-5-210s.json",10,5))
          for mode,path,rate,loss in scenes:
              s=read_scenario(path)
              assert s["public_mode"]==mode and s["tun_mtu"]==1460
              for d in ("windows_to_linux","linux_to_windows"):
                  assert s[d]["offered_mbps"]==rate and s[d]["loss_pct"]==loss
              if mode=="auto":
                  assert [p["windows_to_linux"]["loss_pct"] for p in s["impairment_stages"]]==[5,30,5]
                  assert s["duration_s"]==210
              else:
                  assert s["duration_s"]==60
              print("H950_SCENE_VERIFIED",path,s["scenario_sha256"])
          PY
          echo "H950_PREBUILT_EXACT_PRODUCTS_NO_RECOMPILE_PASS"
      - name: Dispatch six independent native Actions, each with one scene, reusing original EXE/DLL/Linux product
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          jobs=(
            'all|default1460|'
            'all|1500|'
            'normal|default1460|scenarios/plan027a-h950-normal-1460-3m-25ms-loss0-60s.json'
            'game4-fec|default1460|scenarios/plan027a-h950-game4fec-1460-3m-25ms-loss0-60s.json'
            'game4-fec|default1460|scenarios/plan027a-h950-game4fec-1460-3m-250ms-loss30-60s.json'
            'auto|default1460|scenarios/plan027a-h950-auto-1460-10m-staged5-30-5-210s.json'
          )
          for item in "${jobs[@]}"; do
            IFS='|' read -r mode outer scene <<<"$item"
            wanted="M0-WIN-LINUX|$GITHUB_SHA|$mode|${scene:-no-scene}|outer=$outer"
            prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
              jq -r --arg title "$wanted" '.workflow_runs[] | select(.display_title==$title) | .id' | head -1)"
            if [ -n "$prior" ]; then
              echo "H950_ALREADY_DISPATCHED source=$GITHUB_SHA id=$prior mode=$mode scene=${scene:-none}"
              continue
            fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f "public_mode=$mode" -f run_n0=false -f outer_repair=on \
              -f "native_outer_mtu=$outer" -f "perf_scenario_file=$scene" \
              -f "perf_reuse_run_id=$FROZEN_RUN" \
              -f "perf_binary_source_sha=$FROZEN_SHA"
            echo "H950_DISPATCHED_NOT_QUALIFIED source=$GITHUB_SHA product=$FROZEN_SHA mode=$mode scene=${scene:-none}"
          done
          echo H950_SIX_INDEPENDENT_SOURCE_EXACT_NATIVE_ACTIONS_QUEUED_NOT_PRODUCT_PASS
