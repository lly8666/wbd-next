name: H2423 loss5 BAAB
run-name: "H2423 loss5 BAAB | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-linux-tcp-splice']
    paths: ['.github/workflows/qa-h2423-loss5-baab.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: h2423-loss5-baab-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: x86_64
      H2421_SCENE: loss5
      H2421_ORDER: BAAB
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Retrieve exact SOURCE shared native build and verify hash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables iperf3 ethtool iputils-ping openssl
          bash tools/m0_h2423_fetch_build.sh
      - name: Real original WBD native routed local fixture
        shell: bash
        run: |
          mkdir -p h2423-out
          cp h2423-build-identity.json h2423-out/
          lscpu >h2423-out/lscpu.txt
          uname -a >h2423-out/uname.txt
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" H2421_SCENE="$H2421_SCENE" H2421_ORDER="$H2421_ORDER" H2421_OUT=h2423-out python3 -u tools/m0_h2421_splice_local.py
      - name: Preserve only owned readable evidence, not installation identities
        if: always()
        shell: bash
        run: |
          if test -d h2423-out;then
            sudo find h2423-out -type f -name install -delete
            sudo chown -R "$(id -u):$(id -g)" h2423-out
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2423-loss5-baab-${{ env.WBD_PLAN029_LINUX_EXPECTED_ARCH }}
          path: h2423-out/
          retention-days: 14
