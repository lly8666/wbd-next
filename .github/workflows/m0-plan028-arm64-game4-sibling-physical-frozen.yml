name: M0 PLAN028 native ARM64 Game4 fixed6 two protected groups source4 switch, frozen
run-name: PLAN028 native ARM64 Game4 FEC6 Bob continuous while Alice physical source4 changes ${{ github.sha }}
on:
  push:
    branches: [main]
    paths: [".github/workflows/m0-plan028-arm64-game4-sibling-physical-frozen.yml"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  native-arm64-original-game4-two-groups:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 17
    env:
      PRODUCT_SOURCE: 32cd752201e01134fc53157270ce223de70a8c7a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 41787602880
          github-token: ${{ github.token }}
          name: m0-plan028-native-arm64-normal-auto-41787602880
          path: ./
      - name: Verify genuine ARM64 original Go and Rust frozen SOURCE/ELF/SHA, no build
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -c /dev/net/tun
          bash -n tools/m0-plan028-game-two-groups-real-linux-netns.sh
          python3 - <<'PY'
          import json,hashlib,pathlib,struct,os
          m=json.loads(pathlib.Path("fixed-build/manifest.json").read_text())
          assert m["source_sha"]==os.environ["PRODUCT_SOURCE"]
          assert m["architecture"]=="native_aarch64"
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert m["go"]=="1.23.12" and m["rust"]=="1.85.1"
          for n in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(pathlib.Path("fixed-build")/n).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==183,n
              assert hashlib.sha256(b).hexdigest()==m["sha256"][n],n
          print("M0_PLAN028_ARM64_GAME4_FIXED6_FROZEN_ELF_SHA256_PASS no_product_build=1")
          PY
          chmod 0755 fixed-build/wbd-v4-client fixed-build/wbd-v4-server
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
      - name: One native ARM64 client+server authentic Game4FEC6 A switch and Bob live
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixed-kernel-result
          WBD_PLAN028_GAME_MULTI_MODE=game4 WBD_PLAN028_GAME_MULTI_FEC=fixed6 \
          WBD_PLAN028_GAME_MULTI_PHYSICAL_SWITCH=1 \
            bash tools/m0-plan028-game-two-groups-real-linux-netns.sh fixed-build \
            >fixed-kernel-result/plan028-arm64-game4-sibling-source-switch.log 2>&1 || {
              tail -180 fixed-kernel-result/plan028-arm64-game4-sibling-source-switch.log >&2
              exit 1
            }
          grep -Fq 'M0_PLAN028_GAME4_FEC6_TWO_GROUPS_REAL_SOURCE4_CHANGE_BOB_CONTINUOUS_PASS' fixed-kernel-result/plan028-arm64-game4-sibling-source-switch.log
          grep -Fq 'M0_PLAN028_GAME_TWO_PROTECTED_ACCOUNTS_ONE_443_ONE_RUST_TUN_NATIVE_PASS' fixed-kernel-result/plan028-arm64-game4-sibling-source-switch.log
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fixed-kernel-result")
          d=json.loads((p/"plan028-game4-sibling-real-switch.json").read_text())
          r=json.loads((p/"plan028-game4-os-route.json").read_text())[0]
          l=json.loads((p/"plan028-game4-os-link.json").read_text())[0]
          assert d["one_server_port"]==443 and d["per_group_lanes"]==4
          assert d["real_source4_before"]=="10.25.0.2" and d["real_source4_after"]==r.get("prefsrc",r.get("src"))=="10.25.0.9"
          assert d["new_physical_mtu"]==l["mtu"]==1280 and d["outer_ipv4_user_intent"]==1460
          assert d["alice_tun_os_mtu_old"]==1358 and d["alice_tun_os_mtu_new"]==1178
          assert d["bob_tun_os_mtu_old"]==d["bob_tun_os_mtu_new"]==1358
          assert d["bob_udp_during_switch"]==32 and d["alice_new_udp"]==64
          assert d["new_tls_generation_ready"] and d["old_exact_stop"]
          print("M0_PLAN028_ARM64_GAME4FEC6_BOB_CONTINUOUS_REAL_SOURCE4_OVERLAP_STOP_PASS")
          PY
          cat fixed-kernel-result/plan028-game4-sibling-real-switch.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-arm64-game4-fec6-sibling-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/plan028-game4-sibling-real-switch.json
            fixed-kernel-result/plan028-game4-os-route.json
            fixed-kernel-result/plan028-game4-os-link.json
            fixed-kernel-result/plan028-arm64-game4-sibling-source-switch.log
          if-no-files-found: warn
          retention-days: 14
