name: M0 WinXDP full Normal carrier functional
run-name: "M0 WinXDP cold and steady real Normal carrier | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-winxdp']
    paths: ['.github/workflows/qa-m0-winxdp-full-smoke.yml', 'tools/m0_winxdp_full_client.py', 'tools/m0_winxdp_fixture.py']
permissions: {contents: read, actions: read}
concurrency:
  group: winxdp-full-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client-windows:
    strategy:
      fail-fast: false
      matrix:
        replica: [S]
    runs-on: windows-2025
    timeout-minutes: 65
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      H2478_REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Identify actual Windows CPU before expensive setup
        id: cpu_gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force h2442-out | Out-Null
          $names=@()
          try { $names=@(Get-CimInstance Win32_Processor -ErrorAction Stop | ForEach-Object { $_.Name } | Where-Object { $_ }) } catch { Write-Output 'CPU CIM unavailable' }
          if($names.Count -eq 0){
            try { $n=(Get-ItemProperty 'HKLM:\HARDWARE\DESCRIPTION\System\CentralProcessor\0' -ErrorAction Stop).ProcessorNameString; if($n){$names=@($n)} } catch { Write-Output 'CPU name unavailable' }
          }
          ConvertTo-Json -InputObject @($names) -Compress | Set-Content -Encoding utf8 h2442-out/cpu-names.json
          python tools/m0_h2476_gate.py h2442-out/cpu-names.json h2442-out/cpu-gate.json
          if($LASTEXITCODE -ne 0){throw 'CPU gate receipt failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'h2476-cpu-gate-${{ matrix.replica }}', path: h2442-out/cpu-gate.json, if-no-files-found: error, retention-days: 14}
      - name: Verify experiment scripts parse
        shell: pwsh
        run: |
          python -m py_compile tools/m0_winxdp_fixture.py tools/m0_winxdp_full_client.py tools/m0_winxdp_ab_server.py tools/m0_h2479_tcp.py tools/m0_winxdp_ab_profile.py tools/m0_h2476_gate.py tools/m0_h2475_fixture.py tools/m0_h2478_profile.py tools/m0_h2470_probe.py tools/m0_h2476_import_wsl.py
          if($LASTEXITCODE -ne 0){throw 'syntax check'}
          python -c "import re; assert re.findall(r'published=(\d+)', 'published=123') == ['123']"
          if($LASTEXITCODE -ne 0){throw 'receipt regex test'}
          python tools/m0_winxdp_fixture.py
          if($LASTEXITCODE -ne 0){throw 'compact receipt check'}
          python tools/test_m0_h2478_profile.py
          if($LASTEXITCODE -ne 0){throw 'profile roundtrip test'}
      - name: Reuse exact full carrier Go and ISA-L DLL build
        shell: pwsh
        run: |
          git diff --exit-code e5c3cc4ecc2d13c59e9ea1d930202bfd49e09017 HEAD -- crates r0 Cargo.toml Cargo.lock tools/prepare_windows_wiring.py
          if($LASTEXITCODE -ne 0){throw 'full product changed'}
          gh run download 45811666472 -R $env:GITHUB_REPOSITORY -n winxdp-full-native-ab -D xdp-build
          if($LASTEXITCODE -ne 0){throw 'full build archive unavailable'}
      - name: Inspect previous cold-attempt and Stop evidence
        shell: pwsh
        run: |
          gh run download 45811666472 -R $env:GITHUB_REPOSITORY -n winxdp-full-evidence-S -D prior-evidence
          if($LASTEXITCODE -ne 0){throw 'prior evidence unavailable'}
          Get-ChildItem prior-evidence -Recurse -Filter client.log | ForEach-Object {
            Write-Output $_.FullName
            Select-String -Path $_.FullName -Pattern 'WBD_XDP_|bootstrap failed|SYN_MSS|SYNACK_MSS|generation=.*(retry|fail)|worker rc|native disconnected' | ForEach-Object {$_.Line.Substring(0,[Math]::Min(1200,$_.Line.Length))}
          }
      - name: Fetch exact frozen Linux x86_64 product for local WSL server
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') }}
        shell: bash
        env:
          WBD_PLAN029_LINUX_EXPECTED_ARCH: x86_64
        run: |
          # All product differences from the verified H2480 base are the
          # already-built Windows-only TX candidate. Check exact build identity
          # above, then use the original frozen-server verifier at its base SHA.
          git diff --exit-code 26b11e2da236e909b73f461964c52d5a86d42dca "$GITHUB_SHA" -- crates r0 Cargo.toml Cargo.lock tools/m0_plan029_linux_dual_native_build.sh tools/m0_linux_glibc231_build.sh ':!crates/wbd-engine/src/v4_windows_native_runtime.rs' ':!crates/wbd-engine/Cargo.toml' ':!crates/wbd-platform/Cargo.toml' ':!crates/wbd-platform/src/lib.rs' ':!crates/wbd-platform/build.rs' ':!crates/wbd-platform/native/winxdp_tx.cpp' ':!crates/wbd-platform/src/windows_xdp_tx.rs' ':!crates/wbd-platform/src/windows_xdp_rx.rs' ':!crates/wbd-engine/src/v4_windows_game_native_runtime.rs' ':!r0/go_overlay/cmd/wbd-client/m0_native_v4_windows.go' ':!r0/go_overlay/cmd/wbd-client/m0_native_v4_rust_peer_windows.go' ':!r0/go_overlay/internal/faketcp/xdp_native_windows.go' ':!r0/go_overlay/assembly/manifest-plan020-m0.json'
          GITHUB_SHA=26b11e2da236e909b73f461964c52d5a86d42dca bash tools/m0_h2476_fetch_frozen_linux.sh
      - name: WSL stage 1 - bounded distro inventory
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') }}
        id: wsl_inventory
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force result,h2442-out | Out-Null
          Write-Output 'H2476_WSL_INVENTORY_START'
          $known=((& python tools/m0_wl_windows_bounded_cmd.py 30 wsl.exe --list --quiet 2>&1 | Out-String) -replace '[\x00]','')
          $rc=$LASTEXITCODE
          $known | Set-Content result/h2476-distro-list.txt
          if($rc -ne 0){throw 'real WSL2 distro query unavailable'}
          $need=($known -notmatch '(?im)^\s*Ubuntu\s*$')
          "needs_import=$($need.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "H2476_WSL_INVENTORY_DONE needs_import=$need"
      - name: WSL stage 2 - official pinned image download
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') && steps.wsl_inventory.outputs.needs_import == 'true' }}
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          $img=Join-Path $env:RUNNER_TEMP 'ubuntu-24.04.5-wsl-amd64.tar'
          Write-Output 'H2476_WSL_DOWNLOAD_START'
          & python tools/m0_wl_windows_bounded_cmd.py 190 curl.exe --fail --location --connect-timeout 20 --max-time 180 --output $img 'https://releases.ubuntu.com/noble/ubuntu-24.04.5-wsl-amd64.wsl'
          if($LASTEXITCODE -ne 0){throw 'Ubuntu pinned download failed'}
          if((Get-FileHash $img -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bb415d824822c4b878125729af451a5d18fb13d1cf5cbed9a7393ad64ac6039e'){throw 'Ubuntu real image checksum mismatch'}
          Write-Output 'H2476_WSL_DOWNLOAD_HASH_PASS'
      - name: WSL stage 3 - file-backed import with one owned retry
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') && steps.wsl_inventory.outputs.needs_import == 'true' }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          python -u tools/m0_h2476_import_wsl.py
          if($LASTEXITCODE -ne 0){throw 'real Ubuntu WSL2 import failed'}
      - name: WSL stage 4 - bounded guest network startup
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          Write-Output 'H2476_WSL_BOOT_START'
          $lines=(& python tools/m0_wl_windows_bounded_cmd.py 35 wsl.exe -d Ubuntu -u root --exec ip -4 -o addr show dev eth0 2>&1 | Out-String)
          $rc=$LASTEXITCODE
          $lines | Set-Content result/h2476-guest-network.txt
          if($rc -ne 0){throw 'real independent Linux eth0 unavailable'}
          $m=[regex]::Match($lines,'\binet\s+(\d{1,3}(?:\.\d{1,3}){3})/')
          if(-not $m.Success){throw 'real Linux guest does not have its own IPv4'}
          $ip=$m.Groups[1].Value
          if($ip -match '^(127\.|0\.)'){throw 'guest source is not a networked Linux kernel'}
          $ip | Set-Content -Encoding ascii result/h1706-ubuntu-guest-ip.txt
          Write-Output "H2476_WSL_BOOT_DONE ip=$ip"
      - name: Prepare actual WSL Linux kernel and read BBR capability
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          & python tools/m0_wl_windows_bounded_cmd.py 210 wsl.exe -d Ubuntu -u root --exec sh -c 'command -v iptables && command -v openssl && command -v python3 && command -v tc && command -v modprobe && command -v sudo || (apt-get update -qq && apt-get install -y -qq iproute2 iptables openssl python3 kmod sudo)'
          if($LASTEXITCODE -ne 0){throw 'WSL prerequisites unavailable'}
          & python tools/m0_wl_windows_bounded_cmd.py 120 wsl.exe -d Ubuntu -u root --exec sh -c 'command -v tcpdump && command -v ethtool || (apt-get update -qq && apt-get install -y -qq tcpdump ethtool)'
          if($LASTEXITCODE -ne 0){throw 'H2480 ethtool/tcpdump prerequisites unavailable'}
          $cc=(& python tools/m0_wl_windows_bounded_cmd.py 30 wsl.exe -d Ubuntu -u root --exec sh -c 'modprobe tcp_bbr 2>/dev/null || true; sysctl -n net.ipv4.tcp_available_congestion_control; uname -a' | Out-String)
          $cc | Tee-Object result/h2476-kernel-cc.txt
          if($cc -notmatch '\bbbr\b'){throw 'WSL kernel has no registered BBR; no fallback'}
          if($LASTEXITCODE -ne 0){throw 'WSL congestion control inventory unavailable'}
      - name: Real bidirectional netem and bare-port filter preflight before drivers
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') }}
        shell: pwsh
        timeout-minutes: 4
        run: |
          python tools/m0_h2475_fixture.py h2476-out/preflight
          if($LASTEXITCODE -ne 0){throw 'actual netem preflight failed'}
      - name: Use exact assembled A and common cold Go EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force result/wl-public,h2442-out | Out-Null
          $m=Get-Content xdp-build/manifest.json -Raw | ConvertFrom-Json
          if($m.source_sha -ne 'e5c3cc4ecc2d13c59e9ea1d930202bfd49e09017' -or (Get-FileHash xdp-build/wbd-client-embedded.exe).Hash.ToLowerInvariant() -ne $m.exe){throw 'fresh Go build identity mismatch'}
          Copy-Item xdp-build/wbd-client-embedded.exe result/wl-public/
          Copy-Item xdp-build/A.dll result/wl-public/wbd_engine.dll
          [ordered]@{source_sha=$m.source_sha;native_fec_acceleration=$true;features=$m.features_A;sha256=@{exe=$m.exe;dll=$m.A}} | ConvertTo-Json -Depth 4 | Set-Content h2442-out/windows-binary-manifest.json
          Copy-Item h2442-out/windows-binary-manifest.json result/wl-public/
      - name: Full public-run signed original Npcap and Wintun driver install
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'wl-public-real'
          $drv=Join-Path $root 'npcap'
          $usr=Join-Path $root 'user'
          New-Item -ItemType Directory -Force $root,$drv,$usr,result/wl-public | Out-Null
          $zip=Join-Path $root 'npcap-test.zip'
          # External vendor/CDN 504s must not be interpreted as native
          # Npcap/Wintun product failures. Retry only byte downloads; exact
          # pinned SHA256 plus original Authenticode checks remain unchanged.
          function Get-PinnedPublicNativeDriverPackage([string]$Uri,[string]$Destination){
            for($attempt=1;$attempt -le 5;$attempt++){
              try {
                Invoke-WebRequest -UseBasicParsing -Uri $Uri -OutFile $Destination -TimeoutSec 65 -ErrorAction Stop
                if(-not (Test-Path -LiteralPath $Destination)){throw 'signed package download absent'}
                return
              }catch{
                Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
                Write-Output ('PLAN028_EXTERNAL_SIGNED_DRIVER_DOWNLOAD_RETRY attempt='+$attempt+' status='+$_.Exception.GetType().Name)
                if($attempt -eq 5){throw}
                Start-Sleep -Seconds ([Math]::Min(24,4*$attempt))
              }
            }
          }
          Get-PinnedPublicNativeDriverPackage 'https://github.com/user-attachments/files/32200327/npcap.zip' $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6380ebe6d5b06bbb0dc03a43151ee05a4a25be97efebd742c463e0e466621a32'){throw 'approved old driver package hash changed'}
          Expand-Archive $zip $drv -Force
          $installer=Join-Path $root 'npcap-1.88.exe'
          Get-PinnedPublicNativeDriverPackage 'https://npcap.com/dist/npcap-1.88.exe' $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2f4ec1e5ea353ff67efd24b2ebf081ba44532410fae8d5e146af0310aa4f56b'){throw 'official Npcap hash changed'}
          $sg=Get-AuthenticodeSignature $installer
          if($sg.Status -ne 'Valid' -or $sg.SignerCertificate.Subject -notmatch 'Nmap Software LLC'){throw 'official Npcap invalid signature'}
          & 7z x -y "-o$usr" $installer | Out-File result/wl-public/npcap-extract.log
          if($LASTEXITCODE -ne 0){throw 'Npcap DLL extraction failed'}
          & ./tools/m0_wl_npcap_driver_ci.ps1 -Action Install -DriverPackageDir $drv -UserlandExtractDir $usr 2>&1 |
            Tee-Object result/wl-public/npcap-install.log
          if((Get-Service npcap -ErrorAction Stop).Status -ne 'Running'){throw 'Npcap real kernel service not running'}
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/wpcap.dll" -Destination result/wl-public/wpcap.dll
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/Packet.dll" -Destination result/wl-public/Packet.dll
          $wzip=Join-Path $root 'wintun.zip'
          $wdir=Join-Path $root 'wintun'
          Get-PinnedPublicNativeDriverPackage 'https://www.wintun.net/builds/wintun-0.14.1.zip' $wzip
          if((Get-FileHash $wzip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'){throw 'official Wintun archive hash changed'}
          Expand-Archive $wzip $wdir -Force
          $dll=Join-Path $wdir 'wintun/bin/amd64/wintun.dll'
          if((Get-AuthenticodeSignature $dll).Status -ne 'Valid'){throw 'official Wintun DLL unsigned'}
          Copy-Item $dll result/wl-public/wintun.dll
      - name: Install same official XDP runtime for A and B
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          nuget install Microsoft.XDP-for-Windows.Runtime.x64 -Version 1.3.0 -OutputDirectory xdp-packages -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'XDP runtime unavailable'}
          $runtime=(Get-ChildItem xdp-packages -Recurse -Filter xdp-setup.ps1 | Select-Object -First 1).Directory.FullName
          & "$runtime/xdp-setup.ps1" -Install xdp
          if($LASTEXITCODE -ne 0){throw 'XDP install failed'}
          $m=Get-Content xdp-build/manifest.json -Raw | ConvertFrom-Json
          if($m.source_sha -ne 'e5c3cc4ecc2d13c59e9ea1d930202bfd49e09017' -or (Get-FileHash xdp-build/A.dll).Hash.ToLowerInvariant() -ne $m.A -or (Get-FileHash xdp-build/B.dll).Hash.ToLowerInvariant() -ne $m.B){throw 'A/B identity mismatch'}
          Copy-Item xdp-build/manifest.json h2442-out/xdp-build-manifest.json
      - name: 'Same-runner functional full carrier B then A at 250M'
        shell: pwsh
        if: ${{ (steps.cpu_gate.outputs.eligible == 'true' || matrix.replica == 'S') }}
        timeout-minutes: 45
        run: |
          $ErrorActionPreference='Stop'
          $guestText=(& python tools/m0_wl_windows_bounded_cmd.py 25 wsl.exe -d Ubuntu -u root -- ip -4 -o addr show dev eth0 | Out-String)
          $guestIP=[regex]::Match($guestText,'\binet\s+(\d{1,3}(?:\.\d{1,3}){3})/').Groups[1].Value
          if(-not $guestIP){throw 'WSL guest address absent'}
          $nic=@(Get-NetAdapter -IncludeHidden | Where-Object {$_.Name -match '^vEthernet \(WSL' -and $_.Status -eq 'Up'})
          if($nic.Count -ne 1){throw 'WSL adapter ambiguous'}
          $hostIP=@(Get-NetIPAddress -AddressFamily IPv4 -InterfaceIndex $nic[0].InterfaceIndex | Where-Object {$_.IPAddress -notmatch '^169\.254\.'})
          $creator=@(Get-NetFirewallHyperVVMCreator | Where-Object {$_.FriendlyName -eq 'WSL'})
          if($hostIP.Count -ne 1 -or $creator.Count -ne 1){throw 'WSL test endpoints ambiguous'}
          $name='WBD-H2476-'+$env:GITHUB_RUN_ID
          $rst=$false
          $neighbor=$false
          try{
            & python tools/m0_wl_windows_bounded_cmd.py 120 wsl.exe -d Ubuntu -u root -- sh -c 'command -v iptables >/dev/null || (apt-get update -qq && apt-get install -y -qq iptables)'
            if($LASTEXITCODE -ne 0){throw 'Linux kernel underlay RST control unavailable'}
            & wsl.exe -d Ubuntu -u root -- iptables -I OUTPUT 1 -p tcp --tcp-flags RST RST --sport 443 -j DROP
            if($LASTEXITCODE -ne 0){throw 'test RST suppression failed'}
            $rst=$true
            # Same configured source port for all modes. Original persisted
            # cold tuple ordinal reserves successive lane/retry slots.
            $ports=@(41031..41094 | ForEach-Object {[string]$_})
            $appPorts=@('5202')
            New-NetFirewallHyperVRule -Name $name -DisplayName $name -Direction Inbound -Action Allow -Enabled True -Profiles Any -VMCreatorId $creator[0].VMCreatorId -Protocol TCP -LocalAddresses $guestIP -RemoteAddresses $hostIP[0].IPAddress -LocalPorts @('443') -RemotePorts $ports | Out-Null
            New-NetFirewallRule -Name ($name+'-tcp') -DisplayName ($name+'-tcp') -Direction Inbound -Action Allow -Protocol TCP -LocalAddress 10.66.0.2 -RemoteAddress 10.66.0.1 -LocalPort $appPorts | Out-Null
            New-NetFirewallRule -Name ($name+'-udp') -DisplayName ($name+'-udp') -Direction Inbound -Action Allow -Protocol UDP -LocalAddress 10.66.0.2 -RemoteAddress 10.66.0.1 -LocalPort $appPorts | Out-Null
            # Real NPF header showed original product SYN destination MAC equals
            # Windows vEthernet own source MAC. Resolve ONLY this actual WSL2
            # Linux eth0 MAC, never fabricate an IP/TLS/ACK or replace Npcap.
            $guestLink=(& python tools/m0_wl_windows_bounded_cmd.py 25 wsl.exe -d Ubuntu -u root -- ip -j link show dev eth0 | ConvertFrom-Json)
            if($LASTEXITCODE -ne 0){throw 'bounded WSL2 eth0 MAC lookup failed'}
            $guestMAC=[string]$guestLink.address
            $hostMAC=([string]$nic[0].MacAddress).Replace('-',':')
            if(@($guestMAC.Split(':')).Count -ne 6 -or $guestMAC -eq $hostMAC){throw 'actual WSL2 guest Ethernet MAC invalid or same as Windows host'}
            $existing=@(Get-NetNeighbor -AddressFamily IPv4 -InterfaceIndex $nic[0].InterfaceIndex -IPAddress $guestIP -ErrorAction SilentlyContinue)
            if(@($existing|Where-Object {$_.State -eq 'Permanent'}).Count -gt 0){throw 'foreign WSL neighbor present, refusing overwrite'}
            [ordered]@{owner=$name;interface_index=$nic[0].InterfaceIndex;guest_ip=$guestIP;guest_mac=$guestMAC;source_host_mac=$hostMAC} |
              ConvertTo-Json | Set-Content result/wl-public/native-wsl-neighbor-owner.json
            & netsh.exe interface ipv4 set neighbors "interface=$($nic[0].InterfaceIndex)" "address=$guestIP" "neighbor=$($guestMAC.Replace(':','-'))" "store=active"
            if($LASTEXITCODE -ne 0){throw 'native WSL2 exact Linux eth0 neighbor install failed'}
            $neighbor=$true
            $entry=@(Get-NetNeighbor -AddressFamily IPv4 -InterfaceIndex $nic[0].InterfaceIndex -IPAddress $guestIP -ErrorAction Stop)
            if($entry.Count -ne 1 -or $entry[0].LinkLayerAddress.Replace('-',':') -ne $guestMAC){throw 'real WSL2 guest neighbor MAC readback mismatch'}
            Write-Output ('WL_REAL_GUEST_MAC_NEIGHBOR_BOUND mac='+$guestMAC)
            # Pass only the exact MAC already read from ACTUAL Linux eth0 and
            # verified by Windows NetNeighbor into this public Go/Npcap child.
            # SendARP alone returned the host self MAC (proven wrong SYN L2).
            $env:WBD_PLAN024_NATIVE_VERIFIED_GUEST_MAC=$guestMAC
            $env:WBD_PLAN024_NATIVE_VERIFIED_GUEST_IP4=$guestIP
            $env:WBD_PLAN024_NATIVE_VERIFIED_HOST_IP4=[string]$hostIP[0].IPAddress
            $env:WBD_PLAN024_NATIVE_VERIFIED_IFINDEX=[string]$nic[0].InterfaceIndex
            Write-Output 'WL_REAL_ORIGINAL_GO_SCOPED_LINUX_GUEST_MAC_FFI_HANDOFF_ARMED'
            New-NetFirewallHyperVRule -Name ($name+'-bare') -DisplayName ($name+'-bare') -Direction Inbound -Action Allow -Enabled True -Profiles Any -VMCreatorId $creator[0].VMCreatorId -Protocol TCP -LocalAddresses $guestIP -RemoteAddresses $hostIP[0].IPAddress -LocalPorts @('5202') | Out-Null
            & python -u tools/m0_winxdp_full_client.py
            if($LASTEXITCODE -ne 0){throw 'same-runner single TCP test incomplete'}
          } finally {
            if($neighbor){& netsh.exe interface ipv4 delete neighbors "interface=$($nic[0].InterfaceIndex)" "address=$guestIP" "store=active" | Out-Null}
            Remove-NetFirewallHyperVRule -Name $name -ErrorAction SilentlyContinue
            Remove-NetFirewallHyperVRule -Name ($name+'-bare') -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -Name ($name+'-tcp'),($name+'-udp') -ErrorAction SilentlyContinue
            if($rst){& wsl.exe -d Ubuntu -u root -- iptables -D OUTPUT -p tcp --tcp-flags RST RST --sport 443 -j DROP}
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: winxdp-full-evidence-${{ matrix.replica }}
          path: |
            h2442-out/cpu-gate.json
            h2442-out/windows-binary-manifest.json
            h2442-out/xdp-build-manifest.json
            h2439-out/build-identity.json
            h2476-out/
            result/h2476-*.txt
            result/h1706-ubuntu-*
            xdp-build/manifest.json
          if-no-files-found: warn
          retention-days: 14
