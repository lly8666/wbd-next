name: M0 PLAN027 H496 real product 100M 300s after exact C100
on:
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions: {contents: read, actions: write}
jobs:
  strict-first-and-original-tun:
    if: >-
      github.event.workflow_run.id == 41025962277 &&
      github.event.workflow_run.head_sha == '787ad4c900f3bae867c5c9556c4702339deef8cb' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Require exact zero delivery old binary replaced, launch one genuine long native 100M
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          product=787ad4c900f3bae867c5c9556c4702339deef8cb
          build_run=41025962277
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)" = "$product"
          gh api "repos/$GH_REPO/actions/runs/$build_run/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$product" "$RUNNER_TEMP/artifacts"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/artifacts"
          mkdir -p "$RUNNER_TEMP/c100"
          gh run download "$build_run" -R "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/c100"
          python - <<'PY'
          import json,os,pathlib
          from tools.m0_wl_plan027_loss_verdict import verdict
          from tools.m0_wl_perf_v2_config import read_scenario
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'c100'
          r=json.loads((p/'report.json').read_text());v=r['WL_V2']
          assert r['linux_binary_source']=='787ad4c900f3bae867c5c9556c4702339deef8cb'
          assert r['stop']=='PASS_BOTH_OWNED' and v['owned_stop']=='PASS_BOTH_OWNED'
          assert v['status']=='MEASURED_BOTH_OS_KERNEL'
          assert v['scenario_id']=='plan027-c-normal-100m-25ms-loss0-60s'
          assert all(v['offered_mbps'][x]>=95 for x in ('windows','linux'))
          # This run's ZIP includes the native TUN kernel counters and the
          # original Go log, but not the transient ip -j JSON test snapshot.
          # Go emits the marker only after strict kernel readback validation.
          owned=r['linux_tun_link_kernel']
          assert owned['status']=='MEASURED_ORIGINAL_LINUX_TUN_IP_LINK',owned
          assert owned['tx_dropped_delta']==0,owned
          text=(p/'mode-results'/'normal'/'server.log').read_text(errors='replace')
          assert 'V4_PUBLIC_TUN_TXQLEN role=server interface=wbdwl4 packets=2048 readback=REAL_ORIGINAL_LINUX_TUN' in text
          result=verdict(r)
          print('H496_TRUE_NEW_PRODUCT_SOURCE_EXACT_ZERO_60S',result)
          assert result['status']=='PASS_ZERO_INJECTED_LOSS_EXACT_FIRST',result
          s=read_scenario('scenarios/plan027-c-normal-100m-product-tun2048-loss0-300s.json')
          assert s['duration_s']==300 and 'linux_tun_txqlen_packets' not in s
          print('H496_NEW_PRODUCT_LONG100_SOURCE_SHA',s['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --ref main \
            -f public_mode=normal -f run_n0=false  \
            -f perf_scenario_file=scenarios/plan027-c-normal-100m-product-tun2048-loss0-300s.json \
            -f perf_reuse_run_id="$build_run" -f perf_binary_source_sha="$product"
          echo H496_REAL_NEW_PRODUCT_C100_300S_NOT_HARNESS_OVERRIDE_DISPATCHED
