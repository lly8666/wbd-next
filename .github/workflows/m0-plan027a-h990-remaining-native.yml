name: M0 PLAN027A H990 remaining native source-locked matrix
run-name: "M0|PLAN027A-H990-REMAINING|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027a-h990-remaining-native.yml]
permissions: {contents: read, actions: write}
concurrency:
  group: m0-plan027a-h990-source-locked-matrix
  cancel-in-progress: false
jobs:
  one-binary-many-native-scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 1e8325f16e2975a9da3497ab97ac570771a97238
      BUILD_RUN: "41546652567"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify unchanged product, full real artifacts and new fixture tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          git fetch --depth=1 origin "$SOURCE_SHA"
          diff_product="$(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py tools/m0_install_public_faketcp.py)"
          test -z "$diff_product" || { echo "H990_REFUSE_PRODUCT_SOURCE_DRIFT $diff_product";exit 1; }
          python3 -m unittest tests.test_m0_wl_native_df_kernel tests.test_m0_wl_native_mtu_contract tests.test_m0_wl_perf_v2_config -v
          python3 -m py_compile tools/m0_wl_native_df_kernel.py
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts" --jq '.artifacts[]|select(.expired==false)|.name' >/tmp/h990-products
          grep -Fx "m0-wl-windows-product-binaries-$SOURCE_SHA" /tmp/h990-products
          grep -Fx m0-plan024-linux-product /tmp/h990-products
          echo "H990_BINARY_VERIFIED_BUILD_SOURCE_ONLY run=$BUILD_RUN source=$SOURCE_SHA harness=$GITHUB_SHA"
      - name: Eleven independent original Windows Wintun/Npcap and Linux WSL2 Actions
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          while IFS='|' read -r mode outer scene; do
            [ -n "$mode" ] || continue
            [ -z "$scene" ] || test -f "$scene"
            scene_label="$scene";[ -n "$scene_label" ] || scene_label=no-scene
            display="M0-WIN-LINUX|$GITHUB_SHA|$mode|$scene_label|outer=$outer"
            existing="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100"|jq -r --arg x "$display" '.workflow_runs[]|select(.display_title==$x)|.id'|head -1)"
            if [ -n "$existing" ];then echo "H990_ALREADY_DISPATCHED $existing $display";continue;fi
            if [ -n "$scene" ];then
              gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main -f "public_mode=$mode" -f "native_outer_mtu=$outer" -f run_n0=false -f outer_repair=on -f "perf_reuse_run_id=$BUILD_RUN" -f "perf_binary_source_sha=$SOURCE_SHA" -f "perf_scenario_file=$scene"
            else
              gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main -f "public_mode=$mode" -f "native_outer_mtu=$outer" -f run_n0=false -f outer_repair=on -f "perf_reuse_run_id=$BUILD_RUN" -f "perf_binary_source_sha=$SOURCE_SHA"
            fi
            echo "H990_QUEUED_NOT_PASS mode=$mode outer=$outer scene=$scene_label product=$SOURCE_SHA fixture=$GITHUB_SHA"
          done <<'SCENES'
          normal|default1460|scenarios/plan027a-h958-normal-1460-5m-df-60s.json
          fixed|default1460|
          game2|default1460|
          game4|default1460|
          game2-fec|default1460|
          normal|1280|
          game4-fec|1280|
          fixed|1500|
          game4-fec|1500|
          auto-revision|default1460|
          auto-adaptive|default1460|
          SCENES
          echo H990_ALL_ELEVEN_INDEPENDENT_ACTIONS_QUEUED_NOT_PASS
