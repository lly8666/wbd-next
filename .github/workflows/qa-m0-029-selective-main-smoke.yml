# Validate only source-selected H2270 repair and H2292 Windows TX service.
# A native compile is NOT a substituted real Windows/ARM 3Runner product pass.
name: M0 029 selective main integration Rust native gates
on:
  push:
    branches:
      - integration/m0-029-selective-main-20261122
    paths:
      - '.github/workflows/qa-m0-029-selective-main-smoke.yml'
      - 'crates/wbd-engine/**'
      - 'crates/wbd-platform/**'
      - 'docs/devlog/M0/20261122-M0-PLAN029-SELECTIVE-MAIN.md'
  workflow_dispatch:
jobs:
  linux-original-ack:
    name: Original Linux Rust frozen ACK/SACK scope test
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,m0_v4_probe,m0_fec2_owner_probe,fec2_product_record --lib h2270_original_linux_presentation_ack_restores_one_shot_repair_without_m2_receipt -- --test-threads=1
          cargo +1.85.1 test --locked -p wbd-recovery --lib outer_ack -- --test-threads=1
  windows-original-tx:
    name: Windows source-native H2292 NPF feature and Rust owner tests
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Source-locked original native Rust B16 and default B8 build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'H2296_RUSTUP_FAILED'}
          $features='m0_v4_embedded_go,m0_v4_probe,m0_fec2_owner_probe,fec2_product_record'
          & cargo +1.85.1 test --locked -p wbd-platform --lib windows_native_io -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'H2296_WINDOWS_NPF_ORIGINAL_UNIT_FAILED'}
          & cargo +1.85.1 test --locked -p wbd-platform --features h2291_windows_tx_service --lib windows_native_io -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'H2296_WINDOWS_NPF_16_UNIT_FAILED'}
          & cargo +1.85.1 test --locked -p wbd-engine --features $features --lib v4_windows_native_runtime -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'H2296_WINDOWS_TX8_OWNER_UNIT_FAILED'}
          & cargo +1.85.1 test --locked -p wbd-engine --features "$features,h2291_windows_tx_service" --lib v4_windows_native_runtime -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'H2296_WINDOWS_TX16_OWNER_UNIT_FAILED'}
          Write-Output H2296_WINDOWS_RUST_ORIGINAL_AND_TX16_SOURCE_TEST_PASS
