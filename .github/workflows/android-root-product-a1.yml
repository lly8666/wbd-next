        mode: [normal_off, normal_maximum6, normal_auto, game2_off, game2_fixed6, game4_off, game4_fixed6]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
