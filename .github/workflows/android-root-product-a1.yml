    needs: [arm64-native]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
