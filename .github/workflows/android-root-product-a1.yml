name: Android root product same-source dual-64 Bionic Go/Rust gate
run-name: "android-dual64|Bionic-Go-Rust|${{ github.sha }}"
on:
  push:
    branches: [experiment/android-temp-root-probe]
    paths:
      - ".github/workflows/android-root-product-a1.yml"
      - "android/root-native/**"
      - "android/root-app/**"
      - "crates/wbd-platform/src/android_root_io.rs"
      - "crates/wbd-platform/src/lib.rs"
      - "crates/wbd-engine/src/lib.rs"
      - "crates/wbd-engine/src/v4_embedded_go.rs"
      - "crates/wbd-engine/src/v4_android_original_m4.rs"
      - "crates/wbd-engine/src/v4_android_game_*.rs"
      - "crates/wbd-engine/src/v4_android_dns_*.rs"
      - "crates/wbd-engine/src/v4_owner_crypto.rs"
      - "crates/wbd-codec/src/link_fec_wire.rs"
      - "crates/wbd-engine/src/v4_session_address.rs"
      - "crates/wbd-platform/src/ipv4_tcp.rs"
      - "crates/wbd-platform/src/rx_ipv4_tcp.rs"
      - "crates/wbd-engine/Cargo.toml"
      - "crates/wbd-codec/Cargo.toml"
      - "Cargo.lock"
      - "r0/go_overlay/internal/realityfront/**"
      - "r0/go_overlay/internal/faketcp/raw_android_network_*.go"
      - "r0/go_overlay/internal/v4productcli/linux.go"
      - "r0/go_overlay/internal/v4productcli/**"
      - "r0/go_overlay/cmd/wbd-v4-client/*.go"
      - "tools/m0_install_public_faketcp.py"
      - "tools/m0_install_public_realityfront_tests.py"
  workflow_dispatch:
    inputs:
      run_legacy_nativebridge:
        description: 'Run obsolete ARM64-ELF-on-x86-NativeBridge diagnostic (known SIGSEGV 139)'
        type: boolean
        required: false
        default: false
      run_tap_guest_pilot:
        description: 'Explicit opt-in for historical TAP guest diagnostic; not run during APK wiring work'
        type: boolean
        required: false
        default: false
      run_x86_guest:
        description: 'One x86 KSU boot: Android ART cold controls, original x86 ELF and translated ARM64 cold suite'
        type: boolean
        required: false
        default: false
      run_x86_d2_network:
        description: 'Separate historical D2 SLIRP network experiment; known ENV_BLOCKED, not part of cold suite'
        type: boolean
        required: false
        default: false
permissions: {contents: read}
concurrency:
  group: android-product-a1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  b1-dns-wire-loopback:
    # Host real DNS wire on local UDP/TCP; never an Android runtime test.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Test CN/tunnel UDP DNS, bounded TTL and same-upstream TCP fallback
        shell: bash
        run: bash android/root-native/ci/dns-b1-loopback.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-b1-dns-real-loopback-${{ github.sha }}
          path: out/android-b1-dnsnative/
          retention-days: 14
          if-no-files-found: warn
  b2-authentic-cn-geosite-host:
    # The EXACT upstream revision, original include/attr/affiliation importer,
    # genuine 8503-rule SHA and real Go DNS socket tests. Host only.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Import immutable v2fly CN8503 and run full-typed Go matcher / real host DNS wire
        shell: bash
        run: bash android/root-native/ci/dns-b2-pinned-cn.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-b2-pinned-cn-geosite-${{ github.sha }}
          path: |
            out/android-b2-cn-geosite/cn-geosite-provenance.json
            out/android-b2-cn-geosite/official-cn.dat
            out/android-b2-cn-geosite/wbd-cn-ipv4.txt
            out/android-b2-cn-geosite/cn-ipv4-provenance.json
            out/android-b2-cn-geosite/wbd-cn-geosite.txt
            out/android-b2-cn-geosite/wbd-cn-geosite-license.txt
            out/android-b2-cn-geosite/import-log.json
            out/android-b2-cn-geosite/go-matcher-wire.log
            out/android-b2-cn-geosite/receipt.json
          retention-days: 14
          if-no-files-found: warn
  b2c-physical-scoped-dns-host:
    # Real Linux socket callback order and source IPv4/TCP/UDP scope.
    # Actual NDK netd binding is in the original Android ARM64 cgo build,
    # but is NOT runnable on this host without an Android guest.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Exercise real scoped UDP/TCP sockets and fail-closed netd-bind callback
        shell: bash
        run: bash android/root-native/ci/dns-b2c-physical-host.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-b2c-scoped-physical-dns-${{ github.sha }}
          path: out/android-b2c-physical/
          retention-days: 14
          if-no-files-found: warn
  b2c2-original-rust-tun-dns-ingress-host:
    # Original Rust one-TUN reader transparent DNS53 observation, host only.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Rust one-readv IPv4 DNS53 byte-level test and unchanged AEAD owner gate
        shell: bash
        run: bash android/root-native/ci/dns-b2c2-rust-ingress-host.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-b2c2a-rust-single-tun-dns53-${{ github.sha }}
          path: out/android-b2c2-rust-ingress/
          retention-days: 14
          if-no-files-found: warn
  b2c2b-rust-dns-udp-inverse-map:
    # Fixed-capacity 5-tuple/ID mapping on real IPv4/UDP packet bytes,
    # host only; neither a second TUN reader nor an active DNS hijacker.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Test original Rust bounded DNS53 inverse five-tuple and checksum
        shell: bash
        run: bash android/root-native/ci/dns-b2c2b-rust-udp-map-host.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-b2c2b-rust-dns-udp-map-${{ github.sha }}
          path: out/android-b2c2b-dns-flow/
          retention-days: 14
          if-no-files-found: warn
  original-m3-wire-oracle:
    # This is a pure M3 wire unit-test host: NO Android x86 target and
    # no second app/crypto implementation. Runs independently of NDK link.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Assert zero-allocation M3 LINK20 bytes match original Go fixture
        shell: bash
        run: cargo +1.85.1 test --locked -p wbd-codec arm64_original_m4_slab_link_plan_is_byte_identical_and_capacity_fail_closed
      - name: Verify exact original Go Game2/4 cold lane layout (real Rust unit tests)
        shell: bash
        run: cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,fec2_product_record android_game_cold_
      - name: Verify Fixed inner reservation and already-encoded M3 wire budget
        shell: bash
        run: cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,fec2_product_record b97_android_fec2_inner_and_record_budget_do_not_double_reserve
      - name: Verify original cold MTU ABI, mode, peer MSS and receive-side cap
        shell: bash
        run: |
          cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,fec2_product_record 'v4_mtu_budget_ffi::'
  arm64-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WBD_ANDROID_WIRING_MATRIX: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[android-wiring-acceptance]') && '1' || '0' }}
      WBD_ANDROID_SPECIALTY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[android-specialty-test]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: D0 early specialty fixture admission before expensive native builds
        if: env.WBD_ANDROID_SPECIALTY == '1'
        shell: bash
        run: |
          set -euo pipefail
          go run android/root-native/ci/check-specialty-source.go -- \
            android/root-native/ci/b90-android-specialty.go \
            android/root-native/ci/b91-postauth-android.go
          bash -n android/root-app/ci/x86-android-specialty.sh
          python3 -m py_compile android/root-app/ci/b90-dns-fixture.py android/root-app/ci/b94-uid-echo.py
          bash android/root-app/ci/traffic-fixture/build.sh
          printf '%s\n' "$GITHUB_SHA" >out/android-traffic-fixture/SOURCE
          (cd out/android-traffic-fixture && sha256sum traffic-fixture.apk host-smoke.txt SOURCE >SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.WBD_ANDROID_SPECIALTY == '1'
        with:
          name: android-specialty-traffic-fixture-${{ github.sha }}
          path: |
            out/android-traffic-fixture/traffic-fixture.apk
            out/android-traffic-fixture/host-smoke.txt
            out/android-traffic-fixture/SOURCE
            out/android-traffic-fixture/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: D0 Build same-source ARM64 release and x86_64 CI-only original Go/Rust
        shell: bash
        run: bash android/root-native/build-source-locked.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-root-product-a1-${{ github.sha }}
          path: out/android-product-a1/
          retention-days: 14
          if-no-files-found: warn
  root-arm64-app:
    # A signed APK must contain B2 source-locked CN TXT+MIT provenance from
    # the SAME workflow SHA, not a fixture or stale AVD/probe asset.
    needs: [arm64-native, b2-authentic-cn-geosite-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Fetch immutable original Go/Rust ARM64 binaries from SAME source run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android-root-app-native
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "android-root-product-a1-$GITHUB_SHA" \
            --dir out/android-root-app-native
          test "$(cat out/android-root-app-native/SOURCE)" = "$GITHUB_SHA"
          (cd out/android-root-app-native && sha256sum -c SHA256SUMS)
      - name: Fetch authenticated pinned CN8503/MIT assets from SAME SOURCE run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android-root-app-cn
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "android-b2-pinned-cn-geosite-$GITHUB_SHA" \
            --dir out/android-root-app-cn
          test -s out/android-root-app-cn/wbd-cn-geosite.txt
          test -s out/android-root-app-cn/wbd-cn-geosite-license.txt
          test -s out/android-root-app-cn/cn-geosite-provenance.json
          test -s out/android-root-app-cn/receipt.json
      - name: Build reusable ordinary-App TCP UDP test fixture and run its host loopback
        shell: bash
        run: bash android/root-app/ci/traffic-fixture/build.sh
      - name: Build independent no-VpnService Root ARM64 APK
        shell: bash
        run: bash android/root-app/ci/build-source-locked.sh
      - name: Verify signed APK original Go/Rust CLI and loader wiring (host-only; no emulator)
        shell: bash
        run: python3 android/root-app/ci/test-apk-native-wiring.py
      - name: Verify Android official CN updater against the exact shared upstream group
        shell: bash
        run: |
          set -euo pipefail
          jar="$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$jar" || jar="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p out/android-cn-update-test
          javac -source 8 -target 8 -encoding UTF-8 -classpath "$jar" -d out/android-cn-update-test \
            android/root-app/src/org/wbdnext/rootclient/RootCnDomainUpdate.java \
            android/root-app/ci/RootCnDomainUpdateTest.java
          java -cp "out/android-cn-update-test:$jar" org.wbdnext.rootclient.RootCnDomainUpdateTest \
            out/android-root-app-cn/official-cn.dat out/android-root-app-cn/wbd-cn-geosite.txt
      - name: Test exact selected Network event gate (pure Java)
        if: always()
        shell: bash
        run: bash android/root-app/ci/test-network-scope-gate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-root-original-arm64-app-${{ github.sha }}
          path: |
            out/android-root-app/wbd-root-arm64-debug.apk
            out/android-root-app/wbd-root-lite-arm64-debug.apk
            out/android-root-app/SOURCE
            out/android-root-app/SHA256SUMS
            out/android-root-app/manifest.json
            out/android-root-app/wiring-receipt.json
            out/android-root-app/manifest-tree.txt
            out/android-root-app/badging.txt
            out/android-traffic-fixture/traffic-fixture.apk
            out/android-traffic-fixture/host-smoke.txt
          retention-days: 14
          if-no-files-found: warn
  android-x86-kvm-ksu-original-native:
    if: ${{ always() && needs.arm64-native.result == 'success' && needs.b2-authentic-cn-geosite-host.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.run_x86_guest == true) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[android-cold-suite]') || contains(github.event.head_commit.message, '[android-parallel-test]')))) }}
    # One controlled guest after the actual same-SOURCE signed product APK.
    # Historical static assertion failure does not block real Android tests.
    needs: [arm64-native, b2-authentic-cn-geosite-host, root-arm64-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      WBD_KSU_PRODUCT_X86_CI: '1'
      WBD_ANDROID_COLD_SUITE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-root-product-a1-${{ github.sha }}
          path: out/android-root-app-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-b2-pinned-cn-geosite-${{ github.sha }}
          path: out/android-root-app-cn
      - name: Require the signed ARM64 APK from the completed build first
        shell: bash
        run: |
          mkdir -p out/android-root-release
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "android-root-original-arm64-app-$GITHUB_SHA" --dir out/android-root-release
          test "$(cat out/android-root-release/android-root-app/SOURCE)" = "$GITHUB_SHA"
          (cd out/android-root-release/android-root-app && sha256sum -c SHA256SUMS)
          test -s out/android-root-release/android-root-app/wbd-root-arm64-debug.apk
      # Existing same-source host/production APK jobs run the static gate.
      # A stale source-string assertion must not block real ART/KSU tests.
      - name: Build same-Java original Go/Rust x86_64 signed CI-only APK
        shell: bash
        run: bash android/root-app/ci/build-x86-ci-locked.sh
      - name: Verify pinned KernelSU 3.3.1 and prepare Android16 x86 KVM
        shell: bash
        run: bash experiments/android-root-probe/ci/ksu-prepare-avd.sh
      - name: D1 combined Android ART and original x86 Go plus translated ARM64 cold checks
        shell: bash
        run: timeout --signal=TERM --kill-after=8s 1020s bash android/root-app/ci/x86-kvm-ksu-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-x86-original-native-ksu-${{ github.sha }}
          path: |
            out/android-x86-ci-app/wbd-root-x86-ci-only.apk
            out/android-x86-ci-app/manifest.json
            out/android-x86-ci-app/SOURCE
            out/android-x86-ci-app/SHA256SUMS
            out/android-x86-ci-app/badging.txt
            out/android-x86-ksu-native/receipt.json
            out/android-x86-ksu-native/*.txt
            out/android-x86-ksu-native/ui-*.png
            out/android-x86-ksu-native/ui-*.json
            out/ksu/grant-ui-result.json
            out/ksu/sdk-install.txt
            out/ksu/patch-log.txt
            out/ksu/helper-sha.txt
            out/ksu/manager-hash-verified.txt
            out/ksu/native-source-mode.txt
          retention-days: 14
          if-no-files-found: warn

  linux-x86-original-server-d2-s0:
    # D2-S0: original Linux server + shared Rust, built for the SAME ISA as
    # the x86 Android16 KSU guest host. This tests server CLI startup only.
    # It is NOT an Android TLS/auth/M4/TCP/UDP or route-Stop test.
    needs: [arm64-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-root-product-a1-${{ github.sha }}
          path: out/android-root-app-native
      - name: D2-S0 build exact pinned Linux original x86_64 server and run real CLI help
        shell: bash
        run: bash android/root-app/ci/x86-original-linux-server-prep.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-d2-s0-original-linux-x86-server-${{ github.sha }}
          path: |
            out/android-x86-original-linux/wbd-v4-server
            out/android-x86-original-linux/wbd-v4-client
            out/android-x86-original-linux/libwbd_engine.so
            out/android-x86-original-linux/SOURCE
            out/android-x86-original-linux/manifest.json
            out/android-x86-original-linux/SHA256SUMS
            out/android-x86-original-linux/elf-*.txt
            out/android-x86-original-linux/linker-*.txt
            out/android-x86-original-linux/help-*-rc.txt
          retention-days: 7
          if-no-files-found: warn

  android-x86-kvm-ksu-original-d2-s1:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_x86_d2_network == true) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[android-parallel-test]') || contains(github.event.head_commit.message, '[android-guest-retry]'))) }}
    # Separate red/green gate: ORIGINAL Linux server runs on the same x86
    # KVM host as the real Android16 KernelSU App. Run production Java
    # RootClientService -> original Android Go/Rust, require authentic
    # TUN + AF_PACKET readiness, report SYNACK/TLS/lease/M4 separately.
    # This is NOT the D2 true TCP+UDP end-to-end gate yet.
    needs: [arm64-native, b2-authentic-cn-geosite-host, linux-x86-original-server-d2-s0]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      WBD_KSU_PRODUCT_X86_CI: '1'
      WBD_D2_ORIGINAL: '1'
      WBD_D2_PREAUTH_ONLY: ${{ github.event_name == 'push' && '1' || '0' }}
      WBD_ANDROID_WIRING_MATRIX: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[android-wiring-acceptance]') && '1' || '0' }}
      WBD_ANDROID_SPECIALTY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[android-specialty-test]') && !contains(github.event.head_commit.message, '[android-specialty-parallel]') && '1' || '0' }}
      WBD_ANDROID_LIFECYCLE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[android-lifecycle-test]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
