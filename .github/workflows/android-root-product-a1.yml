    # Explicit manual opt-in retains the real red failure when requested.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_legacy_nativebridge == true }}
    # The actual older KernelSU environment (x86_64 KVM Android16 API36)
    # is NOT equivalent to an ARM64 guest. This job must launch the exact
    # Android ARM64 signed APK and actually execve its original-Go AArch64
    # ELF before claiming NativeBridge supports the product. Otherwise FAIL
    # with a source-locked evidence receipt; never silently claim P2/P3.
    needs: [root-arm64-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      WBD_KSU_PRODUCT_ARM64: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
