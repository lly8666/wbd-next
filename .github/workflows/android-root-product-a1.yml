name: Android ARM64 root product Go/Rust Bionic gate
run-name: "android-arm64|Bionic-Go-Rust|${{ github.sha }}"
on:
  push:
    branches: [experiment/android-temp-root-probe]
    paths:
      - ".github/workflows/android-root-product-a1.yml"
      - "android/root-native/**"
      - "android/root-app/**"
      - "crates/wbd-platform/src/android_root_io.rs"
      - "crates/wbd-platform/src/lib.rs"
      - "crates/wbd-engine/src/lib.rs"
      - "crates/wbd-engine/src/v4_embedded_go.rs"
      - "crates/wbd-engine/src/v4_android_original_m4.rs"
      - "crates/wbd-engine/src/v4_owner_crypto.rs"
      - "crates/wbd-codec/src/link_fec_wire.rs"
      - "crates/wbd-engine/src/v4_session_address.rs"
      - "crates/wbd-platform/src/ipv4_tcp.rs"
      - "crates/wbd-platform/src/rx_ipv4_tcp.rs"
      - "crates/wbd-engine/Cargo.toml"
      - "crates/wbd-codec/Cargo.toml"
      - "Cargo.lock"
      - "r0/go_overlay/internal/realityfront/**"
      - "r0/go_overlay/internal/faketcp/raw_android_network_*.go"
      - "r0/go_overlay/internal/v4productcli/linux.go"
      - "r0/go_overlay/internal/v4productcli/**"
      - "tools/m0_install_public_faketcp.py"
      - "tools/m0_install_public_realityfront_tests.py"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: android-product-a1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-m3-wire-oracle:
    # This is a pure M3 wire unit-test host: NO Android x86 target and
    # no second app/crypto implementation. Runs independently of NDK link.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Assert zero-allocation M3 LINK20 bytes match original Go fixture
        shell: bash
        run: cargo +1.85.1 test --locked -p wbd-codec arm64_original_m4_slab_link_plan_is_byte_identical_and_capacity_fail_closed
  arm64-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Build Android ARM64 original-Go cold control and shared Rust owner
        shell: bash
        run: bash android/root-native/build-source-locked.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-root-product-a1-${{ github.sha }}
          path: out/android-product-a1/
          retention-days: 14
          if-no-files-found: warn
  root-arm64-app:
    needs: [arm64-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Fetch immutable original Go/Rust ARM64 binaries from SAME source run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android-root-app-native
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "android-root-product-a1-$GITHUB_SHA" \
            --dir out/android-root-app-native
          test "$(cat out/android-root-app-native/SOURCE)" = "$GITHUB_SHA"
          (cd out/android-root-app-native && sha256sum -c SHA256SUMS)
      - name: Build independent no-VpnService Root ARM64 APK
        shell: bash
        run: bash android/root-app/ci/build-source-locked.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-root-original-arm64-app-${{ github.sha }}
          path: |
            out/android-root-app/wbd-root-arm64-debug.apk
            out/android-root-app/SOURCE
            out/android-root-app/SHA256SUMS
            out/android-root-app/manifest.json
            out/android-root-app/manifest-tree.txt
            out/android-root-app/badging.txt
          retention-days: 14
          if-no-files-found: warn
  linux-original-server-normal-off:
    # Genuine original Linux Go/Rust server + Linux peer: NOT Android E2E.
    needs: [arm64-native]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Test original real Linux server oracle against source-locked Android ARM64 binaries
        shell: bash
        run: bash android/root-native/ci/linux-original-oracle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-a3-real-linux-server-oracle-${{ github.sha }}
          path: |
            out/android-a3-linux/manifest.json
            out/android-a3-linux/assembly.json
            out/android-a3-linux/live-original-linux.log
            fixed-kernel-result/plan028-tls-wire-audit.json
            fixed-kernel-result/public-v4-normal-business.log
          retention-days: 14
          if-no-files-found: warn
  root-arm64-aosp-guest:
    # True ARM64 Android16 AOSP APK install/Activity on Apple Silicon.
    # Not KSU, not native root or Android-Linux E2E.
    needs: [root-arm64-app]
    runs-on: macos-15
    timeout-minutes: 30
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-root-original-arm64-app-${{ github.sha }}
          path: out/android-a3-guest
      - name: Establish fail-closed guest status until actual ARM64 emulator executes
        shell: bash
        run: |
          test "$(cat out/android-a3-guest/SOURCE)" = "$GITHUB_SHA"
          printf '{"source":"%s","status":"ENV_BLOCKED","android_arm64_aosp":"NOT_RUN","android16_ksu":"NOT_RUN","android_linux_e2e":"NOT_RUN"}\n' "$GITHUB_SHA" > out/android-a3-guest/guest-receipt.json
      - name: Run signed same-source original ARM64 APK on actual Android16 ARM64 AOSP
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          system-image-api-level: 36.1
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          emulator-boot-timeout: 600
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-snapshot -wipe-data -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on
          script: bash android/root-app/ci/arm64-aosp-install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-a3-arm64-aosp-guest-${{ github.sha }}
          path: |
            out/android-a3-guest/guest-receipt.json
            out/android-a3-guest/package-path.txt
            out/android-a3-guest/activity-launch.txt
          retention-days: 14
          if-no-files-found: warn
