# Crash + clean new TLS generation are separate from graceful-restart pass.
name: ARM64 Linux original-Go forced-client failure and clean recovery
run-name: ARM64 real SIGKILL/rejoin ${{ github.sha }}
on:
  push:
    branches: [feature/arm64-linux-android-openwrt-autoaccel]
    paths: ['.github/workflows/arm64-linux-fault-restart.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-client-sigkill-new-auth-generation:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 19
    env:
      WBD_ARM64_FROZEN_SOURCE: 6c8a64ae247de61485ee004df4ed2cdfa31256b5
      WBD_V4_MODE: fec-fixed
      WBD_ARM64_RESTART_FAULT: client-sigkill
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 39762732689
          github-token: ${{ github.token }}
          name: arm64-public-go-rust-39762732689-1
          path: arm64-public-bundle/
      - name: Real original Go client SIGKILL, server Stop, namespace teardown and new TLS session
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables
          bash tools/arm64_linux_restart_soak.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-real-fault-restart-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-restart-result/
          if-no-files-found: warn
          retention-days: 30
