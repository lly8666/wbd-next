name: PERF experimental minimal encrypted DATA parser matrix
run-name: "PERF|RX-MINIMAL|${{ github.sha }}"
on:
  push:
    branches: ["perf/outer-rx-minimal-parse-20261121"]
    paths:
      - "crates/wbd-platform/**"
      - "crates/wbd-engine/**"
      - "docs/features/entries/linux-raw-tun.json"
      - "docs/features/entries/windows-native-transport.json"
      - ".github/workflows/perf-outer-minimal-rx-matrix.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: perf-minimal-rx-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  linux-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Compile and test original platform and product Rust variants
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-platform --lib
          cargo +1.85.1 check --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record
          # This unrelated test requires an unpopulated pinned overlay fixture
          # directory; keep its original historical result, no source edits.
          cargo +1.85.1 test --locked -p wbd-engine --lib --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record -- --skip r1_direction_m0_pinned_rtrb_overlay_source_exact_native_ci
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Native ARM64 original platform and engine
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-platform --lib
          cargo +1.85.1 check --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Native Windows original platform and engine
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "C:\\Program Files\\NASM;$env:PATH"
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-platform --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.85.1 check --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
