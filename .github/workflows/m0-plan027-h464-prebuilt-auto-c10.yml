# PLAN027 H464: same H463 product SOURCE for two independent true native scenes.
name: M0 PLAN027 H464 prebuilt Auto and C10 one-shot fanout
on:
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions: {contents: read, actions: write}
jobs:
  launch:
    if: >-
      github.event.workflow_run.id == 40999605005 &&
      github.event.workflow_run.head_sha == '0daddf65ef1ae0abf2e42dc841b96ed4458a8fb9' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Attest one exact product build, dispatch TWO independent measurement Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          product='0daddf65ef1ae0abf2e42dc841b96ed4458a8fb9'
          build_run=40999605005
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)" = "$product"
          gh api "repos/$GH_REPO/actions/runs/$build_run/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/build-artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$product" "$RUNNER_TEMP/build-artifacts"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/build-artifacts"
          python - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          for p,mode in (('scenarios/plan027-h461-auto-egress-10m-25ms-loss0-60s.json','auto'),
                         ('scenarios/plan027-c-normal-10m-25ms-loss0-60s.json','normal')):
              c=read_scenario(p)
              assert c['public_mode']==mode and c['duration_s']==60
              for side in ('windows_to_linux','linux_to_windows'):
                  d=c[side];assert (d['offered_mbps'],d['delay_ms'],d['loss_pct'])==(10,25,0)
              print('PLAN027_H464_SCENE_ATTESTED',c['scenario_id'],c['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --ref main \
            -f public_mode=auto -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-h461-auto-egress-10m-25ms-loss0-60s.json \
            -f perf_reuse_run_id="$build_run" -f perf_binary_source_sha="$product"
          echo "PLAN027_H464_AUTO_DIAG_DISPATCHED=$product run=$build_run"
          gh workflow run m0-wl-public-normal-full.yml --ref main \
            -f public_mode=normal -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-c-normal-10m-25ms-loss0-60s.json \
            -f perf_reuse_run_id="$build_run" -f perf_binary_source_sha="$product"
          echo "PLAN027_H464_C10_STOP_DISPATCHED=$product run=$build_run"
