name: M0 dual Rust TCP native core
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths:
      - 'crates/wbd-engine/src/v4_rust_tcp/**'
      - 'crates/wbd-engine/src/lib.rs'
      - '.github/workflows/qa-m0-dual-rust-tcp-core.yml'
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Native core on exact source (not product or performance)
        run: |
          git rev-parse HEAD
          uname -m
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --lib v4_rust_tcp
