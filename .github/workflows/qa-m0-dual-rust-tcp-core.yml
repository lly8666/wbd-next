name: M0 dual Rust TCP Normal native restored service epoch qualification
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths:
      - 'crates/wbd-engine/src/v4_rust_tcp/**'
      - 'crates/wbd-engine/src/v4_embedded_go.rs'
      - 'crates/wbd-engine/src/v4_owner_crypto.rs'
      - 'crates/wbd-platform/src/linux_tun_sink.rs'
      - 'crates/wbd-platform/src/linux_raw_carrier.rs'
      - 'crates/wbd-platform/src/linux_batch.rs'
      - 'r0/go_overlay/assembly/manifest-plan020-m0.json'
      - 'r0/go_overlay/internal/v4productcli/linux.go'
      - 'tools/m0_dual_rust_tcp_*.py'
      - '.github/workflows/qa-m0-dual-rust-tcp-core.yml'
      - '.github/workflows/qa-m0-dual-tcp-arm-linux-parity.yml'
      - '.github/workflows/qa-m0-dual-tcp-arm-ajja.yml'
      - '.github/workflows/qa-m0-dual-tcp-arm-jaaj.yml'
      - 'tools/m0_dual_tcp_arm_linux_parity.py'
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build exact native RAW timing test executable once
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-platform --lib --no-run --message-format=json > fq-build.jsonl
          exe=$(jq -r 'select(.profile.test==true and .target.name=="wbd_platform" and .executable!=null) | .executable' fq-build.jsonl)
          test -f "$exe"
          mkdir -p fq-test-build
          cp "$exe" fq-test-build/fq-test
          printf '%s\n' "$GITHUB_SHA" > fq-test-build/source.txt
          (cd fq-test-build && sha256sum fq-test > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fq-native-test-${{ matrix.arch }}
          path: fq-test-build/
          if-no-files-found: error
      - name: Build original product on exact native ISA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dual-tcp-out
          git rev-parse HEAD | tee dual-tcp-out/source.txt
          uname -m | tee dual-tcp-out/arch.txt
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables ethtool iputils-ping autoconf automake libtool make gcc g++ nasm openssl
          python3 -m py_compile tools/m0_dual_rust_tcp_local.py tools/m0_dual_rust_tcp_app.py
          bash tools/m0_plan029_linux_dual_native_build.sh >dual-tcp-build.log 2>&1 || { tail -n 180 dual-tcp-build.log; exit 2; }
          cp linux-plan029-public-bundle/{manifest.json,SHA256SUMS} dual-tcp-out/
      - name: Native complete Rust TCP core (unchanged complexity limit)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --lib v4_rust_tcp
      - name: Local TUN ready GSO grouping unit
        run: cargo +1.85.1 test --locked -p wbd-platform --lib native_gso_only_contiguous_equal_headers_and_payloads
      - name: Native M4 clock exact copied-prefix unit
        shell: bash
        run: |
          set -euo pipefail
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-plan029-$(uname -m)"
          export WBD_ISAL_SOURCE_SHA="$(git -C "$RUNNER_TEMP/wbd-isa-l" rev-parse HEAD)"
          cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration --lib v4_embedded_go::native_m4_clock_only_counts_actual_copied_prefix -- --exact | tee dual-tcp-out/m4-clock-unit.txt
          grep -F 'test result: ok. 1 passed; 0 failed;' dual-tcp-out/m4-clock-unit.txt
      - name: Selected paired Normal defaults, no optimization environment overrides
        shell: bash
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT=dual-tcp-out WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
      - name: Selected BBR1, doubled Normal inbox and smaller middle pacing quantum
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT=dual-tcp-out/inbox2048 WBD_M0_NATIVE_INBOX_DOUBLE=1 WBD_M0_NATIVE_PACE_QUANTUM8=1 WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
      - name: Explicit middle CUBIC, same selected owner and GSO defaults
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT=dual-tcp-out/cubic WBD_M0_MIDDLE_CC=cubic WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
      - name: Explicit old relay admission rollback native functionality
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT=dual-tcp-out/credit-off WBD_M0_RELAY_PENDING_CREDIT=0 WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
      - name: Independent feedback native functional profiles
        run: |
          for profile in service;do
            sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT="dual-tcp-out/$profile" WBD_M0_NATIVE_FEEDBACK="$profile" WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
          done
      - name: Native actual BBR1 600M initial pacing seed functionality
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT=dual-tcp-out/bbr1-seed600 WBD_M0_BBR1_INITIAL_600M=1 WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
          for role in server client;do grep -q 'WBD_M0_BBR1 .* initial_pacing_rate=75000000' "dual-tcp-out/bbr1-seed600/normal/$role.log";done
      - name: Native actual BBRv3 600M initial pacing seed functionality
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT=dual-tcp-out/bbr3-seed600 WBD_M0_MIDDLE_CC=bbr3 WBD_M0_BBR3_INITIAL_600M=1 WBD_M0_NATIVE_FEEDBACK=service WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
          for role in server client;do grep -q 'WBD_M0_BBR .* initial_pacing_rate=75000000' "dual-tcp-out/bbr3-seed600/normal/$role.log";done
      - name: Original RAW FQ earned-train EDT actual paired product
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT=dual-tcp-out/edt WBD_M0_MIDDLE_CC=bbr3 WBD_M0_BBR3_INITIAL_600M=1 WBD_M0_NATIVE_FEEDBACK=service WBD_M0_NATIVE_EDT=1 WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
      - name: Selected baseline local clean pause weak regression
        if: matrix.arch == 'aarch64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" DUAL_TCP_OUT=dual-tcp-out/recovery DUAL_TCP_RECOVERY=1 WBD_M0_ACK_PROBE=2 WBD_M0_RX_PACKET_STATS=1 python3 -u tools/m0_dual_rust_tcp_local.py
      - name: Retain exact native binary for performance jobs
        run: |
          (cd linux-plan029-public-bundle && sha256sum -c SHA256SUMS)
          tar -C linux-plan029-public-bundle -cf bundle.tar .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-tcp-native-build-${{ matrix.arch }}
          path: bundle.tar
          if-no-files-found: error
      - name: Preserve owned evidence
        if: always()
        run: |
          if test -d dual-tcp-out;then
            sudo find dual-tcp-out -type f \( -name install -o -name route-key.hex -o -name users.json -o -name key.pem -o -name cert.pem \) -delete
            sudo chown -R "$(id -u):$(id -g)" dual-tcp-out
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dual-rust-tcp-normal-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dual-tcp-out/
            dual-tcp-build.log
          if-no-files-found: error
