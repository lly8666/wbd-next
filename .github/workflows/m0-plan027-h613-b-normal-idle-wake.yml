name: M0 PLAN027 H613 actual 105s Normal idle and new first delivery
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h613-b-normal-idle-wake.yml]
permissions: {contents: read, actions: write}
jobs:
  dispatch-one:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h613-idle]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 80ee526cc7b466ec6ccbe3cc25caf2f3754996ef
      BUILD_RUN: "41190352345"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Dispatch genuine standalone Normal idle wake scenario on existing signed binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          c=read_scenario('scenarios/plan027-b-normal-idle-wake-10m-25ms-0loss-60s.json')
          assert (c['public_mode'],c['lifecycle_idle_s'],c['duration_s'])==('normal',105,60)
          print('H613_NORMAL_IDLE_WAKE_SOURCE_SCENARIO',c['scenario_sha256'])
          PY
          title="M0-WIN-LINUX|$GITHUB_SHA|normal|scenarios/plan027-b-normal-idle-wake-10m-25ms-0loss-60s.json"
          existing="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" | jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id'|head -1)"
          if test -n "$existing";then echo "H613_ALREADY_SCOPED run=$existing";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false \
            -f perf_scenario_file=scenarios/plan027-b-normal-idle-wake-10m-25ms-0loss-60s.json \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H613_ONE_REAL_NORMAL_105S_IDLE_WAKE_DISPATCHED_NOT_A_PASS
