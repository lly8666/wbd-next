name: M0 PLAN027 H682 genuine current-source two-OS Normal 105s no-business idle then wake
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h682-original-windows-linux-normal-idle105-wake.yml]
permissions: {contents: read, actions: write}
jobs:
  one-source-locked-real-b105-wake:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h682-normal-idle]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 6ece9eab653f46a716e8d3a0927fb74bec4819e8
      PREPARED_HARNESS_SOURCE: 92354d5a70f34640918f61b25859ba0bb05989dd
      BUILD_RUN: "41226521824"
      TRUE_NORMAL_300S: "41237900545"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: No repeated binaries or staged fake Health; source-frozen real 105s signed original owner and wake
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          test "$(gh api "repos/$GH_REPO/actions/runs/$TRUE_NORMAL_300S" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PREPARED_HARNESS_SOURCE"
          test -z "$(git diff --name-only "$PREPARED_HARNESS_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools scenarios)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-b-normal-idle-wake-10m-25ms-0loss-60s.json')
          assert s['public_mode']=='normal' and s['duration_s']==60 and s['lifecycle_idle_s']==105 and s['tun_mtu']==1400
          for d in ('windows_to_linux','linux_to_windows'):
              x=s[d];assert x['offered_mbps']==10 and x['delay_ms']==25 and x['loss_pct']==0
          print('H682_ORIGINAL_SOURCE_AUTHENTICATED_IDLE105_REAL_KERNEL_WAKE',s['scenario_sha256'])
          PY
          scene=scenarios/plan027-b-normal-idle-wake-10m-25ms-0loss-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|normal|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id' | head -1)"
          if [ -n "$old" ];then echo "H682_ALREADY_DISPATCHED run=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H682_ONE_GENUINE_WINDOWS_LINUX_IDLE105_BUSINESS_WAKE_AND_STOP_DISPATCHED_NOT_PASS
