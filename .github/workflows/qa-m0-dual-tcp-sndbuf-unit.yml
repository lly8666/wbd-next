name: M0 dual Rust exact-fill sndbuf native core tests
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths: ['.github/workflows/qa-m0-dual-tcp-sndbuf-unit.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 850e8fffdcaf0b22d2e31e8420a84fb1f0395872
          persist-credentials: false
      - name: Native complete TCP core including exact-fill owner send-buffer regression
        run: |
          test "$(git rev-parse HEAD)" = "850e8fffdcaf0b22d2e31e8420a84fb1f0395872"
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --lib v4_rust_tcp
