name: H2428 mixed4_server_paced BAAB aarch64
run-name: "H2428 mixed4_server_paced BAAB aarch64 | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-linux-tcp-splice']
    paths: ['.github/workflows/qa-h2428-mixed4-server-paced-baab-arm.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: h2428-mixed4-server-paced-baab-arm-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: aarch64
      H2421_SCENE: mixed4_server_paced
      H2421_ORDER: BAAB
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Retrieve exact SOURCE shared native build and verify hash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables iperf3 ethtool iputils-ping openssl
          python3 -m py_compile tools/m0_h2428_splice_local.py tools/m0_h2426_mixed_probe.py
          bash tools/m0_h2427_fetch_frozen.sh
      - name: Real original WBD native routed local fixture
        shell: bash
        run: |
          mkdir -p h2428-out
          cp h2423-build-identity.json h2428-out/
          lscpu >h2428-out/lscpu.txt
          uname -a >h2428-out/uname.txt
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" H2421_SCENE="$H2421_SCENE" H2421_ORDER="$H2421_ORDER" H2421_PRODUCT_SOURCE=559f2093857919c6293ee6f85622b55f198251fc H2421_OUT=h2428-out python3 -u tools/m0_h2428_splice_local.py
      - name: Preserve only owned readable evidence, not installation identities
        if: always()
        shell: bash
        run: |
          if test -d h2428-out;then
            sudo find h2428-out -type f -name install -delete
            sudo chown -R "$(id -u):$(id -g)" h2428-out
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2428-mixed4-server-paced-baab-arm-${{ env.WBD_PLAN029_LINUX_EXPECTED_ARCH }}
          path: h2428-out/
          retention-days: 14
