name: M0 PLAN027 H714 original kernel 100/300ms burst one genuine same binary
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h714-burst-frozen-reuse.yml]
permissions: {contents: read, actions: write}
jobs:
  one-original-signed-burst:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h714-burst-reuse]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: d0661a2e110b523ad06b311da23fc1b7291442ba
      BUILD: "41274450306"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Frozen authentic signed Windows/Linux binaries, corrected pulse oracle, exactly one true 100/300ms scene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD" --jq .head_sha)" = "$SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100" |
            jq -e --arg win "m0-wl-windows-product-binaries-$SOURCE" '
              [.artifacts[]|select(.expired==false)|.name]
              | index($win)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py scenarios)"
          python3 -m unittest tests.test_m0_wl_perf_v2_config.V2Scenarios.test_h713_real_burst_duty_does_not_use_zero_loss_oracle -v
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario,first_delivery_ok_for_scenario
          s=read_scenario("scenarios/plan027-c-normal-10m-25ms-0pct-burst100-300ms-60s.json")
          assert s["public_mode"]=="normal" and s["duration_s"]==60 and s["tun_mtu"]==1400 and s["seed"]==20261030
          assert s["kernel_loss_bursts"]==[{"start_s":20,"duration_ms":100},{"start_s":40,"duration_ms":300}]
          for d in ("windows_to_linux","linux_to_windows"):
              assert s[d]["offered_mbps"]==10 and s[d]["loss_pct"]==0 and s[d]["delay_ms"]==25
          assert first_delivery_ok_for_scenario(s,{"windows":.994154,"linux":.994462})
          print("M0_H714_REAL_ORIGINAL_TC_BURST_EXACT_SCENE",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-c-normal-10m-25ms-0pct-burst100-300ms-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|normal|$scene"
          old="$(gh api "repos/$GH_REPO/actions/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id' | head -1)"
          if [ -n "$old" ]; then echo "M0_H714_ALREADY_DISPATCHED=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main             -f public_mode=normal -f run_n0=false -f perf_scenario_file="$scene"             -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$SOURCE"
          echo "M0_H714_REAL_BURST_NATIVE_DISPATCHED_NOT_PASS original_source=$SOURCE"
