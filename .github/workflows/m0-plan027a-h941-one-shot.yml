name: M0 PLAN027A H941 single manual MTU native qualification batch
run-name: "M0|PLAN027A-H941-ONE-SHOT|${{ github.sha }}|outer1460-1500"
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027a-h941-one-shot.yml]
  workflow_dispatch:
permissions: {contents: read, actions: write}
jobs:
  manual-batch:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[plan027a-h941-once]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Check single immutable source, sealed 1460 scenario fixtures and default selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          python3 -m unittest tests.test_m0_wl_native_mtu_contract -v
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          rows=(
            ('normal','scenarios/plan027a-h941-normal-1460-10m-25ms-loss0-60s.json',0),
            ('game4-fec','scenarios/plan027a-h941-game4fec-1460-10m-25ms-loss0-60s.json',0),
            ('fixed','scenarios/plan027a-h941-fixed-1460-10m-250ms-loss30-60s.json',30),
            ('game4-fec','scenarios/plan027a-h941-game4fec-1460-10m-250ms-loss30-60s.json',30))
          for mode,path,loss in rows:
            s=read_scenario(path)
            assert s["public_mode"]==mode and s["tun_mtu"]==1460 and s["duration_s"]==60
            for d in ("windows_to_linux","linux_to_windows"):
              assert s[d]["loss_pct"]==loss and s[d]["offered_mbps"]==10
              assert s[d]["delay_ms"]==(25 if loss==0 else 250)
            print("H941_SCENE",mode,path,s["scenario_sha256"])
          PY
      - name: Dispatch once the six genuine original-Go signed Windows and WSL scenarios
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          declare -a jobs=(
            'all|default1460|'
            'all|1500|'
            'normal|1460|scenarios/plan027a-h941-normal-1460-10m-25ms-loss0-60s.json'
            'game4-fec|1460|scenarios/plan027a-h941-game4fec-1460-10m-25ms-loss0-60s.json'
            'fixed|1460|scenarios/plan027a-h941-fixed-1460-10m-250ms-loss30-60s.json'
            'game4-fec|1460|scenarios/plan027a-h941-game4fec-1460-10m-250ms-loss30-60s.json'
          )
          for item in "${jobs[@]}"; do
            IFS='|' read -r mode outer scene <<<"$item"
            wanted="M0-WIN-LINUX|$GITHUB_SHA|$mode|${scene:-no-scene}|outer=$outer"
            prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
              jq -r --arg title "$wanted" '.workflow_runs[] | select(.display_title==$title) | .id' | head -1)"
            if [ -n "$prior" ]; then echo "H941_ALREADY_QUEUED $wanted run=$prior"; continue; fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode="$mode" -f run_n0=false -f outer_repair=on \
              -f native_outer_mtu="$outer" -f perf_scenario_file="$scene"
            echo "H941_DISPATCHED_NOT_PASS $wanted"
          done
          echo H941_SIX_SOURCE_EXACT_ACTIONS_QUEUED_NOT_EVIDENCE_OF_PASS
