name: M0 PLAN027 H490 original Linux TUN iface drop source-frozen probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h490-linux-tun-link-drops.yml]
permissions: {contents: read, actions: write}
jobs:
  run-one-true-original-c100:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-h490]') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Prove real FQ zero, original binaries and link probe then native C100
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          build_run=41013628666
          product='f83874c30e0d918cfe070b67b39e208eea0da457'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)" = "$product"
          gh api "repos/$GH_REPO/actions/runs/$build_run/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/binaries"
          grep -Fx "m0-wl-windows-product-binaries-$product" "$RUNNER_TEMP/binaries"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/binaries"
          python -m unittest -q tests.test_m0_wl_plan027_linux_tun_fq tests.test_m0_wl_plan027_linux_tun_link tests.test_m0_wl_plan027_windows_boundary
          python -m py_compile tools/m0_wl_public_normal_e2e.py
          mkdir -p "$RUNNER_TEMP/h489"
          gh run download 41019395006 -R "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/h489"
          python - <<'PY'
          import json,os,pathlib
          from tools.m0_wl_plan027_linux_tun_fq import fq_delta
          from tools.m0_wl_perf_v2_config import read_scenario
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'h489'
          a=json.loads((d/'wl-v2-linux-tun-fq-before.json').read_text())
          b=json.loads((d/'wl-v2-linux-tun-fq-after.json').read_text())
          actual=fq_delta(a,b)
          assert actual['status']=='MEASURED_ORIGINAL_LINUX_TUN_FQ_KERNEL',actual
          assert actual['drops_delta']==0,actual
          print('H490_ACTUAL_C100_ALL1200B_TUN_FQ_DROPS_ZERO',actual)
          c=read_scenario('scenarios/plan027-c-normal-100m-25ms-loss0-60s.json')
          assert c['public_mode']=='normal' and c['duration_s']==60
          for side in ('windows_to_linux','linux_to_windows'):
              assert (c[side]['offered_mbps'],c[side]['delay_ms'],c[side]['loss_pct'])==(100,25,0)
          print('H490_SOURCE_LOCKED_MIXED_C100_LINUX_LINK_PROBE',c['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --ref main \
            -f public_mode=normal -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-c-normal-100m-25ms-loss0-60s.json \
            -f perf_reuse_run_id="$build_run" -f perf_binary_source_sha="$product"
          echo H490_ORIGINAL_LINUX_TUN_IFACE_REAL_DROP_AUDIT_DISPATCHED
