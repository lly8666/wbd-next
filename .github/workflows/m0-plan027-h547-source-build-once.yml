name: M0 PLAN027 H547 corrected feedback coverage and Game cold native original source
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h547-source-build-once.yml]
permissions: {contents: read, actions: write}
jobs:
  original-build-and-zero:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h547-source-build-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Source-locked native signed original 0pct, build once then reuse for independent scenes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          for loss in (0,1,5,15,30):
              path=f'scenarios/plan027-h539-normal-10m-250ms-loss{loss}-60s.json' if loss!=30 else 'scenarios/wl-outer-repair-10m-250ms-loss30-60s.json'
              q=read_scenario(path)
              assert q['public_mode']=='normal' and q['duration_s']==60 and q['seed']==20261030
              assert all(q[d]['loss_pct']==loss and q[d]['delay_ms']==250 and q[d]['offered_mbps']==10 for d in ('windows_to_linux','linux_to_windows'))
              print('H547_SCENARIO_FREEZE',loss,q['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-h539-normal-10m-250ms-loss0-60s.json \
            -f perf_reuse_run_id="" -f perf_binary_source_sha=""
          echo H547_ONE_SOURCE_REAL_SIGNED_ORIGINAL_ZERO_DISPATCHED
