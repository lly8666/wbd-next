name: M0 PLAN028 Windows cold-path notification source-locked unit
run-name: PLAN028 Win in-flight original TLS notification unit ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-windows-cold-path-unit.yml"
      - "r0/go_overlay/cmd/wbd-client/m0_native_v4_windows.go"
      - "r0/go_overlay/cmd/wbd-client/m0_native_v4_reauth_windows_test.go"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-go-windows-cold-unit:
    runs-on: windows-2022
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Assemble pinned original Go and exact Windows cold owner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path result | Out-Null
          @'
          import pathlib,os,json,subprocess,hashlib
          root=pathlib.Path.cwd();sha=os.environ["GITHUB_SHA"]
          original="a7a82db31fe736ffedee330795a3234d358f1984"
          assert subprocess.check_output(["git","-C","legacy","rev-parse","HEAD"],text=True).strip()==original
          m=json.loads((root/"r0/go_overlay/assembly/manifest-plan020-m0.json").read_text(encoding="utf-8"))
          assert m["legacy_source"]==original
          gitblob=lambda b:hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          for op in m["operations"]:
              if op["kind"]=="replace":
                  raw=subprocess.check_output(["git","-C","legacy","show",original+":"+op["path"]])
                  assert gitblob(raw)==op["original_blob"],op["path"]
                  destination=root/"legacy"/op["path"]
                  assert destination.is_file(),op["path"]
                  destination.write_bytes(raw)
              if op.get("overlay_path"):
                  raw=subprocess.check_output(["git","show",sha+":"+op["overlay_path"]])
                  assert gitblob(raw)==op["result_blob"],op["overlay_path"]
          print("PLAN028_WINDOWS_COLD_TEST_SOURCE_MANIFEST_VERIFIED")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'Go source mismatch'}
          & python r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt result/assembly.json
          if ($LASTEXITCODE -ne 0) {throw 'Go assembly failed'}
          @'
          import pathlib,os,subprocess
          root=pathlib.Path.cwd();sha=os.environ["GITHUB_SHA"]
          for part,names in (
              ("realityfront",("admission_v4.go","bridge_v4_windows_private_owner.go",
                  "bridge_v4_windows_game_group.go","bridge_v4_windows_game_server_group.go",
                  "bridge_v4_windows_fec2_owner.go","bridge_v4_windows_wintun_lease.go",
                  "bridge_v4_windows_scoped_client.go")),
              ("windowsownerlease",("created_wintun_windows.go","scoped_original_tls_native_wintun_windows.go"))):
              dest=root/"legacy/internal"/part
              dest.mkdir(parents=True,exist_ok=True)
              for name in names:
                  p="r0/go_overlay/internal/"+part+"/"+name
                  raw=subprocess.check_output(["git","show",sha+":"+p])
                  output=dest/name
                  if output.exists():
                      assert name=="admission_v4.go" and output.read_bytes()==raw,p
                  else: output.write_bytes(raw)
          print("PLAN028_WINDOWS_COLD_UNIT_ASSEMBLY_READY")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'Go original bridge install failed'}
      - name: Run six original Windows cold path generation and recovery authorization tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location legacy
          try {
            & go test -count=1 -v -tags wbd_v4_embedded_go -run '^(TestM0PLAN028NativeWindowsIPv4CallbackCoalescer|TestM0PLAN028NativeWindowsOnlyPhysicalNICSourceIPv4|TestM0PLAN028WindowsNativePathChangeCancelsColdTLSNotWholeClient|TestM0PLAN028WindowsUserStopDuringColdTLSNeverRestarts|TestM0PLAN028WindowsNativePathChangeDoesNotOverrideAuthReject|TestM0PLAN028WindowsVerifiedPhysicalIPv4ColdTimeoutRetryDoesNotReviveStopOrAuth) ./cmd/wbd-client 2>&1 | Tee-Object -FilePath ../result/win-cold-go-unit.log
            if ($LASTEXITCODE -ne 0) {throw 'original Go native path-generation unit failed'}
          } finally {Pop-Location}
          $log=Get-Content result/win-cold-go-unit.log -Raw
          $names=@('TestM0PLAN028NativeWindowsIPv4CallbackCoalescer',
                   'TestM0PLAN028NativeWindowsOnlyPhysicalNICSourceIPv4',
                   'TestM0PLAN028WindowsNativePathChangeCancelsColdTLSNotWholeClient',
                   'TestM0PLAN028WindowsUserStopDuringColdTLSNeverRestarts',
                   'TestM0PLAN028WindowsNativePathChangeDoesNotOverrideAuthReject',
                   'TestM0PLAN028WindowsVerifiedPhysicalIPv4ColdTimeoutRetryDoesNotReviveStopOrAuth')
          foreach($test in $names){
            if($log -notmatch ('--- PASS: '+[regex]::Escape($test))) {
              throw ('Windows original Go test was not actually run: '+$test)
            }
          }
          Write-Output 'M0_PLAN028_WINDOWS_NATIVE_IPV4_COLD_TLS_RETRY_AUTH_BOUNDARY_UNIT_PASS tests=6'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-win-cold-unit-${{ github.run_id }}
          path: result/
          if-no-files-found: warn
          retention-days: 14
 ./cmd/wbd-client 2>&1 | Tee-Object -FilePath ../result/win-cold-go-unit.log
            if ($LASTEXITCODE -ne 0) {throw 'original Go native path-generation unit failed'}
          } finally {Pop-Location}
          $log=Get-Content result/win-cold-go-unit.log -Raw
          $names=@('TestM0PLAN028NativeWindowsIPv4CallbackCoalescer',
                   'TestM0PLAN028NativeWindowsOnlyPhysicalNICSourceIPv4',
                   'TestM0PLAN028WindowsNativePathChangeCancelsColdTLSNotWholeClient',
                   'TestM0PLAN028WindowsUserStopDuringColdTLSNeverRestarts',
                   'TestM0PLAN028WindowsNativePathChangeDoesNotOverrideAuthReject')
          foreach($test in $names){
            if($log -notmatch ('--- PASS: '+[regex]::Escape($test))) {
              throw ('Windows original Go test was not actually run: '+$test)
            }
          }
          Write-Output 'M0_PLAN028_WINDOWS_PRE_READY_IPV4_COLD_GEN_TEST_PASS five=5'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-win-cold-unit-${{ github.run_id }}
          path: result/
          if-no-files-found: warn
          retention-days: 14
