name: H2204 independent Windows amd64 and Linux ARM64 delivery QA
run-name: H2204 isolated client-server QA baseline
on:
  push:
    branches:
      - qa/win-amd64-linux-arm64-v2-20261118
    paths:
      - .github/workflows/qa-h2204-win-amd64-linux-arm64-delivery.yml
permissions:
  contents: read
  actions: write
jobs:
  linux-arm64-server:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      WBD_PLAN029_LINUX_EXPECTED_ARCH: aarch64
      WBD_PLAN029_LINUX_CONTROL_SYNC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Source guard; no unreviewed product changes from main
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          git diff --exit-code c04d5eefd47b672b30e531b21da763bfcf7a91f9 "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml rust-toolchain.toml tools/m0_plan029_linux_dual_native_build.sh
      - name: Real native ARM64 original Go and Rust ISA-L server build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc g++ nasm iproute2 iptables iputils-ping openssl
          bash tools/m0_plan029_linux_dual_native_build.sh > arm64-qa-build.log 2>&1 || { tail -n 140 arm64-qa-build.log; exit 1; }
      - name: Original native ARM64 twelve encrypted control real network scenarios
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          sudo -n true
          python3 -u tools/m0_plan029_linux_crossplatform_coverage.py > arm64-qa-network.log 2>&1 || { tail -n 140 arm64-qa-network.log; exit 1; }
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('linux-plan029-crossplatform-result/summary.json')
          x=json.loads(p.read_text())
          assert x['source_sha']==os.environ['GITHUB_SHA']
          assert x['native_isa']=='aarch64'
          assert len(x['scenarios'])==12
          assert x['qualification']=='PASS_SCOPED_TWELVE_ENCRYPTED_CONTROL_SYNC_NATIVE_LINUX_SCENES'
          assert all(s['status']=='PASS_SCOPED_REAL_LINUX_NATIVE_CROSSPLATFORM' for s in x['scenarios'])
          print('ARM64_V2_12_NATIVE_SESSIONS_PASS_SCOPED')
          PY
      - name: Package Linux ARM64 actual server and immutable build proofs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/linux-arm64-server
          cp linux-plan029-public-bundle/wbd-v4-server delivery/linux-arm64-server/
          cp linux-plan029-public-bundle/libwbd_engine.so delivery/linux-arm64-server/
          cp linux-plan029-public-bundle/manifest.json delivery/linux-arm64-server/
          (cd delivery/linux-arm64-server && sha256sum wbd-v4-server libwbd_engine.so manifest.json > SHA256SUMS)
          printf 'GitHub source=%s\nMain product-code baseline=c04d5eefd47b672b30e531b21da763bfcf7a91f9\nISA=aarch64\nRust/Go exact native build\n' "$GITHUB_SHA" > delivery/linux-arm64-server/BUILD_INFO.txt
          (cd delivery && tar -czf wbd-linux-arm64-server-v4v2.tar.gz linux-arm64-server)
          sha256sum delivery/wbd-linux-arm64-server-v4v2.tar.gz > delivery/PACKAGE-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2204-linux-arm64-server-v4v2
          path: |
            delivery/
            arm64-qa-build.log
            arm64-qa-network.log
            linux-plan029-crossplatform-result/summary.json
          if-no-files-found: warn
          retention-days: 30
  windows-native-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Dispatch original source-locked Windows Wintun Npcap WSL2 scenarios without editing main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exact=c04d5eefd47b672b30e531b21da763bfcf7a91f9
          now="$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)"
          test "$now" = "$exact" || { echo "MAIN_MOVED_NOT_DISPATCHING current=$now"; exit 1; }
          git diff --exit-code "$exact" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml rust-toolchain.toml
          for choice in normal game2 game4-fec; do
            extra=()
            if [ "$choice" = normal ]; then extra+=(-f plan029_case=gui_reconnect); fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GITHUB_REPOSITORY" --ref main -f "public_mode=$choice" -f native_outer_mtu=default1460 -f outer_repair=on "${extra[@]}"
            echo "DISPATCHED_NOT_PASSED Windows2025/WSL2 case=$choice original_SOURCE=$exact"
          done
