name: M0 PLAN028 H1368 native ARM64 correlated Game4 physical blackhole
run-name: PLAN028 H1368 native original TLS Game4 double 100pct blackhole and siblings recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/m0-plan028-h1368-arm64-game4-correlated-blackhole.yml", "tools/m0-plan028-h1259-five-client-recovery-netns.py", "tools/m0-plan028-h1368-arm64-game4-correlated-blackhole-fixture.py", "tools/m0-plan028-h1368-arm64-game4-correlated-blackhole-audit.py"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      WBD_PLAN028_FAST_SCENE: pressure
      WBD_PLAN028_FAST_CAPACITY_STEPS: "2"
      WBD_PLAN028_QDISC_CLOCK_DIAG: "1"
      WBD_PLAN028_STATIC_OWNED_NEIGH: "1"
      WBD_PLAN028_GAME4_CORRELATED_BLACKHOLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate exact five-client true physical loss+delay, static real veth ARP control and Python syntax before network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m0-plan028-h1368-arm64-game4-correlated-blackhole-fixture.py \
            tools/m0-plan028-h1368-arm64-game4-correlated-blackhole-audit.py \
            tools/m0-plan028-h1259-five-client-recovery-netns.py \
            tools/m0-plan028-h1286-rapid-report.py
          python3 tools/m0-plan028-h1368-arm64-game4-correlated-blackhole-fixture.py --preflight
          echo M0_PLAN028_H1368_TRUE_WEAKNET_PHASE_PREFLIGHT_PASS

  native-x86-five-client-game4-correlated-blackhole:
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    env:
      ORIGINAL_PRODUCT_SOURCE: 24e1fe6c4eab2a1abb7fb8a6d2093abaf57c0f73
      WBD_PLAN028_FAST_SCENE: pressure
      WBD_PLAN028_FAST_CAPACITY_STEPS: "2"
      WBD_PLAN028_QDISC_CLOCK_DIAG: "1"
      WBD_PLAN028_STATIC_OWNED_NEIGH: "1"
      WBD_PLAN028_GAME4_CORRELATED_BLACKHOLE: "1"
      WBD_GAME_FEC_BACKEND: scalar
      WBD_H1368_WRAPPER_SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 42379666500
          github-token: ${{ github.token }}
          name: plan028-h1327-native-arm64-build-24e1fe6c4eab2a1abb7fb8a6d2093abaf57c0f73
          path: fixed-build/
      - name: Verify frozen native x86 ELF62 original-Go and Rust ISA-L exact SHA binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -c /dev/net/tun
          python3 - <<'PY_BIN'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["ORIGINAL_PRODUCT_SOURCE"]
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert m["architecture"]=="native_aarch64" and m["go"]=="1.23.12" and m["rust"]=="1.85.1"
          assert set(m["sha256"])=={"wbd-v4-client","wbd-v4-server","libwbd_engine.so"}
          for n,digest in m["sha256"].items():
              raw=(root/n).read_bytes()
              assert raw[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",raw,18)[0]==183
              assert hashlib.sha256(raw).hexdigest()==digest,n
          print("M0_PLAN028_H1368_FROZEN_X86_ORIGINAL_TLS_NATIVE_RUST_ISAL_SHA3_PASS",flush=True)
          PY_BIN
          chmod +x fixed-build/wbd-v4-client fixed-build/wbd-v4-server
      - name: Real native 180s five-client 0 1 5 15 30pct physical netem 0 50 150 250ms delay
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          mkdir -p fixed-kernel-result
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          GITHUB_SHA="$ORIGINAL_PRODUCT_SOURCE" python3 -u \
            tools/m0-plan028-h1368-arm64-game4-correlated-blackhole-fixture.py fixed-build \
            >fixed-kernel-result/h1368-native-game4-correlated-traffic.log 2>&1 || {
              tail -170 fixed-kernel-result/h1368-native-game4-correlated-traffic.log >&2
              exit 1
            }
          grep -Fq "H1368_NATIVE_GAME4_CORRELATED_REAL_BLACKHOLE_CAPTURED" \
            fixed-kernel-result/h1368-native-game4-correlated-traffic.log
          python3 -u tools/m0-plan028-h1368-arm64-game4-correlated-blackhole-audit.py \
            --art fixed-kernel-result --out fixed-kernel-result/h1368-l2-correlated-game4.json \
            | tee fixed-kernel-result/h1368-native-weaknet-audit.log
          python3 - <<'PY_GATE'
          import json,pathlib
          r=json.loads(pathlib.Path("fixed-kernel-result/h1368-l2-correlated-game4.json").read_text())
          assert r["original_product_source"]=="24e1fe6c4eab2a1abb7fb8a6d2093abaf57c0f73"
          assert r["original_TLS_port"]==443 and r["original_exact_all_client_stop"]
          assert r["kernel_drops_during"]["uplink"]["drops"]>100
          assert r["kernel_drops_during"]["downlink"]["drops"]>100
          assert r["classification"]=="PASS_SCOPED_NATIVE_ARM64_GAME4_REAL_CORRELATED_BLACKHOLE_RECOVERY",r["faults"]
          print("M0_PLAN028_H1368_ORIGINAL_GAME4_ACTUAL_BLACKHOLE_AND_RECOVERY_PASS",flush=True)
          PY_GATE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1368-native-arm64-game4-correlated-blackhole-${{ github.run_id }}
          path: |
            fixed-kernel-result/h1368-*.json
            fixed-kernel-result/h1368-*.log
            fixed-kernel-result/h1250-*.json
            fixed-kernel-result/h1250-product-*.log
            fixed-kernel-result/h1286-rapid-report.json
            fixed-kernel-result/h1301-netem-clock.json
            fixed-kernel-result/h1312-static-neighbour-*.json
            fixed-kernel-result/h1250-qdisc-after.txt
            fixed-kernel-result/h1250-qdisc-before.txt
          if-no-files-found: warn
          retention-days: 14
