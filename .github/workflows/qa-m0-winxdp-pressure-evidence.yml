name: M0 WinXDP pressure evidence readback
run-name: "M0 WinXDP small-packet TX and duplex incomplete diagnosis"
on:
  push:
    branches: ['experiment/m0-winxdp']
    paths: ['.github/workflows/qa-m0-winxdp-pressure-evidence.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read actual failed TCP flow and small-packet shutdown receipts
        shell: bash
        run: |
          set -euo pipefail
          gh run download 45847069325 -R "$GITHUB_REPOSITORY" -n winxdp-carrier-abba-S -D tcp
          for arm in J K L; do
            gh run download 45846110092 -R "$GITHUB_REPOSITORY" -n winxdp-udp-pressure-$arm -D "udp-$arm"
          done
          python3 - <<'PY'
          import json,pathlib,re
          for root in (pathlib.Path("tcp"),*(pathlib.Path("udp-"+x) for x in "JKL")):
              for p in root.rglob("*"):
                  if not p.is_file():continue
                  if root.name=="tcp" and p.name=="measurement.json":
                      d=json.loads(p.read_text(encoding="utf-8-sig"))
                      if d.get("arm")!="B":continue
                      b=d.get("server",{}).get("source") or {}
                      for i,(x,y) in enumerate(zip(d.get("flows",[]),b.get("flows",[]))):
                          print("TCP_FLOW",p.parent.name,i,json.dumps({"win":x,"linux":y},sort_keys=True))
                  if p.name in ("client.log","server.log"):
                      if root.name=="tcp" and not any(x in p.parts for x in ("case-5","case-6")):continue
                      if root.name.startswith("udp") and "fixed-rx4096-small" not in p.parts:continue
                      lines=p.read_text(errors="replace").splitlines()
                      hits=[l for l in lines if re.search(r'WBD_XDP_|worker rc|panic|BAD_STAGE|WAL|STOP|FEC.*(invalid|conflict)|OUTER_REPAIR|failed|error',l,re.I)]
                      print("FAIL_LOG",p)
                      print("\n".join(l[:1600] for l in hits[-35:]))
                      print("FINAL_LINES", "\n".join(l[:1000] for l in lines[-8:]))
          PY
