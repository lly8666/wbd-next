name: M0 WinXDP actual RSS queue steering
run-name: "M0 WinXDP 1.4 queue0 vs all queues real TCP | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-winxdp']
    paths: ['.github/workflows/qa-m0-winxdp-rss.yml', 'tools/m0_winxdp_rss_probe.cpp', 'tools/m0_winxdp_rss_guest.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-carrier:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install official production XDP runtime and compile SDK-v3 probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force h2442-out,result | Out-Null
          nuget install Microsoft.XDP-for-Windows.Runtime.x64 -Version 1.4.0 -OutputDirectory xdp-packages -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'official XDP runtime package unavailable'}
          nuget install Microsoft.XDP-for-Windows.Sdk -Version 1.4.0 -OutputDirectory xdp-packages -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'official XDP SDK package unavailable'}
          $runtime=(Get-ChildItem xdp-packages -Recurse -Filter xdp-setup.ps1 | Select-Object -First 1).Directory.FullName
          $include=(Get-ChildItem xdp-packages -Recurse -Filter xdpapi.h | Where-Object {$_.Directory.Name -eq 'include'} | Select-Object -First 1).Directory.FullName
          Get-FileHash "$runtime/xdp.sys","$runtime/xdp.cat" | Format-List | Out-File h2442-out/xdp-driver-hash.txt
          Get-AuthenticodeSignature "$runtime/xdp.cat" | Format-List | Out-File h2442-out/xdp-signature.txt
          & "$runtime/xdp-setup.ps1" -Install xdp
          if($LASTEXITCODE -ne 0){throw 'XDP installation failed'}
          $vs=& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cmd='call "'+$vs+'\VC\Auxiliary\Build\vcvars64.bat" && cl /nologo /O2 /EHsc /std:c++17 /I"'+$include+'" tools\m0_winxdp_rss_probe.cpp /Fe:h2442-out\winxdp-probe.exe ntdll.lib onecore.lib ws2_32.lib'
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'SDK-v3 native compilation failed'}
      - name: WSL stage 1 - bounded distro inventory
        id: wsl_inventory
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force result,h2442-out | Out-Null
          Write-Output 'H2476_WSL_INVENTORY_START'
          $known=((& python tools/m0_wl_windows_bounded_cmd.py 30 wsl.exe --list --quiet 2>&1 | Out-String) -replace '[\x00]','')
          $rc=$LASTEXITCODE
          $known | Set-Content result/h2476-distro-list.txt
          if($rc -ne 0){throw 'real WSL2 distro query unavailable'}
          $need=($known -notmatch '(?im)^\s*Ubuntu\s*$')
          "needs_import=$($need.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "H2476_WSL_INVENTORY_DONE needs_import=$need"
      - name: WSL stage 2 - official pinned image download
        if: steps.wsl_inventory.outputs.needs_import == 'true'
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          $img=Join-Path $env:RUNNER_TEMP 'ubuntu-24.04.5-wsl-amd64.tar'
          Write-Output 'H2476_WSL_DOWNLOAD_START'
          & python tools/m0_wl_windows_bounded_cmd.py 190 curl.exe --fail --location --connect-timeout 20 --max-time 180 --output $img 'https://releases.ubuntu.com/noble/ubuntu-24.04.5-wsl-amd64.wsl'
          if($LASTEXITCODE -ne 0){throw 'Ubuntu pinned download failed'}
          if((Get-FileHash $img -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bb415d824822c4b878125729af451a5d18fb13d1cf5cbed9a7393ad64ac6039e'){throw 'Ubuntu real image checksum mismatch'}
          Write-Output 'H2476_WSL_DOWNLOAD_HASH_PASS'
      - name: WSL stage 3 - file-backed import with one owned retry
        if: steps.wsl_inventory.outputs.needs_import == 'true'
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          python -u tools/m0_h2476_import_wsl.py
          if($LASTEXITCODE -ne 0){throw 'real Ubuntu WSL2 import failed'}
      - name: WSL stage 4 - bounded guest network startup
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          Write-Output 'H2476_WSL_BOOT_START'
          $lines=(& python tools/m0_wl_windows_bounded_cmd.py 35 wsl.exe -d Ubuntu -u root --exec ip -4 -o addr show dev eth0 2>&1 | Out-String)
          $rc=$LASTEXITCODE
          $lines | Set-Content result/h2476-guest-network.txt
          if($rc -ne 0){throw 'real independent Linux eth0 unavailable'}
          $m=[regex]::Match($lines,'\binet\s+(\d{1,3}(?:\.\d{1,3}){3})/')
          if(-not $m.Success){throw 'real Linux guest does not have its own IPv4'}
          $ip=$m.Groups[1].Value
          if($ip -match '^(127\.|0\.)'){throw 'guest source is not a networked Linux kernel'}
          $ip | Set-Content -Encoding ascii result/h1706-ubuntu-guest-ip.txt
          Write-Output "H2476_WSL_BOOT_DONE ip=$ip"
      - name: Compare the same 32 real TCP tuples on queue0 and all actual queues
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $route=(wsl.exe -d Ubuntu -u root --exec ip -4 route show default | Out-String)
          $hostIP=[regex]::Match($route,'via (\d+\.\d+\.\d+\.\d+)').Groups[1].Value
          $nic=Get-NetIPAddress -AddressFamily IPv4 -IPAddress $hostIP
          $adapter=Get-NetAdapter -InterfaceIndex $nic.InterfaceIndex
          $rss=Get-NetAdapterRss -Name $adapter.Name -ErrorAction SilentlyContinue
          $rss | Format-List * | Out-File h2442-out/rss.txt
          $adapter | Format-List * | Out-File h2442-out/adapter.txt
          $count=if($rss -and $rss.NumberOfReceiveQueues){[int]$rss.NumberOfReceiveQueues}else{0}
          Write-Output "RSS_OS_QUEUE_COUNT=$count"
          $guest=(Get-Content result/h1706-ubuntu-guest-ip.txt -Raw).Trim()
          $rule="M0-XDP-RSS-FIXTURE-"+$env:GITHUB_RUN_ID
          New-NetFirewallRule -Name $rule -DisplayName $rule -Direction Inbound -Action Allow -Protocol TCP -LocalAddress $hostIP -RemoteAddress $guest -LocalPort 39463,39464 | Out-Null
          $rows=@()
          try{
            foreach($mode in @('queue0','all')){
              $out="h2442-out/$mode"
              New-Item -ItemType Directory -Force $out | Out-Null
              $p=Start-Process -FilePath "$PWD/h2442-out/winxdp-probe.exe" -ArgumentList @($nic.InterfaceIndex,$hostIP,$mode,$count) -RedirectStandardOutput "$PWD/$out/probe.log" -RedirectStandardError "$PWD/$out/probe.err" -PassThru
              try{
                for($i=0;$i -lt 150;$i++){
                  if($p.HasExited){break}
                  if((Get-Content "$out/probe.log" -Raw) -match 'READY'){break}
                  Start-Sleep -Milliseconds 100
                }
                $guestRC=-1
                if(-not $p.HasExited -and (Get-Content "$out/probe.log" -Raw) -match 'READY'){
                  $script=(wsl.exe -d Ubuntu -u root --exec wslpath -a "$PWD/tools/m0_winxdp_rss_guest.py" | Out-String).Trim()
                  wsl.exe -d Ubuntu -u root --exec python3 $script $hostIP | Tee-Object "$out/guest.log"
                  $guestRC=$LASTEXITCODE
                }
                if(-not $p.WaitForExit(18000)){Stop-Process -Id $p.Id -Force;$p.WaitForExit()}
                $rows+=@{mode=$mode;guest=$guestRC;probe=$p.ExitCode}
              }finally{
                if(-not $p.HasExited){Stop-Process -Id $p.Id -Force}
                Get-Content "$out/probe.log","$out/probe.err" -ErrorAction SilentlyContinue
              }
            }
          } finally {Remove-NetFirewallRule -Name $rule}
          ConvertTo-Json -InputObject $rows | Tee-Object h2442-out/queue-comparison.json
          $all=$rows | Where-Object mode -eq 'all'
          if($all.guest -ne 0 -or $all.probe -ne 0){throw 'all-queue steering not qualified'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: winxdp-rss-qualification, path: 'h2442-out/', retention-days: 14}
