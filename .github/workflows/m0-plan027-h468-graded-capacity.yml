# H468: actual real native reports guard dispatches; reuse ONE original product build.
name: M0 PLAN027 H468 graded C100 Fixed30 300s and conditional C200
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h468-graded-capacity.yml]
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions: {contents: read, actions: write}
jobs:
  c100-fixed30-long:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-h468]') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Require source and ACTUAL C50 evidence, then three independent native Actions
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        shell: bash
        run: |
          set -euo pipefail
          product='a61eef334068512b00a1db3137a51f3d0489020c'
          build_run=41002998813
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)" = "$product"
          gh api "repos/$GH_REPO/actions/runs/$build_run/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/plan027-build-artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$product" "$RUNNER_TEMP/plan027-build-artifacts"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/plan027-build-artifacts"
          mkdir -p "$RUNNER_TEMP/c50"
          gh run download 41003834670 -R "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/c50"
          python - <<'PY'
          import json,os,pathlib
          from tools.m0_wl_perf_v2_config import read_scenario
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'c50/report.json').read_text())
          v=d['WL_V2']
          assert d['linux_binary_source']=='a61eef334068512b00a1db3137a51f3d0489020c' and d['mode_public']=='PASS_ACTUAL_WINDOWS_LINUX_NATIVE_normal'
          assert d['stop']=='PASS_BOTH_OWNED' and v['owned_stop']=='PASS_BOTH_OWNED'
          assert v['status']=='MEASURED_BOTH_OS_KERNEL' and v['scenario_id']=='plan027-c-normal-50m-25ms-loss0-60s'
          for side in ('windows','linux'):
              assert v['offered_mbps'][side]>=47.5 and v['first_delivery_fraction'][side]>=.99
              assert d['wl_n0_measured'][side]['invalid_packets']==0
          for file,mode,rate,delay,loss,duration in [
              ('scenarios/plan027-c-normal-100m-25ms-loss0-60s.json','normal',100,25,0,60),
              ('scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json','fixed',10,250,30,60),
              ('scenarios/plan027-c-normal-50m-25ms-loss0-300s.json','normal',50,25,0,300)]:
              c=read_scenario(file);assert c['public_mode']==mode and c['duration_s']==duration
              for side in ('windows_to_linux','linux_to_windows'):
                  assert (c[side]['offered_mbps'],c[side]['delay_ms'],c[side]['loss_pct'])==(rate,delay,loss)
              print('H468_SCENARIO_CHECKED',file,c['scenario_sha256'])
          print('H468_C50_GENUINE_CLOSED',v['first_delivery_fraction'],v['offered_mbps'])
          PY
          for entry in "normal scenarios/plan027-c-normal-100m-25ms-loss0-60s.json" "fixed scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json" "normal scenarios/plan027-c-normal-50m-25ms-loss0-300s.json"; do
            read -r mode file <<< "$entry"
            gh workflow run m0-wl-public-normal-full.yml --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_ab=false \
              -f perf_scenario_file="$file" \
              -f perf_reuse_run_id="$build_run" -f perf_binary_source_sha="$product"
            echo "H468_DISPATCHED $mode $file SAME_BINARY_SHA=$product"
          done
  c200-after-c100:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Check exact successful C100 report and decide C200 eligibility
        id: gate
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          PARENT_ID: "${{ github.event.workflow_run.id }}"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/c100"
          if ! gh run download "$PARENT_ID" -R "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/c100"; then
            echo 'H468_NO_C100_ARTIFACT; no escalation'
            exit 0
          fi
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'c100/report.json'
          if not p.exists():raise SystemExit('not a C100 report')
          d=json.loads(p.read_text());v=d.get('WL_V2') or {}
          if v.get('scenario_id')!='plan027-c-normal-100m-25ms-loss0-60s':
              print('H468_DIFFERENT_SCENARIO_NO_DISPATCH',v.get('scenario_id'))
              raise SystemExit(0)
          assert d['linux_binary_source']=='a61eef334068512b00a1db3137a51f3d0489020c'
          assert d['mode_public']=='PASS_ACTUAL_WINDOWS_LINUX_NATIVE_normal'
          assert d['stop']=='PASS_BOTH_OWNED' and v['owned_stop']=='PASS_BOTH_OWNED'
          assert v['status']=='MEASURED_BOTH_OS_KERNEL'
          for side in ('windows','linux'):
              assert v['offered_mbps'][side]>=95,('generator_capacity',side,v['offered_mbps'][side])
              assert v['first_delivery_fraction'][side]>=.99,('first_delivery',side,v['first_delivery_fraction'][side])
              assert d['wl_n0_measured'][side]['invalid_packets']==0
          print('H468_C100_MEASURED_ALLOWED_C200',v['offered_mbps'],v['first_delivery_fraction'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready=true\n')
          PY
      - name: One C200 Action only after measured C100 both sides within capacity
        if: steps.gate.outputs.ready == 'true'
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          c=read_scenario('scenarios/plan027-c-normal-200m-25ms-loss0-60s.json')
          assert c['public_mode']=='normal' and c['duration_s']==60
          for side in ('windows_to_linux','linux_to_windows'):
              assert (c[side]['offered_mbps'],c[side]['delay_ms'],c[side]['loss_pct'])==(200,25,0)
          print('H468_GATED_C200_SCENARIO',c['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --ref main \
            -f public_mode=normal -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-c-normal-200m-25ms-loss0-60s.json \
            -f perf_reuse_run_id=41002998813 -f perf_binary_source_sha=a61eef334068512b00a1db3137a51f3d0489020c
          echo H468_C200_DISPATCHED_AFTER_VERIFIED_C100
