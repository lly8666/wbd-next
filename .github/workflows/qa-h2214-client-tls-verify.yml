name: QA H2214 TLS verify switch Linux and Windows
on:
  push:
    branches: [qa/h2214-client-tls-verify-switch-20261119]
permissions: {contents: read}
jobs:
  linux:
    name: Native ${{ matrix.isa }} Linux Go TLS policy and production build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {isa: x86_64, runner: ubuntu-24.04}
          - {isa: aarch64, runner: ubuntu-24.04-arm}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.isa }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', cache: false}
      - name: Native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$WBD_PLAN029_LINUX_EXPECTED_ARCH"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc g++ nasm python3 iproute2 iputils-ping iptables openssl
      - name: Same-source native Rust Go production client and server plus switch tests
        shell: bash
        run: |
          set -euo pipefail
          bash tools/m0_plan029_linux_dual_native_build.sh > h2214-linux-build.log 2>&1 || { tail -n 150 h2214-linux-build.log; exit 1; }
          # The full native build script owns its exported CGO flags; restore them for the separate H2214 Go tests.
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go test -count=1 -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestH2214' ./internal/v4productcli)
          (cd legacy && go test -count=1 -run '^TestH2214ClientTLSCertificateValidationPolicy$' ./internal/realityfront)
          test -s linux-plan029-public-bundle/wbd-v4-client
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2214-linux-${{ matrix.isa }}-log
          path: h2214-linux-build.log
          retention-days: 7
          if-no-files-found: warn
  windows:
    name: Windows original Go CLI and real WinForms GUI self-test
    runs-on: windows-2025
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', cache: false}
      - name: Assemble original Go Windows product and test policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/prepare_windows_wiring.py
          if($LASTEXITCODE -ne 0){throw 'original-Go assembly failed'}
          # H2214 test is source-locked in manifest and assembled once.
          Push-Location legacy
          try{
            go test -count=1 -tags wbd_v4_embedded_go -run '^TestH2214' ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'Windows native TLS policy test failed'}
            go test -count=1 -run '^TestH2214ClientTLSCertificateValidationPolicy$' ./internal/realityfront
            if($LASTEXITCODE -ne 0){throw 'Windows TLS policy test failed'}
            go build -trimpath -tags wbd_v4_embedded_go -o ../wbd-client.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'Windows client compile failed'}
          }finally{Pop-Location}
      - name: Build pinned ISA-L Windows native dependency
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          choco install nasm -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'NASM install failed'}
          $nasm=@('C:\Program Files\NASM','C:\ProgramData\chocolatey\bin')|Where-Object {Test-Path (Join-Path $_ 'nasm.exe')}|Select-Object -First 1
          if(-not $nasm){throw 'NASM missing'}
          Add-Content -Path $env:GITHUB_PATH -Value $nasm
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          if($LASTEXITCODE -ne 0){throw 'ISA-L clone failed'}
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          if($LASTEXITCODE -ne 0){throw 'ISA-L pinned source missing'}
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsroot=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath|Select-Object -First 1
          if(-not $vsroot){throw 'Windows MSVC x64 tools missing'}
          $vcvars=Join-Path $vsroot 'VC\Auxiliary\Build\vcvars64.bat'
          if(-not (Test-Path $vcvars)){throw 'MSVC vcvars64 missing'}
          $cmd='call "'+$vcvars+'" && cd isa-l && nmake /f Makefile.nmake'
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'pinned ISA-L compilation failed'}
      - name: Build actual same-source Rust Windows DLL for GUI check-config
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'Rust 1.85.1 unavailable'}
          rustup target add x86_64-pc-windows-msvc --toolchain 1.85.1
          if($LASTEXITCODE -ne 0){throw 'Rust Windows MSVC target unavailable'}
          $lib=Get-ChildItem isa-l -Recurse -Filter isa-l_static.lib -File|Select-Object -First 1
          if(-not $lib){throw 'pinned ISA-L static library missing'}
          $env:WBD_ISAL_PREFIX=$lib.Directory.FullName
          $env:WBD_ISAL_SOURCE_SHA='c387163fcbca62701d646149564c550c78a4f985'
          $features='m0_v4_embedded_go,m0_v4_probe,fec2_product_record,native_fec_acceleration'
          cargo +1.85.1 build --locked --release -p wbd-engine --features $features
          if($LASTEXITCODE -ne 0){throw 'same-source Rust DLL failed'}
          New-Item -ItemType Directory -Force delivery/windows-amd64 | Out-Null
          Copy-Item target/release/wbd_engine.dll delivery/windows-amd64/wbd_engine.dll
          python -c 'import ctypes,os; d=ctypes.WinDLL(os.path.abspath("delivery/windows-amd64/wbd_engine.dll")); getattr(d,"wbd_m0_win_native_v3_start");print("H2214_SAME_SOURCE_WIN_NATIVE_DLL_EXPORT_PASS")'
          if($LASTEXITCODE -ne 0){throw 'same-source Rust DLL export missing'}
      - name: WinForms GUI compile and source-matched self-test
        shell: pwsh
        timeout-minutes: 17
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force delivery/windows-amd64|Out-Null
          Copy-Item wbd-client.exe delivery/windows-amd64/wbd-client.exe
          & ./tools/m0_plan028_h1640_win_gui_compile.ps1 -LegacyRoot legacy -OutputDirectory delivery/windows-amd64 -SourceSHA $env:GITHUB_SHA -Version H2214-TLS-QA
          if($LASTEXITCODE -ne 0){throw 'WinForms compile failed'}
          $dir=(Resolve-Path delivery/windows-amd64).Path
          $p=Start-Process -FilePath (Join-Path $dir 'WBD.exe') -ArgumentList '--self-test' -WorkingDirectory $dir -Wait -PassThru
          $receipt=Get-Content (Join-Path $dir 'gui-test-result.json') -Raw|ConvertFrom-Json
          if($p.ExitCode -ne 0 -or $receipt.result -ne 'PASS' -or $receipt.source_sha -ne $env:GITHUB_SHA){
            Write-Host ('H2214_GUI_SELFTEST_FAILURE: '+$receipt.error)
            Write-Host ('H2214_GUI_PASS_CHECKS_COUNT: '+@($receipt.checks).Count)
            throw 'real GUI self-test FAIL'
          }
          $catalog=Get-Content (Join-Path $dir 'PARAMETERS.json') -Raw|ConvertFrom-Json
          if($catalog.targets.'client-windows'.'tls-verify-server'.default_expression -ne 'false'){throw 'GUI default not OFF'}
          Write-Host ('H2214_GUI_REAL_SELFTEST_PASS '+@($receipt.checks).Count)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2214-windows-gui-policy-test
          path: |
            delivery/windows-amd64/gui-test-result.json
            delivery/windows-amd64/gui-fields.json
            delivery/windows-amd64/PARAMETERS.json
          retention-days: 7
          if-no-files-found: warn
