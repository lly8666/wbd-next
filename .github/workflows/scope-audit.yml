name: Central worker scope audit
run-name: "scope|${{ github.event.workflow_run.head_branch || github.ref_name }}|${{ github.event.workflow_run.head_sha || github.sha }}"
on:
  workflow_run:
    workflows: [Governance]
    types: [completed]
    branches:
      - 'work/**'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    name: "audit exact worker"
    if: github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'work/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout only the main-owned checker snapshot, never worker code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Audit only the completed worker Governance exact SOURCE
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          from tools import governance as g
          api=g.GitHub(os.environ['GITHUB_REPOSITORY'])
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          control=os.environ['GITHUB_SHA']
          branch=event['workflow_run']['head_branch']
          source=event['workflow_run']['head_sha']
          # Only one exact immutable SOURCE per completed worker Governance;
          # main pushes run the cheap tool regression suite elsewhere. Never
          # replay 4 x 512 historical API checks for every control commit.
          registry=api.file('.governance/registry.json',control)
          roles=[r for r in g.validate_registry(registry)
                 if r['branch']==branch and r['state']=='active'
                 and not r['global_writer']]
          if len(roles)!=1:raise SystemExit('event branch has no unique active worker')
          subprocess.run(['python','tools/scope_audit.py','--branch',branch,
                          '--source',source,'--control',control,
                          '--output',f'out/scope-{roles[0]["id"]}.json'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: central-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
