name: M0 P0 native component measurements
run-name: "M0|${{ github.sha }}|p0-native-component-perf"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0-native-component-perf.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/wbd-engine/tests/p0_native_components.rs"
      - "crates/wbd-codec/**"
      - "crates/wbd-platform/**"
      - "crates/wbd-types/**"
permissions:
  contents: read
concurrency:
  group: p0-native-component-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Compile exactly one release Rust native component test binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          cargo test --release --locked -p wbd-engine --test p0_native_components --no-run
          binary="$(find target/release/deps -maxdepth 1 -type f -name 'p0_native_components-*' -perm -u+x | head -n1)"
          test -n "$binary"
          mkdir p0-build
          cp "$binary" p0-build/perf.test
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          inputs=["Cargo.toml","Cargo.lock","rust-toolchain.toml",
             "crates/wbd-engine/tests/p0_native_components.rs",
             "crates/wbd-codec/src/record_crypto.rs","crates/wbd-codec/src/record_replay.rs",
             "crates/wbd-platform/src/linux_batch.rs","crates/wbd-platform/src/linux_rx_batch.rs",
             ".github/workflows/p0-native-component-perf.yml"]
          m={"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],
             "attempt":os.environ["GITHUB_RUN_ATTEMPT"],"target":"x86_64-unknown-linux-gnu",
             "rust":"1.85.1","profile":"release","binary_sha256":sha("p0-build/perf.test"),
             "inputs_sha256":{p:sha(p) for p in inputs},
             "scope":"P0_SCOPED_OBSERVATION_ONLY_NO_GO_V4_NO_AF_PACKET_NO_PRODUCT"}
          pathlib.Path("p0-build/manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: p0-build/
          retention-days: 30
          if-no-files-found: error
  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p0-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: p0-build/
      - name: Verify exact SOURCE and binary; measure two isolated cases sequentially in same job
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m=json.load(open("p0-build/manifest.json"))
          assert m["source_sha"]==os.environ["GITHUB_SHA"]
          assert m["run_id"]==os.environ["GITHUB_RUN_ID"]
          assert m["attempt"]==os.environ["GITHUB_RUN_ATTEMPT"]
          assert m["target"]=="x86_64-unknown-linux-gnu" and m["rust"]=="1.85.1"
          assert sha("p0-build/perf.test")==m["binary_sha256"]
          for p,s in m["inputs_sha256"].items(): assert sha(p)==s,p
          PY
          chmod +x p0-build/perf.test
          mkdir p0-result
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,re,resource,subprocess,time
          tests=[("aead","p0_aead_1000b_seal_verified_unique_open"),
                 ("linux_udp_batch","p0_linux_udp_sendmmsg_recvmmsg_batch32")]
          report=[]
          for label,case in tests:
              before=resource.getrusage(resource.RUSAGE_CHILDREN)
              start=time.monotonic_ns()
              p=subprocess.run(["./p0-build/perf.test","--exact",case,"--nocapture"],
                   text=True,capture_output=True,timeout=240,check=False)
              elapsed=time.monotonic_ns()-start
              after=resource.getrusage(resource.RUSAGE_CHILDREN)
              log=p.stdout+p.stderr
              pathlib.Path(f"p0-result/{label}.log").write_text(log)
              print(log)
              if p.returncode!=0: raise RuntimeError(f"{label} test failed: exit {p.returncode}")
              marker=re.search(r"P0_RESULT (\{[^\n]*\})",log)
              assert marker, f"missing measurement: {label}"
              a=json.loads(marker.group(1))
              assert a["ops"]>0 and a["business_bytes"]>0 and a["elapsed_ns"]>0
              assert all(a[k]>0 for k in ["sample_p50_ns","sample_p95_ns","sample_p99_ns"])
              assert a["sample_p50_ns"]<=a["sample_p95_ns"]<=a["sample_p99_ns"]
              assert a["qualifies_product"] is False
              r={"label":label,"sample":a,"child_cpu_user_s":after.ru_utime-before.ru_utime,
                 "child_cpu_system_s":after.ru_stime-before.ru_stime,
                 "child_cpu_total_s":(after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime),
                 "child_maxrss_kib_observed":after.ru_maxrss,
                 "wrapper_elapsed_ns":elapsed,"log_sha256":hashlib.sha256(log.encode()).hexdigest(),
                 "cpu_s_per_GiB_business":((after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime))*1024**3/a["business_bytes"]}
              report.append(r)
          cpuinfo=pathlib.Path("/proc/cpuinfo").read_text()
          model=next((x.split(":",1)[1].strip() for x in cpuinfo.splitlines() if x.startswith("model name")), "unknown")
          cgroup=pathlib.Path("/sys/fs/cgroup/cpu.max")
          m=json.load(open("p0-build/manifest.json"))
          result={"source_sha":m["source_sha"],"run_id":m["run_id"],"attempt":m["attempt"],
                  "binary_sha256":m["binary_sha256"],"status":"MEASURED_P0_NOT_PRODUCT_PASS",
                  "runner":os.environ.get("RUNNER_NAME"),"job":os.environ.get("GITHUB_JOB"),
                  "host":platform.uname()._asdict(),"cpu_model":model,
                  "cgroup_cpu_max":cgroup.read_text().strip() if cgroup.exists() else None,
                  "cases":report,"limitations":["single-host hosted CI timing subject to noise",
                   "AEAD+HP+PN replay 1000B payload not full stack",
                   "UDP sendmmsg/recvmmsg 32x256 fixture not AF_PACKET",
                   "not old/new paired A/B, no P1 product data plane",
                   "no 500Mbps capacity, no real business end-to-end p99"]}
          pathlib.Path("p0-result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p0-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: p0-result/
          retention-days: 30
          if-no-files-found: warn
