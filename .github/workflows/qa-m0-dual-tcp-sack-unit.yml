name: M0 dual Rust SACK compression native core tests
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths: ['.github/workflows/qa-m0-dual-tcp-sack-unit.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dffe77daa5adaeac89a86e48cd6730c4c67a655f
          persist-credentials: false
      - name: Native complete TCP core including first three gap ACKs, bounded SACK deadline and latest range regression
        run: |
          test "$(git rev-parse HEAD)" = "dffe77daa5adaeac89a86e48cd6730c4c67a655f"
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --lib v4_rust_tcp
