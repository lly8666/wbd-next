name: M0 x86 queue40 ABBA kernel versus C threshold
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths:
      - '.github/workflows/qa-m0-dual-tcp-x86-queue40-abba.yml'
      - '.github/workflows/qa-m0-dual-tcp-x86-path.yml'
      - 'tools/m0_dual_rust_tcp_local.py'
      - 'tools/m0_dual_rust_tcp_app.py'
permissions: {contents: read, actions: read}
jobs:
  compare:
    uses: ./.github/workflows/qa-m0-dual-tcp-x86-path.yml
    with:
      profile: 'queue40'
      order: 'ABBA'
