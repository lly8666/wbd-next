name: ARM64 OpenWrt musl and Android development builds
run-name: ARM64 targets ${{ github.sha }}
on:
  push:
    branches: [feature/arm64-linux-android-openwrt-autoaccel]
    paths:
      - '.github/workflows/arm64-android-openwrt-build.yml'
      - '.cargo/config.toml'
      - 'android/**'
      - 'native/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  openwrt-aarch64-musl:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: ARM64 musl compiler and native Rust client/server shared object
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq musl-tools
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add --toolchain 1.85.1 aarch64-unknown-linux-musl
          command -v musl-gcc
          export CC_aarch64_unknown_linux_musl=musl-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo +1.85.1 build --release --locked --target aarch64-unknown-linux-musl -p wbd-codec -p wbd-engine --features wbd-engine/m0_v4_embedded_go,wbd-engine/fec2_product_record
          file target/aarch64-unknown-linux-musl/release/libwbd_engine.so
          echo OPENWRT_ARM64_MUSL_BUILD_ONLY_PASS
      - name: Scope receipt
        if: always()
        run: |
          mkdir -p arm64-targets
          echo "SOURCE=$GITHUB_SHA, ARM64 OpenWrt musl build only, native target OS/TUN NOT_RUN" >arm64-targets/openwrt.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-openwrt-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-targets/
          retention-days: 14

  android-arm64-ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: NDK aarch64 Rust core cross-build, no Android VPN qualification
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add --toolchain 1.85.1 aarch64-linux-android
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$ndk"
          cc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$cc"
          export CC_aarch64_linux_android="$cc"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$cc"
          cargo +1.85.1 build --release --locked --target aarch64-linux-android -p wbd-codec -p wbd-engine
          file target/aarch64-linux-android/release/libwbd_engine.so
          echo ANDROID_ARM64_RUST_CORE_CROSS_BUILD_ONLY_PASS

  android-vpnservice-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Kotlin Android VpnService compile-only, no native JNI
        shell: bash
        run: |
          set -euo pipefail
          cd android
          gradle --no-daemon :app:assembleDebug
          echo ANDROID_VPNSERVICE_KOTLIN_BUILD_ONLY_NOT_CONNECTED
