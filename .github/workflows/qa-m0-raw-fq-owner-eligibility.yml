name: M0 native RAW FQ earlier eligibility and close lifetime
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths:
      - '.github/workflows/qa-m0-raw-fq-owner-eligibility.yml'
      - 'tools/m0_raw_fq_owner_eligibility.py'
permissions: {contents: read}
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Native kernel FQ socket and accepted future data lifetime
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$NATIVE_ARCH"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 ethtool iputils-ping
          python3 -m py_compile tools/m0_raw_fq_owner_eligibility.py
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" python3 -u tools/m0_raw_fq_owner_eligibility.py
      - name: Preserve owned evidence
        if: always()
        run: |
          if test -d fq-owner-out;then sudo chown -R "$(id -u):$(id -g)" fq-owner-out;fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "fq-owner-${{ matrix.arch }}", path: fq-owner-out/, if-no-files-found: warn, retention-days: 14}
