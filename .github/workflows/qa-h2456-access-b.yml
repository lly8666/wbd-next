name: H2456 native Windows access feasibility B
run-name: "H2456 no-WSL access candidates B | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-linux-tcp-splice']
    paths: ['.github/workflows/qa-h2456-access-b.yml']
permissions: {contents: read, actions: read}
jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 22
    permissions: {contents: read, actions: read, id-token: write}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: h2456-arm-${{ github.run_id }}
      - name: Install native ZeroTier on isolated ARM runner
        continue-on-error: true
        timeout-minutes: 5
        run: |
          curl -fsSL --max-time 40 https://install.zerotier.com -o "$RUNNER_TEMP/zt-install.sh"
          sudo bash "$RUNNER_TEMP/zt-install.sh"
          sudo systemctl start zerotier-one
      - name: Create temporary two-member Ethernet and routed origin
        run: |
          set -euo pipefail
          mkdir -p h2456-peer h2456-out
          for i in $(seq 1 100);do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n h2456-win-identity -D h2456-peer >/dev/null 2>&1 && break
            sleep 5
          done
          test -s h2456-peer/identity.json
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA,PATH python3 tools/m0_h2456_access.py arm h2456-peer/identity.json
          sudo chown -R "$(id -u):$(id -g)" h2456-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: h2456-arm-ready, path: h2456-out/ready.json, retention-days: 3}
      - name: Hold actual ARM route and echo until Windows receipt
        run: |
          for i in $(seq 1 72);do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n h2456-win-result -D h2456-peer/result >/dev/null 2>&1 && break
            sleep 5
          done
          sudo tc -s qdisc show >h2456-out/arm-qdisc-final.txt
          sudo ip -s -j link show >h2456-out/arm-links-final.json
          sudo zerotier-cli peers >h2456-out/zt-peers.txt 2>&1 || true
          test -s h2456-peer/result/windows-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: h2456-arm-evidence, path: h2456-out/, retention-days: 14}
  windows:
    runs-on: windows-2025
    timeout-minutes: 22
    permissions: {contents: read, actions: read, id-token: write}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: h2456-native-win-${{ github.run_id }}
      - name: Install native ZeroTier on Windows (no WSL)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $msi=Join-Path $env:RUNNER_TEMP 'zt.msi'
          Invoke-WebRequest -Uri 'https://download.zerotier.com/dist/ZeroTier%20One.msi' -OutFile $msi -TimeoutSec 75
          $s=Get-AuthenticodeSignature $msi
          if($s.Status -ne 'Valid'){throw 'ZeroTier official MSI signature not valid'}
          $p=Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){throw "MSI exit $($p.ExitCode)"}
      - name: Publish exact native node identities (no tokens)
        shell: pwsh
        run: |
          python -m py_compile tools/m0_h2456_access.py
          python tools/m0_h2456_access.py identity
          if($LASTEXITCODE -ne 0){throw 'identity failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: h2456-win-identity, path: h2456-out/identity.json, retention-days: 3}
      - name: Full public-run signed original Npcap driver install
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'wl-public-real'
          $drv=Join-Path $root 'npcap'
          $usr=Join-Path $root 'user'
          New-Item -ItemType Directory -Force $root,$drv,$usr,result/wl-public | Out-Null
          $zip=Join-Path $root 'npcap-test.zip'
          # External vendor/CDN 504s must not be interpreted as native
          # Npcap/Wintun product failures. Retry only byte downloads; exact
          # pinned SHA256 plus original Authenticode checks remain unchanged.
          function Get-PinnedPublicNativeDriverPackage([string]$Uri,[string]$Destination){
            for($attempt=1;$attempt -le 5;$attempt++){
              try {
                Invoke-WebRequest -UseBasicParsing -Uri $Uri -OutFile $Destination -TimeoutSec 65 -ErrorAction Stop
                if(-not (Test-Path -LiteralPath $Destination)){throw 'signed package download absent'}
                return
              }catch{
                Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
                Write-Output ('PLAN028_EXTERNAL_SIGNED_DRIVER_DOWNLOAD_RETRY attempt='+$attempt+' status='+$_.Exception.GetType().Name)
                if($attempt -eq 5){throw}
                Start-Sleep -Seconds ([Math]::Min(24,4*$attempt))
              }
            }
          }
          Get-PinnedPublicNativeDriverPackage 'https://github.com/user-attachments/files/32200327/npcap.zip' $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6380ebe6d5b06bbb0dc03a43151ee05a4a25be97efebd742c463e0e466621a32'){throw 'approved old driver package hash changed'}
          Expand-Archive $zip $drv -Force
          $installer=Join-Path $root 'npcap-1.88.exe'
          Get-PinnedPublicNativeDriverPackage 'https://npcap.com/dist/npcap-1.88.exe' $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2f4ec1e5ea353ff67efd24b2ebf081ba44532410fae8d5e146af0310aa4f56b'){throw 'official Npcap hash changed'}
          $sg=Get-AuthenticodeSignature $installer
          if($sg.Status -ne 'Valid' -or $sg.SignerCertificate.Subject -notmatch 'Nmap Software LLC'){throw 'official Npcap invalid signature'}
          & 7z x -y "-o$usr" $installer | Out-File result/wl-public/npcap-extract.log
          if($LASTEXITCODE -ne 0){throw 'Npcap DLL extraction failed'}
          & ./tools/m0_wl_npcap_driver_ci.ps1 -Action Install -DriverPackageDir $drv -UserlandExtractDir $usr 2>&1 |
            Tee-Object result/wl-public/npcap-install.log
          if((Get-Service npcap -ErrorAction Stop).Status -ne 'Running'){throw 'Npcap real kernel service not running'}
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/wpcap.dll" -Destination result/wl-public/wpcap.dll
          Copy-Item -LiteralPath "$env:WINDIR/System32/Npcap/Packet.dll" -Destination result/wl-public/Packet.dll
      - name: Test native Tailscale and routed ZeroTier NPF in both directions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force h2456-peer | Out-Null
          for($i=0;$i -lt 100;$i++){
            gh run download $env:GITHUB_RUN_ID -R $env:GITHUB_REPOSITORY -n h2456-arm-ready -D h2456-peer 2>$null
            if($LASTEXITCODE -eq 0){break}
            Start-Sleep -Seconds 5
          }
          if(!(Test-Path h2456-peer/ready.json)){throw 'ARM ready missing'}
          python -u tools/m0_h2456_access.py windows h2456-peer/ready.json
          if($LASTEXITCODE -ne 0){throw 'probe failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: h2456-win-result, path: h2456-out/windows-result.json, retention-days: 14, if-no-files-found: warn}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: h2456-win-evidence, path: h2456-out/, retention-days: 14}
