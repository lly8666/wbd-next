name: M0 PLAN027 H567 exact-source525 C100 stable-long and cancelled Game FEC once
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h567-recovered-c-and-game-once.yml]
permissions: {contents: read, actions: write}
jobs:
  gated-native-scenes:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h567-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify exact previously proven C50 and frozen binaries before four independent scenarios
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          src=52566af216edf9dee4068f0bb8bfd0fb8d18dfcb
          build=41166008870
          c50=41167357685
          test "$(gh api "repos/$GH_REPO/actions/runs/$build" --jq .head_sha)" = "$src"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$c50" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$build/artifacts" --jq '.artifacts[].name' > "$RUNNER_TEMP/build-artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$src" "$RUNNER_TEMP/build-artifacts"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/build-artifacts"
          mkdir -p "$RUNNER_TEMP/c50"
          gh run download "$c50" --repo "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/c50"
          export C50_REPORT_ROOT="$RUNNER_TEMP/c50"
          python3 - <<'PY'
          import json,os,pathlib
          from tools.m0_wl_perf_v2_config import read_scenario
          src='52566af216edf9dee4068f0bb8bfd0fb8d18dfcb'
          root=pathlib.Path(os.environ['C50_REPORT_ROOT'])
          r=json.loads((root/'report.json').read_text())
          q=read_scenario('scenarios/plan027-c-normal-50m-25ms-loss0-60s.json')
          assert r['linux_binary_source']==src and r['stop']=='PASS_BOTH_OWNED'
          assert r['mode_public']=='PASS_ACTUAL_WINDOWS_LINUX_NATIVE_normal'
          assert r['WL_V2']['status']=='MEASURED_BOTH_OS_KERNEL'
          assert r['WL_V2']['scenario_sha256']==q['scenario_sha256']
          assert all(r['WL_V2']['first_delivery_fraction'][x]>=.999 for x in ('windows','linux'))
          for p,mode,duration,rate in (
            ('scenarios/plan027-c-normal-100m-25ms-loss0-60s.json','normal',60,100),
            ('scenarios/plan027-c-normal-50m-25ms-loss0-300s.json','normal',300,50),
            ('scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json','game2-fec',20,10),
            ('scenarios/wl-game4-fixed6-10m-75ms-loss30-20s.json','game4-fec',20,10)):
              s=read_scenario(p)
              assert s['public_mode']==mode and s['duration_s']==duration
              assert all(s[k]['offered_mbps']==rate for k in ('windows_to_linux','linux_to_windows'))
              print('H567_EXACT_SCENE',p,s['scenario_sha256'])
          print('H567_VERIFIED_TRUE_C50_SOURCE525_FIRST_STOP')
          PY
          # Each line submits ONE independent hosted Windows/Linux real product
          # measurement Action; the new Linux Actions watchdog is a separate
          # nonmeasurement guard for a frozen Windows WSL2 host.
          while read -r mode scene; do
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode="$mode" -f run_n0=false  \
              -f perf_scenario_file="$scene" \
              -f perf_reuse_run_id="$build" -f perf_binary_source_sha="$src"
            echo "H567_ONE_SCENE_DISPATCHED mode=$mode path=$scene original_source=$src"
          done <<'EOF'
          normal scenarios/plan027-c-normal-100m-25ms-loss0-60s.json
          normal scenarios/plan027-c-normal-50m-25ms-loss0-300s.json
          game2-fec scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json
          game4-fec scenarios/wl-game4-fixed6-10m-75ms-loss30-20s.json
          EOF
          echo H567_FOUR_INDEPENDENT_ORIGINAL_FROZEN_SCENES_ONLY
