name: M0 PLAN028 x86 Normal Fixed6 second physical Go TLS under real tc30 delay250, Game4 healthy
run-name: PLAN028 H1220 FINAL native x86 Normal Fixed6 original TLS under tc30 delay250 and exact Stop
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-x86-normalfixed6-30pct250ms-second-handover.yml"
      - "tools/m0-plan028-x86-normalfixed6-30pct250ms-second-handover-fixture.py"
      - "r0/go_overlay/internal/realityfront/admission_v4_test.go"
      - "r0/go_overlay/internal/v4productcli/game_linux.go"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-x86-one443-normal-game2-game4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Pin original Go+Rust and assemble one complete X86_64 SOURCE
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test ! -e r0/go_overlay/internal/realityfront/v4_route_prelude.go
          mkdir -p fixed-build fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path.cwd(); donor=root/"legacy"
          rec=json.loads((root/"fixed-kernel-result/assembly.json").read_text(encoding="utf-8"))
          assert rec["overlay_source"]==os.environ["GITHUB_SHA"]
          assert rec["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in (
                      "admission_v4_test.go","v4_tls_handshake_contract_test.go"):
                      continue
                  dst=donor/part/src.name
                  if dst.exists():
                      assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              p=root/"r0/go_overlay/internal/faketcp"/name
              dst=donor/"internal/faketcp"/name
              assert not dst.exists(),str(dst)
              dst.write_bytes(p.read_bytes())
          # Test-only current-source V4 CLI config, not a second Go product.
          src=root/"r0/go_overlay/internal/v4productcli/secret_linux_test.go"
          dst=donor/"internal/v4productcli/secret_linux_test.go"
          if dst.exists():
              assert dst.read_bytes()==src.read_bytes()
          else:
              dst.write_bytes(src.read_bytes())
          for role in ("client","server"):
              dest=donor/("cmd/wbd-v4-"+role)
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"main.go").write_bytes((root/("r0/go_overlay/cmd/wbd-v4-"+role+"/main.go")).read_bytes())
          assert not (donor/"internal/realityfront/v4_route_prelude.go").exists()
          print("M0_PLAN028_X86_64_NATIVE_TLS_EXACT_SOURCE_ASSEMBLED source="+os.environ["GITHUB_SHA"],flush=True)
          PY
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-build.log 2>&1 || {
            tail -110 fixed-kernel-result/rust-build.log >&2
            exit 1
          }
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^(TestPLAN028SharedNormalPerClientFECProtectedCapability|TestPLAN028MixedOne443OriginalProtectedNormalGame2Game4ColdPolicy|TestR0V4ActualProtectedPeerHandshakeAllCiphers)$' ./internal/realityfront) >fixed-kernel-result/plan028-h1151-protected-policy-unit.log 2>&1 || {
            tail -120 fixed-kernel-result/plan028-h1151-protected-policy-unit.log >&2
            exit 1
          }
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestPLAN028OriginalPublicRecordCipherClientScope$' ./internal/v4productcli) >>fixed-kernel-result/plan028-h1151-protected-policy-unit.log 2>&1 || {
            tail -120 fixed-kernel-result/plan028-h1151-protected-policy-unit.log >&2
            exit 1
          }
          for marker in \
            "--- PASS: TestPLAN028SharedNormalPerClientFECProtectedCapability" \
            "--- PASS: TestPLAN028MixedOne443OriginalProtectedNormalGame2Game4ColdPolicy" \
            "--- PASS: TestR0V4ActualProtectedPeerHandshakeAllCiphers" \
            "--- PASS: TestPLAN028OriginalPublicRecordCipherClientScope";do
            grep -Fq -- "$marker" fixed-kernel-result/plan028-h1151-protected-policy-unit.log
          done
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,struct
          root=pathlib.Path("fixed-build")
          assert platform.machine()=="x86_64"
          sha={}
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62,name
              sha[name]=hashlib.sha256(b).hexdigest()
          m={"source_sha":os.environ["GITHUB_SHA"],"original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
             "architecture":"native_x86_64","go":"1.23.12","rust":"1.85.1",
             "sha256":sha,"qualification":"BUILD_ONLY_UNTIL_MIXED_NORMAL_ORIGINAL_TLS_NATIVE_REAL_IO"}
          (root/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print("M0_PLAN028_H1151_NATIVE_X86_64_ORIGINAL_GO_RUST_TLS_BUILD_PASS",flush=True)
          PY
      - name: One genuine x86/x86 original TLS443 Normal Auto + Game2 + Game4 FEC6 and exact Rust Stop
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 && test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          bash -n tools/m0-plan028-mixed-normal-game-native.sh
          python3 tools/m0-plan028-x86-normalfixed6-30pct250ms-second-handover-fixture.py "$RUNNER_TEMP/h1204-x86-normal-fixed6-30delay250.sh"
          bash -n "$RUNNER_TEMP/h1204-x86-normal-fixed6-30delay250.sh"
          bash "$RUNNER_TEMP/h1204-x86-normal-fixed6-30delay250.sh" fixed-build \
            >fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log 2>&1 || {
              tail -210 fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log >&2
              exit 1
            }
          grep -Fq "M0_PLAN028_H1204_X86_NORMAL_FIXED6_REAL_TC30_SECOND_REAUTH_PASS" fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log
          grep -Fq "M0_PLAN028_H1204_X86_NORMAL_FIXED6_NETEM30_DELAY250_NATIVE_DROP_AND_CLEAN_STOP_PASS" fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log
          grep -Fq "M0_PLAN028_H1151_X86_ORIGINAL_TLS_ONE443_NORMAL_GAME2_GAME4_FEC6_48_REAL_UDP_EXACT_STOP_PASS" \
            fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"] and m["architecture"]=="native_x86_64"
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62
              assert hashlib.sha256(b).hexdigest()==m["sha256"][name]
          n=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1204-normal-fixed6-two-source4.json").read_text())
          assert n["physical_source4_sequence"]==["10.25.0.4","10.25.0.9","10.25.0.4"]
          assert n["normal_fixed6_authenticated_generations"][:2]==[1,2] and n["normal_fixed6_authenticated_generations"][-1]>=3 and n["old_normal_exact_stops"]==[1,2]
          assert n["game4_generation_unchanged"] and n["game4_live_UDP_during_both"]==[32,320]
          assert n["normal_new_generation_udp"]==[16,16] and n["same_tunnel_IP"]
          assert n["outer_user_mtu"]==1460 and n["inner_mtu_new"]<n["inner_mtu_original"]
          assert n["sibling_game4_inner_mtu"]==1358
          loss=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1204-normal-fixed6-netem30delay250-rtt.json").read_text())
          assert loss["physical_qdisc_netem_loss_pct"]==30 and loss["physical_qdisc_delay_ms"]==250
          assert loss["loss_injection_stage"]=="DURING_NORMAL_GEN3_TLS_REAUTH"
          assert loss["native_inner_udp_sent"]==200 and 90<=loss["native_inner_udp_received"]<=200
          assert loss["received_only_rtt_p99_ms"]>=0 and loss["max_delivery_gap_ms"]<3000
          assert loss["physical_qdisc_dropped_packets"]>0 and loss["real_qdisc_removed"] and loss["physical_qdisc_after"]["restored"]
          p=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1151-mixed-one443.json").read_text())
          assert p["server_port"]==443 and len(set(p["distinct_authenticated_client_ips"]))==3
          assert p["native_peers"]==["game2-off-ChaCha","game4-fixed6-AES256","normal-fixed6-AES128"]
          assert p["real_udp_echoes"]=={"game2":12,"game4":18,"normal":18}
          assert p["game2_stop_did_not_stop_game4_or_normal"] and p["shared_rust_tun_reader_final_stop"]
          print("M0_PLAN028_H1151_NATIVE_X86_ORIGINAL_ONE443_MIXED_COEXIST_REAL_48_UDP_SOURCE_SHA_PASS")
          PY
          cat fixed-kernel-result/plan028-h1151-mixed-one443.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-h1204-native-x86-normal-fixed6-tc30delay250-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/assembly.json
            fixed-kernel-result/plan028-h1151-protected-policy-unit.log
            fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log
            fixed-kernel-result/plan028-h1151-mixed-one443.json
            fixed-kernel-result/plan028-h1204-normal-fixed6-two-source4.json
            fixed-kernel-result/plan028-h1204-normal-fixed6-netem30delay250-rtt.json
            fixed-kernel-result/plan028-h1204-netem-before.txt
            fixed-kernel-result/plan028-h1204-netem-during.txt
            fixed-kernel-result/plan028-h1204-netem-after.txt
            fixed-kernel-result/plan028-h1151-alice-tun.json
            fixed-kernel-result/plan028-h1151-bob-tun.json
            fixed-kernel-result/plan028-h1151-carol-tun.json
            fixed-kernel-result/plan028-h1151-server-tun.json
          if-no-files-found: warn
          retention-days: 14
