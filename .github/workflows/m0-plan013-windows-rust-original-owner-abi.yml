name: M0 PLAN013 real native Windows Rust original Go owner lifecycle ABI
run-name: "M0|WINDOWS-RUST-OWNER-ABI|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan013-windows-rust-original-owner-abi.yml"
      - "crates/wbd-engine/src/v4_windows_owner.rs"
      - "crates/wbd-engine/src/v4_owner_crypto.rs"
      - "crates/wbd-engine/src/lib.rs"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_private_owner.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_private_owner_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_dual_test.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_wintun_lease.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_scoped_client.go"
      - "r0/go_overlay/internal/windowsownerlease/created_wintun_windows.go"
      - "r0/go_overlay/internal/windowsownerlease/created_wintun_windows_test.go"
      - "r0/go_overlay/internal/windowsownerlease/original_go_tls_join_windows_test.go"
      - "r0/go_overlay/internal/windowsownerlease/scoped_original_tls_native_wintun_windows.go"
      - "docs/devlog/M0/PLAN020-S598-exact-parallel-Windows-action-trigger-20261021.md"
      - "docs/devlog/M0/PLAN020-S615-true-TLS-Rust-M3-native-kernel-parallel-Actions-trigger-20261021.md"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: m0-plan013-windows-original-owner-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-windows-real-rust-owner:
    runs-on: windows-2022
    timeout-minutes: 28
    env:
      # AWS-LC v0.45 pinned Windows x64 non-FIPS prebuilt NASM object path;
      # avoids dependence on runner-global nasm.exe and no-ASM crypto regressions.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wbd-next
          ref: b53b5dac422a634cdd82178a29071f9f9f0ae5e7
          path: frozen-m4
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Pin original legacy / worker Windows Go source without rerunning accepted M4 native scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path windows-owner-result | Out-Null
          @'
          import json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          main=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert main==os.environ["GITHUB_SHA"]
          ref="b53b5dac422a634cdd82178a29071f9f9f0ae5e7"
          assert subprocess.check_output(["git","-C","frozen-m4","rev-parse","HEAD"],text=True).strip()==ref
          m=json.loads((root/"frozen-m4/r0/go_overlay/assembly/manifest.json").read_text(encoding="utf8"))
          assert m["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          print("M0_PLAN013_WINDOWS_GO_M4_FROZEN_SHA_OWNERSHIP_VERIFIED")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'frozen Windows M4 producer not exact SOURCE'}
      - name: Native Windows 2022 actual x64 Rust MSVC target toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) {throw 'exact pinned Rust toolchain absent'}
          $v=& rustc +1.85.1 --version
          if ($v -notmatch '^rustc 1.85.1 ') {throw "wrong toolchain: $v"}
          rustup target add x86_64-pc-windows-msvc --toolchain 1.85.1
          if ($LASTEXITCODE -ne 0) {throw 'missing actual native Windows MSVC rust target'}
      - name: Actual Rust original M1/M3 owner prepare commit Stop staging generation native Windows tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go --lib v4_windows_owner::tests -- --nocapture 2>&1 | Tee-Object -FilePath windows-owner-result/native-tests.log
          if ($LASTEXITCODE -ne 0) {throw 'actual Windows original Rust owner lifecycle tests FAIL'}
          $log=Get-Content windows-owner-result/native-tests.log -Raw
          foreach ($test in @('m0_windows_owner_real_native_prepare_commit_stop_generation_scoped','m0_windows_owner_role_fec2_bad_handoff_stale_and_prevent_public_apply',
                   'm0_windows_authenticated_generation_real_wintun_lease_stop_fence_and_stale',
                   'm0_windows_owner_v3_real_m1_m3_aead_pn_replay_and_generation')) {
            if ($log -notmatch ('test .*'+[regex]::Escape($test)+'.* ok')) {throw "native Rust test NOT_RUN $test"}
          }
      - name: Build actual Windows Rust DLL and inspect external C FFI without simulated native products
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_embedded_go
          if ($LASTEXITCODE -ne 0) {throw 'native Rust DLL build failed'}
          @'
          import ctypes,hashlib,json,os,pathlib
          p=pathlib.Path("target/release/wbd_engine.dll")
          assert p.is_file() and p.stat().st_size>100000,"native MSVC DLL missing"
          dll=ctypes.WinDLL(str(p.resolve()))
          names=("wbd_m0_win_owner_v1_query","wbd_m0_win_owner_v1_prepare","wbd_m0_win_owner_v1_stage","wbd_m0_win_owner_v1_abort",
                 "wbd_m0_win_owner_v1_commit","wbd_m0_win_owner_v1_state",
                 "wbd_m0_win_owner_v1_stop","wbd_m0_win_owner_v1_release",
                 "wbd_m0_win_owner_v2_bind_wintun","wbd_m0_win_owner_v2_quiesce_wintun",
                 "wbd_m0_win_owner_v2_device_state",
                 "wbd_m0_win_owner_v3_seal_normal_off","wbd_m0_win_owner_v3_open_normal_off")
          for name in names:assert getattr(dll,name,None) is not None,name
          class S(ctypes.Structure):
              _fields_=[(name,ctypes.c_uint32) for name in ("version","size","generation","phase","server","applied","loans_drained","reserved")]
          q=dll.wbd_m0_win_owner_v1_query
          q.argtypes=[ctypes.POINTER(S),ctypes.c_uint32];q.restype=ctypes.c_int32
          state=S()
          assert q(ctypes.byref(state),ctypes.sizeof(state))==0
          assert (state.version,state.size,state.generation,state.phase,state.applied,state.loans_drained)==(1,32,0,0,0,0)
          assert q(ctypes.byref(state),16)==1
          prep=dll.wbd_m0_win_owner_v1_prepare
          prep.argtypes=[ctypes.c_void_p,ctypes.c_size_t,ctypes.c_void_p,ctypes.c_size_t,ctypes.c_uint32,ctypes.POINTER(ctypes.c_uint64)]
          prep.restype=ctypes.c_int32
          token=ctypes.c_uint64(0)
          assert prep(None,248,None,32,0,ctypes.byref(token))==1
          assert token.value==0
          commit=dll.wbd_m0_win_owner_v1_commit
          commit.argtypes=[ctypes.c_uint64,ctypes.c_uint32,ctypes.c_uint32,ctypes.c_uint32]
          commit.restype=ctypes.c_int32
          assert commit(0,0,0,1)==2
          stop=dll.wbd_m0_win_owner_v1_stop
          stop.argtypes=[ctypes.c_uint64];stop.restype=ctypes.c_int32
          assert stop(0)==2
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          receipt=dict(schema_version=1,role_id="M0",source_sha=os.environ["GITHUB_SHA"],
             rust_native_target="x86_64-pc-windows-msvc",rust_toolchain="1.85.1",
             original_go_sha="a7a82db31fe736ffedee330795a3234d358f1984",
             m4_frozen_sha="b53b5dac422a634cdd82178a29071f9f9f0ae5e7",
             run_id=int(os.environ["GITHUB_RUN_ID"]),attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
             dll_sha256=sha,abi_version=1,exported_symbols=names,
             native_owner_tests="PASS_SCOPED",ffi_live_dll_calls="PASS_SCOPED",
             original_go_verified_tls_callback="NOT_RUN",windows_M4_real_device="NOT_RUN",
             windows_product_applied="OFF",windows_WFP_default_capture="NOT_RUN",
             stop_quiesced_rust_loans="PASS_SCOPED_NO_NATIVE_DRIVER",physical="NOT_RUN",
             windows_product="NOT_QUALIFIED")
          pathlib.Path("windows-owner-result/receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("M0_PLAN013_WINDOWS_RUST_ORIGINAL_OWNER_NATIVE_DLL_AND_C_ABI_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'actual native Windows Rust C ABI DLL call failed'}
      - name: Compile and exercise actual original Go credential-verified V4 TLS into same native Windows Rust DLL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          legacy=root/"legacy";overlay=root/"frozen-m4"
          m4="b53b5dac422a634cdd82178a29071f9f9f0ae5e7"
          original="a7a82db31fe736ffedee330795a3234d358f1984"
          assert subprocess.check_output(["git","-C",str(legacy),"rev-parse","HEAD"],text=True).strip()==original
          assert subprocess.check_output(["git","-C",str(overlay),"rev-parse","HEAD"],text=True).strip()==m4
          manifest=json.loads((overlay/"r0/go_overlay/assembly/manifest.json").read_text(encoding="utf8"))
          assert manifest["legacy_source"]==original
          def blob(raw):return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          for item in manifest["operations"]:
              if item["kind"]=="replace":
                  raw=subprocess.check_output(["git","-C",str(legacy),"show",original+":"+item["path"]])
                  assert blob(raw)==item["original_blob"]
                  p=legacy/item["path"];assert p.is_file();p.write_bytes(raw)
              overlay_path=item.get("overlay_path")
              if overlay_path:
                  raw=subprocess.check_output(["git","-C",str(overlay),"show",m4+":"+overlay_path])
                  assert blob(raw)==item["result_blob"]
                  p=overlay/overlay_path;assert p.is_file();p.write_bytes(raw)
          print("M0_WIN_GO_PINNED_M4_OVERLAY_AND_LEGACY_EXACT_GIT_BYTES")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'original Go/M4 frozen assembly objects not pinned'}
          & python frozen-m4/r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root frozen-m4 --manifest frozen-m4/r0/go_overlay/assembly/manifest.json --receipt windows-owner-result/go-assembly.json
          if ($LASTEXITCODE -ne 0) {throw 'original Windows Go assembly failed'}
          @'
          import os,pathlib,subprocess
          root=pathlib.Path.cwd()
          src=root/"r0/go_overlay/internal/realityfront"
          dest=root/"legacy/internal/realityfront"
          for filename in ("admission_v4.go","admission_v4_test.go",
                           "bridge_v4_windows_private_owner.go","bridge_v4_windows_private_owner_test.go",
                           "bridge_v4_windows_dual_test.go","bridge_v4_windows_wintun_lease.go",
                           "bridge_v4_windows_scoped_client.go"):
              relative="r0/go_overlay/internal/realityfront/"+filename
              payload=subprocess.check_output(["git","show",os.environ["GITHUB_SHA"]+":"+relative])
              assert not (dest/filename).exists(),"exact pinned old-Go/M4 assembly already owns this file; no competing author"
              (dest/filename).write_bytes(payload)
          for filename in ("created_wintun_windows.go","created_wintun_windows_test.go",
                           "original_go_tls_join_windows_test.go",
                           "scoped_original_tls_native_wintun_windows.go"):
              relative="r0/go_overlay/internal/windowsownerlease/"+filename
              destdir=root/"legacy/internal/windowsownerlease"
              destdir.mkdir(parents=True,exist_ok=True)
              path=destdir/filename
              assert not path.exists(),"foreign preexisting native M4 Go package"
              path.write_bytes(subprocess.check_output(
                  ["git","show",os.environ["GITHUB_SHA"]+":"+relative]))
          print("M0_WIN_GO_POST_TLS_NATIVE_RUST_BRIDGE_AND_ONE_WAY_M4_ADAPTER_SOURCE_LOCKED")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'M0-only private Windows Go Rust bridge not exact SOURCE'}
          $env:WBD_M0_WIN_OWNER_DLL=(Resolve-Path 'target/release/wbd_engine.dll').Path
          $env:WBD_M0_TRY_SCOPED_NATIVE_WINTUN="1"
          Push-Location legacy
          try {
            & go test -count=1 -tags wbd_v4_embedded_go -v -run '^TestM0Windows(TwoOriginalGoFakeTCPProtectedTLSRustOwnersAllCiphers|ActualClientOwnerRejectsUnsupportedBeforeNetworkOrRust)$' ./internal/realityfront 2>&1 | Tee-Object -FilePath ../windows-owner-result/original-go-tls-native-rust.log
            if ($LASTEXITCODE -ne 0) {throw 'genuine original Go credential TLS -> Windows Rust owner/Stop failed'}
          } finally {Pop-Location}
          $got=Get-Content windows-owner-result/original-go-tls-native-rust.log -Raw
          foreach ($name in @('TestM0WindowsTwoOriginalGoFakeTCPProtectedTLSRustOwnersAllCiphers','TestM0WindowsActualClientOwnerRejectsUnsupportedBeforeNetworkOrRust')) {
            if ($got -notmatch ('--- PASS: '+[regex]::Escape($name))) {throw "original-Go TLS native Rust callback NOT_RUN $name"}
          }
          # Resolve the official Wintun DLL next to the compiled original
          # Go test executable: LazyDLL searches the executable directory.
          # Official Wintun v0.14.1 ZIP SHA256 from wintun.net itself.
          New-Item -ItemType Directory -Force -Path windows-owner-native-bin | Out-Null
          $archive='windows-owner-native-bin/wintun-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          $officialHash='07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $actualHash=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $officialHash) {throw "official Wintun ZIP SHA mismatch: $actualHash"}
          Expand-Archive -LiteralPath $archive -DestinationPath windows-owner-native-bin/release -Force
          $dll='windows-owner-native-bin/release/wintun/bin/amd64/wintun.dll'
          if (!(Test-Path -LiteralPath $dll -PathType Leaf)) {throw 'official Wintun ZIP amd64 DLL missing'}
          $signature=Get-AuthenticodeSignature -FilePath $dll
          if ($signature.Status -ne 'Valid') {throw "Wintun native DLL signature invalid: $($signature.Status)"}
          Copy-Item -LiteralPath $dll -Destination windows-owner-native-bin/wintun.dll
          Write-Output "M0_PLAN013_OFFICIAL_SIGNED_WINTUN_NATIVE_DLL_VERIFIED zip_sha256=$officialHash signature=$($signature.Status)"
          Push-Location legacy
          try {
            & go test -c -tags wbd_v4_embedded_go -o ../windows-owner-native-bin/m0-original-go-tls-wintun-lease.exe ./internal/windowsownerlease
            if ($LASTEXITCODE -ne 0) {throw 'source-locked original Go native M4 Windows proof executable compile failed'}
          } finally {Pop-Location}
          $env:WBD_M0_TRY_SCOPED_NATIVE_WINTUN="1"
          # PowerShell may interpret a dotted -test.v token as '-test',
          # which the Go compiled test EXE rejects. Pass literal Go flag
          # strings using array splatting with explicit '=value' syntax.
          $nativeGoTestArgs=@(
            '-test.v=true',
            '-test.run=^TestM0Windows(RealCreatedWintunOneWayAdapterNativeIdentityAndLifetime|RealOriginalGoTLSRustM4CreatedWintunSameGeneration)$'
          )
          & ./windows-owner-native-bin/m0-original-go-tls-wintun-lease.exe @nativeGoTestArgs 2>&1 | Tee-Object -FilePath windows-owner-result/m4-device-proof.log
          if ($LASTEXITCODE -ne 0) {throw 'actual one-way M4 native Windows Wintun Hold proof failed'}
          if (!(Select-String -Path windows-owner-result/m4-device-proof.log -SimpleMatch 'M0_PLAN013_CREATED_WINTUN_OS_HOLD_READBACK_SCOPED_PASS' -Quiet)) {
            Write-Output 'M0_PLAN013_REAL_NATIVE_WINTUN_OS_LEASE_UNSUPPORTED despite verified official signed DLL: preserve actual cause'
          }
          Remove-Item -LiteralPath windows-owner-native-bin -Recurse -Force
          $nativeLog=Get-Content windows-owner-result/m4-device-proof.log -Raw
          if ($nativeLog -notmatch 'M0_PLAN013_CREATED_WINTUN_OS_HOLD_READBACK_SCOPED_PASS' -and $nativeLog -notmatch 'M0_PLAN013_CREATED_WINTUN_OS_PROOF_UNSUPPORTED') {
            throw 'real M4 Wintun native OS result not PASS or explicit UNSUPPORTED'
          }
          if ($nativeLog -notmatch 'M0_PLAN013_TLS_PLUS_LIVE_WINTUN_SAME_EPOCH_SCOPED_PASS' -and $nativeLog -notmatch 'M0_PLAN013_TLS_PLUS_LIVE_WINTUN_SAME_EPOCH_UNSUPPORTED') {
            throw 'real original Go TLS and native Wintun generation result is missing or falsely qualified'
          }
          if ($nativeLog -notmatch '--- PASS: TestM0WindowsRealOriginalGoTLSRustM4CreatedWintunSameGeneration') {
            throw 'real credential original Go TLS/native Rust and M4 device handshake test never ran'
          }
          # This is a strict native Windows OS app delivery gate: an
          # UNSUPPORTED/skip log MUST fail rather than inherit TLS PASS.
          if ($nativeLog -notmatch 'M0_PLAN020_REAL_ORIGINAL_GO_CREDENTIAL_TLS_RUST_M3_AEAD_SIGNED_WINTUN_KERNEL_TO_ACTUAL_UDP_APP_PASS') {
            throw 'REAL original TLS Rust M3 ciphertext did NOT cross signed Wintun kernel into an actual bound Windows UDP application'
          }
          if ($nativeLog -notmatch 'M0_PLAN020_REAL_TLS_BOUND_SIGNED_WINTUN_RUST_M3_RECV_ABI_NEGATIVES_PASS' -or
              $nativeLog -notmatch 'M0_PLAN020_REAL_TLS_RUST_M3_RECEIVE_AFTER_NATIVE_WINTUN_QUIESCE_DENIED') {
            throw 'bounded original TLS Rust M3 peer-receive and Wintun Stop negatives NOT_RUN'
          }
          # These MUST be the same native Wintun kernel bytes that the
          # opposite original credential-TLS Rust owner authenticated.
          # A synthetic key or Winsock-localhost-only copy cannot satisfy.
          if ($nativeLog -notmatch 'M0_PLAN020_REAL_ORIGINAL_GO_TLS_RUST_M3_PEER_DECRYPT_AFTER_SIGNED_WINTUN_KERNEL_UDP_APP_FIRST_DELIVERY_PASS' -or
              $nativeLog -notmatch 'M0_PLAN020_REAL_ORIGINAL_GO_TLS_DUAL_RUST_M3_AEAD_SIGNED_WINTUN_KERNEL_UDP_APP_BOTH_DIRECTIONS_PASS') {
            throw 'same signed Wintun kernel original-Go TLS Rust M3 opposite peer decrypt BOTH directions NOT_RUN'
          }
          @'
          import json,pathlib,hashlib
          p=pathlib.Path("windows-owner-result/receipt.json")
          receipt=json.loads(p.read_text())
          receipt["original_go_credential_verified_TLS_to_native_Rust"]="PASS_SCOPED_REAL_BOTH_FAKETCP_ASSOCIATIONS_WIN2022"
          receipt["original_Go_server_and_client_private_owner_prepared_committed_stopped"]="PASS_SCOPED_DUAL_ROLE_3_CIPHERS"
          receipt["original_go_m4_frozen_overlay_sha"]="b53b5dac422a634cdd82178a29071f9f9f0ae5e7"
          receipt["Go_windows_native_shared_callback_scope"]="PRIVATE_BOTH_ROLES_NO_WFP_M4_DEVICE"
          receipt["windows_M4_real_device"]="NOT_RUN"
          receipt["windows_product_applied"]="OFF"
          native_log=pathlib.Path("windows-owner-result/m4-device-proof.log").read_text(errors="replace")
          if "M0_PLAN013_CREATED_WINTUN_OS_HOLD_READBACK_SCOPED_PASS" in native_log:
              receipt["original_M4_process_created_Wintun_OS_Hold"]="PASS_SCOPED_NATIVE_DEVICE"
          elif "M0_PLAN013_CREATED_WINTUN_OS_PROOF_UNSUPPORTED" in native_log:
              receipt["original_M4_process_created_Wintun_OS_Hold"]="UNSUPPORTED_NATIVE_DEVICE_OR_HOST_PRIVILEGE"
          else:
              raise RuntimeError("native M4 Wintun OS identity was neither tested nor marked UNSUPPORTED")
          if "M0_PLAN013_TLS_PLUS_LIVE_WINTUN_SAME_EPOCH_SCOPED_PASS" in native_log:
              receipt["single_same_TLS_generation_Wintun_OS_native_product"]="PASS_SCOPED_REAL_TLS_PLUS_NATIVE_CREATED_DEVICE_ONLY_NO_WFP"
          elif "M0_PLAN013_TLS_PLUS_LIVE_WINTUN_SAME_EPOCH_UNSUPPORTED" in native_log:
              receipt["single_same_TLS_generation_Wintun_OS_native_product"]="UNSUPPORTED_NATIVE_DRIVER_OR_HOST_CAPACITY"
          else:
              raise RuntimeError("original credential TLS plus M4 created Wintun not qualified")
          receipt["original_TLS_Rust_M3_ciphertext_on_same_signed_Wintun_kernel_into_real_UDP_app"]="PASS_SCOPED_REAL_KERNEL_UDP_TEST_NET_APP"
          receipt["original_TLS_Rust_bound_M3_receive_abi_stale_and_tamper"]="PASS_SCOPED_REAL_NATIVE_OWNER_NEGATIVES"
          receipt["original_TLS_Rust_authenticated_OPPOSITE_peer_decrypt_of_same_Wintun_kernel_record"]="PASS_SCOPED_REAL_NATIVE_KERNEL_AND_TLS_DERIVED_M3_BIDIRECTIONAL"
          receipt["signed_Wintun_original_Go_TLS_Rust_both_peers_replay_and_tamper"]="PASS_SCOPED_REAL_NATIVE_NEGATIVES"
          receipt["full_host_global_WFP_two_default_1_routes_DNS_ipv6_MTU_WAL_Apply_Recovery"]="NOT_RUN"
          receipt["public_original_Go_CLI_WinForms_real_Applied_Disconnect"]="NOT_RUN"
          receipt["full_host_WFP_default_route_DNS_ipv6_MTU_WAL_and_unmocked_CLI_GUI"]="NOT_RUN"
          receipt["native_WFP_default_route_and_M4_kernel_app"]="NOT_RUN_FULL_PUBLIC_PRODUCT"
          receipt["windows_product_applied"]="OFF"
          receipt["rust_authenticated_owner_Wintun_v2_fence"]="PASS_SCOPED_NATIVE_UNIT_NOT_APPLIED"
          receipt["windows_product"]="NOT_QUALIFIED"
          p.write_text(json.dumps(receipt,indent=2)+"\n")
          print("M0_PLAN013_WINDOWS_ORIGINAL_GO_DUAL_ROLE_CREDENTIAL_TLS_RUST_PRIVATE_OWNERS_STOP_SCOPED_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'native Windows original-Go/Rust TLS source receipt failed'}
      - name: Build BOTH actual old-Go Windows client/server with M0 Rust-lease callback in same frozen native source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path windows-native-client-server-build | Out-Null
          Push-Location legacy
          try {
            & go build -trimpath -tags wbd_v4_embedded_go -o ../windows-native-client-server-build/wbd-client.exe ./cmd/wbd-client
            if ($LASTEXITCODE -ne 0) {throw 'original Go Windows CLIENT with authenticated Rust owner opt-in did not compile'}
            & go build -trimpath -tags wbd_v4_embedded_go -o ../windows-native-client-server-build/wbd-server.exe ./cmd/wbd-server
            if ($LASTEXITCODE -ne 0) {throw 'original Go Windows SERVER with authenticated Rust owner opt-in did not compile'}
