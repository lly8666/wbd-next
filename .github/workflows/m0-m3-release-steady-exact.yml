name: M0 source-pinned M3 release FEC AEAD steady cost
run-name: "M0|${{ github.sha }}|M3-SOURCE-88a12027-release-steady"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-m3-release-steady-exact.yml"
permissions:
  contents: read
concurrency:
  group: m0-m3-release-steady-${{ github.sha }}
  cancel-in-progress: false
env:
  M3_SOURCE: 88a12027c61386be2709e1e8b01eb8f3c547ae81
  M3_TEST: link_fec_wire::fec_p0_cost_tests::r1_steady_release_same_source_fresh_vs_reused_owner_cost
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lly8666/wbd-next
          ref: 88a12027c61386be2709e1e8b01eb8f3c547ae81
          path: m3
          persist-credentials: false
      - name: Compile ONCE exact worker code in Release with pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C m3 rev-parse HEAD)" = "$M3_SOURCE"
          rustup toolchain install 1.85.1 --profile minimal
          test "$(cd m3 && rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          (cd m3 && cargo test --release --locked -p wbd-codec --lib --no-run)
          binary="$(find m3/target/release/deps -maxdepth 1 -type f -name 'wbd_codec-*' -perm -u+x | head -n1)"
          test -n "$binary"
          mkdir m3-build
          cp "$binary" m3-build/codec-release.test
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          worker=["Cargo.lock","Cargo.toml","rust-toolchain.toml",
                  "crates/wbd-codec/src/lib.rs","crates/wbd-codec/src/link_fec_wire.rs",
                  "crates/wbd-codec/src/fec_p0_cost_tests.rs"]
          for p in worker: assert pathlib.Path("m3",p).is_file(),p
          m={"m0_workflow_source":os.environ["GITHUB_SHA"],
             "m3_worker_source":os.environ["M3_SOURCE"],
             "run_id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],
             "rust":"1.85.1","profile":"release",
             "test_selector":os.environ["M3_TEST"],
             "binary_sha256":sha("m3-build/codec-release.test"),
             "worker_inputs_sha256":{p:sha("m3/"+p) for p in worker},
             "workflow_sha256":sha(".github/workflows/m0-m3-release-steady-exact.yml"),
             "qualification":"SCOPED_M3_P0_RELEASE_ONLY_NOT_GO_V4_NOT_PRODUCT"}
          pathlib.Path("m3-build/manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: m3-build/
          retention-days: 30
          if-no-files-found: error
  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lly8666/wbd-next
          ref: 88a12027c61386be2709e1e8b01eb8f3c547ae81
          path: m3
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m3-release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: m3-build/
      - name: Verify exact code and unchanged binary; run same-VM ABA repeated Release P0
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C m3 rev-parse HEAD)" = "$M3_SOURCE"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m=json.load(open("m3-build/manifest.json"))
          assert m["m0_workflow_source"]==os.environ["GITHUB_SHA"]
          assert m["m3_worker_source"]==os.environ["M3_SOURCE"]
          assert m["run_id"]==os.environ["GITHUB_RUN_ID"]
          assert m["attempt"]==os.environ["GITHUB_RUN_ATTEMPT"]
          assert m["profile"]=="release" and m["rust"]=="1.85.1"
          assert m["test_selector"]==os.environ["M3_TEST"]
          assert sha("m3-build/codec-release.test")==m["binary_sha256"]
          assert sha(".github/workflows/m0-m3-release-steady-exact.yml")==m["workflow_sha256"]
          for p,d in m["worker_inputs_sha256"].items(): assert sha("m3/"+p)==d,p
          PY
          chmod +x m3-build/codec-release.test
          mkdir m3-result
          ./m3-build/codec-release.test --exact "$M3_TEST" --nocapture > m3-result/test.log 2>&1
          cat m3-result/test.log
          python3 - <<'PY'
          import collections,hashlib,json,os,pathlib,platform,re,statistics
          log=pathlib.Path("m3-result/test.log").read_text()
          assert re.search(r"test result: ok\. 1 passed; 0 failed",log)
          lines=[x.strip() for x in log.splitlines() if "M3_STEADY_RELEASE profile=RELEASE " in x]
          assert len(lines)==24, f"expected 24 same-run rows, got {len(lines)}"
          rows=[]
          for line in lines:
              raw=line.split("M3_STEADY_RELEASE profile=RELEASE ",1)[1]
              fields=dict(item.split("=",1) for item in raw.split() if "=" in item)
              for k in ["mode","shard_len","repeat","records","wire_bytes",
                        "active_wall_s","thread_cpu_s","cpu_us_per_record",
                        "p50_batch_avg_ns_per_record","p99_batch_avg_ns_per_record",
                        "sample_count","includes_new_rx_owner"]:
                  assert k in fields,(k,fields)
              assert fields["source"]=="ACTION_SHA_REQUIRED" and fields["origin"]=="cfg_test_only"
              assert fields["transport"]=="NOT_RUN" and fields["steady_product_p99"]=="NOT_QUALIFIED"
              assert fields["throughput"]=="NOT_QUALIFIED" and fields["preseal_excluded"]=="true"
              assert float(fields["active_wall_s"])>=1.0 and float(fields["thread_cpu_s"])>0
              assert int(fields["records"])>0 and int(fields["sample_count"])>0
              assert int(fields["p50_batch_avg_ns_per_record"])<=int(fields["p99_batch_avg_ns_per_record"])
              assert fields["shard_len"] in ("192","896") and fields["repeat"] in ("0","1","2")
              rows.append(fields)
          grouped=collections.defaultdict(list)
          for r in rows: grouped[(r["shard_len"],r["mode"])].append(r)
          assert len(grouped)==8 and all(len(g)==3 for g in grouped.values())
          assert all(set(x["repeat"] for x in g)=={"0","1","2"} for g in grouped.values())
          # Same native test, same OS job/VM, ordered fresh/steady paired per repeat.
          totals={}
          for (size,mode),group in grouped.items():
              vals=[float(r["cpu_us_per_record"]) for r in group]
              totals[size+"_"+mode]={"median_cpu_us_per_record":statistics.median(vals),
                  "minimum":min(vals),"maximum":max(vals),
                  "median_batch_average_p99_ns_per_record":statistics.median(
                      int(r["p99_batch_avg_ns_per_record"]) for r in group)}
          ratios={}
          for size in ["192","896"]:
              for kind in ["aead","fec"]:
                  def locate(needle):
                      return next(m for m in totals if m.startswith(size+"_") and
                                  m.lower().endswith(needle))
                  f=totals[locate("fresh_"+kind)]["median_cpu_us_per_record"]
                  s=totals[locate("steady_"+kind)]["median_cpu_us_per_record"]
                  ratios[size+"_"+kind]={"fresh_over_steady_cpu_ratio":f/s,
                     "basis":"same-job three source-identical paired owner modes"}
          cgroup=pathlib.Path("/sys/fs/cgroup/cpu.max")
          cpu=pathlib.Path("/proc/cpuinfo").read_text()
          model=next((x.split(":",1)[1].strip() for x in cpu.splitlines() if x.startswith("model name")),"unknown")
          manifest=json.load(open("m3-build/manifest.json"))
          report={"m0_workflow_source":manifest["m0_workflow_source"],
                  "m3_worker_source":manifest["m3_worker_source"],"run_id":manifest["run_id"],
                  "attempt":manifest["attempt"],"profile":"release",
                  "binary_sha256":manifest["binary_sha256"],"real_rust_native_test_passed":1,
                  "rows":rows,"medians":totals,"same_vm_ratios":ratios,
                  "run_log_sha256":hashlib.sha256(log.encode()).hexdigest(),
                  "runner":os.environ.get("RUNNER_NAME"),"job":os.environ.get("GITHUB_JOB"),
                  "host":platform.uname()._asdict(),"cpu_model":model,
                  "cgroup_cpu_max":cgroup.read_text().strip() if cgroup.exists() else None,
                  "result":"SCOPED_M3_RELEASE_P0_MEASURED_NOT_PRODUCT",
                  "limitations":["not genuine Go V4 authenticated positive origin",
                                 "component-only synthetic scope no real traffic or NIC",
                                 "batch-average p99 NOT per-packet end-to-end latency",
                                 "100Hz per-thread CPU ticks may be noisy",
                                 "no ISA-L, no production FEC admission, no 500Mbps qualification",
                                 "M3 worker Governance independent and still required"]}
          pathlib.Path("m3-result/result.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({k:v for k,v in report.items() if k not in ("rows",)},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: m3-result/
          retention-days: 30
          if-no-files-found: warn
