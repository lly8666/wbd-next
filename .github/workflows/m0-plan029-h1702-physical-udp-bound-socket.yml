name: PLAN029 H1702 Windows physical NIC-bound UDP socket local-echo capability (NOT Wintun E2E)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan029-h1702-physical-udp-bound-socket.yml"
      - "crates/wbd-platform/src/windows_direct_udp.rs"
permissions: {contents: read}
jobs:
  real-windows-physical-udp-socket:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Select current physical default NIC and compile once from exact SOURCE
        shell: pwsh
        timeout-minutes: 9
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force result | Out-Null
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'native source lease mismatch'}
          $r = @(Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' -ErrorAction Stop | Sort-Object RouteMetric)
          $selected=$null
          foreach($route in $r){
            $a=@(Get-NetIPAddress -InterfaceIndex $route.InterfaceIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue |
              Where-Object {$_.AddressState -eq 'Preferred' -and $_.IPAddress -notmatch '^(127\.|169\.254\.|0\.)'})
            if($a.Count -gt 0 -and $route.InterfaceIndex -gt 0){
              $selected=[ordered]@{ifindex=[uint32]$route.InterfaceIndex;source4=[string]$a[0].IPAddress;route=[string]$route.DestinationPrefix}
              break
            }
          }
          if($null -eq $selected){throw 'no real physical default-route IPv4 with Preferred adapter source'}
          $selected.source_sha=$env:GITHUB_SHA
          $selected.scope='ACTUAL_WINDOWS_SOURCE_IFINDEX_SOCKET_ONLY_SAME_HOST'
          $selected | ConvertTo-Json | Set-Content -Encoding UTF8 result/h1702-selected-nic.json
          $env:WBD_PLAN029_H1702_PHYSICAL_SOCKET_GATE='1'
          $env:WBD_PLAN029_H1702_SRC4=$selected.source4
          $env:WBD_PLAN029_H1702_IFINDEX=[string]$selected.ifindex
          & rustup toolchain install 1.85.1 --profile minimal
          if($LASTEXITCODE -ne 0){throw 'pinned Rust 1.85.1 not installed'}
          & cargo test --locked --release -p wbd-platform --lib plan029_ -- --nocapture 2>&1 | Tee-Object result/h1702-physical-udp.log
          if($LASTEXITCODE -ne 0){throw 'real physical UDP socket/correct reverse IPv4 checksum test FAIL'}
          $output=Get-Content result/h1702-physical-udp.log -Raw
          if($output -notmatch 'PLAN029_H1702_REAL_PHYSICAL_UDP_SOURCE_BOUND_SOCKET_PASS'){
            throw 'real NIC source+ifindex physical socket local echo unobserved'
          }
          [ordered]@{
            schema_version=1;source_sha=$env:GITHUB_SHA;
            result='PASS_SCOPED_PHYSICAL_BIND_SOCKET_SAME_HOST_ONLY';
            native_src=$selected.source4;native_ifindex=$selected.ifindex;
            ip_unicast_if='SET_READBACK';
            bound_socket_udp='SAME_HOST_SEND_AND_REVERSE';
            wlan_or_internet_wire='NOT_RUN';wintun_app='NOT_RUN';
            real_Direct_Tunnel='NOT_RUN';old_custom_WFP='NOT_CREATED';
            product_applied='NOT_RUN'
          } | ConvertTo-Json | Set-Content -Encoding UTF8 result/h1702-physical-udp-receipt.json
          Write-Output "PLAN029_H1702_PHYSICAL_UDP_SOCKET_SOURCE_READBACK_LOCAL_ECHO_PASS_NOT_PRODUCT"
      - name: Preserve failure / success SOURCE without claiming physical app networking
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force result | Out-Null
          [ordered]@{
            source_sha=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;
            scope='REAL_WINDOWS_BOUND_UDP_LOCAL_SOCKET_ONLY';
            owned_wintun='NOT_OPENED';off_host_udp='NOT_RUN';
            full_direct_tcp_udp='NOT_RUN';full_dns='NOT_RUN'
          } | ConvertTo-Json | Set-Content -Encoding UTF8 result/h1702-source.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan029-h1702-physical-bound-udp-${{ github.run_id }}
          path: |
            result/h1702-selected-nic.json
            result/h1702-physical-udp.log
            result/h1702-physical-udp-receipt.json
            result/h1702-source.json
          if-no-files-found: warn
          retention-days: 14
