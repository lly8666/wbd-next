name: M0 PLAN027 H646 source11f independent C weaknet Game4 Normal Fixed
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h646-reuse-c-game4-fixed-normal-weaknet.yml]
permissions: {contents: read, actions: write}
jobs:
  exact-c:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h646-three-c]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 11f1881ff68afa22c5b0ca957d6808420a878a06
      BUILD_RUN: "41210457594"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify original product manifest once and dispatch exactly one independent Action per C case
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          scenes=(("game4","plan027-c-game4-off-10m-250ms-loss30-60s.json",10,30),
                  ("normal","plan027-c-normal-50m-250ms-loss15-60s.json",50,15),
                  ("fixed","plan027-c-fixed-50m-250ms-loss15-60s.json",50,15))
          for mode,file,rate,loss in scenes:
              s=read_scenario("scenarios/"+file)
              assert s["public_mode"]==mode and s["duration_s"]==60
              for d in ("windows_to_linux","linux_to_windows"):
                  q=s[d];assert q["offered_mbps"]==rate and q["loss_pct"]==loss and q["delay_ms"]==250
              print("H646_TRUE_INDEPENDENT_C_SCENE_SHA",mode,file,s["scenario_sha256"])
          PY
          while read -r mode file; do
            scene="scenarios/$file"
            title="M0-WIN-LINUX|$GITHUB_SHA|$mode|$scene"
            prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" | jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -1)"
            if [ -n "$prior" ];then echo "H646_ALREADY_REGISTERED mode=$mode run=$prior";continue;fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_scenario_file="$scene" \
              -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
            echo "H646_ORIGINAL_TWO_OS_C_DISPATCHED mode=$mode binary=$PRODUCT_SOURCE scenario=$scene proof=PENDING"
          done <<'CASES'
          game4 plan027-c-game4-off-10m-250ms-loss30-60s.json
          normal plan027-c-normal-50m-250ms-loss15-60s.json
          fixed plan027-c-fixed-50m-250ms-loss15-60s.json
          CASES
          echo H646_THREE_SOURCE_LOCKED_INDEPENDENT_ACTIONS_NOT_PRODUCT_PASS
