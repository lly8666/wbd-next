name: M0 PLAN027 H510 resume exact source1644 independent native scenes
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h510-resume-existing-source.yml]
permissions: {contents: read, actions: write}
jobs:
  resume-once:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h510-resume]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Source manifests and real original no-loss gate before independent measurement dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src=1644df34d241d487c5c5eb704a1a0a2e5f506f5e
          build=41041996161
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build" --jq .head_sha)" = "$src"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$build/artifacts" --jq '.artifacts[].name' > "$RUNNER_TEMP/h510-artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$src" "$RUNNER_TEMP/h510-artifacts"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/h510-artifacts"
          mkdir -p "$RUNNER_TEMP/h510"
          gh run download "$build" -R "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/h510"
          python - <<'PY'
          import os,pathlib,json,re
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'h510'
          r=json.loads((p/'report.json').read_text())
          v=r['WL_V2']
          assert r['source']=='1644df34d241d487c5c5eb704a1a0a2e5f506f5e' and r['linux_binary_source']=='1644df34d241d487c5c5eb704a1a0a2e5f506f5e'
          assert r['stop']=='PASS_BOTH_OWNED' and v['owned_stop']=='PASS_BOTH_OWNED'
          assert v['status']=='MEASURED_BOTH_OS_KERNEL' and v['scenario_id']=='plan027-h504-outer-50m-150ms-loss0-60s'
          assert all(v['offered_mbps'][x]>=47.5 and v['first_delivery_fraction'][x]>=.999 for x in ('windows','linux'))
          text=(p/'mode-results'/'normal'/'server.log').read_text(errors='replace')
          m=re.findall(r'V4_PUBLIC_M2_OUTER[^\n]+',text)
          assert m
          f=int(re.search(r'\bfirst_wire_bytes=(\d+)',m[-1]).group(1))
          repair=int(re.search(r'\brepair_accepted_wire_bytes=(\d+)',m[-1]).group(1))
          print('H510_REAL_SOURCE0PCT_F_R',f,repair,'ratio',repair/f)
          assert f>0 and repair/f<=.001
          from tools.m0_wl_perf_v2_config import read_scenario
          paths=[
          ('normal','scenarios/wl-outer-repair-50m-150ms-loss1-60s.json',60),
          ('normal','scenarios/wl-outer-repair-50m-150ms-loss5-60s.json',60),
          ('normal','scenarios/wl-outer-repair-50m-150ms-loss10-60s.json',60),
          ('normal','scenarios/wl-outer-repair-50m-150ms-loss30-60s.json',60),
          ('game2','scenarios/plan027-b-game2-off-10m-75ms-loss5-20s.json',20),
          ('game4','scenarios/plan027-b-game4-off-10m-75ms-loss5-20s.json',20),
          ('game2-fec','scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json',20),
          ('game4-fec','scenarios/wl-game4-fixed6-10m-75ms-loss30-20s.json',20),
          ('fixed','scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json',60),
          ('auto','scenarios/plan027-a4-auto-10m-staged-240s.json',240),
          ('normal','scenarios/plan027-c-normal-100m-25ms-loss0-60s.json',60),
          ('normal','scenarios/plan027-c-normal-50m-25ms-loss0-300s.json',300)]
          for mode,path,duration in paths:
              scene=read_scenario(path)
              assert scene.get('public_mode','normal')==mode and scene['duration_s']==duration
              print('H510_INDEPENDENT_SCENE',mode,path,scene['scenario_sha256'])
          PY
          while read -r mode path; do
            gh workflow run m0-wl-public-normal-full.yml --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_ab=false \
              -f perf_scenario_file="$path" \
              -f perf_reuse_run_id="$build" -f perf_binary_source_sha="$src"
            echo "H510_ONE_ACTION_ONE_SCENE $mode $path"
          done <<'EOF'
          normal scenarios/wl-outer-repair-50m-150ms-loss1-60s.json
          normal scenarios/wl-outer-repair-50m-150ms-loss5-60s.json
          normal scenarios/wl-outer-repair-50m-150ms-loss10-60s.json
          normal scenarios/wl-outer-repair-50m-150ms-loss30-60s.json
          game2 scenarios/plan027-b-game2-off-10m-75ms-loss5-20s.json
          game4 scenarios/plan027-b-game4-off-10m-75ms-loss5-20s.json
          game2-fec scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json
          game4-fec scenarios/wl-game4-fixed6-10m-75ms-loss30-20s.json
          fixed scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json
          auto scenarios/plan027-a4-auto-10m-staged-240s.json
          normal scenarios/plan027-c-normal-100m-25ms-loss0-60s.json
          normal scenarios/plan027-c-normal-50m-25ms-loss0-300s.json
          EOF
