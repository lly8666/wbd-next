name: M0 PLAN028 mixed ARM64 x86 frozen original TLS Linux netns
run-name: PLAN028 frozen ISA source140a / ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-linux-mixed-isa-frozen.yml"
      - "tools/m0-plan028-linux-mixed-isa-netns-frozen.sh"
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  real-netns-binary-frozen:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arm-role: [client, server]
    timeout-minutes: 14
    env:
      WBD_PLAN028_MIXED_BINARY_SOURCE: 140a06622a97251863c6959c1290a0dd11b7a38b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 41667172847
          github-token: ${{ github.token }}
          name: m0-plan028-dual-isa-41667172847-1
          path: mixed-isa-build/
      - name: Frozen product original Go and Rust real-netns TCP/TLS/UDP/Stop
        shell: bash
        env:
          WBD_PLAN028_MIXED_ARM_ROLE: ${{ matrix.arm-role }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-user-static libc6-arm64-cross libgcc-s1-arm64-cross iproute2 iptables openssl
          bash -n tools/m0-plan028-linux-mixed-isa-netns-frozen.sh
          bash tools/m0-plan028-linux-mixed-isa-netns-frozen.sh | tee "mixed-isa-result-${WBD_PLAN028_MIXED_ARM_ROLE}.txt"
          grep -q "M0_PLAN028_CROSS_ISA_ORIGINAL_GO_RUST_REAL_NETNS_PASS arm_role=${WBD_PLAN028_MIXED_ARM_ROLE} packets=10 server_port=443 owned_stop=1 qemu_arm64=1" "mixed-isa-result-${WBD_PLAN028_MIXED_ARM_ROLE}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-mixed-frozen-${{ matrix.arm-role }}-${{ github.run_id }}
          path: |
            mixed-isa-result-${{ matrix.arm-role }}/
            mixed-isa-result-${{ matrix.arm-role }}.txt
          if-no-files-found: warn
          retention-days: 14
