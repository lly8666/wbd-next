name: Android temp root probe API 28 canary
run-name: "android-root-probe|api28|canary|${{ github.sha }}"
on:
  push:
    branches: [experiment/android-temp-root-probe]
    paths:
      - "experiments/android-root-probe/**"
      - ".github/workflows/android-root-probe-build.yml"
      - ".github/workflows/android-root-probe-case.yml"
      - ".github/workflows/android-root-probe-canary-api28.yml"
permissions:
  contents: read
  actions: read
jobs:
  canary-api28:
    uses: ./.github/workflows/android-root-probe-case.yml
    with:
      api: '28'
      scenario: canary
