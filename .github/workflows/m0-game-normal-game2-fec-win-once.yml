# M0: isolated final-mode gap, exact source already tested in other signed modes.
name: M0 Game2 fixed FEC signed Windows source frozen one
run-name: "M0-GAME2-FEC-WIN-FROZEN|${{ github.sha }}"
on:
  push:
    branches: [work/m0-game-normal-outer-20261123]
    paths: [.github/workflows/m0-game-normal-game2-fec-win-once.yml]
permissions: {contents: read, actions: write}
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FROZEN_REF: experiment/m0-game-normal-final-game4off-8dbda7d
      FROZEN_SHA: 8dbda7d425ec3e5322f79729b5c5a285d323416d
      SCENARIO: scenarios/m0-cosmetic-game2-fec-loss30-60s.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Dispatch exactly original Game2 fixed FEC 30pct true signed two-OS source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$FROZEN_REF" --jq '.object.sha')" = "$FROZEN_SHA"
          test -f "$SCENARIO"
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref "$FROZEN_REF" \
            -f public_mode=game2-fec -f native_outer_mtu=legacy1400 \
            -f outer_repair=on -f "perf_scenario_file=$SCENARIO"
          echo "M0_GAME2_FIXED_FEC30_DISPATCH_ONLY_NOT_NATIVE_PASS frozen=$FROZEN_SHA"
