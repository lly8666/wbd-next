name: M0 PLAN027 H625 only two 106s real tc blackhole scenarios
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h625-dead106-real.yml]
permissions: {contents: read, actions: write}
jobs:
  dispatch-two-original:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h625-dead106]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 593ce4a1073773429d7739a086fe3e060af89a3d
      BUILD_RUN: "41195637726"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate real source and dispatch two 106s original native B scenarios
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg n "m0-wl-windows-product-binaries-$SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($n)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py)"
          python3 -m unittest tests.test_m0_wl_perf_v2_config -v
          grep -F 'case.get("lifecycle_blackhole_s") not in (20,106)' tools/m0_wl_netem.py
          while IFS=' ' read -r mode file;do
            python3 -c 'from tools.m0_wl_perf_v2_config import read_scenario;import sys;x=read_scenario("scenarios/"+sys.argv[2]);assert x["public_mode"]==sys.argv[1] and x["lifecycle_blackhole_s"]==106;print(x["scenario_sha256"])' "$mode" "$file"
            title="M0-WIN-LINUX|$GITHUB_SHA|$mode|scenarios/$file"
            prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" | jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -1)"
            if test -n "$prior";then echo "H625_ALREADY_SCOPED $prior";continue;fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_scenario_file="scenarios/$file" \
              -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$SOURCE"
            echo "H625_DISPATCHED mode=$mode file=$file result=NOT_PROVEN"
          done <<'CASES'
          normal plan027-b-normal-blackhole106-recover-10m-25ms-0loss-60s.json
          fixed plan027-b-fixed-blackhole106-recover-10m-25ms-0loss-60s.json
          CASES
