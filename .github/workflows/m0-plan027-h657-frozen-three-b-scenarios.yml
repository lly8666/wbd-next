name: M0 PLAN027 H657 frozen original three independent B scenarios
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h657-frozen-three-b-scenarios.yml]
permissions: {contents: read, actions: write}
jobs:
  three-scopes-one-dispatcher:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h657-b-three]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: dc191cf5686ddff2e433312b8ec2258954bd018f
      BUILD_RUN: "41220597229"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Original signed/source hash lock and original independent B scenes
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' > /dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          specs=[("wl-game2-fixed6-10m-75ms-loss15-20s.json","game2-fec",20,10,15,75,None),
          ("plan027-b-normal-idle-wake-10m-25ms-0loss-60s.json","normal",60,10,0,25,105),
          ("plan027-b-game4-off-10m-75ms-loss5-20s.json","game4",20,10,5,75,None)]
          for name,mode,duration,rate,loss,delay,idle in specs:
              s=read_scenario("scenarios/"+name)
              assert s["public_mode"]==mode and s["duration_s"]==duration
              assert s.get("lifecycle_idle_s")==idle
              for k in ("windows_to_linux","linux_to_windows"):
                  d=s[k]
                  assert d["offered_mbps"]==rate and d["loss_pct"]==loss and d["delay_ms"]==delay
              print("H657_FROZEN_ORIGINAL_B_SCENE",name,s["scenario_sha256"])
          PY
          while read -r mode name;do
            scene="scenarios/$name"
            title="M0-WIN-LINUX|$GITHUB_SHA|$mode|$scene"
            prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
              jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id'|head -1)"
            if [ -n "$prior" ];then
              echo "H657_ALREADY_DISPATCHED scenario=$name run=$prior";continue
            fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f "public_mode=$mode" -f "run_n0=false" -f "perf_scenario_file=$scene" \
              -f "perf_reuse_run_id=$BUILD_RUN" -f "perf_binary_source_sha=$PRODUCT_SOURCE"
            echo "H657_ONE_INDEPENDENT_NATIVE_SCENE_DISPATCHED mode=$mode file=$name SOURCE=$PRODUCT_SOURCE verdict=PENDING"
          done <<'SCENES'
          game2-fec wl-game2-fixed6-10m-75ms-loss15-20s.json
          normal plan027-b-normal-idle-wake-10m-25ms-0loss-60s.json
          game4 plan027-b-game4-off-10m-75ms-loss5-20s.json
          SCENES
