name: M0 PLAN027 H854 original Normal ON10Mbps true30 new index
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-plan027-h854-index-on30.yml
permissions:
  contents: read
  actions: read
jobs:
  exactly-one-original-normal-on30:
    if: contains(github.event.head_commit.message, '[plan027-h854-index-on30]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_SOURCE: 2b531228a470906469d79b0bb6127a82c3530607
      BUILD_RUN: "41373270074"
      BEFORE_SOURCE: e928b50cf872b6746a62c56662e5fc0768c5ca45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 40}
      - name: Source unchanged since H853 build, scenario and fixture input contract
        run: |
          set -euo pipefail
          git cat-file -e "$PRODUCT_SOURCE^{commit}"
          git diff --quiet "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/arm64_public_go_rust_bundle.sh
          python3 -m unittest tests.test_m0_plan027_h854_shared_index -v
          python3 -m py_compile tools/network_harness/m0_plan027_h854_normal_on30.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ env.BUILD_RUN }}
          name: plan027-h852-once-original-linux-source-bundle
          github-token: ${{ github.token }}
          path: new-bundle
      - name: Original Go+Rust exact manifests three hashes and real TUN
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          m=json.load(open("new-bundle/manifest.json"))
          assert m["source"]==os.environ["PRODUCT_SOURCE"] and m["architecture"]=="x86_64"
          
          PY
          (cd new-bundle && sha256sum -c SHA256SUMS)
          
          chmod +x new-bundle/wbd-v4-client new-bundle/wbd-v4-server
          
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl ethtool
          test -c /dev/net/tun
      - name: Exactly one true30pct normal ON native regression
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_SHA,GITHUB_RUN_ID,GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_TEMP,GITHUB_JOB,PRODUCT_SOURCE,BEFORE_SOURCE \
            python3 -m tools.network_harness.m0_plan027_h854_normal_on30 \
              --bundle "$GITHUB_WORKSPACE/new-bundle" \
              --product-source "$PRODUCT_SOURCE" \
              --scenario scenarios/wl-outer-repair-10m-250ms-loss30-60s.json \
              --out "$GITHUB_WORKSPACE/plan027-h854-on30"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan027-h854-new-on30
          path: |
            plan027-h854-on30/result.json
            plan027-h854-on30/native-on30/result.json
            plan027-h854-on30/native-on30/network-snapshots.json
          if-no-files-found: warn
          retention-days: 30
