name: M0 M4 pinned original Go and GUI product assembly
run-name: "${{ github.event_name == 'workflow_dispatch' && format('M4|{0}|windows-amd64|{1}', inputs.request_id, github.sha) || format('M0|m4-original-product|{0}|{1}', github.event_name, github.sha) }}"
on:
  # Native consumer of an actual successful central M4 scope Actions SOURCE.
  workflow_run:
    workflows: [Central worker scope audit]
    types: [completed]
  workflow_dispatch:
    inputs:
      role_id:
        description: "Must match current M4 task/registry"
        type: choice
        required: true
        options: [M4]
      request_id:
        description: "New immutable M4-016-* JSON request ID, once per run"
        required: true
        type: string
      request_ref:
        description: "Full 40-character single-file M4 request I commit"
        required: true
        type: string
      worker_source_sha:
        description: "Full 40-character immutable candidate M4 source before I"
        required: true
        type: string
      control_sha:
        description: "Exact latest main SHA for THIS workflow code/registry"
        required: true
        type: string
      scope_run_id:
        description: "Successful exact-current-M4 central G2 Actions run"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-m4-product-assembly.yml"
      - "tools/m4_product_source.py"
      - "tests/test_m4_product_source.py"
  # New PLAN013 M4 Windows tests consume immutable successful central G2.
  # Historical I010 manual dispatch remains failed, not silently replayed.
permissions:
  contents: read
  actions: read
concurrency:
  group: "m0-m4-original-product-${{ github.event_name }}-${{ inputs.request_id || github.event.workflow_run.id || github.sha }}"
  cancel-in-progress: false

jobs:
  attest:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.role_id == 'M4' &&
       github.ref_name == 'qualification/m4-product-windows-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - name: Negative identity and artifact contract tests; then attest exact M4 G2 SOURCE
        id: source
        shell: bash
        env:
          SCOPE_RUN_ID: ${{ inputs.scope_run_id || github.event.workflow_run.id || '39219843238' }}
          REQUEST_ID: ${{ inputs.request_id || '' }}
          REQUEST_REF: ${{ inputs.request_ref || '' }}
          WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha || '' }}
          CONTROL_SHA: ${{ inputs.control_sha || '' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_m4_product_source.py' -v
          python3 -m unittest discover -s tests -p 'test_m4_product_dispatch.py' -v
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            # One pre-reviewed historic M4 S51 source regression of this
            # main-owned Windows entry. Does NOT validate PLAN013 product.
            mkdir -p m4-product-identity
            printf '%s\n' '{"schema_version":1,"kind":"entry-selftest","result":"GATE_TESTS_PASS_ONLY","product":"NOT_RUN","M4_018":"NOT_RUN"}' >m4-product-identity/receipt.json
            echo "source_sha=46e13f6e6210b9786c2d1c69f43111943410dbaf" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            test "${{ inputs.role_id }}" = M4
            python3 tools/m4_product_source.py --scope-run-id "$SCOPE_RUN_ID" \
              --request-id "$REQUEST_ID" --request-ref "$REQUEST_REF" \
              --worker-source-sha "$WORKER_SOURCE_SHA" --control-sha "$CONTROL_SHA" \
              --output m4-product-identity/receipt.json
          else
            python3 tools/m4_product_source.py --scope-run-id "$SCOPE_RUN_ID" --output m4-product-identity/receipt.json
          fi
          test -s m4-product-identity/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-m4-product-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: m4-product-identity/
          retention-days: 30
          if-no-files-found: warn

  original-product:
    needs: attest
    # Windows 2022 actual pinned original Go + M4 WinForms exactly once
    # per successful G2/explicit request. No repeat of accepted Linux tests.
    if: needs.attest.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      M4_SOURCE: ${{ needs.attest.outputs.source_sha }}
      LEGACY_SOURCE: a7a82db31fe736ffedee330795a3234d358f1984
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wbd-next
          ref: ${{ needs.attest.outputs.source_sha }}
          path: worker-overlay
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Materialize exact original Git-object bytes on ephemeral Windows checkout
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          legacy=root/"legacy"
          overlay=root/"worker-overlay"
          legacy_sha=os.environ["LEGACY_SOURCE"]
          m4_sha=os.environ["M4_SOURCE"]
          manifest=json.loads((overlay/"r0/go_overlay/assembly/manifest.json").read_text(encoding="utf-8"))
          assert manifest["legacy_source"]==legacy_sha
          for repo,sha in ((legacy,legacy_sha),(overlay,m4_sha)):
              assert subprocess.check_output(["git","-C",str(repo),"rev-parse","HEAD"],text=True).strip()==sha
          def blob_sha(payload):
              return hashlib.sha1(b"blob "+str(len(payload)).encode()+b"\0"+payload).hexdigest()
          def extract(repo,source,path,digest):
              p=pathlib.PurePosixPath(path)
              assert not p.is_absolute() and all(x not in ("",".","..") for x in p.parts) and "\\" not in path
              raw=subprocess.check_output(["git","-C",str(repo),"show",source+":"+path])
              assert blob_sha(raw)==digest, "exact original Git object mismatch: "+path
              target=repo.joinpath(*p.parts)
              assert target.is_file(), "existing checkout file missing: "+path
              target.write_bytes(raw) # Exact upstream bytes, not Windows CRLF checkout filters
          for entry in manifest["operations"]:
              if entry["kind"]=="replace":
                  extract(legacy,legacy_sha,entry["path"],entry["original_blob"])
              elif entry["kind"]=="create":
                  extract(overlay,m4_sha,entry["overlay_path"],entry["result_blob"])
              else:
                  raise ValueError("unknown pinned operation")
          print("M4_WIN_EXACT_GIT_BLOBS_RESTORED_NOT_NATIVE_PRODUCT_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'exact Git object restore failed'}
      - name: Fail closed on unpinned SOURCE and wrong Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SOURCE"
          test "$(git -C worker-overlay rev-parse HEAD)" = "$M4_SOURCE"
          test "$(go version | awk '{print $3}')" = "go1.23.12"
      - name: Linux exact old-Go assembly and native config/build, one per target
        if: matrix.target != 'windows-amd64' && github.event_name == 'workflow_run'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s worker-overlay/r0/go_overlay/assembly -p 'test_assemble.py' -v
          python3 worker-overlay/r0/go_overlay/scripts/fec2_assembly_smoke.py \
            --legacy-root legacy --overlay-root worker-overlay \
            --out m4-product-result --target "$TARGET"
          python3 - <<'PY'
          import json,os
          d=json.load(open('m4-product-result/result.json'))
          assert d["target"]==os.environ["TARGET"] and d["host_native"] is True
          assert d["go_tests"]=="PASS_SCOPED_FEC2_PARSER_READBACK_ONLY"
          assert d["legacy_source"]==os.environ["LEGACY_SOURCE"]
          assert d["overlay_source"]==os.environ["M4_SOURCE"]
          assert d["native_rust_loader"]=="NOT_RUN" and d["product_fec2"]=="OFF"
          PY
      - name: Main-only Windows CI repair reuses already-qualified Linux M4 SOURCE
        if: matrix.target != 'windows-amd64' && github.event_name == 'push'
        shell: bash
        run: |
          echo 'LINUX_NOT_RUN_THIS_PUSH unchanged M4 SOURCE and legacy pins; earlier Linux jobs in Action 39221442451 succeeded'
      - name: Windows real original Go CLI and WinForms portable GUI native selftest
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest discover -s worker-overlay/r0/go_overlay/assembly -p 'test_assemble.py' -v
          if ($LASTEXITCODE -ne 0) {throw "assembler regression failed"}
          & ./worker-overlay/r0/go_overlay/scripts/fec2_windows_gui_smoke.ps1 -LegacyRoot legacy -OverlayRoot worker-overlay -OutputDirectory m4-product-result
          if ($LASTEXITCODE -ne 0) {throw "original native WinForms smoke failed"}
          if (-not (Test-Path 'm4-product-result/windows-product-result.json')) {throw "missing Windows native receipt"}
      - name: Bind Windows output to exact M4 manual request or automatic G2 identity
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_ATTEMPT: ${{ github.run_attempt }}
          M4_REQUEST_ID: ${{ inputs.request_id || '' }}
          M4_REQUEST_REF: ${{ inputs.request_ref || '' }}
          M4_SCOPE_RUN_ID: ${{ inputs.scope_run_id || github.event.workflow_run.id || '' }}
          MAIN_CONTROL: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,pathlib
          path=pathlib.Path("m4-product-result")
          path.mkdir(exist_ok=True)
          source=os.environ["M4_SOURCE"]
          assert len(source)==40
          json.dump({"schema_version":1,"role_id":"M4",
            "workflow":".github/workflows/m0-m4-product-assembly.yml",
            "source_sha":source,"control_sha":os.environ["MAIN_CONTROL"],
            "request_id":os.environ["M4_REQUEST_ID"] or None,
            "request_ref":os.environ["M4_REQUEST_REF"] or None,
            "scope_run_id":os.environ["M4_SCOPE_RUN_ID"] or None,
            "run_id":int(os.environ["GH_RUN_ID"]),"attempt":int(os.environ["GH_ATTEMPT"]),
            "target":"windows-amd64","legacy_source":os.environ["LEGACY_SOURCE"],
            "result":"SCOPED_ORIGINAL_GO_WINDOWS_GUI_SMOKE_NOT_NETWORK_APPLIED",
            "product_network_script_free":"NOT_RUN",
            "native_windows_owned_network":"NOT_RUN",
            "product_rust_ack":"NOT_RUN",
            "product_fec2":"OFF"},open(path/"m4-request-source-binding.json","w"),indent=2)
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw 'Windows scoped SOURCE binding failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-m4-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: m4-product-result/
          if-no-files-found: warn
          retention-days: 30
