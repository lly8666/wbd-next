name: PLAN029 H1661 Windows physical DNS / native CLI source build (NOT E2E)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan029-h1661-windows-dns-source-build.yml"
      - "r0/go_overlay/assembly/manifest-plan020-m0.json"
      - "r0/go_overlay/internal/faketcp/native_dns_bootstrap_windows.go"
      - "r0/go_overlay/internal/windowsclient/native_bootstrap_dns_windows.go"
      - "r0/go_overlay/cmd/wbd-client/m0_native_v4_windows.go"
      - "r0/go_overlay/cmd/wbd-client/m0_plan029_cold_split_windows.go"
      - "r0/go_overlay/internal/windowsownerlease/original_tls_native_product_windows.go"
      - "r0/go_overlay/internal/realityfront/bridge_v4_windows_native_split_probe.go"
      - "r0/go_overlay/internal/windowsclient/native_real_product_service_windows.go"
      - "r0/go_overlay/internal/windowsclient/native_plan029_defender_com_windows.go"
      - "r0/go_overlay/internal/windowsclient/native_plan029_defender_lease_windows.go"
      - "r0/go_overlay/internal/windowsclient/native_plan029_defender_lease_windows_test.go"
permissions: {contents: read, actions: read}
jobs:
  windows-source-compile:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: Verify exact overlay assembly and pinned legacy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git -C legacy rev-parse HEAD).Trim() -ne 'a7a82db31fe736ffedee330795a3234d358f1984'){throw 'wrong original source'}
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'wrong PLAN029 source'}
          python tools/prepare_windows_wiring.py
          if($LASTEXITCODE -ne 0){throw 'source/ABI/manifest assembly failed'}
          Write-Output "H1661_SOURCE_LOCKED_ORIGINAL_GO_OVERLAY_ASSEMBLY_PASS"
      - name: Windows compiled parser and CLI-domain negative tests (not DNS real network)
        shell: pwsh
        timeout-minutes: 9
        run: |
          $ErrorActionPreference='Stop'
          Push-Location legacy
          try {
            & go test -tags wbd_v4_embedded_go -count=1 -run '^TestPlan029' -v ./internal/faketcp ./internal/windowsclient ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'PLAN029 Windows compilation / tests FAILED'}
            & go build -trimpath -tags wbd_v4_embedded_go -o ../result/plan029-source-only-client.exe ./cmd/wbd-client
            if($LASTEXITCODE -ne 0){throw 'PLAN029 original Go native product compile FAILED'}
          } finally {Pop-Location}
          Write-Output "H1661_NATIVE_GO_BUILD_ONLY_PASS_NOT_SIGNED_E2E"
      - name: Real native Defender COM exact one TCP rule add/readback/CAS delete (no product connection)
        shell: pwsh
        timeout-minutes: 5
        env:
          WBD_PLAN029_REAL_DEFENDER_TEST: "1"
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'real Defender evidence SOURCE drift'}
          Push-Location legacy
          try {
            & go test -tags wbd_v4_embedded_go -count=1 -run '^TestPlan029DefenderNativeCOMOneRealRuleOwnedCAS$' -v ./internal/windowsclient
            if($LASTEXITCODE -ne 0){throw 'real Defender COM exact one-rule Add/CAS Delete FAILED'}
          } finally {Pop-Location}
          Write-Output 'PLAN029_REAL_WINDOWS_DEFENDER_COM_ONE_RULE_NATIVE_CAS_PASS_SCOPE_ONLY_NOT_TCP_PRODUCT'
      - name: Preserve exact source / build-only scope
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force result | Out-Null
          $receipt=[ordered]@{schema_version=1;product_source_sha=$env:GITHUB_SHA;original_go_source_sha='a7a82db31fe736ffedee330795a3234d358f1984';scope='WINDOWS_COMPILE_AND_PURE_UNIT_ONLY';native_windows_l3='NOT_RUN';physical_dns_e2e='NOT_RUN';tls_signed_gui_e2e='NOT_RUN';padding_flows='NOT_RUN';original_go_native_build=(Test-Path result/plan029-source-only-client.exe);run_id=$env:GITHUB_RUN_ID}
          $receipt|ConvertTo-Json -Depth 5|Set-Content -Encoding utf8 result/plan029-h1661-source-only.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan029-h1661-windows-source-only-${{ github.run_id }}
          path: |
            result/assembly.json
            result/plan029-h1661-source-only.json
          retention-days: 14
          if-no-files-found: warn
