name: M0 R1 real FEC-on first business and RS20 recovery
run-name: "M0|${{ github.sha }}|r1-fec-on-native"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r1-fec-on-native.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/wbd-engine/**"
      - "crates/wbd-codec/**"
      - "crates/wbd-platform/**"
      - "crates/wbd-types/**"
permissions:
  contents: read
concurrency:
  group: r1-fec-on-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile exactly one native Linux x64 integration test binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          cargo test --release --locked -p wbd-engine --test r1_fec_on --no-run
          test_bin="$(find target/release/deps -maxdepth 1 -type f -name 'r1_fec_on-*' -perm -u+x | head -n 1)"
          test -n "$test_bin"
          mkdir r1-fec-build
          cp "$test_bin" r1-fec-build/test.bin
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          parts=['crates/wbd-engine/src/memory/mod.rs','crates/wbd-engine/src/runtime/mod.rs',
                 'crates/wbd-codec/src/record_crypto.rs','crates/wbd-codec/src/record_replay.rs',
                 'crates/wbd-codec/src/record_frame.rs','crates/wbd-codec/src/path_budget.rs',
                 'crates/wbd-codec/src/fec_math.rs','crates/wbd-codec/src/fec_tx.rs',
                 'crates/wbd-codec/src/fec_rx.rs','crates/wbd-codec/src/fec_block_id.rs',
                 'crates/wbd-codec/src/link_fec_wire.rs',
                 'crates/wbd-platform/src/r1.rs','crates/wbd-platform/src/ipv4_tcp.rs',
                 'crates/wbd-engine/tests/r1_fec_on.rs']
          meta={'schema_version':1,'source_sha':os.environ['GITHUB_SHA'],
                'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                'target':'x86_64-unknown-linux-gnu','rust':'1.85.1',
                'test_binary_sha256':sha('r1-fec-build/test.bin'),
                'lock_sha256':sha('Cargo.lock'),
                'source_parts_sha256':{p:sha(p) for p in parts},
                'scope':'M1_ARENA_M3_FEC_AEAD_REPLAY_POST_AUTH_BLOCKID_SCOPE_M4_FULL_IPV4_TCP_IN_PROCESS_ONLY'}
          pathlib.Path('r1-fec-build/manifest.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-fec-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-fec-build/
          if-no-files-found: error
          retention-days: 30
  consume:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r1-fec-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-fec-build
      - name: Verify exact source/lock/test binary and execute two full IPv4/TCP packet AEAD replay FEC-on business cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,json,hashlib
          m=json.load(open('r1-fec-build/manifest.json'))
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert m['source_sha']==os.environ['GITHUB_SHA']
          assert m['run_id']==os.environ['GITHUB_RUN_ID'] and m['attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          assert m['target']=='x86_64-unknown-linux-gnu' and m['rust']=='1.85.1'
          assert sha('Cargo.lock')==m['lock_sha256']
          assert sha('r1-fec-build/test.bin')==m['test_binary_sha256']
          for p,d in m['source_parts_sha256'].items(): assert sha(p)==d,p
          PY
          chmod +x r1-fec-build/test.bin
          mkdir r1-fec-result
          set +e
          r1-fec-build/test.bin --nocapture >r1-fec-result/tests.log 2>&1
          ret=$?
          set -e
          cat r1-fec-result/tests.log
          TEST_EXIT="$ret" python3 - <<'PY'
          import os,json,pathlib,hashlib,sys
          m=json.load(open('r1-fec-build/manifest.json'))
          log=pathlib.Path('r1-fec-result/tests.log').read_text()
          n=log.count(' ... ok')
          ok=int(os.environ['TEST_EXIT'])==0 and n==2 and '2 passed; 0 failed' in log
          result={'source_sha':m['source_sha'],'run_id':m['run_id'],
                  'attempt':m['attempt'],'binary_sha256':m['test_binary_sha256'],
                  'lock_sha256':m['lock_sha256'],
                  'test_log_sha256':hashlib.sha256(log.encode()).hexdigest(),
                  'native_tests_passed':n,'test_exit':int(os.environ['TEST_EXIT']),
                  'result':'PASS' if ok else 'FAIL',
                  'scope':'R1_IN_PROCESS_IPV4_TCP_MTU_REAL_FEC_AEAD_REPLAY_POST_AUTH_ID_SCOPE_RS20_ONLY',
                  'not_qualified':'GO_V4_ADMISSION;AUTHENTICATED_SENDER_GENERATION;NATIVE_RAW_CARRIER;LIVE_BLOCK_ID_WRAP;PERFORMANCE;PRODUCTION_V4;PHYSICAL'}
          pathlib.Path('r1-fec-result/result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not ok:sys.exit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: r1-fec-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-fec-result/
          if-no-files-found: warn
          retention-days: 30
