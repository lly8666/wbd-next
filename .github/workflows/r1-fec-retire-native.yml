name: M0 scoped FEC rx heavy/compact retirement native
run-name: "M0|${{ github.sha }}|r1-fec-retire-native"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r1-fec-retire-native.yml"
      - ".github/workflows/r1-record-auth-replay.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/wbd-codec/**"
      - "crates/wbd-types/**"
permissions:
  contents: read
concurrency:
  group: fec-retire-native-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Compile exactly one Linux x64 Rust codec library native test executable
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          cargo test --release --locked -p wbd-codec --lib --no-run
          binary="$(find target/release/deps -maxdepth 1 -type f -name 'wbd_codec-*' -perm -u+x | head -n 1)"
          test -n "$binary"
          mkdir -p r1-fec-retire-build
          cp "$binary" r1-fec-retire-build/codec.test
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          parts=['crates/wbd-codec/src/fec_rx.rs',
                 'crates/wbd-codec/src/fec_block_id.rs',
                 'crates/wbd-codec/src/fec_retire_pressure_tests.rs',
                 'crates/wbd-codec/src/fec_auth_gate.rs',
                 'crates/wbd-codec/src/fec_auth_gate_tests.rs',
                 'crates/wbd-codec/src/fec_multiscope_tests.rs',
                 'crates/wbd-codec/src/link_fec_wire.rs',
                 'crates/wbd-codec/src/fec_tx.rs',
                 'crates/wbd-codec/src/fec_math.rs',
                 'crates/wbd-codec/src/lib.rs',
                 'Cargo.lock']
          m={'source_sha':os.environ['GITHUB_SHA'],
             'run_id':os.environ['GITHUB_RUN_ID'],
             'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
             'rust':'1.85.1','target':'x86_64-unknown-linux-gnu',
             'binary_sha256':sha('r1-fec-retire-build/codec.test'),
             'inputs':{p:sha(p) for p in parts},
             'scope':'M3_IMPORTED_POST_AUTH_PURE_FEC_HEAVY_COMPACT_RETIRE_FAKE_MONONS_ONLY'}
          pathlib.Path('r1-fec-retire-build/manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-fec-retire-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-fec-retire-build/
          retention-days: 30
          if-no-files-found: error
  consume:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r1-fec-retire-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-fec-retire-build/
      - name: Verify binary exact SOURCE and execute exactly 94 native R1 codec tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m=json.load(open('r1-fec-retire-build/manifest.json'))
          assert m['source_sha']==os.environ['GITHUB_SHA']
          assert m['run_id']==os.environ['GITHUB_RUN_ID']
          assert m['attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          assert m['rust']=='1.85.1' and m['target']=='x86_64-unknown-linux-gnu'
          assert sha('r1-fec-retire-build/codec.test')==m['binary_sha256']
          for p,expected in m['inputs'].items(): assert sha(p)==expected,p
          PY
          chmod +x r1-fec-retire-build/codec.test
          mkdir -p r1-fec-retire-result
          set +e
          r1-fec-retire-build/codec.test r1_ --nocapture >r1-fec-retire-result/tests.log 2>&1
          test_exit=$?
          set -e
          cat r1-fec-retire-result/tests.log
          TEST_EXIT="$test_exit" python3 - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          m=json.load(open('r1-fec-retire-build/manifest.json'))
          log=pathlib.Path('r1-fec-retire-result/tests.log').read_text()
          match=re.search(r'test result: ok\. (\d+) passed; 0 failed',log)
          count=int(match.group(1)) if match else 0
          required=['r1_retire_late_heavy_timer_catches_up_through_compact_10s_without_resurrection',
             'r1_retire_multi_block_oldest_pressure_late_systematic_compact_first_delivery',
             'r1_retire_parity_first_r_profiles_recover_only_missing_never_redeliver',
             'r1_retire_malformed_final_conflict_tombstones_while_other_blocks_survive',
             'r1_retire_capacity_floor_cannot_recreate_old_unseen_block_or_old_parity',
             'r1_retire_wire_wrap_trusted_epoch_direction_generation_and_rx_delivery',
             'r1_retire_blockid_late_timer_heavy_and_compact_expire_in_single_event',
             'r1_retire_go_pinned_56b_source_oracle_wrong_generation_does_not_alloc',
             'r1_multiscope_four_live_tunnel_direction_scopes_pn0_blockid1_independent',
             'r1_multiscope_misrouted_true_aead_ciphertext_denied_without_peer_pn_mutation',
             'r1_multiscope_opposite_direction_keys_and_replayed_ciphertext_do_not_cross',
             'r1_multiscope_one_tunnel_expiration_and_delayed_parity_do_not_retire_peer',
             'r1_multiscope_one_tunnel_pressure_exhausts_compact_without_peer_revival',
             'r1_multiscope_rekey_isolation_old_ciphertext_parity_and_pn0_new_epoch',
             'r1_multiscope_blockid_wrap_ffffffff_to_one_in_distinct_trusted_generations',
             'r1_multiscope_old_go_56b_oracle_identical_wire_separately_aead_admitted',
             'r1_multiscope_unbound_and_origin_mismatch_cannot_admit_other_scope']
          good=(int(os.environ['TEST_EXIT'])==0 and count==94
              and all(name+' ... ok' in log for name in required))
          out={'source_sha':m['source_sha'],'run_id':m['run_id'],
              'attempt':m['attempt'],'binary_sha256':m['binary_sha256'],
              'log_sha256':hashlib.sha256(log.encode()).hexdigest(),
              'native_tests_passed':count,'test_exit':int(os.environ['TEST_EXIT']),
              'new_adversarial_cases':len(required),'old_cases':85,
              'result':'PASS' if good else 'FAIL',
              'scope':'M3_FAKE_CLOCK_RETIRE_REAL_POST_AEAD_PN_MULTISCOPE_TEST_ORIGIN_ONLY',
              'not_qualified':'GO_V4_LIVE_GENERATION;RAW_AF_PACKET;NATIVE_WINDOWS_ARM;PERFORMANCE;PRODUCT;PHYSICAL'}
          pathlib.Path('r1-fec-retire-result/result.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not good:sys.exit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: r1-fec-retire-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: r1-fec-retire-result/
          retention-days: 30
          if-no-files-found: warn
