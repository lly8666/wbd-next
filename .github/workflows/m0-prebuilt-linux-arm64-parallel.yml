name: M0 exact prebuilt Linux original Go TLS and ARM64 native parallel
run-name: "M0 prebuilt Linux loss1 plus ARM64 10M trial | ${{ github.sha }}"
on:
  push:
    branches: [experiment/m0-prebuilt-linux-arm64-parallel-20261028]
    paths:
      - ".github/workflows/m0-prebuilt-linux-arm64-parallel.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  linux-x64-normal-onepct-real-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      FROZEN_PRODUCT_SOURCE: 33ed20b4717dac23a2d70c02da170a57daeb02e1
      WBD_V4_PUBLIC_MODE: normal
      WBD_V4_PUBLIC_KERNEL_LOSS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Download exact existing Linux original Go Rust compiled artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 40562809565
          github-token: ${{ github.token }}
          name: m0-plan024-linux-product
          path: precompiled-linux/
      - name: Fail closed source SHA and every prebuilt binary digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/m0-v4-public-real-linux-netns.sh)" = "471d41579153d3e6ca70cc4d9c30af0e8c01efb9"
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          p=pathlib.Path('precompiled-linux');j=json.loads((p/'manifest.json').read_text())
          assert j['source_sha']==os.environ['FROZEN_PRODUCT_SOURCE'],j
          assert j['original_go_sha']=='a7a82db31fe736ffedee330795a3234d358f1984'
          expected={'wbd-v4-client':'dd427dd7cc024584132ab2307917d9a495addf487876d12c6026833efcdf34e0',
                    'wbd-v4-server':'7bbd33c5420728571ff7f2ffe05f3711f4c331067192279dac4fa7a4ffe5dcee',
                    'libwbd_engine.so':'ebc4212acec05a5f812419531c06c9257bbd87fae0dbb231a41dd1d33adfd5de'}
          assert j['sha256']==expected,(j['sha256'],expected)
          for name,sha in expected.items():
            assert hashlib.sha256((p/name).read_bytes()).hexdigest()==sha,name
          print('M0_REUSED_BINARY_LINUX_X64_SOURCE_SHA256_VERIFIED')
          PY
          chmod 0755 precompiled-linux/wbd-v4-client precompiled-linux/wbd-v4-server
      - name: Real original Go Rust Normal 1 percent kernel netem 512-packet and owned Stop
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping iptables openssl
          bash tools/m0-v4-public-real-linux-netns.sh "$PWD/precompiled-linux"
          echo M0_PREBUILT_NORMAL_1PCT_TRUE_OS_KERNEL_RESULT_RECORDED
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-prebuilt-linux-loss1-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixed-kernel-result/
          if-no-files-found: warn
          retention-days: 30

  arm64-normal-native-bidir-udp10m-60s:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    env:
      WBD_ARM64_FROZEN_SOURCE: f7ee097e116ab813f9ba23514df01a3f0f9d342a
      WBD_V4_MODE: normal
      WBD_ARM64_CAPACITY_TRIAL: udp10m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Download already compiled original Go Rust ARM64 native bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 40557336142
          github-token: ${{ github.token }}
          name: arm64-public-go-rust-40557336142-1
          path: arm64-public-bundle/
      - name: Validate original ARM64 binary source, ISA-L and per-file SHAs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(git hash-object tools/arm64_linux_netns_smoke.sh)" = "28bee73a83907de2302b51b3732090ef389fc8d5"
          (cd arm64-public-bundle && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json,os,pathlib
          j=json.loads(pathlib.Path('arm64-public-bundle/manifest.json').read_text())
          assert j['source']==os.environ['WBD_ARM64_FROZEN_SOURCE']
          assert j['architecture']=='aarch64'
          assert j['go_source']=='a7a82db31fe736ffedee330795a3234d358f1984'
          assert j['isa_source']=='c387163fcbca62701d646149564c550c78a4f985'
          print('M0_REUSED_BINARY_ARM64_SOURCE_SHA256_VERIFIED')
          PY
      - name: Exactly one original native ARM64 Normal UDP10M 60s capacity trial
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables iperf3
          bash tools/arm64_linux_netns_smoke.sh
          test -s arm64-netns-result/capacity.json
          test -s arm64-netns-result/receipt.json
          echo M0_PREBUILT_ARM64_10M_CAPACITY_TRIAL_RECORDED_NOT_PERFORMANCE_PROMOTION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-prebuilt-arm64-10m-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-netns-result/
          if-no-files-found: warn
          retention-days: 30
