name: M0 PLAN027 H718 one original Fixed6 C50 capacity source-reused
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h718-fixed50-original-source-reuse.yml]
permissions: {contents: read, actions: write}
jobs:
  original-native-fixed50:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h718-fixed50-reuse]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: d0661a2e110b523ad06b311da23fc1b7291442ba
      BUILD: "41274450306"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One actual Fixed6 50Mbps 25ms zero-loss 60s original signed two OS and owned Stop
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD" --jq .head_sha)" = "$SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100" |
            jq -e --arg win "m0-wl-windows-product-binaries-$SOURCE" '
              [.artifacts[]|select(.expired==false)|.name]
              | index($win)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py scenarios)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario("scenarios/plan027-c-fixed-50m-25ms-loss0-60s.json")
          assert s["public_mode"]=="fixed" and s["duration_s"]==60
          assert s["tun_mtu"]==1400 and s["seed"]==20261030
          for k in ("windows_to_linux","linux_to_windows"):
            d=s[k]
            assert d["offered_mbps"]==50 and d["delay_ms"]==25 and d["loss_pct"]==0
          print("M0_H718_FROZEN_FIXED50_GENUINE_C50",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-c-fixed-50m-25ms-loss0-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|fixed|$scene"
          old="$(gh api "repos/$GH_REPO/actions/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id' | head -1)"
          if [ -n "$old" ]; then echo "M0_H718_ALREADY_DISPATCHED run=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main             -f public_mode=fixed -f run_n0=false -f perf_scenario_file="$scene"             -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$SOURCE"
          echo "M0_H718_FIXED50_NATIVE_ONE_GENUINE_DISPATCH_ONLY source=$SOURCE"
