# Independent GE1% 400ms RTT scope, following client-only 0% positive
# screen; true Go TLS/Rust 3 netns with original kernel TCP4 + UDP/TCP echo.
# One native ARM64 runner, same frozen binary hashes across A64/B128/A'64.
name: M0 PLAN029 ARM GE1 lower-memory client128 inbox A-B-A
run-name: "M0-029-ARM GE1 client inbox A64-B128-A64 | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-029-throughput-arm-fair']
    paths:
      - '.github/workflows/qa-m0-029-arm-client-inbox-128-ge1-abca.yml'
      - 'tools/m0_029_native_client_inbox_128_ge1_abca.py'
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: m0-029-arm-client-inbox-ge1-${{ github.sha }}
  cancel-in-progress: false
jobs:
  genuine-client-inbox-ge1:
    name: 'Native ARM64 original Go TLS Rust GE1 client-only bounded capacity'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: aarch64
      WBD_PLAN029_LINUX_DUAL_ISA: "1"
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Source locked GE1 actual native owner and scope preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          test -c /dev/net/tun
          sudo -n true
          test "$(git hash-object tools/m0_029_native_inbox_abca.py)" = b1094391ec9729931979c5158357ef2cbf72b84e
          python3 -m py_compile tools/m0_029_native_client_inbox_128_ge1_abca.py \
            tools/m0_029_native_inbox_abca.py tools/m0_h2244_smallflow_echo.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/m0_029_native_client_inbox_128_ge1_abca.py').read_text()
          for needle in ('M029_CLIENT_GE1_COLD_INBOX_NOT_ACTUALLY_APPLIED',
                         'M029_CLIENT_GE1_SERVER_CONTROL_CAPACITY_CHANGED',
                         'native_cold_readback_verified',
                         'REAL_STATIONARY_GILBERT_ELLIOTT_GE1',
                         'original_main()'):
              assert needle in s,needle
          assert 'Owned.impair=zero_impair' not in s
          assert 'WBD_H2241' not in s
          assert 'selected=128 if stage_slots==256 else 64' in s
          assert 'Owned.impair=zero_impair' not in s
          print('M029_CLIENT_GE1_REAL_FROZEN_NATIVE_SOURCE_READY',flush=True)
          PY
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            autoconf automake libtool make gcc g++ nasm python3 \
            iproute2 iptables iputils-ping ethtool iperf3 openssl
      - name: One exact-SOURCE original Go TLS Rust ISA-L release build
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          bash tools/m0_plan029_linux_dual_native_build.sh >m029-client-128-ge1-build.log 2>&1 || \
            { tail -n 110 m029-client-128-ge1-build.log;exit 2; }
          python3 - <<'PY'
          import json,os
          m=json.load(open('linux-plan029-public-bundle/manifest.json'))
          assert m['source_sha']==os.environ['GITHUB_SHA']
          assert m['architecture']=='aarch64'
          assert len(m['sha256'])==3
          print('M029_CLIENT_GE1_GORUST_RELEASE_SOURCE_MATCH',flush=True)
          PY
      - name: True GE1% 200ms each-way 4 TCP flows and concurrent small A64-B128-A64
        shell: bash
        timeout-minutes: 17
        run: |
          set -euo pipefail
          python3 tools/m0_029_native_client_inbox_128_ge1_abca.py
          python3 - <<'PY'
          import json,os
          d=json.load(open('m029-client-inbox-128-ge1-abca/summary.json'))
          assert d['status']=='PASS_SCOPED_REAL_ABA_MEASURED_NOT_PRODUCT_GAIN'
          assert d['source_sha']==os.environ['GITHUB_SHA']
          assert d['run_id']==os.environ['GITHUB_RUN_ID']
          assert d['scenario']=='GE1_BURST_200MS_EACH_WAY_NATIVE_ARM64_CLIENT_ONLY_INBOX_128_ABA'
          assert d['netem_ge_stationary_parameters']['analytical_mean_loss_pct']==1.0
          assert abs(d['netem_ge_stationary_parameters']['good_to_bad_pct']-0.252809)<1e-6
          assert [x['client_inbox_slots'] for x in d['phases']]==[64,128,64]
          assert [x['name'] for x in d['phases']]==[
              'original_before','inbox128_candidate','original_after']
          assert [x['server_inbox_slots'] for x in d['phases']]==[64,64,64]
          assert all(x['native_cold_readback_verified']
                     and x['client_generation']>0 and x['server_generation']>0
                     and x['measure']['original_product_tcp']['tcp_streams']==4
                     and all(x['owned_stop'][role]['generation']>0
                             for role in ('client','server'))
                     for x in d['phases'])
          print('M029_CLIENT_GE1_REAL_ARM_ABA_SCOPED_MEASURED_NOT_PRODUCT_GAIN',flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-029-arm-client-inbox-128-ge1-aba-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            m029-client-inbox-128-ge1-abca/
            m029-client-128-ge1-build.log
          retention-days: 14
          if-no-files-found: warn
