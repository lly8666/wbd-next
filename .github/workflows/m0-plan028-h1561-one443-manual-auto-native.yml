name: M0 PLAN028 H1561 real native same-server Alice static and Bob automatic IPv4
run-name: PLAN028 H1561 one443 actual Alice manual Bob auto TLS Rust M4 UDP and owned Stop
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-h1561-one443-manual-auto-native.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  one-real-native-manual-auto:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Assemble exact original Go, build current Rust M4 and native client/server once
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          mkdir -p fixed-build fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          python3 - <<'PY'
          import json,os,pathlib
          v=json.loads(pathlib.Path("fixed-kernel-result/assembly.json").read_text())
          assert v["overlay_source"]==os.environ["GITHUB_SHA"]
          required={"internal/v4productcli/linux.go","internal/v4productcli/game_linux.go","internal/v4productcli/manual_lease_map_linux_test.go","internal/realityfront/admission_v4.go","internal/realityfront/v4_manual_lease_map_test.go"}
          assert required.issubset({x["path"] for x in v["files"]})
          PY
          # The mature H1376 original-Go original TLS/Rust assembly uses
          # CURRENT source overlays for all Linux cold runtime interfaces,
          # not only the manifest create list. Reuse its exact bounded copy.
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path.cwd()
          donor=root/"legacy"
          allowed_tests={"admission_v4_test.go","v4_tls_handshake_contract_test.go",
              "manual_lease_map_linux_test.go","v4_manual_lease_map_test.go",
              "manual_lease_auto_proof_linux_test.go"}
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in allowed_tests:
                      continue
                  dst=donor/part/src.name
                  if dst.exists():
                      assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              src=root/"r0/go_overlay/internal/faketcp"/name
              dst=donor/"internal/faketcp"/name
              assert not dst.exists(),str(dst)
              dst.write_bytes(src.read_bytes())
          src=root/"r0/go_overlay/internal/v4productcli/secret_linux_test.go"
          dst=donor/"internal/v4productcli/secret_linux_test.go"
          if dst.exists():
              assert dst.read_bytes()==src.read_bytes()
          else:
              dst.write_bytes(src.read_bytes())
          print("PLAN028_H1562_MATURE_H1376_EXACT_CURRENT_GO_LINUX_COLD_SOURCE_ASSEMBLED",flush=True)
          PY
          for role in client server;do
            mkdir -p "legacy/cmd/wbd-v4-$role"
            cp "r0/go_overlay/cmd/wbd-v4-$role/main.go" "legacy/cmd/wbd-v4-$role/main.go"
          done
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-build.log 2>&1 || { tail -80 fixed-kernel-result/rust-build.log; exit 1; }
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          (cd legacy && go test -v -count=1 -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^(TestPLAN028SimpleSharedServerAutoAndManualDefaults|TestPLAN028NamedRosterAutoIPRequiresDerivedAuthenticatedTunnel|TestPLAN028AccountManualProtectedTunnelIdentity)$' ./internal/v4productcli) >fixed-kernel-result/h1561-contract-unit.log 2>&1 || { tail -70 fixed-kernel-result/h1561-contract-unit.log; exit 1; }
          (cd legacy && go test -v -count=1 -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestPLAN028BoundStaticManualAndPoolAutoSelection$' ./internal/realityfront) >>fixed-kernel-result/h1561-contract-unit.log 2>&1 || { tail -70 fixed-kernel-result/h1561-contract-unit.log; exit 1; }
          for test in TestPLAN028SimpleSharedServerAutoAndManualDefaults TestPLAN028BoundStaticManualAndPoolAutoSelection TestPLAN028NamedRosterAutoIPRequiresDerivedAuthenticatedTunnel TestPLAN028AccountManualProtectedTunnelIdentity;do
            grep -Fq -- "--- PASS: $test" fixed-kernel-result/h1561-contract-unit.log
          done
          echo H1561_ORIGINAL_GO_STATIC_AUTO_POSITIVE_AND_NEGATIVE_ACTUALLY_EXECUTED_PASS
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          out={"source_sha":os.environ["GITHUB_SHA"],"arch":"native_x86_64","sha256":{}}
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
            raw=(root/name).read_bytes()
            assert raw[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",raw,18)[0]==62
            out["sha256"][name]=hashlib.sha256(raw).hexdigest()
          (root/"manifest.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: Real one443 manually reserved Alice and auto-installed Bob TUN UDP and exact Stop
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          bash -n tools/m0-plan028-h1561-one443-manual-auto-native.sh
          bash tools/m0-plan028-h1561-one443-manual-auto-native.sh fixed-build >fixed-kernel-result/h1561-native.log 2>&1 || { tail -125 fixed-kernel-result/h1561-native.log; exit 1; }
          grep -Fq M0_PLAN028_H1561_AUTH_ALICE_MANUAL_BOB_AUTO_TLS443_RUST_TUN_STOP_PASS fixed-kernel-result/h1561-native.log
          grep -Fq M0_PLAN028_H1561_ORIGINAL_TLS_MANUAL_AUTO_ISOLATED_A_B_AFTER_A_STOP_PASS fixed-kernel-result/h1561-native.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"]
          for name,sha in m["sha256"].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
          d=json.loads(pathlib.Path("fixed-kernel-result/h1561-original-manual-auto.json").read_text())
          assert d["classification"]=="PASS_SCOPED_ORIGINAL_LINUX_ALICE_MANUAL_BOB_AUTO_TLS443_RUST_M4"
          assert d["real_UDP_echoes"]==59 and d["actual_tls_sessions"]==3
          a,b=d["real_client_kernel_TUN_addresses"]
          assert a=="10.66.0.2" and b.startswith("10.66.0.") and 128<=int(b.split(".")[-1])<=254
          assert d["server_authenticated_manual_leases4"]=={"alice":"10.66.0.2/32"}
          assert d["bob_ip_source"]=="authenticated_auto_lease_server_pool"
          assert d["original_exact_all_client_Stop"] and d["server_exact_shared_tun_Stop"] and d["server_unrouted"]==0 and d["server_backpressure"]==0
          print("PLAN028_H1561_GENUINE_MANUAL_STATIC_AND_AUTO_LEASE_NATIVE_UDP_AND_OWNED_STOP_PASS",flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1561-original-manual-auto-one443-${{ github.run_id }}
          path: fixed-kernel-result/
          if-no-files-found: warn
          retention-days: 7
