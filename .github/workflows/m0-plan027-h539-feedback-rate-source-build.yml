# H541 repeat only because H539 old unit assumed oldest SACK first; new source fixes unit ordering.
name: M0 PLAN027 H539 simple half-gap source real 0pct build once
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h539-feedback-rate-source-build.yml]
permissions: {contents: read, actions: write}
jobs:
  build-and-one-zero:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h539-feedback-source-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One immutable SOURCE original Go TLS Windows Linux build with real zero loss
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          rows=[0,1,5,15,30]
          for p in rows:
              path=f'scenarios/plan027-h539-normal-10m-250ms-loss{p}-60s.json' if p!=30 else 'scenarios/wl-outer-repair-10m-250ms-loss30-60s.json'
              q=read_scenario(path)
              assert q['public_mode']=='normal' and q['duration_s']==60 and q['seed']==20261030
              assert all(q[d]['offered_mbps']==10 and q[d]['delay_ms']==250 and q[d]['loss_pct']==p for d in ('windows_to_linux','linux_to_windows'))
              print('H539_SCENARIO_FROZEN',p,q['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false  \
            -f perf_scenario_file=scenarios/plan027-h539-normal-10m-250ms-loss0-60s.json \
            -f perf_reuse_run_id="" -f perf_binary_source_sha=""
          echo H539_ONE_SOURCE_NEW_BUILD_ZERO_LOSS_DISPATCHED
