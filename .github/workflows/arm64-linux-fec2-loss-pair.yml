# Independent bounded functionality scenarios on TWO distinct ARM64 runners.
# Preexisting Normal/Fixed/Auto no-loss success is not rerun. No first-arrival
# p99, FEC recovered-source count, native product backend or physical claim.
name: ARM64 parallel Fixed and Auto real-kernel loss observations
run-name: ARM64 FEC2 impaired functional pair ${{ github.sha }}
on:
  push:
    branches: [feature/arm64-linux-android-openwrt-autoaccel]
    paths:
      - '.github/workflows/arm64-linux-fec2-loss-pair.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic-impaired-traffic:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [fec-fixed, fec-auto]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    env:
      WBD_ARM64_FROZEN_SOURCE: 9194e20f2f53cd4ac0b85d3e7f5aa136f164d2c3
      WBD_V4_MODE: ${{ matrix.mode }}
      WBD_ARM64_DAMAGE_TRIAL: policy-2pct
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 39752535971
          github-token: ${{ github.token }}
          name: arm64-public-go-rust-39752535971-1
          path: arm64-public-bundle/
      - name: Authentic original-Go TLS Rust kernel/TUN under bounded independent two-way netem
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables
          bash tools/arm64_linux_netns_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-impaired-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-netns-result/
          if-no-files-found: warn
          retention-days: 30
