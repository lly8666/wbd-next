# Source H556 repairs real older-SACK cursor range panic before the exact once build.
name: M0 PLAN027 H555 structural ACK gap original frozen zero once
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h555-structural-zero.yml]
permissions: {contents: read, actions: write}
jobs:
  once:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h555-source-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Only one original signed two-OS zero loss build for one SOURCE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          x=read_scenario('scenarios/plan027-h539-normal-10m-250ms-loss0-60s.json')
          assert x['public_mode']=='normal' and x['duration_s']==60
          assert all(x[d]['loss_pct']==0 and x[d]['offered_mbps']==10 and x[d]['delay_ms']==250 for d in ('windows_to_linux','linux_to_windows'))
          print('H555_FROZEN_SOURCE_ZERO',x['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-h539-normal-10m-250ms-loss0-60s.json \
            -f perf_reuse_run_id="" -f perf_binary_source_sha=""
          echo H555_ONE_SOURCE_0PCT_ORIGINAL_DISPATCHED
