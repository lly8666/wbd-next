name: M0 PLAN027A H957 parallel genuine Game staged and ARM64
run-name: "M0|PLAN027A-H957-PARALLEL|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027a-h957-parallel.yml]
permissions: {contents: read, actions: write}
jobs:
  stage-game-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", BIN_SHA: "54160ac88b9b41d10f4c3f885879dd68646466a0", BIN_RUN: "41456643128"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Source and binary provenance, bounded real kernel scenario
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BIN_RUN" --jq .head_sha)" = "$BIN_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BIN_RUN" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/runs/$BIN_RUN/artifacts" --jq '.artifacts[] | select(.expired==false) | .name' >/tmp/verify-artifacts
          grep -Fx "m0-wl-windows-product-binaries-$BIN_SHA" /tmp/verify-artifacts
          grep -Fx m0-plan024-linux-product /tmp/verify-artifacts
          git fetch --depth=1 origin "$BIN_SHA"
          delta="$(git diff --name-only "$BIN_SHA" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.lock Cargo.toml tools/prepare_windows_wiring.py)"
          test -z "$delta" || { echo "H957_REFUSE_PRODUCT_DELTA $delta"; exit 1; }
          python3 -m unittest tests.test_m0_wl_perf_v2_config tests.test_m0_wl_native_mtu_contract -v
      - name: One true signed Windows Wintun and Linux WSL2 staged FEC action
        shell: bash
        run: |
          set -euo pipefail
          s=scenarios/plan027a-h957-game4fec-1460-3m-staged5-30-5-210s.json
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game4-fec -f native_outer_mtu=default1460 \
            -f run_n0=false -f outer_repair=on -f "perf_scenario_file=$s" \
            -f "perf_reuse_run_id=$BIN_RUN" -f "perf_binary_source_sha=$BIN_SHA"
          echo H957_REAL_GAME_KERNEL_STAGED_DISPATCHED_NOT_QUALIFIED
  arm64-current-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", cache: false}
      - name: One source-exact true ARM64 original Go Rust native build
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc iproute2 iputils-ping openssl iptables
          bash tools/arm64_public_go_rust_bundle.sh
          (cd arm64-public-bundle && sha256sum -c SHA256SUMS)
      - name: Reuse compiled ARM64 binary over nine native real kernel netns boundary modes
        shell: bash
        run: |
          set -euo pipefail
          for case in normal:1500:1500 fec-fixed:1500:1500 fec-auto:1500:1500 normal:1280:1280 fec-fixed:1280:1280 fec-auto:1280:1280 fec-fixed:1500:1280 game2:1500:1500 game4:1280:1280; do
            IFS=: read -r mode mtu peer <<<"$case"
            WBD_V4_MODE="$mode" WBD_ARM64_OUTER_MTU="$mtu" WBD_ARM64_SERVER_OUTER_MTU="$peer" WBD_ARM64_MTU_BOUNDARY=1 bash tools/arm64_linux_netns_smoke.sh
            mv arm64-netns-result "arm64-mtu-$mode-$mtu-$peer"
            echo "H957_ARM64_CASE_PASS source=$GITHUB_SHA case=$case"
          done
          echo H957_ARM64_SOURCE_EXACT_NINE_NATIVE_CASES_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan027a-h957-arm64-${{ github.run_id }}
          path: |
            arm64-public-bundle/manifest.json
            arm64-public-bundle/SHA256SUMS
            arm64-mtu-*/
          if-no-files-found: warn
