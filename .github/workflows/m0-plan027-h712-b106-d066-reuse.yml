name: M0 PLAN027 H712 original Windows authenticated dead106 and new TLS same binary
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h712-b106-d066-reuse.yml]
permissions: {contents: read, actions: write}
jobs:
  one-signed-native-b106:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h712-b106-frozen]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: d0661a2e110b523ad06b311da23fc1b7291442ba
      BUILD: "41274450306"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify real original TLS/Rust binaries then dispatch precisely one dead106 scene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD" --jq .head_sha)" = "$SOURCE"
          # Original immutable genuine Windows and Linux product artifacts are
          # already compiled. Build job may still be running its independent
          # GameFEC scenario: only exact uploaded binaries are reused here.
          gh api "repos/$GH_REPO/actions/runs/$BUILD/artifacts?per_page=100" |
            jq -e --arg win "m0-wl-windows-product-binaries-$SOURCE" '
              [.artifacts[]|select(.expired==false)|.name]
              | index($win)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py scenarios)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario("scenarios/plan027-b-normal-blackhole106-recover-2m-25ms-0loss-12s.json")
          assert s["public_mode"]=="normal" and s["lifecycle_blackhole_s"]==106
          assert s["duration_s"]==12 and s["tun_mtu"]==1400 and s["seed"]==20261030
          for direction in ("windows_to_linux","linux_to_windows"):
              d=s[direction]
              assert d["offered_mbps"]==2 and d["delay_ms"]==25 and d["loss_pct"]==0
          print("M0_H712_GENUINE_B106_FROZEN_SOURCE",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-b-normal-blackhole106-recover-2m-25ms-0loss-12s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|normal|$scene"
          old="$(gh api "repos/$GH_REPO/actions/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id' | head -1)"
          if [ -n "$old" ]; then
            echo "M0_H712_ALREADY_DISPATCHED exact_run=$old";exit 0
          fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main             -f public_mode=normal -f run_n0=false -f perf_scenario_file="$scene"             -f perf_reuse_run_id="$BUILD" -f perf_binary_source_sha="$SOURCE"
          echo "M0_H712_B106_NEW_TLS_GENUINE_NATIVE_DISPATCHED_NOT_PASS source=$SOURCE"
