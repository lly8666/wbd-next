name: PLAN028 H1637 one signed Windows Game4 Off original TLS Rust loss30 delay250 prebuilt
on:
  push:
    branches: [main]
    paths: [".github/workflows/m0-plan028-h1637-windows-game4-off-loss30-250-prebuilt-dispatch.yml"]
permissions: {contents: read, actions: write}
jobs:
  one-source-locked-signed-native-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_SOURCE: 8a31375e36bb6a93860c5579e64b4a39d0b6e346
      BUILD_ACTION: "43027983611"
      SCENE: scenarios/plan028-h1637-game4-off-outer1460-10m250ms30-60s.json
      BASE_SCENE: scenarios/plan027-c-game4-off-10m-250ms-loss30-60s.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify source-locked product and one real native mode/MTU/damage scene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test "$GITHUB_REF_NAME" = main
          git fetch --quiet --depth=1 origin "$PRODUCT_SOURCE"
          test "$(git rev-parse FETCH_HEAD)" = "$PRODUCT_SOURCE"
          changes="$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py "$BASE_SCENE")"
          test -z "$changes" || { echo "H1637 changed frozen product or original base scenario: $changes" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_ACTION" |
            python3 -c 'import json,sys,os; x=json.load(sys.stdin);assert x["head_sha"]==os.environ["PRODUCT_SOURCE"] and x["conclusion"]=="success"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_ACTION/artifacts?per_page=100" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); a={z["name"] for z in d["artifacts"] if not z["expired"]};assert "m0-plan024-linux-product" in a and any(n.startswith("m0-wl-windows-product-binaries-") for n in a)'
          python3 - <<'PY'
          import os
          from tools.m0_wl_perf_v2_config import read_scenario
          from tools.m0_wl_native_mtu_contract import configured_native_test_mtu
          s=read_scenario(os.environ["SCENE"]); baseline=read_scenario(os.environ["BASE_SCENE"])
          actual=dict(s); old=dict(baseline)
          digest=actual.pop("scenario_sha256");old.pop("scenario_sha256")
          old["scenario_id"]="plan028-h1637-game4-off-outer1460-10m250ms30-60s"
          old["tun_mtu"]=1460
          assert old==actual,"H1637 exact original mode scenario plus only ID/outer1460"
          assert s["public_mode"]=="game4" and s["tun_mtu"]==1460 and s["duration_s"]==60
          assert s["warmup_s"]==5 and s["drain_s"]==10
          for direction in ("windows_to_linux","linux_to_windows"):
              d=s[direction]
              assert d["offered_mbps"]==10 and d["delay_ms"]==250 and d["loss_pct"]==30
              assert max(p["udp_payload_bytes"] for p in d["packet_mix"])==1200
          os.environ["WBD_WL_NATIVE_OUTER_MTU_REQUEST"]="default1460"
          os.environ["WBD_WL_TUN_MTU"]="1460"
          assert configured_native_test_mtu()==1460
          print("H1637_GAME4_OFF_ONE_SOURCE_LOCKED_SIGNED_GENUINE_WEAKNET_SCENE_READY",digest,flush=True)
          PY
      - name: Dispatch exactly one separate true Npcap Wintun and Linux original Go Rust scenario
        shell: bash
        run: |
          set -euo pipefail
          # Wrapper is not a network PASS. Target must independently prove actual
          # original Go TLS443, Rust per-lane selection/parity, kernel app and Stop.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            python3 -c 'import json,sys,os; d=json.load(sys.stdin); print(" ".join(str(x["id"]) for x in d["workflow_runs"] if x.get("head_sha")==os.environ["GITHUB_SHA"] and os.environ["SCENE"] in x.get("display_title","") and x.get("status") in ("queued","in_progress","completed")))' )"
          test -z "$existing" || { echo "H1637_EXISTING_SCENE_NO_DUPLICATE runs=$existing";exit 0; }
          gh workflow run m0-wl-public-normal-full.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f public_mode=game4 -f native_outer_mtu=default1460 \
            -f run_n0=false -f outer_repair=on \
            -f "perf_scenario_file=$SCENE" \
            -f "perf_reuse_run_id=$BUILD_ACTION" \
            -f "perf_binary_source_sha=$PRODUCT_SOURCE"
          echo H1637_GAME4_OFF_DISPATCHED_ONE_SIGNED_SOURCE8A_SCENE_NOT_YET_NATIVE_PASS
