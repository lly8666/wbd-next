name: M0 native RAW FQ timing
on:
  workflow_call:
    inputs:
      order:
        required: true
        type: string
permissions: {contents: read, actions: read}
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      FQ_ORDER: ${{ inputs.order }}
      NATIVE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Reuse exact native SOURCE test binary
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$NATIVE_ARCH"
          for i in $(seq 1 90);do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/qa-m0-dual-rust-tcp-core.yml/runs?head_sha=$GITHUB_SHA" --jq '.workflow_runs[0].id // empty')
            if test -n "$run";then
              artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"fq-native-test-$NATIVE_ARCH\" and .expired==false) | .id")
              if test -n "$artifact";then break;fi
            fi
            sleep 10
          done
          test -n "${artifact:-}"
          mkdir -p fq-build fq-out
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "fq-native-test-$NATIVE_ARCH" -D fq-build
          test "$(cat fq-build/source.txt)" = "$GITHUB_SHA"
          (cd fq-build && sha256sum -c SHA256SUMS)
          chmod +x fq-build/fq-test
          cp fq-build/{source.txt,SHA256SUMS} fq-out/
          printf '%s %s\n' "$run" "$artifact" > fq-out/build-identity.txt
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 ethtool iputils-ping
      - name: Actual local kernel departure and release receipts
        run: |
          python3 -m py_compile tools/m0_raw_fq_timing_fixture.py
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" FQ_ORDER="$FQ_ORDER" python3 -u tools/m0_raw_fq_timing_fixture.py fq-build/fq-test
      - name: Preserve evidence
        if: always()
        run: |
          if test -d fq-out;then sudo chown -R "$(id -u):$(id -g)" fq-out;fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: fq-timing-${{ matrix.arch }}, path: fq-out/, if-no-files-found: warn, retention-days: 14}
