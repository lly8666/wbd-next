name: M0 PLAN027 H667 Game2 fixed6 minimum exact H664 native binaries
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h667-fec-minimum-on-correct-h664-binaries.yml]
permissions: {contents: read, actions: write}
jobs:
  one-correct-source-game-fec:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h667-fec-min]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 5fb4c9d79d481334631a4f894e82d2f8c7b078ca
      BUILD_RUN: "41224887969"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Reuse same genuinely compiled new Windows Go and Rust and Linux original product once, not old ABI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' > /dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario("scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json")
          assert s["public_mode"]=="game2-fec" and s["duration_s"]==10
          for name in ("windows_to_linux","linux_to_windows"):
              r=s[name]
              assert r["offered_mbps"]==1 and r["loss_pct"]==0 and r["delay_ms"]==25
          print("H667_EXACT_NEW_SOURCE_GAMEFEC_MINIMUM",s["scenario_sha256"])
          PY
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          prior="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg t "$title" '.workflow_runs[]|select(.display_title==$t)|.id'|head -1)"
          if [ -n "$prior" ];then echo "H667_ALREADY_DISPATCHED run=$prior";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo "H667_ONE_REAL_NATIVE_GAMEFEC_MINIMUM_WITH_EXACT_NEW_SOURCE_DISPATCHED_NOT_PASS"
