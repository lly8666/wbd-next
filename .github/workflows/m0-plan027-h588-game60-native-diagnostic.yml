name: M0 PLAN027 H588 bounded Game4 native 60s origin diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h588-game60-native-diagnostic.yml]
permissions: {contents: read, actions: write}
jobs:
  once:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h588-game-native-diagnose]')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BINARY_SOURCE: cb475c89a29bc79c1608b747e76e136fd9341500
      BINARY_BUILD: "41177831521"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Single original Game4 FEC 10M 250ms 60s with bounded inner evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          git fetch --depth=1 origin "$BINARY_SOURCE"
          test -z "$(git diff --name-only "$BINARY_SOURCE" HEAD -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          from tools.m0_wl_native_step_runner import native_batch_deadline
          s=read_scenario('scenarios/plan027-c-game4-fec-10m-250ms-loss0-60s.json')
          assert s['public_mode']=='game4-fec' and s['duration_s']==60
          for d in ('windows_to_linux','linux_to_windows'):
              assert s[d]['loss_pct']==0 and s[d]['offered_mbps']==10 and s[d]['delay_ms']==250
          assert native_batch_deadline({'WBD_WL_V2_SCENARIO':'scenarios/plan027-c-game4-fec-10m-250ms-loss0-60s.json','WBD_WL_PUBLIC_MODES':'game4-fec'})==440
          assert native_batch_deadline({'WBD_WL_V2_SCENARIO':'scenarios/plan027-c-normal-50m-25ms-loss0-60s.json','WBD_WL_PUBLIC_MODES':'normal'})==970
          print('H588_EXACT_GAME60_SCENE',s['scenario_sha256'])
          PY
          source="$(gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD")"
          test "$(jq -r .head_sha <<<"$source")" = "$BINARY_SOURCE"
          test "$(jq -r .conclusion <<<"$source")" = success
          artifacts="$(gh api "repos/$GH_REPO/actions/runs/$BINARY_BUILD/artifacts?per_page=100")"
          jq -e --arg n "m0-wl-windows-product-binaries-$BINARY_SOURCE" '.artifacts[]|select(.name==$n and .expired==false)' <<<"$artifacts" >/dev/null
          jq -e '.artifacts[]|select(.name=="m0-plan024-linux-product" and .expired==false)' <<<"$artifacts" >/dev/null
          before="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=70" --jq '.workflow_runs[].id')"
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game4-fec -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-c-game4-fec-10m-250ms-loss0-60s.json \
            -f perf_reuse_run_id="$BINARY_BUILD" -f perf_binary_source_sha="$BINARY_SOURCE"
          echo H588_ONE_ORIGINAL_DIAGNOSTIC_DISPATCHED_NO_BUILD
          runid=""
          for i in $(seq 1 24);do
            count=0
            for candidate in $(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=70" --jq '.workflow_runs[].id');do
              grep -qx "$candidate" <<<"$before" && continue
              test "$(gh api "repos/$GH_REPO/actions/runs/$candidate" --jq .head_sha)" = "$GITHUB_SHA" || continue
              runid="$candidate";count=$((count+1))
            done
            if [ "$count" -eq 1 ];then break;fi
            if [ "$count" -gt 1 ];then echo H588_AMBIGUOUS_ACTION_NO_PRODUCT_CLAIM >&2;exit 2;fi
            sleep 5
          done
          test -n "$runid" || { echo H588_ID_NOT_FOUND >&2;exit 2; }
          echo "H588_EXACT_GAME_DIAGNOSTIC_RUN=$runid"
          for i in $(seq 1 40);do
            check="$(gh api "repos/$GH_REPO/actions/runs/$runid")"
            if [ "$(jq -r .status <<<"$check")" = completed ];then
              echo "H588_TRUE_GAME60_FINAL run=$runid conclusion=$(jq -r .conclusion <<<"$check")"
              if [ "$(jq -r .conclusion <<<"$check")" != success ];then
                echo "H588_GAME60_NOT_PASS_CHECK_REAL_NATIVE_REPORT_AND_ALLOWLISTED_ERRORS" >&2;exit 1;
              fi
              mkdir -p game10
              gh run download "$runid" --repo "$GH_REPO" --name m0-wl-full-public-normal-direct --dir game10
              SOURCE="$BINARY_SOURCE" python3 - <<'PY'
          import json,os
          from tools.m0_wl_perf_v2_config import read_scenario
          r=json.load(open('game10/report.json'))
          assert r['linux_binary_source']==os.environ['SOURCE']
          assert r['mode_public']=='PASS_ACTUAL_WINDOWS_LINUX_NATIVE_game4-fec'
          assert r['stop']=='PASS_BOTH_OWNED'
          assert r['app_duplex']=='PASS_ACTUAL_TWO_OS_KERNEL_UDP'
          assert r['tcp_duplex']=='PASS_ACTUAL_TWO_OS_KERNEL_TCP'
          assert r['WL_V2']['status']=='MEASURED_BOTH_OS_KERNEL'
          assert r['WL_V2']['scenario_sha256']==read_scenario('scenarios/plan027-c-game4-fec-10m-250ms-loss0-60s.json')['scenario_sha256']
          assert min(r['WL_V2']['first_delivery_fraction'].values())>=.999
          print('H588_REAL_GAME10_BUSINESS_FIRST_STOP_PASS')
          PY
              exit 0
            fi
            sleep 20
          done
          echo H588_NATIVE_RUN_NOT_FINISHED_WITHIN_WATCH_NO_DUPLICATE >&2
          exit 2
