name: M0 PLAN028 x86 Normal fixed6 real two physical source4 changes while Game4 remains healthy
run-name: PLAN028 H1197 x86 Normal fixed6 highest original Rust FEC profile dual physical handover
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-x86-normalfixed6-two-physical-handover.yml"
      - "tools/m0-plan028-x86-normalfixed6-two-physical-handover-fixture.py"
      - "r0/go_overlay/internal/realityfront/admission_v4_test.go"
      - "r0/go_overlay/internal/v4productcli/game_linux.go"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-x86-one443-normal-game2-game4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_SOURCE: 8a31375e36bb6a93860c5579e64b4a39d0b6e346
      PRODUCT_BUILD_ACTION: "43027983611"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 43027983611
          github-token: ${{ github.token }}
          name: m0-plan024-linux-product
          path: fixed-build/
      - name: H1628 frozen official original-Go Rust ISA-L product / exact SHA and zero build
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main && test "$(uname -m)" = x86_64
          test -c /dev/net/tun
          git fetch --quiet --depth=1 origin "$PRODUCT_SOURCE"
          test "$(git rev-parse FETCH_HEAD)" = "$PRODUCT_SOURCE"
          changed="$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0-plan028-mixed-normal-game-native.sh)"
          test -z "$changed" || { echo "H1628 PRODUCT_CHANGED_REFUSE_OLD_BINARIES: $changed" >&2; exit 1; }
          python3 - <<'PY'
          import os,hashlib,json,pathlib,struct
          p=pathlib.Path("fixed-build")
          m=json.loads((p/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["PRODUCT_SOURCE"]
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert m["rust_native_fec_acceleration"] is True
          assert m["isa_l_source"]=="c387163fcbca62701d646149564c550c78a4f985"
          assert m["binary_qualification"]=="BUILD_ONLY_NOT_PRODUCT"
          expected={
           "wbd-v4-client":"7f347ae9dc878edf508aa5fdeb8668ccae653682d01898435b69d42c94a555d1",
           "wbd-v4-server":"9188f3941eba3dfd48831f779e0d8b73d3b31deda4c1978a1f270e11d75dcc71",
           "libwbd_engine.so":"2947d148d325e198acd920c56803ad168175ba11590396478682693fcf5922dc"
          }
          for name,sha in expected.items():
              b=(p/name).read_bytes()
              assert len(b)>100000 and b[:4]==b"\x7fELF" and struct.unpack_from("<H",b,18)[0]==62,name
              assert hashlib.sha256(b).hexdigest()==m["sha256"][name]==sha,name
          print("H1628_SOURCE8A_ORIGINAL_GO_RUST_THREE_ACCELERATED_BINARY_SHA256_PASS",flush=True)
          PY
          chmod +x fixed-build/wbd-v4-client fixed-build/wbd-v4-server
          mkdir -p fixed-kernel-result
          bash -n tools/m0-plan028-mixed-normal-game-native.sh
      - name: One genuine x86/x86 original TLS443 Normal Auto + Game2 + Game4 FEC6 and exact Rust Stop
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 && test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          bash -n tools/m0-plan028-mixed-normal-game-native.sh
          python3 tools/m0-plan028-x86-normalfixed6-two-physical-handover-fixture.py "$RUNNER_TEMP/h1197-x86-normal-fixed6.sh"
          bash -n "$RUNNER_TEMP/h1197-x86-normal-fixed6.sh"
          bash "$RUNNER_TEMP/h1197-x86-normal-fixed6.sh" fixed-build \
            >fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log 2>&1 || {
              tail -210 fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log >&2
              exit 1
            }
          grep -Fq "M0_PLAN028_H1197_X86_NORMAL_FIXED6_REAL_PHYSICAL_TWO_REAUTH_PASS" fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log
          grep -Fq "M0_PLAN028_H1151_X86_ORIGINAL_TLS_ONE443_NORMAL_GAME2_GAME4_FEC6_48_REAL_UDP_EXACT_STOP_PASS" \
            fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["PRODUCT_SOURCE"] and m["rust_native_fec_acceleration"] is True
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62
              assert hashlib.sha256(b).hexdigest()==m["sha256"][name]
          n=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1197-normal-fixed6-two-source4.json").read_text())
          assert n["physical_source4_sequence"]==["10.25.0.4","10.25.0.9","10.25.0.4"]
          assert n["normal_fixed6_authenticated_generations"]==[1,2,3] and n["old_normal_exact_stops"]==[1,2]
          assert n["game4_generation_unchanged"] and n["game4_live_UDP_during_both"]==[80,80]
          assert n["normal_new_generation_udp"]==[16,16] and n["same_tunnel_IP"]
          assert n["outer_user_mtu"]==1460 and n["inner_mtu_new"]<n["inner_mtu_original"]
          assert n["sibling_game4_inner_mtu"]==1358
          p=json.loads(pathlib.Path("fixed-kernel-result/plan028-h1151-mixed-one443.json").read_text())
          assert p["server_port"]==443 and len(set(p["distinct_authenticated_client_ips"]))==3
          assert p["native_peers"]==["game2-off-ChaCha","game4-fixed6-AES256","normal-fixed6-AES128"]
          assert p["real_udp_echoes"]=={"game2":12,"game4":18,"normal":18}
          assert p["game2_stop_did_not_stop_game4_or_normal"] and p["shared_rust_tun_reader_final_stop"]
          print("M0_PLAN028_H1151_NATIVE_X86_ORIGINAL_ONE443_MIXED_COEXIST_REAL_48_UDP_SOURCE_SHA_PASS")
          PY
          cat fixed-kernel-result/plan028-h1151-mixed-one443.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-h1197-native-x86-normal-fixed6-two-physical-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/assembly.json
            fixed-kernel-result/plan028-h1151-protected-policy-unit.log
            fixed-kernel-result/plan028-h1151-mixed-normal-game-x86.log
            fixed-kernel-result/plan028-h1151-mixed-one443.json
            fixed-kernel-result/plan028-h1197-normal-fixed6-two-source4.json
            fixed-kernel-result/plan028-h1151-alice-tun.json
            fixed-kernel-result/plan028-h1151-bob-tun.json
            fixed-kernel-result/plan028-h1151-carol-tun.json
            fixed-kernel-result/plan028-h1151-server-tun.json
          if-no-files-found: warn
          retention-days: 14
