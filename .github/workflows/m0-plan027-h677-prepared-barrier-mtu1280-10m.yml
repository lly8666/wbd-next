name: M0 PLAN027 H677 one prepared receiver barrier original MTU1280 10Mbps truth
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h677-prepared-barrier-mtu1280-10m.yml]
permissions: {contents: read, actions: write}
jobs:
  one-true-original-prepared10m:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h677-prepared10m]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 6ece9eab653f46a716e8d3a0927fb74bec4819e8
      BUILD_RUN: "41226521824"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Only prebuilt authentic Go/Rust source, one distinct prepared-barrier 10M original scene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' > /dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py)"
          grep -q 'receiver_prepared.*PROFILE_TELEMETRY_BITMAP_SLAB_READY' tools/m0_wl_public_rate_app.py
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-b-normal-1280-mtu-10m-25ms-loss0-60s.json')
          assert s['public_mode']=='normal' and s['tun_mtu']==1280 and s['duration_s']==60
          for name in ('windows_to_linux','linux_to_windows'):
              d=s[name];assert d['offered_mbps']==10 and d['delay_ms']==25 and d['loss_pct']==0
          print('H677_UNCHANGED_ORIGINAL_10M_SCENE_DIFFERENT_BOUND_READY_HARNESS',s['scenario_sha256'])
          PY
          scene=scenarios/plan027-b-normal-1280-mtu-10m-25ms-loss0-60s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|normal|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id' | head -1)"
          if [ -n "$old" ];then echo "H677_ALREADY_DISPATCHED run=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo 'H677_ONE_PREPARED_RECEIVER_NATIVE_10M_DISPATCHED_NOT_PASS'
