name: M0 PLAN028 standard TLS native ARM64 two peers first-flight
run-name: PLAN028 ARM64 native TLS/no WB-R1 original Go Rust ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-tls-native-arm64.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-arm64-standard-tls:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Pin original Go+Rust and assemble one complete ARM64 SOURCE
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test ! -e r0/go_overlay/internal/realityfront/v4_route_prelude.go
          mkdir -p fixed-build fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path.cwd(); donor=root/"legacy"
          rec=json.loads((root/"fixed-kernel-result/assembly.json").read_text(encoding="utf-8"))
          assert rec["overlay_source"]==os.environ["GITHUB_SHA"]
          assert rec["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in (
                      "admission_v4_test.go","v4_tls_handshake_contract_test.go"):
                      continue
                  dst=donor/part/src.name
                  if dst.exists():
                      assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              p=root/"r0/go_overlay/internal/faketcp"/name
              dst=donor/"internal/faketcp"/name
              assert not dst.exists(),str(dst)
              dst.write_bytes(p.read_bytes())
          for role in ("client","server"):
              dest=donor/("cmd/wbd-v4-"+role)
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"main.go").write_bytes((root/("r0/go_overlay/cmd/wbd-v4-"+role+"/main.go")).read_bytes())
          assert not (donor/"internal/realityfront/v4_route_prelude.go").exists()
          print("M0_PLAN028_ARM64_NATIVE_TLS_EXACT_SOURCE_ASSEMBLED source="+os.environ["GITHUB_SHA"],flush=True)
          PY
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record >fixed-kernel-result/rust-build.log 2>&1 || {
            tail -110 fixed-kernel-result/rust-build.log >&2
            exit 1
          }
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^(TestPLAN028V4|TestFirefox120PersonaKeepsPresetAndRouteMarker)' ./internal/realityfront) >fixed-kernel-result/native-arm64-tls-go-unit.log 2>&1 || {
            tail -120 fixed-kernel-result/native-arm64-tls-go-unit.log >&2
            exit 1
          }
          for key in \
            TestPLAN028V4NoPreludeOriginalClientHelloFullCertificateAndSessionIDEpoch \
            TestPLAN028V4NoRouteKeyRejectsLocallyWithoutNetworkReadWrite \
            TestPLAN028V4WrongRouteKeyWrongCertAndWrongPasswordNoAdmission;do
            grep -Fq -- "--- PASS: $key" fixed-kernel-result/native-arm64-tls-go-unit.log
          done
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,struct
          root=pathlib.Path("fixed-build")
          assert platform.machine()=="aarch64"
          sha={}
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==183,name
              sha[name]=hashlib.sha256(b).hexdigest()
          m={"source_sha":os.environ["GITHUB_SHA"],"original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
             "architecture":"native_aarch64","go":"1.23.12","rust":"1.85.1",
             "sha256":sha,"qualification":"BUILD_AND_UNIT_ONLY_UNTIL_REAL_NATIVE_TCP_AUDIT"}
          (root/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print("M0_PLAN028_NATIVE_ARM64_ORIGINAL_GO_RUST_TLS_BUILD_UNIT_PASS",flush=True)
          PY
      - name: Single native ARM64 client plus native ARM64 server, real TCP reassembly and Rust UDP
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -c /dev/net/tun
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl tcpdump
          bash -n tools/m0-v4-public-real-linux-netns.sh
          WBD_V4_PUBLIC_MODE=normal WBD_V4_PUBLIC_AUTO_IP=1 WBD_V4_PUBLIC_WIRE_AUDIT=1 \
            bash tools/m0-v4-public-real-linux-netns.sh fixed-build >fixed-kernel-result/native-arm64-real-tcp-wire.log 2>&1 || {
              tail -145 fixed-kernel-result/native-arm64-real-tcp-wire.log >&2
              exit 1
            }
          grep -Fq 'M0_PLAN028_TLS_REAL_TCP_REASSEMBLED_CLIENTHELLO_NO_PRELUDE_PASS' fixed-kernel-result/native-arm64-real-tcp-wire.log
          grep -Fq 'M0_PLAN028_REAL_AUTO_LEASE_NATIVE_IP_BOUND_PASS' fixed-kernel-result/native-arm64-real-tcp-wire.log
          python3 - <<'PY'
          import json
          p="fixed-kernel-result/plan028-tls-wire-audit.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["result"]=="REAL_TCP_STREAM_TLS_FIRST_FLIGHT_PASS",d
          assert d["client_first_payload"]=="TLS_Handshake_ClientHello"
          assert d["server_first_payload"]=="TLS_Handshake_ServerHello"
          assert d["server_early_application_bytes"]==0
          assert d["session_id_length"]==32
          assert 43 in map(int,d["extension_types"])
          assert 51 in map(int,d["extension_types"])
          print("M0_PLAN028_NATIVE_ARM64_TLS_TWO_PEER_REAL_TCP_NO_PRIVATE_PRELUDE_PASS",flush=True)
          PY
          cat fixed-kernel-result/native-arm64-real-tcp-wire.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-native-arm64-real-tls-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/assembly.json
            fixed-kernel-result/native-arm64-tls-go-unit.log
            fixed-kernel-result/native-arm64-real-tcp-wire.log
            fixed-kernel-result/plan028-tls-wire-audit.json
            fixed-kernel-result/public-v4-normal-business.log
          if-no-files-found: warn
          retention-days: 14
