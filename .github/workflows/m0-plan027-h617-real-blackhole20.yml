name: M0 PLAN027 H617 one real 20s bidirectional carrier blackhole recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h617-real-blackhole20.yml]
permissions: {contents: read, actions: write}
jobs:
  dispatch-one:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h617-blackhole]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 80ee526cc7b466ec6ccbe3cc25caf2f3754996ef
      BUILD_RUN: "41190352345"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Start exactly one real native OS outage and recovery scenario
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-b-normal-blackhole20-recover-10m-25ms-0loss-60s.json')
          assert (s['public_mode'],s['lifecycle_blackhole_s'],s['duration_s'])==('normal',20,60)
          print('H617_BLACKHOLE_SCENARIO',s['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=normal -f run_n0=false \
            -f perf_scenario_file=scenarios/plan027-b-normal-blackhole20-recover-10m-25ms-0loss-60s.json \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H617_REAL_NATIVE_BLACKHOLE20_DISPATCHED_NOT_PASS
