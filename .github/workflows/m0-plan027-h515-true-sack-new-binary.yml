name: M0 PLAN027 H515 one new-source original negotiated SACK no-loss build
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h515-true-sack-new-binary.yml, crates/wbd-engine/src/v4_windows_native_runtime.rs]
permissions: {contents: read, actions: write}
jobs:
  one-source-true-win-linux-native:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message,'[plan027-h515-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Freeze exact H515 full original product for one source no-loss test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          python - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-c-normal-10m-25ms-loss0-60s.json')
          assert s['duration_s']==60 and s['public_mode']=='normal'
          assert all(s[d]['loss_pct']==0 and s[d]['offered_mbps']==10 for d in ('windows_to_linux','linux_to_windows'))
          print('H515_FROZEN_ORIGINAL_GO_SACK_WSL2_WIN_NATIVE_SOURCE',s['scenario_sha256'])
          PY
          gh workflow run m0-wl-public-normal-full.yml --ref main \
            -f public_mode=normal -f run_n0=false -f perf_ab=false \
            -f perf_scenario_file=scenarios/plan027-c-normal-10m-25ms-loss0-60s.json \
            -f perf_reuse_run_id="" -f perf_binary_source_sha=""
          echo H515_ONE_NEW_SOURCE_BUILD_AND_REAL_NATIVE_NOLOSS_ACTION
