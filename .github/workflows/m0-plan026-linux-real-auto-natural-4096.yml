name: M0 PLAN026 Linux original Auto natural 4096 source one-grade mature M2
run-name: "M0|PLAN026-LINUX-AUTO-NATURAL-4096|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan026-linux-real-auto-natural-4096.yml"
      - "tools/m0_plan026_linux_real_auto_natural_4096.py"
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  actual-original-tls-native-keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      # The real original Go/Rust binary SOURCE7e984 is the same frozen binary
      # that already PASSED genuine Linux Auto. Harness source is separate.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 40851521157
          name: m0-plan012-combined-40851521157-1
          github-token: ${{ github.token }}
          path: frozen/
      - name: Verify original TLS Rust product binary SHA and original netns fixture source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-auto-natural-result fixed-kernel-result
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('frozen')
          m=json.loads((root/'fixed-kernel-result/manifest.json').read_text())
          assert m['source_sha']=='7e9842f6e99769d9919e75a4b15da8d6d88e7257'
          assert m['original_go_sha']=='a7a82db31fe736ffedee330795a3234d358f1984'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for name,h in m['binaries_sha256'].items():
              p=root/'fixed-build'/name
              assert p.is_file() and sha(p)==h,(name,p)
          old='tools/m0-v4-public-real-linux-netns.sh'
          assert sha(pathlib.Path(old))==m['source_inputs_sha256'][old]
          print('M0_PLAN026_LINUX_IDLE_HEALTH_ORIGINAL_PRODUCT_BINARY_AND_FIXTURE_SOURCE_LOCKED_PASS')
          PY
          python3 tools/m0_plan026_linux_real_auto_natural_4096.py \
            tools/m0-v4-public-real-linux-netns.sh linux-auto-natural-result/natural4096-netns.sh
          chmod +x frozen/fixed-build/wbd-v4-client frozen/fixed-build/wbd-v4-server
      - name: Real original Go TLS Rust Auto 8192 firstsend, 30s 4096 maturity, applied one-grade down and Stop
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          WBD_V4_PUBLIC_MODE=fec-auto \
            bash linux-auto-natural-result/natural4096-netns.sh frozen/fixed-build \
            >linux-auto-natural-result/real-natural-auto.log 2>&1 || {
              tail -100 linux-auto-natural-result/real-natural-auto.log >&2
              echo 'M0_PLAN026_LINUX_AUTO_4096_NATURAL_M2_FAIL'
              exit 1
            }
          grep -Fq 'M0_PLAN026_LINUX_ORIGINAL_GO_RUST_AUTO_NATURAL_4096_30S_APPLIED_AND_STOP_PASS' \
            linux-auto-natural-result/real-natural-auto.log
          grep -Fq 'M0_PUBLIC_ORIGINAL_GO_V4_FEC2_APPLIED_REAL_AUTH_M2_GROUP_M4_TUN_STOP_PASS mode=fec-auto' \
            linux-auto-natural-result/real-natural-auto.log
          grep -Fq 'M0_PUBLIC_ORIGINAL_GO_V4_FEC2_REAL_GROUP_APP_FIRST_DELIVERY_PASS mode=fec-auto delivered=8192' \
            fixed-kernel-result/public-v4-normal-business.log
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          root=pathlib.Path('linux-auto-natural-result')
          log=root/'real-natural-auto.log'
          app=pathlib.Path('fixed-kernel-result/public-v4-normal-business.log')
          receipt={
             'source_product_sha':'7e9842f6e99769d9919e75a4b15da8d6d88e7257',
             'source_harness_sha':os.environ['GITHUB_SHA'],
             'github_run_id':int(os.environ['GITHUB_RUN_ID']),
             'actual_original_go_tls_rust_raw_tun':True,
             'actual_real_app_first_unique':8192,
             'real_native_m2_applied_revision_min':2,
             'real_native_original_both_stop':True,
             'auto_natural_30s_4096_source_one_step_down':'PASS_SCOPED',
             'actual_real_npf_windows':'NOT_RUN',
             'real_120s_auto_windows':'NOT_RUN',
             'physical':'NOT_RUN',
             'log_sha256':hashlib.sha256(log.read_bytes()).hexdigest(),
             'app_sha256':hashlib.sha256(app.read_bytes()).hexdigest()}
          (root/'result.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('M0_PLAN026_LINUX_AUTO_NATURAL_4096_REAL_GO_RUST_M2_APPLIED_PASS')
          PY
          cp fixed-kernel-result/public-v4-normal-business.log linux-auto-natural-result/real-app.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan026-linux-real-auto-natural-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            linux-auto-natural-result/result.json
            linux-auto-natural-result/real-natural-auto.log
            linux-auto-natural-result/real-app.log
          if-no-files-found: warn
          retention-days: 30
