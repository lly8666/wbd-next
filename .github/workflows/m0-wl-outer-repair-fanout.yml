name: M0 Windows outer-repair source-locked matrix fanout
on:
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-scoped:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[plan026-win-outer-repair-matrix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Source-attest original completed product artifacts and dispatch remaining independent one-scene Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ORIGINAL_SOURCE: ${{ github.event.workflow_run.head_sha }}
          ORIGINAL_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL_SOURCE"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$ORIGINAL_SOURCE" || { echo 'main moved, refuse source-ambiguous fanout'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$ORIGINAL_SOURCE" "$RUNNER_TEMP/artifacts"
          grep -Fx 'm0-plan024-linux-product' "$RUNNER_TEMP/artifacts"
          python - <<'PY'
          import json,pathlib
          cfg=json.loads(pathlib.Path('scenarios/wl-outer-repair-manifest.json').read_text())
          scenes=cfg['scenarios']
          assert len(scenes)==24 and len(set(scenes))==24
          assert 'scenarios/wl-outer-repair-50m-300ms-loss30-60s.json' in scenes
          for path in scenes:
              p=pathlib.Path(path)
              assert p.resolve().is_relative_to(pathlib.Path('scenarios').resolve())
              q=json.loads(p.read_text())
              assert q['scenario_id']==p.stem and q['duration_s']==60
          pathlib.Path('/tmp/wbd-scoped-scenarios').write_text('\n'.join(scenes)+'\n')
          PY
          # Initial parent already measured the first scenario. Every
          # dispatched workflow has ONE Windows native measurement job and
          # restores the EXACT signed product artifacts from ORIGINAL_RUN.
          while IFS= read -r scenario; do
            test "$scenario" = 'scenarios/wl-outer-repair-50m-300ms-loss30-60s.json' && continue
            gh workflow run m0-wl-public-normal-full.yml --ref main \
              -f public_mode=normal -f run_n0=false -f perf_ab=false \
              -f perf_scenario_file="$scenario" \
              -f perf_reuse_run_id="$ORIGINAL_RUN" \
              -f perf_binary_source_sha="$ORIGINAL_SOURCE"
            echo "WL_REPAIR_SCENARIO_DISPATCHED scenario=$scenario original_binary_source=$ORIGINAL_SOURCE"
          done < /tmp/wbd-scoped-scenarios
