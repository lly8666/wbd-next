name: M0 PLAN027 H614 independent Auto real Applied plus default long C100
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h614-auto-and-default-long.yml]
permissions: {contents: read, actions: write}
jobs:
  dispatch-independent:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h614-auto-long]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 80ee526cc7b466ec6ccbe3cc25caf2f3754996ef
      PRODUCT_BUILD_RUN: "41190352345"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Dispatch independent source-locked genuine real native scenarios
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$PRODUCT_BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$PRODUCT_BUILD_RUN/artifacts?per_page=100" | jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-c-normal-100m-product-tun2048-loss0-300s.json')
          assert (s['public_mode'],s['duration_s'])==('normal',300)
          assert 'linux_tun_txqlen_packets' not in s
          print('H614_DEFAULT_LONG_KERNEL_SCENE',s['scenario_sha256'])
          PY
          while IFS=' ' read -r mode scene; do
            if test "$scene" = "-";then scene="";fi
            title="M0-WIN-LINUX|$GITHUB_SHA|$mode|${scene:-no-scene}"
            exists="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" | jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id'|head -1)"
            if test -n "$exists";then echo "H614_ALREADY_DISPATCHED mode=$mode run=$exists";continue;fi
            gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_scenario_file="$scene" \
              -f perf_reuse_run_id="$PRODUCT_BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
            echo "H614_INDEPENDENT_DISPATCH mode=$mode scenario=${scene:-none} product_source=$PRODUCT_SOURCE"
          done <<'CASES'
          normal scenarios/plan027-c-normal-100m-product-tun2048-loss0-300s.json
          auto-adaptive -
          auto-revision -
          CASES
          echo H614_THREE_ACTIONS_SENT_NOT_PRODUCT_PROOF
