# PLAN-012 multi-block M0 original owner source-first / parity composition.
# Native functional only. Go TLS→kernel continuous Fixed and FEC product NOT_RUN.
name: M0 bounded multi-block Fixed original-owner native function
run-name: "M0|FIXED-STREAM-COMPOSE|${{ github.sha }}"
on:
  push:
    branches: [main]
    paths: [".github/workflows/m0-fixed-stream-functional.yml"]
permissions: {contents: read}
concurrency:
  group: m0-fixed-stream-function-${{ github.sha }}
  cancel-in-progress: false
jobs:
  function:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pinned toolchain, ordinary release ABI, source-locked multi-block and no HOL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixed-stream-result
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc +1.85.1 --version)" = "rustc 1.85.1 (4eb161250 2025-03-15)"
          cargo +1.85.1 build --release --locked -p wbd-engine             >fixed-stream-result/release-default-build.log 2>&1
          test -s target/release/libwbd_engine.so
          if nm -D target/release/libwbd_engine.so | grep -Eq ' wbd_m0_(embedded_go_|test_probe_|fec2_)'; then
            echo 'M0_FIXED_STREAM_DEFAULT_ABI_LEAK' >&2; exit 1
          fi
          cargo +1.85.1 test --release --locked -p wbd-engine --lib             m0_fixed_stream_ -- --test-threads=1 --nocapture             >fixed-stream-result/functional.log 2>&1 || {
              cat fixed-stream-result/functional.log
              exit 1
            }
          cat fixed-stream-result/functional.log
          grep -q 'test result: ok. 2 passed; 0 failed' fixed-stream-result/functional.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path("fixed-stream-result")
          sha=lambda q:hashlib.sha256(pathlib.Path(q).read_bytes()).hexdigest()
          files=["crates/wbd-engine/src/v4_fixed_stream.rs",
            "crates/wbd-engine/src/fec2_staged.rs",
            "crates/wbd-engine/src/runtime/fec2_owner.rs",
            "crates/wbd-codec/src/fec_v2.rs","crates/wbd-engine/src/lib.rs",
            ".github/workflows/m0-fixed-stream-functional.yml"]
          manifest={"schema_version":1,"source_sha":os.environ["GITHUB_SHA"],
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "role_id":"M0","task_id":"R0-M0-PLAN008-PRODUCT-VERTICAL-INTEGRATION-025",
            "rust":"1.85.1","type":"native_functional_not_network",
            "result":"PASS_SCOPED_MULTIBLOCK_SOURCE_FIRST_PARITY_QUANTUM_STOP",
            "source_inputs_sha256":{f:sha(f) for f in files},
            "default_release_abi":"NO_FEC_OR_GO_TEST_ABI",
            "release_binary_sha256":sha("target/release/libwbd_engine.so"),
            "functional_log_sha256":sha(p/"functional.log"),
            "real_go_tls_continuous_fec_fixed":"NOT_RUN",
            "independent_kernel_rs16_app_recovery":"NOT_RUN_FOR_THIS_SOURCE",
            "fec_fixed_product":"OFF","auto":"NOT_RUN","game":"NOT_RUN",
            "physical":"NOT_RUN"}
          (p/"receipt.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-fixed-stream-function-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixed-stream-result/
          if-no-files-found: warn
          retention-days: 21
