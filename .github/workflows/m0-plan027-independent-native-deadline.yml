name: M0 PLAN027 independent native Windows WSL2 deadline
on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "Exact native product workflow run id to watch"
        type: string
        required: true
      target_sha:
        description: "Exact native workflow HEAD SHA"
        type: string
        required: true
      target_job_limit:
        description: "Seconds from native job start, 720 for scoped Game; 1200 otherwise"
        type: string
        required: false
        default: "1200"
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-independent-native-deadline.yml]
permissions: {contents: read, actions: write}
jobs:
  watch-native:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-h576-arm-current]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_id || '41173614494' }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || 'd5e7e3eca7b4988419ca60e008f2644aea775629' }}
      JOB_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_job_limit || '1200' }}
    steps:
      - name: Cancel exact stale Windows native job from DIFFERENT Action
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_ID" =~ ^[1-9][0-9]{5,16}$ ]] || exit 2
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$JOB_LIMIT" =~ ^(720|1200)$ ]] || exit 2
          initial="$(gh api "repos/$GH_REPO/actions/runs/$TARGET_ID")"
          test "$(jq -r .head_sha <<<"$initial")" = "$TARGET_SHA"
          test "$(jq -r .event <<<"$initial")" = workflow_dispatch
          test "$(jq -r '.repository.full_name' <<<"$initial")" = "$GH_REPO"
          echo "M0_EXTERNAL_NATIVE_WATCH target=$TARGET_ID source=$TARGET_SHA"
          # GitHub's native job log is the primary first-failure output.
          # An artifact is supplementary: even a completed/cancelled job is read.
          recover_logs() {
            local reason="$1" job_id="$2" log="$RUNNER_TEMP/m0-native-$TARGET_ID.log"
            if [[ ! "$job_id" =~ ^[1-9][0-9]{5,16}$ ]]; then
              echo "M0_EXTERNAL_NATIVE_LOG_UNAVAILABLE target=$TARGET_ID reason=$reason detail=no_native_job"
              return 1
            fi
            local pattern='M0_PLAN027_GAME_DUE_FAULT|M0_PLAN026_GAME_NATIVE_FIRST_ERROR|M0_PLAN027_GAME_NATIVE_STOP_|M0_PLAN027_GAME_STOP_RESULT|M0_PLAN027_NATIVE_STOP_RESULT|WL_GAME_ORIGINAL_STOP_FAILURE|WL_GAME_FATAL_|WL_GAME_DUE_|WL_PUBLIC_REAL_MODE_(TIMEOUT|RESULT|PROCESS_EXIT)|WL_ORIGINAL_NATIVE_E2E_(BATCH_TIMEOUT|CHILD_EXIT)|WBD_WL_TRUE_PUBLIC_MODE_FAIL|WL_DIAG'
            for attempt in 1 2 3; do
              if timeout 25s gh api "repos/$GH_REPO/actions/jobs/$job_id/logs" >"$log" 2>/dev/null && test -s "$log"; then
                echo "M0_EXTERNAL_NATIVE_JOB_LOG_RECOVERED target=$TARGET_ID job=$job_id reason=$reason attempt=$attempt"
                echo "M0_EXTERNAL_NATIVE_FIRST_DIAGNOSTICS"
                grep -aE -m 5 "$pattern" "$log" | cut -c 1-440 || true
                echo "M0_EXTERNAL_NATIVE_LAST_DIAGNOSTICS"
                grep -aE "$pattern" "$log" | tail -n 60 | cut -c 1-440 || true
                if ! grep -aqE "$pattern" "$log"; then
                  echo "M0_EXTERNAL_NATIVE_LOG_NO_DIAGNOSTIC_MATCH target=$TARGET_ID job=$job_id (not_product_pass)"
                fi
                rm -f "$log"
                return 0
              fi
              rm -f "$log"
              if [ "$attempt" -lt 3 ]; then sleep 3; fi
            done
            echo "M0_EXTERNAL_NATIVE_LOG_UNAVAILABLE target=$TARGET_ID job=$job_id reason=$reason attempts=3 (not_product_pass)"
            return 1
          }
          native_job_id() {
            jq -r '.jobs[] | select(.name=="native-public-two-os") | .id' | head -n 1
          }
          completed_job_log_attempted=""
          for i in $(seq 1 53); do
            run="$(gh api "repos/$GH_REPO/actions/runs/$TARGET_ID")"
            status="$(jq -r .status <<<"$run")"
            if [ "$status" = completed ]; then
              jobs="$(gh api "repos/$GH_REPO/actions/runs/$TARGET_ID/jobs?per_page=100" || echo '{"jobs":[]}')"
              job_id="$(native_job_id <<<"$jobs")"
              recover_logs "run_completed_$(jq -r .conclusion <<<"$run")" "$job_id" || true
              echo "M0_EXTERNAL_NATIVE_DISARM target=$TARGET_ID conclusion=$(jq -r .conclusion <<<"$run") (not_product_pass)"
              exit 0
            fi
            jobs="$(gh api "repos/$GH_REPO/actions/runs/$TARGET_ID/jobs?per_page=100")"
            stage="$(jq -c '.jobs[] | select(.name=="native-public-two-os") | {id,status,started_at,launch_at:([.steps[]? | select(.name=="Launch actual WSL2 Linux and direct full public two-OS product") | .started_at] | first)}' <<<"$jobs" | head -1)"
            if [ -n "$stage" ]; then
              if [ "$(jq -r .status <<<"$stage")" = completed ]; then
                job_id="$(jq -r .id <<<"$stage")"
                if [ "$completed_job_log_attempted" != "$job_id" ]; then
                  if recover_logs "job_completed_before_run" "$job_id"; then
                    echo "M0_EXTERNAL_NATIVE_JOB_FINISHED target=$TARGET_ID (not_product_pass)"
                    exit 0
                  fi
                  completed_job_log_attempted="$job_id"
                fi
                # A job can finish while finalization/artifact cleanup keeps
                # its parent run in progress. Do not disarm on a transient
                # 404: the run-completed branch retries the same native log.
                echo "M0_EXTERNAL_NATIVE_JOB_LOG_WAIT_RUN_COMPLETION target=$TARGET_ID job=$job_id"
                sleep 30
                continue
              fi
              # Game's 720s budget begins with the ACTUAL native step,
              # not several minutes of prior verified driver/WSL2 setup.
              since="$(jq -r --arg limit "$JOB_LIMIT" 'if $limit=="720" then (.launch_at // .started_at // empty) else (.started_at // empty) end' <<<"$stage")"
              if [ -n "$since" ]; then
                seconds="$(($(date -u +%s)-$(date -u -d "$since" +%s)))"
                if [ "$seconds" -ge "$JOB_LIMIT" ]; then
                  echo "M0_EXTERNAL_NATIVE_TIMEOUT target=$TARGET_ID job_seconds=$seconds"
                  # Capture before cancel while the runner may still be live.
                  job_id="$(jq -r .id <<<"$stage")"
                  log_before=unavailable
                  if recover_logs "before_timeout_cancel" "$job_id"; then
                    log_before=recovered
                  fi
                  gh api -X POST "repos/$GH_REPO/actions/runs/$TARGET_ID/cancel" --silent || true
                  sleep 45
                  current="$(gh api "repos/$GH_REPO/actions/runs/$TARGET_ID" --jq .status)"
                  if [ "$current" != completed ]; then
                    echo "M0_EXTERNAL_NATIVE_FORCE_CANCEL target=$TARGET_ID"
                    gh api -X POST "repos/$GH_REPO/actions/runs/$TARGET_ID/force-cancel" --silent || true
                  fi
                  if [ "$log_before" != recovered ]; then
                    recover_logs "after_timeout_cancel" "$job_id" || true
                  fi
                  echo "M0_EXTERNAL_NATIVE_TIMEOUT_EXIT target=$TARGET_ID job=$job_id (not_product_pass)"
                  exit 0
                fi
              fi
            fi
            sleep 30
          done
          echo "M0_EXTERNAL_NATIVE_WATCH_WINDOW_EXHAUSTED target=$TARGET_ID" >&2
          exit 1
  recover-two-previous-stuck:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plan027-recover-stuck]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Conclude exact previously monitored SOURCE525 Game FEC runs
        shell: bash
        run: |
          set -euo pipefail
          for id in 41170807537 41170809210; do
            run="$(gh api "repos/$GH_REPO/actions/runs/$id")"
            sha="$(jq -r .head_sha <<<"$run")"
            event="$(jq -r .event <<<"$run")"
            status="$(jq -r .status <<<"$run")"
            test "$sha" = 3ab182fa6448241f139dcf7a8736c7479bd7d567
            test "$event" = workflow_dispatch
            if [ "$status" != completed ]; then
              echo "M0_EXACT_OLD_STUCK_FORCE_CANCEL id=$id old_status=$status"
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/force-cancel" --silent
            else
              echo "M0_EXACT_OLD_ALREADY_COMPLETED id=$id"
            fi
          done
          echo "M0_GAME_FEC_NOT_PASS_STUCK_JOBS_CLEANED"

