name: M0 dual Rust ACK3 exact candidate native core tests
on:
  push:
    branches: [experiment/m0-dual-rust-tcp]
    paths: ['.github/workflows/qa-m0-dual-tcp-ack3-unit.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8a6439bd0ec7b807957f35c978729cc86986e1f2
          persist-credentials: false
      - name: Native complete TCP core including default ACK2 and middle ACK3 timer and gap tests
        run: |
          test "$(git rev-parse HEAD)" = "8a6439bd0ec7b807957f35c978729cc86986e1f2"
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --lib v4_rust_tcp
