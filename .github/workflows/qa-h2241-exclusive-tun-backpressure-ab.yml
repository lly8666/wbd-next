name: 'H2241 test-only one-route kernel TUN feedback true 1pct A/B/A'
run-name: 'H2241 original-candidate-original source ${{ github.sha }}'
on:
  push:
    branches: ['feat/h2241-exclusive-tun-backpressure-ab']
    paths:
      - '.github/workflows/qa-h2241-exclusive-tun-backpressure-ab.yml'
      - 'tools/m0_h2241_exclusive_gate_ab.py'
      - 'tools/m0_h2234_local_netns.py'
      - 'tests/test_m0_h2241_exclusive_gate_ab.py'
      - 'crates/wbd-engine/src/v4_embedded_go.rs'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: h2241-exclusive-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: 'H2241 exact original owner and multi-lease HOL negative tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: H2241 source-locked exclusive route limit and no cross-route pause
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/m0_h2241_exclusive_gate_ab.py tools/m0_h2240_low_loss_timeline.py tools/m0_h2234_local_netns.py
          python3 -m unittest tests.test_m0_h2241_exclusive_gate_ab tests.test_m0_h2240_low_loss_timeline tests.test_m0_h2234_local_netns tests.test_m0_h2229_native_ack_unified -v
          python3 - <<'PY'
          from pathlib import Path
          s=Path('crates/wbd-engine/src/v4_embedded_go.rs').read_text()
          assert 'V4_PUBLIC_H2241_TUN_GATE_STOP' in s
          assert 'only_live_shared_tun_route_saturated' in s
          assert 'V4_PUBLIC_H2240_TUN_WINDOW' in s
          assert 'pressure_ticks<240' in s
          assert 'WBD_H2240_TUN_TIMELINE' in s
          assert 'read_ready_batch(router.generation' in s
          assert 'flush_shared_tun(&mut pending)' in s
          assert 'original_kernel_monotonic_ns()' in s
          print('H2241_STATIC_SINGLE_LEASE_ONLY_MULTI_ROUTE_BYPASS')
          PY
  genuine-x86:
    needs: static
    name: 'True original Go TLS/Rust GE1pct 4flow original-gate-original A/B/A'
    runs-on: ubuntu-24.04
    timeout-minutes: 41
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: x86_64
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: True kernel TUN/veth/router/BBR and exact original Go TLS/Rust build once
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            iproute2 iptables iperf3 iputils-ping ethtool tcpdump \
            autoconf automake libtool make gcc g++ nasm openssl
          bash tools/m0_plan029_linux_dual_native_build.sh >h2241-build.log 2>&1 ||
            { tail -n 140 h2241-build.log;exit 2; }
          # Separate routing-identity/anti-HOL unit test does not need the
          # native ISA-L artifact. The product build immediately above has
          # already built the real pinned original accelerated binary.
          cargo +1.85.1 test --locked -p wbd-engine --lib --features             m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record             m0_h2241_exclusive_reader_gate_refuses_cross_route_or_generation_hol -- --nocapture
      - name: Native real 4flow A/B/A end-to-end + source TUN pressure and kernel qdisc
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/m0_h2241_exclusive_gate_ab.py
          python3 - <<'PY'
          import json,os
          d=json.load(open('h2241-exclusive-gate/summary.json'))
          assert d['source_sha']==os.environ['GITHUB_SHA']
          assert d['run_id']==os.environ['GITHUB_RUN_ID']
          assert d['status']=='PASS_GENUINE_H2241_EXCLUSIVE_GATE_ABA_DIAGNOSTIC_NOT_PRODUCT_GAIN',d['status']
          assert d['server_owned_stop_verified']
          assert [p['true_tcp_streams'] for p in d['phases']]==[4,4,4]
          assert [p['test_only_exclusive_gate'] for p in d['phases']]==[False,True,False]
          assert [p['gate_stop']['status'] for p in d['phases']]==[
              'ORIGINAL_PRODUCT_NO_GATE_RECEIPT',
              'REAL_GENUINE_EXCLUSIVE_ORIGINAL_READER_GATE_STOP',
              'ORIGINAL_PRODUCT_NO_GATE_RECEIPT']
          assert len(d['direct_real_before_after'])==2
          assert all(p['case']['status']=='PASS_REAL_KERNEL_IPERF3_TCP'
                     and p['client_owned_stop']['status']=='REAL_RUST_OWNED_STOP'
                     and p['temporal_cause_receipt']['status']=='REAL_ORIGINAL_TUN200MS_AND_TX500MS_MONO_TICKS'
                     for p in d['phases'])
          assert d['not_product_optimization'] and d['immutable_no_hol_out_of_order_delivery']
          print('H2241_TRUE_NATIVE_EXCLUSIVE_ABA_DIAGNOSTIC_ONLY')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2241-exclusiveroute-pressure-ab-original-vs-candidate-source-locked
          path: |
            h2241-exclusive-gate/
            h2241-build.log
          retention-days: 10
          if-no-files-found: warn
