name: M0 old-new real-path same VM sequential comparison
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-old-new-paired-diagnostic.yml"
      - "tools/m0-pair-legacy-harness.py"
      - "tools/m0-pair-compare.py"
      - "tools/run-v4-tun-netns.sh"
      - "r0/go_overlay/internal/realityfront/bridge_v4_embedded_perf_linux_test.go"
permissions: {contents: read}
concurrency:
  group: m0-paired-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Compile unmodified pinned old product and new developer-gated original Rust owner binaries
        shell: bash
        env: {GOTOOLCHAIN: local, CGO_ENABLED: "1"}
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          mkdir -p paired-build
          (cd legacy && go build -trimpath -o "$GITHUB_WORKSPACE/paired-build/wbd-client" ./cmd/wbd-client)
          (cd legacy && go build -trimpath -o "$GITHUB_WORKSPACE/paired-build/wbd-server" ./cmd/wbd-server)
          rustup toolchain install 1.85.1 --profile minimal
          test "$(rustc --version)" = 'rustc 1.85.1 (4eb161250 2025-03-15)'
          cargo build --release --locked -p wbd-engine
          if nm -D target/release/libwbd_engine.so | grep -q ' wbd_m0_embedded_go_'; then exit 1; fi
          cargo build --release --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go
          cp target/release/libwbd_engine.so paired-build/libwbd_engine.so
          for file in admission_v4.go admission_v4_test.go bridge_v4_probe_linux.go bridge_v4_probe_linux_test.go bridge_v4_embedded_linux.go bridge_v4_embedded_linux_test.go bridge_v4_embedded_perf_linux_test.go; do
            cp "r0/go_overlay/internal/realityfront/$file" "legacy/internal/realityfront/$file"
          done
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          (cd legacy && go test -tags wbd_v4_native_probe,wbd_v4_embedded_go -c -o "$GITHUB_WORKSPACE/paired-build/owner-go.test" ./internal/realityfront)
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          binaries=["wbd-client","wbd-server","owner-go.test","libwbd_engine.so"]
          src=["tools/m0-pair-legacy-harness.py","tools/m0-pair-compare.py",
            "tools/run-v4-tun-netns.sh",
            "r0/go_overlay/internal/realityfront/bridge_v4_embedded_perf_linux_test.go",
            ".github/workflows/m0-old-new-paired-diagnostic.yml"]
          m={"source_sha":os.environ["GITHUB_SHA"],"new_source_sha":os.environ["GITHUB_SHA"],
            "legacy_source_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
            "run_id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "binaries_sha256":{n:sha("paired-build/"+n) for n in binaries},
            "source_inputs_sha256":{n:sha(n) for n in src},
            "legacy_product_unmodified":True,"production_features":0}
          pathlib.Path("paired-build/build-manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-paired-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: paired-build/
          retention-days: 30
          if-no-files-found: error
  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m0-paired-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: paired-build
      - name: Verify locked OLD and NEW artifacts, prepare only historical test harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paired-result/old paired-result/new native-probe-result
          # actions/download-artifact ZIP does not preserve original executable mode.
          # Restore modes for exact SHA-verified prebuilt binaries, never recompile here.
          chmod 0755 paired-build/wbd-client paired-build/wbd-server paired-build/owner-go.test
          cp paired-build/build-manifest.json paired-result/build-manifest.json
          cp paired-build/wbd-client paired-build/wbd-server paired-result/old/
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          m=json.load(open("paired-build/build-manifest.json"))
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert m["new_source_sha"]==os.environ["GITHUB_SHA"]
          assert m["run_id"]==os.environ["GITHUB_RUN_ID"] and m["attempt"]==os.environ["GITHUB_RUN_ATTEMPT"]
          for n,v in m["binaries_sha256"].items():assert h("paired-build/"+n)==v,n
          for n,v in m["source_inputs_sha256"].items():assert h(n)==v,n
          PY
          python3 tools/m0-pair-legacy-harness.py legacy paired-result/legacy-patch.json
      - name: Install real Linux TUN/veth/TPROXY utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables nftables tcpdump openssl
          test -c /dev/net/tun
          command -v tc
      - name: OLD then NEW separate clean namespaces one job fixed sample 10s warmup 60s
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          OLD_SHA=a7a82db31fe736ffedee330795a3234d358f1984
          export WBD_STRICT_ARTIFACT_DIR="$GITHUB_WORKSPACE/paired-result/old"
          export WBD_STRICT_MODE=normal WBD_STRICT_SCENARIO=lossless
          export WBD_STRICT_RATE_MBPS=10 WBD_STRICT_LANES=1
          export WBD_STRICT_FEC_PARITY=0 WBD_STRICT_FEC_SCREEN=1
          export WBD_STRICT_SEED=631 WBD_STRICT_TC="$(command -v tc)"
          export WBD_STRICT_CPU_PROFILE=0
          python3 - <<'PY'
          import json,os,pathlib,platform
          x={"order":["OLD_GO_PINNED_SOURCE","NEW_RUST_DEV_OWNER"],
             "run_id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],
             "old_runner":platform.node()+":"+platform.release(),
             "new_runner":platform.node()+":"+platform.release(),
             "old_job_id":os.environ["GITHUB_JOB"],"new_job_id":os.environ["GITHUB_JOB"],
             "scenario":"one_VM_order_old_then_new_fixed_10s_warmup_60s_measure",
             "legacy_source":"a7a82db31fe736ffedee330795a3234d358f1984",
             "new_source":os.environ["GITHUB_SHA"]}
          pathlib.Path("paired-result/runtime.json").write_text(json.dumps(x,indent=2)+"\n")
          PY
          OLD_BEGIN="$(python3 -c 'import time;print(time.monotonic_ns())')"
          set +e
          (cd legacy && sudo --preserve-env=WBD_STRICT_ARTIFACT_DIR,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_FEC_PARITY,WBD_STRICT_FEC_SCREEN,WBD_STRICT_SEED,WBD_STRICT_TC,WBD_STRICT_CPU_PROFILE \
            env GITHUB_WORKSPACE="$GITHUB_WORKSPACE/legacy" GITHUB_SHA="$OLD_SHA" \
            bash scripts/strict_weaknet_sample.sh) >paired-result/old-leg.log 2>&1
          OLD_RC=$?
          set -e
          OLD_END="$(python3 -c 'import time;print(time.monotonic_ns())')"
          tail -n 20 paired-result/old-leg.log
          if sudo ip netns list | grep -Eq '^(wbiz|wcli|wrtr|wsrv|wtgt)-'; then
            echo 'OLD_NAMESPACES_NOT_CLEAN_NO_SECOND_LEG' >&2; exit 1
          fi
          NEW_BEGIN="$(python3 -c 'import time;print(time.monotonic_ns())')"
          set +e
          WBD_M0_PERF_BASELINE=1 WBD_M0_PAIRED_OLD_NEW=1 \
            bash tools/run-v4-tun-netns.sh paired-build >paired-result/new-leg.log 2>&1
          NEW_RC=$?
          set -e
          NEW_END="$(python3 -c 'import time;print(time.monotonic_ns())')"
          tail -n 20 paired-result/new-leg.log
          if [[ -f native-probe-result/normal-off-dev-10mbps.json ]]; then
            cp native-probe-result/normal-off-dev-10mbps.json paired-result/new/
            python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("paired-result/new/normal-off-dev-10mbps.json")
          x=json.loads(p.read_text())
          x.update({"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],
                    "attempt":os.environ["GITHUB_RUN_ATTEMPT"]})
          p.write_text(json.dumps(x,indent=2)+"\n")
          PY
          fi
          python3 - "$OLD_BEGIN" "$OLD_END" "$NEW_BEGIN" "$NEW_END" "$OLD_RC" "$NEW_RC" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path("paired-result/runtime.json")
          x=json.loads(p.read_text())
          x.update(dict(zip(["old_start_monotonic_ns","old_end_monotonic_ns",
            "new_start_monotonic_ns","new_end_monotonic_ns","old_rc","new_rc"],
            map(int,sys.argv[1:]))))
          p.write_text(json.dumps(x,indent=2)+"\n")
          PY
          python3 tools/m0-pair-compare.py paired-result >paired-result/summary-log.json
          cat paired-result/summary-log.json
          test "$OLD_RC" = 0 && test "$NEW_RC" = 0
          python3 - <<'PY'
          import json
          x=json.load(open("paired-result/paired-summary.json"))
          assert x["same_job_verified"] and x["nonoverlap_verified"]
          assert x["result"]=="PAIRED_DIAGNOSTIC_ONLY_NOT_CAUSAL",x["result"]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-paired-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: paired-result/
          retention-days: 30
          if-no-files-found: warn
