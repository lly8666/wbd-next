          - {label: "aarch64-nat-bbr-rtt400-loss0-fec-1-rate540-cubic-BAAB", runner: ubuntu-24.04-arm, arch: aarch64, pair: nat-bbr, rtt: '400', loss: '0', profile: '-1', rate: '540', cc: cubic, inbox: '1024', order: BAAB}
          - {label: "aarch64-nat-bbr-rtt400-loss1-fec-1-rate540-cubic-ABBA", runner: ubuntu-24.04-arm, arch: aarch64, pair: nat-bbr, rtt: '400', loss: '1', profile: '-1', rate: '540', cc: cubic, inbox: '1024', order: ABBA}
          - {label: "aarch64-nat-bbr-rtt400-loss1-fec-1-rate540-cubic-BAAB", runner: ubuntu-24.04-arm, arch: aarch64, pair: nat-bbr, rtt: '400', loss: '1', profile: '-1', rate: '540', cc: cubic, inbox: '1024', order: BAAB}
          - {label: "aarch64-nat-bbr-rtt400-loss1-fec0-rate480-cubic-ABBA", runner: ubuntu-24.04-arm, arch: aarch64, pair: nat-bbr, rtt: '400', loss: '1', profile: '0', rate: '480', cc: cubic, inbox: '1024', order: ABBA}
          - {label: "aarch64-nat-bbr-rtt400-loss1-fec0-rate480-cubic-BAAB", runner: ubuntu-24.04-arm, arch: aarch64, pair: nat-bbr, rtt: '400', loss: '1', profile: '0', rate: '480', cc: cubic, inbox: '1024', order: BAAB}
          - {label: "aarch64-nat-bbr-rtt400-loss2-fec1-rate432-cubic-ABBA", runner: ubuntu-24.04-arm, arch: aarch64, pair: nat-bbr, rtt: '400', loss: '2', profile: '1', rate: '432', cc: cubic, inbox: '1024', order: ABBA}
          - {label: "aarch64-nat-bbr-rtt400-loss2-fec1-rate432-cubic-BAAB", runner: ubuntu-24.04-arm, arch: aarch64, pair: nat-bbr, rtt: '400', loss: '2', profile: '1', rate: '432', cc: cubic, inbox: '1024', order: BAAB}
