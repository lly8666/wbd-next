          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables iperf3 ethtool iputils-ping openssl
          mkdir -p h2435-download linux-plan029-public-bundle h2435-out
          name="h2435-product-$WBD_PLAN029_LINUX_EXPECTED_ARCH-$GITHUB_SHA"
          export ARTIFACT_NAME="$name"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false) | .id')
          test -n "$id"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir h2435-download
          tar -xzf h2435-download/h2435-product.tgz -C linux-plan029-public-bundle
          (cd linux-plan029-public-bundle && sha256sum -c SHA256SUMS)
          python3 - "$id" <<'PY'
          import json,os,pathlib,sys
          m=json.loads(pathlib.Path("linux-plan029-public-bundle/manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"] and m["architecture"]==os.environ["WBD_PLAN029_LINUX_EXPECTED_ARCH"]
          pathlib.Path("h2435-out/build-identity.json").write_text(json.dumps({"run":int(os.environ["GITHUB_RUN_ID"]),"artifact_id":int(sys.argv[1]),"manifest":m},indent=2)+"\n")
          PY
      - name: Actual same-origin single TCP architecture contrast
        shell: bash
        run: |
          mkdir -p h2435-out
          lscpu >h2435-out/lscpu.txt
          uname -a >h2435-out/uname.txt
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" H2432_ORDER="$H2432_ORDER" H2432_RATE="$H2432_RATE" H2434_PAIR="$H2434_PAIR" H2434_RTT="$H2434_RTT" H2434_LOSS="$H2434_LOSS" H2434_PROFILE="$H2434_PROFILE" H2434_ORIGIN_CC="$H2434_ORIGIN_CC" H2434_INBOX="$H2434_INBOX" H2421_OUT=h2435-out python3 -u tools/m0_h2435_architecture.py
      - name: Preserve readable evidence
        if: always()
        shell: bash
        run: |
          if test -d h2435-out;then
            sudo find h2435-out -type f -name install -delete
            sudo chown -R "$(id -u):$(id -g)" h2435-out
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2435-${{ matrix.label }}
          path: h2435-out/
          retention-days: 14
