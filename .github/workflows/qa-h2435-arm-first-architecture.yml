name: H2435 ARM-first architecture and CPU pressure
run-name: "H2435 ARM-first architecture | ${{ github.sha }}"
on:
  push:
    branches: ['experiment/m0-linux-tcp-splice']
    paths: ['.github/workflows/qa-h2435-arm-first-architecture.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Build actual original product once per ISA
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables iperf3 ethtool iputils-ping autoconf automake libtool make gcc g++ nasm openssl
          python3 -m py_compile tools/m0_h2435_architecture.py tools/m0_h2435_cpu.py tools/m0_h2434_tcp_source.py
          bash tools/m0_plan029_linux_dual_native_build.sh >h2435-build.log 2>&1 || { tail -n 150 h2435-build.log; exit 2; }
          cd linux-plan029-public-bundle
          sha256sum -c SHA256SUMS
          tar -czf ../h2435-product.tgz wbd-v4-client wbd-v4-server libwbd_engine.so SHA256SUMS manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2435-product-${{ matrix.arch }}-${{ github.sha }}
          path: h2435-product.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2435-build-log-${{ matrix.arch }}
          path: h2435-build.log
          retention-days: 14
  smoke:
    needs: build
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {label: "aarch64-nat-bbr-rtt400-loss0-fec-1-rate540-cubic-AB", runner: ubuntu-24.04-arm, arch: aarch64, pair: nat-bbr, rtt: '400', loss: '0', profile: '-1', rate: '540', cc: cubic, inbox: '1024', order: AB}
          - {label: "aarch64-cubic-bbr-rtt400-loss1-fec0-rate480-cubic-AB", runner: ubuntu-24.04-arm, arch: aarch64, pair: cubic-bbr, rtt: '400', loss: '1', profile: '0', rate: '480', cc: cubic, inbox: '1024', order: AB}
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
      H2432_ORDER: ${{ matrix.order }}
      H2432_RATE: ${{ matrix.rate }}
      H2434_PAIR: ${{ matrix.pair }}
      H2434_RTT: ${{ matrix.rtt }}
      H2434_LOSS: ${{ matrix.loss }}
      H2434_PROFILE: ${{ matrix.profile }}
      H2434_ORIGIN_CC: ${{ matrix.cc }}
      H2434_INBOX: ${{ matrix.inbox }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Retrieve same run exact SOURCE native bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables iperf3 ethtool iputils-ping openssl
          mkdir -p h2435-download linux-plan029-public-bundle h2435-out
          name="h2435-product-$WBD_PLAN029_LINUX_EXPECTED_ARCH-$GITHUB_SHA"
          export ARTIFACT_NAME="$name"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false) | .id')
          test -n "$id"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir h2435-download
          tar -xzf h2435-download/h2435-product.tgz -C linux-plan029-public-bundle
          (cd linux-plan029-public-bundle && sha256sum -c SHA256SUMS)
          python3 - "$id" <<'PY'
          import json,os,pathlib,sys
          m=json.loads(pathlib.Path("linux-plan029-public-bundle/manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"] and m["architecture"]==os.environ["WBD_PLAN029_LINUX_EXPECTED_ARCH"]
          pathlib.Path("h2435-out/build-identity.json").write_text(json.dumps({"run":int(os.environ["GITHUB_RUN_ID"]),"artifact_id":int(sys.argv[1]),"manifest":m},indent=2)+"\n")
          PY
      - name: Actual same-origin single TCP architecture contrast
        shell: bash
        run: |
          mkdir -p h2435-out
          lscpu >h2435-out/lscpu.txt
          uname -a >h2435-out/uname.txt
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" H2432_ORDER="$H2432_ORDER" H2432_RATE="$H2432_RATE" H2434_PAIR="$H2434_PAIR" H2434_RTT="$H2434_RTT" H2434_LOSS="$H2434_LOSS" H2434_PROFILE="$H2434_PROFILE" H2434_ORIGIN_CC="$H2434_ORIGIN_CC" H2434_INBOX="$H2434_INBOX" H2421_OUT=h2435-out python3 -u tools/m0_h2435_architecture.py
      - name: Preserve readable evidence
        if: always()
        shell: bash
        run: |
          if test -d h2435-out;then
            sudo find h2435-out -type f -name install -delete
            sudo chown -R "$(id -u):$(id -g)" h2435-out
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2435-${{ matrix.label }}
          path: h2435-out/
          retention-days: 14
  measure:
    needs: smoke
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
