name: M0 PLAN027 H780 Windows native runner exit and actual artifact delivery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-plan027-h780-gamefec-actions-path.yml
permissions:
  contents: read
jobs:
  original-runner-pid-and-evidence:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h780-actions-probe]')
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Run existing bounded original PID and blocked-output checks
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          & python -m unittest tests.test_m0_wl_native_step_runner -v
          if($LASTEXITCODE -ne 0){throw 'H780 existing original PID deadline tests failed'}
      - name: Exercise unmodified native runner as real Windows process and retain first fault
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force result/wl-public | Out-Null
          & python -u tools/m0_wl_gamefec_actions_probe.py result/wl-public
          if($LASTEXITCODE -ne 0){throw 'H780 original native runner did not exit with expected synthetic failure'}
          & gh api "repos/$env:GITHUB_REPOSITORY" --jq .full_name
          if($LASTEXITCODE -ne 0){throw 'H780 post-failure original Windows runner GitHub access unavailable'}
          'github_after_original_runner=PASS' | Add-Content result/wl-public/h780-actions-transport.txt
      - name: Upload original Windows local PID/first-fault evidence BEFORE any OS cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h780-windows-native-original-runner-artifact-not-product
          if-no-files-found: error
          retention-days: 14
          path: |
            result/wl-public/h780-actions-probe.json
            result/wl-public/h780-actions-transport.txt
            result/wl-public/h780-native-runner-stdout.txt
            result/wl-public/h780-original-direct-full.log
            result/wl-public/gamefec-supervisor-stack.txt
