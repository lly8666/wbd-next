# H1461: one exact patched x86 source build with original TLS443/ISA-L, and real 600 + 1800 five-user independent native Linux tests. No hosted Windows 1800.
name: M0 PLAN028 H1461 patched five-client genuine 600 and 1800 x86
run-name: PLAN028 H1461 source-locked 600s 75Mbps and 1800s heterogeneous five-user soak
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-h1461-fixed-five-client-600-1800.yml"
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Pin original Go+Rust and assemble one complete ARM64 SOURCE
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test ! -e r0/go_overlay/internal/realityfront/v4_route_prelude.go
          mkdir -p fixed-build fixed-kernel-result
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt fixed-kernel-result/assembly.json
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path.cwd(); donor=root/"legacy"
          rec=json.loads((root/"fixed-kernel-result/assembly.json").read_text(encoding="utf-8"))
          assert rec["overlay_source"]==os.environ["GITHUB_SHA"]
          assert rec["legacy_source"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          for part in ("internal/realityfront","internal/v4productcli"):
              for src in (root/"r0/go_overlay"/part).glob("*.go"):
                  if src.name.endswith("_test.go") and src.name not in (
                      "admission_v4_test.go","v4_tls_handshake_contract_test.go"):
                      continue
                  dst=donor/part/src.name
                  if dst.exists():
                      assert dst.read_bytes()==src.read_bytes(),str(src)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(src.read_bytes())
          for name in ("raw_detached_data_linux.go","raw_detached_data_linux_test.go"):
              p=root/"r0/go_overlay/internal/faketcp"/name
              dst=donor/"internal/faketcp"/name
              assert not dst.exists(),str(dst)
              dst.write_bytes(p.read_bytes())
          for role in ("client","server"):
              dest=donor/("cmd/wbd-v4-"+role)
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"main.go").write_bytes((root/("r0/go_overlay/cmd/wbd-v4-"+role+"/main.go")).read_bytes())
          assert not (donor/"internal/realityfront/v4_route_prelude.go").exists()
          print("M0_PLAN028_ARM64_NATIVE_TLS_EXACT_SOURCE_ASSEMBLED source="+os.environ["GITHUB_SHA"],flush=True)
          PY
          rustup toolchain install 1.85.1 --profile minimal
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          test "$(git -C isa-l rev-parse HEAD)" = c387163fcbca62701d646149564c550c78a4f985
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/h1461-x86-pinned-isal"
          export WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985
          (cd isa-l && ./autogen.sh && ./configure --prefix="$WBD_ISAL_PREFIX" --disable-shared --enable-static && make -j2 && make install) >fixed-kernel-result/isal-build.log 2>&1 || {
            tail -100 fixed-kernel-result/isal-build.log >&2
            exit 1
          }
          test -s "$WBD_ISAL_PREFIX/lib/libisal.a"
          nm -g "$WBD_ISAL_PREFIX/lib/libisal.a" | grep -Eq ' [TW] ec_encode_data$'
          echo "WBD_ISAL_PREFIX=$WBD_ISAL_PREFIX" >> "$GITHUB_ENV"
          echo "WBD_ISAL_SOURCE_SHA=$WBD_ISAL_SOURCE_SHA" >> "$GITHUB_ENV"
          cargo +1.85.1 build --locked --release -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration >fixed-kernel-result/rust-build.log 2>&1 || {
            tail -110 fixed-kernel-result/rust-build.log >&2
            exit 1
          }
          cp target/release/libwbd_engine.so fixed-build/
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-client" ./cmd/wbd-v4-client)
          (cd legacy && go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$GITHUB_WORKSPACE/fixed-build/wbd-v4-server" ./cmd/wbd-v4-server)
          (cd legacy && go test -count=1 -v -tags wbd_v4_embedded_go,wbd_v4_fec2_product -run '^TestPLAN028SharedNormalPerClientFECProtectedCapability$' ./internal/realityfront) >fixed-kernel-result/plan028-h1144-protected-policy-unit.log 2>&1 || {
            tail -120 fixed-kernel-result/plan028-h1144-protected-policy-unit.log >&2
            exit 1
          }
          grep -Fq -- "--- PASS: TestPLAN028SharedNormalPerClientFECProtectedCapability" fixed-kernel-result/plan028-h1144-protected-policy-unit.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,struct
          root=pathlib.Path("fixed-build")
          assert platform.machine()=="x86_64"
          sha={}
          for name in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/name).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62,name
              sha[name]=hashlib.sha256(b).hexdigest()
          m={"source_sha":os.environ["GITHUB_SHA"],"original_go_sha":"a7a82db31fe736ffedee330795a3234d358f1984",
             "architecture":"native_x86_64","go":"1.23.12","rust":"1.85.1",
             "sha256":sha,"qualification":"BUILD_ONLY_UNTIL_MIXED_NORMAL_ORIGINAL_TLS_NATIVE_REAL_IO",
             "native_fec_acceleration":True,"isa_l_source":"c387163fcbca62701d646149564c550c78a4f985",
             "isa_l_archive_sha256":hashlib.sha256(
                 (pathlib.Path(os.environ["WBD_ISAL_PREFIX"])/"lib/libisal.a").read_bytes()).hexdigest(),
             "rust_features":"m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration"}
          (root/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print("M0_PLAN028_H1144_NATIVE_ARM64_ORIGINAL_GO_RUST_TLS_BUILD_PASS",flush=True)
          PY
      - name: Preflight original native packet fixture/reporter and cosmetic record-byte counter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m0-plan028-h1259-five-client-recovery-netns.py tools/m0-plan028-h1274-30min-report.py tools/m0_plan028_h1461_five_client_soak_verdict.py
          python3 -m unittest -v tests.test_m0_plan028_h1461_fixed_600_1800
          for suite in m0_plan028_h1461_peak75_urgent_fifo_drain_without_larger_queue m0_plan028_shared_tun_full_a_keeps_b_and_bounded_drop m0_plan028_shared_tun_a_recovers_b_continuous_backlog_drain m0_plan028_shared_tun_precopy_4096_a_b_fair_age_bytes; do
            cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration --lib "$suite" -- --test-threads=1 --nocapture
          done
          echo H1461_FROZEN_RUST_URGENT_FIFO_8SLOT_AND_LEGACY_ISOLATION_TESTS_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1461-x86-one-patched-build-${{ github.sha }}
          path: fixed-build/
          retention-days: 7
  scene:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - seconds: 600
            scene: capacity75
          - seconds: 1800
            scene: heterogeneous
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: h1461-x86-one-patched-build-${{ github.sha }}
          path: fixed-build/
      - name: Verify exact patched SOURCE SHA and native x86 ELF62 binaries in BOTH independent jobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 && test -c /dev/net/tun
          chmod +x fixed-build/wbd-v4-client fixed-build/wbd-v4-server
          python3 - <<'PY_HASH'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"] and m["architecture"]=="native_x86_64"
          assert m["native_fec_acceleration"] is True
          assert m["isa_l_source"]=="c387163fcbca62701d646149564c550c78a4f985"
          assert len(m["isa_l_archive_sha256"])==64
          for name,digest in m["sha256"].items():
              b=(root/name).read_bytes()
              assert b[:4]==b"\x7fELF" and struct.unpack_from("<H",b,18)[0]==62
              assert hashlib.sha256(b).hexdigest()==digest
          print("H1274_ONE_ARM64_BUILD_MANIFEST_REUSED",flush=True)
          PY_HASH
      - name: Original real five authenticated clients exact 600s capacity or 1800s weaknet rotations + Stop
        shell: bash
        timeout-minutes: 44
        env:
          WBD_PLAN028_600S_SCENE: ${{ matrix.seconds == 600 && 'capacity75' || '' }}
          WBD_PLAN028_30M_SCENE: ${{ matrix.seconds == 1800 && 'heterogeneous' || '' }}
          WBD_PLAN028_STATIC_OWNED_NEIGH: "1"
          WBD_SHARED_TUN_ROUTE_DIAG: "1"
          WBD_PLAN028_QDISC_CLOCK_DIAG: "1"
          WBD_GAME_FEC_BACKEND: native
          TEST_SECONDS: ${{ matrix.seconds }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -p fixed-kernel-result
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl
          echo "H1461_REAL_ORIGINAL_FIVE_CLIENT_SOAK_BEGIN seconds=$TEST_SECONDS source=$GITHUB_SHA"
          python3 -u tools/m0-plan028-h1259-five-client-recovery-netns.py fixed-build \
            >fixed-kernel-result/h1461-soak.log 2>&1 || {
              echo "H1461_ORIGINAL_APP_OR_HOST_TEST_FAIL seconds=$TEST_SECONDS" >&2
              tail -180 fixed-kernel-result/h1461-soak.log >&2
              exit 1
            }
          if [[ "$TEST_SECONDS" == "600" ]]; then
            grep -Fq H1461_NATIVE_X86_FIVE_CLIENT_REAL_600S_CAPACITY75_COMPLETE fixed-kernel-result/h1461-soak.log
          else
            grep -Fq 'M0_H1274_NATIVE_ARM64_FIVE_CLIENT_1800S_DIAGNOSTIC_COMPLETE heterogeneous' fixed-kernel-result/h1461-soak.log
          fi
          python3 -u tools/m0_plan028_h1461_five_client_soak_verdict.py \
            --art fixed-kernel-result --duration "$TEST_SECONDS" \
            --source "$GITHUB_SHA" --wrapper "$GITHUB_SHA" \
            | tee fixed-kernel-result/h1461-verdict.log
          echo H1461_TRUE_FIVE_AUTH_CLIENTS_AND_OWNED_STOP_VERDICT_RECORDED
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1461-real-fiveclient-${{ matrix.seconds }}s-${{ matrix.scene }}-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/h1461-*.log
            fixed-kernel-result/h1274-*.log
            fixed-kernel-result/h1461-*.json
            fixed-kernel-result/h1274-*.json
            fixed-kernel-result/h1312-static-neighbour-*.json
            fixed-kernel-result/h1250-*.json
            fixed-kernel-result/h1250-*.txt
            fixed-kernel-result/h1250-product-*.log
          retention-days: 14
          if-no-files-found: warn
