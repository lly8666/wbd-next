name: ARM64 original Go client/server plus pinned ISA-L Rust owner
run-name: ARM64 public bundle ${{ github.sha }}
on:
  push:
    branches: [feature/arm64-linux-android-openwrt-autoaccel, experiment/network-matrix-tuning]
    paths:
      - 'tools/arm64_public_go_rust_bundle.sh'
      - 'r0/go_overlay/internal/realityfront/**'
      - 'r0/go_overlay/internal/v4productcli/**'
      - 'crates/wbd-engine/**'
      - 'crates/wbd-recovery/**'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-go-rust-bundle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 52
    env:
      GO_SOURCE: a7a82db31fe736ffedee330795a3234d358f1984
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', check-latest: false, cache: false}
      - name: Exact source native ARM64 original Go and Rust bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool make gcc
          test "$(go version | awk '{print $3}')" = go1.23.12
          bash tools/arm64_public_go_rust_bundle.sh
      - name: Verify product parity maximum row 0..19 on native ARM64
        if: github.ref_name == 'experiment/network-matrix-tuning'
        shell: bash
        run: |
          set -euo pipefail
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/wbd-isal-arm64-public"
          export WBD_ISAL_SOURCE_SHA="c387163fcbca62701d646149564c550c78a4f985"
          cargo +1.85.1 test --release --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            m0_public_fixed_maximum_all_20_rows_supported -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            m0_fec2_live_rx_same_turn_age_retirement_cannot_redeliver_k1 -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            m0_original_fec_tun_classifies_only_post_m4_ipv4_protocol -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            m0_fec2_kind3_full_mtu_repair_budget_invariant -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            m0_original_fixed_m2_continuous_clean_cohort_unknown_resets_without_forgery -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-recovery \
            r2_adaptive_authenticated_rtt_drives_pto_reorder_and_cache_without_unbounded_retry -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-recovery \
            r2_diagnostics_split_no_repair_one_repair_two_repair_retirement -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-recovery \
            r2_budget_first_repair_uses_hard_quota_before_pacer_retry_stays_paced -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-recovery \
            r2_quota_exhausted_abandons_repair_without_faking_attempt_or_ack_release -- --nocapture
          cargo +1.85.1 test --release --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            m0_original_repair_block_reason_classifier_is_stable -- --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-public-go-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-public-bundle/
          if-no-files-found: warn
          retention-days: 30

  native-mtu-boundary:
    needs: native-go-rust-bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arm64-public-go-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-public-bundle/
      - name: Cheap real MTU functional boundaries, not performance comparisons
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables
          failed=0
          for case in normal:1500:1500 fec-fixed:1500:1500 fec-auto:1500:1500 normal:1280:1280 fec-fixed:1280:1280 fec-auto:1280:1280 fec-fixed:1500:1280 game2:1500:1500 game4:1280:1280; do
            IFS=: read -r mode outer server_outer <<< "$case"
            if WBD_V4_MODE="$mode" WBD_ARM64_OUTER_MTU="$outer" WBD_ARM64_SERVER_OUTER_MTU="$server_outer" WBD_ARM64_MTU_BOUNDARY=1 bash tools/arm64_linux_netns_smoke.sh; then
              echo "MTU_MODE_PASS $case"
            else
              failed=1
            fi
            mv arm64-netns-result "arm64-mtu-$mode-$outer-$server_outer"
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-mtu-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-mtu-*/
          retention-days: 30

  native-linux-netns:
    if: github.ref_name != 'experiment/network-matrix-tuning'
    needs: native-go-rust-bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arm64-public-go-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-public-bundle/
      - name: Native ARM64 two-side original Go TLS / Rust raw-TUN, real app and Stop
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping openssl iptables
          bash tools/arm64_linux_netns_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-linux-netns-${{ github.run_id }}-${{ github.run_attempt }}
          path: arm64-netns-result/
          if-no-files-found: warn
          retention-days: 30
