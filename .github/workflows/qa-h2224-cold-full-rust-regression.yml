name: 'H2224 full Windows Rust owner Health regression after random cold M4'
on:
  push:
    branches: ['fix/h2224-native-cold-random-regression-test', main]
    paths:
      - 'crates/wbd-engine/src/v4_windows_native_runtime.rs'
      - 'crates/wbd-engine/src/v4_native_health.rs'
      - '.github/workflows/qa-h2224-cold-full-rust-regression.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  windows-rust-complete-lib:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Build exact pinned ISA-L native Windows library
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install nasm -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'NASM failed'}
          $nasm=@('C:\Program Files\NASM','C:\ProgramData\chocolatey\bin')|Where-Object {Test-Path (Join-Path $_ 'nasm.exe')}|Select-Object -First 1
          if(-not $nasm){throw 'NASM executable missing'}
          Add-Content -Path $env:GITHUB_PATH -Value $nasm
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          if($LASTEXITCODE -ne 0){throw 'ISA-L clone failed'}
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          if($LASTEXITCODE -ne 0){throw 'pinned ISA-L missing'}
          $vswhere='C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsroot=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath|Select-Object -First 1
          if(-not $vsroot){throw 'MSVC missing'}
          $vcvars=Join-Path $vsroot 'VC\Auxiliary\Build\vcvars64.bat'
          cmd.exe /d /s /c ('call "'+$vcvars+'" && cd isa-l && nmake /f Makefile.nmake')
          if($LASTEXITCODE -ne 0){throw 'MSVC ISA-L build failed'}
      - name: Full original Rust Windows owner lib + randomized cold compatibility test
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'Rust toolchain missing'}
          rustup target add x86_64-pc-windows-msvc --toolchain 1.85.1
          if($LASTEXITCODE -ne 0){throw 'Windows MSVC target missing'}
          $lib=Get-ChildItem isa-l -Recurse -Filter isa-l_static.lib -File|Select-Object -First 1
          if(-not $lib){throw 'ISA-L static library missing'}
          $env:WBD_ISAL_PREFIX=$lib.Directory.FullName
          $env:WBD_ISAL_SOURCE_SHA='c387163fcbca62701d646149564c550c78a4f985'
          $features='m0_v4_embedded_go,m0_v4_probe,fec2_product_record,native_fec_acceleration'
          cargo +1.85.1 test --locked -p wbd-engine --features $features --lib -- --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'Full Rust lib regression not PASS'}
          Write-Host 'H2224_WINDOWS_RUST_FULL_LIBRARY_PASS'
