name: 'M0 H2209 pinned original-Go ordinary TLS fallback Ubuntu'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m0-h2209-linux-decoy-unit.yml'
      - 'r0/go_overlay/assembly/manifest-plan020-m0.json'
      - 'r0/go_overlay/internal/realityfront/admission_v4.go'
      - 'r0/go_overlay/internal/realityfront/v4_fallback_test.go'
      - 'r0/go_overlay/internal/v4productcli/linux.go'
permissions: {contents: read}
jobs:
  original-go-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', cache: false}
      - name: Attest exact SOURCE and assemble once
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/prepare_windows_wiring.py --legacy-root legacy --output result
      - name: Original real TLS/FakeTCP same-association fallback and negative cases
        working-directory: legacy
        run: |
          set -euo pipefail
          go test -tags wbd_v4_embedded_go -count=1 -timeout 90s -run '^TestH2209' -v ./internal/realityfront
          echo H2209_LINUX_ORIGINAL_GO_FALLBACK_SCOPED_PASS


  h2210-linux-go-rust-cold-parser:
    # Scope: compile the current original-Go Linux product against the actual
    # SOURCE Rust ABI; run cold decoy and NAT CLI tests. NOT a raw NIC E2E.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.23.12', cache: false}
      - name: Verify one immutable Linux Go source and KDF package in manifest
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = a7a82db31fe736ffedee330795a3234d358f1984
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 r0/go_overlay/assembly/assemble.py --legacy-root legacy --overlay-root . --manifest r0/go_overlay/assembly/manifest-plan020-m0.json --receipt result/h2210-linux-assembly.json
          test -s legacy/internal/v4routekey/short.go
          test -s legacy/internal/v4routekey/cache.go
          (cd legacy && go test -count=1 -run '^TestH220[78]' -v ./internal/v4routekey)
      - name: Link actual native Rust engine and test Linux server decoy/unique NIC cold parser
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --release --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -lwbd_engine"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          (
            cd legacy
            go test -count=1 -timeout 90s -tags wbd_v4_embedded_go,wbd_v4_fec2_product \
              -run '^(TestH2209ServerDecoyColdValidation|TestH2206ServerNAT)' -v ./internal/v4productcli
            go build -trimpath -buildvcs=false -tags wbd_v4_embedded_go,wbd_v4_fec2_product -o "$RUNNER_TEMP/wbd-v4-server" ./cmd/wbd-v4-server
          )
          echo H2210_LINUX_NATIVE_GO_RUST_LINK_AND_DECOY_PARSE_PASS_SCOPE_ONLY_NOT_REAL_NIC
