name: PERF exact-source original Windows Linux and ARM64 client/server product E2E
run-name: "PERF-E2E-TRIGGER|${{ github.sha }}"
on:
  push:
    branches: ["perf/outer-rx-minimal-parse-20261121"]
    paths: [".github/workflows/perf-original-product-e2e-dispatch.yml"]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-exact-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      EXPECTED_SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Exact experiment branch not main, then launch 4 real product OS tests
        shell: bash
        run: |
          set -euo pipefail
          test "$BRANCH" = "perf/outer-rx-minimal-parse-20261121"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(gh api "repos/$GH_REPO/branches/$BRANCH" --jq '.commit.sha')" = "$EXPECTED_SOURCE"
          # Windows2025 signed Npcap/Wintun original Go client and actual
          # Linux WSL2 kernel original Go/Rust server, same frozen source.
          # Real 60s duplex UDP app, 25ms RTT legs, 0% injected loss.
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref "$BRANCH" \
            -f public_mode=normal -f run_n0=false -f outer_repair=off \
            -f perf_scenario_file=scenarios/plan027-h875-windows-normal-off-10m-25ms-loss0-60s.json
          echo "DISPATCHED Windows original client Linux WSL2 original server + duplex app; exact source=$EXPECTED_SOURCE"
          # H2223 Game READY integration: additionally verify same-source
          # signed Game4-FEC6 native end-to-end (not just unit READY).
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref "$BRANCH" \
            -f public_mode=game4-fec -f run_n0=false -f outer_repair=on
          echo "DISPATCHED signed Windows Game4 FEC6 native client ↔ Linux original server; exact source=$EXPECTED_SOURCE"
          # Both ARM64 original Go binary roles + Rust owner built fresh,
          # true separate Linux namespaces, authenticated TLS/TUN business.
          gh workflow run m0-plan028-tls-native-arm64.yml --repo "$GH_REPO" --ref "$BRANCH"
          echo "DISPATCHED ARM64 Linux native client + server TLS/TUN/normal app; exact source=$EXPECTED_SOURCE"
          # Additional ARM64 same-source real native UDP/Normal/off
          # handover with two physical Go TLS authentication cohorts.
          gh workflow run m0-plan028-arm64-normaloff-two-physical-handover.yml --repo "$GH_REPO" --ref "$BRANCH"
          echo "DISPATCHED ARM64 Linux native normal/off real UDP + reauth; exact source=$EXPECTED_SOURCE"
      - name: Publish dispatched job URLs when Actions index catches up
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            gh api "repos/$GH_REPO/actions/runs?branch=$BRANCH&per_page=60" \
              --jq '.workflow_runs[]|select(.event=="workflow_dispatch" and .head_sha=="'"${EXPECTED_SOURCE}"'")|[.name,.html_url,.status,.conclusion]|@tsv' \
              > /tmp/perf-e2e-runs.txt
            if [ "$(wc -l < /tmp/perf-e2e-runs.txt)" -ge 4 ];then break;fi
            sleep 4
          done
          cat /tmp/perf-e2e-runs.txt
          test "$(wc -l < /tmp/perf-e2e-runs.txt)" -ge 4
