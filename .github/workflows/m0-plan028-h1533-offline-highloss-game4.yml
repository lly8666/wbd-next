name: PLAN028 H1533 original Game4 loss30 offline diagnostic
run-name: "PLAN028 H1533 original 600s 303Mbps Game4 exact B M4 (no network)"
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-plan028-h1533-offline-highloss-game4.yml
permissions: {contents: read, actions: read}
jobs:
  only-old-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 42788212678
          github-token: ${{ github.token }}
          name: plan028-h1531-linux-loss30-real-native-600s-42788212678
          path: original/
      - name: Read genuine Dave game4 per lane hot proof from immutable original six-owner ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python3 - <<'PY'
          import json,pathlib,re
          art=pathlib.Path("original/fixed-kernel-result")
          plan=json.loads((art/"h1250-matrix-plan.json").read_text())
          full=json.loads((art/"h1461-six-hundred-report.json").read_text())
          strict=json.loads((art/"h1531-real-native-verdict.json").read_text())
          assert plan["source_sha"]==full["source_sha"]=="9b2605538d9e05af5b0c2a93bc7a7bc8495ed8da"
          assert plan["H1531_outer_600_profile"]=="outer300to350-loss30"
          cli=(art/"h1250-product-dave.log").read_text(errors="replace")
          srv=(art/"h1250-product-server.log").read_text(errors="replace")
          keys=("V4_PUBLIC_GAME_SINGLE_LANE_DUE","V4_PUBLIC_GAME_SINGLE_LANE_ROTATION_READY",
                "V4_PUBLIC_GAME_SINGLE_LANE_COLD_DEFERRED","V4_PUBLIC_GAME_SINGLE_LANE_READY")
          raw={k:{"client":[l[:460] for l in cli.splitlines() if k in l],
                  "server":[l[:460] for l in srv.splitlines() if k in l]} for k in keys}
          report={"scene":"loss30","old_action":42788212678,
                  "original_rotation":full["clients"]["dave"]["rotation"],
                  "original_alerts":[v for v in full["alerts"] if v.get("who")=="dave"],
                  "actual_outer_mbps":strict["real_full_outer_both_directions_mean_mbps"],
                  "all_six_final_stops":strict["all_six_stop"],"raw_events":raw}
          pathlib.Path("result/h1533-original-dave-game4.json").write_text(json.dumps(report,indent=2)+"\n")
          print("H1533_ORIGINAL_GAME4_ACTUAL_ROTATION "+json.dumps({
                  "report":report["original_rotation"],"alerts":report["original_alerts"],
                  "raw_counts":{k:{side:len(lines) for side,lines in v.items()} for k,v in raw.items()},
                  "band_mbps":report["actual_outer_mbps"]},sort_keys=True),flush=True)
          print("H1533_EXACT_CLIENT_SERVER_LANE_PORTS "+json.dumps({
            "client_hot":raw["V4_PUBLIC_GAME_SINGLE_LANE_ROTATION_READY"]["client"],
            "server_hot":raw["V4_PUBLIC_GAME_SINGLE_LANE_READY"]["server"],
            "client_due":raw["V4_PUBLIC_GAME_SINGLE_LANE_DUE"]["client"],
            "server_log_bytes":len(srv),"server_log_head":srv[:240],
            "client_log_bytes":len(cli),"client_log_head":cli[:240]},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1533-original-dave-loss30-${{ github.run_id }}
          path: result/
          retention-days: 30
          if-no-files-found: warn
