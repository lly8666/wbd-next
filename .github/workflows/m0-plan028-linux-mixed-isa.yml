name: M0 PLAN028 original Linux mixed ARM64/x86 real-netns functional
run-name: PLAN028 mixed ISA original TLS/Rust ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-linux-mixed-isa.yml"
      - "tools/m0-plan028-linux-mixed-isa-build.sh"
      - "tools/m0-plan028-linux-mixed-isa-netns.sh"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: m0-plan028-mixed-isa-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-locked-dual-ISA:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lly8666/wobuzhidao
          ref: a7a82db31fe736ffedee330795a3234d358f1984
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.23.12", check-latest: false, cache: false}
      - name: Exact current SOURCE original Go and Rust both Linux CPUs once
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-aarch64-linux-gnu libc6-arm64-cross
          bash -n tools/m0-plan028-linux-mixed-isa-build.sh
          bash -n tools/m0-plan028-linux-mixed-isa-netns.sh
          bash tools/m0-plan028-linux-mixed-isa-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-plan028-dual-isa-${{ github.run_id }}-${{ github.run_attempt }}
          path: mixed-isa-build/
          if-no-files-found: error
          retention-days: 14
  real-netns-cross-ISA:
    needs: source-locked-dual-ISA
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arm-role: [client, server]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m0-plan028-dual-isa-${{ github.run_id }}-${{ github.run_attempt }}
          path: mixed-isa-build/
      - name: Real Linux AF_PACKET TUN cross-ISA original TLS UDP Stop
        shell: bash
        env:
          WBD_PLAN028_MIXED_ARM_ROLE: ${{ matrix.arm-role }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-user-static libc6-arm64-cross iproute2 iptables iputils-ping openssl
          bash tools/m0-plan028-linux-mixed-isa-netns.sh | tee "mixed-isa-result-${WBD_PLAN028_MIXED_ARM_ROLE}.txt"
          grep -q "M0_PLAN028_CROSS_ISA_ORIGINAL_GO_RUST_REAL_NETNS_PASS arm_role=${WBD_PLAN028_MIXED_ARM_ROLE} packets=10 server_port=443 owned_stop=1 qemu_arm64=1" "mixed-isa-result-${WBD_PLAN028_MIXED_ARM_ROLE}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-mixed-${{ matrix.arm-role }}-${{ github.run_id }}
          path: |
            mixed-isa-result-${{ matrix.arm-role }}/
            mixed-isa-result-${{ matrix.arm-role }}.txt
          if-no-files-found: warn
          retention-days: 14
