name: M0 PLAN027 H707 one real WINDOWS Game2 FEC6 due ciphertext outer MTU boundary unit
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h705-gamefec-due-envelope-boundary.yml]
permissions: {contents: read}
jobs:
  one-frozen-due-envelope:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h707-windows-due-envelope]')
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One Windows-target original TLS/M3/GameFEC due parity and exact IPv4/TCP outer frame unit
        shell: pwsh
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'stale checkout'}
          if(-not (Select-String -Path 'crates/wbd-engine/src/v4_windows_game_owner.rs' -Pattern 'fn m0_plan027_game2_fec6_actual_due_ciphertext_outer_ipv4_mtu_envelope' -SimpleMatch)){throw 'missing exact GameFEC test'}
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          rustup target add x86_64-pc-windows-msvc --toolchain 1.85.1
          & cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_embedded_go,fec2_product_record --lib m0_plan027_game2_fec6_actual_due_ciphertext_outer_ipv4_mtu_envelope -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/h707-original-due-mtu.log"
          $rc=$LASTEXITCODE
          $proof=Get-Content "$env:RUNNER_TEMP/h707-original-due-mtu.log" -Raw
          if($proof -notmatch 'running 1 test'){throw 'WINDOWS_ORIGINAL_FEC_DUE_UNIT_DID_NOT_EXECUTE_ONE_TEST'}
          if($rc -ne 0){throw "H707_REAL_WINDOWS_TARGET_GAME_FEC_DUE_OUTER_FRAME_UNIT_FAIL rc=$rc"}
          Write-Output H707_REAL_WINDOWS_TARGET_GAMEFEC_DUE_SINGLE_UNIT_PASS_NOT_NATIVE_DRIVER_OR_STOP
