name: M0 PLAN027 H705 one Game2 FEC6 sealed due-record outer MTU boundary unit
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h705-gamefec-due-envelope-boundary.yml]
permissions: {contents: read}
jobs:
  one-frozen-due-envelope:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h706-due-envelope]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: One real Rust Game2 FEC6 parity sealed record and identical IPv4/TCP path MTU builder unit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q 'fn m0_plan027_game2_fec6_actual_due_ciphertext_outer_ipv4_mtu_envelope' crates/wbd-engine/src/v4_windows_game_owner.rs
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p wbd-engine --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record --lib m0_plan027_game2_fec6_actual_due_ciphertext_outer_ipv4_mtu_envelope -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/h706-fec-due-exact-unit.log"
          # Rust lib tests are namespaced. --exact with a bare final function
          # silently runs 0 tests; enforce genuine exactly-one-test output.
          grep -qx 'running 1 test' "$RUNNER_TEMP/h706-fec-due-exact-unit.log"
          echo H705_PRIVATE_SAME_M3_CIPHERTEXT_OUTER_WIRE_SCOPE_ONLY_NOT_LIVE_NPF
