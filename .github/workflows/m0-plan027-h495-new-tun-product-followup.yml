name: M0 PLAN027 H495 real source TUN2048 C100 gated followups
on:
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions: {contents: read, actions: write}
jobs:
  native-continuity:
    if: >-
      github.event.workflow_run.id == 41025962277 &&
      github.event.workflow_run.head_sha == '787ad4c900f3bae867c5c9556c4702339deef8cb' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Confirm fresh native product, original Linux TUN readback, C100 offered and Stop before other modes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          product='787ad4c900f3bae867c5c9556c4702339deef8cb'
          build_run=41025962277
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)" = "$product"
          gh api "repos/$GH_REPO/actions/runs/$build_run/artifacts" --paginate --jq '.artifacts[].name' > "$RUNNER_TEMP/proven"
          grep -Fx "m0-wl-windows-product-binaries-$product" "$RUNNER_TEMP/proven"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/proven"
          mkdir -p "$RUNNER_TEMP/c100"
          gh run download "$build_run" -R "$GH_REPO" --name m0-wl-full-public-normal-direct --dir "$RUNNER_TEMP/c100"
          python - <<'PY'
          import json,os,pathlib
          from tools.m0_wl_plan027_linux_tun_link import tun_queue_identity
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'c100'
          d=json.loads((p/'report.json').read_text())
          v=d['WL_V2']
          assert d.get('linux_binary_source')=='787ad4c900f3bae867c5c9556c4702339deef8cb'
          assert d['mode_public']=='PASS_ACTUAL_WINDOWS_LINUX_NATIVE_normal'
          assert d['stop']=='PASS_BOTH_OWNED' and v['owned_stop']=='PASS_BOTH_OWNED'
          assert v['status']=='MEASURED_BOTH_OS_KERNEL' and v['scenario_id']=='plan027-c-normal-100m-25ms-loss0-60s'
          for side in ('windows','linux'):
              assert v['offered_mbps'][side]>=95 and d['wl_n0_measured'][side]['invalid_packets']==0
          guest=tun_queue_identity(json.loads((p/'wl-v2-linux-tun-link-before.json').read_text()))
          assert guest is not None and guest['txqlen']==2048,guest
          server=(p/'mode-results'/'normal'/'server.log')
          if not server.exists():server=p/'server.log'
          logs=server.read_text(errors='replace')
          assert 'V4_PUBLIC_TUN_TXQLEN role=server interface=wbdwl4 packets=2048 readback=REAL_ORIGINAL_LINUX_TUN' in logs
          w=d['wl_n0_measured']['windows'];l=d['wl_n0_measured']['linux']
          missing={'windows':l['sent_packets']-w['received_first_packets'],
                   'linux':w['sent_packets']-l['received_first_packets']}
          assert min(missing.values())>=0
          print('H495_PRODUCT_NATIVE_C100_REAL_ORIGINAL_LINUX_TXQLEN2048',
                json.dumps({'missing_first':missing,'kernel_tun':d.get('linux_tun_link_kernel'),
                            'business_rtt':(w.get('business_udp_rtt'),l.get('business_udp_rtt'))},sort_keys=True))
          if any(missing.values()):
              print('H495_STRICT_ZERO_LOSS_C100_NOT_PROVED; preserve actual missing and continue independent FEC/Auto qualification')
          else:
              print('H495_STRICT_ZERO_LOSS_C100_PASSED_BOTH_FIRST')
          PY
          for entry in 'normal scenarios/plan027-c-normal-10m-25ms-loss0-60s.json' 'fixed scenarios/wl-outer-repair-fixed-10m-250ms-loss30-60s.json' 'auto scenarios/plan027-h461-auto-egress-10m-25ms-loss0-60s.json'; do
            read -r mode scene <<< "$entry"
            gh workflow run m0-wl-public-normal-full.yml --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_ab=false \
              -f perf_scenario_file="$scene" \
              -f perf_reuse_run_id="$build_run" -f perf_binary_source_sha="$product"
            echo "H495_INDEPENDENT_NATIVE_NEW_PRODUCT_SOURCE $mode $scene"
          done
