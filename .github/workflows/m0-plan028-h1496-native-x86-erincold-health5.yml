# H1496: H1492 original exact 30pct Erin had 12 post-client-Ready
# server B_UNPROVEN and >120s user blackout. Smallest Rust-only cold
# Health kind0 1->5 bounded retry; unchanged original Go ELF and wire.
# First deterministic L0, then ONE genuinely lossy x86 180s short trigger.
name: PLAN028 H1496 Rust cold client Health5 L0 and original native 30pct B
run-name: PLAN028 H1496 genuine x86 Erin30 server B auth Health bounded cold retry
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-h1496-native-x86-erincold-health5.yml"
permissions: {contents: read, actions: read}
jobs:
  one-native-original-go-rust-180s:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      ORIGINAL_GO_SOURCE: "57b0d0cded995cf26b6f8ea43a3d4588e6e61d27"
      WBD_PLAN028_FAST_SCENE: pressure
      WBD_PLAN028_FAST_CAPACITY_STEPS: "2"
      WBD_PLAN028_STATIC_OWNED_NEIGH: "1"
      WBD_PLAN028_QDISC_CLOCK_DIAG: "1"
      WBD_SHARED_TUN_ROUTE_DIAG: "1"
      WBD_GAME_FEC_BACKEND: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Exact OLD ORIGINAL Go executable SHA, build one patched native Rust M4, first run cold L0
        shell: bash
        timeout-minutes: 19
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 && test -c /dev/net/tun
          mkdir -p frozen fixed-build fixed-kernel-result
          curl -fsSL --retry 2 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lly8666/wbd-next/actions/artifacts/13679959152/zip \
            -o frozen/original-source57b-x86.zip
          python3 - <<'PY'
          import hashlib,json,zipfile,struct,os,pathlib
          src=pathlib.Path("frozen/original-source57b-x86.zip")
          assert hashlib.sha256(src.read_bytes()).hexdigest()=="1228dbeea002869c1a9f94fa17324174e330f1a758bb3236ad4552079a23778a"
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              m=json.loads(z.read("fixed-kernel-result/manifest.json"))
              assert m["source_sha"]==os.environ["ORIGINAL_GO_SOURCE"]
              assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
              assert m["toolchains"]=={"go":"1.23.12","rust":"1.85.1"}
              assert set(m["binary_sha256"])=={"wbd-v4-client","wbd-v4-server","libwbd_engine.so"}
              for n in ("wbd-v4-client","wbd-v4-server"):
                  b=z.read("fixed-build/"+n)
                  assert hashlib.sha256(b).hexdigest()==m["binary_sha256"][n]
                  assert b[:4]==b"\x7fELF" and struct.unpack_from("<H",b,18)[0]==62
                  path=pathlib.Path("fixed-build")/n
                  path.write_bytes(b);path.chmod(0o755)
              (pathlib.Path("fixed-build")/"frozen-original-go-manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print("H1496_PINNED_ORIGINAL_GO_CLIENT_AND_SERVER_ELF_SHA_CRC_PASS")
          PY
          rustup toolchain install 1.85.1 --profile minimal
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm autoconf automake libtool make gcc iproute2 iptables openssl
          git clone --quiet https://github.com/intel/isa-l.git isa-l
          git -C isa-l checkout --quiet c387163fcbca62701d646149564c550c78a4f985
          test "$(git -C isa-l rev-parse HEAD)" = c387163fcbca62701d646149564c550c78a4f985
          export WBD_ISAL_PREFIX="$RUNNER_TEMP/h1496-pinned-native-isal"
          export WBD_ISAL_SOURCE_SHA=c387163fcbca62701d646149564c550c78a4f985
          (cd isa-l && ./autogen.sh && ./configure --prefix="$WBD_ISAL_PREFIX" --disable-shared --enable-static && make -j2 && make install) >fixed-kernel-result/isal-build.log 2>&1 || {
            tail -80 fixed-kernel-result/isal-build.log >&2
            exit 1
          }
          test -s "$WBD_ISAL_PREFIX/lib/libisal.a"
          nm -g "$WBD_ISAL_PREFIX/lib/libisal.a" | grep -Eq ' [TW] ec_encode_data$'
          cargo +1.85.1 test --locked -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            --lib client_cold_m4_receiver_proof_is_bounded_five_existing_kind0 -- --test-threads=1 --nocapture \
            >fixed-kernel-result/h1496-cold-health-L0.log 2>&1 || {
              tail -130 fixed-kernel-result/h1496-cold-health-L0.log >&2
              exit 1
            }
          grep -Fq 'test v4_native_health::tests::client_cold_m4_receiver_proof_is_bounded_five_existing_kind0 ... ok' fixed-kernel-result/h1496-cold-health-L0.log
          echo H1496_ACTUAL_RUST_COLD_FIVE_KIND0_L0_TEST_PASS
          cargo +1.85.1 build --locked --release -p wbd-engine \
            --features m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record,native_fec_acceleration \
            >fixed-kernel-result/rust-native-build.log 2>&1 || {
              tail -110 fixed-kernel-result/rust-native-build.log >&2
              exit 1
            }
          cp target/release/libwbd_engine.so fixed-build/
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          p=pathlib.Path("fixed-build")
          prev=json.loads((p/"frozen-original-go-manifest.json").read_text())
          h=hashlib.sha256((p/"libwbd_engine.so").read_bytes()).hexdigest()
          b=(p/"libwbd_engine.so").read_bytes()
          assert b[:4]==b"\x7fELF" and struct.unpack_from("<H",b,18)[0]==62
          assert h!=prev["binary_sha256"]["libwbd_engine.so"]
          m={"candidate_source_sha":os.environ["GITHUB_SHA"],
             "original_go_product_source":prev["source_sha"],
             "original_go_client_server_sha256":{n:prev["binary_sha256"][n] for n in ("wbd-v4-client","wbd-v4-server")},
             "candidate_rust_engine_sha256":h,
             "one_source_only_rust_cold_health_kind0_budget_changed":True,
             "native_isa_l_source":"c387163fcbca62701d646149564c550c78a4f985",
             "native_both_ends":"x86_64"}
          (p/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print("H1496_FROZEN_ORIGINAL_GO_NEW_RUST_HEALTH5_NATIVE_X86_SHA_PASS")
          PY
          python3 -m py_compile tools/m0_plan028_h1467_fiveclient_ab_netns.py tools/m0_plan028_h1496_native_erincold_b_short_gate.py
      - name: ONE genuine native x86 both-end 5client 180s 30pct Erin cold TLS B with zero-damage Alice
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/fixed-build" GITHUB_SHA="$GITHUB_SHA" \
            python3 -u tools/m0_plan028_h1467_fiveclient_ab_netns.py fixed-build \
            >fixed-kernel-result/h1496-native-original.log 2>&1 || {
              tail -150 fixed-kernel-result/h1496-native-original.log >&2
              exit 1
            }
          grep -Fq 'M0_H1286_NATIVE_ARM64_FIVE_CLIENT_180S_DIAGNOSTIC_COMPLETE pressure' fixed-kernel-result/h1496-native-original.log
          python3 -u tools/m0_plan028_h1496_native_erincold_b_short_gate.py \
            --art fixed-kernel-result --source "$GITHUB_SHA" \
            --out fixed-kernel-result/h1496-original-gate.json \
            | tee fixed-kernel-result/h1496-original-gate.log
          echo H1496_REAL_NATIVE_30PCT_CLIENT_SERVER_B_AUTH_HEALTH5_SHORT_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan028-h1496-original-go-rust-30pct-health5-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-build/frozen-original-go-manifest.json
            fixed-kernel-result/h1496-*.json
            fixed-kernel-result/h1496-*.log
            fixed-kernel-result/h1286-rapid-report.json
            fixed-kernel-result/h1250-*.json
            fixed-kernel-result/h1250-*.txt
            fixed-kernel-result/h1250-product-*.log
          if-no-files-found: warn
          retention-days: 30
