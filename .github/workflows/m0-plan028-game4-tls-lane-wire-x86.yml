name: M0 PLAN028 original TLS Game4 eight real first-flights source locked x86
run-name: PLAN028 source-d7bd Game4 4+4 ClientHello and Rust Stop ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-plan028-game4-tls-lane-wire-x86.yml"
      - "tools/m0_plan028_tls_game_lane_wire_audit.py"
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  native-x86-game4-fec6-two-generations:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WBD_PLAN028_EXACT_BINARY_SOURCE: d7bd355389c1233c54eaa6a4553ebadcbe0eeb70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: lly8666/wbd-next
          run-id: 41694943009
          github-token: ${{ github.token }}
          name: m0-plan024-linux-product
          path: fixed-build/
      - name: Verify original H1071 x86 Go and Rust linked ELF SHA exactly, build none
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -p fixed-kernel-result
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("fixed-build")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert m["source_sha"]==os.environ["WBD_PLAN028_EXACT_BINARY_SOURCE"]
          assert m["original_go_sha"]=="a7a82db31fe736ffedee330795a3234d358f1984"
          assert m["go"]=="1.23.12" and m["rust"]=="1.85.1"
          for role in ("wbd-v4-client","wbd-v4-server","libwbd_engine.so"):
              b=(root/role).read_bytes()
              assert b[:4]==bytes.fromhex("7f454c46") and struct.unpack_from("<H",b,18)[0]==62
              assert hashlib.sha256(b).hexdigest()==m["sha256"][role],role
          print("M0_PLAN028_GAME4_FROZEN_GO_RUST_TLS_SOURCE_D7BD_SHA256_ELF_PASS",flush=True)
          PY
          chmod +x fixed-build/wbd-v4-client fixed-build/wbd-v4-server
          bash -n tools/m0-v4-public-real-linux-netns.sh
          python3 -m py_compile tools/m0_plan028_tls_game_lane_wire_audit.py
      - name: One real Linux x86 client+server Game4 FEC6 path switch eight genuine TLS first-flights
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables openssl tcpdump
          test -c /dev/net/tun
          WBD_V4_PUBLIC_MODE=game4 WBD_V4_PUBLIC_AUTO_IP=1 \
            WBD_V4_PUBLIC_PATH_SWITCH=1 WBD_V4_PUBLIC_GAME_FEC=fixed6 \
            WBD_V4_PUBLIC_WIRE_AUDIT=1 \
            bash tools/m0-v4-public-real-linux-netns.sh fixed-build \
            >fixed-kernel-result/plan028-game4-tls-eight-native.log 2>&1 || {
              tail -180 fixed-kernel-result/plan028-game4-tls-eight-native.log >&2
              exit 1
            }
          for marker in \
            M0_PLAN028_TLS_GAME4_EIGHT_REAL_TCP_CLIENTHELLOS_NO_PRELUDE_PASS \
            M0_PLAN028_GAME4_FEC6_EXACT_ONE_TUN_READER_STOP_AND_TWO_PARITY_COHORTS_NATIVE_PASS \
            M0_PLAN028_GAME4_SAME_INSTALLATION_LEASE_RETAINED_NATIVE_PASS \
            M0_PLAN028_REAL_LINUX_GAME4_NATIVE_RTN_NETLINK_OLD_STOP_NEW_AUTH_PASS \
            M0_PLAN028_REAL_NEW_PATH_MTU_READBACK_PASS;do
              grep -Fq "$marker" fixed-kernel-result/plan028-game4-tls-eight-native.log
          done
          python3 - <<'PY'
          import json
          d=json.load(open("fixed-kernel-result/plan028-game4-tls-wire-audit.json",encoding="utf-8"))
          assert d["result"]=="REAL_GAME4_TWO_GENERATIONS_8_CLIENTHELLO_NO_PRELUDE_PASS",d
          assert d["client_hello_sessions"]==8 and d["distinct_session_ids"]==8,d
          assert d["source_counts"]=={"10.25.0.2":4,"10.25.0.3":4},d
          assert all(row["session_id_bytes"]==32 and row["tcp_syn_and_synack"] and
                     row["first_client_data"]=="TLS_Handshake_ClientHello" and
                     row["first_server_data"]=="TLS_Handshake_ServerHello" and
                     row["server_early_data_bytes"]==0 for row in d["per_lane"])
          print("M0_PLAN028_ORIGINAL_GAME4_8_REAL_TLS_FIRST_FLIGHTS_TWO_OS_GENERATIONS_PASS")
          PY
          echo M0_PLAN028_GAME4_NATIVE_X86_SOURCE_D7BD_ORIGINAL_TLS_AND_APP_STOP_PASS frozen_binary=1 scenario=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0-plan028-game4-real-tls-eight-${{ github.run_id }}
          path: |
            fixed-build/manifest.json
            fixed-kernel-result/plan028-game4-tls-eight-native.log
            fixed-kernel-result/plan028-game4-tls-wire-audit.json
            fixed-kernel-result/plan028-real-path-switched-business.log
            fixed-kernel-result/public-v4-normal-business.log
            fixed-kernel-result/plan028-new-tun-mtu.json
            fixed-kernel-result/plan028-effective-new-physical-route.json
          if-no-files-found: warn
          retention-days: 14
