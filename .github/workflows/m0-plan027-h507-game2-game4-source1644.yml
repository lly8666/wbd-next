name: M0 PLAN027 H507 original Game2 Game4 true both-OS four independent scenes
on:
  workflow_run:
    workflows:
      - M0 Windows Linux original native whole-wiring capability and functional entry
    types: [completed]
permissions: {contents: read, actions: write}
jobs:
  original-game-mode-continuity:
    if: >-
      github.event.workflow_run.id == 41041996161 &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == '1644df34d241d487c5c5eb704a1a0a2e5f506f5e' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Exact H505 fresh native binaries then four independent Game modes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          build=41041996161
          src=1644df34d241d487c5c5eb704a1a0a2e5f506f5e
          test "$(gh api "repos/$GH_REPO/actions/runs/$build" --jq .head_sha)" = "$src"
          gh api "repos/$GH_REPO/actions/runs/$build/artifacts" --jq '.artifacts[].name' > "$RUNNER_TEMP/build-artifacts"
          grep -Fx "m0-wl-windows-product-binaries-$src" "$RUNNER_TEMP/build-artifacts"
          grep -Fx m0-plan024-linux-product "$RUNNER_TEMP/build-artifacts"
          python - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          pairs={
            'game2':'scenarios/plan027-b-game2-off-10m-75ms-loss5-20s.json',
            'game4':'scenarios/plan027-b-game4-off-10m-75ms-loss5-20s.json',
            'game2-fec':'scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json',
            'game4-fec':'scenarios/wl-game4-fixed6-10m-75ms-loss30-20s.json'
          }
          for mode,path in pairs.items():
              s=read_scenario(path)
              assert s['public_mode']==mode and s['duration_s']==20
              assert all(s[x]['offered_mbps']==10 for x in ('windows_to_linux','linux_to_windows'))
              print('H507_GAME_TRUE_SCENE',mode,path,s['scenario_sha256'])
          PY
          while read -r mode path; do
            gh workflow run m0-wl-public-normal-full.yml --ref main \
              -f public_mode="$mode" -f run_n0=false -f perf_ab=false \
              -f perf_scenario_file="$path" \
              -f perf_reuse_run_id="$build" -f perf_binary_source_sha="$src"
            echo "H507_NEW_BIN_INDEPENDENT_GAME $mode $path"
          done <<'EOF'
          game2 scenarios/plan027-b-game2-off-10m-75ms-loss5-20s.json
          game4 scenarios/plan027-b-game4-off-10m-75ms-loss5-20s.json
          game2-fec scenarios/wl-game2-fixed6-10m-75ms-loss15-20s.json
          game4-fec scenarios/wl-game4-fixed6-10m-75ms-loss30-20s.json
          EOF
