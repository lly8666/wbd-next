name: M0 PLAN027 H679 one new source original true two-OS Game2 fixed6 cold minimum
on:
  push:
    branches: [main]
    paths: [.github/workflows/m0-plan027-h679-current-original-game2-fec-minimum.yml]
permissions: {contents: read, actions: write}
jobs:
  one-game2-fec6-exact-current-source:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[plan027-h679-gamefec-cold]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCT_SOURCE: 6ece9eab653f46a716e8d3a0927fb74bec4819e8
      PREPARED_HARNESS_SOURCE: 92354d5a70f34640918f61b25859ba0bb05989dd
      BUILD_RUN: "41226521824"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Do not repeat old canceled source, exercise source6ece signed GameFEC original min once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$PRODUCT_SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" |
            jq -e '[.jobs[]|select(.name=="Windows Go production and test compilation only" or .name=="Build true original Go and new Linux Rust peer persona from same SOURCE")|.conclusion]|length==2 and all(.=="success")' >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" |
            jq -e --arg w "m0-wl-windows-product-binaries-$PRODUCT_SOURCE" '[.artifacts[]|select(.expired==false)|.name]|index($w)!=null and index("m0-plan024-linux-product")!=null' >/dev/null
          git fetch --depth=1 origin "$PREPARED_HARNESS_SOURCE"
          test -z "$(git diff --name-only "$PREPARED_HARNESS_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools scenarios)"
          git fetch --depth=1 origin "$PRODUCT_SOURCE"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE" "$GITHUB_SHA" -- crates r0/go_overlay Cargo.toml Cargo.lock tools/prepare_windows_wiring.py tools/m0_wl_netem.py tools/m0_wl_perf_v2_config.py tools/m0_wl_public_normal_e2e.py tools/m0_wl_public_modes_e2e.py)"
          python3 - <<'PY'
          from tools.m0_wl_perf_v2_config import read_scenario
          s=read_scenario('scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json')
          assert s['public_mode']=='game2-fec' and s['duration_s']==10 and s['tun_mtu']==1400
          for side in ('windows_to_linux','linux_to_windows'):
              d=s[side];assert d['offered_mbps']==1 and d['delay_ms']==25 and d['loss_pct']==0
          print("H679_FROZEN_CURRENT_SOURCE_TRUE_ORIGINAL_SIGNED_GAME2_FIXED6_SCENE",s['scenario_sha256'])
          PY
          scene=scenarios/plan027-b-game2-fec6-cold-minimum-1m-25ms-loss0-10s.json
          title="M0-WIN-LINUX|$GITHUB_SHA|game2-fec|$scene"
          old="$(gh api "repos/$GH_REPO/actions/workflows/m0-wl-public-normal-full.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg title "$title" '.workflow_runs[]|select(.display_title==$title)|.id' | head -1)"
          if [ -n "$old" ];then echo "H679_ALREADY_DISPATCHED action=$old";exit 0;fi
          gh workflow run m0-wl-public-normal-full.yml --repo "$GH_REPO" --ref main \
            -f public_mode=game2-fec -f run_n0=false -f perf_scenario_file="$scene" \
            -f perf_reuse_run_id="$BUILD_RUN" -f perf_binary_source_sha="$PRODUCT_SOURCE"
          echo H679_GAME2_FEC6_NEW_SOURCE6ECE_NATIVE_ORIGINAL_TWO_OS_DISPATCHED_NOT_PASS
