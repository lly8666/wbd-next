name: 'H2243 GE1pct aggregate bounded token-burst fq_codel original M4 A/B/C/A'
run-name: 'H2243 original-TBF16K-TBF48K-original source ${{ github.sha }}'
on:
  push:
    branches: ['feat/h2243-burst-fair-tun-m4']
    paths:
      - '.github/workflows/qa-h2243-burst-fair-tun-m4-abca.yml'
      - 'tools/m0_h2243_burst_fair_abca.py'
      - 'tools/m0_h2234_local_netns.py'
      - 'tests/test_m0_h2243_burst_fair_abca.py'
      - 'crates/wbd-engine/src/v4_embedded_go.rs'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: h2243-burst-fair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: 'H2243 strict source, bounded token burst + fair child and original no-HOL'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: H2243 source-locked nested real TBF/fq_codel and link stats negatives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/m0_h2243_burst_fair_abca.py tools/m0_h2240_low_loss_timeline.py tools/m0_h2234_local_netns.py
          python3 -m unittest tests.test_m0_h2243_burst_fair_abca tests.test_m0_h2241_exclusive_gate_ab tests.test_m0_h2240_low_loss_timeline tests.test_m0_h2234_local_netns tests.test_m0_h2229_native_ack_unified -v
          python3 - <<'PY'
          from pathlib import Path
          s=Path('crates/wbd-engine/src/v4_embedded_go.rs').read_text()
          assert 'V4_PUBLIC_H2241_TUN_GATE_STOP' in s
          assert 'only_live_shared_tun_route_saturated' in s
          assert 'V4_PUBLIC_H2240_TUN_WINDOW' in s
          assert 'pressure_ticks<240' in s
          assert 'WBD_H2240_TUN_TIMELINE' in s
          assert 'read_ready_batch(router.generation' in s
          assert 'flush_shared_tun(&mut pending)' in s
          assert 'original_kernel_monotonic_ns()' in s
          print('H2243_STATIC_SOURCE_AGGREGATE_TOKEN_BURST_FAIR_NO_HOL')
          PY
  genuine-native:
    needs: static
    name: 'Native ${{ matrix.arch }} original Go TLS/Rust GE1pct four-flow fair A/B/C/A'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            arch: x86_64
          - host: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.host }}
    timeout-minutes: 42
    env:
      WBD_PLAN029_LINUX_EXPECTED_ARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: True kernel TUN/veth/router/BBR and exact original Go TLS/Rust build once
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$WBD_PLAN029_LINUX_EXPECTED_ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            iproute2 iptables iperf3 iputils-ping ethtool tcpdump \
            autoconf automake libtool make gcc g++ nasm openssl
          bash tools/m0_plan029_linux_dual_native_build.sh >h2243-build.log 2>&1 ||
            { tail -n 140 h2243-build.log;exit 2; }
          # Separate routing-identity/anti-HOL unit test does not need the
          # native ISA-L artifact. The product build immediately above has
          # already built the real pinned original accelerated binary.
          cargo +1.85.1 test --locked -p wbd-engine --lib --features             m0_v4_probe,m0_v4_embedded_go,m0_fec2_owner_probe,fec2_product_record             m0_h2241_exclusive_reader_gate_refuses_cross_route_or_generation_hol -- --nocapture
      - name: Native real four-flow A/B/C/A source TBF burst16/48 fq_codel + actual three layer counters
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/m0_h2243_burst_fair_abca.py
          python3 - <<'PY'
          import json,os
          d=json.load(open('h2243-burst-fair-m4/summary.json'))
          assert d['source_sha']==os.environ['GITHUB_SHA']
          assert d['run_id']==os.environ['GITHUB_RUN_ID']
          assert d['status']=='PASS_GENUINE_H2243_TBF_FAIR_BURST_ABCA_DIAGNOSTIC_ONLY',d['status']
          assert d['server_owned_stop_verified']
          assert [p['true_tcp_streams'] for p in d['phases']]==[4,4,4,4]
          assert d['actual_arch']==os.uname().machine
          assert [p['test_only_tbf_burst_kib'] for p in d['phases']]==[0,16,48,0]
          assert all(p['original_reader_no_gate'] for p in d['phases'])
          assert [p['gate_stop']['status'] for p in d['phases']]==[
              'ORIGINAL_PRODUCT_NO_GATE_RECEIPT']*4
          assert [p['kernel_qdisc_and_driver_delta']['original_real_tun_ring_txqlen']
                  for p in d['phases']]==[2048]*4
          assert [p['kernel_qdisc_and_driver_delta']['parent_child_drops_may_overlap_not_additive']
                  for p in d['phases']]==[False,True,True,False]
          assert len(d['direct_real_before_after'])==3
          assert d['direct_real_before_after'][1]['status']=='FRESH_ORIGINAL_IPERF_SERVER_KERNEL_TCP'
          assert all(p['case']['status']=='PASS_REAL_KERNEL_IPERF3_TCP'
                     and p['client_owned_stop']['status']=='REAL_RUST_OWNED_STOP'
                     and p['temporal_cause_receipt']['status']=='REAL_ORIGINAL_TUN200MS_AND_TX500MS_MONO_TICKS'
                     for p in d['phases'])
          assert d['not_product_optimization'] and d['immutable_no_hol_out_of_order_delivery']
          print('H2243_TRUE_NATIVE_BURST_FAIR_BATCH_DIAG_ONLY')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2243-native-${{ matrix.arch }}-fair-chain-1pct-source-locked
          path: |
            h2243-burst-fair-m4/
            h2243-build.log
          retention-days: 10
          if-no-files-found: warn
